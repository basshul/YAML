<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maestro Web Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Maestro Web Runner</h1>
    <span class="tag">데모</span>
    <span id="connState" class="conn">연결 중…</span>
    <nav class="topnav">
      <a href="/" class="on">실행 화면</a>
      <a href="/history.html">실행 이력</a>
    </nav>
  </header>

  <main>
    <div class="col col-left">
      <section class="panel envpanel">
        <h2>실행 환경</h2>

        <div class="field">
          <label>서버</label>
          <div id="serverChoices" class="choices"></div>
          <p id="liveWarn" class="warn hidden">
            운영(Live)은 <strong>실서비스·실자금</strong>입니다. 의도한 실행인지 확인하세요.
          </p>
        </div>

        <div class="field">
          <label for="deviceSel">기기</label>
          <div class="row">
            <select id="deviceSel"></select>
            <button id="refreshDevices" class="ghost" type="button">새로고침</button>
          </div>
        </div>

        <div class="field">
          <label>플랫폼</label>
          <div class="choices">
            <label class="choice"><input type="radio" name="platform" value="android" checked> Android</label>
            <label class="choice disabled"><input type="radio" name="platform" value="ios" disabled data-always-disabled="1"> iOS <span class="muted">(준비 중)</span></label>
          </div>
        </div>
      </section>

      <section class="panel grow">
        <h2>
          테스트 선택
          <span class="spacer"></span>
          <button id="clearSel" class="ghost small" type="button">전체 해제</button>
        </h2>
        <div id="testList" class="testlist">불러오는 중…</div>
      </section>
    </div>

    <div class="col col-right">
      <section class="panel runbar">
        <div id="selInfo" class="selinfo">선택된 테스트 없음</div>
        <button id="stopBtn" class="danger hidden" type="button">중단</button>
        <button id="runBtn" class="primary" type="button" disabled>실행</button>
      </section>

      <section id="summary" class="panel summary hidden"></section>

      <section class="panel grow progpanel">
        <h2>진행 상황 <span class="spacer"></span><span id="logMeta" class="muted"></span></h2>

        <div id="progBarWrap" class="barwrap hidden">
          <div id="progBar" class="bar"></div>
        </div>

        <div id="progList" class="proglist">
          <p class="muted">테스트를 고르고 실행하면 진행 상황이 여기에 표시됩니다.</p>
        </div>

        <details class="logbox">
          <summary>자세한 로그 보기</summary>
          <pre id="log" class="log"></pre>
        </details>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
