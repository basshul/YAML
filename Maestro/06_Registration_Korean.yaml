# ----------------------------------------------------------------
- tapOn: "${REG_SURNAME}"
- waitForAnimationToEnd
- inputText: "LEE"
- waitForAnimationToEnd
- takeScreenshot: "[17]_SurName_입력"

# ----------------------------------------------------------------
