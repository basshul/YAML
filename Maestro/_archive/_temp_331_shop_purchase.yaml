appId: com.gmeremit.online.gmeremittance_native.livetest
---
# 앱 실행 및 홈 진입
- launchApp
- runFlow:
    when:
      visible:
        text: "로그인 세션이 만료되었습니다."
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      notVisible:
        text: "Home"
    commands:
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
- extendedWaitUntil:
    visible:
      text: "카드"
    timeout: 30000

# 카드 탭 진입 후 충전/환불/쇼핑 바텀시트 오픈
- tapOn:
    text: "카드"
    index: 0
- extendedWaitUntil:
    visible:
      text: "GME 카드"
    timeout: 10000
- tapOn:
    id: "uparrow"
- extendedWaitUntil:
    visible:
      text: "쇼핑"
    timeout: 5000
- tapOn: "쇼핑"
- waitForAnimationToEnd
- assertVisible:
    text: "GME Shop"

# ----------------------------------------------------------------
# [33-1] [High] GME Shop_Wallet - 간편비밀번호 일치/불일치 시 구매동작 확인
# ----------------------------------------------------------------
- tapOn: "편의점 쿠폰"
- waitForAnimationToEnd
- tapOn:
    point: "27%, 41%"
- waitForAnimationToEnd
- assertVisible:
    text: "결제"
- assertVisible:
    text: "리워드 포인트 사용"
- assertVisible:
    text: "GME Pay 잔액.*"
- scroll
- assertVisible:
    text: "총 결제 금액"
- tapOn: "구매하기"
- waitForAnimationToEnd
- assertVisible:
    text: "간편 비밀번호를 입력하세요"
# 불일치: PIN 9876 입력
- tapOn: "9"
- tapOn: "8"
- tapOn: "7"
- tapOn: "6"
- waitForAnimationToEnd
- assertVisible:
    text: "비밀번호가 맞지 않습니다.*"
# 일치: PIN 1212 입력
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
- waitForAnimationToEnd
- assertVisible: "성공"
- assertVisible:
    text: ".*CU 3,000 원.*"
- tapOn: "확인"
- waitForAnimationToEnd
- assertVisible:
    text: "만료 날짜"

# ----------------------------------------------------------------
# [사후 처리] 방금 구매한 쿠폰 취소 → GME Pay 잔액 환불 (반복 실행 시 잔액 소진 방지)
# ----------------------------------------------------------------
- tapOn: "취소"
- waitForAnimationToEnd
- assertVisible:
    text: "기프트 카드를 취소하시겠습니까?"
- tapOn: "예"
- waitForAnimationToEnd
- assertVisible:
    text: "간편 비밀번호를 입력하세요"
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
- waitForAnimationToEnd
- assertVisible: "성공"
- assertVisible:
    text: "취소가 완료되었습니다."
- tapOn: "확인"
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
