# ================================================================
# [01] 수취인 추가 → 수정
# ================================================================

# 수취인 추가하기
- tapOn: "수취인 추가하기"

# 국가: Sri Lanka
- tapOn:
    id: "recieverCountrySelectionFormInputField"
- tapOn:
    id: "searchEditText"
- inputText: "Sri Lanka"
- tapOn:
    text: "Sri Lanka"
    index: 1

# 은행: COMMERCIAL BANK
- tapOn:
    id: "recieverBankSelectionFormInputField"
- tapOn:
    id: "searchEditText"
- inputText: "COMMERCIAL"
- tapOn: "COMMERCIAL BANK"

# 계좌번호
- tapOn:
    id: "recieverAccountNoFormInputField"
- inputText: "1234567890"
- hideKeyboard

# 이름 (First: TEST / Last: GME)
- tapOn:
    id: "recieverFirstNameFormInputField"
- inputText: "TEST"
- hideKeyboard
- tapOn:
    id: "recieverLastNameFormInputField"
- inputText: "GME"
- hideKeyboard

# 핸드폰 번호
- tapOn:
    id: "recieverMobileNoFormInputField"
- inputText: "1234567890"
- hideKeyboard

# 주소
- tapOn:
    id: "recieverAddressFormInputField"
- inputText: "TEST"
- hideKeyboard

# 구역
- tapOn:
    id: "recieverCityFormInputField"
- inputText: "TEST"
- hideKeyboard

# 관계: 친구
- tapOn:
    id: "recieverRelationSelectionFormInputField"
- tapOn: "친구"

# 송금 사유: 급여 / 임금
- swipe:
    direction: UP
    element:
      id: "scrollView"
    duration: 1200
- extendedWaitUntil:
    visible:
      id: "recieverTransferReasonSelectionFormInputField"
    timeout: 10000
- tapOn:
    id: "recieverTransferReasonSelectionFormInputField"
- tapOn: "급여 / 임금"

# 제출
- tapOn:
    id: "btn_submit"

# 중복 수취인 오류 처리 (TEST GME 이미 존재 시 팝업 닫고 뒤로)
- runFlow:
    when:
      visible:
        text: "오류"
    commands:
      - tapOn: "확인"
      - pressKey: back

# 저장 성공 바텀시트: 아니요 (목록 복귀)
- runFlow:
    when:
      visible:
        id: "btnContactSupport1"
    commands:
      - tapOn:
          id: "btnContactSupport1"

# 수취인 목록 복귀 확인
- extendedWaitUntil:
    visible:
      text: "수취인을 선택하세요."
    timeout: 10000
- assertVisible:
    text: "TEST GME"

# 수취인 수정: First Name TEST → TESTUPDATE 변경 시도
- tapOn:
    id: "moreIcon"
    index: 0
- tapOn:
    id: "edit"
    index: 0

# First Name: TEST → TESTUPDATE (Last Name 탭 → First Name 재탭으로 커서 끝 이동)
- tapOn:
    id: "recieverLastNameFormInputField"
- tapOn:
    id: "recieverFirstNameFormInputField"
- eraseText: 4
- inputText: "TESTUPDATE"
- hideKeyboard

# 스크롤 후 제출
- swipe:
    direction: UP
    element:
      id: "scrollView"
    duration: 1200
- swipe:
    direction: UP
    element:
      id: "scrollView"
    duration: 1200
- tapOn:
    id: "btn_submit"

# 저장 성공 바텀시트: 아니요 → 이름 변경 취소(revert)되어 "TEST GME"로 복귀
- tapOn:
    id: "btnContactSupport1"



