appId: com.gmeremit.online.gmeremittance_native.livetest
---
# ================================================================
# 시나리오: Overseas Transfer - 수취인 추가 / 수정 / 삭제
# [01] [High] 수취인 추가 → 수정 → 삭제
# [02] [High] 수취인 추가 후 GME Wallet 송금 (PIN 오류 2323 → 정상 1212)
# [03] [Medium] 실시간 송금 탭 - 수취인 화면 필터(설정) 동작 확인
# [04] [High]   실시간 송금 탭 - 수취인 추가 동작 확인 (Send Now)
# ================================================================

# 앱 실행 및 홈 화면 진입
# 주의(2026-08-03): 기존 가드 `"Server Override|4자리 숫자를 입력하세요|홈"`은 launchApp 직후
#   잠깐 보이는 **캐시된 홈**에 먼저 매칭돼 PIN 입력 블록을 통째로 건너뛰었음 → 이후 실제
#   잠금화면이 떠서 "해외송금" 탭이 실패. 04_Menu_History.yaml의 검증된 패턴대로 잠금화면을
#   **명시적으로** 기다렸다가 PIN을 넣도록 변경. PIN 키패드는 매번 랜덤 배치라 좌표가 아닌
#   text("1"/"2")로 탭. PIN 1212.
- launchApp
# Server Override(livetest 빌드 서버선택 스플래시)가 먼저 뜨면 처리
- runFlow: "_server_override.yaml"
# 간편비밀번호 잠금화면을 명시적으로 대기 후 PIN 1212
- extendedWaitUntil:
    visible:
      text: "4자리 숫자를 입력하세요"
    timeout: 30000
# PIN 1212. 키패드는 숫자를 누를 때마다 배치가 재섞이므로 각 탭 사이에 정착 대기를 넣어야
#   maestro가 직전 스냅샷의 stale 좌표를 눌러 오입력하는 사고를 막을 수 있음
#   (2026-08-04 실제로 "비밀번호가 맞지 않습니다"/"로그인 실패" 2회 발생 → 잠금 위험)
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- runFlow: "_server_override.yaml"
# 로그인 세션 만료 다이얼로그(토큰 만료 시)가 뜨거나 홈이 뜰 때까지 대기
- extendedWaitUntil:
    visible:
      text: "로그인 세션이 만료|홈"
    timeout: 20000
- runFlow:
    when:
      visible:
        text: "로그인 세션이 만료"
    commands:
      - tapOn: "OK"
      - extendedWaitUntil:
          visible:
            text: "홈"
          timeout: 20000
# 지문인증/팝업 처리
- runFlow:
    when:
      visible:
        text: "나중에"
    commands:
      - tapOn: "나중에"
- runFlow:
    when:
      visible:
        text: "나중에 하기"
    commands:
      - tapOn: "나중에 하기"
- runFlow:
    when:
      visible:
        text: "닫기"
    commands:
      - tapOn: "닫기"
- extendedWaitUntil:
    visible:
      text: "홈"
    timeout: 30000
- waitForAnimationToEnd
# 홈 코치마크 balloon 처리
- runFlow:
    when:
      visible:
        id: "com.gmeremit.online.gmeremittance_native.livetest:id/balloonClose"
    commands:
      - tapOn:
          id: "com.gmeremit.online.gmeremittance_native.livetest:id/balloonClose"
      - waitForAnimationToEnd

# 해외송금 진입 (실시간 송금 탭)
- tapOn: "해외송금"
- extendedWaitUntil:
    visible:
      text: "수취인을 선택하세요."
    timeout: 10000

# 사전 정리: GME TEST 삭제 (최대 6회)
- runFlow:
    when:
      visible:
        text: "GME TEST"
    commands:
      - tapOn:
          id: "moreIcon"
          index: 0
      - tapOn:
          id: "delete"
          index: 0
      - tapOn: "예"
