    commands:
      - tapOn:
          id: "moreIcon"
          index: 0
      - tapOn:
          id: "delete"
          index: 0
      - tapOn: "예"
- runFlow:
    when:
      visible:
        text: "GME TEST"
    commands:
      - tapOn:
          id: "moreIcon"
          index: 0
      - tapOn:
          id: "delete"
          index: 0
      - tapOn: "예"

# 사전 정리: TEST GME 삭제 (최대 3회)
- runFlow:
    when:
