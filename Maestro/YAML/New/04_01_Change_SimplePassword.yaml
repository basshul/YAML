appId: com.gmeremit.online.gmeremittance_native.livetest
---
# === 앱 실행 및 로그인 (간편 비밀번호: 1212) ===
# 주의(2026-08-03): 기존 `notVisible: "Home"` 가드는 launchApp 직후 잠깐 보이는 **캐시된 홈**에
#   매칭돼 PIN 입력을 건너뛰고 잠금화면에 갇힘. 잠금화면을 명시적으로 대기 후 PIN 입력하도록 변경.
#   PIN 키패드는 매번 랜덤 배치라 좌표가 아닌 text("1"/"2")로 탭.
- launchApp
- extendedWaitUntil:
    visible:
      text: "4자리 숫자를 입력하세요"
    timeout: 30000
# PIN 1212. 키패드는 숫자를 누를 때마다 배치가 재섞이므로 각 탭 사이에 정착 대기를 넣어야
#   maestro가 직전 스냅샷의 stale 좌표를 눌러 오입력하는 사고를 막을 수 있음
#   (2026-08-04 실제로 "비밀번호가 맞지 않습니다"/"로그인 실패" 2회 발생 → 잠금 위험)
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
# 로그인 세션 만료 다이얼로그(토큰 만료 시) 또는 홈 대기
- extendedWaitUntil:
    visible:
      text: "로그인 세션이 만료|Home"
    timeout: 20000
- runFlow:
    when:
      visible:
        text: "로그인 세션이 만료"
    commands:
      - tapOn: "OK"
      - extendedWaitUntil:
          visible:
            text: "Home"
          timeout: 20000
# 홈 코치마크 balloon(별도 PopupWindow, 떠있으면 아래 노드를 못읽음) 닫기
- runFlow:
    when:
      visible:
        id: "com.gmeremit.online.gmeremittance_native.livetest:id/balloonClose"
    commands:
      - tapOn:
          id: "com.gmeremit.online.gmeremittance_native.livetest:id/balloonClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 30000

# === 1차: 간편 비밀번호 1212 → 2323 변경 ===
# Profile 탭 → Settings → 간편 비밀번호 변경
- tapOn:
    text: "Profile"
- waitForAnimationToEnd
- tapOn:
    text: "Settings"
- waitForAnimationToEnd
- tapOn:
    id: "view_change_pin_code"
- waitForAnimationToEnd

# 1단계: 현재 비밀번호 확인
# 틀린 비밀번호: 0909
- tapOn: "0"
- tapOn: "9"
- tapOn: "0"
- tapOn: "9"
- waitForAnimationToEnd
# 정상 비밀번호: 1212
# 키패드 재배치 대응: 각 탭 사이 정착 대기 (stale 좌표 오입력 방지)
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- waitForAnimationToEnd

# 2단계: 변경할 비밀번호 입력
# 현재 사용중인 비밀번호 입력 (거절됨): 1212
# 키패드 재배치 대응: 각 탭 사이 정착 대기 (stale 좌표 오입력 방지)
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- waitForAnimationToEnd
# 새로운 비밀번호: 2323
- tapOn: "2"
- tapOn: "3"
- tapOn: "2"
- tapOn: "3"
- waitForAnimationToEnd

# 3단계: 비밀번호 확인
# 다른 비밀번호: 3434 → 2단계로 이동
- tapOn: "3"
- tapOn: "4"
- tapOn: "3"
- tapOn: "4"
- waitForAnimationToEnd
# 동일한 비밀번호: 2323
- tapOn: "2"
- tapOn: "3"
- tapOn: "2"
- tapOn: "3"
- waitForAnimationToEnd

# 4단계: 인증 방법 선택 - 일반 비밀번호 후 계속
- tapOn: "일반 비밀번호"
- waitForAnimationToEnd
- tapOn: "계속"
- waitForAnimationToEnd

# 5단계: 일반 비밀번호 입력
# 틀린 비밀번호: Gme12!@
- runFlow:
    when:
      notVisible:
        text: "Capital G 히읃"
    commands:
      - tapOn: "대문자 키보드 변경"
      - waitForAnimationToEnd
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "1"
- tapOn: "2"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "골뱅이"
- tapOn: "입력완료"

# 인증 실패 팝업 [확인] 선택
- tapOn:
    id: "btnVerifyBankAccount"

# 비밀번호 입력 필드 선택
- tapOn:
    id: "keyLayout"

# 정상 비밀번호: Gme12!
- runFlow:
    when:
      notVisible:
        text: "Capital G 히읃"
    commands:
      - tapOn: "대문자 키보드 변경"
      - waitForAnimationToEnd
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "1"
- tapOn: "2"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "입력완료"
- waitForAnimationToEnd

# 변경 성공 팝업 확인
- tapOn: "확인"
- waitForAnimationToEnd

# 설정 화면에서 홈으로
- pressKey: "back"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 15000

# === 앱 재시작 및 변경된 PIN(2323)으로 로그인 확인 ===
- stopApp
- waitForAnimationToEnd
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        text: "Home"
    commands:
      - tapOn: "2"
      - tapOn: "3"
      - tapOn: "2"
      - tapOn: "3"
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 30000

