# ================================================================
# 시나리오 2: 외국인 회원가입
# 실행:
#   한국어: .\run_test.ps1 -lang ko -flow 06_Registration_Foreigner.yaml
#   영어:   .\run_test.ps1 -lang en -flow 06_Registration_Foreigner.yaml
#
# 입력값: ID: test006 / PW: Gmetest1! / 전화번호: 010-90380808
# clearState → 신규 회원 → 약관 → Sign Up (외국인) → ID 인증 (Passport → ARC)
#           → 개인정보 (주소/직업/성별/이메일) → 계좌인증 건너뛰기 → 간편비밀번호 설정
#           → 로그아웃 → seungsoo818 로그인 → 홈 화면 확인
# ================================================================

- launchApp:
    clearState: true
- waitForAnimationToEnd
- waitForAnimationToEnd
# clearState 후 앱 언어가 한국어인 경우 목표 언어로 전환 (en.env: 신규 회원 감지 → English 전환 / ko.env: 조건 미충족 유지)
- runFlow:
    when:
      visible: "${LANG_SWITCH_TRIGGER}"
    commands:
      - tapOn: "언어 선택"
      - waitForAnimationToEnd
      - tapOn: "${LANG_SWITCH_TARGET}"
      - waitForAnimationToEnd
- tapOn: "${REG_NEW_MEMBER}"
- waitForAnimationToEnd
# 약관 동의 (간략화: 모두 동의 → 확인)
- tapOn: "${REG_AGREE_ALL}"
- waitForAnimationToEnd
- scroll
- tapOn: "${REG_CONFIRM}"
- waitForAnimationToEnd
# Sign Up: ID / 비밀번호 / 전화번호 / 국적: 외국인
- tapOn: "${REG_USER_ID}"
- waitForAnimationToEnd
- inputText: "test006"
- tapOn: "${REG_PASSWORD}"
- tapOn: "대문자 키보드 변경"
