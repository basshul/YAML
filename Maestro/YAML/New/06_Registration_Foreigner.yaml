- tapOn: "느낌표"
- tapOn: "입력완료"
- waitForAnimationToEnd
- tapOn: "${REG_PASSWORD_CONFIRM}"
- waitForAnimationToEnd
- tapOn: "대문자 키보드 변경"
- tapOn: "Capital G 히읃"
