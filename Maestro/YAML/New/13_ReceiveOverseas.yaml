# ----------------------------------------------------------------
# [12] [High] Inbound Request - 계좌 선택 시 받는계좌 확인 바텀시트 발생
#            - Edit 선택 시 계좌 재선택
#            - Confirm 선택시 인바운드 Request 등록 확인
# ----------------------------------------------------------------
# 알려진 이슈: 계좌 선택 후 "확인"(Confirm) 탭 시 현재 livetest 환경에서 종종
# "실패 - Receiving amount didnot match, Please re-calculate exrate and try again. (IBST0003)"
# 에러가 재현됨 (GME Wallet, 은행계좌 모두 동일하게 재현). 2026-07-07엔 매번 재현되는 것으로
# 보였으나, 2026-07-08 확인 결과 간헐적 실패이며 실제로 Confirm이 성공해 Request가 정상
# 등록되는 경우도 있음(성공 시 [15]~[20] Inbound Request Status 화면으로 이어짐 - 해당 섹션
# 참고). 원인 미상(백엔드 환율 캐시 타이밍 추정)이라 이 항목은 여전히 "입금 계좌 확인"
# 바텀시트 노출 및 Edit 재선택 동작까지만 안정적으로 검증하고, 최종 Confirm 성공 여부는
# 어설션하지 않음 (성공/실패 어느 쪽이 나와도 이 케이스 자체는 그대로 통과하도록 유지)
# [11]이 끝난 화면(메인화면)에서 바로 이어서 진행. BUDI SANTOSO를 다시 탭해 금액 입력
# 필드를 깨끗한 상태로 재시작(이전 계산값이 남아있을 위험 방지)

- tapOn: "BUDI SANTOSO"
- waitForAnimationToEnd
- tapOn:
    id: "sendAmountEdTxt"
- inputText: "1000000"
- tapOn: "완료"
- assertVisible:
    text: ".*수수료 포함된 금액.*"
- tapOn:
    id: "btn_continue"
# 알려진 간헐적 버그([05] 참고) - 정상 동작(계좌 선택 노출)했을 때만 이 케이스의 나머지
# 검증(GME Wallet 선택 → 확인 → 변경 재선택)을 진행. 버그로 리셋된 경우엔 이 블록 전체를
# 스킵하고 아래 back 정리 블록(조건부라 안전하게 no-op)으로 넘어가 다음 케이스로 진행
- runFlow:
    when:
      visible:
        text: "계좌 선택"
    commands:
      - tapOn: "GME Wallet"
      - scroll
      # 계좌 선택 목록 내부의 "계속" 버튼은 상단 위젯의 btn_continue와 달리 id가
      # btnContinue(카멜케이스)로 별개임 (2026-07-08 확인)
      - tapOn:
          id: "btnContinue"
      - assertVisible:
          text: "입금 계좌 확인"
      # Edit(변경) 선택 시 계좌 선택 화면으로 재진입 확인
      - tapOn: "변경"
      - assertVisible:
          text: "계좌 선택"
      - tapOn:
          id: "close"
# TODO: Confirm(확인) 탭 시 정상 케이스에서는 "인바운드 Request 등록 완료" 노출 기대
# 현재 환경에서는 IBST0003 에러로 검증 불가 (위 주석 참고)

# close 직후엔 BUDI SANTOSO 전용 계산 화면(수취인 목록/등록 버튼이 없는 축소 화면)에
# 남아있어 back으로 한 번 더 빠져나가야 전체 메인화면(수취인 목록 포함)으로 돌아감
# (2026-07-08 확인, [11]과 동일한 구조)
- runFlow:
    when:
      notVisible:
        text: "수취 방법"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        text: "수취 방법"
    commands:
      - pressKey: back
      - waitForAnimationToEnd

# ----------------------------------------------------------------
# [13] [Medium] Existing Sender - 기존 송금인 삭제 동작 확인
# ----------------------------------------------------------------
# 수취인 목록 카드는 moreIcon(⋮) 탭 시 좌측에 delete(휴지통) 아이콘만 슬라이드로 노출됨
# (edit 아이콘은 없음 - [14] 참고). 신규 등록된 송금인이 목록 최상단(index 0)에 추가되는
# 것을 이용해, 기존 BUDI SANTOSO(다른 케이스에서 재사용 중)를 건드리지 않고
# 매번 새로 등록한 더미 송금인을 그 자리에서 바로 삭제하는 방식으로 검증
# (2026-07-08 실기기 end-to-end 확인: 등록 → moreIcon → delete → "예" → "Successfully Deleted" 토스트)
# [12]가 끝난 화면(메인화면)에서 바로 이어서 진행

- tapOn: "송금인 등록하기"
- waitForAnimationToEnd
- tapOn: "다음"
- assertVisible:
    text: "송금인 세부 정보 입력"
- tapOn:
    id: "input_edittext"
    index: 0
- inputText: "Delete Target"
- tapOn:
    id: "input_edittext"
    index: 1
- inputText: "089900011199"
- tapOn:
    id: "input_edittext"
    index: 2
- inputText: "deletetarget@example.com"
- tapOn:
    id: "input_edittext"
    index: 3
- inputText: "Delete Street 1"
# Address 입력 후 키보드가 City 필드를 가리는 경우가 있어 명시적으로 닫고 진행
- hideKeyboard
- tapOn:
    id: "input_edittext"
    index: 4
- inputText: "Delete City"
- hideKeyboard
- tapOn: "다음"
- waitForAnimationToEnd
# 다이얼로그 헤더 텍스트에 실제 줄바꿈이 포함되어 있어("확인 후\n인증을") text 셀렉터로는
# 매칭되지 않음(Maestro는 전체 문자열 매칭) - id로 매칭 (2026-07-08 실기기 확인)
- assertVisible:
    id: "header"
- tapOn: "확인"
- assertVisible:
    text: "저장 성공"
# "송금 받기를 요청하시겠습니까?" 프롬프트가 뜨는 경우와 등록 완료 후 곧바로 목록
# 화면으로 돌아가는 경우가 간헐적으로 갈림(2026-07-08 확인, [07] 참고) - 프롬프트가
# 떠서 아직 목록이 안 보일 때만 취소로 닫음
- runFlow:
    when:
      notVisible:
        text: "Delete Target"
    commands:
      - tapOn: "취소"
- assertVisible:
    text: "Delete Target"
- tapOn:
    id: "moreIcon"
    index: 0
- tapOn:
    id: "delete"
- assertVisible:
    text: "송금인 삭제"
- tapOn: "예"
- assertVisible:
    text: "Successfully Deleted"
- assertNotVisible:
    text: "Delete Target"

# [13]이 [01]~[14] suite의 마지막 케이스이고, [15]는 Home에서 새로 "해외송금 받기"를
# 탭해야만 "받는 계좌" 카드 목록이 노출되는 별개 화면 구조라 여기서만 Home까지 복귀함
- pressKey: back
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        text: "Home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd

# ----------------------------------------------------------------
# [14] [Medium] Existing Sender - 기존 송금인 수정 동작 확인 - 수정 변경 확인
# ----------------------------------------------------------------
# 2026-07-09 정정: "기능 없음" 결론은 오류였음. 승인 완료된 송금인(BUDI SANTOSO 등)은
# moreIcon(⋮) 슬라이드에 delete만 노출되지만, "승인 대기 중" 상태인 송금인에는 edit(연필)
# 아이콘이 함께 노출됨 - 베트남처럼 은행계좌 등록이 필요한 국가는 등록 즉시 이 상태가 되고,
# edit 탭 시 기존 데이터로 미리 채워진 "송금인 등록하기" 폼이 열려 실제로 수정이 가능함을
# 실기기로 확인함. 신규 베트남 sender 등록은 신분증 사진 4장(Alien ID Card / Sender
# Citizenship 앞뒤 / Document Proof) 업로드가 필수라 실제 이미지 없이는 자동화가 어려워,
# 이미 "승인 대기 중" 상태로 계정에 존재하는 베트남 sender(목록 최하단, 계좌 Ngan hang ANZ
# chi nhanh Ho Chi Minh)를 재사용해 편집 동작만 검증함. Full Name을 매번 동일한 고정값으로
# 덮어써서 이전 실행 결과와 무관하게 항상 idempotent하게 통과하도록 구성.
# 주의(실기기 확인): moreIcon 탭 직후 edit 아이콘까지 상대 셀렉터(rightOf/below)로 찾으면
# 리스트 재레이아웃 타이밍 때문에 엉뚱한(위쪽) 행이 대신 열리는 현상이 있었음 - index 기반
# 셀렉터로 전환해 해결. 또한 edit 탭 후 기존 데이터를 서버에서 비동기로 불러오는 로딩
# 스피너가 있어(약 2~5초) extendedWaitUntil로 대기 필요.
# [13]이 끝난 Home에서 이어서 진행

- tapOn: "해외송금 받기"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "받는 계좌"
    commands:
      - tapOn:
          id: "cardView"
          index: 0
      - tapOn:
          id: "tv_make_another_payment"
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: ".*승인 대기 중.*"
    direction: DOWN
    timeout: 30000
    speed: 60
    visibilityPercentage: 100
- waitForAnimationToEnd
# 목록 최하단 카드(승인 대기 중인 베트남 sender)의 moreIcon - 스크롤을 끝까지 내리면
# 항상 마지막(4번째, index 3)으로 렌더링됨(2026-07-09 실기기 확인)
- tapOn:
    id: "moreIcon"
    index: 3
- tapOn:
    id: "edit"
- extendedWaitUntil:
    visible:
      text: "송금인 세부 정보 입력"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "input_edittext"
    timeout: 15000
- tapOn:
    id: "input_edittext"
    index: 0
- eraseText: 30
- inputText: "VN EDIT TEST"
- hideKeyboard
- tapOn:
    id: "btn_next"
- waitForAnimationToEnd
# 문서 업로드 화면도 동일하게 로딩 스피너 후 표시되며, 기존 업로드 상태(체크됨)가 유지됨
- extendedWaitUntil:
    visible:
      text: "유효한 신분증을 업로드해 주세요."
    timeout: 15000
- tapOn:
    id: "btnSubmit"
# 제출 후 목록으로 돌아와 변경된 이름이 반영되기까지도 약간의 지연이 있음
- extendedWaitUntil:
    visible:
      text: "VN EDIT TEST"
    timeout: 15000

# 사후처리: 이 sender는 [14]가 반복 재사용하는 공용 테스트 데이터이므로, 검증이 끝나면
# Full Name을 원래 값("GMETEST")으로 되돌려 다음 실행에 영향이 남지 않도록 함
# (스크롤 위치가 그대로 유지되어 있어 moreIcon index 3도 동일하게 이 sender를 가리킴)
- tapOn:
    id: "moreIcon"
    index: 3
- tapOn:
    id: "edit"
- extendedWaitUntil:
    visible:
      text: "송금인 세부 정보 입력"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "input_edittext"
    timeout: 15000
- tapOn:
    id: "input_edittext"
    index: 0
- eraseText: 30
- inputText: "GMETEST"
- hideKeyboard
- tapOn:
    id: "btn_next"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "유효한 신분증을 업로드해 주세요."
    timeout: 15000
- tapOn:
    id: "btnSubmit"
- extendedWaitUntil:
    visible:
      text: "GMETEST"
    timeout: 15000

# [15]는 Home에서 새로 "해외송금 받기"를 탭해야만 "받는 계좌" 카드 목록이 노출되는
# 별개 화면 구조라 여기서도 Home까지 복귀함([13] 종료부와 동일한 이유)
- pressKey: back
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        text: "Home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd

# ----------------------------------------------------------------
# [15]~[20] Inbound Request Status - 진입 경로 재발견 (2026-07-08 실기기 확인)
# ----------------------------------------------------------------
# 계정에 완료된 인바운드 Request가 하나라도 있으면 "해외송금 받기" 메뉴 진입 시
# [01]~[14]에서 봤던 환율계산/수취인목록 화면 대신 "받는 계좌" 카드 목록 화면([15])이
# 먼저 노출되는 구조임을 확인함. [12]의 IBST0003는 매번 재현되는 게 아니라 간헐적
# 실패였던 것으로 보이며(원인 미상, 백엔드 환율 캐시 타이밍 추정), 실제로 이전 세션 중
# Confirm이 최소 2회 성공해 계정에 완료된 요청이 남아있었음 - 이를 이용해 [15]~[20] 검증.
# 주의: 이 섹션은 "완료된 요청이 이미 존재해야" 카드 목록이 노출되는 상태 의존적 테스트임.
# 만약 계정에 완료된 요청이 하나도 없는 상태로 돌아가면(예: 만료) [15]는 실패하고 [01]에서
# 보던 화면이 다시 노출됨 - 그 경우 [12] Confirm을 다시 성공시켜 데이터를 만들어야 함.
# [15]->[16]->[17]은 같은 화면 스택에서 바로 이어지므로 Home 재진입 불필요.
# [17]->[18]은 "내역 조회"에서 뒤로가기 1번이면 디테일로 복귀 가능해 이어서 진행.
# [18]에서 "다른 요청 진행"을 타면 [01]~[14]가 쓰는 화면으로 넘어가 버려 이후 내비게이션
# 스택을 확신할 수 없으므로, [19]/[20]은 안전하게 Home부터 재진입함(특히 [20]은 실제
# 결제 페이지로 연결되므로 상태가 꼬이면 위험함).

# ----------------------------------------------------------------
# [15] [Medium] Inbound Request Status - 송금요청 한 카드 노출 되는지 확인
# ----------------------------------------------------------------

- tapOn: "해외송금 받기"
- waitForAnimationToEnd
- assertVisible:
    text: "받는 계좌"
- assertVisible:
    id: "rvAccountList"

# ----------------------------------------------------------------
# [16] [Low] Inbound Request Status - 송금요청 디테일페이지 확인
# ----------------------------------------------------------------
# [15]가 끝난 화면(카드 목록)에서 바로 이어서 진행

- tapOn:
    id: "cardView"
    index: 0
- assertVisible:
    id: "tv_req_complete"
- assertVisible:
    id: "tv_expirydate"

# ----------------------------------------------------------------
# [17] [Medium] Inbound Request Status - 송금요청 디테일 > Check History 버튼 선택 시 이력페이지 이동확인
# ----------------------------------------------------------------
# "내역 조회"(우측 상단) 탭 시 거래내역 > 송금 > 송금 받기 탭으로 이동, "요청 완료" 상태 배지 노출 확인
# [16]이 끝난 화면(디테일)에서 바로 이어서 진행

- tapOn:
    id: "tv_request_history"
- assertVisible:
    text: "요청 완료"

# 이력화면에서 뒤로가기 1번이면 디테일 화면으로 복귀
- pressKey: back
- waitForAnimationToEnd

# ----------------------------------------------------------------
# [18] [Medium] Inbound Request Status - Submit Another Request 선택 시 인바운드 메인화면 이동 확인
# ----------------------------------------------------------------
# "다른 요청 진행" 탭 시 [01]~[09]에서 사용한 환율계산+수취인목록 메인화면으로 이동 확인
# [17]에서 뒤로가기로 복귀한 디테일 화면에서 바로 이어서 진행

