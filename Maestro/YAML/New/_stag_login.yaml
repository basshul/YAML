appId: com.gmeremit.online.gmeremittance_native.stag
---
# ================================================================
# 금보원 시트 테스트용 stag 빌드 로그인 헬퍼
# ================================================================
# stag 빌드(com.gmeremit...stag)는 서버 gmeuat.gmeremit.com:5022 를 사용.
# 콜드 실행 시 "Server Override" 다이얼로그가 항상 노출되며 STAG가
# 기본 선택 상태이므로 CONTINUE만 탭하면 됨.
#
# 이미 로그인된 상태면 간편비밀번호(1212) 입력만 하고 통과.
# 로그아웃 상태면 seungsoo818 / Gmetest1! → 실패 시 Gme12! 로 재시도.
# ================================================================

- launchApp
- waitForAnimationToEnd

# Server Override 스플래시 (stag 빌드 매 실행 노출)
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      - tapOn: "CONTINUE"
      - waitForAnimationToEnd

# 스플래시 로딩 완료 대기: 초기화면("신규 회원") 또는 간편비밀번호 잠금화면
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "keyboardView|btn_lgn|tvTitle"
    timeout: 40000
    optional: true

# 간편비밀번호 잠금 화면(초기화면 아님)이면 1212 입력
- runFlow:
    when:
      notVisible:
        text: "신규 회원"
    commands:
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
      - waitForAnimationToEnd

# 로그아웃 상태: 아이디/비밀번호 로그인
- runFlow:
    when:
      visible:
        text: "신규 회원"
    commands:
      - tapOn:
          id: "btn_lgn"
      - tapOn:
          id: "usernameId"
      - inputText: "seungsoo818"

      # 로그인 시도 1: Gmetest1!
      - tapOn:
          id: "securityKeyboardEditText"
      - tapOn:
          id: "transKeypad_row4"
      - tapOn: "대문자 키보드 변경"
      - tapOn: "Capital G 히읃"
      - tapOn: "m 으"
      - tapOn: "e 디귿"
      - tapOn: "t 시옫"
      - tapOn: "e 디귿"
      - tapOn: "s 니은"
      - tapOn: "t 시옫"
      - tapOn: "1"
      - tapOn: "특수문자변경"
      - tapOn: "느낌표"
      - tapOn: "입력완료"
      - waitForAnimationToEnd

      # 실패 시 Gme12! 재시도
      - runFlow:
          when:
            visible: "오류"
          commands:
            - tapOn: "확인"
            - waitForAnimationToEnd
            - tapOn:
                id: "securityKeyboardEditText"
            - tapOn:
                id: "transKeypad_row4"
            - tapOn:
                id: "securityKeyboardClearAllImageView"
            - tapOn: "대문자 키보드 변경"
            - tapOn: "Capital G 히읃"
            - tapOn: "m 으"
            - tapOn: "e 디귿"
            - tapOn: "1"
            - tapOn: "2"
            - tapOn: "특수문자변경"
            - tapOn: "느낌표"
            - tapOn: "입력완료"
            - waitForAnimationToEnd

# 지문인증 등록 제안 (조건부)
- runFlow:
    when:
      visible: "비밀번호 대신 지문인증을 사용하시겠습니까?"
    commands:
      - tapOn: "나중에"
      - waitForAnimationToEnd

# 간편비밀번호 설정 (조건부)
- runFlow:
    when:
      visible: "간편비밀번호"
    commands:
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn:
          id: "btnOk"
      - waitForAnimationToEnd

# 보이스 피싱 바텀시트 (조건부)
- runFlow:
    when:
      visible: "보이스 피싱 주의"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd

# 홈 진입 대기
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 40000
