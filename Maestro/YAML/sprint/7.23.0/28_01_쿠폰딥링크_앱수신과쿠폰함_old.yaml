appId: ${APP_ID}
env:
  # ⛔ 여기에는 **호출자가 바꿀 필요가 없는 고정값만** 둔다.
  #   플로우 헤더 env 는 `--env` 로 넘긴 값을 **덮어쓴다**([[feedback_maestro_flow_env]]).
  #   쿠폰 코드처럼 실행마다 달라지는 값은 아래 "실행" 절대로 `-ExtraEnv` 로 넘긴다.
  #
  # 변조 케이스 [10] 이 쓰는 고의로 잘못된 코드. 서버에 존재할 수 없는 모양이면 된다.
  COUPON_CODE_TAMPERED: "QA-INVALID-0000000000"
  # 쿠폰 딥링크 스킴 — ★2026-11-04 **실제 Airbridge 링크로 확정**(abr.ge/h3ssc1s 해석).
  #   짧은 링크 `https://abr.ge/<id>` 가 풀리는 모양:
  #     https://gmeremit.airbridge.io/gmeremit.coupon.redeem/?couponCode=<코드>&discountValue=<n>
  #       &airbridge_referrer=...&https_deeplink=true&short_id=<id>
  #   그 페이지의 `al:android:url` / `airbridge_deeplink` 가 가리키는 앱 딥링크:
  #     **gmeremit://gmeremit.coupon.redeem/?couponCode=<코드>&discountValue=<n>**
  #   ⚠️ `.redeem` 뒤에 **슬래시가 있다**(처음엔 없는 줄 알았다). 앱이 쿼리에서 읽는 키는
  #     dex 기준 `couponCode`(`QUERY_PARAM_COUPON_CODE`) 하나다. `discountValue` 를 빼도
  #     되는지는 **미확인** → 실측 후 필요하면 아래 값 뒤에 붙일 것.
  DEEPLINK_COUPON_REDEEM: "gmeremit://gmeremit.coupon.redeem/?couponCode="
  DEEPLINK_COUPON_BOX: "gmeremit://gmeremit.coupon.view.list/couponavailable"
---
# ================================================================
# 시나리오: 쿠폰 딥링크 — **앱 수신부**(Airbridge 링크가 앱에 넘긴 뒤) — 구 UI
# 출처: Jira S2-59 [QA] Coupon link generator: switch from Firebase to Airbridge
#       (에픽 S2-36) — TC-01 ~ TC-10 매트릭스
# ================================================================
# ★ 이 파일이 **커버하는 범위**는 "쿠폰 코드가 앱에 전달된 다음"이다.
#   랜딩 웹페이지(전화번호 입력 → Welcome Back 팝업 → Login)는
#   **`28_02_쿠폰딥링크_웹랜딩_old.yaml`** 이 본다. 둘을 나눈 이유:
#     · 앱 쪽은 APK 리소스/딥링크 스킴을 **실측**해서 셀렉터가 확실하다.
#     · 웹 쪽은 **실제 Airbridge URL 이 있어야** 화면을 볼 수 있어 아직 미검증이다.
#       한 파일에 두면 웹에서 죽을 때 앱 검증까지 통째로 못 돌린다.
#
# ---------------------------------------------------------------
# 실측 근거 (2026-11-04, `base.apk` = 7.22.0-stag / versionCode 72200001)
# ---------------------------------------------------------------
#   · Airbridge SDK 가 빌드에 들어 있다(`co.ab180.airbridge...LifecycleProvider`).
#   · 딥링크 수신 액티비티 = `splash_screen.view.SplashScreen`
#     - App Link 호스트: `gmeremit.abr.ge` / `abr.ge` / `gmeremit.airbridge.io`
#     - 커스텀 스킴: `gmeremit://`
#     ⚠️ 호스트 3개의 **도메인 검증 상태가 `1024`(미검증)** 라 https 링크는
#       브라우저가 먼저 받는다. 그래서 이 파일은 **커스텀 스킴**으로 앱에 직접 넣는다.
#   · dex 문자열(쿼리 파라미터 이름이 그대로 박혀 있다):
#       `gmeremit://gmeremit.coupon.redeem`  /  `couponCode`  /  `QUERY_PARAM_COUPON_CODE`
#       `onNewIntent - Received coupon: code=`
#       `onCreate - Coupon URL detected in FROM, skipping navigateViaDestinationUrl
#        (handled via SharedPreferences)`
#       → **미로그인 상태로 링크가 들어오면 앱이 코드를 저장해 두었다가 로그인 후에 처리**한다.
#         TC-02 의 "로그인 완료 후 쿠폰 팝업"이 이 경로다.
#   · 쿠폰 결과 문구(= `COUPON_*_MSG` env 의 출처). 괄호 안이 string 리소스 이름:
#       coupon_expired     "This coupon link is no longer available. Please browse other coupons."
#       coupon_used        "This Coupon is already claimed. Please browse other coupons"
#       coupon_redeem_self "You have already redeemed this coupon. This coupon is saved in your Coupon box."
#       coupon_redeemed    "Collect your special gifts now. This coupon will be saved to your Coupon box."
#       coupon_failed      "Error occured during coupon redeem process. Please browse other coupons."
#       coupon_inactive    "Coupon has been deleted or set to inactive. Please browse other coupons."
#       browse_other_coupons_text "Browse Other Coupons" / contact_support_text "Contact Support"
#     ⛔ **APK 값을 최종값으로 쓰지 말 것**([[project_yaml_i18n]]) — Lokalise OTA 로 바뀐다.
#       → env 값은 ko/en 양쪽을 **대안 매칭**으로 묶어 두었다. 실기기 실측 후 좁힐 것.
#   · 앱 안에도 `dialog_cupon_message.xml` 이라는 **랜딩과 똑같은 다이얼로그**가 있다:
#       `txt_dialog_title`(Welcome Back!) / `txt_dialog_message` /
#       `btn_diaog_cancel`(Customer Support) / `btn_diaog_ok`(Login) /
#       `register_diaog_ok`(Register Now) / `sign_btn_diaog_ok`(Have a GME accout? Sign in)
#     ⚠️ 오타가 리소스 이름 그대로다(`cupon`, `diaog`). 고치지 말 것.
#     ⚠️ **쿠폰 결과 팝업(만료/중복/발급)이 이 레이아웃을 재사용하는지는 미확인**이다.
#       그래서 아래 케이스는 **문구**로 잡고, id 단언은 실측 뒤에 넣는다.
#   · 쿠폰함 `NewCouponBoxHistoryActivity` (2026-10-02 실측, `_pretrim/04_02` 에 기록):
#       `toolbar_title`("쿠폰함") / `iv_back` / `transactionTabLayout`(탭 3종은 id 없음 → 문구) /
#       `rvCouponCategories`(행 = `imgvCategoryImage` + `txvTitle` + `txvItemCount`)
#
# ---------------------------------------------------------------
# ★ 실기기 실측 (2026-11-04, SM-S911N / 실제 쿠폰 링크 `https://abr.ge/h3ssc1s`)
# ---------------------------------------------------------------
#   · 짧은 링크는 **Airbridge 바운스 페이지**로 풀린다. 그 페이지 자체에는 전화번호 입력칸이
#     없고 스크립트가 바로 앱 딥링크를 던지며, 앱이 없으면 Play 스토어로 보낸다
#     (`fallbacks:{android:"google-play"}`). PC UA 로 열면 `www.gmeremit.com` 으로 간다.
#     → **티켓의 "웹 쿠폰 랜딩 페이지"는 이 페이지가 아니다.** 앱 안의 화면일 가능성이 크다
#       (APK 에 `FREE SERVICE FEE COUPON` · `dialog_cupon_message.xml` 이 다 있다).
#       확정은 미로그인 상태 실측이 필요하다 → `28_02` 머리말 참고.
#   · ⛔ **앱 선택 다이얼로그가 먼저 뜬다.** 기기에 GME 빌드가 3개(운영/livetest/stag) 깔려
#     있고 셋 다 `gmeremit://` 를 선언한다 → `ResolverActivity`.
#     → 모든 `openLink` 뒤에 `_pick_app_from_chooser_old.yaml` 을 붙였다.
#   · Server Override 다이얼로그 실측: 목록 3종 + `button1`. stag 는 이미 LIVETEST 선택 상태라
#     항목을 눌러도 버튼이 `CONTINUE` 그대로였다(= 항등 시퀀스가 의도대로 동작한다).
#
# ---------------------------------------------------------------
# 케이스 (번호 = 티켓의 TC 번호. 추적성을 위해 일부러 맞췄다)
# ---------------------------------------------------------------
#   [02] [High]   미로그인 + 만료/소진 쿠폰 → 로그인 후 "더 이상 유효하지 않습니다" 팝업
#                 → [Browse Other Coupons] → 쿠폰함 이동            ← 티켓 영상의 케이스
#   [02-C][Medium] 같은 팝업의 [Contact Support] 동작 (SKIP_OPTIONAL 로 끌 수 있다)
#   [07] [High]   기로그인 상태 유입 → **로그인 화면을 거치지 않고** 홈에서 바로 팝업
#   [05] [High]   이미 수령/사용한 쿠폰 재사용 → 중복 수령 방지 팝업   (코드 있을 때만)
#   [10] [Medium] 파라미터 변조 / 코드 없는 링크 → 크래시·백화면 없이 오류 안내
#   [01] [High]   유효 쿠폰 → 발급 완료 팝업 → 쿠폰함 Available      (코드 있을 때만, 비멱등)
#   [06] 🚫 BLOCKED — 앱 미설치 유입(Deferred Deep Link). 아래 "BLOCKED" 절 참고.
#   [03][04][08][09] → 웹 랜딩 전용. `28_02_쿠폰딥링크_웹랜딩_old.yaml`
#
# ---------------------------------------------------------------
# 🚫 BLOCKED — [06] 앱 미설치 상태 유입 (Deferred Deep Link)
# ---------------------------------------------------------------
#   검증하려면 ① 앱 삭제 → ② 링크 클릭 → ③ **Play 스토어에서 설치** → ④ 첫 실행에서
#   쿠폰 파라미터 유지 확인, 이 4단계가 필요하다.
#   · ③ 은 스토어 계정·결제·기기 상태에 걸려 자동화 대상이 아니다(스토어 UI 는 앱 밖이고
#     버전마다 바뀐다). `adb install` 로 대신하면 **스토어 설치 referrer 가 없어** 지연
#     딥링크가 애초에 성립하지 않는다 — 즉 자동화로 바꿔 끼울 수 없는 단계다.
#   · ① 은 기기에서 `.stag` 를 지우는 일이라 스위트의 다른 전부를 못 돌게 만든다.
#   → **수동 검증 케이스로 둔다.** 자동화하려면 Airbridge 대시보드의 deferred deeplink
#     로그를 보는 별도 경로가 필요하다(앱 자동화 범위 밖).
#
# ---------------------------------------------------------------
# 실행 — 쿠폰 코드는 **반드시 `-ExtraEnv` 로** 넘긴다
# ---------------------------------------------------------------
#   코드를 어디서 얻나: Core 어드민 > OTHER SERVICE > Coupon > Coupon Link Generator
#     → 쿠폰 생성/수정 → Download Excel → Airbridge URL 의 `couponCode` 파라미터.
#
#   .\run_test.ps1 -lang ko -User Basshu -flow "sprint\7.23.0\28_01_쿠폰딥링크_앱수신과쿠폰함_old.yaml" `
#       -ExtraEnv COUPON_CODE_EXPIRED=<만료·소진된 코드>
#
#   선택 데이터(없으면 그 케이스만 SKIP 된다):
#       COUPON_CODE_CLAIMED=<이 계정이 이미 받은 코드>     → [05]
#       COUPON_CODE_VALID=<아직 유효하고 미수령인 코드>     → [01]  ⚠️ 1회용이다
#
#   ⛔ `-ExtraEnv` 키를 `env\*.env` 에도 적지 말 것 — 러너가 "한쪽만 두세요" 로 죽인다.
#
# ---------------------------------------------------------------
# ⚠️ 이 파일을 돌리기 전에
# ---------------------------------------------------------------
#   · [02] 가 **`clearState` 로 미로그인 상태를 만든다**(티켓의 사전조건이 "미로그인"이다).
#     끝나면 다시 로그인된 상태로 남으므로 뒤 플로우에 지장은 없지만,
#     스위트에 넣는다면 `01_01_로그인_정상` 과 같은 G1 자리여야 한다.
#   · `clearState` 는 Server Override 를 **빌드 기본값(stag=STAG)** 으로 되돌린다
#     → 아래에서 LIVETEST 를 항등 시퀀스로 다시 찍는다([[project_stag_build_run]]).
#   · 앱 언어도 한국어로 초기화된다 → en 실행은 `LANG_SWITCH_*` 블록이 되돌린다.
# ================================================================

# ----------------------------------------------------------------
# [00] 실행 전제 — 만료 쿠폰 코드가 없으면 이 파일은 아무것도 검증하지 못한다
# ----------------------------------------------------------------
# ⛔ 여기서 **일부러 죽인다.** 데이터가 없을 때 조용히 SKIP 시키면 EXIT=0 으로 끝나
#   "통과했다"로 읽힌다 — 이 저장소가 가장 경계하는 거짓 통과다.
- assertTrue: ${typeof COUPON_CODE_EXPIRED !== 'undefined' && COUPON_CODE_EXPIRED.length > 0}

# ================================================================
# [02] [High] 미로그인 + 만료/소진 쿠폰 링크 → 로그인 후 쿠폰 상태 팝업
#      (티켓 Step 1~6 / TC-02)
# ================================================================
# ---------------- [02-1] 미로그인 상태 만들기 ----------------
- launchApp:
    clearState: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Server Override|서비스 이용 안내|신규 회원"
    timeout: 30000
# LIVETEST 강제 — 판별이 불가능해 항등 시퀀스로 간다(docs/ENVIRONMENT.md §7.3).
#   ⚠️ 헬퍼(`_server_override_old.yaml`)는 `Server Override` 가 **이미 떠 있을 때**만 동작한다.
#     여기서는 clearState 직후라 확실히 뜨므로 01_01 과 같은 모양을 쓴다.
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      - tapOn:
          text: "${SERVER_PICK}"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT 로 앱이 죽었을 수 있으므로 재실행. ⛔ 여기서 clearState 금지.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
# 서비스 이용 안내 + OS 권한 다이얼로그 여러 개
- runFlow: "../../Old/_onboarding_gate_old.yaml"
# clearState 로 앱 언어가 한국어로 초기화된다 → en 실행이면 되돌린다.
#   ko 는 `LANG_SWITCH_TRIGGER=__NEVER_MATCH__` 라 통째로 SKIP 된다.
- runFlow:
    when:
      visible: "${LANG_SWITCH_TRIGGER}"
    commands:
      - tapOn:
          id: "selectLangBg"
      - waitForAnimationToEnd
      - tapOn: "${LANG_SWITCH_TARGET}"
      - waitForAnimationToEnd
      - runFlow: "../../Old/_server_override_old.yaml"
# 미로그인 확정 — 초기화면에 로그인 버튼이 있다
- extendedWaitUntil:
    visible:
      id: "btn_lgn"
    timeout: 30000
- takeScreenshot: "[02-1]_미로그인_초기화면"

# ---------------- [02-2] 쿠폰 딥링크 수신 → 로그인 화면 ----------------
# 티켓의 Step 3~4(랜딩에서 [Login] 선택 → 앱 실행)에 해당하는 **앱 쪽 입력**이다.
#   웹을 거치는 경로는 `28_02` 가 본다. 여기서는 같은 딥링크를 직접 넣어
#   "앱이 쿠폰 코드를 들고 로그인 화면으로 간다"는 앱 동작만 분리해 본다.
- openLink:
    link: "${DEEPLINK_COUPON_REDEEM}${COUPON_CODE_EXPIRED}"
# ⛔ 기기에 GME 빌드가 3개 깔려 있어 **앱 선택 다이얼로그**가 먼저 뜬다(2026-11-04 실측)
- runFlow: "../../Old/_pick_app_from_chooser_old.yaml"
- waitForAnimationToEnd
# 딥링크는 SplashScreen 을 콜드로 깨우므로 Server Override 가 다시 뜰 수 있다.
- runFlow: "../../Old/_server_override_old.yaml"
- extendedWaitUntil:
    visible:
      id: "btn_lgn|usernameId"
    timeout: 60000
# 로그인 화면 문구 — "Welcome to Global Money Express" / "글로벌머니익스프레스에 오신 것을 환영합니다."
- assertVisible: "${LOGIN_TITLE_TEXT}"
- takeScreenshot: "[02-2]_딥링크_로그인화면"

# ---------------- [02-3] 로그인 완료 → 쿠폰 상태 팝업 ----------------
- runFlow:
    when:
      visible:
        id: "btn_lgn"
    commands:
      - tapOn:
          id: "btn_lgn"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "usernameId"
    timeout: 20000
- tapOn:
    id: "usernameId"
- eraseText: 50
- inputText: "${ACCT_MAIN}"
# ⚠️ securityKeyboardEditText 탭 직후 transKeypad_row4 를 누르지 말 것(문자 오입력)
- tapOn:
    id: "securityKeyboardEditText"
# 비밀번호는 사용자 프로파일에서 온다(`env\user.<이름>.local.env`). ⛔ 하드코딩 금지.
- runFlow: "../../Old/_enter_login_pw_old.yaml"
- waitForAnimationToEnd
# 지문 등록 제안 → 나중에
- runFlow:
    when:
      visible: "${FINGERPRINT_AUTH_PROMPT_TITLE_TEXT}"
    commands:
      - tapOn: "${REG_LATER}"
      - waitForAnimationToEnd
# 간편 비밀번호 생성 요구 시 등록(입력 + 확인)
- runFlow:
    when:
      visible: "${LOCK_CREATE_PROMPT}"
    commands:
      - runFlow:
          file: ../../Old/_enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
      - runFlow:
          file: ../../Old/_enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
      - runFlow:
          when:
            visible:
              id: "btnOk"
          commands:
            - tapOn:
                id: "btnOk"
            - waitForAnimationToEnd
# PIN 입력 화면으로 떨어지는 빌드도 있다
- runFlow:
    when:
      visible: "${PIN_ENTER_4DIGIT}"
    commands:
      - runFlow:
          file: ../../Old/_enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
# ⚠️ 홈 팝업은 **큐**다. 쿠폰 팝업이 배너 **밑에** 깔릴 수 있으므로 먼저 큐를 비운다.
#   헬퍼가 누르는 id(`btn6MonthsLater`/`btnCancel`/`btnDontShowToday`/`imgvCross`/
#   `remindLaterBtn`/`btnClose|btnTwo`)에는 쿠폰 팝업 버튼(`btn_diaog_*`)이 없으므로
#   쿠폰 팝업을 대신 닫아 버릴 일은 없다(2026-11-04 헬퍼 확인).
- runFlow:
    file: ../../Old/_dismiss_popups_stag_old.yaml
# ⛔ 세션 만료는 여기서 빨리 죽인다(뒤 대기에 맡기면 엉뚱한 메시지로 죽는다)
- assertNotVisible: "${SESSION_EXPIRED}"
# 쿠폰 상태 팝업 — 티켓 Step 5
- extendedWaitUntil:
    visible: "${COUPON_LINK_EXPIRED_MSG}"
    timeout: 60000
- assertVisible: "${BROWSE_OTHER_COUPONS_TEXT}"
- assertVisible: "${CONTACT_SUPPORT_TEXT}"
- takeScreenshot: "[02-3]_만료쿠폰_팝업"

# ---------------- [02-4] Browse Other Coupons → 쿠폰함 ----------------
# 티켓 Step 6. 쿠폰함 = `NewCouponBoxHistoryActivity`.
- tapOn: "${BROWSE_OTHER_COUPONS_TEXT}"
- extendedWaitUntil:
    visible:
      id: "rvCouponCategories"
    timeout: 30000
- assertVisible:
    id: "toolbar_title"
    text: "${SCR_COUPON_BOX}"
- assertVisible:
    id: "transactionTabLayout"
- assertVisible: "${COUPON_TAB_AVAILABLE}"
- assertVisible: "${COUPON_TAB_USED}"
- assertVisible: "${COUPON_TAB_EXPIRED}"
# ⚠️ 보유 건수는 계정 데이터에 따라 달라진다 → **값은 보지 않는다**. 목록이 그려지는 것까지만.
- takeScreenshot: "[02-4]_쿠폰함_이동"
- tapOn:
    id: "iv_back"
- waitForAnimationToEnd
- runFlow:
    file: ../../Old/_dismiss_popups_stag_old.yaml
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 60000

# ================================================================
# [02-C] [Medium] 같은 팝업의 [Contact Support] → 고객센터 연결
# ================================================================
# ⚠️ 왜 선택 케이스인가: 이 버튼이 여는 것이 **앱 내 CS 팝업**인지 **Channel.io 실시간 채팅**인지
#   실측 전이다. 채팅이 열리면 상담 채널에 흔적이 남을 수 있어 기본은 **메시지를 보내지 않고**
#   화면 도달까지만 본다. 끄려면 `-ExtraEnv SKIP_OPTIONAL=true`.
# ⚠️ 쿠폰 팝업을 다시 띄워야 하므로 딥링크를 한 번 더 넣는다(만료 코드라 몇 번이든 멱등).
- runFlow:
    when:
      true: ${typeof SKIP_OPTIONAL === 'undefined' || SKIP_OPTIONAL !== 'true'}
    commands:
      - openLink:
          link: "${DEEPLINK_COUPON_REDEEM}${COUPON_CODE_EXPIRED}"
      # ⛔ 기기에 GME 빌드가 3개 깔려 있어 **앱 선택 다이얼로그**가 먼저 뜬다(2026-11-04 실측)
      - runFlow: "../../Old/_pick_app_from_chooser_old.yaml"
      - extendedWaitUntil:
          visible: "${COUPON_LINK_EXPIRED_MSG}"
          timeout: 60000
      - tapOn: "${CONTACT_SUPPORT_TEXT}"
      - waitForAnimationToEnd
      # 고객센터 진입 판정 — 구 UI 의 CS 경로 2종 중 하나가 떠야 한다.
      #   `SCR_SUPPORT_Q`("사용 중 궁금한 점이 있으신가요?") 팝업 또는 `chatView`(실시간 채팅).
      #   ⚠️ 어느 쪽인지 실측 전이라 대안 매칭으로 둔다. 실측 후 하나로 좁힐 것.
      - extendedWaitUntil:
          visible:
            id: "chatView|btnCancel|contactus"
          timeout: 30000
      - takeScreenshot: "[02-C]_고객센터_연결"
      # ⛔ 메시지를 보내지 않고 빠져나온다.
      - runFlow:
          when:
            visible:
              id: "btnCancel"
          commands:
            - tapOn:
                id: "btnCancel"
            - waitForAnimationToEnd
      - runFlow:
          when:
            notVisible:
              id: "bottom_item_home"
          commands:
            - pressKey: back
            - waitForAnimationToEnd
      - runFlow:
          file: ../../Old/_dismiss_popups_stag_old.yaml
      - extendedWaitUntil:
          visible:
            id: "bottom_item_home"
          timeout: 60000

# ================================================================
# [07] [High] 기로그인(로그인 유지) 상태에서 링크 유입
# ================================================================
# 기대: **로그인 화면을 건너뛰고** 앱 홈으로 즉시 전환되며 쿠폰 팝업이 뜬다.
# ⚠️ 판정의 한계를 분명히 해 둔다 — "로그인 화면을 거치지 않았다"를 사후에 증명할 수는 없다.
#   대신 ① 팝업이 **20초 안에** 뜨고 ② 그 시점에 로그인 화면 요소가 **없다**는 두 가지를 본다.
#   로그인 왕복(아이디 입력 + 보안 키패드 + PIN)은 20초 안에 자동으로 끝나지 않으므로
#   이 조합이면 "건너뛰었다"로 충분히 갈린다.
- openLink:
    link: "${DEEPLINK_COUPON_REDEEM}${COUPON_CODE_EXPIRED}"
# ⛔ 기기에 GME 빌드가 3개 깔려 있어 **앱 선택 다이얼로그**가 먼저 뜬다(2026-11-04 실측)
- runFlow: "../../Old/_pick_app_from_chooser_old.yaml"
- extendedWaitUntil:
    visible: "${COUPON_LINK_EXPIRED_MSG}"
    timeout: 20000
- assertNotVisible:
    id: "btn_lgn|usernameId|securityKeyboardEditText"
- takeScreenshot: "[07]_기로그인_즉시팝업"
# ⚠️ 티켓의 "웹에 입력한 번호 ≠ 앱 로그인 계정" 불일치 처리는 **웹에서 번호를 넣어야**
#   성립한다 → `28_02 [07-M]` 로 넘긴다(여기서는 번호를 넣을 화면이 없다).
- tapOn: "${BROWSE_OTHER_COUPONS_TEXT}"
- extendedWaitUntil:
    visible:
      id: "rvCouponCategories"
    timeout: 30000
- assertVisible:
    id: "toolbar_title"
    text: "${SCR_COUPON_BOX}"
- tapOn:
    id: "iv_back"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 60000

# ================================================================
# [05] [High] 이미 수령/사용한 쿠폰을 다시 받으려 할 때 — 중복 수령 방지
# ================================================================
# 데이터가 있을 때만 돈다. `COUPON_CODE_CLAIMED` = **이 계정이 이미 받은** 1회 한정 쿠폰 코드.
#   ([01] 을 한 번 돌리고 나면 그때 쓴 `COUPON_CODE_VALID` 가 바로 이 값이 된다.)
# ⚠️ "중복 지급되지 않았다"를 **건수로 세지 않는다** — 쿠폰함 건수는 계정 데이터에 따라
#   달라지고 다른 플로우가 쿠폰을 늘리기도 한다. 앱이 발급을 막았다는 근거는 **팝업**이다.
- runFlow:
    when:
      true: ${typeof COUPON_CODE_CLAIMED !== 'undefined' && COUPON_CODE_CLAIMED.length > 0}
    commands:
      - openLink:
          link: "${DEEPLINK_COUPON_REDEEM}${COUPON_CODE_CLAIMED}"
      # ⛔ 기기에 GME 빌드가 3개 깔려 있어 **앱 선택 다이얼로그**가 먼저 뜬다(2026-11-04 실측)
      - runFlow: "../../Old/_pick_app_from_chooser_old.yaml"
      - extendedWaitUntil:
          visible: "${COUPON_DUPLICATE_MSG}"
          timeout: 60000
      - takeScreenshot: "[05]_중복수령_방지팝업"
      # 팝업에서 쿠폰함으로 유도되는지 — 버튼 문구가 빌드에 따라 갈릴 수 있어 조건부로 본다.
      - runFlow:
          when:
            visible: "${BROWSE_OTHER_COUPONS_TEXT}"
          commands:
            - tapOn: "${BROWSE_OTHER_COUPONS_TEXT}"
            - extendedWaitUntil:
                visible:
                  id: "rvCouponCategories"
                timeout: 30000
            - assertVisible:
                id: "toolbar_title"
                text: "${SCR_COUPON_BOX}"
            - takeScreenshot: "[05]_쿠폰함_유도"
            - tapOn:
                id: "iv_back"
            - waitForAnimationToEnd
      - runFlow:
          when:
            notVisible:
              id: "bottom_item_home"
          commands:
            - pressKey: back
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "bottom_item_home"
          timeout: 60000

# ================================================================
# [10] [Medium] 파라미터 변조 / 잘못된 링크 — 크래시·백화면 없이 오류 안내
# ================================================================
# 이 케이스만은 **외부 데이터가 전혀 필요 없다**(고의로 틀린 코드를 만들어 넣는다).
# ---------------- [10-1] 존재하지 않는 couponCode ----------------
- openLink:
    link: "${DEEPLINK_COUPON_REDEEM}${COUPON_CODE_TAMPERED}"
# ⛔ 기기에 GME 빌드가 3개 깔려 있어 **앱 선택 다이얼로그**가 먼저 뜬다(2026-11-04 실측)
- runFlow: "../../Old/_pick_app_from_chooser_old.yaml"
- waitForAnimationToEnd
# 판정 ① 오류/안내 팝업이 뜬다(만료·삭제·처리오류 중 하나로 떨어진다)
- extendedWaitUntil:
    visible: "${COUPON_ERROR_ANY_MSG}"
    timeout: 60000
- takeScreenshot: "[10-1]_변조코드_오류안내"
# 판정 ② **앱이 살아 있다** — 백화면/크래시면 하단 내비가 계층에서 사라진다.
#   ⛔ 스크린샷만으로 "백화면 아님"을 판정하지 말 것([[feedback_flagsecure_verify]] 와 같은 이유로
#     그림은 근거가 약하다). 요소 존재로 본다.
- runFlow:
    when:
      visible: "${BROWSE_OTHER_COUPONS_TEXT}"
    commands:
      - tapOn: "${BROWSE_OTHER_COUPONS_TEXT}"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: "iv_back"
          commands:
            - tapOn:
                id: "iv_back"
            - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 60000

# ---------------- [10-2] couponCode 파라미터가 아예 없는 링크 ----------------
# 깨진 링크(파라미터 유실)로 앱이 죽지 않는지. 기대 동작이 "아무 일도 안 일어남"일 수 있어
#   **오류 팝업을 요구하지 않는다** — 앱이 살아서 홈에 있으면 통과다.
- openLink:
    link: "gmeremit://gmeremit.coupon.redeem"
# ⛔ 기기에 GME 빌드가 3개 깔려 있어 **앱 선택 다이얼로그**가 먼저 뜬다(2026-11-04 실측)
- runFlow: "../../Old/_pick_app_from_chooser_old.yaml"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "${COUPON_ERROR_ANY_MSG}"
    commands:
      - takeScreenshot: "[10-2]_파라미터없음_오류안내"
      - runFlow:
          when:
            visible: "${BROWSE_OTHER_COUPONS_TEXT}"
          commands:
            - tapOn: "${BROWSE_OTHER_COUPONS_TEXT}"
            - waitForAnimationToEnd
            - runFlow:
                when:
                  visible:
                    id: "iv_back"
                commands:
                  - tapOn:
                      id: "iv_back"
                  - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 60000
- takeScreenshot: "[10-2]_깨진링크_앱생존"

# ================================================================
# [01] [High] 유효한 쿠폰 링크 (Happy Path) — ⚠️ **비멱등**
# ================================================================
# ⛔ 한 번 돌면 그 코드는 소모된다(1회 한정 쿠폰). 그래서 **코드를 줬을 때만** 돈다.
#   다음 실행에서 같은 코드를 쓰면 [05] 의 중복 케이스가 된다.
# ⚠️ 발급 완료 팝업의 **버튼 문구/ id 는 미확인**이다(APK 에 문구만 있고 레이아웃 연결을 못 봤다).
#   그래서 팝업 문구만 단언하고, 쿠폰함은 **딥링크로 직접 열어** 확인한다.
#   실기기에서 버튼을 확인하면 그 경로로 바꿀 것.
- runFlow:
    when:
      true: ${typeof COUPON_CODE_VALID !== 'undefined' && COUPON_CODE_VALID.length > 0}
    commands:
      - openLink:
          link: "${DEEPLINK_COUPON_REDEEM}${COUPON_CODE_VALID}"
      # ⛔ 기기에 GME 빌드가 3개 깔려 있어 **앱 선택 다이얼로그**가 먼저 뜬다(2026-11-04 실측)
      - runFlow: "../../Old/_pick_app_from_chooser_old.yaml"
      - extendedWaitUntil:
          visible: "${COUPON_REDEEMED_MSG}"
          timeout: 60000
      - takeScreenshot: "[01]_쿠폰발급_팝업"
      # 팝업을 닫는다 — 확인 버튼의 id 가 확정되기 전까지 알려진 후보만 조건부로 누른다.
      - runFlow:
          when:
            visible:
              id: "btn_diaog_ok"
          commands:
            - tapOn:
                id: "btn_diaog_ok"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "${BROWSE_OTHER_COUPONS_TEXT}"
          commands:
            - tapOn: "${BROWSE_OTHER_COUPONS_TEXT}"
            - waitForAnimationToEnd
      # 쿠폰함 Available 탭에 들어왔는지 — 딥링크로 직접 연다(버튼 경로와 독립).
      - openLink:
          link: "${DEEPLINK_COUPON_BOX}"
      # ⛔ 기기에 GME 빌드가 3개 깔려 있어 **앱 선택 다이얼로그**가 먼저 뜬다(2026-11-04 실측)
      - runFlow: "../../Old/_pick_app_from_chooser_old.yaml"
      - extendedWaitUntil:
          visible:
            id: "rvCouponCategories"
          timeout: 30000
      - assertVisible:
          id: "toolbar_title"
          text: "${SCR_COUPON_BOX}"
      - assertVisible: "${COUPON_TAB_AVAILABLE}"
      # ⚠️ "그 쿠폰이 들어왔다"를 쿠폰 **이름**으로 보려면 쿠폰명을 알아야 한다.
      #   어드민에서 만든 이름을 `-ExtraEnv COUPON_NAME_VALID=...` 로 주면 그것까지 본다.
      - runFlow:
          when:
            true: ${typeof COUPON_NAME_VALID !== 'undefined' && COUPON_NAME_VALID.length > 0}
          commands:
            - scrollUntilVisible:
                element:
                  text: "${COUPON_NAME_VALID}"
                direction: DOWN
                timeout: 25000
                visibilityPercentage: 20
            - assertVisible: "${COUPON_NAME_VALID}"
      - takeScreenshot: "[01]_쿠폰함_Available"
      - tapOn:
          id: "iv_back"
      - waitForAnimationToEnd
      - runFlow:
          when:
            notVisible:
              id: "bottom_item_home"
          commands:
            - pressKey: back
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "bottom_item_home"
          timeout: 60000

# ================================================================
# 종료 상태: 로그인된 홈. 다음 플로우가 그대로 이어받을 수 있다.
# ================================================================
