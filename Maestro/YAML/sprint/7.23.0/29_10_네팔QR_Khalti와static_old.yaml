appId: ${APP_ID}
env:
  # ⛔⛔ **갤러리 좌표는 기기 상태에 따라 바뀐다. 돌리기 전에 확인할 것.**
  #   adb shell "ls -lt /sdcard/Pictures | head -7"
  # 3열 그리드(최신순): 열 x = 17% / 50% / 83%, 행 y = 48% / 64% / 79%
  #
  # 2026-11-13 **픽스처 푸시 후**: 1=변조본 2=KHQR 3=손상본 | 4=네팔 은행 5=Khalti
  #   → 네팔 QR 2장이 2행으로 내려갔다. 픽스처를 지우면 1행으로 돌아온다.
  # ⛔ `--env` 로는 못 바꾼다 — flow-level `env:` 가 CLI `--env` 를 덮어쓴다.
  GAL_BANK: "17%, 64%"
  GAL_KHALTI: "50%, 64%"
  BANK_NAME: "SAPHAL SHRESTHA"
  # 2026-11-13 실측: `storename_value` = "Abhishek Shrestha" — QR payload 의 name 과 일치.
  #   ⚠️ 다만 IME QrValidation 이 돌려준 AccountName 과 같은 값인지는 화면으로 구분할 수 없다.
  KHALTI_NAME: "Abhishek Shrestha"
---
# ================================================================
# 시나리오: 네팔 QR Pay — **Khalti Wallet QR / 개인계좌 static QR**
# 출처: DRF-S2-1 v1.4 정책 2-r(Khalti Wallet 포함 BankDeposit) · 2-t(개인계좌 static QR만)
# 커버: TC-NPL-001(Khalti Wallet 90256) · TC-NPL-007(Valid Static QR)
# ================================================================
# ⚠️ **거래는 생성되지 않는다.** 결제 화면(N3) 도달까지만 본다.
#
# ⛔ **두 케이스 모두 기대의 일부가 화면 밖이다.** 2026-11-12 에 기대 결과를 정정했다
#   (시트 N9·N15 참고). 화면에서 볼 수 있는 것만 여기서 단언한다:
#     · TC-001 기대 2·3(Institution Code=90256, Institution Name=Khalti Wallet)
#       → **QrValidation 응답 전문**에서 본다. 결제 화면(N3)은 수취인명만 한 줄 보여 준다(정책 2-e).
#     · TC-001 기대 6 / TC-007 기대 3(영수증 계좌번호) → **영수증(N7)** 에서 본다.
#   → 이 파일만으로 두 케이스를 Pass 로 적지 말 것. 전문·영수증 확인이 남는다.
#
# ⛔ **Khalti QR 의 수취인명은 payload 와 다를 수 있다.**
#   QR payload: {"Khalti_ID": "9801308789", "name": "Abhishek Shrestha"}
#   그런데 화면에 뜨는 것은 **IME QrValidation 이 돌려준 AccountName** 이다(정책 2-e).
#   둘이 같다는 보장이 없어 성(`Shrestha`)만 느슨하게 본다. 첫 실행 덤프로 좁힐 것.
#
# ⚠️ **갤러리 좌표 의존.** 이미지가 2장 추가되면 칸이 한 줄 밀린다.
#   그래서 두 케이스 모두 **수취인명이 서로 다른지**로 자기검증한다.
#
# 실행:
#   .\run_test.ps1 -lang ko -User Basshu -Server stag -flow "sprint\7.23.0\29_10_네팔QR_Khalti와static_old.yaml"
#
# 케이스
#   [01] [High] 개인계좌 static QR → 수취인명·진행 가능        TC-NPL-007
#   [02] [High] Khalti Wallet QR → 수취인명·오류 없음          TC-NPL-001
# ================================================================

- runFlow: "../../Old/_common_entry_old.yaml"

# ---------------- 공통: 홈 QR → 네팔 → 스캐너 ----------------
- scrollUntilVisible:
    element:
      id: "qrScan"
    direction: UP
    timeout: 20000
    centerElement: false
- tapOn:
    id: "qrScan"
- waitForAnimationToEnd
- tapOn:
    id: "btnTransfer"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "llQrContainer"
    timeout: 20000
- tapOn:
    id: "llQrContainer"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "rvCountryList"
    timeout: 20000
- tapOn:
    id: "countryNameTxt"
    text: "Nepal[\\s\\S]*NPR[\\s\\S]*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "exRateCalculateButton"
    timeout: 30000
- tapOn:
    id: "exRateCalculateButton"
- waitForAnimationToEnd
- runFlow: "../../Old/_allow_permission_old.yaml"
- extendedWaitUntil:
    visible:
      id: "galleryImagePick"
    timeout: 30000

# ================================================================
# [01] [High] 개인계좌 static QR (TC-NPL-007)
# ================================================================
# DRF 2-t: 개인 계좌의 **static QR 만** 받는다(금액 없는 QR). 이 은행 QR 이 그 경우다.
- runFlow:
    file: _qr_pick_from_gallery_old.yaml
    env:
      GAL_POINT: ${GAL_BANK}

- extendedWaitUntil:
    visible:
      text: "[\\s\\S]*(${BANK_NAME}|지원하지 않|오류|Error|다시 시도)[\\s\\S]*"
    timeout: 90000
# ★ 기대 4 — QR Validation 성공. 실패 경로를 명시적으로 배제한다.
- assertNotVisible:
    text: "[\\s\\S]*(지원하지 않|다시 시도)[\\s\\S]*"
# ★ 기대 1 — Account Name 이 한 줄로 표시된다.
- assertVisible:
    id: "storename_value"
    text: "${BANK_NAME}"
# ★ static QR 이므로 **금액이 넘어오지 않아야 한다**(정책 2-t: 금액 없는 QR).
#   키보드가 올라와 있어도 `amount` 는 트리에 있으므로 이 단언은 먼저 해도 된다.
- assertVisible:
    id: "amount"
- assertNotVisible:
    id: "amount"
    text: "[\\s\\S]*\\d[\\s\\S]*"
- takeScreenshot: "[01]_static QR_수취인"

# ★ 기대 5 — 송금 진행이 가능하다(다음 버튼이 살아 있다).
# ⛔ **N3 는 도착 시 금액 입력란에 자동 포커스되어 키패드가 올라와 있고, 그동안
#   `btnConfirm` 은 접근성 트리에 없다**(2026-11-13 실측 — 이 파일이 그래서 죽었다).
#   → 키패드 [완료]를 눌러 내린 뒤에 본다.
# ⛔ `hideKeyboard` 를 쓰지 말 것 — 키보드가 이미 내려갔으면 BACK 으로 동작해 화면을 벗어난다.
# ⚠️ 금액을 넣지 않은 채 [완료]를 누른다. 빈 값 안내가 뜰 수는 있으나 이 케이스의 판정
#   대상이 아니다. 뜨면 스크린샷에 남으니 사람이 보고 별도로 판단할 것.
- runFlow:
    when:
      visible:
        text: "완료"
    commands:
      - tapOn:
          text: "완료"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnConfirm"
    timeout: 15000

# ================================================================
# [02] [High] Khalti Wallet QR (TC-NPL-001)
# ================================================================
# 스캐너로 돌아간다
- repeat:
    times: 4
    while:
      notVisible:
        id: "galleryImagePick"
    commands:
      - back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "galleryImagePick"
    timeout: 30000
- assertVisible:
    id: "countryCode"
    text: "Nepal"

- runFlow:
    file: _qr_pick_from_gallery_old.yaml
    env:
      GAL_POINT: ${GAL_KHALTI}

- extendedWaitUntil:
    visible:
      text: "[\\s\\S]*(${KHALTI_NAME}|지원하지 않|오류|Error|다시 시도)[\\s\\S]*"
    timeout: 90000
- takeScreenshot: "[02]_Khalti QR_수취인"
# 화면에 실제로 어떤 이름이 오는지 떠 둔다 — payload 의 name 과 다를 수 있다
- tapOn:
    id: "__dump_khalti__"
    optional: true

# ★ 기대 1·7 — QrValidation 성공 응답, 오류 메시지 미노출.
#   정책 2-r: Khalti Wallet 도 BankDeposit 으로 처리된다 → 결제 화면까지 가야 한다.
- assertNotVisible:
    text: "[\\s\\S]*(지원하지 않|다시 시도)[\\s\\S]*"
# ★ 기대 4 — Account Name 이 정상 표시된다.
- assertVisible:
    id: "storename_value"
# ⛔ **자기검증** — 은행 QR 과 다른 수취인이어야 한다. 같으면 좌표가 밀려 1번 칸을 또 집은 것이다.
- assertNotVisible:
    id: "storename_value"
    text: "${BANK_NAME}"
- assertVisible:
    id: "storename_value"
    text: "[\\s\\S]*${KHALTI_NAME}[\\s\\S]*"
# ★ 기대 8 — 다음 단계로 진행 가능하다.
# ⛔ [01] 과 같은 이유로 키패드를 먼저 내린다(올라와 있으면 `btnConfirm` 이 트리에 없다).
- runFlow:
    when:
      visible:
        text: "완료"
    commands:
      - tapOn:
          text: "완료"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnConfirm"
    timeout: 15000

# ---------------- 정리: 홈으로 돌아간다 ----------------
# ⛔ `bottom_item_home` 이 **보이는 것**은 홈이라는 뜻이 아니다 — 하단 탭 버튼이라
#   거래내역·카드 어디서나 보인다(2026-11-13 실측 사고). 헬퍼가 **눌러서** 홈으로 간다.
- runFlow: "_return_home_old.yaml"
