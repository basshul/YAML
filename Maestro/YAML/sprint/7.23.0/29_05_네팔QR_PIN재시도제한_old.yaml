appId: ${APP_ID}
env:
  QR_AMOUNT_NPR: "1200"
  QR_RECIPIENT: "SAPHAL SHRESTHA"
---
# ================================================================
# 시나리오: 네팔 QR Pay — **결제 인증 PIN 재시도 제한** (N5)
# 출처: DRF-S2-1 v1.4 8장 7단계 / 9장 N5
# 커버: TC-NPL-025 (PIN 재시도 제한)
# ================================================================
# ⛔⛔ **이 파일은 간편비밀번호를 초기화시킨다. 끝에서 스스로 복구한다.**
#   근거: `Old\01_02_로그인_간편비번오류5회_old.yaml` 머리말(2026-09-02 사용자 확정) —
#   간편비밀번호 5회 오입력의 결과는 **"계정 잠금" 이 아니라 "로그아웃"** 이다.
#   복구는 ID/비밀번호 재로그인 + 신규 PIN 재등록이고 admin 개입이 필요 없다.
#   ⚠️ **혼동 금지** — 계정 잠금은 **로그인 비밀번호** 5회 오입력이다(`01_04`, admin 해제 필요).
#
# ⛔ **스위트에서는 이 파일을 맨 뒤에 두거나 단독으로 돌릴 것.**
#   중간에 두면 뒤 플로우가 로그아웃 상태를 물려받는다. [04][05] 가 복구하지만
#   복구 실패 시 그 뒤가 전부 무너진다.
#
# ⛔ **로그인은 5회 제한이고 그건 계정 잠금이다.** [04] 의 로그인은 **1회만** 시도한다.
#   실패하면 [05] 대기가 타임아웃되며 시끄럽게 실패한다 — 조용히 시도를 더 태우는 것보다 낫다.
#   (`01_02` 가 같은 이유로 재시도 블록을 제거했다)
#
# ⚠️ **N5 는 아직 실측하지 않았다.** 결제 인증 화면이 로그인 잠금화면과 같은 다이얼로그
#   (`txt_dialog_title` / `txt_dialog_message` / `btn_diaog_ok`)를 쓰는지 **확인 전**이다.
#   그래서 [03] 은 **두 경로를 모두 받는다**: 다이얼로그가 뜨면 닫고, 안 뜨면 문구만 본다.
#   첫 실행은 검증 겸 **측정**이다. 덤프를 떠서 다음 판에 좁힐 것.
#
# ⚠️ **거래는 생성되지 않는다.** 5회를 채우면 인증을 통과하지 못하므로 결제가 성립하지 않는다.
#   다만 PENDING 잔재가 남는지는 확인된 바 없다 → 실행 후 송금 내역을 사람이 한 번 볼 것.
#
# 실행:
#   .\run_test.ps1 -lang ko -User Basshu -Server stag -flow "sprint\7.23.0\29_05_네팔QR_PIN재시도제한_old.yaml"
#
# 전제:
#   · stag(gmeuat) 계정 로그인 + 간편비밀번호가 `PIN_NORMAL` 과 동일
#   · 갤러리 최신 이미지가 네팔 은행 QR(`SAPHAL SHRESTHA`)
#   · 프로파일에 `PIN_WRONG`·`PW_K*` 가 있을 것
#
# 케이스
#   [01] 진입 → QR 업로드 → N3 → N4 → Pay → 인증 화면
#   [02] [High] 잘못된 PIN **5회** 입력, 매 회 실패 성립 확인      TC-NPL-025
#   [03] [High] 제한 도달 안내 확인(차단 또는 초기화)                TC-NPL-025
#   [04] 복구 — ID/비밀번호 재로그인
#   [05] 복구 — 간편비밀번호 재등록
# ================================================================

- runFlow: "../../Old/_common_entry_old.yaml"

# ================================================================
# [01] 진입 → QR 업로드 → N3 → N4 → Pay → 인증 화면
# ================================================================
- scrollUntilVisible:
    element:
      id: "qrScan"
    direction: UP
    timeout: 20000
    centerElement: false
- tapOn:
    id: "qrScan"
- waitForAnimationToEnd
- tapOn:
    id: "btnTransfer"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "llQrContainer"
    timeout: 20000
- tapOn:
    id: "llQrContainer"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "rvCountryList"
    timeout: 20000
- tapOn:
    id: "countryNameTxt"
    text: "Nepal[\\s\\S]*NPR[\\s\\S]*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "exRateCalculateButton"
    timeout: 30000
- tapOn:
    id: "exRateCalculateButton"
- waitForAnimationToEnd
- runFlow: "../../Old/_allow_permission_old.yaml"

- extendedWaitUntil:
    visible:
      id: "galleryImagePick"
    timeout: 30000
# ⛔ 갤러리 좌표는 기기 상태에 따라 바뀐다 — 돌리기 전에 확인할 것(29_04 의 같은 자리 주석 참고).
#   2026-11-13 픽스처 푸시 후 네팔 은행 QR 은 **2행 1열 (17%, 64%)** 이다.
- runFlow:
    file: _qr_pick_from_gallery_old.yaml
    env:
      GAL_POINT: "17%, 64%"

- extendedWaitUntil:
    visible:
      text: "[\\s\\S]*(${QR_RECIPIENT}|지원하지 않|오류|Error)[\\s\\S]*"
    timeout: 90000
- assertVisible:
    id: "storename_value"
    text: "${QR_RECIPIENT}"

- tapOn:
    id: "amount"
- waitForAnimationToEnd
- inputText: "${QR_AMOUNT_NPR}"
- waitForAnimationToEnd
# ⛔ 키패드 [완료] 를 누른다 — `hideKeyboard`(BACK)는 `IME_ACTION_DONE` 을 쏘지 않아
#   검증이 돌지 않는다. 근거와 경위는 29_04 의 같은 자리 주석 참조.
# ⛔ `hideKeyboard` 대체 분기를 두지 말 것 — 키보드가 이미 내려갔으면 BACK 으로 동작해
#   화면을 벗어난다(2026-11-13 실측, 29_04 주석 참조).
- runFlow:
    when:
      visible:
        text: "완료"
    commands:
      - tapOn:
          text: "완료"
      - waitForAnimationToEnd
# ⛔ 키보드가 내려가야 `btnConfirm` 이 트리에 나타난다(N3 는 도착 시 자동 포커스된다).
- extendedWaitUntil:
    visible:
      id: "btnConfirm"
    timeout: 15000
- repeat:
    times: 4
    while:
      notVisible:
        id: "design_bottom_sheet"
    commands:
      - tapOn:
          id: "btnConfirm"
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "design_bottom_sheet"
    timeout: 60000
- assertVisible:
    id: "deductingAc"
    text: "GME Wallet"

- tapOn:
    id: "confirmBtn"
- waitForAnimationToEnd
- runFlow: "../../Old/_dismiss_biometric_prompt_old.yaml"
- extendedWaitUntil:
    visible:
      id: "input_dot_1"
    timeout: 60000
- takeScreenshot: "[01]_인증화면"

# ================================================================
# [02] [High] 잘못된 PIN 5회 (TC-NPL-025)
# ================================================================
# ⚠️ PIN 1회 = 4탭이므로 아래는 **20탭**이다. 탭 수만 보고 "20회" 로 오해하지 말 것.
# ★ 매 회 실패 성립을 본다 — 틀린 PIN 을 5번 넣기만 하고 실패 안내를 보지 않으면
#   커버리지 착시가 된다(01_02 가 같은 이유로 회차 단언을 넣었다).
# ⚠️ 회차 숫자를 박지 않는다. 화면 글자가 직전 값을 보일 때가 있다(01_02 실측).
# ✅ 2026-11-13 실측 확정 — N5 도 로그인 잠금화면과 같은 형식이다.
#   '비밀번호가 맞지 않습니다. 1/5'  ⛔ **id 가 없어 text 로만 잡힌다.**
- runFlow:
    file: ../../Old/_enter_pin_old.yaml
    env:
      PIN: ${PIN_WRONG}
- extendedWaitUntil:
    visible:
      text: "[\\s\\S]*비밀번호가 맞지 않습니다[\\s\\S]*\\d/5[\\s\\S]*"
    timeout: 20000
- takeScreenshot: "[02-1]_오입력_1회"
- tapOn:
    id: "__dump_pin_error_1__"
    optional: true

- runFlow:
    file: ../../Old/_enter_pin_old.yaml
    env:
      PIN: ${PIN_WRONG}
- waitForAnimationToEnd
- runFlow:
    file: ../../Old/_enter_pin_old.yaml
    env:
      PIN: ${PIN_WRONG}
- waitForAnimationToEnd
- runFlow:
    file: ../../Old/_enter_pin_old.yaml
    env:
      PIN: ${PIN_WRONG}
- waitForAnimationToEnd
- runFlow:
    file: ../../Old/_enter_pin_old.yaml
    env:
      PIN: ${PIN_WRONG}
- waitForAnimationToEnd

# ================================================================
# [03] [High] 제한 도달 안내 (TC-NPL-025 기대 1~4)
# ================================================================
# ⛔ 다이얼로그가 뜨면 **닫기 전에** 판정한다. 닫고 보면 문구가 이미 사라져 있다(01_02 교훈).
# ⚠️ 결제 인증 화면이 로그인 잠금화면과 같은 다이얼로그를 쓰는지 확인 전 → 두 경로를 모두 받는다.
- extendedWaitUntil:
    visible:
      text: "[\\s\\S]*(5번 이상|5회|초과|초기화|로그인해 주세요|차단|잠금|Exceed|locked)[\\s\\S]*"
    timeout: 30000
- takeScreenshot: "[03]_재시도제한_안내"
- tapOn:
    id: "__dump_limit_dialog__"
    optional: true

# ★ 기대 3 — 추가 입력 차단 또는 인증 잠금. 결제가 진행되지 않았어야 한다.
- assertNotVisible:
    text: "[\\s\\S]*(성공|완료|영수증|Success|Receipt)[\\s\\S]*"

# 다이얼로그가 있으면 닫는다(없으면 SKIP)
- runFlow:
    when:
      visible:
        id: "btn_diaog_ok"
    commands:
      - tapOn:
          id: "btn_diaog_ok"
      - waitForAnimationToEnd

# ================================================================
# [04] 복구 — ID/비밀번호 재로그인 (⛔ 1회만)
# ================================================================
# 로그아웃됐으면 보안 키보드가 뜬다. 안 뜨면(차단만 되고 세션 유지) 이 블록은 SKIP 된다.
- runFlow:
    when:
      visible:
        id: "securityKeyboardEditText"
    commands:
      - tapOn:
          id: "securityKeyboardEditText"
      # ⛔ `transKeypad_row4` 를 누르지 말 것 — 행 컨테이너를 누르면 문자가 하나 섞인다(01_02 사고).
      - runFlow: "../../Old/_enter_login_pw_old.yaml"

# ================================================================
# [05] 복구 — 간편비밀번호 재등록
# ================================================================
- runFlow:
    when:
      visible: "${LOCK_CREATE_PROMPT}"
    commands:
      - runFlow:
          file: ../../Old/_enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
      # 재입력 화면 도달 확정 — 이전 화면에도 input_dot_1 이 있어 id 로는 전환을 판정할 수 없다
      - extendedWaitUntil:
          visible: "${LOCK_REENTER_PROMPT}"
          timeout: 20000
      - runFlow:
          file: ../../Old/_enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
      - runFlow:
          when:
            visible:
              id: "btnOk"
          commands:
            - tapOn:
                id: "btnOk"
            - waitForAnimationToEnd

# ---------------- 정리: 홈 복귀를 확인한다 ----------------
# ★ 복구가 됐는지 여기서 확정한다. 못 돌아오면 다음 플로우가 전부 무너지므로 **시끄럽게 실패**한다.
# ⛔ `bottom_item_home` 이 **보이는 것**은 홈이라는 뜻이 아니다 — 하단 탭 버튼이라
#   거래내역·카드 어디서나 보인다(2026-11-13 실측 사고). 헬퍼가 **눌러서** 홈으로 가고
#   `qrScan` 까지 스크롤해 홈임을 확정한다. 이 파일은 로그아웃 뒤 복구를 검증하므로
#   그 확정이 특히 중요하다.
- runFlow: "_return_home_old.yaml"
- takeScreenshot: "[05]_복구완료_홈"
