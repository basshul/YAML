appId: ${APP_ID}
---
# ================================================================
# 헬퍼: **홈 화면으로 확실히 돌아간다.**
# ================================================================
# 호출:
#   - runFlow: "_return_home_old.yaml"
#
# ⛔⛔ **`bottom_item_home` 이 "보이는 것" 은 홈이라는 뜻이 아니다.**
#   그건 하단 네비게이션의 **홈 버튼**이라 거래내역·카드·이벤트 탭 어디서나 보인다.
#   2026-11-13 실측 사고: 정리 루프가 **거래 내역 탭**에서 멈췄는데
#   `assertVisible: bottom_item_home` 이 **통과**했고, 다음 플로우가 홈인 줄 알고
#   `qrScan` 을 찾다가 죽었다. 원인이 두 단계 떨어져 있어 진단이 어려웠다.
#   → **보는 것으로 끝내지 말고 눌러서** 홈으로 간다.
#
# ⛔ 홈 복귀 직후 **프로모션 팝업**이 화면을 덮는다(2026-11-13 실측).
#   트리에 `1/1` · `열기` · `닫기` 만 남고 홈 요소가 통째로 사라진다.
#   ⚠️ **`열기` 를 누르면 외부 페이지로 나간다** — `닫기` 만 누른다.
#     그래서 `^닫기$` 로 **전체 매칭**한다(`닫기` 부분 매칭은 다른 버튼을 잡을 수 있다).
#
# ⚠️ 홈 도달 판정에 `btnTransfer` 를 쓰지 않는다 — 구 UI 홈은 스크롤 위치를 유지해
#   상단 카드가 화면 밖일 수 있다(`_common_entry_old.yaml` 의 같은 경고).
#   대신 **`qrScan` 까지 스크롤**해서 홈임을 확인한다. 스크롤이 위치 문제를 흡수한다.
# ================================================================

# 1) 서브 화면에서 빠져나온다(하단 탭이 보일 때까지)
#
# ⛔ **QR 흐름(스캐너·가이드 등)에서 `back` 을 누르면 확인창이 끼어든다.**
#   "결제를 취소하시겠습니까?" / [예] [아니요]
#   `back` 만 반복하면 **이 창에서 빠져나오지 못하고 앱이 걸린 채 남는다**
#   (2026-11-16 실측 — 가이드에서 겪었고, 별도 플로우로 복구해야 했다).
#   → 루프 안에서 **그 문구를 확인한 뒤에만** [예] 를 누른다.
#   ⚠️ "예" 를 무조건 누르지 말 것 — 다른 화면의 확인창을 삼킬 수 있다.
#     반드시 **제목 문구로 범위를 좁혀** 누른다.
#   ⚠️⚠️ **이 분기는 아직 실제로 타 본 적이 없다**(2026-11-16).
#     추가 후 세 가지 경로로 재현을 시도했으나(가이드 얕게/깊게, 국가 선택 시트) **확인창이 안 떴다**
#     — 세 번 다 SKIPPED 였고 홈 복귀는 정상이었다. 즉 **오발하지 않는 것만 확인됐다.**
#
#   🔧 **확인 방법은 이미 있다 — 실행 로그를 보면 된다.**
#     이 `runFlow … when` 은 로그에 **SKIPPED** 로 찍힌다.
#     어느 플로우에서든 **COMPLETED 로 바뀌는 순간이 이 분기가 처음 작동한 때**다.
#     그때 **직전 단계들이 곧 재현 조건**이므로 반드시 적어 둘 것.
#     (그냥 두면 걸려도 "아 떴네" 로 끝나고 조건을 또 놓친다)
#
#   ❓ **추측(측정 아님)**: 원래 걸렸을 때가 `iv_cancel`·`back` 을 섞어 8회 돌린 뒤였고
#     얕은 진입 세 번으로는 재현되지 않았다 → **누적 백스택 깊이**가 조건일 수 있다.
#     확인된 바 없으므로 근거로 쓰지 말 것.
- repeat:
    times: 8
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - runFlow:
          when:
            visible:
              text: "[\\s\\S]*결제를 취소하시겠습니까[\\s\\S]*"
          commands:
            - tapOn:
                text: "^예$"
            - waitForAnimationToEnd
      - back
      - waitForAnimationToEnd

# 2) ★ 눌러서 홈으로 간다 — 보이는 것만으로는 어느 탭인지 알 수 없다
- tapOn:
    id: "bottom_item_home"
- waitForAnimationToEnd

# 3) 팝업 큐를 비운다(배너·안내 5종 × 최대 6회)
- runFlow: "../../Old/_dismiss_popups_stag_old.yaml"

# 4) 프로모션 팝업 — `닫기` 만 누른다. `열기` 는 외부 페이지로 나간다.
- runFlow:
    when:
      visible:
        text: "^닫기$"
    commands:
      - tapOn:
          text: "^닫기$"
      - waitForAnimationToEnd

# 5) ★ 홈 도달 확정 — `qrScan` 이 있으면 홈이다(스크롤로 위치 문제를 흡수한다)
- scrollUntilVisible:
    element:
      id: "qrScan"
    direction: UP
    timeout: 30000
    centerElement: false
