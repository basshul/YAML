appId: ${APP_ID}
---
# ================================================================
# 헬퍼: 스캐너에서 **갤러리 이미지를 골라 업로드**한다.
# ================================================================
# 호출(호출자가 `GAL_POINT` 를 넘긴다 — 3열 그리드 좌표):
#   - runFlow:
#       file: _qr_pick_from_gallery_old.yaml
#       env:
#         GAL_POINT: "17%, 48%"
#
# ⚠️ 헤더에 `env:` 기본값을 두지 않는다 — 플로우 레벨 기본값은 호출자가 넘긴 값을 **덮어쓴다**
#   (`_enter_pin_old.yaml` 이 같은 이유로 기본값을 뺐다).
#
# ⛔ **전제: 스캐너 화면(`galleryImagePick` 보임)에 있어야 한다.** 도달 대기는 호출자 몫이다.
#
# ⚠️ **OS 마다 사진 선택 도구가 다르다**(06_회원가입 머리말, 2026-09-09 SM-S911N 실측).
#   · 구 기기: 삼성 갤러리 — 썸네일 id `icon_thumbnail` + index
#   · Android 16: 시스템 사진 피커(Compose) — resource-id 가 없고 접근성 라벨도 안 잡힌다
#                 → **좌표 탭만 가능**
#
# ⛔ **Android 16 시스템 선택기는 탭이 곧 확정이 아니다.** 탭하면 "1" 선택 상태가 될 뿐이고
#   **`완료`** 를 눌러야 앱으로 돌아온다. 삼성 갤러리는 단일 탭에 닫힌다.
#   안 누르면 선택기가 열린 채 남고 **다음 실행의 `launchApp` 까지 깨진다**
#   (앱 태스크 위에 선택기가 복원된다 — 2026-11-12 실제 사고).
#
# ⛔ 업로드 뒤 "스캐너로 돌아왔는지"(`scanToPay`)를 보지 말 것 — 오류가 **바텀시트**로 뜨면
#   스캐너 요소를 덮어 접근성 트리에서 사라진다. 정상 동작을 실패로 잡는다(2026-11-12 실측).
#   도달 판정은 **호출자가** 수취인명·오류 문구로 한다.
#
# ⚠️ 좌표로 고르므로 **무엇이 집혔는지 이 헬퍼는 모른다.** 호출자가 반드시 결과로 검증할 것
#   (수취인명 단언 등). 갤러리에 이미지가 2장 추가되면 칸이 한 줄씩 밀린다.
# ================================================================

- tapOn:
    id: "galleryImagePick"
- waitForAnimationToEnd
- runFlow: "../../Old/_allow_permission_old.yaml"

# 선택기가 떴는지 — 피커 종류를 가리지 않는 판정: 스캐너 화면을 **벗어났는지**로 본다
- extendedWaitUntil:
    notVisible:
      id: "galleryImagePick"
    timeout: 30000
- waitForAnimationToEnd

# ⚠️ **좌표 하나로 통일한다.** 삼성 갤러리는 `icon_thumbnail` + index 로도 집을 수 있지만,
#   그리드 배치가 시스템 선택기와 달라 **같은 index 가 같은 사진을 가리키지 않는다.**
#   두 체계를 한 변수로 섞으면 어느 쪽이 집혔는지 알 수 없게 된다 → 좌표만 쓴다.
#   삼성 갤러리를 써야 하면 그 화면의 그리드를 따로 실측해 좌표표를 만들 것.
- tapOn:
    point: ${GAL_POINT}
- waitForAnimationToEnd

# 시스템 선택기의 확정 버튼. 삼성 갤러리에는 없어 통째로 SKIP 된다.
- runFlow:
    when:
      visible:
        text: "완료|Done|Add|추가"
    commands:
      - tapOn:
          text: "완료|Done|Add|추가"
      - waitForAnimationToEnd
