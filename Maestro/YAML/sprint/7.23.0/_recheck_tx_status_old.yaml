appId: ${APP_ID}
env:
  # 2026-11-16 12:05 생성, 그 시점 상태 "처리 중"(= PENDING/RELEASED 계열).
  # 이 행이 보는 것은 **상태가 갱신되는가**다. 새 거래가 필요 없다.
  CONTROL_NO: "80695186313"
---
# ================================================================
# TC-NPL-054 상태 동기화 재조회 — 읽기 전용
# ================================================================
# ⛔ 거래를 만들지 않는다. 기존 거래를 열어 상태만 본다.
# ⛔ `-ExtraEnv` 로 CONTROL_NO 를 넘기지 말 것 — flow env 를 덮지 못해
#   엉뚱한 거래를 열 수 있다(2026-11-13 사고). 이 파일의 env 로 고정한다.
#
# 실행:
#   .\run_test.ps1 -lang ko -User Basshu -Server stag -flow "sprint\7.23.0\_recheck_tx_status_old.yaml"
# ================================================================

- runFlow: "../../Old/_common_entry_old.yaml"

- runFlow:
    file: _open_tx_detail_old.yaml
    env:
      CONTROL_NO: ${CONTROL_NO}

- takeScreenshot: "[S1]_상세내역_재조회"
# 담을 것: `txvStatusValue`(상태) · `txvControlNoValue` · `tvTransactionDateValue`
- tapOn:
    id: "__dump_s1_status__"
    optional: true

# ⛔ 올바른 거래를 열었는지 확정한다.
- assertVisible:
    id: "txvControlNoValue"
    text: "${CONTROL_NO}"

- runFlow: "_return_home_old.yaml"
