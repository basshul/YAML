appId: ${APP_ID}
---
# ================================================================
# 13_해외송금받기_분할전원본 분할 7/7 — Inbound Request Status
# ================================================================
# 2026-09-07 분할. 원본 `13_해외송금받기_분할전원본_old.yaml`(20케이스 / 통짜 약 42분)은 실행이
# **10분 포그라운드 한도**를 넘어 백그라운드로 전환되고, 그 뒤 외부에서 종료되는 일이
# 반복됐다(9/7 실측: 백그라운드 전환 7건 중 6건 종료 / 10분 미만 실행은 전부 완주).
# → 각 조각이 10분 안에 끝나도록 잘랐다. 합계는 약 48분으로 통짜보다 6분 늘지만
#   (공통 진입이 1회→7회), 끊김이 사라지고 실패해도 손실이 조각 하나로 제한된다.
#
# ⚠️ **순서 의존 — 반드시 13_01 → 13_02 → … → 13_07 순으로 돈다.**
#   데이터 사슬: 01~03이 송금인 3국을 등록 → 04가 **인도네시아**로 송금요청 신청 →
#   05가 **베트남** 송금인 정보 수정 → 06이 등록된 송금인을 **전부 삭제** →
#   07은 04가 만든 **요청**의 상태 화면을 본다(송금인과 무관해 06 뒤라도 성립).
#
# 이 파일: [15]~[20] — 요청 카드/디테일/이력/공유/결제 연결
#   예상 약 5분 / 전제: **13_04 완료** — [12]가 만든 인바운드 Request(72시간 만료)가 있어야 카드 목록이 뜬다. 송금인과는 무관하므로 13_06 뒤여도 성립
# ================================================================

# ================================================================
# 시나리오: Receive Overseas Funds (Inbound)
# ================================================================
# 케이스 전환: 이전 케이스가 끝난 화면에서 바로 다음 케이스를 이어서 진행한다(Home 왕복 없음).
# ⚠️ 예외 — [15]~[20](Inbound Request Status)은 "해외송금 받기"를 **Home에서 새로 탭해야만**
#   "받는 계좌" 카드 목록이 노출되는 구조다. 그래서 [13]->[15] 전환과 [18]->[19]->[20] 사이는
#   Home 경유가 필요하다. [20]은 실제 결제 페이지로 연결되므로 내비게이션 스택을 확신할 수
#   없는 구간은 보수적으로 Home으로 리셋한다.

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 ----------------
# ⚠️ 종전에는 이 72줄이 파일마다 복붙돼 있었다(8개 파일 바이트 동일, 2026-11-02 측정).
#   진입부에 처리를 더할 때 여기를 고치면 **부르는 파일 전부**에 반영된다.
- runFlow: "_common_entry_old.yaml"

# ----------------------------------------------------------------
# [15]~[20] Inbound Request Status - 진입 경로 재발견 (2026-07-08 실기기 확인)
# ----------------------------------------------------------------
# 계정에 완료된 인바운드 Request가 하나라도 있으면 "해외송금 받기" 메뉴 진입 시
# [01]~[14]에서 봤던 환율계산/수취인목록 화면 대신 "받는 계좌" 카드 목록 화면([15])이
# 먼저 노출되는 구조임을 확인함. [12]의 IBST0003는 매번 재현되는 게 아니라 간헐적
# 실패였던 것으로 보이며(원인 미상, 백엔드 환율 캐시 타이밍 추정), 실제로 이전 세션 중
# Confirm이 최소 2회 성공해 계정에 완료된 요청이 남아있었음 - 이를 이용해 [15]~[20] 검증.
# 주의: 이 섹션은 "완료된 요청이 이미 존재해야" 카드 목록이 노출되는 상태 의존적 테스트임.
#
# ★ 2026-09-04 해소: **[12]가 매 실행마다 그 요청을 만든다.** 종전엔 Confirm을 누르지 않아
#   이 섹션이 "예전에 우연히 성공한 요청"에 얹혀 있었고, 실제로 그 데이터는 **이미 만료돼
#   사라진 상태였다**(2026-09-04 실측: "받는 계좌" 카드 화면이 뜨지 않음 = 완료된 요청 0건).
#   요청 만료가 72시간이라 하루만 지나도 이 섹션이 통째로 깨지는 구조였다.
#   → 이제 [12]가 선행하므로 [15]~[20]은 자기완결적이다.
# [15]->[16]->[17]은 같은 화면 스택에서 바로 이어지므로 Home 재진입 불필요.
# [17]->[18]은 "내역 조회"에서 뒤로가기 1번이면 디테일로 복귀 가능해 이어서 진행.
# [18]에서 "다른 요청 진행"을 타면 [01]~[14]가 쓰는 화면으로 넘어가 버려 이후 내비게이션
# 스택을 확신할 수 없으므로, [19]/[20]은 안전하게 Home부터 재진입함(특히 [20]은 실제
# 결제 페이지로 연결되므로 상태가 꼬이면 위험함).


# ================================================================
# ⏸ [15]~[19] — 2026-10-28 제거 (실행 시간 단축)
# ================================================================
# High 는 [20](Proceed to Payment) 하나뿐이고, 그 케이스는
# `runFlow: _enter_receive_overseas_old.yaml` 로 **홈부터 다시 진입**한다
# → 앞 케이스들이 만든 화면에 기대지 않아 통째로 걷어도 성립한다.
# ⚠️ 되살리기: git show 23bf3a5:Maestro/Old/13_07_해외송금받기_요청상태조회_old.yaml
# ================================================================

# ----------------------------------------------------------------
# [20] [High] Inbound Request Status - Proceed to Payment 선택 시 인바운드 송금 상세 웹페이지 연결 확인
# ----------------------------------------------------------------
# 주의(실제 결제 리스크): "결제 진행" 탭 시 앱을 벗어나 외부 Chrome 브라우저로
# checkout.doku.com(실제 PG사 결제 페이지)이 열림. 카드 [24] Global QR 케이스와 동일한 이유로
# 여기서는 브라우저 진입 확인까지만 하고 즉시 이탈함 - 절대 결제 정보를 입력하거나 결제를
# 완료하는 단계까지 진행하지 않음

- runFlow: "_enter_receive_overseas_old.yaml"
# ⛔⛔ **여기서 죽으면 코드가 아니라 전제를 먼저 의심할 것.**
#   이 케이스는 계정에 **완료된 인바운드 요청이 이미 있어야** 성립한다. 그 요청은
#   `13_04_해외송금받기_송금요청등록` 이 만들고 **72시간 뒤 만료**된다.
#   없으면 "받는 계좌" 카드 화면 자체가 안 떠서 아래 대기가 40초를 채우고
#   `Assertion is false: "받는 계좌|요청 완료" is visible` 로만 죽는다 —
#   **셀렉터 버그처럼 읽히지만 아니다.**
#   2026-11-02·11-03 두 번 다 13_07 **단독 실행**이라 이렇게 죽었고, 2026-11-04 에
#   같은 지점·같은 이유임을 확인했다(기존 결함으로 오분류돼 있었다).
#   → 13_04 를 함께 고르거나, 72시간 안에 13_04 가 돈 적이 있어야 한다.
#     (`autoAdd` 로 자동 추가하지 않는다 — 검증하는 항목을 고르는 건 사용자 몫이라는 규칙이다)
# 카드 목록일 때만 카드를 연다(요청 1건이면 이미 상세 화면이다 — 위 [15] 주석 참고)
#   ⚠️ 분기 전에 **도달을 먼저 기다린다** — 렌더 중에 조건을 보면 모든 갈래가 조용히 SKIP된다.
- extendedWaitUntil:
    visible: "${INBOUND_LIST_ANY}"
    timeout: 40000
- runFlow:
    when:
      visible:
        text: "${RECEIVING_ACCOUNT}"
    commands:
      - tapOn:
          id: "cardView"
          index: 0
      - waitForAnimationToEnd
- assertVisible:
    id: "tv_req_complete"
- tapOn:
    id: "btn_proceed"
- waitForAnimationToEnd
# Maestro의 text 셀렉터는 노드 전체 문자열과 일치해야 하므로(부분일치 아님) URL 일부만
# 확인하려면 와일드카드 regex 필요 (2026-07-08 확인: "만료 날짜" 등 여러 partial text
# assertVisible이 이 이유로 실패했었음 - id 기반 또는 .*wildcard.* 패턴으로 대체)
- assertVisible:
    text: ".*doku.*"
# 결제 페이지 진입 확인만 하고 즉시 이탈 (실제 결제 진행 금지)
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd

# 홈 복귀 (suite 종료)
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd

