appId: ${APP_ID}
---
# ================================================================
# 헬퍼: 인바운드 화면에서 **수취인 목록**까지 확실히 도달한다
# ================================================================
# 2026-09-04 신설. 계정에 **활성 인바운드 요청**이 있으면 "해외송금 받기" 진입 시
# [01]~[14]가 기대하는 수취인 목록이 아니라 요청 쪽 화면이 먼저 뜬다.
#
# | 활성 요청 | 도달 화면 |
# |---|---|
# | 0건    | 수취인 목록 (`tv_htr` = "수취 방법") |
# | 1건    | `ReceiveMoneyInboundDetailActivity` (요청 상세, `tv_req_complete`) |
# | 2건 이상 | `ActiveTxnListActivity` ("받는 계좌" 카드 목록, `cardView`) |
#
# 두 경로 모두 상세의 **"다른 요청 진행"**(`tv_make_another_payment`)에서 수취인 목록으로 빠져나온다.
#
# ★ 왜 `repeat` 로 감쌌나 — **`runFlow: when:` 은 그 순간의 스냅샷만 본다.**
#   화면 전환 애니메이션 중에 조건을 평가하면 **모든 갈래가 조용히 SKIP되어** 엉뚱한 화면에 남는다.
#   2026-09-04 통짜 실행에서 이 함정에 반복해서 물렸다:
#     · 카드 목록이 뜨는 중인데 `"받는 계좌"` 조건이 SKIP → `tv_countryCode` 못 찾고 죽음
#     · 도달 대기는 통과했는데 바로 다음 줄의 조건 3개가 전부 SKIP → 카드 목록에 갇힘
#   → 한 번 놓쳐도 다음 회차가 잡도록 **3회 반복**한다. 이미 수취인 목록이면 두 조건 모두
#     SKIP되므로 무해한 no-op 이다(요청이 0건인 계정에서도 안전).
#
# 사용: - runFlow: "_inbound_goto_sender_list_old.yaml"
#   ⚠️ 이 헬퍼는 **인바운드 화면에 이미 들어와 있는 상태**를 전제한다.
#     홈에서 시작한다면 `_enter_receive_overseas_old.yaml` 을 먼저 부를 것.
# ================================================================

- repeat:
    times: 3
    commands:
      # 카드 목록이면 첫 카드를 열어 요청 상세로 간다
      - runFlow:
          when:
            visible:
              text: "${RECEIVING_ACCOUNT}"
          commands:
            - tapOn:
                id: "cardView"
                index: 0
            - waitForAnimationToEnd
      # 요청 상세면 "다른 요청 진행"으로 수취인 목록에 빠져나온다
      - runFlow:
          when:
            visible:
              id: "tv_make_another_payment"
          commands:
            - tapOn:
                id: "tv_make_another_payment"
            - waitForAnimationToEnd
      - waitForAnimationToEnd

# 도달 판정. `tv_htr`("수취 방법")은 수취인 목록 화면의 헤더다.
# ⚠️ 이건 **정적 헤더라 목록 행보다 먼저 뜬다** — 행까지 필요한 호출부는
#   `tv_detail1` 렌더를 따로 기다려야 한다(`_reenter_inbound_list_old.yaml` 참고).
- extendedWaitUntil:
    visible: "${HOW_TO_RECEIVE}"
    timeout: 40000
