appId: ${APP_ID}
---
# ================================================================
# 헬퍼: **쿠폰 딥링크를 안전하게 투입**한다 — Server Override 를 먼저 치우고 나서 던진다
#                                                        (2026-11-06 작성)
# ================================================================
# 호출:
#   - runFlow:
#       file: _open_coupon_deeplink_old.yaml
#       env:
#         COUPON_DEEPLINK: "${DEEPLINK_COUPON_REDEEM}${COUPON_CODE_EXPIRED}"
#
# 왜 필요한가 — 2026-11-06 실측으로 두 번 깨지고 나서 만들었다.
#
# ⛔ ① **`_server_override_old.yaml` 은 딥링크를 지운다.**
#   그 헬퍼는 항등 시퀀스 끝에서 **무조건 `launchApp` 을 한다**("APPLY & QUIT 로 죽었을 수
#   있으므로 재실행"). 그런데 `launchApp` 은 **평범한 실행**이라 방금 들어온 딥링크 인텐트가
#   날아간다 → 쿠폰 랜딩 대신 **평소의 로그인 전 초기화면**(`btn_lgn`)이 뜬다.
#   실측 로그:
#       Open <쿠폰 딥링크>... COMPLETED
#       Run _server_override_old.yaml... (…) Launch app "${APP_ID}"... COMPLETED
#       Assert that id: sign_in_coupon_text is visible... FAILED      ← 랜딩이 아니라 초기화면
#   → **순서를 뒤집는다**: 앱을 먼저 띄워 Server Override 를 치우고, **그 다음에** 딥링크.
#     그러면 딥링크는 warm 상태로 들어오고 Override 가 다시 뜰 일이 없다.
#
# ⛔ ② **`pressKey: back` 으로 케이스를 끝내지 말 것.**
#   랜딩·로그인 화면에서 back 하면 앱이 어중간하게 남고, 다음 딥링크가 그 위로 들어오면
#   **빈 SplashScreen 에서 굳는다**(텍스트 0개, 앱 로그도 끊긴다. force-stop 하면 되살아난다).
#   → 케이스 끝은 `stopApp`, 시작은 이 헬퍼. 매번 깨끗한 상태에서 시작한다.
#
# 필요한 env: COUPON_DEEPLINK(호출자가 준다) · APP_ID · SERVER_PICK · PIN_NORMAL
# ================================================================

# 1) 앱을 먼저 정상 경로로 띄운다 — 여기서 Server Override 를 소진시킨다.
- launchApp
- runFlow: "_server_override_old.yaml"
# 2) 딥링크를 받을 수 있는 상태가 됐는지 확인한다(로그인 전/후 어느 쪽이든).
- extendedWaitUntil:
    visible:
      id: "btn_lgn|bottom_item_home|input_dot_1|noti_coupon_edittet"
    timeout: 60000
# 3) 이제 딥링크를 넣는다. 빌드가 여러 개면 앱 선택 다이얼로그가 뜨고,
#    딥링크는 앱이 떠 있어도 잠금화면을 거치므로 둘 다 받아낸다.
- openLink:
    link: "${COUPON_DEEPLINK}"
- runFlow: "_pick_app_from_chooser_old.yaml"
- runFlow: "_unlock_if_locked_old.yaml"
