appId: ${APP_ID}
---
# ================================================================
# 헬퍼: clearState 직후 **온보딩 관문**을 통과시킨다 (2026-09-28 작성)
#
# clearState 를 하면 두 관문이 되살아난다:
#   (1) 앱 화면 `서비스 이용 안내`(권한 안내) — `동의`(btnConfirm)
#   (2) OS 런타임 권한 다이얼로그 — **여러 개가 순차로** 뜬다
#       (SM-S928N/Android 15 실측: READ_PHONE_NUMBERS -> POST_NOTIFICATIONS,
#        둘 사이 간격이 20초까지 벌어진다)
#
# 왜 모았나 — 2026-09-28 스위트에서 이걸 플로우마다 제각각 처리하고 있었다:
#   05 만 루프 / 01_03 은 1회 탭 / 01_01·01_04 는 2회 고정 탭 / **06 은 아예 없음.**
#   그래서 06 은 `신규 회원`, 01_03 은 `btn_lgn` 을 남은 다이얼로그에 가려 못 찾고 죽었다.
#   → 고칠 일이 생기면 **이 파일만** 고친다.
#
# 규칙
#   ⛔ 문구(`허용`)로 잡지 않는다 — en 은 `Allow` 이고,
#      ★**위치 권한 다이얼로그에는 `허용` 버튼이 아예 없다**(`앱 사용 중에만 허용`).
#      AOSP 표준 id 로 잡는다(패키지 접두사는 붙이지 않는다 — 린터 E01).
#   ⛔ 단순 `repeat while visible: grant_dialog` 로는 못 잡는다 — 다음 다이얼로그가
#      늦게 오면 그 사이 조건이 거짓이 되어 루프가 **먼저 빠져나간다.**
#      -> **"초기화면 또는 다음 관문"** 중 먼저 뜨는 쪽을 기다린 뒤 판정한다.
#
# 전제/종료조건: 관문을 다 지나면 **초기화면**(`selectLangBg`)에 선다.
#   이미 서 있으면 조건이 거짓이라 통째로 SKIP 된다(관문이 없는 실행에서도 무해).
#   못 서면 30초 뒤 시끄럽게 실패한다 — 조용히 넘어가지 않는다.
# ================================================================
- repeat:
    times: 6
    while:
      notVisible:
        id: "selectLangBg"
    commands:
      - extendedWaitUntil:
          visible:
            id: "selectLangBg|grant_dialog|requiredPermission"
          timeout: 30000
      - runFlow:
          when:
            visible:
              id: "grant_dialog"
          commands:
            - tapOn:
                id: "permission_allow_(foreground_only_)?button"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: "requiredPermission"
          commands:
            - tapOn:
                id: "btnConfirm"
            - waitForAnimationToEnd
