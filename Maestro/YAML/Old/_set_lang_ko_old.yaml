appId: ${APP_ID}
---
# ================================================================
# 헬퍼: 앱 언어를 **한국어** 로 바꾼다 (2026-09-14 신설)
# ================================================================
# 왜 필요한가:
#   다국어 검증(`-lang en`)은 **앱 UI 자체가 그 언어여야** 성립한다. env 값만 영어로 넘기고
#   앱이 한국어면 전부 Element not found 로 죽는다(2026-09-14 실제로 그렇게 한 번 헛돌았다).
#   검증 전후로 이 헬퍼를 돌려 언어를 맞춘다.
#
# 사용:
#   .\run_test.ps1 -lang ko -flow "Old\_set_lang_ko_old.yaml"
#   ※ -lang 은 **env 파일 선택**일 뿐이라 무엇을 줘도 된다(이 헬퍼는 id·자국어 표기로만 판정한다).
#
# ⚠️ 언어를 바꾸면 **앱이 재시작**된다(스플래시 + Server Override). 그 복구는 아래 헬퍼가 처리한다.
# ⚠️ 언어 목록의 항목명은 **자국어 표기 고정**이라 앱 언어와 무관하다(한국어 / English / 中文 …).
# ================================================================
- launchApp
# ⚠️ 서버는 코드로 강제한다 — 빼면 stag 빌드가 **조용히 gmeuat(STAG)로 돈다**(린터 E08).
- runFlow: "_server_override_old.yaml"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "한국어"
