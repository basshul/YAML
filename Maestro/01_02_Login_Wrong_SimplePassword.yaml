appId: com.gmeremit.online.gmeremittance_native.livetest
---
# ================================================================
# 01_03 간편비밀번호 오류 재로그인 테스트
# 실행:
#   maestro --device R3CW90MTK9H test "01_03_Login_Wrong simple password.yaml"
#
# 사전 조건:
#   홈 화면 로그인 상태 (01_01_Login_Success 실행 후)
#
# 처리 항목:
#   [01] 앱 재시작 → 간편비밀번호 화면 진입
#   [02] 간편비밀번호 오류 10회 입력 (2323...)
#   [03] 오류 횟수 초과 다이얼로그 → 확인
#   [04] 보안 키보드 → Gmetest1! 시도, 실패 시 Gme12! 재시도
#   [05] 새 간편비밀번호 설정 → 1212 입력 후 확인
#   [06] 간편비밀번호 설정 완료
# ================================================================

# [01] 앱 재시작 → 간편비밀번호 화면 진입
- launchApp

# [02] 간편비밀번호 오류 5회 입력
- tapOn: "2"
- tapOn: "3"
- tapOn: "2"
- tapOn: "3"
- tapOn: "2"
- tapOn: "3"
- tapOn: "2"
- tapOn: "3"
- tapOn: "2"
- tapOn: "3"
- tapOn: "2"
- tapOn: "3"
- tapOn: "2"
- tapOn: "3"
- tapOn: "2"
- tapOn: "3"
- tapOn: "2"
- tapOn: "3"
- tapOn: "2"
- tapOn: "3"

# [03] 오류 횟수 초과 다이얼로그 확인
- tapOn:
    id: "btn_diaog_ok"

# [04] 보안 키보드 → 로그인 시도
# 로그인 시도 1: Gmetest1!
- tapOn:
    id: "securityKeyboardEditText"
- tapOn:
    id: "transKeypad_row4"
- tapOn: "대문자 키보드 변경"
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "t 시옫"
- tapOn: "e 디귿"
- tapOn: "s 니은"
- tapOn: "t 시옫"
- tapOn: "1"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "입력완료"
# ⚠️ **폐기 비밀번호 재시도 블록을 제거했다**(2026-09-02, 종전 67~92행).
#   ① 재시도 값이 이미 폐기된 비밀번호라 성공할 수 없다.
#   ② 그런데 로그인 시도를 1회 더 소모한다(로그인은 5회 제한).
#      2026-09-02 실행에서 이 블록 때문에 한 번에 2회를 태웠다.
#   ③ 가드로 쓰던 문구는 로그인 화면에 항상 있어 1차 성패와 무관하게 실행된다.
#   → 1차 실패 시 아래 [05] 대기가 타임아웃되며 시끄럽게 실패한다. 그게 더 안전하다.

# [05] 새 간편비밀번호 설정 → 1212
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
- waitForAnimationToEnd

# [06] 간편비밀번호 설정 완료
- tapOn:
    id: "btnOk"
- waitForAnimationToEnd
