appId: com.gmeremit.online.gmeremittance_native.livetest
---
# ================================================================
# 시나리오: MENU - 설정 - 로그인 비밀번호 변경 [06]~[12]
# (04_01_Change_SimplePassword.yaml = 간편 비밀번호 변경 과 대칭되는 정규 파일)
# 실행: maestro --device <serial> test 04_02_Change_LoginPassword.yaml
#
# 진입: launch → PIN 1212 → 홈 → 프로필 → 우상단 기어(설정) → 로그인 비밀번호 변경
# 계정: seungsoo818 / 로그인 비밀번호 = Gmetest1!
#
# 케이스:
#   [06] 현재 비밀번호 입력 / [07] 새 비밀번호 입력(규칙 4종 충족)
#   [08] 새 비밀번호 확인입력(일치) / [09] 규칙 미충족 시 인디케이터 미체크
#   [10] 불일치 시 저장 불가 / [11] 현재 비밀번호 틀리면 서버 거절
#   [12] 실제 변경(Gmetest1!→Gmetest12!) → 로그아웃 → 새 비번 로그인(홈) → 원복
#
# 검증 신호:
#   * 규칙 인디케이터 = CheckBox → checked 속성으로 검증
#     (checkAlphabet/checkNumber/checkSpecialChar/checkMinCharCount/checkPassMatch)
#   * btn_submit(저장)은 규칙 미검증(필드 채움+일치만 봄) → 규칙은 CheckBox로 판정
#   * 보안 키보드 = 로그인/04_01과 동일 어휘. 필드는 좌표(퍼센트) 탭:
#     현재=51%,25% / 새=51%,37% / 확인=51%,62%. "입력완료"=완료(로그인은 자동 제출)
#   * 저장 성공="성공" 다이얼로그(확인), 현재비번 오류="...올바르지 않습니다"
#   * 화면 이탈(iv_back)은 폐기 팝업 없이 설정 복귀 → 케이스별 재진입
# * 실기기 end-to-end 100% PASS (2026-07-29). [12]는 실제 변경 후 Gmetest1! 원복.
# ================================================================

# ---- 진입: launch → PIN → 홈 → 프로필 → 설정 ----
- launchApp
- extendedWaitUntil:
    visible:
      text: "4자리 숫자를 입력하세요"
    timeout: 30000
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "로그인 세션이 만료|홈"
    timeout: 20000
- runFlow:
    when:
      visible:
        text: "로그인 세션이 만료"
    commands:
      - tapOn: "OK"
      - extendedWaitUntil:
          visible:
            text: "홈"
          timeout: 20000
- extendedWaitUntil:
    visible:
      text: "홈"
    timeout: 30000
- tapOn:
    text: "프로필"
- extendedWaitUntil:
    visible:
      text: "정보 수정"
    timeout: 20000
- tapOn:
    point: "92%,6%"
- extendedWaitUntil:
    visible:
      text: "설정"
    timeout: 20000

# ================================================================
# [06][07][08] 현재/새/확인 입력 동작 확인
# ================================================================
- tapOn:
    id: "view_change_password"
- extendedWaitUntil:
    visible:
      text: "비밀번호 변경"
    timeout: 20000
# [06] 현재: Gmetest1!
- tapOn:
    point: "51%,25%"
- runFlow:
    when:
      notVisible:
        text: "Capital G 히읃"
    commands:
      - tapOn: "대문자 키보드 변경"
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "t 시옫"
- tapOn: "e 디귿"
- tapOn: "s 니은"
- tapOn: "t 시옫"
- tapOn: "1"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "입력완료"
- waitForAnimationToEnd
# [07] 새: Gmetest12! → 규칙 4종 모두 충족(checked)
- tapOn:
    point: "51%,37%"
- runFlow:
    when:
      notVisible:
        text: "Capital G 히읃"
    commands:
      - tapOn: "대문자 키보드 변경"
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "t 시옫"
- tapOn: "e 디귿"
- tapOn: "s 니은"
- tapOn: "t 시옫"
- tapOn: "1"
- tapOn: "2"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "입력완료"
- waitForAnimationToEnd
- assertVisible:
    id: "checkAlphabet"
    checked: true
- assertVisible:
    id: "checkNumber"
    checked: true
- assertVisible:
    id: "checkSpecialChar"
    checked: true
- assertVisible:
    id: "checkMinCharCount"
    checked: true
# [08] 확인: Gmetest12! (일치) → checkPassMatch checked
- tapOn:
    point: "51%,62%"
- runFlow:
    when:
      notVisible:
        text: "Capital G 히읃"
    commands:
      - tapOn: "대문자 키보드 변경"
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "t 시옫"
- tapOn: "e 디귿"
- tapOn: "s 니은"
- tapOn: "t 시옫"
- tapOn: "1"
- tapOn: "2"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "입력완료"
- waitForAnimationToEnd
- assertVisible:
    id: "checkPassMatch"
    checked: true
- assertVisible:
    id: "btn_submit"
    enabled: true
- tapOn:
    id: "iv_back"
- extendedWaitUntil:
    visible:
      text: "설정"
    timeout: 20000

