# --- 홈 복귀 ---
- pressKey: back
- pressKey: back
- runFlow:
    when:
      notVisible:
        text: "Home"
    commands:
      - pressKey: back
- runFlow:
    when:
      notVisible:
        text: "Home"
    commands:
      - pressKey: back

