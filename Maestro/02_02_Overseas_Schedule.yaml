# 사후 정리: 예약 수취인 목록에서 삭제
# (TESTUPDATE GME가 index 0 = 최신, SCHEDULE TRANSFER TEST가 index 1)
- tapOn: "해외송금"
- extendedWaitUntil:
    visible:
      text: "수취인을 선택하세요."
    timeout: 10000
- tapOn: "예약"
# TESTUPDATE GME 먼저 삭제 (index 0)
- runFlow:
    when:
      visible:
        text: "TESTUPDATE GME"
    commands:
      - tapOn:
          id: "moreIcon"
          index: 0
      - tapOn:
          id: "delete"
          index: 0
      - tapOn: "예"
# SCHEDULE TRANSFER TEST 삭제 (TESTUPDATE GME 삭제 후 index 0)
- runFlow:
    when:
      visible:
        text: "SCHEDULE TRANSFER TEST"
    commands:
      - tapOn:
          id: "moreIcon"
          index: 0
      - tapOn:
          id: "delete"
          index: 0
      - tapOn: "예"
- runFlow:
    when:
      notVisible:
        text: "Home"
    commands:
      - pressKey: back