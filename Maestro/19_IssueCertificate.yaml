      text: "증명서 발급"
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 20
    centerElement: true
- tapOn: "증명서 발급"
- extendedWaitUntil:
    visible:
      text: "주민등록초본"
    timeout: 20000
- tapOn: "주민등록초본"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "com.gmeremit.online.gmeremittance_native.livetest:id/agreeallcheckboxtitle"
