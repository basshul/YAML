      - tapOn:
          id: "com.gmeremit.online.gmeremittance_native.livetest:id/agreeallcheckboxtitle"
      - tapOn:
          id: "com.gmeremit.online.gmeremittance_native.livetest:id/btnConfirm"
      - waitForAnimationToEnd
# 주민등록 증명서 전용: 주소(시/도 + 시군구) 직접 선택 → 계속
- extendedWaitUntil:
    visible:
      text: "주민등록상 주소를 확인해 주세요."
    timeout: 20000
- tapOn:
    id: "com.gmeremit.online.gmeremittance_native.livetest:id/dp_city"
- tapOn: "서울특별시"
- tapOn:
    id: "com.gmeremit.online.gmeremittance_native.livetest:id/dp_address"
- tapOn: "강남구"
- tapOn:
    id: "com.gmeremit.online.gmeremittance_native.livetest:id/btn_next"
- extendedWaitUntil:
    visible:
      text: "시작하기"
    timeout: 20000
- tapOn: "시작하기"
- extendedWaitUntil:
    visible:
      text: "인증 수단 선택"
    timeout: 30000
- assertVisible: "인증 수단을 선택해 주세요."
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
- assertVisible: "홈"

