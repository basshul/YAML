# 2차 변경: 2323 → 1212 (원복)
- tapOn: "카드 PIN 코드 변경"
- assertVisible: "카드 PIN 코드 변경"
- tapOn: "CVC 번호"
# 키패드 재배치 대응: 탭 사이 정착 대기 (파일 상단 주석 참고)
