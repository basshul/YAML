appId: com.gmeremit.online.gmeremittance_native.livetest
---
# ================================================================
# 보안 키패드 주의 (2026-08-06)
#   PIN/CVC 입력용 보안 키패드는 **숫자를 누를 때마다 배치가 다시 섞임**.
#   각 tapOn 사이에 waitForAnimationToEnd가 없으면 maestro가 직전 스냅샷의
#   stale 좌표를 눌러 엉뚱한 숫자가 입력됨 → 실제로 카드 PIN에서
#   "PIN 코드가 유효하지 않습니다."가 재현됐음. 이 파일의 숫자 입력 블록에는
#   전부 정착 대기가 들어가 있으니 새로 추가할 때도 같은 형태를 유지할 것.
#
# 카드 PIN 상태 주의
#   [12]가 카드 PIN을 1212 → 2323 → 1212로 되돌림. 실행이 [12] 중간에 끊기면
#   카드 PIN이 2323으로 남아 다음 실행의 [11]이 막힘 → [11]에 2323 폴백을 넣어둠.
#   [12]는 이전 PIN이 아니라 CVC(435)로 인증하므로 현재 PIN 값과 무관하게 동작함.
# ================================================================
# ================================================================
# 시나리오: Card (GME Card)
# ================================================================

# 앱 실행 및 홈 진입
# 주의(2026-08-06): 기존 `notVisible: "Home"` 가드는 launchApp 직후 잠깐 보이는 **캐시된 홈**에
#   매칭돼 PIN 입력을 건너뛰고 잠금화면에 갇힘 → 잠금화면을 명시적으로 대기 후 PIN 입력.
- launchApp
- extendedWaitUntil:
    visible:
      text: "4자리 숫자를 입력하세요"
    timeout: 30000
# 키패드 재배치 대응: 탭 사이 정착 대기 (파일 상단 주석 참고)
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
# 로그인 세션 만료 다이얼로그(토큰 만료 시) 또는 홈 대기
- extendedWaitUntil:
    visible:
      text: "로그인 세션이 만료|Home"
    timeout: 20000
- runFlow:
    when:
      visible:
        text: "로그인 세션이 만료"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd
# 홈 코치마크 balloon 닫기
- runFlow:
    when:
      visible:
        id: "com.gmeremit.online.gmeremittance_native.livetest:id/balloonClose"
    commands:
      - tapOn:
          id: "com.gmeremit.online.gmeremittance_native.livetest:id/balloonClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "카드"
    timeout: 30000

# 카드 탭 진입
- tapOn:
    text: "카드"
    index: 0
- extendedWaitUntil:
    visible:
      text: "GME 카드"
    timeout: 30000

# ================================================================
# [Card Apply] - 카드 추가 신청 (Pay 카드, 지점 수령)
# ================================================================

# 카드 이미지 좌로 스와이프 후 "카드 추가 요청" 있을 때만 진행 (이미 신청된 경우 스킵)
- tapOn:
    text: "카드"
    index: 0
- extendedWaitUntil:
    visible:
      text: "GME 카드"
    timeout: 30000
- swipe:
    start: "70%, 45%"
    end: "20%, 45%"
    duration: 400
- runFlow:
    when:
      visible:
        text: "카드 추가 요청"
    commands:
      - tapOn: "카드 추가 요청"
      # ----------------------------------------------------------------
      # [01] [High] Card Apply - 카드선택페이지 정상 진입 확인 및 Apply 동작 확인
      # ----------------------------------------------------------------
      - assertVisible: "EasyGo 카드"
      - assertVisible: "Pay 카드"
      - tapOn: "카드 신청"
      # 이미 진행 중인 신청 팝업 처리 → 배송지로 바로 이동
      - runFlow:
          when:
            visible:
              text: "이어서 신청하기"
          commands:
            - tapOn: "이어서 신청하기"
            - waitForAnimationToEnd
      # 처음 신청: 상품 상세 카드 신청 탭 → 이용약관 ~ PIN 전체 처리
      - runFlow:
          when:
            visible:
              text: "카드 신청"
          commands:
            - tapOn: "카드 신청"
            - waitForAnimationToEnd
            # 이용약관
            - tapOn: "동의 & 다음"
            - waitForAnimationToEnd
            # 카드 디자인 선택
            - tapOn: "신청"
            - waitForAnimationToEnd
            # ----------------------------------------------------------------
            # [02] [Medium] Card Apply - Select Pay service 선택 동작 확인
            # ----------------------------------------------------------------
            - assertVisible: "None"
            - assertVisible: "Paybooc"
            - tapOn: "다음"
            - waitForAnimationToEnd
            # ----------------------------------------------------------------
            # [03] [Medium] Card Apply - 영문이름 수정 및 입력 동작 확인
            # ----------------------------------------------------------------
            - assertVisible: "영문 이름 (전체)"
            - tapOn: "다음"
            - waitForAnimationToEnd
            # ----------------------------------------------------------------
            # [04] [Medium] Card Apply - 비밀번호 4자리 입력 동작 확인
            # ----------------------------------------------------------------
            - assertVisible: "PIN 코드"
            - assertVisible: "PIN 코드 인증"
            # 카드 PIN 입력 필드 포커스 → 보안 키패드 오픈.
            #   (2026-08-06) 기존 `point: "50%, 25%"`는 S23(2340) 기준이라 Note 9(2220)에서
            #   실제 필드 위치(50%, 29%)를 빗나가 키패드가 열리지 않았고, 이어지는 tapOn "1"이
            #   "Element not found"로 실패했음 → 좌표 대신 resource-id 사용.
            - tapOn:
                id: "com.gmeremit.online.gmeremittance_native.livetest:id/pin_passedittext"
            # 키패드 재배치 대응: 탭 사이 정착 대기 (파일 상단 주석 참고)
            - tapOn: "1"
            - waitForAnimationToEnd
            - tapOn: "2"
            - waitForAnimationToEnd
            - tapOn: "1"
            - waitForAnimationToEnd
            - tapOn: "2"
            - waitForAnimationToEnd
            - tapOn: "1"
            - waitForAnimationToEnd
            - tapOn: "2"
            - waitForAnimationToEnd
            - tapOn: "1"
            - waitForAnimationToEnd
            - tapOn: "2"
            - waitForAnimationToEnd
            - tapOn: "다음"
            - waitForAnimationToEnd
      # ----------------------------------------------------------------
      # [05] [Medium] Card Apply - 카드수령 동작 확인 (비대면/대면/브랜치)
      # ----------------------------------------------------------------
      - assertVisible: "카드 배송지"
      - assertVisible: "비대면 배송 (택배)"
      - assertVisible: "대면 배송 (특송)"
      - assertVisible: "지점 선택"
      - tapOn: "지점 선택"
      - tapOn: "다음"
      - assertVisible: "지점 수령"
      - assertVisible: "모바일 지점"
      # ----------------------------------------------------------------
      # [06] [High] Card Apply - 카드신청완료 동작 확인
      # ----------------------------------------------------------------
      - tapOn: "다음"
      - tapOn: "확인"
      - assertVisible: "신청서 접수 완료"
      - tapOn: "완료"

# ================================================================
# [Card Change]
# ================================================================

# 카드 탭 재진입 후 첫 번째 카드(EasyGo)로 초기화 → Pay 카드로 스와이프
- tapOn:
    text: "카드"
    index: 0
- extendedWaitUntil:
    visible:
      text: "GME 카드"
    timeout: 30000
# 좌→우 2번으로 페이지 1 강제 이동
- swipe:
    start: "20%, 60%"
    end: "70%, 60%"
    duration: 400
- swipe:
    start: "20%, 60%"
    end: "70%, 60%"
    duration: 400
- waitForAnimationToEnd
# 우→좌 1번으로 Pay 카드(페이지 2)로 이동
- swipe:
    start: "70%, 60%"
    end: "20%, 60%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "신청 세부 정보 변경"
    timeout: 10000

# ----------------------------------------------------------------
# [07] [High] Card Change - 카드 수령지 상세정보 노출 확인
# ----------------------------------------------------------------
- tapOn: "신청 세부 정보 변경"
- waitForAnimationToEnd
- assertVisible: "주소 변경"

# ----------------------------------------------------------------
# [08] [Medium] Card Change - 주소변경 시 카드수령지 정보 변경 동작 확인
# ----------------------------------------------------------------
- tapOn: "주소 변경"
- waitForAnimationToEnd
- assertVisible: "비대면 배송 (택배)"
- assertVisible: "대면 배송 (특송)"
- assertVisible: "지점 선택"

# ----------------------------------------------------------------
# [09] [High] Card Change - 카드 정보 변경동작 확인
# ----------------------------------------------------------------
- tapOn: "다음"
- waitForAnimationToEnd
- assertVisible: "모바일 지점"
- tapOn:
    point: "50%, 32%"
- tapOn: "다음"
- waitForAnimationToEnd
- assertVisible: "입력한 정보를 확인해 주세요."
- assertVisible: "카드 상품"
- tapOn: "확인"
- waitForAnimationToEnd
# 신청 세부 정보 변경 화면에서 안산 선택 확인 후 확인 버튼 탭
- assertVisible: "안산"
- tapOn: "확인"
- waitForAnimationToEnd

# ================================================================
# [Card Cancel]
# ================================================================

# 카드 탭 재진입 후 Pay 카드(페이지 2)로 이동
- tapOn:
    text: "카드"
    index: 0
- extendedWaitUntil:
    visible:
      text: "GME 카드"
    timeout: 30000
- swipe:
    start: "20%, 60%"
    end: "70%, 60%"
    duration: 400
- swipe:
    start: "20%, 60%"
    end: "70%, 60%"
    duration: 400
- waitForAnimationToEnd
- swipe:
    start: "70%, 60%"
    end: "20%, 60%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "카드 신청 취소하기"
    timeout: 10000

# ----------------------------------------------------------------
# [10] [High] Card Cancel - 카드 취소시 정상취소 되는지 확인
# ----------------------------------------------------------------
- tapOn: "카드 신청 취소하기"
- waitForAnimationToEnd
- assertVisible: "카드 신청 취소"
- assertVisible: "정말 취소하시겠습니까?"
- tapOn: "예"
- waitForAnimationToEnd
- assertVisible: "성공"
- assertVisible: "카드 신청이 정상적으로 취소되었습니다."
- tapOn: "확인"
- waitForAnimationToEnd

# ================================================================
# [Card Management]
# ================================================================

# 카드 탭 재진입 후 EasyGo 카드(정상 상태, 페이지 1)로 초기화
- tapOn:
    text: "카드"
    index: 0
- extendedWaitUntil:
    visible:
      text: "GME 카드"
    timeout: 30000
- swipe:
    start: "20%, 60%"
    end: "70%, 60%"
    duration: 400
- swipe:
    start: "20%, 60%"
    end: "70%, 60%"
    duration: 400
- waitForAnimationToEnd

# 카드 관리 탭 진입
- tapOn: "카드 관리"

# ----------------------------------------------------------------
# [11] [Low] Card Management - 카드 비밀번호 정상 입력시 카드 정보 페이지 노출 확인
#            - 카드번호, CVC, 카드만료일 (Card Number Details)
# ----------------------------------------------------------------
- tapOn: "카드 정보"
- assertVisible: "카드 PIN 코드를 입력하세요"
- assertVisible: "4자리 숫자를 입력하세요"
# 키패드 재배치 대응: 탭 사이 정착 대기 (파일 상단 주석 참고)
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- waitForAnimationToEnd
# 자가복구(2026-08-06): [12]가 카드 PIN을 1212 → 2323 → 1212로 되돌리는데, 과거 실행이
#   [12] 중간에 끊기면 카드 PIN이 **2323으로 남아** 이후 모든 실행이 여기서 막힘
#   (실제로 발생 — 1212가 거부되고 "PIN 코드가 유효하지 않습니다."). 로그인 비밀번호의
#   Gmetest1! → Gme12! 폴백과 같은 방식으로 2323 폴백을 둠.
#   ※ 카드 PIN은 오입력이 누적되면 카드가 잠길 수 있으므로 폴백은 이 1회까지만.
- runFlow:
    when:
      visible:
        text: ".*PIN 코드가 유효하지 않습니다.*"
    commands:
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "3"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "3"
      - waitForAnimationToEnd
      - waitForAnimationToEnd
- assertVisible: "카드 번호:"
- assertVisible: "CVC 번호"
- assertVisible: "만료 날짜"
- tapOn: "확인"
- waitForAnimationToEnd

