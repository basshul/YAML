# ----------------------------------------------------------------
# 주의(2026-08-06): 충전 화면의 "출금 계좌 GME Wallet" 잔액은 **앱 시작 시점 값으로 캐시**됨.
#   앱이 떠 있는 동안 지갑에 충전하면 홈 계좌 목록은 갱신되는데 이 화면은 옛 값을 계속 보여줌
#   (실측: 홈 1,099 KRW / 충전 화면 0 원 → 1원 입력도 "충전 금액은 계좌 잔액보다 클 수 없습니다."로 거부).
