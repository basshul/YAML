appId: com.gmeremit.online.gmeremittance_native.livetest
---
# ================================================================
# 시나리오: Deposit
# ================================================================

# 앱 최초 실행 (전체 suite 1회)
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        text: "Home"
    commands:
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
- runFlow:
    when:
      visible:
        text: "나중에 하기"
    commands:
      - tapOn: "나중에 하기"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "닫기"
    commands:
      - tapOn: "닫기"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 30000

# ================================================================
# [시작 계정 고정] → seungsoo818 (한국인, 은행계좌 연결)
# ================================================================
# 계정 전환 추가(2026-07-16): [01]~[05](GME Wallet Deposit)는 "은행 입금"/
# "즉시 입금" 옵션이 있는 은행계좌 연결 계정을 전제로 작성되어 있으나 명시적
# 로그인이 없어 "시작 시점에 이미 로그인된 계정"에 의존했음. 직전 실행이
# test123(은행 미연결)으로 끝나면 재실행 시 [05]의 "은행 입금" 옵션이 없어
# 실패함(2026-07-16 실기기 재현). 실행 시점 계정과 무관하게 항상 통과하도록
# 파일 첫머리에서 seungsoo818로 명시적 로그아웃→재로그인함.
- tapOn: "Profile"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "로그아웃"
    direction: DOWN
- tapOn: "로그아웃"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "예"
    commands:
      - tapOn: "예"
      - waitForAnimationToEnd
- tapOn:
    id: "usernameId"
- eraseText: 50
- inputText: "seungsoo818"
- tapOn:
    id: "securityKeyboardEditText"
- tapOn: "대문자 키보드 변경"
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "t 시옫"
- tapOn: "e 디귿"
- tapOn: "s 니은"
- tapOn: "t 시옫"
- tapOn: "1"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "입력완료"
- waitForAnimationToEnd
# 로그인 실패(비밀번호 Gmetest1! 만료) 시 → Gme12!로 재시도
- runFlow:
    when:
      visible: "오류"
    commands:
      - tapOn: "확인"
      - waitForAnimationToEnd
      - tapOn:
          id: "securityKeyboardEditText"
      - tapOn: "대문자 키보드 변경"
      - tapOn: "Capital G 히읃"
      - tapOn: "m 으"
      - tapOn: "e 디귿"
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "특수문자변경"
      - tapOn: "느낌표"
      - tapOn: "입력완료"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "비밀번호 대신 지문인증을 사용하시겠습니까?"
    commands:
      - tapOn: "나중에"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "간편비밀번호"
    commands:
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn:
          id: "btnOk"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "보이스 피싱 주의"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "나중에 하기"
    commands:
      - tapOn: "나중에 하기"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 30000

# ================================================================
# [GME Wallet Deposit]
# ================================================================
# 진입 경로: Home > "입금"(content-desc 기반 아이콘, Home 화면 "송금" 섹션 내)
# → "입금 방법을 선택하세요" 바텀시트(GME Wallet / GMEPay 탭, GME Wallet이 기본 선택)
# → 즉시 입금 / 은행 입금 / 편의점 입금 / ATM 입금 중 선택
#
# 실기기 확인 결과(2026-07-10), 원래 TODO가 전제한 "KJ/WSB 가상계좌발급 상태
# 안내페이지 → [Confirm] → Deposit 페이지 이동" 흐름은 현재 앱 버전에 존재하지
# 않음: "은행 입금" 탭 시 별도 안내/Confirm 단계 없이 곧바로 최종 계좌정보
# 화면("GME Wallet 입금")으로 직행하며, 여기 표시되는 입금 계좌가 바로
# "Welcome Savings Bank"(웰컴저축은행) = WSB로 확인됨. 수신 계좌(KJ vs WSB)는
# 계정 속성(국적 등)에 따라 서버에서 고정 배정되는 것으로 보이며, 화면 내에서
# 직접 선택하는 UI는 없음. 현재 테스트 계정은 WSB로 배정되어 있어 KJ 관련
# 케이스([02]~[04])는 이 계정으로 검증 불가.

# ----------------------------------------------------------------
# [01] [Low] Home - 입금 방법 선택 바텀시트 닫기 동작 확인
# ----------------------------------------------------------------
# Home 화면에서 "입금" 아이콘 선택 시 노출되는 "입금 방법을 선택하세요"
# 바텀시트를 [닫기]로 닫으면 Home 화면으로 정상 복귀하는지 확인.
- tapOn: "입금"
- waitForAnimationToEnd
- assertVisible: "입금 방법을 선택하세요"
- tapOn: "닫기"
- waitForAnimationToEnd
- assertVisible:
    text: "Home"

# ----------------------------------------------------------------
# [02] [High] GME Wallet Deposit - KJ - KJ 가상계좌발급 상태 안내페이지 노출 확인
#            - [Confirm] 버튼 선택 시 Deposit 페이지 이동 확인
# ----------------------------------------------------------------
# BLOCKED (2026-07-10): 현재 테스트 계정은 수신 계좌가 WSB(Welcome Savings
# Bank)로 고정 배정되어 있어 KJ 가상계좌 화면 자체에 진입할 수 없음. 화면 내
# 선택 UI가 없고 계정 속성에 따라 서버에서 결정되는 구조라, KJ 배정 계정을
# 별도로 확보하기 전까지는 코드 작성 범위에서 제외(사용자 사전 승인).

# - tapOn: "TODO: Deposit 메뉴 진입 → GME Wallet Deposit → KJ"
# - assertVisible:
#     text: "TODO: KJ 가상계좌발급 안내 페이지 식별 텍스트"
# - tapOn: "Confirm"
# - assertVisible:
#     text: "TODO: Deposit 페이지 식별 텍스트"

# ----------------------------------------------------------------
# [03] [Low] GME Wallet Deposit - KJ - [?] 선택시 GME Wallet Deposit Guide 화면 이동 확인
# ----------------------------------------------------------------
# BLOCKED (2026-07-10): [02]와 동일한 사유(KJ 미배정 계정) - 코드 작성 범위에서 제외.

# - tapOn: "TODO: Deposit → GME Wallet Deposit → KJ"
# - tapOn: "TODO: ? 버튼"
# - assertVisible:
#     text: "TODO: GME Wallet Deposit Guide 화면 텍스트"

# ----------------------------------------------------------------
# [04] [Medium] GME Wallet Deposit - KJ - 금액 개별/단위 입력 동작 확인
#              - 입력후 [x]선택시 금액 입력 취소됨
# ----------------------------------------------------------------
# BLOCKED (2026-07-10): [02]와 동일한 사유(KJ 미배정 계정) - 코드 작성 범위에서 제외.

# - tapOn: "TODO: Deposit → GME Wallet Deposit → KJ"
# - tapOn: "TODO: 금액 입력 필드"
# - inputText: "50000"
# - assertVisible:
#     text: "50,000"
# - tapOn: "TODO: x 버튼"
# - assertNotVisible:
#     text: "50,000"

# ----------------------------------------------------------------
# [05] [Medium] GME Wallet Deposit - WSB - WSB 가상계좌 정보 노출 확인
# ----------------------------------------------------------------
# 참고: 실기기 확인 결과 원래 TODO가 전제한 "안내페이지 → [Confirm] → Deposit
# 페이지 이동" 단계는 없고, "은행 입금" 탭 시 곧바로 최종 계좌정보 화면으로
# 이동함 - 케이스 내용을 실제 동작에 맞게 정정하여 작성.
- tapOn: "입금"
- waitForAnimationToEnd
- tapOn: "은행 입금"
- waitForAnimationToEnd
- assertVisible: "GME Wallet 입금"
- assertVisible:
    id: "txvReceivingBankName"
- assertVisible: "계좌번호 복사"

# 홈 복귀 (이 화면도 앱바 back button만 있고 pressKey: back은 무반응 - id 기반 탭)
- tapOn:
    id: "btnBackImage"
- waitForAnimationToEnd
- assertVisible:
    text: "Home"

# ================================================================
# [GMEPay Deposit]
# ================================================================
# 진입 경로: Home > "GMEPay 가상 계좌"(계좌 목록 카드 내 링크) → "가상 계좌 입금"
# 화면(카드 UI, 전북은행 등 VA 은행 카드 슬라이드, 복사 아이콘(id: tvCopyBadge)/
# 공유 버튼(id: btnShare)/우상단 정보 아이콘(id: btnInfo) 노출) 직행.
#
# 실기기 확인 결과(2026-07-10), 원래 TODO가 전제한 "Easy Wallet Deposit" 메뉴
# 항목은 "입금 방법을 선택하세요" 바텀시트(GMEPay 탭: 즉시 입금/가상계좌 입금/
# GME Wallet에서 입금 3개뿐)에 존재하지 않음 - 화면상 진입 경로 자체가 없어
# [06]~[10] 전체 BLOCKED 처리(단순 계정 속성 문제가 아니라 기능 자체 미확인).
#
# 재확인(2026-07-14): [01]에서 "GMEPay 가상 계좌" 배너가 외국인 계정에서만
# 노출된다는 사실이 확인되어, "Easy Wallet" 배너도 동일하게 계정 속성에 따라
# 숨겨져 있을 가능성을 의심하고 Home 화면 전체(최상단~최하단)를 다시 스크롤하며
# 재조사함. 결과: "Easy Wallet"/"이지월렛" 관련 텍스트나 배너는 Home 화면
# 어디에도 존재하지 않음.
#
# 사용자 재구성 지시(2026-07-14): [06]은 "GMEPay 가상 계좌" 배너의 노출
# 유무 확인 케이스, [07]은 배너 선택(탭) 확인 케이스로 정리하기로 함. [06]을
# 제대로 검증하려면 (1)외국인 계정 (2)GMEPay Deposit 미신청 계정, 두 조건이
# 동시에 필요한데 현재 QA 테스트 계정은 이를 만족하지 않아 확인 불가 - 사용자가
# 조건을 만족하는 다른 계정으로 로그인 후 알려주기로 함(작업 보류 중).
# 그 사이 아래에 있던 탭+진입확인 코드(배너 선택 시 "가상 계좌 입금" 타이틀
# 노출 확인)는 실제로는 [08]에 해당한다고 판단되어 [08]로 이동함.

# ----------------------------------------------------------------
# [06] [Low] GMEPay Deposit - 홈화면 "GMEPay 가상 계좌" 배너 노출 유무 확인
# ----------------------------------------------------------------
# 2026-07-14: 외국인 + GMEPay Deposit 미신청 계정(test123)으로 확인 - 이 경우
# 배너 문구가 "지금 신청하여 다른 사람으로부터 쉽게 돈을 받으세요."로 노출됨
# (신청 완료 계정의 "남은 일일 입금 한도: N KRW" 문구와는 다름).
#
# 계정 전환 추가(2026-07-16): [06]/[07]은 test123 계정이 이미 로그인되어
# 있다는 전제로 작성되어 있었으나, 앱 세션이 초기화되면(재설치/기기 재부팅 등)
# 시작 시점 로그인 계정이 달라질 수 있어 실제로 seungsoo818(한국인) 상태로
# 남아 [06] 실패가 재현됨(2026-07-16 실기기). 실행 시점의 기존 로그인 계정과
# 무관하게 항상 통과하도록 명시적 로그아웃 → test123 재로그인 블록을 추가함.
- tapOn: "Profile"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "로그아웃"
    direction: DOWN
- tapOn: "로그아웃"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "예"
    commands:
      - tapOn: "예"
      - waitForAnimationToEnd
- tapOn:
    id: "usernameId"
- eraseText: 50
- inputText: "test123"
- tapOn:
    id: "securityKeyboardEditText"
- tapOn: "대문자 키보드 변경"
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "1"
- tapOn: "2"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "입력완료"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "비밀번호 대신 지문인증을 사용하시겠습니까?"
    commands:
      - tapOn: "나중에"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "간편비밀번호"
    commands:
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn:
          id: "btnOk"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "보이스 피싱 주의"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "나중에 하기"
    commands:
      - tapOn: "나중에 하기"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
    commands:
      - tapOn: "닫기"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 30000

- assertVisible: "지금 신청하여 다른 사람으로부터 쉽게 돈을 받으세요."

# ----------------------------------------------------------------
# [07] [Low] GMEPay Deposit - "GMEPay 가상 계좌" 배너 선택 확인
# ----------------------------------------------------------------
# 2026-07-14: 미신청 계정에서 배너 선택 시 [09]/[10](신청 완료 계정)과 달리
# "가상 계좌 입금" 화면이 아니라 은행사(KB/JB) 중 선택하는 "은행 선택"(GMEPay
# VA 신규 신청) 화면으로 이동함을 확인. 실제 신청("확인 및 신청" 버튼)은
# 되돌릴 수 없는 실제 서비스 가입이라 여기서는 탭하지 않고 화면 진입만 확인.
- tapOn: "GMEPay 가상 계좌"
- waitForAnimationToEnd
- assertVisible: "은행 선택"
- tapOn:
    id: "btnBackImage"
- waitForAnimationToEnd
- assertVisible:
    text: "Home"

# 사용자 재구성 지시(2026-07-14, 2차): [08]~[10]을 "GMEPay 가상 계좌 입금"
# 영역 노출 여부/선택 검증으로 통합 - [08] 한국인(내국인) 계정 기준 미노출
# 확인, [09] 외국인 계정 기준 노출 확인, [10] 선택(탭) 동작 확인.
#
# 계정 자동 전환(2026-07-15 추가): 국적별 필요 계정이 고정됨에 따라, 어드민
# 국적 수동 전환에 의존하지 않고 케이스 진입 직전 로그아웃 → 지정 계정
# 재로그인으로 대체함 - 한국인 케이스는 seungsoo818, 외국인 케이스는
# test123(비밀번호 Gme12!) 계정을 사용. 아래 로그아웃/로그인 블록은
# 01_01_Login_Success.yaml / 06_Registration_All.yaml의 검증된 로그인 시퀀스를
# 그대로 재사용함(보안 키패드 content-desc 기반 tapOn).

# ----------------------------------------------------------------
# [08] [High] GMEPay Deposit - "GMEPay 가상 계좌 입금" 영역 미노출 확인 (국적: 한국인)
# ----------------------------------------------------------------
# 계정 전환: 로그아웃 → seungsoo818(한국인) 재로그인
- tapOn: "Profile"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "로그아웃"
    direction: DOWN
- tapOn: "로그아웃"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "예"
    commands:
      - tapOn: "예"
      - waitForAnimationToEnd
- tapOn:
    id: "usernameId"
- eraseText: 50
- inputText: "seungsoo818"
- tapOn:
    id: "securityKeyboardEditText"
- tapOn: "대문자 키보드 변경"
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
