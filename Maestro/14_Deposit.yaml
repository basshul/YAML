- tapOn:
    id: "submitBtn"
- waitForAnimationToEnd
- assertVisible: "입금을 신청하시겠습니까?"
- tapOn:
    id: "apply_btn"
- waitForAnimationToEnd
- assertVisible: "간편 비밀번호를 입력하세요"
