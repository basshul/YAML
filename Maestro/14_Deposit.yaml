# ----------------------------------------------------------------
# [18] [Low] ATM Deposit - NICE - Find nearest ATM 선택 시 근처 NICE ATM 위치 확인
# ----------------------------------------------------------------
# 참고: 외부 브라우저(checkpay.co.kr)로 이동하여 지도 기반 ATM 위치를
# 보여줌(위치 권한 요청 발생) - 앱 내부 화면이 아니므로 브라우저 진입만
# 확인하고 바로 뒤로가기로 복귀함.
# [17]에서 이미 레벨1 목록 화면에 있으므로 그대로 이어서 검증.
- tapOn: "NICE ATM"
- waitForAnimationToEnd
- tapOn:
    id: "findAtmButton"
- waitForAnimationToEnd
# 외부 브라우저(Chrome)로 전환된 뒤 뒤로가기 1회로는 앱으로 복귀하지 않고
# 브라우저 내부에 머무르는 경우가 있어(지도 페이지 자체 back 처리),
# 앱 화면("입금 금액")이 보일 때까지 반복적으로 뒤로가기.
- repeat:
    while:
      notVisible: "입금 금액"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- assertVisible: "입금 금액"
- tapOn:
    id: "backBtn"
- waitForAnimationToEnd
- assertVisible: "이용 가능한 ATM을 선택하세요"

