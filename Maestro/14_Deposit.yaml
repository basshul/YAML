- waitForAnimationToEnd
- assertVisible: "입금 요청"
- tapOn: "취소"
- waitForAnimationToEnd
- tapOn: "예"
- waitForAnimationToEnd
# 취소 확인도 간편 비밀번호 입력을 요구함(신청 때와 동일한 PIN 화면).
