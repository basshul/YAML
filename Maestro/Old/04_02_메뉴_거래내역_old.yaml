appId: ${APP_ID}
---
# ================================================================
# 시나리오: MENU - History (거래/이력 내역)
# (04_Menu_remaining.yaml에서 분리, 2026-07-16)
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 → 내역 탭 → 송금 ----------------
# ⚠️ launchApp 직후 캐시된 홈이 잠깐 보였다가 잠금화면이 뜨는 레이스가 있다. "홈 notVisible"
#   가드로는 PIN 입력을 건너뛰어 잠금화면에 갇히므로, **잠금화면을 명시적으로 기다린 뒤** PIN을 넣는다.
#   PIN 키패드는 매번 랜덤 배치라 좌표가 아닌 text("1"/"2")로 탭한다.
# ⚠️ 이 화면들의 판정 규칙:
#   1) 홈 판정은 **id `btnTransfer`**. 하단 내비 라벨이 **"홈으로"**라서 Maestro 전체매칭인
#      `text: "홈"` 으로는 안 걸린다.
#   2) 내역 탭은 **id `bottom_item_history`**. 라벨은 **"거래 내역"(공백 포함)**이다.
#   3) 세션이 만료되면 **초기 화면으로 떨어져 ID/비밀번호 재로그인이 필요하다**(PIN으로 복구 안 됨).
#      다이얼로그만 닫는 건 의미가 없어서, 뜨면 그대로 실패하게 두고
#      `01_01_로그인_정상_old.yaml`로 복구한 뒤 재실행한다.
- launchApp
# ⚠️ **`waitForAnimationToEnd`만으로는 부족하다 (2026-08-19 실측)**
#   launchApp 직후엔 아직 스플래시라 아래 조건부 블록이 전부 SKIP되고 홈 판정에서 죽는다
#   (Server Override가 **늦게** 뜬다). 첫 화면이 실제로 그려질 때까지 명시적으로 기다린다.
#   세 갈래 중 하나가 반드시 온다: 서버선택 / 잠금화면 / (세션 살아있으면) 홈.
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|button1|securityKeyboardEditText"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ LIVETEST 강제 — 판별이 불가능해 항등 시퀀스로 간다. 상세: docs/ENVIRONMENT.md §7.3
      - tapOn:
          text: "${SERVER_PICK}"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # CONTINUE 후 잠금화면이 뜨는 데도 시간이 걸린다
      - extendedWaitUntil:
          visible:
            id: "input_dot_1|bottom_item_home|securityKeyboardEditText"
          timeout: 60000
# 자동 로그아웃(세션 10분 만료)으로 재인증 화면에 떨어졌으면 비밀번호로 로그인한다
- runFlow: "_relogin_if_autologout_old.yaml"
# 잠금화면을 명시적으로 대기한 뒤 PIN 입력(캐시된 홈에 먼저 매칭되는 레이스 회피).
# 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수 — 오입력 누적은 계정 잠금이다.
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
# 인앱 배너 팝업은 id로 정확히 닫는다(범용 "닫기" 문자열 탭은 다른 X를 눌러 사고 이력이 있다)
- runFlow:
    when:
      visible:
        # ⚠️ 배너 닫기 id는 빌드마다 다르다 — btnTwo(7.19.x) | btnClose(7.20.0). docs/ENVIRONMENT.md §7.6
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd

# ⚠️ **홈 팝업은 하나가 아니라 큐로 뜬다** — 위 블록들만으로는 부족하다(2026-09-01 실측).
#   "중요 공지사항 / 최신 신분증을 업로드해 주세요" 팝업이 홈을 덮어
#   `btnTransfer` assert가 21스텝에서 실패했다. 이 팝업 버튼은
#   **`btnCancel`("다음에 하기") / `btnOK`("지금 업로드")** 인데,
#   기존 가드는 `"나중에 하기"` **전체매칭**이라 문구가 달라 조용히 SKIP됐다.
#   → 문구로 잡지 말고 **검증된 공용 헬퍼로 큐를 비운다**(즉석 블록을 만들지 말 것).
#     헬퍼는 전부 조건부 optional 탭이라 팝업이 없으면 그냥 통과한다.
- runFlow: "_dismiss_popups_stag_old.yaml"
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# ================================================================
# [History]
# ================================================================

# ----------------------------------------------------------------
# 하단 "거래 내역" 탭 > 송금 진입 (진입 시 "해외송금" 탭이 기본 선택됨)
# 데이터 현황(2026-07-22, seungsoo818/LEE SEUNGSOO, PIN <정상 PIN>):
#   해외송금/예약송금/국내송금 데이터 O, 송금받기 비어있음.
#   ★ 2026-09-04 변경: **송금받기(인바운드)도 데이터가 생긴다.** `13_해외송금받기_분할전원본_old.yaml`의
#     [12]가 인도네시아 송금인으로 Request를 등록하도록 고쳤고, 스위트가 13 → 04 순서로 돈다.
#     그 결과 [17](인바운드 상세)의 BLOCKED가 풀렸다. [18]은 저장소 권한 앱버그로 BLOCKED 유지.
#   * 재송금(txvResendButton): 테스트 수취인이 비활성 → "수취인 활성화" 확인창(아니요=취소).
#   * KFTC/Wallet 결제수단 구분: History 상세엔 송금방법(Bank Transfer)만 표시되어 구분 불가.
#   * 이력다운로드(fb_printHistory): Android10에서 앱이 미선언 WRITE 권한을 체크하여
#     "저장소 권한 필요" 모달(back으로 안닫힘, 확인=설정 딥링크)이 떠 다운로드 완료 불가 = 앱 버그.
#     → 이력다운로드 케이스([06][14][18]) BLOCKED 처리, ClickUp/메모리에 버그 기록.
# 송금 리스트 공통 element id: imgvSearchIcon(검색), searchEditText, imgvFilter(필터), fb_printHistory.
# ⚠️ **`imgvSearchIcon`은 토글이다 (2026-08-19 실측 FAILED)**
#   각 검색 케이스는 "아이콘 탭 → 입력 → 지우기 → 아이콘 탭(닫기)" 형태인데, 닫기가 안 먹었거나
#   탭 전환으로 검색창 상태가 남아 있으면 **다음 케이스의 여는 탭이 오히려 닫아버려**
#   `searchEditText`를 못 찾고 죽는다(GMEPAY [28]에서 재현).
#   → 아이콘을 누른 뒤 **열리지 않았으면 한 번 더 누르는** 가드를 모든 검색 진입부에 넣었다.
# 해외/국내 행 상세 진입: 각 행 tv_gme_control_no(거래번호) index:0. 예약 행: ll_wholeView index:0.
# 필터 바텀시트("설정"): one_month/three_month(기본)/one_year, date1/date2, search, dialog_close.
# ----------------------------------------------------------------
# 홈 코치마크 balloon("잔액 보기" 등, 별도 팝업 윈도우)이 뜨면 nav가 가려지므로 먼저 닫기
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "balloonClose"
    commands:
      - tapOn:
          id: "balloonClose"
      - waitForAnimationToEnd
- tapOn:
    id: "bottom_item_history"
- waitForAnimationToEnd
- tapOn: "${TAB_REMITTANCE}"
- waitForAnimationToEnd
- assertVisible: "${TXT_OVERSEAS_REMIT}"

# ----------------------------------------------------------------
# [01] [High] History - Remittance - 해외송금 상세페이지 재송금(Send Money) 동작 확인
#   상세 진입 → 재송금 → (테스트 수취인 비활성) "수취인 활성화" 확인창 노출 → 아니요로 취소
# ----------------------------------------------------------------
- tapOn:
    id: "tv_gme_control_no"
    index: 0
- waitForAnimationToEnd
# 상세 진입 시 뜨는 코치마크 balloon 팝업(별도 윈도우: 떠있으면 maestro가 상세 노드를 못읽음) 닫기
- runFlow:
    when:
      visible:
        id: "balloonClose"
    commands:
      - tapOn:
          id: "balloonClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${PAY_MODE_TEXT}"
    timeout: 15000
- tapOn: "${TXT_RESEND}"
# 재송금 뒤 나오는 화면이 **수취인 상태에 따라 갈린다** (2026-09-03 실측으로 확정).
#   ① 수취인이 비활성이면 "수취인 활성화" 확인 다이얼로그(예/아니요)가 뜬다 — 종전 코드가 가정한 경로.
#   ② 수취인이 활성이면 그 단계가 없고 **`출금 계좌를 선택하세요` 바텀시트로 직행**한다.
#   → 종전엔 ①만 30초 기다려 죽었다(그날 첫 행이 오늘 실송금한 스리랑카 건이라 수취인이 활성이었다).
#     이 케이스가 보는 건 "재송금 버튼이 동작하는가"이므로 **둘 중 어느 화면이든 도달로 인정**하고 닫는다.
# ★ 2026-10-07 추가 — 위 ②(활성이면 시트로 직행)가 **그대로는 안 맞는다.** 수취인이
#   활성이어도 "수취인의 세부 정보가 변경되었습니다."(btnOk="확인") 안내가 먼저 끼어든다
#   (저장된 수취인 정보가 거래 당시와 다르면 뜬다). 종전 가드는 아니요/출금계좌 둘만
#   기다려 **여기서 30초 타임아웃으로 죽는다.**
#   ⚠️ 이 안내와 ①의 활성화 확인창은 **같은 `txvDialogDescription`** 을 쓴다 → 문구(언어별)가
#      아니라 **`btnCancel` 유무**로 가른다: 활성화 확인창은 아니요/예 두 개, 이 안내는 확인 하나뿐.
#      활성화 확인창에서 btnOk 를 누르면 **수취인을 활성화**해 버린다 — 이 케이스는 그걸 하지 않는다.
- runFlow:
    when:
      visible:
        id: "txvDialogDescription"
      notVisible:
        id: "btnCancel"
    commands:
      - tapOn:
          id: "btnOk"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${NO_OR_SELECT_WITHDRAW}"
    timeout: 30000
- runFlow:
    when:
      visible: "${REG_NO}"
    commands:
      - tapOn: "${REG_NO}"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${SCR_SELECT_WITHDRAW}"
    commands:
      # ⛔ 계좌를 고르면 **실제 재송금 절차로 들어간다** → 무조건 닫기만 한다.
      - pressKey: back
      - waitForAnimationToEnd
# 어느 갈래였든 시트/다이얼로그가 닫혔는지 확인한 뒤 목록으로 나간다
- assertNotVisible: "${SCR_SELECT_WITHDRAW}"
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
- assertVisible: "${TXT_OVERSEAS_REMIT}"

# ----------------------------------------------------------------
# [02] [High] History - Remittance - 해외송금 Wallet 송금내역 재송금 동작 확인 (Send Money)
#   체크리스트 #133 과 함께 **#226·#227·#228 을 이 한 케이스로 덮는다**(2026-10-07 통합).
#   왜 여기로 모았나: 재송금은 수취인 추가·국가/은행/금액 입력을 전부 건너뛴다 →
#     **같은 커버리지를 훨씬 짧은 경로로** 얻는다. 그래서 `02_01 [02]` 의 송금 구간은
#     주석 처리해 두고(수취인 추가까지만 남김) **실송금 1회를 여기서 치른다.**
#
# ★ 종전 BLOCKED 사유는 **해소됐다**(2026-10-07 실측, 7.21.0-stag).
#   종전: "KFTC vs Wallet 이 History 상세에 안 보인다(송금 방법=Bank Transfer 만 표시)".
#   실제: 구분은 **상세가 아니라** 재송금 뒤 뜨는 `출금 계좌를 선택하세요` 시트에서 한다
#         — GME Wallet / 신한은행 / 카카오뱅크 / 케이뱅크(= KFTC 계좌). 여기서 Wallet 을 고른다.
#
# 실측 흐름(2026-10-07):
#   상세 → `txvResendButton` → **정보 다이얼로그 최대 2개** → 출금계좌 시트 → GME Wallet
#   → `SendMoneyV2Activity`(= `02_01 [02]` 와 **같은 화면으로 수렴**) → 1·2단계 → PIN → 성공 → 영수증
#   다이얼로그 ① "현재 수취인이 활성화되어 있지 않습니다 / 활성화하시겠습니까?" (btnCancel=아니요, btnOk=예)
#              ② "수취인의 세부 정보가 변경되었습니다." (btnOk=확인)
#   ★ ①은 수취인이 이미 활성이면 건너뛴다. ②는 저장된 수취인 정보가 거래 당시와 다르면 뜬다.
#     → **문구가 아니라 다이얼로그 id(`txvDialogDescription`) 로 잡는다** — 영문 문구가 미확인이라
#       env 에 추측값을 넣지 않는다.
#
# ✅ **2026-10-07 실송금 완주 확인** — PIN 오입력 → PIN 재요구 → 정상 입력 → 성공 → 영수증 PDF 저장까지.
#   (영수증 구간의 셀렉터는 같은 날 기기에서 **직접 떠서** 넣었다. 플로우로 재실행하지는 못했다 —
#    지갑을 다시 충전해야 하기 때문이다. 다음 충전 때 한 번 더 돌려 확인하면 좋다.)
#
# ⛔ **잔액 의존** — GME Wallet 잔액이 최소 송금액(수수료 5,000 포함, 환율 연동으로 매일 바뀐다)보다
#   적으면 "거래를 진행하기 위한 잔액이 부족합니다." 에서 막힌다. 그 팝업에 붙은
#   **`btnVerifyBankAccount`("확인") = 실계좌 자동충전**이다 — 절대 자동으로 누르지 말 것.
#   스위트는 잔액을 선검사해 부족하면 이 파일을 SKIP 한다(잔액부족을 Pass 로 적지 말 것).
#   ⚠️ 충전해도 **홈은 캐시로 0 을 계속 보여준다** — 당겨서 새로고침해야 반영된다(사람이 볼 때 주의).
# ----------------------------------------------------------------
- tapOn:
    id: "tv_gme_control_no"
    index: 0
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "balloonClose"
    commands:
      - tapOn:
          id: "balloonClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${PAY_MODE_TEXT}"
    timeout: 15000
- tapOn: "${TXT_RESEND}"
- waitForAnimationToEnd

# 정보 다이얼로그 ①② 를 닫는다. 둘 다 `btnOk` 가 진행 버튼이다(①=예, ②=확인).
# ⚠️ 엉뚱한 다이얼로그를 눌러도 **바로 아래 출금계좌 시트 단언에서 걸린다** → 조용히 통과하지 않는다.
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible:
              id: "txvDialogDescription"
          commands:
            - tapOn:
                id: "btnOk"
            - waitForAnimationToEnd

# ---- 출금 계좌 선택: **여기가 Wallet / KFTC 가 갈리는 지점이다** (체크리스트 #133) ----
- extendedWaitUntil:
    visible:
      text: "${SCR_SELECT_WITHDRAW}"
    timeout: 30000
- assertVisible:
    id: "rvKftcList"
- tapOn:
    id: "txvAccountTitle"
    text: "GME Wallet"
- waitForAnimationToEnd

# ---- 송금액: 앱이 알려주는 **최소 송금액**을 읽어 그대로 쓴다 ----
# 이유는 `02_01 [02]` 와 같다 — 최소 송금액은 환율 연동이라 매일 바뀌어 고정값은 근본적으로 낡는다.
# 일부러 낮은 값을 넣어 `limitErrorMsg` 를 띄우고 거기 적힌 숫자를 그대로 재입력한다.
# ★ 재송금은 금액이 원 거래 값이 아니라 **기본값(100,000)** 으로 채워져 온다(2026-10-07 실측)
#   → 반드시 지우고 다시 넣는다. 아래 5000 은 **미끼값**이지 송금액이 아니다.
- extendedWaitUntil:
    visible:
      id: "sendAmountEdTxt"
    timeout: 30000
- tapOn:
    id: "sendAmountEdTxt"
- eraseText
- inputText: "5000"
- hideKeyboard
- tapOn: "${CALCULATE_TEXT}"
# ⛔ 잔액이 부족하면 최소금액 안내 **대신** "거래를 진행하기 위한 잔액이 부족합니다." 가 먼저 뜬다
#   (2026-10-07 실측: 지갑 잔액 0). 이 판정이 없으면 아래 `limitErrorMsg` 대기가 60초 타임아웃 나서
#   **원인이 로그에서 가려진다** — 세션 만료 가드를 홈 대기보다 앞에 둔 것과 같은 이유다.
#   ⚠️ 이 팝업에 함께 뜨는 `btnVerifyBankAccount` 는 **실계좌 자동충전**이다. 닫고 진행하지 말 것.
- assertNotVisible:
    text: "${SEND_INSUFFICIENT_BALANCE}"
- extendedWaitUntil:
    visible:
      id: "limitErrorMsg"
    timeout: 60000
- copyTextFrom:
    id: "limitErrorMsg"
- evalScript: ${output.minAmt = maestro.copiedText.replace(/[^0-9]/g, '')}
- tapOn:
    id: "sendAmountEdTxt"
- eraseText
- inputText: ${output.minAmt}
- hideKeyboard
- tapOn: "${CALCULATE_TEXT}"

# ---- 1단계: 금액 세부 정보 ----
- extendedWaitUntil:
    visible:
      text: "${SEND_CALC_RESULT_ANY}"
    timeout: 60000
# ⛔ 잔액 부족이면 **여기서 실패시킨다.** 닫고 진행하지 말 것 —
#   이 팝업에 함께 뜨는 `자동이체 계좌 선택` 시트의 `btnVerifyBankAccount` 는 실계좌 자동충전이다.
- assertNotVisible:
    text: "${SEND_INSUFFICIENT_BALANCE}"
- assertVisible:
    id: "agreeButton"
    text: "${MYQR_CONTINUE}"
- assertNotVisible:
    id: "limitErrorMsg"
- assertVisible:
    id: "transferFeeTxtView"
- tapOn:
    id: "agreeButton"

# ---- 2단계: 수취인 정보 / 약관 동의 ----
# ⚠️ 재송금은 2단계 제목이 **`인증 처리 중`** 으로 표시된다(2026-10-07 실측). `02_01` 의
#   `수취인 정보` 와 달라 **2단계를 건너뛰고 PIN 으로 직행할 가능성**이 있다.
#   → 어느 쪽이든 받도록 **둘 중 먼저 오는 것**을 기다리고, 2단계는 조건부로만 처리한다.
- extendedWaitUntil:
    visible:
      id: "txt_pamount|input_dot_1"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "txt_pamount"
    commands:
      - assertVisible:
          id: "txt_bankAcNo"
      # ⛔ 스크롤 없이 `agreeButton` 을 누르면 **약관 브라우저가 열린다**(`02_01 [02]` 실측):
      #   버튼이 화면 밖인데 접근성 트리에는 bounds 가 남아, 그 좌표의 "송금 사기 주의" 링크가 눌린다.
      - swipe:
          direction: UP
          duration: 1000
      - waitForAnimationToEnd
      - assertVisible:
          id: "agreeButton"
          text: "${MYQR_CONTINUE}"
      - tapOn:
          id: "agreeButton"
      # 그래도 약관 브라우저가 열렸으면 되돌아와 재시도한다(자가복구)
      - runFlow:
          when:
            visible:
              text: "GME Remittance - Terms"
          commands:
            - tapOn:
                id: "iv_back"
            - waitForAnimationToEnd
            - swipe:
                direction: UP
                duration: 1000
            - waitForAnimationToEnd
            - tapOn:
                id: "agreeButton"

# ---- PIN 1회 오입력 (체크리스트 #226: 간편 비밀번호 틀릴 시 송금불가) ----
# ⚠️ 잠금화면 판정은 **`id: input_dot_1`** 로 한다 — 문구(`간편 비밀번호를 입력하세요`)로 잡으면
#   전체매칭에 걸려 **가드가 통째로 SKIP** 된다(`02_01 [02]` 에서 실제로 거짓 통과했다).
# ⚠️ PIN 키패드는 **탭마다 배치가 재섞인다.** 탭 사이 `waitForAnimationToEnd` 가 없으면
#   stale 좌표를 눌러 오입력이 누적된다 = 계정 잠금.
- extendedWaitUntil:
    visible:
      id: "input_dot_1"
    timeout: 60000
- runFlow:
    file: _enter_pin_old.yaml
    env:
      PIN: ${PIN_WRONG}
# 오입력 안내 팝업을 닫는다
- runFlow:
    when:
      visible:
        id: "btn_diaog_ok|btnOk"
    commands:
      - tapOn:
          id: "btn_diaog_ok|btnOk"
      - waitForAnimationToEnd

# ---- PIN 정상 입력 (체크리스트 #227: 간편 비밀번호 일치 시 송금동작) ----
# ★ 오입력으로는 송금이 성립하지 않아야 한다 — PIN 을 **다시 요구**하고 성공 화면이
#   떠 있지 않은 것으로 #226 을 단언한다.
- extendedWaitUntil:
    visible:
      id: "input_dot_1"
    timeout: 30000
- assertNotVisible:
    text: "${SEND_SUCCESS}"
- runFlow:
    file: _enter_pin_old.yaml
    env:
      PIN: ${PIN_NORMAL}

# ---- 송금 결과 ----
# ⚠️ 결과 도달을 **먼저 강제한다.** 조건부 처리만 두면 아무것도 안 떠도 EXIT=0 이 된다(거짓 통과).
- extendedWaitUntil:
    visible:
      text: "${SEND_RESULT_ANY}"
    timeout: 120000
- takeScreenshot: "[02]_재송금_결과"
# ⚠️ 앱은 **PIN 입력 전까지 잔액을 재검증하지 않는다** → 잔액부족 팝업은 여기서도 뜰 수 있다.
#   그 경우 송금이 일어나지 않았으므로 닫고 진행하지 말고 **실패시킨다.**
- assertNotVisible:
    text: "${SEND_RESULT_INSUFFICIENT}"
- assertVisible:
    text: "${SEND_SUCCESS}"

# ---- 영수증 및 영수증 다운로드 (체크리스트 #228) ----
# ⚠️⚠️ **성공 시트의 「영수증 보기」 id 는 `btnVerifyBankAccount` 다**(2026-10-07 실측).
#   하필 **잔액부족 팝업의 자동충전 「확인」과 같은 id** 다 — 같은 바텀시트 레이아웃을 재사용한다.
#   id 만 보고 누르면 상황에 따라 **실계좌 자동충전**을 누르게 된다.
#   → 아래처럼 **`txvDialogTitle` 이 성공인지 확정한 뒤에만** 누른다. 잔액부족 팝업의 제목은 `정보` 라
#     `${SEND_SUCCESS}`(= 성공|완료) 에 걸리지 않는다.
#   ※ 짝 버튼 `btnContactSupport1` 은 "다시 보내기" 다 — 누르면 송금 화면으로 되돌아간다.
- assertVisible:
    id: "txvDialogTitle"
    text: "${SEND_SUCCESS}"
- tapOn:
    id: "btnVerifyBankAccount"

# 영수증 화면 = `SendMoneyV2TransactionCompleteActivity` (History 상세의 영수증과 **다른 화면**이다)
#   `transfer_label`="송금 성공" / `tv_gme_control_no`="GME 거래번호 …" / `btn_pdf_down`="영수증 다운로드"
- extendedWaitUntil:
    visible:
      id: "transfer_label"
    timeout: 30000
- assertVisible:
    id: "tv_gme_control_no"
- takeScreenshot: "[02]_영수증_화면"

# ⚠️ `btn_pdf_down` 은 **화면 아래라 스크롤해야 닿는다**(2026-10-07 실측).
- swipe:
    direction: UP
    duration: 800
- waitForAnimationToEnd
- assertVisible:
    id: "btn_pdf_down"
- tapOn:
    id: "btn_pdf_down"
# 시스템 파일 저장 화면(DocumentsUI)이 뜬다. 파일명 접두사는 **`OverseasTransaction_`**,
# 저장 버튼은 **`button1`("저장")**. 저장하면 기기 기본 PDF 뷰어가 열린다(기기마다 다르다).
# ★ 파일명으로 도달을 판정하면 **이 송금의 영수증**이라는 것까지 함께 확인된다.
- extendedWaitUntil:
    visible:
      text: "OverseasTransaction_[0-9]*"
    timeout: 30000
- takeScreenshot: "[02]_영수증_저장화면"
- tapOn:
    id: "button1"
- waitForAnimationToEnd
# 저장이 끝나면 저장 화면이 사라진다 — 거짓 통과 방지로 **사라진 것**까지 본다
- extendedWaitUntil:
    notVisible:
      id: "button1"
    timeout: 30000
- takeScreenshot: "[02]_영수증_다운로드"

# ---- 해외송금 목록으로 복귀 ----
# ⚠️ 송금 완료 후 스택이 깊다(`02_01 [02]` 실측) → back 으로 홈까지 민 뒤
#   **파일 진입부와 같은 경로**로 목록에 다시 들어간다. back 횟수에 기대지 않는다.
# ⚠️ `${TXT_OVERSEAS_REMIT}`(해외송금) 는 **홈 타일에도 있다** → 그걸로 목록 도달을 판정하면
#   홈에서 멈춘 채 통과하고, 다음 [03] 이 송금 화면으로 들어가 버린다.
- repeat:
    times: 10
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "balloonClose"
    commands:
      - tapOn:
          id: "balloonClose"
      - waitForAnimationToEnd

# ================================================================
# ⏸ [03]~[43] — 2026-10-28 제거 (실행 시간 단축)
# ================================================================
# 48케이스 중 **High 는 [01]·[02] 둘뿐**이었고 나머지가 13분을 썼다. 중요도 High 만
# 보려 해도 저중요도까지 끌려와 회귀 한 바퀴가 5시간 19분이 되던 것을 줄인 것이다.
#   → High 를 돌리는 데 **필요한 스텝만 남긴다**(사용자 결정, 2026-10-28).
#
# ⚠️ 되살릴 수 있다. 원본 2159줄은 git 에 그대로 있다:
#     git show 73bda94:Maestro/Old/04_02_메뉴_거래내역_old.yaml
#
# ⚠️ **체크리스트 영향** — 제거한 케이스를 가리키던 행은 이제 가리킬 대상이 없다.
#   「매핑 오류」로 드러나는 것이 맞다(조용히 빈 칸으로 두지 않는다). 쓰지 않기로
#   했다면 시트 쪽에서 정리할 것.
#
# ⚠️ `13_04_해외송금받기_송금요청등록` 의 note 가 "04_02 의 인바운드 데이터를 여기서
#   만든다" 고 적고 있다 — 그 소비처였던 인바운드 케이스가 여기서 빠졌다.
#   13 시리즈를 손볼 때 같이 볼 것.
# ================================================================
