appId: ${APP_ID}
---
# ================================================================
# GME Wallet 충전 (수동 실행 전용 유틸리티)
#
# 🔴 **실계좌에서 실제로 돈이 빠진다.** `times` × `inputText` 금액이 그대로 출금된다.
#    회귀 스위트에 넣지 말 것. 다른 플로우가 runFlow로 부르지도 않는다 — 손으로만 돌린다.
#
# 실행:
#   $PSNativeCommandArgumentPassing = 'Legacy'
#   .\run_test.ps1 -lang ko -flow "Old\charge_old.yaml" -AppId com.gmeremit.online.gmeremittance_native.stag
#
# 언제 쓰나:
#   잔액이 필요한 플로우 전에 미리 채운다. 실측 기준(2026-09-01):
#     · 03_Domestic 전 케이스([01]~[06]) — 1,006원으로는 [03]에서 막힌다.
#       [03]이 **타인 은행계좌라 수수료가 1,000원 이상** 붙기 때문이다.
#     · 16_ATMWithdraw 13,000원 / 02_01 최소 송금액 + 여유(환율 연동이라 고정값 금지)
#
# ⚠️ 2026-09-01 수정 이력:
#   ① `appId`가 `...sgt`로 하드코딩돼 있었다. **그 빌드는 기기에 설치돼 있지 않아**
#      (livetest / stag / 무접미사 3개뿐) 그대로는 launch부터 실패했다 → `${APP_ID}`.
#   ② `times: 25`(= 25,000원)가 기본값이었다. 실수로 돌리면 사고라 **1로 낮췄다.**
#      여러 번 충전하려면 아래 숫자를 올린다 — **N × 1,000원이 실계좌에서 빠진다.**
#   ③ PIN 탭 앞에 화면 도달 대기를 넣었다(없으면 같은 글자를 가진 다른 요소를 집는다).
#
# ⚠️ 남은 문제: 금액 입력 필드를 **좌표(21%,87%)로 탭**한다. 해상도가 바뀌면 빗나간다.
#    → 다음에 이 화면에 들어갈 일이 있으면 `uiautomator dump`로 id를 떠서 교체할 것.
# ================================================================
- repeat:
    # 🔴 1회 = 1,000원 실충전. 올리기 전에 총액을 계산할 것.
    times: 1
    commands:
    - tapOn:
        id: "upArrow"
    - tapOn:
        id: "recharge"
    - waitForAnimationToEnd
    # ⚠️ 좌표 탭(위 헤더 참고) — id를 확인하면 교체할 것
    - tapOn:
        point: 21%,87%
    - inputText: "1000"
    - tapOn:
        id: "btn_submit1"
    - tapOn:
        id: "continueBtn"
    # PIN 화면 도달을 먼저 확정한다 — 안 기다리면 같은 글자를 가진 다른 요소를 집는다
    - extendedWaitUntil:
        visible:
          id: "input_dot_1"
        timeout: 20000
    - tapOn: "1"
    - tapOn: "2"
    - tapOn: "1"
    - tapOn: "2"
    - tapOn:
        id: "btn_diaog_ok"
