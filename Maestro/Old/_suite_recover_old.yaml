appId: ${APP_ID}
---
# ================================================================
# 헬퍼: 앱 상태를 **홈으로 정규화**한다 — 회귀 스위트 전용 (2026-09-02 작성)
# ================================================================
# 호출:
#   - runFlow: "_suite_recover_old.yaml"
#
# 왜 필요한가:
#   스위트에서 **앞 항목의 종료 상태가 매번 다르다.** 홈일 수도, 로그아웃일 수도,
#   자동 로그아웃일 수도, 다른 계정으로 로그인된 상태일 수도 있다.
#   그런데 각 플로우의 진입 블록은 대개 "특정 화면에서 시작한다"를 가정한다.
#   → 2026-09-02 `01_02`가 이 때문에 3회 연속 실패했고, 원인이 매번 달랐다:
#      ① Server Override 미처리 ② 로그아웃 상태 ③ `AutoLogoutActivity`.
#   이 헬퍼가 그 정규화를 한곳에서 맡는다.
#
# 언제 호출하나:
#   ① 항목이 **실패한 직후** — 다음 항목이 깨진 상태를 물려받지 않게 한다.
#   ② 진입이 얇은 파일(`01_02` 등)의 맨 앞.
#   ⚠️ 스위트는 **복구가 2회 연속 실패하면 중단**해야 한다. 안 그러면 남은 항목이
#      전부 FAIL로 찍히고 몇 시간이 날아간다.
#
# ⛔ `clearState`를 쓰지 않는다 — 서버 선택이 **빌드 기본값(stag=STAG)으로 초기화**되어
#   전 스위트가 조용히 STAG로 돌아간다(2026-08-27 실제 사고: logcat gmeuat 1,113건 / livetest 0건).
#   단 아래 ④에서 호출하는 `01_01_Login_Success_old.yaml`은 자체적으로 `clearState`를 쓰고
#   그 직후 Server Override를 처리하므로 결과적으로 안전하다.
#
# 다루는 상태:
#   스플래시(Server Override) / 세션 만료 팝업 / 로그아웃(초기화면) / 잠금화면(PIN) /
#   PIN 생성·재입력 / **홈이 아닌 내부 화면(back으로 탈출)** / 홈 팝업 큐 / 이미 홈
#
# ⛔ 이 헬퍼가 **고칠 수 없는 상태**: 로그인은 됐는데 **PIN이 미등록**인 경우.
#   PIN이 없으면 `launchApp`에도 **잠금화면이 아예 뜨지 않아** 감지할 마커가 없고,
#   앱은 그냥 내부 화면으로 들어간다(2026-09-02: 액티비티가 `AutoLogoutActivity`로 찍히고
#   내용은 해외송금 내역이었다 — 이름과 상태가 무관했다).
#   ⚠️ 이 상태는 **PIN 재등록 구간에서 플로우가 끊길 때 생긴다**(계정 전환은 기존 PIN을 해지한다).
#   → 빠져나오려면 `01_01_Login_Success_old.yaml`을 돌려야 한다(clearState + 로그인 + PIN 설정).
#     잠금화면을 전제하는 파일(`01_02` 등)은 그 전에는 성립하지 않는다.
# ================================================================

# ---------------------------------------------------------------
# ① 앱을 다시 띄운다. 런처·자동로그아웃 화면에 있어도 여기서 앱으로 돌아온다.
# ---------------------------------------------------------------
- launchApp
- waitForAnimationToEnd

# 화면이 뜰 때까지 **알려진 앵커 중 하나**를 기다린다.
#   optional 이라 아무것도 안 잡혀도 죽지 않는다(그 경우 아래 분기들이 순차로 처리한다).
- extendedWaitUntil:
    visible:
      text: "Server Override|4자리 숫자를 입력하세요|${REG_NEW_MEMBER}|.*간편 비밀번호를 생성.*"
    timeout: 30000
    optional: true

# ---------------------------------------------------------------
# ② Server Override 스플래시 → LIVETEST 강제
#    헬퍼 내부에 `when: visible: "Server Override"` 가드가 있어 안 뜨면 그냥 통과한다.
# ---------------------------------------------------------------
- runFlow: "_server_override_old.yaml"

# ---------------------------------------------------------------
# ③ 세션 만료 팝업 — 하루가 지나면 뜬다. PIN으로는 복구되지 않으므로 닫고 ④로 넘긴다.
# ---------------------------------------------------------------
- runFlow:
    when:
      visible: "${SESSION_EXPIRED}"
    commands:
      - tapOn:
          text: "OK|확인"
      - waitForAnimationToEnd

# ---------------------------------------------------------------
# ④ 초기화면(= 자동 로그아웃 / 로그아웃 / 세션 만료 후)이면 **검증된 로그인 플로우를 재사용**한다.
#    직접 로그인 시퀀스를 복사하지 않는다 — `transKeypad_row4` 같은 결함이 사본에만 남는 사고가
#    실제로 있었다(2026-09-02, 4곳). 한 곳만 검증하고 나머지는 호출한다.
# ---------------------------------------------------------------
- runFlow:
    when:
      visible: "${REG_NEW_MEMBER}"
    commands:
      - runFlow: "01_01_Login_Success_old.yaml"

# ---------------------------------------------------------------
# ⑤ 잠금화면이면 PIN 입력
#    ※ 키패드는 **화면 진입 시에만** 셔플되고 탭마다가 아니다(2026-09-02 실측)
#      → 탭 사이 대기는 불필요. 필요한 건 **첫 탭 전 화면 도달 확정**이고 위 ①이 그 역할을 한다.
# ---------------------------------------------------------------
- runFlow:
    when:
      visible:
        id: "input_dot_1"
    commands:
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
      - waitForAnimationToEnd

# ---------------------------------------------------------------
# ⑥ PIN 생성 화면이면 재등록 — 계정 전환이 **기존 PIN을 해지**하면 여기로 떨어진다.
#    중간에 끊기면 PIN 없는 상태로 남아 다음 실행 진입 자체가 막히므로 반드시 처리한다.
#    ⚠️ 재입력 화면 판정에 `input_dot_1`을 쓰면 안 된다 — 생성 화면에도 있어서
#      전환을 판정하지 못하고 즉시 통과한다. 문구로 판정한다(스크린샷 [27-3] 실측).
# ---------------------------------------------------------------
- runFlow:
    when:
      visible: ".*간편 비밀번호를 생성.*"
    commands:
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            text: ".*간편 비밀번호를 다시 입력.*"
          timeout: 20000
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn:
          id: "btnOk"
          optional: true
      - waitForAnimationToEnd

# ---------------------------------------------------------------
# ⑦ **홈이 아닌 내부 화면이면 back으로 빠져나온다** — 항목이 화면 깊숙이에서 실패하면
#    `launchApp`이 이전 태스크를 **재개**해 그 화면이 그대로 뜬다.
#    ⚠️ 2026-09-02: 액티비티가 `AutoLogoutActivity`로 찍혀 "자동 로그아웃"으로 오진했는데,
#      실제 내용은 **해외송금 내역**이었고(연간 송금 한도 / iv_back / imgvFilter),
#      실제 상태는 **"로그인 완료 + PIN 미등록"**이었다(사용자 확인).
#      → **액티비티 이름으로 상태를 판정하지 말 것.** 화면 내용을 덤프해서 봐야 한다.
#    ⚠️ `while: notVisible: bottom_item_home` 가드가 있으므로 홈에서는 루프가 돌지 않는다
#      → 홈에서 back이 눌려 "앱을 종료하시겠습니까?"가 뜨는 일은 없다.
# ⚠️ **back을 누르기 전에 홈이 렌더될 틈을 준다.** PIN 입력 직후엔 홈이 아직 없어서
#   `bottom_item_home`이 안 잡히고, 그 상태로 루프에 들어가면 **홈으로 가는 중에 back을 눌러**
#   앱 밖으로 빠져나간다(2026-09-02 실측: back 1회 뒤 루프가 끝났는데 뒤이은 홈 어서션이 FAILED).
#   optional 이라 홈이 아니어도 죽지 않고, 그때는 아래 루프가 정상적으로 탈출을 수행한다.
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 20000
    optional: true
- repeat:
    times: 6
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
# 그래도 종료 확인 팝업이 떴다면 취소한다(홈에 머문다).
- runFlow:
    when:
      visible: "${HOME_EXIT_CONFIRM}"
    commands:
      - tapOn: "${REG_NO}"
      - waitForAnimationToEnd

# ---------------------------------------------------------------
# ⑧ 홈을 덮는 팝업 큐 정리 — 하나가 아니라 **연달아** 뜬다. 헬퍼가 5종을 처리한다.
# ---------------------------------------------------------------
- runFlow: "_dismiss_popups_stag_old.yaml"

# ---------------------------------------------------------------
# ⑨ 홈 도달 판정 — 여기서 실패하면 **복구 실패**다(스위트가 카운트해 2회면 중단).
#    ⚠️ `btnTransfer`를 쓰지 말 것 — 구 UI 홈은 스크롤 위치를 유지해 화면 밖일 수 있다.
#      `bottom_item_home`은 항상 보이고 언어·문구에 흔들리지 않는다.
# ---------------------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 60000
- assertVisible:
    id: "bottom_item_home"
