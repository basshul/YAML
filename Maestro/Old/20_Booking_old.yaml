appId: ${APP_ID}
---
# ⚠️ 2026-09-14: 진입 가드를 **id 로 바꿨다.** 종전 한국어 문구 대안 매칭
#   (`"4자리 숫자를 입력하세요|홈으로"`)은 **en 실행에서 진입부터 막았다**(영문 UI 는
#   `Enter the 4-digit number`/`Home`). 이 가드가 26개 파일 55곳에 있었다.
#   id 는 언어에 흔들리지 않는다: 잠금화면·PIN 생성=`input_dot_1` / 홈=`bottom_item_home`
#   / Server Override=`button1`.
# ================================================================
# 시나리오: Booking
# ================================================================
# 참고: "예약"(기차표 예매) 메뉴는 외부 파트너(LACUCARACHA/라차) WebView 연동으로,
# 화면 대부분에 resource-id가 없어 text 기반 셀렉터 위주로 작성됨.
# [02]는 실제 GME Pay 결제(실제 자금 이동)까지 수행하므로, 반복 실행 시 비용이
# 누적되지 않도록 결제 완료 직후 동일 주문을 자동으로 취소까지 진행한다.
# (KTX 예매는 예매일 기준 1일 뒤 ~ 최대 한달 이내 날짜만 선택 가능하며,
#  가급적 먼 미래 날짜로 예약해야 취소 수수료가 발생하지 않는다.)
#
# ── 다국어 (2026-09-22) ──────────────────────────────────────────
# ★ 이 WebView 는 **앱 언어를 따라간다**(사용자 확인 + 실기기 en 실측). 다만 문구가 파트너
#   자체 문자열이라 **GME APK 대응표에는 하나도 없다** → `KTX_*` 키 값은 전부 en 화면 실측이다.
# ⛔ **이미지로 된 부분은 앱 언어를 따라가지 않는다** — 배너 `KTX 할인받고 떠나요!` 는 영문
#   UI 에서도 한국어 그대로다. 그래서 변수화 대상이 아니고, 진입 판정에 쓰는 `KTX` 는 그
#   배너가 아니라 **탭 라벨(ASCII)** 이라 양쪽 언어에서 같다.
# ⚠️ **결제 이후 구간은 en 값이 미확정**이다 — 확정하려면 실제 결제가 필요해 탐색을 결제
#   직전에서 멈췄다. 해당 줄마다 `# [i18n 미확정]` 을 달아 뒀다.

# 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 (구 UI 표준 블록)
# ⚠️ 종전 블록은 개편UI 기준이라 구 UI/stag 빌드에서 **첫 화면부터 죽는다**(2026-08-28 전환):
#   ① `Server Override` 스플래시 처리가 없어 launchApp 직후 그 화면에 멈춘다.
#   ② 가드가 `notVisible: text "Home"`인데 구 UI 홈엔 "Home" 텍스트가 **없다** →
#      항상 참이 되어 PIN 블록에 진입하고, 스플래시엔 키패드가 없어 `tapOn "1"`이 실패한다.
#   ③ 범용 `tapOn: "닫기"`는 엉뚱한 X를 눌러 앱을 런처로 내보낸 사고 이력이 있다 → 제거.
- launchApp
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|button1"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** — 선택값은 앱 데이터에 저장되고
      #   `clearState`가 **빌드 기본값(stag=STAG)** 으로 초기화한다. 선택을 바꾸면 버튼이
      #   `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌며 **앱이 종료**된다(둘 다 id는 `button1`).
      #   Maestro가 `checked:`를 무시해 판별이 불가하므로 **항등 시퀀스**로 처리한다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행. ⚠️ clearState 금지(선택이 또 초기화된다).
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "input_dot_1|bottom_item_home"
          timeout: 60000
# PIN <정상 PIN> — 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수(오입력 누적 = 계정 잠금)
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
# 홈 팝업은 **큐**다(배너·증빙서류 안내 등) → 헬퍼 한 곳에서 처리한다.
- runFlow:
    file: _dismiss_popups_stag_old.yaml
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# ----------------------------------------------------------------
# [01] [High] View Booking History - 예약 이력 정상노출 확인
# ----------------------------------------------------------------

# Home > (스크롤) > **"예약하기"** > 바텀시트 > "예매 내역 조회"
# ⚠️ 구 UI 홈 그리드 라벨은 **"예약하기"** 다("예약"이 아니다 — 2026-08-28 홈 덤프 실측).
#   Maestro 텍스트는 전체매칭이라 "예약"으로는 안 잡힌다
#   (03_Domestic "국내송금"→"국내 송금", 18_Telecom "통신 서비스"와 같은 계열).
#   또 구 UI에는 **"생활 & 여행" 같은 섹션 헤더가 없다** — 그리드에 항목이 평면으로 놓인다.
#   구 UI 그리드 전체: 해외송금 / 국내 송금 / 오늘의 환율 / 해외송금 받기 / 입금 /
#                     ATM 출금 / 통신 서비스 / 증명서 발급 / 예약하기
- scrollUntilVisible:
    element:
      text: "${TXT_RESERVATION}"
    direction: DOWN
    speed: 40
    visibilityPercentage: 100
    timeout: 15000
- tapOn: "${TXT_RESERVATION}"
- waitForAnimationToEnd
- assertVisible: "${SCR_TRAIN_TICKET}"
- assertVisible: "${VIEW_BOOKING_HISTORY}"
- tapOn: "${VIEW_BOOKING_HISTORY}"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${KTX_ORDER_LIST}"
    timeout: 15000
- assertVisible: "${KTX_PERIOD_STATUS}"

# 홈 복귀
- repeat:
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd

# ----------------------------------------------------------------
# [02] [High] Book Train Ticket - KTX 예약 동작 정상적으로 진행되는지 확인
#            - GME Pay 결제 동작 확인 (결제 완료 후 즉시 주문 취소로 원복)
# ----------------------------------------------------------------

- scrollUntilVisible:
    element:
      text: "${TXT_RESERVATION}"
    direction: DOWN
    speed: 40
    visibilityPercentage: 100
    timeout: 15000
- tapOn: "${TXT_RESERVATION}"
- waitForAnimationToEnd
- tapOn: "${SCR_TRAIN_TICKET}"
- waitForAnimationToEnd
# ⚠️ 2026-09-03: 예매 화면이 **백지로 뜨는 경우**가 있다(외부 WebView 로딩 실패).
#   15초 대기로는 `"KTX"`를 못 잡고 죽었다 — 스크린샷이 완전히 빈 흰 화면이었다.
#   → ① 대기를 60초로 늘리고 ② 그래도 비어 있으면 **뒤로 나갔다 재진입**해 한 번 더 로드한다.
#   재시도 후에도 안 뜨면 그때는 시끄럽게 실패시킨다(외부 서비스 장애로 판단할 근거가 된다).
- extendedWaitUntil:
    visible:
      text: "KTX"
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible:
        text: "KTX"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            text: "${SCR_TRAIN_TICKET}"
          timeout: 20000
      - tapOn: "${SCR_TRAIN_TICKET}"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "KTX"
    timeout: 60000
# ⚠️ 예매 화면은 **로딩이 느릴 때가 있다**(2026-09-03 사용자 확인 + 실측).
#   대기가 10초여서 `departure`를 못 잡거나, 잡아도 다음 요소에서 줄줄이 밀렸다 → 60초로 올린다.
- extendedWaitUntil:
    visible:
      id: "departure"
    timeout: 60000

# 출발지: 서울 / 도착지: 수원 (최근 조회 구간 목록에서 선택)
# 참고: 출발/도착 입력란은 placeholder 텍스트("출발"/"도착")가 접근성 트리에
# 노출되지 않아 id 셀렉터 사용 필요 (departure/arrival)
# ⚠️ **역 선택은 반드시 "기차역"(가나다순 전체) 목록에서 한다** (2026-08-28 실측으로 확정).
#   역 선택 화면은 3개 구역이다:
#     ① 인기 노선   — 서울-부산 / 서울-동대구 / 용산-광주송정 …  **행 하나가 출발·도착을 한꺼번에 지정**
#     ② 자주가는 기차역 — 개인화 목록이라 구성이 바뀔 수 있다
#     ③ 기차역      — 가나다순 전체 목록 (여기만 안정적이다)
#   종전 코드의 `tapOn: "서울"`은 화면에 4번 등장하는 "서울" 중 **첫 번째(인기 노선)** 를 눌렀고,
#   그 결과 의도와 다른 노선(**용산 → 광주송정**)이 선택됐다. 수원은 ①②에 아예 없다.
#   → **`수원`을 스크롤 기준점으로 삼는다.** 가나다순이라 서울·수원이 인접해 같은 화면에 함께 보이고,
#     그 지점까지 내려가면 ①②의 "서울"은 **높이 0으로 접혀** 보이는 "서울"이 하나만 남는다
#     (실측: 접힌 것 `[202,63][291,63]` 3개 / 보이는 것 `[202,1050][291,1110]` 1개).
#   ⚠️ 검색창은 쓸 수 없다 — **한글 입력이 안 된다**(Maestro `inputText`·`adb input text` 공통 제약).
- tapOn:
    id: "departure"
- waitForAnimationToEnd
# ⚠️ **`서울`은 텍스트로 특정할 수 없다** → `index`를 쓴다 (2026-08-28 실측).
#   화면에 "서울"이 5번 등장하고, **Maestro는 높이 0으로 접힌 노드도 탭 대상으로 잡는다**
#   (`Tap on "서울"`이 COMPLETED인데 아무 일도 안 일어난 실패가 이것이다).
#   등장 순서(목록 최상단 기준):
#     index 0 = 최근 조회 구간 / 1,2 = 인기 노선(서울-부산, 서울-동대구) /
#     **index 3 = 자주가는 기차역** / 4 = 기차역(전체 목록, 화면 밖)
#   → **index 3**을 쓴다. 스크롤 없이 첫 화면에 보이고 **단일 역 항목**이라 출발지만 설정된다.
#     ⚠️ 인기 노선 행(1,2)은 **출발·도착을 한꺼번에** 지정하므로 절대 누르면 안 된다.
#     ⚠️ index 0(최근 조회 구간)은 이력이 없으면 사라져 순서가 밀린다 → 아래 assert로 잡는다.
# ⚠️ 2026-09-03: 이 index가 **실제로 밀렸다** — 위 주석이 경고한 그 일이 터졌다.
#   그날 실측에 **"최근 조회 구간" 섹션이 아예 없었고**, "서울"은 [인기1, 인기2, 자주가는] 3개뿐이라
#   `index: 3`은 화면 밖 기차역 목록의 접힌 노드를 집어 **아무 일도 일어나지 않았다**
#   (`출발지 선택` 시트가 그대로 열려 있었고, 다음 `arrival`이 Element not found로 죽었다).
#   → index를 고정하지 않는다. **3 → 2 순서로 시도하고 "시트가 닫혔는지"로 판정한다.**
#     이 순서여야 안전하다: 최근 조회가 있으면 3이 자주가는 서울이고,
#     없으면 3은 접힌 노드라 무반응 → 그때만 2(자주가는 서울)로 내려간다.
#   ⛔ 순서를 뒤집으면 최근 조회가 있을 때 **index 2가 인기 노선(서울→동대구)** 을 눌러
#     출발·도착이 한꺼번에 잡히고 **엉뚱한 구간을 실제 결제**한다.
- tapOn:
    text: "${KTX_STATION_SEOUL}"
    index: 3
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "${KTX_SELECT_DEPARTURE}"
    commands:
      - tapOn:
          text: "${KTX_STATION_SEOUL}"
          index: 2
      - waitForAnimationToEnd
# 시트가 닫혔는지로 선택 성공을 판정한다 — 무반응 탭을 조용히 넘기지 않는다
- assertNotVisible: "${KTX_SELECT_DEPARTURE}"
# ⚠️ 2026-09-03: 여기서 `Element not found: Id matching regex: arrival` 로 죽었다(47스텝).
#   출발지를 고르고 돌아온 화면이 **아직 그려지기 전**에 탭한 것이다 → 도달을 먼저 강제한다.
#   WebView 요소는 탭 앞에 대기를 두지 않으면 이 화면에서 반복적으로 밀린다.
- extendedWaitUntil:
    visible:
      id: "arrival"
    timeout: 60000
- tapOn:
    id: "arrival"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "${TXT_SUWON}"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 100
- tapOn: "${TXT_SUWON}"
- waitForAnimationToEnd
# 선택 결과를 반드시 확인한다 — 잘못된 역으로 진행하면 **엉뚱한 승차권을 실제 결제**하게 된다.
- assertVisible: "${KTX_STATION_SEOUL}"
- assertVisible: "${TXT_SUWON}"

# 날짜 선택 — **취소 수수료를 피하려고 선택 가능한 가장 먼 날짜를 고른다.**
# ⚠️ 종전 코드는 `point: "81%,36%"`로 "다음 달"을 눌렀는데 **2픽셀 빗나가 실패**했다
#   (2026-08-28 실측: 버튼 실제 bounds `[821,756][929,863]`, 좌표는 y=754로 버튼 위쪽 바깥).
#   `tapOn: point`는 빗나가도 COMPLETED로 기록돼 뒤에서 `Element not found: 1`로 터진다.
#   → 달력은 **네이티브 `AlertDialog`** 이고 화살표에 content-desc가 있다 → 좌표를 버린다.
#
# 예매 가능 범위(실측): **예매일 기준 다음날 ~ 한 달 이내**.
#   2026-08-28 실행 시 9월 1~28일만 enabled, 29·30일과 "Next month"는 disabled였다.
#   ⚠️ 2026-09-03: 종전의 "다음 달 이동 후 **28일**"이 실패했다 — 위 주석이 경고한 월초 케이스다.
#     9/3 실행 시 10월은 **1·2·3일만 enabled**였고 28일 탭이 무반응 → 다이얼로그가 열린 채
#     남아 다음 `열차검색`이 Element not found로 죽었다.
#   → **날짜를 계산해서 넣는다.** 실측 2회로 규칙이 확정됐다:
#       8/28 실행 → 9월 **1~28일** enabled   /   9/3 실행 → 10월 **1~3일** enabled
#     즉 **다음 달에서 고를 수 있는 최대 일자 = 오늘 일자**다(창이 "다음날 ~ 한 달 이내"이므로).
#     ⛔ "다음 달 1일 고정"은 쓰지 말 것 — **월말에 실행하면 3일 뒤가 되어**
#        "최대한 먼 날짜를 고른다"(취소 수수료 회피)는 이 케이스의 전제가 깨진다.
#     말일 보정: 다음 달 길이로 clamp한다(8/31 → 9월은 30일까지). 어느 날 실행해도 28~31일 뒤가 나온다.
#
# 날짜 필드 — placeholder(`날짜 선택`/`Select a date`)는 **접근성 트리에 없다**(출발/도착과 같다)
#   → 텍스트로는 못 누른다.
# ⛔ 2026-09-22: 종전 좌표 `288,1338` 은 이 기기(SM-S911N/1080x2340)에서 날짜 필드가 아니라
#   **인원 선택 버튼(`성인 1명`, `[96,1166][984,1361]`)을 연다.** 해상도가 바뀌며 밀린 것이고,
#   ko 통짜가 실제로 여기서 죽었다(`SELECT DATE` 미노출). 좌표를 그대로 두면 재발한다.
# ★ 대신 **필드에 id 가 있다**: `:r4:` (EditText, `[96,1394][486,1565]`). React 자동생성 id라
#   렌더 순서가 바뀌면 달라질 수 있어(그래서 종전엔 안 썼다) **좌표를 폴백으로 남긴다** —
#   id 가 없거나 눌러도 달력이 안 뜨면 실측 중심 `291,1479` 로 한 번 더 시도한다.
- runFlow:
    when:
      visible:
        id: ":r4:"
    commands:
      - tapOn:
          id: ":r4:"
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "SELECT DATE"
    commands:
      - tapOn:
          point: "291,1479"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "SELECT DATE"
    timeout: 20000
# ⚠️ `Next month`는 **resource-id가 아니라 content-desc**다(버튼에 id·text가 없다).
#   Maestro는 content-desc를 텍스트 셀렉터로 잡으므로 `tapOn: "Next month"` 형태로 쓴다
#   (14_Deposit의 PIN 키패드도 같은 방식으로 동작한다).
# 다음 달 목표일 = min(오늘 일자, 다음 달 마지막 날)
- evalScript: ${output.maxDay = String(Math.min(new Date().getDate(), new Date(new Date().getFullYear(), new Date().getMonth() + 2, 0).getDate()))}
- tapOn: "Next month"
- waitForAnimationToEnd
- tapOn: ${output.maxDay}
- waitForAnimationToEnd
# 경계가 하루 밀리는 경우(배타적 범위)를 대비한 축소 재시도 — **다이얼로그가 닫혔는지로 판정**한다.
#   여기까지 오면 이미 목표일이 안 눌린 것이므로, 하루씩 당겨 가장 먼 날을 유지한다.
- runFlow:
    when:
      visible: "SELECT DATE"
    commands:
      - evalScript: ${output.maxDay = String(Number(output.maxDay) - 1)}
      - tapOn: ${output.maxDay}
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "SELECT DATE"
    commands:
      - evalScript: ${output.maxDay = String(Number(output.maxDay) - 1)}
      - tapOn: ${output.maxDay}
      - waitForAnimationToEnd
# 날짜를 못 골랐으면 다이얼로그가 그대로 열려 있다 → 무반응 탭을 조용히 넘기지 않는다
- assertNotVisible: "SELECT DATE"

# 열차 검색 및 첫 번째 열차 바로예약
- tapOn: "${KTX_SEARCH_BTN}"
- waitForAnimationToEnd
- assertVisible: "${KTX_RESERVE_BTN}"
- tapOn: "${KTX_RESERVE_BTN}"
- waitForAnimationToEnd
- assertVisible: "${KTX_RESERVATION_TITLE}"

# 탑승자 정보: 예매자와 동일
- tapOn: "${KTX_SAME_AS_PURCHASER}"

# 라차 T 이용권: **최저가 권종으로 변경** (기본은 최고가 → 최저가로 비용 절감,
# 어떤 금액을 선택해도 결제 총액에 그대로 더해지며 할인으로 상쇄되지 않음)
# ⚠️ 2026-09-22 실측: **1,000원권이 사라졌다** — 선택지는 10,000 / 5,000 / 3,000 뿐이고
#   기본 선택도 10,000 이다. 종전의 `1,000 원` 은 ko 에서도 실패하는 상태였다
#   (다국어와 무관한 상품 구성 변경) → **`KTX_VOUCHER_MIN` 을 3,000 으로 올렸다**(사용자 지시).
#   ⛔ 금액이 곧 회당 비용이다. 권종이 또 바뀌면 이 값부터 확인할 것.
- scrollUntilVisible:
    element:
      text: "${KTX_VOUCHER_MIN}"
    direction: DOWN
    speed: 40
    visibilityPercentage: 100
    timeout: 15000
- tapOn: "${KTX_VOUCHER_MIN}"

# 약관 전체 동의 후 예매하기
# ⛔ 2026-09-22: 종전 좌표 `14%,91%` 은 이 기기(1080x2340)에서 `전체 동의`(`[237,1469][426,1532]`)가
#   아니라 **`장바구니 담기` 버튼(`[96,2069][531,2192]`)** 위다. 그래서 약관이 동의되지 않은 채
#   `예매하기` 를 눌러 **화면이 그대로 남았고**, 다음 `주문 상세` 단언에서 죽었다(ko 통짜 실패).
#   → 라벨을 직접 누른다. en 탐색(2026-09-22)에서 같은 방식으로 결제까지 성립하는 걸 확인했다.
- scrollUntilVisible:
    centerElement: true
    direction: DOWN
    speed: 40
    visibilityPercentage: 100
    timeout: 15000
    element:
      text: "${KTX_AGREE_ALL}"
- tapOn: "${KTX_AGREE_ALL}"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "${KTX_BOOK_BTN}"
    direction: DOWN
    speed: 40
    visibilityPercentage: 100
    timeout: 15000
- tapOn: "${KTX_BOOK_BTN}"
- waitForAnimationToEnd:
    timeout: 30000
# ⚠️ 약관 동의가 빠지면 `예매하기` 는 **에러 없이 무반응**이고 화면이 그대로 남는다 →
#   여기서 걸러진다. 타임아웃을 넉넉히 준 건 주문 생성이 파트너 API 왕복이기 때문이다.
- extendedWaitUntil:
    visible:
      text: "${KTX_ORDER_DETAIL}"
    timeout: 30000

# 주문 상세 페이지 - 결제하기 (GME 페이가 기본 선택되어 있음)
# [i18n 미확정] 아래 **결제 성립 이후** 구간의 en 문구는 실제 결제를 해야 볼 수 있어 미확정이다.
#   확정: 주문 상세=`Order Detail` · 결제 진행 버튼=`PROCEED TO <금액> KRW PAYMENT`
#         · 결제 확인 팝업 버튼=`PAY`(양쪽 언어 동일, ASCII) · PIN 안내=`${ENTER_THE_LOCK}`
#   미확정: `결제완료` · `티겟 구매가…` · `주문 내역 목록` · `주문 취소하기` ·
#           `정말로…` · `주문 취소가 완료…`  ← 2026-09-22 결제 탐색이 성립하지 않아 못 봤다.
- scrollUntilVisible:
    element:
      text: "${KTX_PAY_BTN}"
    direction: DOWN
    speed: 40
    visibilityPercentage: 100
    timeout: 15000
- tapOn: "${KTX_PAY_BTN}"
- waitForAnimationToEnd

# 네이티브 결제 확인 팝업 - PAY (잔액 부족 시 연결계좌 자동충전 경고 노출됨)
# ★ 이 팝업 버튼은 en 에서도 `PAY`/`CANCEL` 그대로다(2026-09-22 실측) → 변수화 대상 아님.
- assertVisible: "PAY"
- tapOn: "PAY"
- waitForAnimationToEnd

# 간편 비밀번호(PIN) 입력 - 키패드 배열이 매번 랜덤이므로 content-desc(숫자) 기반으로 탭
- assertVisible: "${ENTER_THE_LOCK}"
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"

# 결제 완료 확인
# 2026-09-22 en 실측: 제목 `Done` / 안내 `Your ticket purchase successfully completed`(★마침표 없음,
#   ko 는 있다) / 버튼 `Order History List`. ko 원문 오타(`티겟`)는 앱 그대로다.
- extendedWaitUntil:
    visible:
      text: "${KTX_PAY_DONE_TITLE}"
    timeout: 15000
- assertVisible: "${KTX_PAY_DONE_MSG}"
- tapOn: "${KTX_ORDER_HISTORY_BTN}"
- waitForAnimationToEnd
# ⚠️ 종전엔 GME APK 키 `${ORDERED_TEXT}`(en `ORDERED`)를 썼는데 **이 화면 en 표기는
#   `Order Complete`** 라 en 에서 반드시 실패한다(2026-09-22 실측) → 파트너 전용 키로 분리했다.
- assertVisible: "${KTX_ORDER_COMPLETE}"

# 방금 결제한 주문 상세로 진입 (목록 맨 위 = 최신 주문)
- tapOn:
    point: "89%,29%"
- waitForAnimationToEnd
- assertVisible: "${KTX_ORDER_DETAIL}"

# 주문 취소하기 (예매일로부터 충분히 먼 날짜라 취소 수수료 0원)
- scrollUntilVisible:
    element:
      text: "${KTX_CANCEL_SECTION}"
    direction: DOWN
    speed: 40
    visibilityPercentage: 100
    timeout: 15000
- tapOn: "${KTX_CANCEL_SECTION}"
# 취소 수수료 계산은 파트너사 API 호출 후 노출되며, 이 WebView 콘텐츠는
# Maestro의 접근성 트리 기반 assertVisible/extendedWaitUntil로는 안정적으로
# 감지되지 않아(실제로는 렌더링되어 있어도 계속 not visible로 판정됨),
# 픽셀 비교 기반의 waitForAnimationToEnd로 대체 (충분히 긴 timeout 부여)
- waitForAnimationToEnd:
    timeout: 30000
# ★ 2026-09-22 원인 규명: 종전 주석의 "제출 버튼 bounds 가 항상 height=0 이라 텍스트로 못 누른다"는
#   **좌표 탭이 스스로 만든 결과**였다. `swipe` 뒤 `point: 540,1652` 가 누른 건 제출 버튼이 아니라
#   바로 위의 **`Train cancellation rules` 아코디언**이고, 그게 펼쳐지면서 약관 수십 줄이 끼어들어
#   제출 버튼이 렌더 영역 밖(`[147,2196][933,2196]`)으로 밀린 것이다. 그 상태를 보고 "height=0" 이라
#   적었고, 그래서 계속 좌표로 우회하는 악순환이었다.
#   → 좌표를 버린다. 아코디언을 펼친 직후 제출 버튼은 `[147,1778][933,1898]` 로 **화면 안에 있다.**
# ko 는 헤더와 제출 문구가 같아(둘 다 `주문 취소하기`) index 로 특정해야 한다. en 도 헤더/제출을
#   둘 다 받는 값(`Cancel Order|CANCEL ORDER`)으로 둬서 **양쪽 다 index 1 = 제출**이 되게 맞췄다.
# ⚠️ 2026-09-22 실측: **취소가 1회차에 실패하는 경우가 있다.** 브라우저 alert 로
#   `주문 취소가 실패했습니다`(★en UI 에서도 한국어 그대로 — 파트너사 i18n 결함)가 뜨고,
#   닫고 같은 자리를 다시 누르니 2회차에 성공했다. 같은 날 다른 시도는 1회차에 성공했으니
#   **재현이 일정하지 않다**(서버 쪽으로 보인다). 실패한 채 두면 **결제된 주문이 그대로 남으므로**
#   `16_ATMWithdraw` 의 취소와 같이 최대 3회 반복한다.
- repeat:
    times: 3
    while:
      notVisible:
        text: "${KTX_CANCEL_DONE}"
    commands:
      # 앞 회차 실패 alert 이 떠 있으면 먼저 닫는다
      - runFlow:
          when:
            visible:
              text: "${KTX_CANCEL_FAIL}"
          commands:
            - tapOn: "${BTN_CONFIRM}"
            - waitForAnimationToEnd
      # ⚠️ 아코디언을 펼쳐도 제출 버튼은 **화면 아래에 남아 있다.** 그때 bounds 가
      #   `[147,2196][933,2196]` (= 화면 하단으로 clamp 된 height 0)로 잡히고,
      #   탭은 `COMPLETED` 인데 **아무 일도 일어나지 않는다**(높이 0 노드 탭 함정).
      #   → 반드시 먼저 스크롤해 실제로 보이게 만든다.
      #   index 는 "그 순간 화면 맨 위의 매칭 요소"라 스크롤 위치에 흔들린다 → `centerElement` 로
      #   위치를 고정한다. 여기 index 가 가리키는 건 행 목록이 아니라 **한 페이지에 둘뿐인
      #   헤더/제출 버튼**이라 회차가 바뀌어도 대상이 흔들리지 않는다.
      - scrollUntilVisible:
          centerElement: true
          direction: DOWN
          speed: 40
          visibilityPercentage: 100
          timeout: 20000
          element:
            text: "${KTX_CANCEL_SUBMIT}"
            index: 1
      - tapOn:
          text: "${KTX_CANCEL_SUBMIT}"
          index: 1
      - waitForAnimationToEnd:
          timeout: 20000
      # ⛔ 루프 안에서 `extendedWaitUntil`/`assertVisible` 을 쓰면 **실패한 순간 플로우가 죽어**
      #   재시도가 무산된다(2026-09-22 실제로 이 구조로 1회차에서 멈췄다) → 조건부로만 처리하고,
      #   성립 여부는 루프를 빠져나온 뒤 한 번 단언한다.
      - runFlow:
          when:
            visible:
              text: "${KTX_CANCEL_CONFIRM_MSG}"
          commands:
            - tapOn: "${BTN_CONFIRM}"
            - waitForAnimationToEnd:
                timeout: 30000
# 루프를 빠져나온 이유가 **성공**인지 단언한다 — 3회 소진으로 빠져나와도 통과하면 거짓 통과다
- assertVisible: "${KTX_CANCEL_DONE}"
- tapOn: "${BTN_CONFIRM}"

# 홈 복귀 (WebView 자체 종료 후 앱 재시작으로 확실하게 복귀)
# ⚠️ **재시작하면 Server Override 스플래시가 다시 뜬다** — 이걸 처리하지 않고 바로 PIN을
#   누르려다 `Element not found: 1`로 실패했다(2026-08-28, 예약·취소는 이미 성공한 뒤였다).
#   진입부와 **같은 구조**로 맞춘다: 스플래시 → LIVETEST 강제 → PIN → 팝업 큐 → 홈.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|button1"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "input_dot_1|bottom_item_home"
          timeout: 60000
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    file: _dismiss_popups_stag_old.yaml
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000
