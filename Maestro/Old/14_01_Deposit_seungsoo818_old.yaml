        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_home"

# ================================================================
# [Store Deposit]
# ================================================================
# 진입 경로: Home > "입금" > 바텀시트에서 "편의점 입금"(또는 "ATM 입금", [ATM
# Deposit] 헤더 참고 - 동일 화면) 선택 → "현장 입금" 화면(신청/거래 내역 탭,
# resource-id: smartDepositTabLayout / smart_deposit_root) 직행.
#
# 신청 탭: 이용 가능 편의점(CU/GS25/7-ELEVEN/emart24) 로고, 입금 한도 안내,
# 금액 입력 필드(기본값 10,000 KRW 미리 채워짐, 10,000/50,000/100,000 KRW
# 단위 버튼), 확인 버튼, 좌하단 "?" 도움말 버튼(id: how_to_deposit)으로 구성.
# 뒤로가기는 이 화면 포함 모든 하위 화면에서 앱바 "<" 아이콘(id: iv_back,
# GME Wallet/GMEPay 섹션의 btnBackImage와는 다른 id)만 사용 가능 - 금액 입력
# 필드가 있는 화면에서는 pressKey: back이 동작하지 않음(기존 확인된 패턴과
# 동일).
#
# "확인" 탭 시 "입금을 신청하시겠습니까?" 바텀시트(신청 버튼 id: apply_btn)
# → 간편 비밀번호(PIN, 4자리, 키패드 배열 매번 랜덤) 입력 → 즉시 바코드 발급
# 화면으로 이동함(별도 서버 승인 대기 없음). 실기기 확인 결과 바코드는 유효
# 시간(10분) 종료 시 자동으로 "취소 완료" 상태가 되며(바코드 만료 안내 팝업
# 노출), 편의점에서 실제 스캔되기 전까지는 실계좌에서 자금이 이동하지 않음 -
# 기존에 확인된 안전한 테스트 패턴과 동일(취소 액션을 별도로 누를 필요 없이
# 자연 만료됨, 거래 내역에 "취소 완료"로 자동 반영).
#
# 중요(실행 간격 제약): 대기 중인 요청이 있는 동안에는 "편의점 입금"/"ATM
# 입금" 재진입 시 항상 이 바코드 화면이 먼저 노출되고 "이용 가능 편의점"
# 입력 화면은 나오지 않음(서버 측 상태이므로 앱 재시작으로도 회피 불가) -
# 실기기 확인됨([29] 실행 직후 같은 프로세스 안에서 재검증). 따라서 이 파일
# 전체(또는 [Store Deposit] 섹션만)를 [29] 실행 후 10분 이내에 재실행하면
# [28]부터 바로 실패함 - 재실행은 이전 요청이 만료된 뒤(약 10분 후)에 할 것.

# ----------------------------------------------------------------
# [28] [High] Store Deposit - Request - Deposit 금액 입력 및 Confirm 동작 확인
#            - Amount 금액 미입력 시 Confirm 버튼 비활성화 확인
# ----------------------------------------------------------------
# 참고: 실기기 확인 결과 버튼에는 별도 resource-id가 없어(단순 텍스트 "확인")
# 비활성화 상태를 id로 직접 검증할 수 없음 - 대신 금액 미입력 시 노출되는
# 빨간 안내 문구("수취 금액을 입력하세요")의 노출 여부로 검증.
# ⚠️ 홈은 **스크롤 위치를 유지**한다 → 상단 카드의 `txvDepositOrViewStatement`("입금")가
#   화면 밖일 수 있으므로 탭 전에 UP 스크롤로 끌어올린다(2026-08-25 실제 FAILED로 확인).
- scrollUntilVisible:
    element:
      id: "txvDepositOrViewStatement"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- tapOn:
    id: "txvDepositOrViewStatement"
- waitForAnimationToEnd
# 타일 탭 전에 "입금 서비스" 화면 도달을 명시적으로 기다린다(방어적 대기).
#   ※ 2026-08-25에 이 지점이 "Element not found"로 실패한 적이 있는데, 원인은 비동기 로딩이
#     아니라 **실행 중 기기에서 알림 패널을 내려 화면을 덮은 것**이었다(사용자 확인).
#     ⚠️ 이런 사고는 셀렉터 버그처럼 보이므로 오진하기 쉽다 — 실행 중에는 기기를 만지지 말 것.
- extendedWaitUntil:
    visible:
      text: "${DEPOSIT_SERVICE}"
    timeout: 30000
- tapOn: "${CONVENIENCE_STORE_TEXT}"
- waitForAnimationToEnd
- assertVisible: "${POSSIBLE_STORE}"
- tapOn:
    id: "amountFormInputField"
- eraseText: 10
- assertVisible: "${RECEIVING_AMOUNT_ERROR}"
# ⚠️ **숫자 키패드가 금액 퀵칩("10,000 KRW")을 덮는다** — 2026-09-09 SM-S911N(2340px) 실측:
#   칩이 계층에 안 잡혀 `Element not found` 로 죽었다(구 기기에서는 키패드 위로 보였다).
#   → 입력 직후라 키패드가 확실히 올라와 있으므로 여기서 닫는 건 안전하다
#     (`hideKeyboard` 는 키패드가 없을 때 뒤로가기로 동작한다 — 그래서 위치가 중요하다).
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "10,000 KRW"
- assertNotVisible: "${RECEIVING_AMOUNT_ERROR}"
# 정정(2026-07-16): 금액 입력 필드를 탭하면 뜬 숫자 키패드가 [30]의
# how_to_deposit("?" 도움말, 좌하단 [39,1564] 위치) 버튼을 가려 [30]에서
# "Element not found: how_to_deposit" 실패가 발생함(실기기 재현). "10,000
# KRW" 버튼을 눌러도 키패드는 그대로 떠 있으므로 back으로 닫음 - 이 시점엔
# 항상 키패드가 떠있어 back은 화면 네비게이션이 아닌 키패드 닫기로만 동작함.
#   ⚠️ 2026-09-09 보강: 위에서 이미 키패드를 내렸을 수 있다. 키패드가 없을 때 back 을 누르면
#     **화면을 벗어난다** → 도움말 버튼(`how_to_deposit`)이 안 보일 때(=키패드가 덮고 있을 때)만 누른다.
- runFlow:
    when:
      notVisible:
        id: "how_to_deposit"
    commands:
      - pressKey: back
      - waitForAnimationToEnd

# ----------------------------------------------------------------
# [29] [High] Store Deposit - Request - Request 완료시 Barcode, Number, Deposit Amount, Time Limit이 표시됨
# ----------------------------------------------------------------
# 실행 순서 참고: 실제 편의점 입금 요청 생성 후에는 만료(10분) 전까지 "편의점
# 입금" 재진입 시 새 입력 화면 대신 기존 바코드 화면이 그대로 노출됨(실기기
# 확인됨) - 이후 [30]~[35]가 신선한 입력 화면 상태를 전제로 하므로 충돌 방지를
# 위해 이 케이스의 실제 코드는 [Store Deposit] 섹션 맨 마지막([35] 다음)에
# 배치함. 번호/설명은 원래 TODO 순서를 유지하기 위해 여기 남겨둠.

# ----------------------------------------------------------------
# [30] [High] Store Deposit - Request - [?] 선택시 How to deposit 화면 이동 확인
# ----------------------------------------------------------------
# 참고: 실기기 확인 결과 이동한 화면의 타이틀은 앱 자체 오타로 "현장 입급
# 방법"으로 표시됨("입금"이 아닌 "입급") - 실제 렌더링 텍스트 그대로 검증.
# [28]에서 이미 "이용 가능 편의점"(레벨1 신청 화면)에 있으므로 그대로 이어서
# 검증(불필요한 홈 복귀 생략).
- tapOn:
    id: "how_to_deposit"
- waitForAnimationToEnd
- assertVisible: "${HOW_TO_DEPOSIT2}"
# ⚠️ 하단 버튼("매장에서 입금하기")은 안내 6단계 아래라 **첫 화면에 안 들어온다**
#   (2026-09-09 SM-S911N/2340px 실측: 하드 단언이 실패했다) → 스크롤해서 렌더까지 확인한다.
- scrollUntilVisible:
    element:
      text: "${START_STORE_DEPOSIT}"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
- assertVisible: "${START_STORE_DEPOSIT}"

# ----------------------------------------------------------------
# [31] [Low] Store Deposit - Request - Quick Guide 진입후 각 편의점 가이드 표시 확인
#            - GS25, CU, Seven Eleven, emart 24
# ----------------------------------------------------------------
# 참고: 실기기 확인 결과 "현장 입급 방법" 화면 상단의 "빠른 안내" 버튼이
# Quick Guide에 해당함. 진입시 편의점별 목록이 실제 한글 표기("세븐일레븐",
# "이마트24")로 노출되며(영문 "Seven Eleven"/"emart 24" 아님), 각 항목
# 선택시 해당 편의점에 설치된 ATM 기준 단계별 입금 가이드(예: CU 선택시
# "NICE ATM" 가이드, 수수료 1,500원 표시)로 이동함 - 원래 TODO가 기대한
# "각 편의점 가이드 표시"를 실제 동작에 맞게 검증.
# [30]에서 이미 "현장 입급 방법" 화면에 있으므로 그대로 이어서 검증.
# ⚠️ [30]이 하단 버튼을 보려고 **아래로 스크롤한 상태**다 → "빠른 안내"(상단)를 그대로 누르면
#   `Element not found` 다(2026-09-09 실측). 위로 되돌린 뒤 누른다.
- scrollUntilVisible:
    element:
      text: "${HOW_TO_DEPOSIT_QUICK_GUIDE}"
    direction: UP
    timeout: 20000
    visibilityPercentage: 30
- tapOn: "${HOW_TO_DEPOSIT_QUICK_GUIDE}"
- waitForAnimationToEnd
- assertVisible: "${ATM_CARD_DEPOSIT_GUIDE}"
- assertVisible: "CU"
- assertVisible: "GS25"
- assertVisible: "${SEVENELEVEN}"
- assertVisible: "${EMART}"
- tapOn: "CU"
- waitForAnimationToEnd
- assertVisible: "NICE ATM"

# ----------------------------------------------------------------
# [32] [Low] Store Deposit - Request - Start Store Deposit 선택시 Store Deposit 화면 이동 확인
# ----------------------------------------------------------------
# 참고: 실기기 확인 결과 버튼 텍스트는 "Start Store Deposit"이 아닌 "매장에서
# 입금하기"(id: btn_ok)이며, 선택 시 원래 있던 "현장 입금" 신청 화면으로
# 복귀함(별도의 새 화면으로 이동하지 않음) - 실제 동작에 맞게 검증.
# [31]은 CU 가이드(레벨4)에서 끝나고 이 케이스는 "현장 입급 방법"(레벨2)
# 화면이 필요하므로, Home까지 가는 대신 그 화면이 보일 때까지만 뒤로가기
# (홈 복귀는 다음 [33]에서도 불필요해 여기서는 생략).
- repeat:
    while:
      notVisible:
        text: "${HOW_TO_DEPOSIT2}"
    commands:
      - tapOn:
          id: "iv_back"
      - waitForAnimationToEnd
# ⚠️ `btn_ok`("매장에서 입금하기")도 안내 화면 **맨 아래**라 첫 화면엔 없다 → 스크롤 후 누른다
#   (2026-09-09 SM-S911N/2340px 실측).
- scrollUntilVisible:
    element:
      id: "btn_ok"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
- tapOn:
    id: "btn_ok"
- waitForAnimationToEnd
- assertVisible: "${POSSIBLE_STORE}"

# ----------------------------------------------------------------
# [33] [Medium] Store Deposit - History - History 탭 Deposit 이력 확인
# ----------------------------------------------------------------
# [32]에서 이미 "이용 가능 편의점"(레벨1 신청 화면)에 있으므로 그대로 이어서
# 검증(불필요한 홈 복귀 생략).
- tapOn: "${COMMON_TRANSACTION_HISTORY_BTN}"
- waitForAnimationToEnd
- assertVisible: "${SEARCH_WITH_CONTROLNO_TEXT}"
- assertVisible:
    id: "iv_calendar"

# ----------------------------------------------------------------
# [34] [High] Store Deposit - History - Control Number 검색 동작 확인
# ----------------------------------------------------------------
# 참고: 검증 편의상 이번 세션에서 미리 확인된 기존 거래번호(2026-06-24 생성,
# 취소 완료 상태)로 검색 - 해당 번호로 필터링되어 정확히 1건만 노출됨을 확인.
# [33]에서 이미 "거래 내역" 탭에 있으므로 그대로 이어서 검증.
- tapOn:
    id: "searchEditText"
- inputText: "908890131600"
- assertVisible: "908890131600"
# ⚠️ 종전엔 `assertNotVisible: "909228615390"` 이었다. 그런데 그 번호는 **이 저장소 어디에서도
#   긍정 검증된 적이 없다** — 실재하지 않거나 오타여도 assertNotVisible은 그냥 통과하므로
#   "필터가 동작한다"를 **아무것도 검증하지 못하고 있었다.**
#   → 실재를 확인할 수 없는 상수에 기대지 않고, **바로 위에서 실재가 증명된 번호**가
#     필터로 사라지는지를 본다. 이 판정은 오타로 무력화될 수 없다.
# ⚠️ **지우기만 하면 다음 입력이 반영되지 않는 경우가 있다**(9/3~9/4 G2에서 이 지점이 FAIL 이었다).
#   → 지운 뒤 **필드를 다시 탭해 포커스를 잡고**, 입력이 화면에 반영된 것을 먼저 확인한 다음
#     필터 결과를 판정한다. 이렇게 해야 "입력이 안 들어갔는데 필터 탓으로 오진"하는 걸 막는다.
- eraseText: 12
- tapOn:
    id: "searchEditText"
- inputText: "000000000000"
- assertVisible: ".*000000000000.*"
- assertNotVisible: "908890131600"
# 다음 스텝을 위해 화면 상태를 원래대로(= 검색어가 걸린 상태) 되돌린다
- eraseText: 12
- tapOn:
    id: "searchEditText"
- inputText: "908890131600"
- assertVisible: "908890131600"

# 검색 키보드만 닫기(홈 복귀는 생략 - "거래 내역" 탭으로 복귀)
- pressKey: back
- waitForAnimationToEnd

# ----------------------------------------------------------------
# [35] [High] Store Deposit - History - Date Filter 동작 확인 - [x]선택시 필터 해제됨
# ----------------------------------------------------------------
# 참고: 실기기 확인 결과 "[x] 선택시 필터 해제"가 아니라 "기간 선택"
# 바텀시트(시작/종료 날짜 휠, 취소/검색 버튼)가 노출되는 구조 - 실제 동작에
# 맞게 검증(취소 선택 시 목록 화면으로 복귀).
# [34]에서 이미 "거래 내역" 탭에 있으므로 그대로 이어서 검증.
- tapOn:
    id: "iv_calendar"
- waitForAnimationToEnd
- assertVisible: "${FILTER_BY_DATE_TEXT}"
- assertVisible: "시작 :"
- assertVisible: "종료 :"
- tapOn: "${TXT_CANCEL}"
- waitForAnimationToEnd
- assertVisible: "${SEARCH_WITH_CONTROLNO_TEXT}"

# 홈 복귀
# ⚠️ 개편UI판은 `iv_back` 2탭으로 홈까지 나왔지만 구 UI에서는 실패한다 —
#   현장 입금 하위 화면 중 `iv_back`이 **없는 화면**이 있고(2026-08-25 [34] 이후 실측:
#   "Element not found: iv_back"), 구 UI는 "입금 서비스" 화면을 한 단 더 거치기 때문에
#   나와야 할 횟수도 다르다.
#   → 특정 back id에 의존하지 않고 **기기 back 키를 홈 하단 내비가 보일 때까지 반복**한다.
- repeat:
    times: 6
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

