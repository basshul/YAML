# 안 닫히는 경우가 있어 [12]의 close 버튼과 동일한 방식으로 통일, 2026-07-08 확인). 버그로
# 리셋된 경우엔 이미 메인화면이라 아래 back 블록들이 조건부라 그대로 스킵되고 다음
# 케이스로 안전하게 진행됨
