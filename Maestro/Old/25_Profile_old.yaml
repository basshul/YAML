# [01-3] [Medium] 정보 수정 - 주소 변경 동작 확인 (직접입력 + GPS)
# CLICKUP: z8nfn6ma7u
# ----------------------------------------------------------------
# 2026-08-18 재작성. 종전에는 "저장은 KYC라 사용자 승인 필요"로 입력까지만 했으나,
#   승인을 받아 **변경 → 저장 → 반영 확인 → 원복**까지 수행하도록 바꿨다(EXIT=0).
#
# ⚠️ 기준값 = **"Yangpyeong dong sam ga Yeongdeungpo District"**(seungsoo818, 2026-08-18 실측).
#   ASCII라 원복이 가능해서 이 케이스가 성립한다. 이전 실행이 중간에 끊겨 "Test Address 100"으로
#   남아 있으면 첫 assert에서 즉시 실패한다 — 그때는 수동으로 위 원본값으로 되돌린 뒤 재실행할 것.
#   ([01-2] 직업과 같은 방침: 조용히 통과시키는 것보다 실패로 드러내는 편이 안전하다)
#
# ⚠️ **입력칸 커서 함정과 그 해법(2026-08-18 확정)**
#   `address_input_field`는 기존 주소가 채워진 채 열리고, 탭하면 **커서가 문자열 중간**에 놓인다.
#   `eraseText`는 커서 **앞쪽만** 지우므로 한 번에 비워지지 않는다
#   (그냥 inputText하면 "YangpyeonTest Address 100g dong sam ga..."처럼 값 중간에 끼워넣어진다).
#   → **[탭 + eraseText]를 6회 반복**하면 확실히 빈다. 탭할 때마다 커서가 남은 문자열의 중간으로
#     가고, 문자열이 짧아지면 탭 지점이 문자열 끝을 넘어가 커서가 끝에 붙어 전부 지워진다.
#     좌표를 쓰지 않으므로 해상도에 영향받지 않는다.
#   ※ 판정은 부분일치 정규식으로 한다(Maestro 텍스트 매칭은 전체매칭이라 앞뒤 `.*`가 필요하다).
#
# ⚠️ **저장(btn_next)하면 간편 비밀번호(PIN) 인증이 뜬다** — [01-2]와 동일하다.
#   여기서 back = 취소(커밋 안 됨). PIN 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수.
- scrollUntilVisible:
    element:
      id: "editProfileLayout"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "editProfileLayout"
- extendedWaitUntil:
    visible:
      id: "addressLayout"
    timeout: 20000
- assertVisible: ".*Yangpyeong dong sam ga Yeongdeungpo District.*"
- tapOn:
    id: "addressLayout"
- extendedWaitUntil:
    visible:
      text: "${CHANGE_YOUR_ADDRESS}"
    timeout: 20000
- assertVisible:
    id: "address_input_field"
- assertVisible:
    id: "location"
- assertVisible: "${CHANGE_YOUR_ADDRESS_INSTRUCTION}"
- takeScreenshot: "[01-3-1]_주소변경_진입"

# ---- (A) 빈 값이면 저장 불가 ----
- repeat:
    times: 6
    commands:
      - tapOn:
          id: "address_input_field"
      - eraseText: 100
- assertVisible:
    id: "btn_next"
    enabled: false
- takeScreenshot: "[01-3-2]_빈주소_저장버튼_비활성"

# ---- (B) GPS 간편입력 ----
# `location`(우측 조준 아이콘)을 누르면 **현재 위치 기반 주소가 입력칸에 자동으로 채워진다.**
# ※ 사무실에서 실행하면 채워지는 값이 등록 주소(영등포)와 사실상 같아서, 원래 값이 그대로
#   있으면 "아무 일도 안 일어난 것"처럼 보인다. 그래서 **먼저 GPSTEST라는 표식을 넣고**
#   그것이 사라지는지로 판정한다. 채워지는 문자열 자체는 실행 위치에 따라 달라지므로
#   값을 하드코딩하지 않고 "비어 있지 않다"까지만 본다.
- inputText: "GPSTEST"
- assertVisible: ".*GPSTEST.*"
# 키보드를 먼저 내린다(입력 직후라 반드시 올라와 있다 — `hideKeyboard` 는 키보드가 없으면
#   뒤로가기로 동작하므로 입력 직후에만 쓴다).
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: "location"
- waitForAnimationToEnd
# ⚠️ 위치 확보가 느릴 수 있다(실내·COARSE 권한). 2026-09-09 SM-S911N 에서 20초로는 모자라 실패했다.
- extendedWaitUntil:
    notVisible: ".*GPSTEST.*"
    timeout: 40000
- assertVisible:
    id: "btn_next"
    enabled: true
- copyTextFrom:
    id: "address_input_field"
- assertTrue: ${maestro.copiedText.length > 0}
- takeScreenshot: "[01-3-3]_GPS_주소자동입력"

# ---- (C) 직접입력 → 저장 → 반영 확인 ----
- repeat:
    times: 6
    commands:
      - tapOn:
          id: "address_input_field"
      - eraseText: 100
- inputText: "Test Address 100"
- assertVisible: ".*Test Address 100.*"
# 키보드가 저장 버튼을 가리므로 먼저 내린다
- hideKeyboard
- tapOn:
    id: "btn_next"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${ENTER_THE_LOCK}"
    timeout: 20000
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "확인|예|OK"
    commands:
      - tapOn: "확인|예|OK"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${EDIT_INFO_TEXT}"
    timeout: 30000
- assertVisible: ".*Test Address 100.*"
- takeScreenshot: "[01-3-4]_주소변경_반영확인"

# ---- (D) 원복 ----
- tapOn:
    id: "addressLayout"
- extendedWaitUntil:
    visible:
      text: "${CHANGE_YOUR_ADDRESS}"
    timeout: 20000
- repeat:
    times: 6
    commands:
      - tapOn:
          id: "address_input_field"
      - eraseText: 100
- inputText: "Yangpyeong dong sam ga Yeongdeungpo District"
- hideKeyboard
- tapOn:
    id: "btn_next"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${ENTER_THE_LOCK}"
    timeout: 20000
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "확인|예|OK"
    commands:
      - tapOn: "확인|예|OK"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${EDIT_INFO_TEXT}"
    timeout: 30000
- assertVisible: ".*Yangpyeong dong sam ga Yeongdeungpo District.*"
- assertNotVisible: ".*Test Address 100.*"
- takeScreenshot: "[01-3-5]_주소_원복확인"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_profile"

