    commands:
      - tapOn:
          id: "email_address_input_field"
      - eraseText: 60
- inputText: "${PROFILE_EMAIL_TEST}"
- assertVisible: '[\s\S]*\+test@gmail\.com[\s\S]*'
- assertVisible:
    id: "btn_next"
    enabled: true
# 키보드가 저장 버튼을 가린다 — 키보드가 뜬 상태에서는 btn_next가 화면 중간(y≈1123)에 있고
# 내리면 하단(y≈1983)으로 내려간다. 좌표로 누르지 말고 반드시 id로 누를 것.
- hideKeyboard
- tapOn:
    id: "btn_next"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${ENTER_THE_LOCK}"
    timeout: 20000
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txvDialogTitle"
    timeout: 30000
- assertVisible: "${EMAIL_CHANGE_SUCCESS}"
- takeScreenshot: "[01-5-3]_이메일변경_성공다이얼로그"
- tapOn:
    id: "btnOk"
- extendedWaitUntil:
    visible:
      text: "${EDIT_INFO_TEXT}"
    timeout: 30000
- assertVisible: '[\s\S]*\+test@gmail\.com[\s\S]*'
- takeScreenshot: "[01-5-4]_이메일변경_반영확인"

# ---- (C) 원복 ----
# 재진입 시 입력칸은 다시 빈 칸으로 열리므로 지우는 절차가 필요 없다.
- tapOn:
    id: "emailLayout"
- extendedWaitUntil:
    visible:
      text: "${CHANGE_YOUR_EMAIL_TITLE_TEXT}"
    timeout: 20000
- tapOn:
    id: "email_address_input_field"
- inputText: "${PROFILE_EMAIL}"
- hideKeyboard
- tapOn:
    id: "btn_next"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${ENTER_THE_LOCK}"
    timeout: 20000
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txvDialogTitle"
    timeout: 30000
- tapOn:
    id: "btnOk"
- extendedWaitUntil:
    visible:
      text: "${EDIT_INFO_TEXT}"
    timeout: 30000
- assertVisible: '[\s\S]*@gmail\.com[\s\S]*'
- assertNotVisible: '[\s\S]*\+test@gmail\.com[\s\S]*'
- takeScreenshot: "[01-5-5]_이메일_원복확인"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_profile"

# ----------------------------------------------------------------
# [01-6] [Low] 정보 수정 - 프로필 사진 변경 동작 확인 (Take photo, Choose photo)
# CLICKUP: z8nfn6ma7q
# ----------------------------------------------------------------
# 2026-08-18 재작성. **기존의 "카메라·갤러리는 자동화 불가"는 오판이었다** — 실기기에서 두 경로 모두
#   끝까지 자동화된다(EXIT=0 2회 확인). 예전엔 선택지 노출만 보고 부분커버로 남겨뒀었다.
#
# 진입점은 프로필 이미지 위의 **연필 아이콘 `editimage`** 다(`profileImage` 자체가 아니다).
# 프로필 사진 화면(toolbar_title "프로필 사진"): image(미리보기) / takeImage("사진 등록")
#   / chooseImage("사진 선택") / uploadPhoto("사진 업로드")
#
# 두 경로는 **같은 자르기 화면으로 합류**한다:
#   takeImage   → 삼성 기본 카메라(com.sec.android.app.camera) → 셔터 → 결과확인(retry/okay)
#   chooseImage → Android 사진 선택 도구(com.google.android.gms PhotoPickerActivity)
#   → 둘 다 → `util.NativeCropActivity` → "완료"(=${REG_DONE_GALLERY}) → 프로필 사진 화면 복귀
#
# 선택자 메모(2026-08-18 실측):
#   · 카메라 셔터는 **GL 뷰라 id도 content-desc도 없다** → 좌표 탭이 유일한 수단이다.
#     (1080x2220 기준 50%,87%. 해상도가 바뀌면 여기부터 깨진다 — [[feedback_coordinate_debug]])
#   · 반대로 촬영 결과 확인 바는 id가 살아 있다: `retry`("다시 시도") / `okay`("확인").
#   · 사진 선택 도구의 썸네일은 전부 id `icon_thumbnail`이다. 항목 자체엔 id가 없고
#     content-desc가 "2026-08-18 09:26:19에 촬영된 사진"처럼 **촬영 시각**이라 실행마다 달라진다
#     → 반드시 `icon_thumbnail` + index로 잡을 것.
#   · run_test.ps1이 매 실행 직전 테스트 이미지 4장을 push하므로 **최신순 1번째 = Global QR.jpg**로
#     고정된다. 그래서 index 0은 항상 같은 이미지다(재실행 결과가 흔들리지 않는다).
#
# ⚠️ 이 케이스는 **실제로 프로필 사진을 바꾸고 끝난다**(원복하지 않는다 — 원본 이미지가 없다).
#   종료 상태는 항상 Global QR 이미지라 재실행에는 지장이 없다. 계정: seungsoo818.
# ※ 카메라 → 갤러리 순서는 의도적이다. 갤러리 이미지로 끝나야 결과가 결정적이다
#   (카메라로 끝내면 그때 찍힌 장면이 그대로 프로필 사진으로 남는다).
- scrollUntilVisible:
    element:
      id: "editProfileLayout"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "editProfileLayout"
- extendedWaitUntil:
    visible:
      id: "editimage"
    timeout: 20000
- tapOn:
    id: "editimage"
- extendedWaitUntil:
    visible:
      text: "${PROFILE_PHOTO}"
    timeout: 20000
- assertVisible:
    id: "takeImage"
- assertVisible:
    id: "chooseImage"
- assertVisible:
    id: "uploadPhoto"
- takeScreenshot: "[01-6-1]_프로필사진_선택지"

# ---- (A) 사진 등록 = Take photo ----
- tapOn:
    id: "takeImage"
- waitForAnimationToEnd
# 카메라 권한은 이미 부여돼 있어 보통 SKIP된다. 초기화된 기기에서만 뜬다.
- runFlow:
    when:
      visible: "${SYS_PERMISSION_ALLOW}"
    commands:
      - tapOn: "${SYS_PERMISSION_ALLOW}"
      - waitForAnimationToEnd
- tapOn:
    point: "50%, 87%"
- waitForAnimationToEnd
- takeScreenshot: "[01-6-2]_촬영결과_확인화면"
- extendedWaitUntil:
    visible:
      id: "okay"
    timeout: 20000
- assertVisible:
    id: "retry"
- tapOn:
    id: "okay"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "${REG_DONE_GALLERY}"
    timeout: 20000
- tapOn: "${REG_DONE_GALLERY}"
- extendedWaitUntil:
    visible:
      text: "${PROFILE_PHOTO}"
    timeout: 20000
- assertVisible:
    id: "image"
- takeScreenshot: "[01-6-3]_카메라촬영_미리보기_반영"

# ---- (B) 사진 선택 = Choose photo ----
- tapOn:
    id: "chooseImage"
- waitForAnimationToEnd
# ⚠️ **OS 버전에 따라 사진 선택 도구가 다르다** (2026-09-09 SM-S911N / Android 16 실측).
#   구 기기: 삼성 갤러리 — 썸네일 id `icon_thumbnail`
#   이 기기: **Android 16 시스템 사진 피커**(`com.google.android.photopicker`, Compose)
#            → **resource-id가 아예 없다.** 항목은 접근성 라벨(".. 촬영된 사진")로만 잡힌다.
#   → 두 경로를 모두 받는다. 어느 쪽이든 **최신순 첫 항목(index 0)** 을 고른다
#     (`push_test_images.ps1` 이 직전에 넣은 이미지가 맨 앞이라는 전제는 그대로다).
#   ⛔ **Android 16 피커의 항목은 Maestro 로 셀렉터 지정이 불가능하다** (2026-09-09 실측):
#     resource-id 가 없고, 그리드 항목의 이름은 **접근성 라벨**("…에 촬영된 사진")에만 있는데
#     maestro 의 text 셀렉터가 그걸 매칭하지 못한다(`.*촬영된 사진.*` → SKIPPED, `사진`(탭 라벨)만 매칭).
#     → 이 경로에서만 **좌표 탭**을 쓴다. 1080x2340 기준 첫 썸네일 중심 ≈ (16%, 48%).
#       해상도가 바뀌면 여기부터 깨진다 [[feedback_coordinate_debug]].
- extendedWaitUntil:
    visible: "사진|Photos|icon_thumbnail"
    timeout: 20000
- takeScreenshot: "[01-6-4]_사진선택도구_진입"
- runFlow:
    when:
      visible:
        id: "icon_thumbnail"
    commands:
      - tapOn:
          id: "icon_thumbnail"
          index: 0
- runFlow:
    when:
      notVisible:
        id: "icon_thumbnail"
    commands:
      - tapOn:
          point: "16%, 48%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "${REG_DONE_GALLERY}"
    timeout: 20000
- tapOn: "${REG_DONE_GALLERY}"
- waitForAnimationToEnd
# ⚠️ Android 16 시스템 피커 경로에서는 **크롭 화면의 "완료"가 한 번에 안 먹는 경우**가 있다
#   (2026-09-09 실측: 완료를 눌렀는데 크롭 화면에 그대로 남아 "프로필 사진" 복귀가 실패했다).
#   → 프로필 사진 화면으로 돌아올 때까지 완료를 다시 누른다.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible:
              text: "${PROFILE_PHOTO}"
          commands:
            - runFlow:
                when:
                  visible: "${REG_DONE_GALLERY}"
                commands:
                  - tapOn: "${REG_DONE_GALLERY}"
                  - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${PROFILE_PHOTO}"
    timeout: 20000
- assertVisible:
    id: "image"
- takeScreenshot: "[01-6-5]_갤러리선택_미리보기_반영"

# ---- 업로드 커밋 ----
- tapOn:
    id: "uploadPhoto"
# 변경 성공의 실제 근거는 이 토스트다 — 화면 복귀만으로는 커밋 여부를 알 수 없다.
# 수초 후 사라지므로 uploadPhoto 직후에 바로 본다(사이에 다른 스텝을 끼우지 말 것).
- extendedWaitUntil:
    visible: "${PROFILE_CHANGE_SUCCESS}"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: "${EDIT_INFO_TEXT}"
    timeout: 30000
- assertVisible:
    id: "profileImage"
- takeScreenshot: "[01-6-6]_업로드완료_정보수정_복귀"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_profile"

# ----------------------------------------------------------------
# [01-7] [High] 정보 수정 - 한국 신분증 업로드 동작 확인 (갤러리)
# CLICKUP-PARTIAL: z8nfn6ma7w | Korean ID만 검증. ARC(외국인 신분증)는 외국인 계정(test123)이 필요해 미커버, 카메라 촬영은 BLOCKED
# ----------------------------------------------------------------
# 2026-08-18 신규. 사용자 지시: **카메라 촬영은 BLOCKED로 두고 갤러리 업로드만** 검증한다.
#   (촬영 버튼 `captureBtnImageView`의 노출까지만 확인하고 누르지 않는다)
#
# 경로: koreanIdLayout → "한국 신분증 변경"(toolbar_title) → take_photo("사진 등록")
#   → `ocr.OCRImageCaptureActivity` → **galleryBtnImageView** → Android 사진 선택 도구
#   → `util.NativeCropActivity` → "완료"(${REG_DONE_GALLERY}) → **OCR 결과 화면** → uploadPhoto("업로드")
#   → 접수 완료 화면(btn_okay "확인") → 정보 수정 복귀
#
# 화면별 실측(2026-08-18):
#   신분증 변경   passportTitle("한국인 신분증 사진") / info("주민등록증 또는 운전면허증 사진을 찍어주세요")
#                 / image / take_photo("사진 등록")   ※ **이 화면엔 갤러리 버튼이 없다**
#   OCR 촬영     btnClose / viewFinder / hintText / privacyCautionText
#                 / captureBtnImageView(셔터) / **galleryBtnImageView(갤러리)** ← 여기에 있다
#   OCR 결과     capturedImage / details("스캔한 세부 정보") / idtext+idvalue / nametext+namevalue
#                 / retakePhoto("사진 재등록") / uploadPhoto("업로드")
#   접수 완료    doneLayout / doneImage / completeText("정보")
#                 / "서류가 정상적으로 접수되었습니다. 담당자의 확인 후 승인이 완료됩니다." / btn_okay("확인")
#
#
# ⚠️⚠️ **실행 전 `push_test_images.ps1`을 먼저 돌려야 한다 (2026-08-20 사고로 추가)**
#   이 케이스는 사진 피커에서 **`icon_thumbnail` index**로 이미지를 고르는데, 그 인덱스는
#   "테스트 이미지 4장이 갤러리 최신 4개"라는 전제에 기대고 있다.
#   🚫 **종전 주석의 "run_test.ps1이 매 실행 직전 4장을 push한다"는 사실이 아니었다** —
#     run_test.ps1에는 push 로직이 아예 없다(env 파싱 + maestro 실행뿐).
#     그 사이 08_MyQR이 저장한 `gmeqr (N).jpg`가 26장 쌓여 최신 앞자리를 차지했고,
#     index 1이 ARC가 아니라 **QR 이미지**가 되어 앱이
#     **"OCR이 유효하지 않습니다. 고객센터에 문의해 주세요."**(`txvDialogTitle` "실패 - (…)")로
#     업로드를 거부했다. 즉 인덱스가 밀리면 **앱 오류처럼 보이는 실패**가 난다.
#   → `.\push_test_images.ps1` 이 4장을 다시 push하고 최신순을 고정한다
#     (index 0=Global QR / 1=ARC / 2=ID Card / 3=Passport).
# 갤러리 인덱스: push_test_images.ps1이 4장을 push하고 최신순을 고정한다
#   → 0=Global QR / 1=ARC / **2=ID Card(주민등록증)** / 3=Passport. 그래서 index 2다.
#   ⚠️ [01-6]이 카메라로 찍은 사진이 갤러리에 계속 쌓이지만, push한 4장이 항상 더 최신이라
#     0~3 인덱스는 흔들리지 않는다.
#
# OCR 검증: 업로드 전 화면이 주민등록번호와 이름을 뽑아준다. 테스트 이미지
#   `1. ID Card_Korean.jpg`는 **이 계정 본인의 신분증**이라 값이 등록 정보와 일치한다
#   (`880818-1******` / `이승수`) → 값이 뒤바뀌면 실패하도록 둘 다 assert한다.
#
# ⚠️⚠️ **이 케이스는 멱등하지 않다 — 한 번 업로드하면 담당자 승인 전까지 촬영 경로가 막힌다.**
#   재진입하면 촬영 화면 대신 접수 완료 화면(doneLayout)이 바로 뜬다
#   (passportTitle도 "한국인 신분증 사진" → "신분증 사진"으로 바뀐다).
#   → 그래서 `take_photo` 존재 여부로 분기한다:
#      · 촬영 가능 상태 → 갤러리 업로드 전 구간 수행
#      · 심사 대기 상태 → **업로드 구간을 건너뛰고 접수 상태만 확인**(로그에 SKIPPED로 남는다)
#   ⚠️ 로그에 `Run flow when id: take_photo is visible... SKIPPED`가 보이면 **업로드 경로는
#     이번 실행에서 검증되지 않은 것**이다. 전 구간을 다시 돌리려면 담당자 승인이 필요하다.
#   ⚠️ 승인 후 재실행하면 **매번 새 심사 건이 접수된다** — 담당자에게 부담이 가는 케이스라
#     리그레션에 무심코 반복하지 말 것.
#
# ⚠️ 신분증 화면들은 **FLAG_SECURE**다 — `takeScreenshot`이 실패하고(adb screencap도 0바이트)
#   플로우가 통째로 EXIT=1이 된다. **이 구간에는 스크린샷을 넣지 말 것**([[feedback_flagsecure_verify]]).
- scrollUntilVisible:
    element:
      id: "editProfileLayout"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "editProfileLayout"
- extendedWaitUntil:
    visible:
      id: "koreanIdLayout"
    timeout: 20000
- assertVisible:
    id: "koreanId"
- takeScreenshot: "[01-7-1]_정보수정_한국신분증행"
- tapOn:
    id: "koreanIdLayout"
- extendedWaitUntil:
    visible:
      text: "${CHANGE_KOREAN_ID}"
    timeout: 20000
- assertVisible:
    id: "passportTitle"

# ---- 업로드 경로: 심사 대기 중이 아닐 때만 탈 수 있다 ----
- runFlow:
    when:
      visible:
        id: "take_photo"
    commands:
      - assertVisible:
          id: "info"
      # 촬영 화면 진입 — 셔터는 노출만 확인하고 누르지 않는다(카메라 촬영 = BLOCKED)
      - tapOn:
          id: "take_photo"
      - extendedWaitUntil:
          visible:
            id: "galleryBtnImageView"
          timeout: 20000
      - assertVisible:
          id: "captureBtnImageView"
      - assertVisible:
          id: "hintText"
      - tapOn:
          id: "galleryBtnImageView"
      # ⚠️ 2026-09-14: 여기도 **OS 사진 피커가 갈린다** — 프로필 사진 경로(위)에 2026-09-09 에
      #   넣은 분기가 이 신분증 경로에는 빠져 있었다(그날은 삼성 갤러리로 떠서 드러나지 않았다).
      #   · 삼성 갤러리  → 썸네일 id `icon_thumbnail` + index
      #   · Android 16 시스템 피커 → **id 없음 · 접근성 라벨도 매칭 불가** → 좌표뿐이다
      #     (1080x2340 실측: index 0=16%,48% / 1=50%,48% / **2=83%,48%** / 3=16%,64%)
      #   index 2 = 갤러리 3번째 = ID Card(`push_test_images.ps1` 배치 순서에 의존한다)
      - extendedWaitUntil:
          visible: "사진|Photos|icon_thumbnail"
          timeout: 20000
      - runFlow:
          when:
            visible:
              id: "icon_thumbnail"
          commands:
            - tapOn:
                id: "icon_thumbnail"
                index: 2
      - runFlow:
          when:
            notVisible:
              id: "icon_thumbnail"
          commands:
            - tapOn:
                point: "83%, 48%"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "${REG_DONE_GALLERY}"
          timeout: 20000
      - tapOn: "${REG_DONE_GALLERY}"
      # Android 16 피커 경로에서는 크롭 "완료"가 한 번에 안 먹는 경우가 있다(프로필 사진 쪽과 동일)
      #   → OCR 결과 화면(`uploadPhoto`)에 도달할 때까지 완료를 다시 누른다.
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  notVisible:
                    id: "uploadPhoto"
                commands:
                  - runFlow:
                      when:
                        visible: "${REG_DONE_GALLERY}"
                      commands:
                        - tapOn: "${REG_DONE_GALLERY}"
                        - waitForAnimationToEnd
      # OCR 결과 — 주민등록번호·이름이 등록 정보와 일치하는지
      - extendedWaitUntil:
          visible:
            id: "uploadPhoto"
          timeout: 30000
      - assertVisible:
          id: "capturedImage"
      - assertVisible:
          id: "details"
      - assertVisible:
          id: "idvalue"
      - assertVisible: ".*880818-1.*"
      - assertVisible:
          id: "namevalue"
      - assertVisible: ".*이승수.*"
      - assertVisible:
          id: "retakePhoto"
      - tapOn:
          id: "uploadPhoto"

# ---- 두 경로 합류: 접수 완료 / 심사 대기 화면 ----
- extendedWaitUntil:
    visible:
      id: "btn_okay"
    timeout: 30000
- assertVisible:
    id: "completeText"
- assertVisible: "${DOC_UPLOADED_PENDING}"
- tapOn:
    id: "btn_okay"
- extendedWaitUntil:
    visible:
      text: "${EDIT_INFO_TEXT}"
    timeout: 30000
# 승인 전이라 표시값은 그대로다(업로드한 이미지도 같은 사람의 신분증이라 값이 안 바뀐다)
- assertVisible:
    id: "koreanId"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_profile"

# ----------------------------------------------------------------
# [02] [Medium] Profile - 친구 초대: 진입 + Send Link + Share QR
# CLICKUP: z8nfn6ma7y (Send Link) / z8nfn6ma7z (Share QR)
# ----------------------------------------------------------------
# 2026-08-18 확장. 종전에는 "외부 공유 시트로 이탈"한다며 진입만 확인했는데,
#   **공유 시트까지 들어가서 무엇이 공유되는지 확인하고 되돌아 나오는 것까지 자동화된다.**
#   Share QR(z8nfn6ma7z)은 그동안 아예 미커버였는데 이 케이스가 함께 덮는다.
#
# friend_invite.invite_friend.InviteFriendActivity — screenTitle "친구 초대"
# ※ 프로필의 항목명도 "친구 초대"(tv_referral)라 텍스트만으로는 진입 여부를 구분할 수 없다.
#   진입 화면 고유 안내문(tv_two)으로 식별한다.
#
# 화면 구조(2026-08-18 실측):
#   banner / tv_one("5,000 KRW를 받으세요.") / tv_two(안내문)
#   3단계 설명(친구 초대 → 회원가입 → 리워드) / checkMyRewards("보상금 확인하기")
#   btn_inviteFriends("친구 초대") ← 이걸 누르면 공유 바텀시트가 열린다
# 공유 바텀시트: shareText / **btn_send_link("링크 보내기")** / **btn_share_qr("QR 공유하기")** /
#   note("참고: 초대 링크는 WeChat에서 지원되지 않습니다.")
# ⚠️ `btn_inviteFriends`[41,1913][1039,2053]와 `checkMyRewards`[540,1989][1039,2043]가 **겹친다.**
#   버튼이 트리에서 나중에 나와 위에 그려지므로 `tapOn: id`(중심 탭)로는 버튼이 잡힌다.
#   좌표로 누를 일이 생기면 x를 왼쪽(예: 300)으로 둘 것 — 오른쪽은 보상금 링크가 먹는다.
#
# 두 버튼 모두 **안드로이드 시스템 공유 시트**(`android/…ChooserActivity`)를 띄운다. 차이는 내용물이다:
#   Send Link → 초대 링크 텍스트를 공유
#     ("5,000 KRW 캐시백…\n주소: https://online.gmeremit.com/Mobile/Redirect/DynamicCode?code=…")
#   Share QR  → **QR 이미지**를 공유(시트 미리보기가 "그림 1장"으로 뜨고 링크 텍스트는 없다)
#   → 그래서 판정을 이렇게 갈랐다: Send Link는 초대 URL이 **보이는지**,
#     Share QR은 같은 시트가 열렸는데 URL이 **안 보이는지**.
#     ("그림 1장"은 앱이 아니라 **OS 문자열**이라 기기 언어에 묶이므로 assert에 쓰지 않았다)
#
# ⚠️ **공유 대상을 절대 탭하지 말 것** — 실제로 초대 링크가 사람에게 발송된다.
#   시트가 떴는지와 내용물만 보고 back으로 나온다.
# ※ 시트 이름·아이콘은 삼성 시트(`sem_resolver_recyclerview`) 기준이다. 제조사가 바뀌면
#   이 id부터 깨진다(AOSP 기본 시트는 id 체계가 다르다).
# ※ back 횟수는 상황에 따라 1~2회다(시트가 한 번에 닫히기도 한다) → 조건부로 한 번 더 누른다.
- scrollUntilVisible:
    element:
      id: "tv_referral"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "tv_referral"
- extendedWaitUntil:
    visible:
      id: "screenTitle"
    timeout: 20000
- assertVisible:
    id: "tv_two"
- assertVisible: "${INVITE_FRIEND_TITLE_MSG}"
- assertVisible:
    id: "banner"
- assertVisible:
    id: "tv_one"
- assertVisible:
    id: "btn_inviteFriends"
- takeScreenshot: "[02-1]_친구초대_진입"

# ---- (A) 공유 바텀시트 ----
- tapOn:
    id: "btn_inviteFriends"
- extendedWaitUntil:
    visible:
      id: "btn_send_link"
    timeout: 20000
- assertVisible:
    id: "btn_share_qr"
- assertVisible:
    id: "shareText"
- assertVisible:
    id: "note"
- takeScreenshot: "[02-2]_공유바텀시트"

# ---- (B) Send Link → 시스템 공유 시트에 초대 링크가 실린다 ----
- tapOn:
    id: "btn_send_link"
# ⚠️ 삼성 구버전 전용 id 다 — 2026-09-09 SM-S911N / Android 16 에서는 시트가 정상적으로 뜨는데
#   `sem_resolver_recyclerview` 가 없어 실패했다. 시트 제목으로 판정한다
#   (링크 공유 = "텍스트 공유" / 이미지 공유 = "이미지 N개").
- extendedWaitUntil:
    visible: "텍스트 공유|이미지 [0-9]+개|Share text|[0-9]+ image[s]?"
    timeout: 20000
- assertVisible: ".*online\\.gmeremit\\.com.*"
- takeScreenshot: "[02-3]_SendLink_공유시트_초대링크"
- pressKey: back
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "btn_inviteFriends"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn_inviteFriends"
    timeout: 20000

# ---- (C) Share QR → 같은 시트에 QR 이미지가 실린다(링크 텍스트 없음) ----
- tapOn:
    id: "btn_inviteFriends"
- extendedWaitUntil:
    visible:
      id: "btn_share_qr"
    timeout: 20000
- tapOn:
    id: "btn_share_qr"
# ⚠️ 삼성 구버전 전용 id 다 — 2026-09-09 SM-S911N / Android 16 에서는 시트가 정상적으로 뜨는데
#   `sem_resolver_recyclerview` 가 없어 실패했다. 시트 제목으로 판정한다
#   (링크 공유 = "텍스트 공유" / 이미지 공유 = "이미지 N개").
- extendedWaitUntil:
    visible: "텍스트 공유|이미지 [0-9]+개|Share text|[0-9]+ image[s]?"
    timeout: 20000
# ⚠️ 종전 전제("QR 공유엔 링크 텍스트가 없다")는 이 OS 에서 성립하지 않는다 —
#   **이미지 시트에도 안내 문구(초대 링크 포함)가 함께 실린다**(2026-09-09 실측).
#   → 링크 부재 대신 **시트 제목("이미지 N개")** 으로 이미지 공유임을 구분한다(위 대기).
- takeScreenshot: "[02-4]_ShareQR_공유시트_이미지"
- pressKey: back
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "btn_inviteFriends"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn_inviteFriends"
    timeout: 20000

# 프로필 홈으로 복귀 — 마지막 케이스라도 [01]과 동일하게 원상복구하고 끝낸다
# (이 파일은 케이스마다 back으로 복귀한 상태를 이어받는 구조라, 뒤에 케이스를 추가할 때
#  복귀가 빠져 있으면 곧바로 깨진다)
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_profile"

# ----------------------------------------------------------------
# [03] [Medium] Profile - 연간 송금/수취 한도 표시 확인
# CLICKUP: z8nfn6ma80
# ----------------------------------------------------------------
# 프로필 탭 하단 `layoutOutbound` 영역. 값은 계정·기간에 따라 달라지므로 **표시 여부만** 본다.
#   연간 송금 한도: tv_yearly_remaining_label / tv_yearly_remaining / tv_yearly_remaining_currency
#   연간 수취 한도: tv_inbound_yearly_remaining_label / tv_inbound_yearly_remaining / _currency
- scrollUntilVisible:
    element:
      id: "tv_yearly_remaining_label"
    direction: DOWN
    timeout: 15000
- assertVisible: "${ANNUAL_REMITTANCE_LIMIT_TITLE}"
- assertVisible:
    id: "tv_yearly_remaining"
- assertVisible:
    id: "tv_yearly_remaining_currency"
- assertVisible: "${INBOUND_REMAINING_LIMIT_TEXT}"
- assertVisible:
    id: "tv_inbound_yearly_remaining"
- assertVisible:
    id: "tv_inbound_yearly_remaining_currency"
- assertVisible:
    id: "btn_transaction_history"

# ----------------------------------------------------------------
# [04] [Low] Profile - 거래 내역 → [i] "공유된 정보" → 자세히 알아보기 → 제3자 제공 동의서
# CLICKUP: z8nfn6ma82
# ----------------------------------------------------------------
# 프로필의 "거래 내역"(btn_transaction_history)은 History 탭이 아니라
# `new_history.annual_limit.AnnualRemittanceLimitActivity`("연간 송금 한도")로 간다.
#   → 04_Menu_History_old(하단 내비 "거래 내역")와 다른 화면이므로 중복이 아니다.
#
# ⚠️ **진입 시 "네트워크 오류로 인해 요청을 처리할 수 없습니다" 팝업이 뜬다**(2026-08-13 실측, seungsoo818).
#   한도 표시(remainingYearlyLimitValue)는 정상이고 **거래 목록 조회만 실패**한다.
#   과거 test123에서도 같은 팝업이 관찰됐으니(=계정 문제 아님) 앱/서버 이슈로 보인다.
#   케이스 진행에는 지장이 없어 조건부로 닫고 계속한다. 팝업이 안 뜨면 그대로 SKIP된다.
# ⚠️ 바텀시트의 `tv_withdraw_consent`("동의 철회 >")는 **절대 탭하지 말 것** — 실제 제3자 제공 동의를
#   철회하는 되돌리기 어려운 동작이다.
- tapOn:
    id: "btn_transaction_history"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "${BOK_OVERSEAS_REMITTANCE_ERROR}"
    commands:
      - tapOn: "${BTN_CONFIRM}"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${ANNUAL_REMITTANCE_LIMIT_TITLE}"
    timeout: 20000
- assertVisible:
    id: "remainingYearlyLimitValue"
- assertVisible:
    id: "ic_info"
# [i] → "공유된 정보" 바텀시트
- tapOn:
    id: "ic_info"
- extendedWaitUntil:
    visible:
      text: "${INFO_SHARED_LABEL}"
    timeout: 15000
- assertVisible:
    id: "txt_note"
- assertVisible: "${INFO_SHARED_ORIS_DESC}"
- assertVisible:
    id: "tv_withdraw_consent"
- takeScreenshot: profile_info_shared
# 자세히 알아보기(btnOK) → CashbeeTermsConditionWebActivity
- tapOn:
    id: "btnOK"
- extendedWaitUntil:
    visible:
      text: "${CONSENT_THIRD_PARTY_TITLE}"
    timeout: 30000
- assertVisible: "${CONSENT_SECTION_RECIPIENTS}"
- takeScreenshot: profile_third_party_consent
# 복귀: 동의서 → 연간 송금 한도 → 프로필
- tapOn:
    id: "iv_back"
- extendedWaitUntil:
    visible:
      text: "${ANNUAL_REMITTANCE_LIMIT_TITLE}"
    timeout: 20000
- tapOn:
    id: "iv_back"
- waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_profile"
