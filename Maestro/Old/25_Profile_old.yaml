# ----------------------------------------------------------------
# [01-5] [Medium] 정보 수정 - 이메일 변경 동작 확인
# CLICKUP: z8nfn6ma7t
# ----------------------------------------------------------------
# 2026-08-18 재작성. 종전에는 "인증메일 발송 등 되돌리기 어려운 절차가 붙을 수 있어" 진입만 했는데,
#   **실제로는 인증 절차가 전혀 없다** — PIN만 넣으면 즉시 커밋되고 "성공" 다이얼로그가 뜬다.
#   확인 메일 대기나 새 주소 소유 증명 같은 단계가 없어서 원복도 같은 경로로 바로 된다.
#
# ⚠️ 기준값 = **<PROFILE_EMAIL>**(seungsoo818, 2026-08-18 실측).
#   이전 실행이 중간에 끊겨 `+test`로 남아 있으면 첫 assert에서 즉시 실패한다 —
#   그때는 수동으로 위 원본값으로 되돌린 뒤 재실행할 것([01-2]·[01-3]과 같은 방침).
# ※ 테스트값으로 **같은 사서함의 플러스 주소**(`<PROFILE_EMAIL_TEST>`)를 쓴다.
#   혹시 앱이 나중에 메일을 보내게 되더라도 사용자 본인 메일함으로 들어가고, 존재하지 않는
#   도메인을 넣어 계정이 연락 불가 상태가 되는 일도 없다.
# ※ 텍스트 매칭은 정규식이므로 `+`와 `.`를 이스케이프해야 한다(`<PROFILE_EMAIL_LOCAL>\+test@gmail\.com`).
#
# 화면 구조: toolbar_title "이메일 변경" / desc 안내문 / email_address_input_field(**빈 칸으로 열린다**
#   — 주소 변경과 달리 기존 값이 안 채워져 있어 커서 함정이 없다) / btn_next("저장")
# 성공 다이얼로그(바텀시트): txvDialogTitle("성공") / txvDialogDescription / btnOk("OK")
#
# ⚠️ **앱 결함 의심(2026-08-18 발견, 케이스로는 넣지 않음)**
#   입력칸을 **비운 채로** 저장을 누르면 아무 검증 없이 PIN 인증 화면까지 넘어간다.
#   반면 형식이 틀린 값("invalidemail")은 저장 버튼이 비활성화된다 — 두 검증이 어긋나 있다.
#   빈 값으로 PIN까지 넣으면 이메일이 지워질 수 있어 **끝까지 확인하지 않았다**. 개발팀 확인 필요.
- scrollUntilVisible:
    element:
      id: "editProfileLayout"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "editProfileLayout"
- extendedWaitUntil:
    visible:
      id: "emailLayout"
    timeout: 20000
- assertVisible: '[\s\S]*@gmail\.com[\s\S]*'
- tapOn:
    id: "emailLayout"
- extendedWaitUntil:
    visible:
      text: "${CHANGE_YOUR_EMAIL_TITLE_TEXT}"
    timeout: 20000
- assertVisible:
    id: "email_address_input_field"
- assertVisible: "${CHANGE_YOUR_EMAIL_INSTRUCTION_TEXT}"
- assertVisible:
    id: "btn_next"
- takeScreenshot: "[01-5-1]_이메일변경_진입"

# ---- (A) 형식 오류면 저장 불가 ----
- tapOn:
    id: "email_address_input_field"
- inputText: "invalidemail"
- assertVisible:
    id: "btn_next"
    enabled: false
- takeScreenshot: "[01-5-2]_형식오류_저장버튼_비활성"

# ---- (B) 변경 → 저장(PIN) → 반영 확인 ----
# (A)에서 넣은 값을 지운다 — 입력칸을 탭하면 커서가 문자열 중간에 놓이므로
# [탭 + eraseText]를 반복해 비운다(주소 변경 [01-3]과 같은 이유).
- repeat:
