appId: ${APP_ID}
---
# ================================================================
# 시나리오: Profile (프로필 탭) — 구 UI
# ================================================================
#  진행: **EXIT=0 / 11케이스** (2026-08-18, seungsoo818 실기기). **이 파일 작업 종료.**
#    남은 미커버는 전화번호 변경(OTP)과 신분증·여권의 카메라 촬영뿐이고, 둘 다
#    사용자 확정 BLOCKED다 — 더 손댈 것이 없다.
#    2026-08-18 [01-7] 한국 신분증 갤러리 업로드 신규 작성. 촬영 화면 안의 갤러리 버튼
#      (`galleryBtnImageView`)으로 들어가 OCR 결과 확인 후 업로드까지 수행한다.
#      ⚠️ 업로드 전 구간은 **탐색 중 수동으로 확인**했고, 플로우 자체로는 아직 못 돌렸다
#        (그 업로드 때문에 계정이 심사 대기로 잠겨 업로드 분기가 SKIP된다). 승인 후 재실행 필요.
#    2026-08-18 [02] 친구 초대를 '진입만'에서 **Send Link / Share QR 공유 시트 확인**까지 확장(EXIT=0).
#      미커버였던 Share QR(z8nfn6ma7z)이 이 케이스로 함께 덮여 **미커버 0건**이 됐다.
#    2026-08-18 [01-5] 이메일 변경을 '진입만'에서 **변경·저장·원복 전체**로 재작성(EXIT=0).
#      인증메일 절차가 붙는다던 우려는 사실이 아니었다(PIN만으로 즉시 커밋).
#    2026-08-18 [01-3] 주소 변경을 '입력만'에서 **직접입력·GPS·저장·원복 전체**로 재작성(EXIT=0).
#    2026-08-18 [01-6] 프로필 사진 변경을 '선택지 노출만'에서 **동작 확인 전체**로 재작성(EXIT=0 2회).
#      카메라·갤러리가 자동화 불가라던 종전 판단이 틀렸음이 확인돼 ClickUp z8nfn6ma7q를 완료로 승격.
#    2026-08-14 [01-1] 외국인 계정(test123) 분기 추가·검증 완료(EXIT=0) — 남은 ⬜ 없음.
#    2026-08-13 정보 수정 하위 6건([01-1]~[01-6]) + 한도/공유정보 2건([03][04]) 추가 —
#    '진입 확인'만 있던 파일에 화면 내부 동작이 들어왔다.
# 2026-08-12 구 UI 기준 재작성. 대상 = HomeActivityV2의 하단 내비 "프로필" 탭.
#
# 실행 전 확인 — 이 액티비티가 아니면 이 파일을 돌리지 말 것:
#   adb shell dumpsys window | Select-String mCurrentFocus
#     → ...homeV2.view.HomeActivityV2
#
# 구 UI 프로필 탭 구조 (2026-08-12 실측):
#   랜딩(스크롤 최상단): profileText("프로필") + 총 송금액 요약
#                        tv_amount_info_text / tv_total_amount / tv_total_count / tv_gme_wallet
#   ↓ 스크롤하면:        tv_user_name / tv_user_id / tv_phone_number / tv_email
#                        editProfileLayout("정보 수정")
#                        tv_bank_name("잔액") / tvBalanceTextView / tv_wallet_number / tv_wallet_bankname
#                        tv_referral("친구 초대")
#                        tv_yearly_remaining_label("연간 송금 한도") / tv_inbound_yearly_remaining_label("연간 수취 한도")
#                        btn_transaction_history("거래 내역")
#   ※ 진입 대상은 **랜딩에 없고 스크롤해야 나온다** → 케이스마다 scrollUntilVisible 필요.
#   ※ 구 UI 프로필 탭에는 **로그아웃이 없다**(드로어에 있음 → 26_Menu_old [09]).
#
# 이 파일의 범위 (2026-08-12 중복 정리, 11건 삭제):
#   드로어 항목 8건(은행계좌연결/송금받을계좌/지점/GME소개/개인정보/이용약관/설정/로그아웃) → 26_Menu_old
#   쿠폰함 → 04_Menu_History  /  GME Wallet 거래내역·리워드 포인트 → 홈에서 확인
#   → 프로필 탭 고유 항목만 남김.
#
# 케이스 목록:
#   전 케이스 2026-08-13 실기기 PASS (EXIT=0).
#   [01]    정보 수정 진입 확인
#   [01-1]  정보 수정 항목 노출 확인
#   [01-2]  직업 변경 → 저장(PIN) → 반영 확인 → 원복   **실제로 값을 바꾸는 유일한 케이스**
#   [01-3]  주소 변경 동작 확인          **직접입력+GPS+저장+원복까지** (2026-08-18)
#   [01-4]  휴대폰 번호 변경 진입          🚫 실제 변경은 **BLOCKED**(OTP 인증 필요, 사용자 확정)
#   [01-5]  이메일 변경 동작 확인        **변경+저장(PIN)+원복까지** (2026-08-18)
#   [01-6]  프로필 사진 변경 동작 확인    **카메라·갤러리 양 경로 + 실제 업로드까지** (2026-08-18)
#   [01-7]  한국 신분증 업로드(갤러리)    카메라 촬영은 BLOCKED. **멱등 아님 — 승인 전엔 업로드 구간 SKIP**
#   [02]    친구 초대: 진입 + Send Link + Share QR  **공유 시트 내용물까지** (2026-08-18)
#   [03]    연간 송금/수취 한도 표시 확인
#   [04]    거래 내역 → [i] "공유된 정보" → 자세히 알아보기 → 제3자 제공 동의서
#
# 계정 국적 — [01-1]이 **양쪽을 조건부로 모두 커버**한다(2026-08-14 test123으로 확인 완료).
#   ✅ 한국인(seungsoo818) : koreanIdLayout 노출 / passportLayout·arcLayout 미노출  (2026-08-13)
#   ✅ 외국인(test123)     : passportLayout("신분증")+arcLayout("외국인 등록증") 노출 /
#                            koreanIdLayout 미노출                                   (2026-08-14, EXIT=0)
#   그 외 행(phone/email/address/occupation/보안 2종)과 `editimage`는 양쪽 동일하다.
#   ※ 2026-08-18 정정: "촬영·업로드는 자동화 불가"는 틀렸다. 촬영 화면 안의 **갤러리 버튼**으로
#     업로드까지 자동화된다. 한국인 = 이 파일 [01-7],
#     **외국인 ARC·여권 = `Old\25_Profile_Foreign_old.yaml`([F-01]/[F-02])로 분리**했다
#     (test123 프로필 탭에는 `tv_total_amount`가 없어 이 파일의 공통 진입이 통하지 않는다).
#   ※ 프로필 사진 뷰 id만 다르다(한국인 `profileImage` / 외국인 `profileImageDefault`).
#     [01-6]은 `editimage`를 쓰므로 영향 없다.
#
# 나머지 케이스는 한국인 계정(seungsoo818) 기준이다 — 특히 [01-2]의 기준값 "직장인".
#
# ClickUp `[Profile] 시나리오`(z8nfn6m9z8, 11건) 대조 — 2026-08-13 / 2026-08-18 갱신
#   ✅ 커버완료 8건 (`# CLICKUP:` 주석 = 리포트가 complete로 올림)
#      z8nfn6ma7v  직업변경 동작 확인            → [01-2] (변경·저장·반영·원복까지 수행)
#      z8nfn6ma7q  프로필 사진 변경(Take/Choose) → [01-6] **2026-08-18 완료로 승격**
#                  (카메라 촬영·갤러리 선택·자르기·실제 업로드까지 전부 수행)
#      z8nfn6ma7u  주소변경(직접입력+GPS)        → [01-3] **2026-08-18 완료로 승격**
#                  (GPS 자동입력 + 직접입력 저장·반영·원복까지 수행)
#      z8nfn6ma7t  이메일 변경                   → [01-5] **2026-08-18 완료로 승격**
#                  (인증 절차가 없어 변경·저장·반영·원복까지 수행. 형식오류 차단도 확인)
#      z8nfn6ma80  연간 잔여 송금 한도 표시      → [03]
#      z8nfn6ma82  [i] '공유된 정보' → Learn more → [04] (제3자 제공 동의서 도달까지)
#      z8nfn6ma7y  Invite Friend 링크(Send Link) → [02] **2026-08-18 완료로 승격**
#      z8nfn6ma7z  Invite Friend QR 공유(Share QR) → [02] **2026-08-18 신규 커버**
#                  (둘 다 시스템 공유 시트까지 열어 공유 내용물을 확인. 대상은 탭하지 않는다)
#   ◐ 부분커버 3건 (to do 유지 — 각 케이스 위에 사유 주석)
#      z8nfn6ma7r  전화번호 변경                 → [01-4] 진입만.
#                  🚫 **실제 변경은 BLOCKED(OTP 인증 필요) — 2026-08-18 사용자 확정, 추가 작업 없음**
#      z8nfn6ma7w  신분증 촬영·업로드(Korean ID/ARC) → [01-1] 행 노출(양쪽) + [01-7] Korean ID
#                  + **25_Profile_Foreign_old [F-01] ARC**(2026-08-18). 카메라 촬영은
#                  사용자 지시로 BLOCKED → 그 부분만 미커버
#      z8nfn6ma7x  여권 촬영·업로드 + 한국국적 Passport 미노출 → 미노출은 [01-1]이 확인,
#                  **업로드는 25_Profile_Foreign_old [F-02]**(2026-08-18). 카메라 촬영은
#                  사용자 지시로 BLOCKED → 그 부분만 미커버
#   ✗ 미커버 0건
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\25_Profile_old.yaml"
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 → 프로필 탭 ----------------
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
# 잠금화면을 명시적으로 대기한 뒤 PIN 입력(탭 사이 정착 대기 필수 — 키패드가 매 탭 재배치됨)
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${BTN_CLOSE}"
      # ⚠️ 맹목적 팝업 닫기 — 상세 사유는 07_TodaysRate_old.yaml 의 같은 블록 주석 참고.
      #   요약: 런처 이탈 사고 이력이 있으나, id로 안 닫히는 팝업이 남아 진입이 막힐 수 있어
      #   지우지 않고 **이미 홈에 도달했으면 누르지 않도록** 가드만 좁혔다.
      notVisible:
        id: "btnTransfer"
    commands:
      - tapOn: "${BTN_CLOSE}"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 30000

# 프로필 탭 진입 — 하단 내비 라벨은 content-desc라 id로 탭한다.
# ※ 탭을 재선택하면 직전에 열었던 서브화면이 백스택에서 복원되는 함정이 있으므로
#   **여기서 1회만 누르고**, 이후 케이스는 back으로 프로필 홈에 복귀한 상태를 이어받는다.
- tapOn:
    id: "bottom_item_profile"
- extendedWaitUntil:
    visible:
      id: "tv_total_amount"
    timeout: 20000

# ----------------------------------------------------------------
# [01] [Medium] Profile - 정보 수정 진입 확인
# ----------------------------------------------------------------
# new_profile.view.ProfilePageActivity — toolbar_title "정보 수정",
#   fullname / 국적 / 생년월일 / 사용자 ID 노출
- scrollUntilVisible:
    element:
      id: "editProfileLayout"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "editProfileLayout"
- extendedWaitUntil:
    visible:
      id: "toolbar_title"
    timeout: 20000
- assertVisible:
    id: "fullname"
- assertVisible: "${REG_USER_ID}"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_profile"

# ================================================================
# [01-x] 정보 수정 하위 — 실제 정보 변경 케이스 (2026-08-13 작성 / 구 UI 실측 반영)
# ================================================================
# ⚠️ APK 레이아웃(activity_user_general_detail 등)은 **구 UI와 다른 화면**이었다.
#   1차 작성분은 APK 기준이라 [01-1]부터 실패했고, 아래는 2026-08-13 **실기기 덤프로 교정**한 것이다.
#   (APK의 tv_occupation / iv_edit_city / btn_submit 계열은 구 UI에 존재하지 않는다 — 쓰지 말 것)
#
# 구 UI 정보 수정 화면 = `new_profile.view.ProfilePageActivity`, toolbar_title "정보 수정"
#   profileImage + editimage(연필) / fullname / 국적 / 생년월일
#   나         : 사용자 ID(값만 텍스트) / phoneLayout / emailLayout / addressLayout
#                occupationLayout(+`occupation`이 현재값 텍스트)
#   내 ID 세부 : koreanIdLayout(+koreanId)   ※ 한국인 계정 기준. 외국인은 신분증 종류가 다름
#   보안       : loginPasswordLayout / simplePasswordLayout
#                → 이 둘의 **내부 동작은 04_02 / 04_01이 담당**한다. 여기서는 노출만 본다.
#
# 각 행을 탭하면 열리는 변경 화면(모두 같은 액티비티, 하단 버튼은 전부 `btn_next` = "저장"):
#   occupationLayout → "직업을 변경하세요"   occupationInput 탭 → 바텀시트(dialogTitleTxt "직업 선택",
#                       closeIcon, rv_radioButtons, 항목 id는 전부 `rb_button`)
#                       항목 9종: 사업가 / 직장인 / 자영업자 / 퇴직자 / 학생 / 주부 / 공무원 / 실업자 / 여행자
#   addressLayout    → "주소 변경"           address_input_field(현재값 채워져 있음) / location(간편입력)
#   phoneLayout      → "휴대폰 번호 변경"    phone_number_input_field(hint "새 휴대폰 번호")
#   emailLayout      → "이메일 변경"         email_address_input_field(hint "새 이메일")
#   editimage        → "프로필 사진"         image / takeImage("사진 등록") / chooseImage("사진 선택")
#                                            / uploadPhoto("사진 업로드")
#
# ⚠️ **한글 입력 불가 제약**([[feedback_maestro_ascii_input]]): Maestro inputText는 한글을 못 넣는다.
#   → 타이핑 입력 항목(주소/휴대폰/이메일)은 **저장하지 않고** 입력 동작까지만 검증하고,
#     실제 변경+원복은 **라디오 선택식인 직업([01-2])** 으로 한다.
# ================================================================

# ----------------------------------------------------------------
# [01-1] [Medium] 정보 수정 - 항목 노출 확인
# ----------------------------------------------------------------
- scrollUntilVisible:
    element:
      id: "editProfileLayout"
    direction: DOWN
    timeout: 15000
- tapOn:
