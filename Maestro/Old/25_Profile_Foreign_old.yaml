appId: ${APP_ID}
---
# ================================================================
# 시나리오: Profile 신분증 업로드 — **외국인 계정(test123)** / 구 UI
# ================================================================
#  진행: 2026-08-18 신규. ARC(앞면+뒷면) / 여권 업로드 전 구간을 **탐색 중 수동으로 완주**했고
#    (둘 다 "서류가 정상적으로 접수되었습니다" 도달), 그 업로드 때문에 계정이 심사 대기로 잠겨
#    **플로우 자체로는 업로드 분기를 아직 못 돌렸다.** 담당자 승인 후 재실행 필요.
#
# 왜 파일을 나눴나 — `25_Profile_old.yaml`은 **seungsoo818(한국인) 전용**이다:
#   · 공통 진입이 `tv_total_amount`를 기다리는데 **test123 프로필 탭에는 이 뷰가 없다**
#     (외국인 계정 랜딩에는 총 송금액 요약 카드가 없다 → `profileText`로 판정해야 한다).
#   · [01-2] 직업 "직장인" / [01-3] 주소 / [01-5] 이메일 / [01-7] koreanId 등 기준값이 전부
#     seungsoo818 것이라 test123에서는 실패한다.
#   → 그래서 국적이 갈리는 신분증 업로드만 이 파일로 분리했다.
#
# ⚠️ **실행 전 test123으로 로그인돼 있어야 한다.** 이 파일은 계정 전환을 하지 않는다
#   (전환 플로우에 범용 팝업 닫기를 넣으면 로그인이 깨진 사고 이력이 있어 분리해 두었다 —
#    [[project_25_profile]] / [[project_01_login]]의 구 UI 계정 전환 경로 참고).
#   확인: adb shell dumpsys window | Select-String mCurrentFocus → ...homeV2.view.HomeActivityV2
#   그리고 정보 수정에 `arcLayout`·`passportLayout`이 있어야 한다(한국인 계정은 `koreanIdLayout`).
#
# test123 실측(2026-08-18): fullname "test123" / 국적 South Africa / 생년월일 1992-07-18
#   passportLayout("신분증") + passportNo `111********`
#   arcLayout("외국인 등록증") + arcNo `11223344550`
#
# ⚠️⚠️ **테스트 이미지가 이 계정 본인 서류가 아니다** — 한국인 케이스([01-7])와 다른 점이다.
#   `3. ARC.jpg`      OCR → `950220-5******` / **ADHIKARI MANISH**
#   `2. Passport.jpg` OCR → `M75******`      / **LEE SEUNGSOO**
#   test123의 등록값(11223344550 / test123)과 일치하지 않는다. 즉 이 케이스가 검증하는 것은
#   **"갤러리 이미지 → OCR → 접수" 경로가 동작하는가**이고, 신원 일치 검증은 담당자 심사 몫이다.
#   → OCR assert는 **계정 값이 아니라 이미지 값**으로 걸었다(이미지가 고정이라 결정적이다).
#   ※ 심사에 신원 불일치 건이 올라가므로 담당자에게 미리 알려두는 편이 좋다.
#
# ⚠️ 로그인 직후 test123에는 **"증빙 서류 안내"(문서가 만료되었습니다) 바텀시트**가 뜬다
#   (`title`/`body`/`updateBtn`("지금 업로드")/`remindLaterBtn`("나중에 하기")/`close`).
#   `updateBtn`이 서류 업로드로 가는 또 다른 진입점이지만, 이 파일은 [01-7]과 같은 경로
#   (정보 수정 → 행 탭)로 통일했다. 시트는 `remindLaterBtn`으로 닫는다.
#   이어서 인앱 배너 팝업(`btnOne`("열기")/`btnTwo`("닫기"))이 뜰 수 있어 `btnTwo`로 닫는다.
#
# ⚠️ 신분증 관련 화면은 **FLAG_SECURE**다 — `takeScreenshot`이 실패하고 플로우가 EXIT=1이 된다
#   (adb screencap도 0바이트). **이 구간에는 스크린샷을 넣지 말 것**([[feedback_flagsecure_verify]]).
#
# ⚠️ **멱등하지 않다.** 한 번 접수하면 담당자 승인 전까지 촬영 경로가 막히고, 재진입하면
#   접수 완료 화면(`doneLayout`)이 바로 뜬다 → `take_photo` 유무로 분기한다([01-7]과 동일).
#   로그에 `Run flow when id: take_photo is visible... SKIPPED`가 보이면 **그 실행에서는
#   업로드 경로가 검증되지 않은 것**이다. 승인 후 재실행하면 매번 새 심사 건이 접수된다.
#
#
# ⚠️⚠️ **실행 전 `push_test_images.ps1`을 먼저 돌려야 한다 (2026-08-20 사고로 추가)**
#   이 케이스는 사진 피커에서 **`icon_thumbnail` index**로 이미지를 고르는데, 그 인덱스는
#   "테스트 이미지 4장이 갤러리 최신 4개"라는 전제에 기대고 있다.
#   🚫 **종전 주석의 "run_test.ps1이 매 실행 직전 4장을 push한다"는 사실이 아니었다** —
#     run_test.ps1에는 push 로직이 아예 없다(env 파싱 + maestro 실행뿐).
#     그 사이 08_MyQR이 저장한 `gmeqr (N).jpg`가 26장 쌓여 최신 앞자리를 차지했고,
#     index 1이 ARC가 아니라 **QR 이미지**가 되어 앱이
#     **"OCR이 유효하지 않습니다. 고객센터에 문의해 주세요."**(`txvDialogTitle` "실패 - (…)")로
#     업로드를 거부했다. 즉 인덱스가 밀리면 **앱 오류처럼 보이는 실패**가 난다.
#   → `.\push_test_images.ps1` 이 4장을 다시 push하고 최신순을 고정한다
#     (index 0=Global QR / 1=ARC / 2=ID Card / 3=Passport).
# 갤러리 인덱스(push_test_images.ps1 기준):
#   0=Global QR / **1=ARC** / 2=ID Card / **3=Passport**
#
# 케이스:
#   [F-01] 외국인 등록증(ARC) 업로드 — 앞면 + 뒷면 2단계
#   [F-02] 여권 업로드 — 단일 단계
#
# ClickUp 대조:
#   z8nfn6ma7w  신분증 촬영·업로드(Korean ID/ARC) → Korean ID는 25_Profile_old [01-7],
#               **ARC는 여기 [F-01]**. 둘을 합쳐야 이 케이스가 완결된다.
#   z8nfn6ma7x  여권 촬영·업로드 + 한국국적 Passport 미노출 → 업로드는 [F-02],
#               한국국적 미노출은 25_Profile_old [01-1]이 이미 확인했다.
#   ※ 카메라 촬영은 **사용자 지시로 BLOCKED** — 셔터(`captureBtnImageView`) 노출만 확인한다.
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\25_Profile_Foreign_old.yaml"
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 → 프로필 탭 ----------------
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "4자리 숫자를 입력하세요"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "보이스 피싱 주의"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
# 외국인 계정 전용: 서류 만료 안내 바텀시트 → "나중에 하기"
- runFlow:
    when:
      visible:
        id: "remindLaterBtn"
    commands:
      - tapOn:
          id: "remindLaterBtn"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "나중에 하기"
    commands:
      - tapOn: "나중에 하기"
      - waitForAnimationToEnd
# 인앱 배너 팝업 → "닫기"(id로 정확히 지정 — 범용 문자열 탭은 오탭 위험)
- runFlow:
    when:
      visible:
        # ⚠️ 인앱 배너 닫기 id는 **빌드마다 다르다**(2026-08-27 실측):
        #   7.19.x = `btnTwo` / **7.20.0 = `btnClose`**(+ `btnDontShowToday` "오늘 하루 보지 않기").
        #   Maestro id는 정규식이라 둘을 함께 받는다. 배너가 홈 요소를 덮어
        #   `btnTransfer` assert가 실패하는 사고가 있었다.
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 30000
# ⚠️ 홈/프로필 판정에 `tv_total_amount`를 쓰지 말 것 — 외국인 계정에는 없다.
- tapOn:
    id: "bottom_item_profile"
- extendedWaitUntil:
    visible:
      id: "profileText"
    timeout: 20000
# 이 파일이 외국인 계정에서 돌고 있는지 먼저 확인한다(한국인 계정이면 여기서 즉시 실패)
- scrollUntilVisible:
    element:
      id: "editProfileLayout"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "editProfileLayout"
- extendedWaitUntil:
    visible:
      text: "정보 수정"
    timeout: 20000
- assertVisible:
    id: "arcLayout"
- assertVisible:
    id: "passportLayout"
- assertVisible:
    id: "arcNo"
- assertVisible:
    id: "passportNo"

# ----------------------------------------------------------------
# [F-01] [High] 외국인 등록증(ARC) 업로드 — 앞면 + 뒷면
# CLICKUP: z8nfn6ma7w
# ----------------------------------------------------------------
# 한국 신분증([01-7])과 달리 **2단계**다. 화면 상단에 `frontArcTitle`("외국인 등록증 앞면") /
#   `hr` / `backArcTitle`("외국인 등록증 뒷면") 스테퍼가 있고, 단계는 `info` 문구로 갈린다:
#     앞면 "외국인 등록증의 앞면을 캡쳐해 주세요."  → 완료 버튼 `uploadPhoto` 라벨이 **"다음"**
#     뒷면 "외국인 등록증의 뒷면을 캡쳐해 주세요."  → 완료 버튼 `uploadPhoto` 라벨이 **"업로드"**
#   ※ 두 단계의 id가 전부 같다(take_photo / capturedImage / retakePhoto / uploadPhoto)
#     → **`info` 문구로 단계를 구분해야 한다.**
#   ※ **뒷면에는 OCR이 없다**(scannedDetailsLayout 없음). 앞면에서만 번호·이름을 뽑는다.
# ※ 뒷면용 별도 이미지가 없어 **앞면과 같은 ARC 이미지(index 1)를 재사용**한다.
#   앱은 뒷면 이미지를 OCR하지 않으므로 접수까지는 문제없이 진행된다.
- tapOn:
    id: "arcLayout"
- extendedWaitUntil:
    visible:
      text: "외국인 등록증 변경"
    timeout: 20000
- assertVisible:
    id: "frontArcTitle"
- assertVisible:
    id: "backArcTitle"

- runFlow:
    when:
      visible:
        id: "take_photo"
    commands:
      # ---- 앞면 ----
      - assertVisible: ".*외국인 등록증의 앞면을 캡쳐해 주세요.*"
      - tapOn:
          id: "take_photo"
      - extendedWaitUntil:
          visible:
            id: "galleryBtnImageView"
          timeout: 20000
      # 카메라 촬영은 BLOCKED — 셔터 노출만 확인한다
      - assertVisible:
          id: "captureBtnImageView"
      - tapOn:
          id: "galleryBtnImageView"
      - extendedWaitUntil:
          visible:
            id: "icon_thumbnail"
          timeout: 20000
      - tapOn:
          id: "icon_thumbnail"
          index: 1
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "${REG_DONE_GALLERY}"
          timeout: 20000
      - tapOn: "${REG_DONE_GALLERY}"
      # 앞면 OCR 결과 — 값은 **테스트 이미지 기준**(계정 등록값과 다르다, 헤더 참고)
      - extendedWaitUntil:
          visible:
            id: "uploadPhoto"
          timeout: 30000
      - assertVisible:
          id: "capturedImage"
      - assertVisible:
          id: "details"
      - assertVisible: ".*950220-5.*"
      - assertVisible: ".*ADHIKARI MANISH.*"
      - assertVisible:
          id: "retakePhoto"
      # "다음" → 뒷면 단계로
      - tapOn:
          id: "uploadPhoto"
      - extendedWaitUntil:
          visible: ".*외국인 등록증의 뒷면을 캡쳐해 주세요.*"
          timeout: 20000
      # ---- 뒷면 ----
      - tapOn:
          id: "take_photo"
      - extendedWaitUntil:
          visible:
            id: "galleryBtnImageView"
          timeout: 20000
      - tapOn:
          id: "galleryBtnImageView"
      - extendedWaitUntil:
          visible:
            id: "icon_thumbnail"
          timeout: 20000
      - tapOn:
          id: "icon_thumbnail"
          index: 1
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "${REG_DONE_GALLERY}"
          timeout: 20000
      - tapOn: "${REG_DONE_GALLERY}"
      # 뒷면은 OCR이 없다 — 미리보기와 버튼만 확인하고 업로드
      - extendedWaitUntil:
          visible:
            id: "uploadPhoto"
          timeout: 30000
      - assertVisible:
          id: "capturedImage"
      - assertNotVisible:
          id: "scannedDetailsLayout"
      - tapOn:
          id: "uploadPhoto"

# 두 경로 합류: 접수 완료 / 심사 대기
- extendedWaitUntil:
    visible:
      id: "btn_okay"
    timeout: 30000
- assertVisible:
    id: "completeText"
- assertVisible: ".*서류가 정상적으로 접수되었습니다.*담당자의 확인 후 승인이 완료됩니다.*"
- tapOn:
    id: "btn_okay"
- extendedWaitUntil:
    visible:
      text: "정보 수정"
    timeout: 30000
- assertVisible:
    id: "arcNo"

# ----------------------------------------------------------------
# [F-02] [High] 여권 업로드
# CLICKUP: z8nfn6ma7x
# ----------------------------------------------------------------
# 여권은 **단일 단계**다(ARC와 달리 앞/뒷면 스테퍼가 없다).
#   toolbar_title "여권 변경" / passportTitle("신분증 사진") / info("여권을 촬영해 주세요")
#   / image / take_photo("사진 등록") → OCR 결과(idtext "여권 번호") → uploadPhoto("업로드")
# ※ 한국 국적 계정에는 이 행이 없다(=`passportLayout` 미노출). 그 미노출 검증은
#   25_Profile_old `[01-1]`이 담당한다 — 여기서 중복하지 않는다.
- tapOn:
    id: "passportLayout"
- extendedWaitUntil:
    visible:
      text: "여권 변경"
    timeout: 20000
- assertVisible:
    id: "passportTitle"
- assertNotVisible:
    id: "frontArcTitle"

- runFlow:
    when:
      visible:
        id: "take_photo"
    commands:
      - assertVisible:
          id: "info"
      - tapOn:
          id: "take_photo"
      - extendedWaitUntil:
          visible:
            id: "galleryBtnImageView"
          timeout: 20000
      - assertVisible:
          id: "captureBtnImageView"
      - tapOn:
          id: "galleryBtnImageView"
      - extendedWaitUntil:
          visible:
            id: "icon_thumbnail"
          timeout: 20000
      - tapOn:
          id: "icon_thumbnail"
          index: 3
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "${REG_DONE_GALLERY}"
          timeout: 20000
      - tapOn: "${REG_DONE_GALLERY}"
      # 여권 OCR 결과 — 값은 테스트 이미지 기준(`2. Passport.jpg`)
      - extendedWaitUntil:
          visible:
            id: "uploadPhoto"
          timeout: 30000
      - assertVisible:
          id: "capturedImage"
      - assertVisible:
          id: "details"
      - assertVisible: ".*M75.*"
      - assertVisible: ".*LEE SEUNGSOO.*"
      - assertVisible:
          id: "retakePhoto"
      - tapOn:
          id: "uploadPhoto"

- extendedWaitUntil:
    visible:
      id: "btn_okay"
    timeout: 30000
- assertVisible:
    id: "completeText"
- assertVisible: ".*서류가 정상적으로 접수되었습니다.*담당자의 확인 후 승인이 완료됩니다.*"
- tapOn:
    id: "btn_okay"
- extendedWaitUntil:
    visible:
      text: "정보 수정"
    timeout: 30000
- assertVisible:
    id: "passportNo"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_profile"
