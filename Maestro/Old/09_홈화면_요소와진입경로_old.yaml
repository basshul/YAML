# ⏸ 나머지 23케이스 — 2026-10-28 제거 (실행 시간 단축)
# ================================================================
# ★ **중요도 정본은 체크리스트 시트**다(project_yaml_case_numbering).
#   이 파일의 yaml 마커는 High 16개로 적혀 있었지만 **시트와 맞지 않았다** —
#   시트 기준 High 는 [01](HOM-007 Total GME Balance)과 [10](HOM-010 Deposit)
#   둘뿐이고 나머지는 Medium 10 · Low 15 다. `fill_case_priority.py` 가
#   손대지 않은 파일이라 손으로 적힌 값이 그대로 남아 있었다.
#   ⚠️ 남은 [01]·[10] 의 마커는 시트와 일치한다(한 케이스가 여러 행을 덮으면
#     가장 높은 값 — [01] 은 HOM-006 M / HOM-007 H / HOM-021 L 을 덮어 High).
#
# [01] 이 홈 최상단으로 복귀하며 끝나고(`scrollUntilVisible … direction: UP`)
# [10] 이 그 상단의 입금 버튼(`txvDepositOrViewStatement`)을 눌러 시작한다 → 이어진다.
#
# ⚠️ 되살리기: git show 1238657:Maestro/Old/09_홈화면_요소와진입경로_old.yaml
# ================================================================
