# ----------------------------------------------------------------
# [31] [High] Recharge (Wallet) - Simple PW 간편비밀번호 일치/불일치 확인
# CLICKUP: z8nfn6mact
# ----------------------------------------------------------------
# 주의(2026-08-06): 충전 화면의 "출금 계좌 GME Wallet" 잔액은 **앱 시작 시점 값으로 캐시**됨.
#   앱이 떠 있는 동안 지갑에 충전하면 홈 계좌 목록은 갱신되는데 이 화면은 옛 값을 계속 보여줌
#   (실측: 홈 1,099 KRW / 충전 화면 0 원 → 1원 입력도 "충전 금액은 계좌 잔액보다 클 수 없습니다."로 거부).
#   앱을 재시작하면 정상 표시됨(재시작 후 3,099 원 확인). maestro는 매 실행 launchApp으로 시작하므로
#   **실행 전에 충전을 끝내 두면** 문제 없음. 실행 도중 충전하면 이 케이스가 막히니 주의.
