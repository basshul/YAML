appId: ${APP_ID}
---
# ================================================================
# 보안 키패드 주의 (2026-08-06)
#   PIN/CVC 입력용 보안 키패드는 **숫자를 누를 때마다 배치가 다시 섞임**.
#   각 tapOn 사이에 waitForAnimationToEnd가 없으면 maestro가 직전 스냅샷의
#   stale 좌표를 눌러 엉뚱한 숫자가 입력됨 → 실제로 카드 PIN에서
#   "PIN 코드가 유효하지 않습니다."가 재현됐음. 이 파일의 숫자 입력 블록에는
#   전부 정착 대기가 들어가 있으니 새로 추가할 때도 같은 형태를 유지할 것.
#
# 카드 PIN 상태 주의
#   [12]가 카드 PIN을 <정상 PIN> → <대체 PIN> → <정상 PIN>로 되돌림. 실행이 [12] 중간에 끊기면
#   카드 PIN이 <대체 PIN>으로 남아 다음 실행의 [11]이 막힘 → [11]에 <대체 PIN> 폴백을 넣어둠.
#   [12]는 이전 PIN이 아니라 **CVC**로 인증하므로 현재 PIN 값과 무관하게 동작함.
#   ⚠️ CVC 는 카드마다 다른 자격정보다 → 파일에 박지 않고 **[11] 이 화면에서 읽어** [12] 에 넘긴다(`output.cvc1~3`).
# ================================================================
# ================================================================
# 시나리오: Card (GME Card)
# ================================================================

# 앱 실행 및 홈 진입
# 주의(2026-08-06): 기존 `notVisible: "Home"` 가드는 launchApp 직후 잠깐 보이는 **캐시된 홈**에
#   매칭돼 PIN 입력을 건너뛰고 잠금화면에 갇힘 → 잠금화면을 명시적으로 대기 후 PIN 입력.
- launchApp
# ⚠️ Server Override 처리가 **이 파일에만 빠져 있었다**(2026-09-03 전수 점검).
#   livetest 빌드에서는 스플래시가 안 떠서 티가 안 났지만, 기본 빌드가 `.stag`로 바뀌면
#   서버 기본값이 **STAG**라 이대로면 조용히 gmeuat로 돈다 → 헬퍼로 LIVETEST를 강제한다.
#   (헬퍼는 스플래시가 없으면 통째로 SKIP되므로 운영 빌드에서도 안전하다.)
- runFlow: "_server_override_old.yaml"
- extendedWaitUntil:
    visible:
      text: "${PIN_ENTER_4DIGIT}"
    timeout: 30000
# 키패드 재배치 대응: 탭 사이 정착 대기 (파일 상단 주석 참고)
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
# 로그인 세션 만료 다이얼로그(토큰 만료 시) 또는 홈 대기
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 20000
# 세션 만료 판정 — 실제 문구는 개행이 섞인 두 문장이라 `"로그인 세션이 만료"` **전체매칭으로는
#   한 번도 잡히지 않았다**(2026-08-28 확인) → `[\s\S]*` 필요.
#   구 UI에서 세션이 만료되면 **PIN으로 복구되지 않으므로**(ID/비밀번호 재로그인 필요)
#   닫고 진행하지 않고 **여기서 실패시킨다** → `01_01_Login_Success_old.yaml`로 복구 후 재실행.
- assertNotVisible:
    text: "${SESSION_EXPIRED}"
# 홈 코치마크 balloon 닫기
- runFlow:
    when:
      visible:
        id: "balloonClose"
    commands:
      - tapOn:
          id: "balloonClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${CARD_TEXT}"
    timeout: 30000

# 카드 탭 진입
- tapOn:
    text: "${CARD_TEXT}"
    index: 0
- extendedWaitUntil:
    visible:
      text: "${DEBUG_MENU_CATEGORY_GME_CARD}"
    timeout: 30000

# ================================================================
# [Card Apply] - 카드 추가 신청 (Pay 카드, 지점 수령)
# ================================================================
# ★ **2026-09-11 사용자 확인: `Pay 카드` 는 없어진 게 아니다 — 상품 목록을 아래로 스크롤하면 나온다.**
#   2026-09-10 에 `[01]` 의 `assertVisible: "${CARD_PRODUCT_PAY}"` 가 실패한 것은 상품이 단종된 것이 아니고
#   **첫 화면에 EasyCare·EasyGo 만 보이고 Pay 는 화면 밖에 있었기 때문**이다.
#   → 상품 단언·탭 전에 스크롤을 넣는다(해상도가 바뀌면 요소가 화면 밖으로 밀리는 것과 같은 부류).
# ⚠ 이 구간은 실계정에 **실제 카드 신청**을 낸다. 신청 대상은 **Pay 카드**로 고정하고,
#   엉뚱한 상품으로 들어갔는지를 상세 화면 제목(`GME 카드 - Pay`)으로 못박는다.
#   → 둘 다 `${CARD_PRODUCT_PAY}` · `${CARD_DETAIL_TITLE_PAY}` 로 변수화했다(2026-09-22 en 실측).
#     en 상품 목록: `EasyCare Card` / `EasyGo Card` / **`Pay Card`** / `Premium Card`
#     (목록 id `card_list_title_textview`), 상세 제목 `GME Card - Pay`(id `toolbar_title`).
#   ⚠️ **상품명 탭으로는 상세가 열리지 않는다**(실측 재확인) — 행의 `Apply` 버튼이 상세를 연다.
#     실제 신청은 상세 안의 `${APPLY_CARD_TEXT}` 이므로, 상세까지는 신청 없이 볼 수 있다.
#   [10] 이 그 신청을 취소하므로 전 구간을 돌리면 상태는 원복된다 — 중간에 끊기면 신청이 남는다.

# 카드 이미지 좌로 스와이프 후 "카드 추가 요청" 있을 때만 진행 (이미 신청된 경우 스킵)
- tapOn:
    text: "${CARD_TEXT}"
    index: 0
- extendedWaitUntil:
    visible:
      text: "${DEBUG_MENU_CATEGORY_GME_CARD}"
    timeout: 30000
# ⚠️ 슬롯은 **페이저의 가장 오른쪽**에 있다 — 발급된 카드 수만큼 스와이프해야 나온다
#   (2026-09-10 사용자 확인. 그때 카드 2장 → 2회).
# ⛔ 종전에는 **고정 1회**였다. 카드가 늘면 슬롯에 닿지 못해 아래 조건 블록이 **조용히 SKIP** 되고,
#   신청 건을 전제하는 [07] 이 "신청 세부 정보 변경" 미발견으로 죽는다 — 2026-09-10 실측으로 그렇게 실패했다.
#   원인이 [07] 에 있는 것처럼 보여 오진하기 쉬운 자리다 → **나올 때까지** 넘긴다.
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            notVisible:
              text: "${REQUEST_ADDITIONAL_CARD_TITLE}"
          commands:
            - swipe:
                start: "70%, 45%"
                end: "20%, 45%"
                duration: 400
            - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "${REQUEST_ADDITIONAL_CARD_TITLE}"
    commands:
      - tapOn: "${REQUEST_ADDITIONAL_CARD_TITLE}"
      # ----------------------------------------------------------------
      # [01] [High] Card Apply - 카드선택페이지 정상 진입 확인 및 Apply 동작 확인
      # CLICKUP: z8nfn6mad5
      # ----------------------------------------------------------------
      - assertVisible: "${EASY_GO_CARD_TEXT}"
      # ★ 상품 목록은 화면보다 길다 — `Pay 카드` 는 **스크롤해야 나온다**(2026-09-11 사용자 확인).
      #   고정 위치 가정을 버리고 중앙 정렬까지 스크롤한 뒤 단언·탭한다.
      - scrollUntilVisible:
          element:
            text: "${CARD_PRODUCT_PAY}"
          direction: DOWN
          centerElement: true
          timeout: 20000
      - assertVisible: "${CARD_PRODUCT_PAY}"
      # 신청 대상 행에서 진입한다. ⛔ 맨 위 `카드 신청` 을 그냥 탭하면 **EasyGo 행**을 집는다
      #   (텍스트 index 0 = 그 순간 화면 맨 위). 이미 발급된 상품은 버튼이 `내 카드` 로 바뀐다.
      - tapOn:
          text: "${CARD_PRODUCT_PAY}"
      - waitForAnimationToEnd
      # 상품명 탭으로 상세가 열리지 않아 목록이 그대로 남아 있으면 그 행의 신청 버튼을 누른다 — 자기교정.
      - runFlow:
          when:
            visible:
              text: "${CARD_APPLY_TEXT}"
          commands:
            - tapOn:
                text: "${CARD_APPLY_TEXT}"
                below:
                  text: "${CARD_PRODUCT_PAY}"
            - waitForAnimationToEnd
      # 이미 진행 중인 신청 팝업 처리 → 배송지로 바로 이동
      - runFlow:
          when:
            visible:
              text: "${CONTINUE_APPLICATION_TEXT}"
          commands:
            - tapOn: "${CONTINUE_APPLICATION_TEXT}"
            - waitForAnimationToEnd
      # 처음 신청: 상품 상세의 신청 버튼 → 이용약관 ~ PIN 전체 처리
      # ⚠️ 2026-09-03 수정: 가드가 `"카드 신청"`이었다. **Maestro 텍스트는 전체매칭**이라
      #   실제 버튼 라벨 **`카드 신청하기`** 와 매칭되지 않아 **이 블록이 통째로 조용히 SKIP**됐고,
      #   그 뒤 [05]의 `assertVisible: "카드 배송지"`가 죽었다(스크린샷: `GME 카드 - Pay` 소개 화면에 머물러 있었다).
      #   위 103행의 `tapOn: "카드 신청"`은 **탭 라벨**이라 그대로 맞다 — 둘은 다른 요소다.
      - runFlow:
          when:
            visible:
              text: "${APPLY_CARD_TEXT}"
          commands:
            # ★ 엉된 상품에 신청을 넣지 않도록 상세 화면이 **Pay** 임을 못박는다.
            #   이건 상품명 하드코딩이 아니라 **이 케이스가 신청하는 상품 자신**이다 — 고정이 맞다.
            - assertVisible:
                text: "${CARD_DETAIL_TITLE_PAY}"
            - tapOn: "${APPLY_CARD_TEXT}"
            - waitForAnimationToEnd
            # 이용약관
            - tapOn: "${AGREE_NEXT_TEXT}"
            - waitForAnimationToEnd
            # 카드 디자인 선택
            - tapOn: "${APPLY}"
            - waitForAnimationToEnd
            # ----------------------------------------------------------------
            # [02] [Medium] Card Apply - Select Pay service 선택 동작 확인
            # CLICKUP: z8nfn6mad6
            # ----------------------------------------------------------------
            - assertVisible: "None"
            - assertVisible: "Paybooc"
            - tapOn: "${BTN_NEXT}"
            - waitForAnimationToEnd
            # ----------------------------------------------------------------
            # [03] [Medium] Card Apply - 영문이름 수정 및 입력 동작 확인
            # CLICKUP: z8nfn6mad7
            # ----------------------------------------------------------------
            - assertVisible: "${ENG_FULL_NAME_TEXT}"
            - tapOn: "${BTN_NEXT}"
            - waitForAnimationToEnd
            # ----------------------------------------------------------------
            # [04] [Medium] Card Apply - 비밀번호 4자리 입력 동작 확인
            # CLICKUP: z8nfn6mad8
            # ----------------------------------------------------------------
            - assertVisible: "${PIN_CODE_TEXT}"
            - assertVisible: "${VERIFY_PIN_CODE_TEXT}"
            # 카드 PIN 입력 필드 포커스 → 보안 키패드 오픈.
            #   (2026-08-06) 기존 `point: "50%, 25%"`는 S23(2340) 기준이라 Note 9(2220)에서
            #   실제 필드 위치(50%, 29%)를 빗나가 키패드가 열리지 않았고, 이어지는 tapOn "1"이
            #   "Element not found"로 실패했음 → 좌표 대신 resource-id 사용.
            - tapOn:
                id: "pin_passedittext"
            # 키패드 재배치 대응: 탭 사이 정착 대기 (파일 상단 주석 참고)
            - tapOn: "1"
            - waitForAnimationToEnd
            - tapOn: "2"
            - waitForAnimationToEnd
            - tapOn: "1"
            - waitForAnimationToEnd
            - tapOn: "2"
            - waitForAnimationToEnd
            - tapOn: "1"
            - waitForAnimationToEnd
            - tapOn: "2"
            - waitForAnimationToEnd
            - tapOn: "1"
            - waitForAnimationToEnd
            - tapOn: "2"
            - waitForAnimationToEnd
            - tapOn: "${BTN_NEXT}"
            - waitForAnimationToEnd
      # ----------------------------------------------------------------
      # [05] [Medium] Card Apply - 카드수령 동작 확인 (비대면/대면/브랜치)
      # CLICKUP-PARTIAL: z8nfn6mad9 | 비대면/대면/브랜치 라벨 노출은 확인, 실제 선택은 브랜치만
      # ----------------------------------------------------------------
      # 전환에 시간이 걸릴 수 있어 도달을 먼저 강제한다(위 두 갈래가 모두 SKIP되면 여기서 시끄럽게 죽는다)
      - extendedWaitUntil:
          visible:
            text: "${CARD_DESTINATION_TEXT}"
          timeout: 30000
      - assertVisible: "${CARD_DESTINATION_TEXT}"
      - assertVisible: "${NON_FACE_DELIVERY_TEKBE}"
      - assertVisible: "${FACE_TO_FACE_DELIVERY_TEXT}"
      - assertVisible: "${SELECT_BRANCH_TEXT}"
      - tapOn: "${SELECT_BRANCH_TEXT}"
      - tapOn: "${BTN_NEXT}"
      - assertVisible: "${BRANCH_PICK_UP_TEXT}"
      - assertVisible: "${TXT_MOBILE}"
      # ----------------------------------------------------------------
      # [06] [High] Card Apply - 카드신청완료 동작 확인
      # CLICKUP: z8nfn6mada
      # ----------------------------------------------------------------
      - tapOn: "${BTN_NEXT}"
      - tapOn: "${BTN_CONFIRM}"
      - assertVisible: "${APPLICATION_RECEIVED_TEXT}"
      - tapOn: "${BTN_DONE}"

# ================================================================
# [Card Change]
# ================================================================

# 카드 탭 재진입 → 신청 건 페이지로 이동
- tapOn:
    text: "${CARD_TEXT}"
    index: 0
- extendedWaitUntil:
    visible:
      text: "${DEBUG_MENU_CATEGORY_GME_CARD}"
    timeout: 30000
# ★ 신청 건은 **페이저의 맨 오른쪽**이다 — 카드 수량은 계정·시점마다 다르므로 세지 않는다.
#   판정은 **버튼 세트**로 한다(2026-09-03/04 실기기 덤프로 확정):
#     발급 카드(`정상`)  = `정보` / `카드 관리`          ← id 없음
#     신청 건(`신청 완료`) = `application_infomationchange_title` / `application_infomationcancel_title`
#   ⛔ `정상`/`신청 완료` **텍스트로 판정하면 안 된다** — 인접 페이지 노드가 폭 음수로 트리에 남아
#     두 문구가 항상 동시에 존재하고, Maestro 는 그걸 "보인다"로 취급한다(bounds 는 조건에 못 건다).
#     반면 버튼 세트는 페이지에 종속돼 완전히 교체된다.
#   ⛔ 두 버튼은 맞붙어 있다 → **좌표 탭 금지**, id 로 탭한다.
#   ⛔ 스와이프는 **y=45% 로 한다**(페이저 안). 실측: `gmeCardViewPager` = `[216,479][864,1199]`
#     = 화면의 20~51% 구간이다. 종전 `y=60%`(=1404) 는 **페이저 아래 `tab_layout`** 이라
#     2026-09-11 실행에서 8회를 넘겨도 **페이지가 한 장도 안 넘어갔다**(슬롯 탐색 쪽은 45% 라 통했다).
#     페이지 수는 `dotsIndicator` 의 dot 개수로 확인할 수 있다(그때 4개 = 발급 2 + 신청 1 + 슬롯 1).
# ⚠️ **전제: [01]~[06] 이 실제로 신청을 만들었어야 한다.** 신청 건이 없으면 아래 대기가 시끄럽게 죽는다 —
#   그건 [07] 의 결함이 아니라 신청이 성립하지 않았다는 뜻이다.
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            notVisible:
              id: "application_infomationchange_title"
          commands:
            - swipe:
                start: "70%, 45%"
                end: "20%, 45%"
                duration: 400
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "application_infomationchange_title"
    timeout: 10000

# ----------------------------------------------------------------
# [07] [High] Card Change - 카드 수령지 상세정보 노출 확인
# CLICKUP: z8nfn6madb
# ----------------------------------------------------------------
- tapOn:
    id: "application_infomationchange_title"
- waitForAnimationToEnd
- assertVisible: "${CHANGE_YOUR_ADDRESS}"

# ----------------------------------------------------------------
# [08] [Medium] Card Change - 주소변경 시 카드수령지 정보 변경 동작 확인
# CLICKUP: z8nfn6madc
# ----------------------------------------------------------------
- tapOn: "${CHANGE_YOUR_ADDRESS}"
- waitForAnimationToEnd
- assertVisible: "${NON_FACE_DELIVERY_TEKBE}"
- assertVisible: "${FACE_TO_FACE_DELIVERY_TEXT}"
- assertVisible: "${SELECT_BRANCH_TEXT}"

# ----------------------------------------------------------------
# [09] [High] Card Change - 카드 정보 변경동작 확인
# CLICKUP: z8nfn6madd
# ----------------------------------------------------------------
- tapOn: "${BTN_NEXT}"
- waitForAnimationToEnd
- assertVisible: "${TXT_MOBILE}"
# 지점 선택 — 함정이 세 겹이다(전부 2026-09-11 실측).
#   ⛔ ① **좌표 탭 금지.** 종전 `point: "50%, 32%"` 는 1080x2340 에서 (540,749) 인데
#        그 자리가 첫 지점 카드의 **`kakao_map_link`**(`[480,672]~[600,827]`) 안이다 →
#        **Chrome 이 열리고** 뒤이은 `다음` 이 Element not found 로 죽었다.
#   ⛔ ② **지점 이름(`agent_info_txt_header`) 탭은 선택을 바꾸지 못한다.** 탭은 COMPLETED 인데
#        확인 시트의 `addressNameTxt` 가 변경 전(`...Yeongdeungpo..., Mobile`) 그대로였고,
#        빨간 테두리(선택 표시)도 `모바일 지점` 에 남아 있었다.
#        `[13]~[19]` 의 "라벨 탭은 스위치를 못 움직인다" 와 같은 부류다.
#   ⛔ ③ **행 컨테이너(`layout`) 탭도 안 된다.** Maestro 는 요소 **중앙**을 누르는데
#        그 자리가 `agent_info_txt_label_contact1`(전화번호)라 **다이얼러가 열린다**(실측).
#        한 행 안의 clickable 이 5개다: 이름 · 전화번호 · 지도 링크 3개.
#   → 행 안의 **주소 줄**(비clickable)을 눌러 부모 행이 클릭을 받게 한다. 중앙이 안전한 자리다.
#     주소는 지점의 신원이므로 케이스 전제로 박는다(바뀌면 조용히 넘어가지 않고 여기서 실패한다).
- scrollUntilVisible:
    element:
      id: "agent_info_txt_header"
      text: "${TXT_ANSAN}"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "agent_info_txt_label_1"
    text: '경기도 안산시[\s\S]*'
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "btnApply"
    commands:
      - tapOn:
          id: "btnApply"
      - waitForAnimationToEnd
# 확인 시트 실측 id: `productnameTxt` / `englishNameTxt` / `addressNameTxt`(배송지 주소) /
#   `btnCancel`(취소) / `btnConfirm`(확인). ⛔ 범용 `tapOn: "확인"` 을 쓰지 말 것 —
#   뒤 화면에도 `확인`(`btn_next`)이 있어 어느 쪽이 눌리는지 보장되지 않는다.
- extendedWaitUntil:
    visible:
      id: "addressNameTxt"
    timeout: 30000
# ★ **선택이 실제로 반영됐는지**를 시트의 배송지 주소로 못박는다. 이 단언이 없으면
#   바뀌지 않은 채 `확인` 을 눌러도 통과가 된다 — 2026-09-11 실행이 정확히 그 상태였다.
- assertNotVisible:
    id: "addressNameTxt"
    text: '[\s\S]*Yeongdeungpo[\s\S]*'
- assertVisible: "${CARD_PRODUCT_TEXT}"
- tapOn:
    id: "btnConfirm"
- waitForAnimationToEnd
# 신청 세부 정보 변경 화면으로 돌아와 **안산으로 바뀌어 있어야** 한다(변경 성립 단언).
- extendedWaitUntil:
    visible:
      id: "agent_info_txt_header"
      text: "${TXT_ANSAN}"
    timeout: 30000
- tapOn:
    id: "btn_next"
- waitForAnimationToEnd

