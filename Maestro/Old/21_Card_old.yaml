- tapOn:
    id: "block_trasation_memony_switch"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "offline_use_title"
    timeout: 15000
- assertVisible:
    id: "online_user_title"

# ----------------------------------------------------------------
# [18] [Medium] Card Management - 아래 버튼 체크 시 Domestic Use 버튼 OFF 상태 변경 확인
