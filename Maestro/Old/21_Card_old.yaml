# ----------------------------------------------------------------
# [15] [Low] Card Management - Overseas Use 버튼 선택 시 하위 메뉴 노출 확인
# CLICKUP: z8nfn6madp
#            - Disable Offline Usage / Disable Online Usage
# ----------------------------------------------------------------
# ⚠️ 이 스위치는 **on/off 를 바꾸지 않는다** — 하위 메뉴를 펼치고 접는다(실측).
#   해외 사용을 실제로 끄는 건 [16]의 하위 체크박스다.
- scrollUntilVisible:
    element:
      id: "block_oversee_trasation_memony_switch"
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible:
    id: "block_oversee_trasation_memony_sub_title"
    text: "on"
# 자기교정: 이미 펼쳐져 있으면 접어서 "닫힌 상태"에서 시작한다.
- runFlow:
    when:
      visible:
        id: "oversee_offline_use_title"
    commands:
      - tapOn:
          id: "block_oversee_trasation_memony_switch"
      - waitForAnimationToEnd
- assertNotVisible:
    id: "oversee_offline_use_title"
- tapOn:
    id: "block_oversee_trasation_memony_switch"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "oversee_offline_use_title"
    timeout: 15000
- assertVisible:
    id: "oversee_online_user_title"
- assertVisible: "${DISABLE_OFFLINE_USAGE_TEXT}"
- assertVisible: "${DISABLE_ONLINE_USAGE}"

# ----------------------------------------------------------------
# [16] [Medium] Card Management - 아래 버튼 체크 시 Overseas Use 버튼 OFF 상태 변경 확인
# CLICKUP: z8nfn6madr
# ----------------------------------------------------------------
# 실측: `오프라인 사용 비활성화` 체크 → **해외 사용이 off 로 바뀌고**
#   "해외 오프라인 결제가 중단되었습니다." 안내(제목 "정보", 버튼 `확인` 1개)가 뜬다. 푸시도 온다.
# ⚠️ **실제 카드 설정이 바뀐다** → 반드시 체크를 해제해 on 으로 되돌린다.
- scrollUntilVisible:
    element:
      id: "oversee_offline_use_title_checkbox"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "oversee_offline_use_title_checkbox"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "${CARD_OVERSEAS_OFFLINE_DISABLED}"
    timeout: 20000
- tapOn:
    id: "btnConfirm"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "block_oversee_trasation_memony_sub_title"
      text: "off"
    timeout: 20000
# 원복 — 체크 해제 → 해외 사용 on
- tapOn:
    id: "oversee_offline_use_title_checkbox"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "btnConfirm"
    commands:
      - tapOn:
          id: "btnConfirm"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "block_oversee_trasation_memony_sub_title"
      text: "on"
    timeout: 20000
# 하위 메뉴를 접어 다음 케이스의 전제(닫힌 상태)를 만든다
- tapOn:
    id: "block_oversee_trasation_memony_switch"
- waitForAnimationToEnd

