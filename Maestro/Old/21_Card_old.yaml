- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "block_trasation_memony_sub_title"
      text: "off"
    timeout: 20000
# 원복 — 체크 해제 → 국내 사용 on
- tapOn:
    id: "offline_use_title_checkbox"
- waitForAnimationToEnd
- runFlow:
