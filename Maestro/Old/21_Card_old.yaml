# ================================================================
# [13]~[19] 카드 관리 토글 — 2026-09-10 실기기 검증으로 **전면 교체**
# ================================================================
# 종전 코드는 라벨 텍스트를 탭하고 결과를 조건부로만 봤다 → **7케이스가 거짓 통과**했다.
# 실측(SM-S911N / 1080x2340 / stag)으로 확인한 사실 넷:
#   ① **라벨 탭은 스위치를 움직이지 못한다.** `tapOn: "일시 중지"` 는 COMPLETED 인데 상태는 그대로다.
#      탭 대상은 라벨(`*_title`)이 아니라 **`*_switch` 버튼**이다.
#   ② **카드 관리 진입 직후 `일시 중지` 아래는 화면 밖**이다(상단 카드 이미지가 자리를 차지).
#      → 모든 탭 앞에 `scrollUntilVisible`(+`centerElement`). 고정 좌표·맹목적 `scroll` 금지.
#   ③ 상태는 **`*_sub_title`("on"/"off")** 로 단언한다. `checked:` 는 Maestro가 무시하고,
#      이 스위치들은 Button 이라 항상 `checked=false` 로 나온다.
#   ④ 다이얼로그는 **토글마다 다르다**: 일시중지·자동충전·사용 스위치는 **다이얼로그 없이 즉시** 바뀌고,
#      해외 원화 결제 제한만 **확인 다이얼로그(DCC)** 가 뜨며, 하위 체크박스는 **결과 안내**가 뜬다.
#      → 조건부로 뭉개지 말고 케이스별로 도달을 강제한다.
# ⚠️ 각 케이스는 **짝으로 원복**한다. 중간에 끊기면 카드가 바뀐 상태로 남고, 그때는 다음 실행의
#    전제 단언이 **일부러 실패**한다(예: 일시 중지가 on 이면 [13] 이 즉시 죽는다) — 조용히 넘기지 않는다.
#    전제가 깨져 있으면 아래 자기교정 블록이 먼저 정상 상태로 되돌린다.

# ----------------------------------------------------------------
# [13] [Medium] Card Management - Pause 버튼 선택 시 토글 스위치 ON/OFF 확인
# CLICKUP: z8nfn6madm
# ----------------------------------------------------------------
- scrollUntilVisible:
    element:
      id: "pause_switch"
    direction: DOWN
    centerElement: true
    timeout: 15000
# ⚠️ 토글마다 **결과 안내 다이얼로그**가 뜬다(`정보` / `btnConfirm`).
#   예: 일시중지 ON → "카드가 일시적으로 사용 중지되었습니다."
#   이 다이얼로그가 뒤 화면을 덮으면 `*_sub_title` 이 접근성 트리에서 사라진다
#   → **먼저 닫아야** 상태를 볼 수 있다(닫기 전에 단언하면 Element not found 로 죽는다. 실측).
# 자기교정: 지난 실행이 중간에 끊겨 카드가 일시중지로 남아 있으면 먼저 해제한다.
- runFlow:
    when:
      visible:
        id: "btnConfirm"
    commands:
      - tapOn:
          id: "btnConfirm"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "pause_sub_title"
        text: "on"
    commands:
      - tapOn:
          id: "pause_switch"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "btnConfirm"
    commands:
      - tapOn:
          id: "btnConfirm"
      - waitForAnimationToEnd
- assertVisible:
    id: "pause_sub_title"
    text: "off"
- tapOn:
    id: "pause_switch"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "${CARD_PAUSED_DIALOG}"
    timeout: 20000
- tapOn:
    id: "btnConfirm"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "pause_sub_title"
      text: "on"
    timeout: 20000
- tapOn:
    id: "pause_switch"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "btnConfirm"
    commands:
      - tapOn:
          id: "btnConfirm"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "pause_sub_title"
      text: "off"
    timeout: 20000

