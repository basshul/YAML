    visible:
      text: "${DEBUG_MENU_CATEGORY_GME_CARD}"
    timeout: 30000
- tapOn:
    id: "uparrow"
- extendedWaitUntil:
    visible:
      text: "${DEBUG_MENU_CATEGORY_DEPOSIT}"
    timeout: 5000
- tapOn: "${DEBUG_MENU_CATEGORY_DEPOSIT}"
- waitForAnimationToEnd
- tapOn: "GME Wallet"
- waitForAnimationToEnd
- tapOn: "1"
- tapOn: "${BTN_DONE}"
- waitForAnimationToEnd
- tapOn: "${BTN_NEXT}"
- waitForAnimationToEnd
- tapOn: "${BTN_CONFIRM}"
- waitForAnimationToEnd
# 불일치: PIN 9876 입력
# 키패드 재배치 대응: 탭 사이 정착 대기 (파일 상단 주석 참고)
- tapOn: "9"
- waitForAnimationToEnd
- tapOn: "8"
- waitForAnimationToEnd
- tapOn: "7"
- waitForAnimationToEnd
- tapOn: "6"
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible:
    text: "비밀번호가 맞지 않습니다.*"
# 일치: PIN <정상 PIN> 입력
# 키패드 재배치 대응: 탭 사이 정착 대기 (파일 상단 주석 참고)
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible:
    text: "${GME_PAY_SUCESSFULLY_RECHARGED}"
- tapOn: "${BTN_CONFIRM}"
- waitForAnimationToEnd
# 이전 케이스의 지연된 성공 팝업 처리 (최대 3개)
- runFlow:
    when:
      visible:
        text: "${LOGIN_SUCCESS}"
    commands:
      - tapOn: "${BTN_CONFIRM}"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "${LOGIN_SUCCESS}"
    commands:
      - tapOn: "${BTN_CONFIRM}"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "${LOGIN_SUCCESS}"
    commands:
      - tapOn: "${BTN_CONFIRM}"
      - waitForAnimationToEnd

# ----------------------------------------------------------------
# [32] [High] Refund - 환불 정상적으로 진행되는지 확인
# CLICKUP: z8nfn6macx
# ----------------------------------------------------------------
# 충전 완료 "확인" 탭 → 카드 탭으로 복귀, 바텀시트 닫혀있음 → uparrow 재탭
- extendedWaitUntil:
    visible:
      text: "${DEBUG_MENU_CATEGORY_GME_CARD}"
    timeout: 30000
- swipe:
    start: "50%, 30%"
    end: "50%, 80%"
- waitForAnimationToEnd
- tapOn:
    id: "uparrow"
- extendedWaitUntil:
    visible:
      text: "${REFUND_TEXT}"
    timeout: 5000
- tapOn: "${REFUND_TEXT}"
- waitForAnimationToEnd
- assertVisible:
    text: "${DEBUG_MENU_DEEPLINK_GME_PAY_REFUND}"
- pressKey: back
- waitForAnimationToEnd

# ----------------------------------------------------------------
# [33] [High] GME Shop - GME Shop 화면 진입 확인
# ----------------------------------------------------------------
# [32] pressKey: back 후 바텀시트(충전/환불/쇼핑) 유지됨
- extendedWaitUntil:
    visible:
      text: "${SHOP_TEXT}"
    timeout: 5000
- tapOn: "${SHOP_TEXT}"
- waitForAnimationToEnd
- assertVisible:
    text: "GME Shop"

# ----------------------------------------------------------------
# [33-1] [High] GME Shop_Wallet - 간편비밀번호 일치/불일치 시 구매동작 확인
# ----------------------------------------------------------------
# 편의점 쿠폰(CU) 3,000원권 선택 → 결제 화면 진입
- tapOn: "${CONVINENCE_STORE_TITLE}"
- waitForAnimationToEnd
# "3,000" 텍스트가 커스텀 뷰라 텍스트 매칭 불가 → 좌표 탭 사용 (CU 3,000원 카드)
- tapOn:
    point: "27%, 41%"
- waitForAnimationToEnd
- assertVisible:
    text: "${PAYMENT_TEXT}"
- assertVisible:
    text: "${REWARD_POINT_PAYMENT_TEXT}"
# 결제 화면의 출금 계좌 영역 라벨이 앱 버전에 따라 오락가락함:
#   2026-07-07 이전 "충전 계좌 / GME Wallet" → 07-07 "GME Pay 잔액"으로 바뀌어 수정했는데
#   2026-08-06 실기기에서 다시 "충전 계좌 / GME Wallet / 잔액"으로 되돌아옴.
#   어느 쪽이든 통과하도록 정규식으로 둘 다 허용.
- assertVisible:
    text: "충전 계좌|GME Pay 잔액.*"
- scroll
- assertVisible:
    text: "${PAYMENT_AMOUNT_TEXT}"
# 참고: GME Wallet 잔액 부족 시 "잔액이 부족할 경우, 선택된 계좌에서 자동으로 충전됩니다" 안내와 함께
# 실제로 연동된 카카오뱅크 계좌에서 GME Wallet으로 자동충전이 발생함 (부작용 주의).
# "구매하기" 버튼은 GME Wallet 잔액이 상품 금액 이상일 때만 활성화(빨간색)됨.
- tapOn: "${REDEEM_TEXT}"
- waitForAnimationToEnd
- assertVisible:
    text: "${ENTER_THE_LOCK}"
# 불일치: PIN 9876 입력
# 키패드 재배치 대응: 탭 사이 정착 대기 (파일 상단 주석 참고)
- tapOn: "9"
- waitForAnimationToEnd
- tapOn: "8"
- waitForAnimationToEnd
- tapOn: "7"
- waitForAnimationToEnd
- tapOn: "6"
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible:
    text: "비밀번호가 맞지 않습니다.*"
# 일치: PIN <정상 PIN> 입력
# 키패드 재배치 대응: 탭 사이 정착 대기 (파일 상단 주석 참고)
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible: "${LOGIN_SUCCESS}"
- assertVisible:
    text: ".*CU 3,000 원.*"
- tapOn: "${BTN_CONFIRM}"
- waitForAnimationToEnd
# 구매 완료 후 쿠폰 상세(바코드) 화면 노출 확인
- assertVisible:
    text: "${REG_EXPIRY_DATE}"

# ----------------------------------------------------------------
# [사후 처리] 방금 구매한 쿠폰 취소 → GME Pay 잔액 환불 (반복 실행 시 잔액 소진 방지)
# ----------------------------------------------------------------
- tapOn: "${TXT_CANCEL}"
- waitForAnimationToEnd
- assertVisible:
    text: "기프트 카드를 취소하시겠습니까?"
- tapOn: "${BTN_YES}"
- waitForAnimationToEnd
- assertVisible:
    text: "${ENTER_THE_LOCK}"
# 키패드 재배치 대응: 탭 사이 정착 대기 (파일 상단 주석 참고)
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible: "${LOGIN_SUCCESS}"
- assertVisible:
    text: "${SUCCESSFULLY_CANCELLED_SMARTWITHDRAW_TEXT}"
- tapOn: "${BTN_CONFIRM}"
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
