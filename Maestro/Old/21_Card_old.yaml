# ----------------------------------------------------------------
# [19] [Medium] Card Management - Overseas Won Payment Restrictions 토글 ON/OFF 확인
# CLICKUP: z8nfn6madv
# ----------------------------------------------------------------
# ⚠️ 이 토글만 **확인 다이얼로그**가 뜬다(실측):
#   "해외 결제 시 '원화(KRW) 결제'(DCC)를 허용하시겠습니까?" + `아니요`/`확인`
#   → `아니요` 로 취소하므로 설정은 바뀌지 않는다. 검증 대상은 **다이얼로그 도달**이다.
# ⛔ 종전에는 좌표(50%,48%)를 탭했다. 라벨이 두 줄이라 "텍스트 매칭 불가"로 본 것인데,
#   실측하면 `'해외 원화[\s\S]*'` 도 평범한 전체매칭도 **둘 다 매칭된다** — 틀린 전제였다.
#   그래도 라벨 탭은 스위치를 움직이지 못하므로 **스위치 id** 를 쓴다.
- scrollUntilVisible:
    element:
      id: "overseas_won_payment_restrictions_switch"
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible:
    id: "oversee_won_payment_restrictions_sub_title"
    text: "on"
# ⛔ 라벨 문구로 단언하지 않는다 — en 은 `Overseas won⏎ payment restrictions` 로 **줄바꿈이 들어가고**
#   ko 와 길이도 달라 전체매칭이 흔들린다. 같은 것을 가리키는 id 가 있으니 그걸 쓴다(2026-09-22).
- assertVisible:
    id: "oversee_won_payment_restrictions_title"
- tapOn:
    id: "overseas_won_payment_restrictions_switch"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "${CARD_DCC_CONFIRM_DIALOG}"
    timeout: 20000
- assertVisible: "${REG_NO}"
- assertVisible: "${BTN_CONFIRM}"
- tapOn: "${REG_NO}"
- waitForAnimationToEnd
# 취소했으므로 상태는 그대로여야 한다 — 이걸 단언하지 않으면 "취소가 먹혔는지"를 못 본다.
- extendedWaitUntil:
    visible:
      id: "oversee_won_payment_restrictions_sub_title"
      text: "on"
    timeout: 15000

# ----------------------------------------------------------------
# [20] [Medium] Card Management - 카드 분실신고 동작 확인 (Report Lost)
# CLICKUP-PARTIAL: z8nfn6madw | 신고 화면 도달 후 취소로 원복. 분실국가·도시·날짜·휴대폰 입력은 미커버
#              - 분실신고 시 카드 사용 즉시 정지 안내 확인
# ----------------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "${REPORT_LOST_TEXT}"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "${REPORT_LOST_TEXT}"
- waitForAnimationToEnd
# 도달을 먼저 강제한다 — 탭 직후 곧바로 단언하면 다이얼로그가 뜨기 전에 판정할 수 있다.
- extendedWaitUntil:
    visible: '${REPORT_CARD_LOSS_TEXT}'
    timeout: 20000
- tapOn: "${REG_NO}"
- waitForAnimationToEnd
# ⚠️ 취소가 실제로 먹혔는지까지 본다. 안 보면 "분실 신고가 접수됐는데 통과"가 가능하다.
- extendedWaitUntil:
    notVisible: '${REPORT_CARD_LOSS_TEXT}'
    timeout: 15000
- assertVisible:
    id: "report_lost_title"

# ----------------------------------------------------------------
# [21] [Low] Card Management - 카드 취소 선택 시 안내 바텀시트 발생 (Card Cancellation)
# CLICKUP: z8nfn6madx
# ----------------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "${CARD_CANCELLATION_TEXT}"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "${CARD_CANCELLATION_TEXT}"
- waitForAnimationToEnd
# ⛔ 종전에는 탭 직후 `assertVisible: "카드 취소"` 가 있었다 — **행 라벨이 그대로 화면에 남아 있어서**
#   바텀시트가 안 떠도 통과한다(아무것도 검증하지 못하는 단언). 시트에만 있는 문구로 도달을 강제한다.
- extendedWaitUntil:
    visible: '${EASY_CARD_CANCELLATION_DESC}'
    timeout: 20000
- pressKey: back
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: '${EASY_CARD_CANCELLATION_DESC}'
    timeout: 15000

# ----------------------------------------------------------------
# [22] [Low] Card Management - 카드 혜택페이지 이동 확인 (View Card Benefits)
# CLICKUP: z8nfn6madh
# ----------------------------------------------------------------
# GME 카드 상세에서 나가서 카드 탭 재진입 후 카드 관리 탭 진입
# ⚠️ back 횟수를 가정하지 않는다 — 카드 탭 루트에 도달할 때까지 누른다.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible:
              id: "bottom_item_home"
          commands:
            - pressKey: back
            - waitForAnimationToEnd
- tapOn:
    text: "${CARD_TEXT}"
    index: 0
- extendedWaitUntil:
    visible:
      text: "${DEBUG_MENU_CATEGORY_GME_CARD}"
    timeout: 30000
- tapOn: "${CARD_MANAGEMENT_TEXT}"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "${VIEW_CARD_BENEFITS_TEXT}"
    timeout: 20000
- tapOn: "${VIEW_CARD_BENEFITS_TEXT}"
- waitForAnimationToEnd
# ⛔ **상품명을 박지 말 것.** 종전 `"GME 카드 - EasyGo"` 는 2026-09-10 실기기에서 실패했다 —
#   계정의 카드가 **EasyCare** 였다(카드는 바뀐다. 페이저에 2장이 있다).
#   이 케이스가 보는 것은 "혜택 페이지로 이동하는지"이고 **상품명은 검증 대상이 아니다**
#   → 제목은 패턴으로 받고, 페이지 성립은 혜택 페이저 id 로 못박는다.
- extendedWaitUntil:
    visible:
      id: "toolbar_title"
      text: "${CARD_BENEFITS_TITLE_PREFIX}"
    timeout: 20000
- assertVisible:
    id: "gmeCardDescriptionPager"
- pressKey: back
- waitForAnimationToEnd

