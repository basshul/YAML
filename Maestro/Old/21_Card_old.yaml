# ----------------------------------------------------------------
# [10] [High] Card Cancel - 카드 취소시 정상취소 되는지 확인
# CLICKUP: z8nfn6madg
# ----------------------------------------------------------------
- tapOn:
    id: "application_infomationcancel_title"
- waitForAnimationToEnd
# 취소 확인 다이얼로그 — 2026-09-03 덤프: `dialog_title_text`("카드 신청 취소") + `btnConfirm`(예) / `btnCancel`(아니요)
#   종전 코드는 `"카드 신청 취소"` · `"정말 취소하시겠습니까?"` 전체매칭 텍스트와 `tapOn: "예"` 였다.
#   문구는 이 빌드에서 확인되지 않았다 → 실기기로 확인된 id 로 바꾼다.
- extendedWaitUntil:
    visible:
      id: "dialog_title_text"
    timeout: 10000
- assertVisible:
    id: "dialog_title_text"
    text: '카드 신청 취소[\s\S]*'
- tapOn:
    id: "btnConfirm"
- waitForAnimationToEnd
# 결과 안내 다이얼로그가 뜨면 닫는다 — 안 닫으면 뒤 화면이 트리에서 사라져 아래 단언이 죽는다
- runFlow:
    when:
      visible:
        id: "btnConfirm"
    commands:
      - tapOn:
          id: "btnConfirm"
      - waitForAnimationToEnd
# ★ 취소가 **실제로 먹혔는지**를 단언한다 — 취소 버튼(=신청 건 페이지)이 사라져야 한다.
#   2026-09-04 에는 취소가 안 된 채 통과 판정이 날 수 있는 구조였고, 실제로 신청이 남아 수동 원복했다.
- extendedWaitUntil:
    notVisible:
      id: "application_infomationcancel_title"
    timeout: 20000

