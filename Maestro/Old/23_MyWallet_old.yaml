#     종전 yaml의 "Apply Virtual Account"는 어떤 계정에서도 매칭되지 않아
#     `assertNotVisible`이 **항상 무의미하게 통과**하고 있었다.
#   · 개편 UI 기준 BLOCKED였던 항목: ATM 입금(바텀시트 마지막 항목 클리핑 — 세로가 짧은 기기에서
#     3개 이상이면 마지막 항목이 bounds=[0,0][0,0]으로 잡혀 maestro가 못 본다. 앱 버그)
