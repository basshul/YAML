# 시나리오: MY WALLET — 🚫 **구 UI에는 이 화면이 없다 (N/A)**
# ================================================================
#  결론(2026-08-19 실기기 확인, 사용자 지시로 문서만 남김):
#  **"My Wallet" 화면은 개편 UI 전용이다. 구 UI(HomeActivityV2)에는 존재하지 않는다.**
#  → 이 파일은 **실행 케이스가 없다.** 돌려도 검증되는 것이 없으니 회귀 대상에 넣지 말 것.
#     (파일을 지우지 않고 남긴 이유: 나중에 "23번은 왜 없지?"로 같은 조사를 반복하지 않도록)
#
# ---------------------------------------------------------------
# 확인 근거 (2026-08-19, seungsoo818 실기기)
# ---------------------------------------------------------------
#   · 구 UI 홈에 **"My Wallet" 텍스트가 없다**(덤프 확인).
#   · 개편 UI의 진입 경로 `tapOn: "***** KRW" below "GME Wallet"` 는 성립하지 않는다 —
#     구 UI 잔액 행(`txvBalanceValue`, 예: "3,099")은 **clickable=false** 라 탭해도 반응이 없다.
#   · 개편 UI가 My Wallet 화면에서 제공했던 기능이 구 UI에서는 **홈 잔액 카드에 직접 붙어 있다**:
#       `btnTransfer`("송금") / `txvDepositOrViewStatement`("입금")
#   · 홈 "입금"을 누르면 바텀시트가 아니라 **`deposit.depositMenu.view.ActivityDepositMenu`
#     ("입금 서비스")** 화면으로 직행한다.
#     구성: GME Wallet 입금 / GMEPay 입금 / ATM 입금 / 자동이체 입금 / 현장 입금
#   · ClickUp 구 UI 트리에도 **My Wallet 시나리오 케이스가 0건**이다(데일리 리포트 "케이스 미등록").
#     구 UI 스펙에 없는 화면이라는 뜻과 일치한다.
#
# ---------------------------------------------------------------
# 종전 4케이스의 구 UI 귀속 (여기서 다시 만들지 말 것 — 이미 다른 파일이 담당한다)
# ---------------------------------------------------------------
#   [01] My Wallet 화면 진입 · 기본 요소 노출
#        → **N/A.** 화면 자체가 없다.
#   [02] GME Wallet 입금 버튼 탭 → 바텀시트 / 계정 유형별 옵션
#        → 이동 확인은 **09_Home_old [10]**(CLICKUP z8nfn6ma1c "Deposit 선택시 GME Deposit Service 이동"),
#          입금 옵션별 동작은 **14_Deposit_old** 범위.
#   [03] GME Wallet 송금 버튼 탭 → 송금 바텀시트
#        → **09_Home_old [09]**(CLICKUP z8nfn6ma1b "Transfer 선택시 송금 바텀시트").
#   [04] GMEPay 입금 버튼 탭
#        → **14_Deposit_old** 범위("입금 서비스" 화면의 GMEPay 입금 항목).
#
# ---------------------------------------------------------------
# 개편 UI 시절 기록 (참고용 보존 — 구 UI에는 적용되지 않는다)
# ---------------------------------------------------------------
#   계정 유형 구분(개편 UI 홈 계좌번호 prefix 기준)
#     일반 사용자 : 계좌번호가 0664 또는 9424 로 시작
#     Easy Remit  : 그 외
#   [GME Wallet 탭] 옵션
#     일반 사용자 : 즉시입금(KFTC 미연결 시 '즉시 입금 설정'), 은행 입금, 편의점 입금, ATM 입금
#     Easy Remit  : 편의점 입금, ATM 입금
#   [GMEPay 탭] 옵션
#     일반 한국인             : 즉시 입금, GME Wallet에서 입금
#     일반 외국인 / Easy Remit : Easy Wallet에서 입금(VA 없으면 '가상계좌 신청'), GME Wallet에서 입금
