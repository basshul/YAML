# ---------------- 한국어 복귀 검증 ----------------
# 재시작 복구 후 홈에서 한국어 문구가 보이는지로 판정한다.
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "input_dot_1"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
# 홈 도달 판정은 `bottom_item_home` — 구 UI 홈은 스크롤 위치를 유지해 상단 카드(`btnTransfer`)가
#   화면 밖일 수 있다(프로젝트 규칙).
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 90000
# ⚠️ **이 두 단언은 변수화하지 말 것.** 이 파일은 마지막에 **한국어로 복귀**하는 케이스라
#   한국어 문구 자체가 **기대 결과(케이스의 일부)** 다. `${VAR}` 로 두면 `-lang en` 실행에서
#   영문 값으로 치환돼 **거짓 실패**한다(2026-09-15 정정).
- assertVisible: "GME Wallet 번호"
- assertVisible: "GME 총 잔액"
- takeScreenshot: lang_restored_ko
