appId: ${APP_ID}
---
# ================================================================
# 시나리오: 설정 → 언어/Language 변경 (24개 언어 순회) — 구 UI
# ================================================================
#  ※ 각 언어의 성공 근거: 전환 후 재진입 시 **드로어 "설정" 라벨을 그 언어로 매칭**해야 다음 단계로
#    넘어간다. 즉 24회 전부 통과했다는 것 자체가 언어가 실제로 바뀌었다는 신호다.
#
# 실행 전 확인(액티비티) · 공통 진입 블록 규약: docs/ENVIRONMENT.md §7
#
# 핵심 실측 (2026-08-14):
#   ⚠️ **언어를 선택하면 앱이 통째로 재시작된다** — SplashScreen + "Server Override" 다이얼로그가 다시 뜨고
#     잠금화면(PIN)부터 다시 시작한다. 그래서 언어 1개당 "재시작 복구 + 설정 재진입"이 필요하다.
#     이 반복 구간을 헬퍼 `_change_language_old.yaml`로 분리했다.
#   ⚠️ 화면 문구가 매 회 바뀌므로 **언어 무관 셀렉터만 쓴다**:
#     잠금화면 `input_dot_1` / 홈 `btnTransfer` / 설정 항목 `view_language`.
#     드로어 "설정"만은 id가 없어 텍스트로 탭해야 해서, APK에서 뽑은 25개 로케일 값을 정규식으로 넣었다.
#
# ⚠️ **중단되면 앱이 외국어 상태로 남는다.** 다른 yaml은 전부 한국어 문자열을 쓰므로 곧바로 깨진다.
#   실패 시 수동으로 설정 → 언어 → 한국어로 되돌리고 재실행할 것.
#   (이 파일은 마지막에 한국어로 복귀하고, 복귀를 한국어 문구로 검증한다)
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\04_06_Settings_Change languages_old.yaml"
#
# ★ **이 파일은 `-lang ko` 고정이다.** 24개 언어 라벨은 어느 UI 언어에서도 원어로 표시되고
#   드로어 "설정"은 헬퍼가 25개 로케일 정규식으로 받는다 → 본문은 이미 언어 무관이다.
#   반면 끝의 복귀 검증은 **한국어여야** 성립하므로 `-lang en` 으로 돌릴 이유가 없다.
# ================================================================

# ----------------------------------------------------------------
# [01] [High] 설정 - 언어 변경 동작 확인 (24개 언어 순회 + 한국어 복귀 검증)
#   체크리스트 #204. **이 파일 전체가 케이스 하나다** — 24회 전환이 한 덩어리이고,
#   중간에 끊기면 앱이 외국어 상태로 남아 다른 yaml 이 전부 깨진다(위 주석 참고).
#   그래서 케이스를 쪼개지 않는다.
# ----------------------------------------------------------------
- launchApp
- waitForAnimationToEnd

# ---------------- 24개 언어 순회 ----------------
# 각 호출은 "직전 전환으로 재시작된 상태 → 홈 복구 → 설정 → 언어 선택"을 수행한다.
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "English"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "ភាសាខ្មែរ"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "ไทย"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "සිංහල"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "Монгол хэл"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "မြန်မာUnicode"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "नेपाली"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "Bahasa Indonesia"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "বাংলাদেশ"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "Русский язык"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "O'zbek tili"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "Tiếng Việt"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "اردو"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "中文"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "اللغة العربية"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "Français"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "Español"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "日本語"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "Português"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "Türkçe"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "Қазақ тілі"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "Кыргызча"
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "ລາວ"
# 마지막: 한국어로 복귀
- runFlow:
    file: _change_language_old.yaml
    env:
      LANG_LABEL: "한국어"

# ---------------- 한국어 복귀 검증 ----------------
# 재시작 복구 후 홈에서 한국어 문구가 보이는지로 판정한다.
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ LIVETEST 강제 — 판별이 불가능해 항등 시퀀스로 간다. 상세: docs/ENVIRONMENT.md §7.3
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "input_dot_1"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
# 홈 도달 판정은 `bottom_item_home` — 구 UI 홈은 스크롤 위치를 유지해 상단 카드(`btnTransfer`)가
#   화면 밖일 수 있다(프로젝트 규칙).
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 90000
# ⚠️ **이 두 단언은 변수화하지 말 것.** 이 파일은 마지막에 **한국어로 복귀**하는 케이스라
#   한국어 문구 자체가 **기대 결과(케이스의 일부)** 다. `${VAR}` 로 두면 `-lang en` 실행에서
#   영문 값으로 치환돼 **거짓 실패**한다(2026-09-15 정정).
- assertVisible: "GME Wallet 번호"
- assertVisible: "GME 총 잔액"
- takeScreenshot: lang_restored_ko
