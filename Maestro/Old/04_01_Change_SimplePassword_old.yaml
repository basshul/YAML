appId: ${APP_ID}
env:
  # 🔁 현재 로그인 비밀번호의 **마지막 특수문자**. 자동화 표준은 <정상 비밀번호> / <대체 비밀번호> 회전이라
  #    `04_02_Change_LoginPassword_old`를 돌려 값을 바꿨으면 여기도 함께 바꾼다.
  #    "느낌표" = `!`(현재)  /  "골뱅이" = `@`
  PW_CUR_LAST: "느낌표"
---
# ================================================================
# 시나리오: 간편 비밀번호(PIN) 변경 — 구 UI
# ================================================================
#  진행: **EXIT=0 / 8케이스** (2026-08-14 구 UI 기준 재작성 + 실기기 seungsoo818).
#    PIN <정상 PIN> → <대체 PIN> → 재시작 로그인 → <정상 PIN> 원복까지 전부 통과. 원복은 콜드 재시작으로 재확인함.
#    (이전 버전은 개편 UI 기준이라 진입 경로부터 동작 안 했음)
#
# 실행 전 확인 — 이 액티비티가 아니면 이 파일을 돌리지 말 것:
#   adb shell dumpsys window | Select-String mCurrentFocus
#     → ...homeV2.view.HomeActivityV2
#
# 구 UI 전환점 (2026-08-14 실측):
#   설정 진입   개편: 프로필 탭 → "Settings"      →  구 UI: **드로어 `iv_nav` → "설정"**
#              (구 UI 프로필 탭에는 설정이 없다 — 26_Menu_old [08]과 같은 경로)
#   홈 판정     개편: text "Home"                →  구 UI: **id `btnTransfer`**
#   인증 방법   개편: text "일반 비밀번호"/"계속"  →  구 UI: **id `cardComplexPassword` / `btnContinue`**
#              (같은 화면에 `cardFaceVerification`(얼굴 인증), 뒤로가기 `ivBack`)
#
# ⚠️ **이 파일은 실제로 계정의 PIN을 바꾼다.** <정상 PIN> → <대체 PIN> 으로 바꾼 뒤 마지막에 <정상 PIN>로 되돌린다.
#   중간에 실패해 <대체 PIN> 상태로 남으면 **다른 모든 yaml의 진입 블록(PIN <정상 PIN>)이 깨진다.**
#   실패 시 수동으로 1212로 되돌리고 재실행할 것.
# ⚠️ 키패드는 탭마다 배치가 재섞인다 → 탭 사이 `waitForAnimationToEnd` 필수.
#   (2026-08-04 오입력으로 "로그인 실패" 2회 발생 이력 — 누적되면 계정 잠금)
# ⚠️ [06]에 **일부러 틀린 로그인 비밀번호**(<의도적 오답 비밀번호>)를 넣는 음성 케이스가 있다(2026-08-14 사용자 확정).
#   **실측 확인: 이 오답은 로그인과 같은 5회 카운터를 실제로 깎는다** —
#   팝업 문구가 `실패 (06640154622502) / 인증 실패 - 남은 시도 횟수: 4번`이었다(2026-08-14).
#   → 이 파일을 **연속으로 4회 이상 재실행하면 계정이 잠긴다.** 실패로 중단된 뒤 재실행할 때는
#     남은 횟수를 먼저 확인할 것. 바로 뒤의 정상 인증이 성공하면 카운터는 회복되는 것으로 보인다
#     (같은 실행 안에서 오답 1회 → 정상 1회로 통과함).
#   ※ seungsoo818 로그인 비밀번호 = **`<정상 비밀번호>`** (2026-08-14 `04_02` 실행으로 `<구 비밀번호(폐기)>`에서 변경됨).
#     자동화 표준은 `<정상 비밀번호>` / `<대체 비밀번호>` 2종 회전이다 — 04_02를 돌릴 때마다 값이 바뀌므로
#     이 파일의 [06]/[08] 키패드 블록도 그때 함께 맞춰야 한다([[project_01_login]] 정책 참고).
#     ([11]의 `<의도적 오답 비밀번호>`는 "확실히 틀린 값"이 목적이라 그대로 둔다)
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\04_01_Change_SimplePassword_old.yaml"
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 ----------------
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 40000

# ----------------------------------------------------------------
# [01] [High] 드로어 → 설정 → 간편 비밀번호 변경 진입 확인
# ----------------------------------------------------------------
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "txt_user_email"
    commands:
      - tapOn:
          id: "iv_nav"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txt_user_email"
    timeout: 15000
- tapOn:
    text: "${CH_COMMON_SETTINGS}"
    above:
      id: "bottom_item_home"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "view_change_pin_code"
    timeout: 20000
- tapOn:
    id: "view_change_pin_code"
- extendedWaitUntil:
    visible:
      id: "input_dot_1"
    timeout: 20000
- assertVisible:
    id: "input_dot_4"
- takeScreenshot: pin01_step1

# ----------------------------------------------------------------
# [02] [High] 1단계 - 현재 PIN 오입력(0909) 거절 후 정상(<정상 PIN>) 통과
# ----------------------------------------------------------------
# 오입력해도 화면은 같은 1단계에 머무른다(입력칸만 초기화) → 화면 전환이 없음을 근거로 판정한다.
- tapOn: "0"
- waitForAnimationToEnd
- tapOn: "9"
- waitForAnimationToEnd
- tapOn: "0"
- waitForAnimationToEnd
- tapOn: "9"
- waitForAnimationToEnd
- assertVisible:
    id: "input_dot_1"
# 정상 PIN <정상 PIN> → 2단계로 이동
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd

# ----------------------------------------------------------------
# [03] [Medium] 2단계 - 현재와 동일한 PIN(<정상 PIN>)은 새 비밀번호로 거절
# ----------------------------------------------------------------
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- assertVisible:
    id: "input_dot_1"
# 새 PIN <대체 PIN> 입력 → 3단계(확인)로 이동
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "3"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "3"
- waitForAnimationToEnd

# ----------------------------------------------------------------
# [04] [Medium] 3단계 - 확인 PIN 불일치(3434) 시 재입력 요구
# ----------------------------------------------------------------
- tapOn: "3"
- waitForAnimationToEnd
- tapOn: "4"
- waitForAnimationToEnd
- tapOn: "3"
- waitForAnimationToEnd
- tapOn: "4"
- waitForAnimationToEnd
- assertVisible:
    id: "input_dot_1"
# 동일한 PIN <대체 PIN> 재입력 → 인증 방법 선택으로 이동
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "3"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "3"
- waitForAnimationToEnd

# ----------------------------------------------------------------
# [05] [High] 4단계 - 본인 확인 방법 선택 화면 노출 확인
# ----------------------------------------------------------------
# 구 UI는 텍스트가 아니라 id로 잡는다(2026-08-14 실측).
- extendedWaitUntil:
    visible:
      id: "btnContinue"
    timeout: 20000
- assertVisible:
    id: "cardComplexPassword"
- assertVisible:
    id: "cardFaceVerification"
- takeScreenshot: pin02_auth_select
- tapOn:
    id: "cardComplexPassword"
- waitForAnimationToEnd
- tapOn:
    id: "btnContinue"
- waitForAnimationToEnd

# ----------------------------------------------------------------
# [06] [High] 5단계 - 로그인 비밀번호 인증 (오답 → 실패 팝업 → 정상 → 변경 완료)
# ----------------------------------------------------------------
# ⚠️ 오답 1회는 의도된 음성 케이스다. 실패 카운터 소모 가능성이 있으니 반복 실행 주의.
# 보안 키패드: 키 라벨은 text가 아니라 content-desc(`Capital G 히읃` 등).
#   ⚠️ securityKeyboardEditText 탭 직후 transKeypad_row4를 누르면 문자 하나가 더 들어간다 — 쓰지 말 것.
- extendedWaitUntil:
    visible:
      id: "securityKeyboardEditText"
    timeout: 20000
- tapOn:
    id: "securityKeyboardEditText"
# 오답: <의도적 오답 비밀번호>
- runFlow:
    when:
      notVisible:
        text: "Capital G 히읃"
    commands:
      - tapOn: "대문자 키보드 변경"
      - waitForAnimationToEnd
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "1"
- tapOn: "2"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "골뱅이"
- tapOn: "${TRANSKEY_INPUT_COMPLETE}"
- waitForAnimationToEnd
- takeScreenshot: pin03_auth_fail
# 인증 실패 팝업 닫기 — 구 UI 버튼 id 확인 후 확정할 것
- tapOn: "확인|OK"
- waitForAnimationToEnd
# 비밀번호 입력 필드 재선택
- tapOn:
    id: "securityKeyboardEditText"
- waitForAnimationToEnd
# 정상: <정상 비밀번호>  (2026-08-14 04_02 실행으로 <구 비밀번호(폐기)> → <정상 비밀번호> 로 바뀜)
- runFlow:
    when:
      notVisible:
        text: "Capital G 히읃"
    commands:
      - tapOn: "대문자 키보드 변경"
      - waitForAnimationToEnd
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "t 시옫"
- tapOn: "e 디귿"
- tapOn: "s 니은"
- tapOn: "t 시옫"
- tapOn: "1"
- tapOn: "특수문자변경"
- tapOn: "${PW_CUR_LAST}"
- tapOn: "${TRANSKEY_INPUT_COMPLETE}"
- waitForAnimationToEnd
# 변경 완료 팝업
