- tapOn:
    id: "btnTransfer"
- waitForAnimationToEnd
- assertVisible:
    text: "${TXT_OVERSEAS_REMIT}"
- assertVisible:
    text: "${SCR_DOMESTIC_REMIT}"
- assertVisible:
    id: "llLocalTransfer"
- takeScreenshot: "[18]_은행페이지_송금시트"
- tapOn:
    id: "touch_outside"
- waitForAnimationToEnd
# 시트가 닫히고 은행 페이지로 돌아왔는지
- assertVisible:
