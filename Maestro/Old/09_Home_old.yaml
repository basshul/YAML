# ----------------------------------------------------------------
# [18] [High] 은행 페이지 - 송금 버튼 탭 → 송금 종류 바텀시트 노출 확인
# CLICKUP: z8nfn6ma1h
# ----------------------------------------------------------------
# 시트 구성은 [09](지갑 페이지)와 동일하다 — 해외송금 / 국내 송금(llLocalTransfer).
#   이 케이스가 보는 것은 "**은행 페이지에서도** 같은 시트가 뜨는가"다.
# ⚠️ 닫기는 `touch_outside` 로 한다. back 은 시트를 소비하지 않는 화면이 섞여 있어
#   액티비티로 전파되면 "앱을 종료하시겠습니까?"가 뜬다([09] 주석).
- assertVisible:
