appId: ${APP_ID}
---
# ================================================================
# 시나리오: HOME (구 UI)
# ================================================================
# ClickUp `[HOME] 시나리오`(z8nfn6m9ym, 29건) 대조 — 2026-08-13
#   각 케이스 위의 `# CLICKUP:` 주석이 ClickUp 케이스와의 **매핑 정본**이다.
#   ⚠️ 2026-09-16 정정: 이 주석을 읽어 상태를 올리는 자동화(`run_report_old.ps1`)는 **존재하지 않는다.**
#      상태 갱신은 수동이고, 주석은 대조 때 ClickUp 조회(하루 100회 한도)를 아끼는 용도다.
#   **실기기에서 실제로 검증한 것만** 달았다. 아래 부분커버/미커버는 일부러 뺀 것이니 임의로 채우지 말 것.
#
#   ✅ 커버완료 10건 (2026-09-16 ma1z 추가)
#      z8nfn6ma1a  Total Wallet Balance 숨기기/보이기      → [02]
#      z8nfn6ma1n  QR 선택시 QR 페이지 전환                → [04]
#      z8nfn6ma1r  Reward Points 노출 + 선택시 페이지 이동  → [01](노출) + [06](이동)
#      z8nfn6ma19  Total GME Balance 노출 + Available 전환 → [01](노출) + [07](총 잔액 분해)
#      z8nfn6ma1b  Transfer → 송금 바텀시트(해외/국내)      → [09]
#      z8nfn6ma1c  Deposit → GME Deposit Service 이동      → [10]
#      z8nfn6ma1t  실시간 환율 표시 + Today's Rate 이동     → [01](표시) + [11](이동)
#      z8nfn6ma1u  [말풍선] → Customer Support 팝업        → [12]
#      z8nfn6ma17  Wallet Number 노출 + Copy 동작          → [01](노출) + [14](복사 토스트)
#
#   ◐ 부분커버 6건 (to do 유지 — 케이스명의 뒷절이 미검증)
#      z8nfn6ma11  알림 내역 표시 + **검색 동작**    → [05]는 검색창 노출만 확인, 실제 검색 미수행
#      z8nfn6ma14  공지사항 내역 표시 + **검색 동작** → 위와 같음
#      z8nfn6ma1d  Bank 전환 + **Wallet에서 스와이프시 Bank 이동** → [08]은 아이콘 탭 전환만,
#                  케이스 03 스와이프는 은행 페이지 도달을 검증하지 않는다
#      z8nfn6ma1p  QR Send → 바텀시트(Global QR/Local)  → [04]는 버튼 노출만, 탭 안 함
#      z8nfn6ma1q  QR Receive → My QR 이동             → 위와 같음
#      z8nfn6ma1v  Customer Support 챗봇 전환(Live Chat) → [12]는 항목 노출만, 진입 안 함
#
#   ✗ 미커버 13건 (2026-09-16 재집계 — 종전 "Bank 하위 5건"은 오기였다)
#      · 알림·공지 3건 : ma12 알림 선택 / ma13 알림 삭제 / ma15 공지 선택
#      · Bank 하위 6건 : ma1f KFTC 번호 Copy / ma1g Bank Balance 마스킹 / ma1h Bank Transfer /
#                        ma1j Check Statement / ma1k 스와이프 계좌추가 / ma1m Add bank account
#      · Customer Support 4건 : ma1w 페이스북 / ma1x 인스타 / ma1y 네이버블로그 / ma20 전화번호 자동입력
#        (ma1z 카카오는 2026-09-16 **메신저 채널 전환으로 넓혀 [12]에서 커버**했다)
#      전부 환경 제약이 아니라 **추가 작업 대상**이다(생체·OTP와 무관).
#
#   ▶ 2026-10-02 진행 — 위 13건 중 **9건을 [16]~[24]로 작성**했다.
#      ma1f → [16] / ma1g → [17] / ma1h → [18] / ma1j → [19] / ma1k → [20] / ma1m → [21]
#      ma15 → [22] / ma12 → [23] / ma20 → [24]
#      ✅ 실기기 EXIT=0 확인 : [16] [17] [18] [19] [20] [21] [22]
#      ◐ 부분 확인 : [23] — 앱 동작(그 행의 N 만 사라짐)과 셀렉터 범위는 실측으로 확인했으나
#                    전제(행0 미확인)를 만족하는 통짜 1회가 남았다. 케이스 주석 참조.
#      ⛔ 미실행   : [24] — 실발신 가능성 때문에 일부러 돌리지 않았다. 케이스 주석 참조.
#      ★ [19]는 **첫 전제가 틀려서 실기기에서 한 번 깨졌고 실측대로 고쳤다** — 홈의 "거래내역 확인"은
#        04 의 은행 명세서가 아니라 `NewAccountHistoryActivity` 로 간다. 케이스 주석에 경로를 남겼다.
#
#   ✅ ma13 알림 삭제 → **[25] 로 작성, 실기기 EXIT=0**(2026-10-02 사용자 승인 후 알림 1건 소모).
#      확인 다이얼로그가 실제로 뜬다 — 다만 **resource-id 가 하나도 없어 문구로만 집힌다.**
#
#   🚫 ma1w 페이스북 / ma1x 인스타 / ma1y 네이버블로그 → **N/A 확정 (2026-10-02 사용자 확정)**
#      체크리스트 #99 · #100 · #101. 사유는 아래 "② 범위 결정" 에 적어 둔 그대로다:
#      **채널 목록을 서버가 바꾼다.** 2026-09-03 실측 = Facebook/Instagram/**Telegram**,
#      2026-09-16 실측 = 실시간 채팅/**Kakao**(Facebook·Instagram 이 없었다).
#      네이버 블로그는 **두 실측 어디에도 없었다.**
#      → 특정 채널을 하드 단언하면 서버 구성에 따라 무조건 FAIL 하고, 조건부로 감싸면 조용히
#        SKIP 되는 거짓 통과가 된다. **채널 단위 케이스를 두지 않는다.**
#      ⚠️ 고객지원 팝업 자체와 **채널이 노출되는가**는 `[12]` 가 이미 컨테이너·항목 id
#        (`rvMediaView`/`media_name`/`callTxtView`)로 본다. 거기에 메신저 채널 전환(ma1z)도 있다.
#        즉 **"채널 전환이 전혀 검증되지 않는다"가 아니라, 특정 브랜드별로는 두지 않는다**는 뜻이다.
#      → BLOCKED 가 아니라 **대상 제외**다. 다시 "작성 필요" 로 올리지 말 것.
#        상세: docs/PROGRESS.md "자동화 불가 확정 — 체크리스트"
#      ② 범위 결정이 필요한 3건 (셀렉터 문제가 아니다)
#         ma1w 페이스북 / ma1x 인스타 / ma1y 네이버블로그
#           → **채널 목록을 서버가 바꾼다.** 2026-09-03 실측 = Facebook/Instagram/Telegram,
#             2026-09-16 실측 = 실시간 채팅/Kakao (**Facebook·Instagram 이 없었다**).
#             네이버 블로그는 **두 실측 어디에도 없었다.**
#             → 특정 채널을 하드 단언하면 서버 구성에 따라 무조건 FAIL 하고, 조건부로 감싸면
#               조용히 SKIP 되는 **거짓 통과**가 된다. [12]가 `SCR_KAKAO` 로 "메신저 채널"을
#               넓혀 받은 것과 같은 판단이 필요하다 — 개별 채널 케이스로 갈지, [12]처럼
#               "외부 채널 전환"으로 묶을지 **정해진 뒤에 쓴다.**
# 2026-08-11 작성. 대상 화면 = HomeActivityV2.
#
# 실행 전 확인(액티비티) · 공통 진입 블록 규약: docs/ENVIRONMENT.md §7
#
# 이 화면은 resource-id가 전부 살아 있어 **id 기반으로 작성**했다.
# 덕분에 언어(ko/en) 의존이 거의 없다 — env 문자열 대신 id를 쓴다.
# 구성: 툴바(드로어/알림) + GME Wallet 번호·총 잔액 카드(계좌별 페이저) + 송금/입금 버튼
#       + 배너 슬라이더 + 환율 + 서비스 그리드 11개 + 플로팅 고객지원 + 하단 내비 5개.
# 하단 내비 라벨은 text가 아니라 content-desc이므로 id로 검증한다.
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\09_Home_old.yaml"
#   (Maestro 루트에서 실행 — run_test.ps1이 env\ko.env를 CWD 기준으로 읽음)
#
# ================================================================
# 외국인 계정(test123) 확인 항목 — **2건뿐** (2026-08-13 사용자 확정) / 실행 결과 기록
# ================================================================
# 외국인 계정으로 확인할 항목은 아래 2건이고, 둘 다 [01] 안에 있다.
# 2026-08-13 test123(외국인 / GMEPay 미신청 / 은행 미연결)으로 실행한 결과:
#
#    ✅ [01] GME Pay 가상 계좌 영역 노출: tv_easywallet_account_title / tv_easywallet_account_limit
#           → 둘 다 노출 확인. 같은 실행에서 환율 영역(rlExchangeRateView) 부재도 확인.
#    ⏸ [01] 서비스 그리드의 "개인 금융" 노출 — **보류(2026-08-13 사용자 지시)**
#           → **test123에서는 미노출**. 그리드는 11종뿐이었다(홈 최하단까지 덤프로 확인).
#             "외국인 전용으로 추가된다"는 2026-08-12 기록이 이 계정에서는 재현되지 않음 — 조건 불명.
#             livetest 환경에서는 노출 조건을 갖춘 계정을 만들기 까다로워 추후 재확인하기로 함.
#             (조건부라 미노출 계정에서는 SKIP되므로 이 파일 실행에는 지장 없음)
#
# ※ [02]~[15]는 **외국인 계정 재실행 대상이 아니다**(2026-08-13 사용자 확정).
#   따라서 test123 실행은 [01] 통과까지만 확인하면 되고, 파일 전체 EXIT=0을 요구하지 않는다.
#   외국인 계정에는 환율 영역이 없어 [11](rlExchangeRateView 탭)은 실패할 수 있으나,
#   [11]은 한국인 계정에서 이미 검증된 케이스라 그대로 둔다.
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 ----------------
- launchApp
- waitForAnimationToEnd
# livetest 빌드는 재실행 시 서버선택 스플래시를 띄움
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ LIVETEST 강제 — 판별이 불가능해 항등 시퀀스로 간다. 상세: docs/ENVIRONMENT.md §7.3
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
# 자동 로그아웃(세션 10분 만료)으로 재인증 화면에 떨어졌으면 비밀번호로 로그인한다
- runFlow: "_relogin_if_autologout_old.yaml"
# 잠금화면을 명시적으로 대기한 뒤 PIN 입력.
#   캐시된 홈이 잠깐 보였다가 잠금화면이 뜨는 레이스가 있어 "홈 notVisible" 가드는 쓰지 않는다.
#   PIN 키패드는 탭마다 배치가 재섞이므로 각 탭 사이에 정착 대기 필수(오입력 누적 = 계정 잠금).
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
# 로그인 직후 팝업들(순서 무관, 조건부)
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${BTN_CLOSE}"
      # ⚠️ 맹목적 팝업 닫기 — 상세 사유는 07_TodaysRate_old.yaml 의 같은 블록 주석 참고.
      #   요약: 런처 이탈 사고 이력이 있으나, id로 안 닫히는 팝업이 남아 진입이 막힐 수 있어
      #   지우지 않고 **이미 홈에 도달했으면 누르지 않도록** 가드만 좁혔다.
      notVisible:
        id: "btnTransfer"
    commands:
      - tapOn: "${BTN_CLOSE}"
      - waitForAnimationToEnd
# 홈 진입 확인
# ⚠️ 종전엔 `btnTransfer`만 30초 기다렸다. 2026-09-02 스위트 실행에서 이게 **20스텝에서 FAILED**로 죽었다
#   (원인: 앞 항목이 홈을 그리드까지 스크롤한 상태로 남겼고, `clearState` 없는 `launchApp`은
#    이전 태스크를 **재개**한다 → 구 UI 홈은 스크롤 위치를 유지하므로 상단 카드가 트리에 없다).
#   → 도달 판정은 **항상 보이는 하단 내비**로 하고, `btnTransfer`는 UP 스크롤로 끌어올린다.
#     아래 [01]이 상단 카드 요소들을 검사하므로 여기서 끌어올려 두는 게 전제이기도 하다.
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "btnTransfer"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- assertVisible:
    id: "btnTransfer"

# ----------------------------------------------------------------
# [01] [High] 홈 화면 기본 요소 노출 확인
# ----------------------------------------------------------------
# 상단 툴바 (고정 영역)
- assertVisible:
    id: "iv_nav"
- assertVisible:
    id: "noticeView"

# 잔액 카드 (homeScreenBalancePager - 계좌별 페이저)
- assertVisible:
    id: "txvWalletNumberTitle"
- assertVisible:
    id: "txvWalletNumber"
- assertVisible:
    id: "txvBalanceType"
- assertVisible:
    id: "txvBalanceValue"
- assertVisible:
    id: "txvCopyToClipBoard"
- assertVisible:
    id: "imgViewEye"

# 잔액 카드 상단 아이콘 3종 + 리워드 포인트
- assertVisible:
    id: "imgWallteIcon"
- assertVisible:
    id: "llBankLogo"
- assertVisible:
    id: "qrScan"
- assertVisible:
    id: "llRewardPoints"
- assertVisible:
    id: "txvRewardPoint"
- assertVisible:
    id: "txvRewardPointValue"

# 메인 버튼 2종
- assertVisible:
    id: "btnTransfer"
- assertVisible:
    id: "txvDepositOrViewStatement"

# 배너 슬라이더 + 인디케이터(n/N)
- assertVisible:
    id: "gmeImageSlider"
- assertVisible:
    id: "txvCountLabel"
- assertVisible:
    text: "\\d+/\\d+"

# 잔액 카드 아래 영역 — **계정 국적에 따라 구성이 갈린다**(2026-08-12 실측)
#   한국인: 환율 영역        rlExchangeRateView / txvCollAmount(KRW) / txvPAmount(USD)
#   외국인: GME Pay 가상 계좌 tv_easywallet_account_title / tv_easywallet_account_limit(일일 입금 한도)
#           → 환율 영역은 **아예 없다**(스크롤해도 없음)
# 두 계정 유형을 모두 커버하기 위해 분기로 검증한다.
#   ※ 한 번 실행하면 해당 계정의 분기만 타므로, 전체 커버리지는 **양쪽 계정으로 각각 실행**해야 나온다
#     (14_Deposit / 23_MyWallet과 동일한 방식).
- assertVisible: "GME Pay 가상 계좌|KRW"
- runFlow:
    when:
      visible:
        id: "rlExchangeRateView"
    commands:
      - assertVisible:
          id: "txvCollAmount"
      - assertVisible:
          id: "txvPAmount"
# ✅ test123 검증완료 (2026-08-13) — 외국인 분기가 실제로 실행됨을 확인했다.
#   tv_easywallet_account_title / tv_easywallet_account_limit 둘 다 노출.
#   같은 실행에서 rlExchangeRateView 부재(assertNotVisible)도 확인 — 외국인에는 환율 영역이 없다.
#   ※ test123은 GMEPay 미신청 계정이라 limit 자리의 문구가 한도가 아니라
#     "지금 가상계좌 신청하기"다(신청 완료 계정은 "남은 일일 입금 한도: N KRW").
#     id는 동일하므로 이 검증 코드는 두 상태 모두에서 통과한다.
- runFlow:
    when:
      visible:
        id: "tv_easywallet_account_title"
    commands:
      - assertVisible:
          id: "tv_easywallet_account_limit"

# 플로팅 고객지원 버튼
- assertVisible:
    id: "llChatCardView"

# 하단 내비 5종 — 라벨이 text가 아니라 content-desc라 id로 검증
- assertVisible:
    id: "bottom_item_home"
- assertVisible:
    id: "bottom_item_history"
- assertVisible:
    id: "bottom_item_pay"
- assertVisible:
    id: "bottom_item_event"
- assertVisible:
    id: "bottom_item_profile"

# 서비스 그리드 11종 (스크롤 필요)
#   ※ "모바일 충전\n및 청구서 결제", "해외송금\n받기", "GME Wallet\n거래내역"은 줄바꿈이 들어간
#     단일 TextView다. Maestro text 셀렉터는 전체매칭이라 앞부분만 쓰면 실패하므로
#     줄바꿈을 포함해 정규식 ".*"로 이어준다.
- scrollUntilVisible:
    element:
      text: "${TXT_RESERVATION}"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "${TXT_OVERSEAS_REMIT}"
- assertVisible:
    text: "${SCR_DOMESTIC_REMIT}"
- assertVisible:
    text: "${RATE_SCR_TITLE}"
- assertVisible:
    text: "${HOME_TOPUP_BILL}"
- assertVisible:
    text: "${HOME_RECEIVE_OVERSEAS}"
- assertVisible:
    text: "${TXT_DEPOSIT}"
- assertVisible:
    text: "${TXT_ATM}"
- assertVisible:
    text: "${HOME_WALLET_STATEMENT}"
- assertVisible:
    text: "${HOME_TELECOM}"
- assertVisible:
    text: "${TXT_CERTIFICATE}"
- assertVisible:
    text: "${TXT_RESERVATION}"
# ⚠️ test123(외국인)에서도 "개인 금융" **미노출** — 조건 불명 (2026-08-13 실측)
#   "외국인 계정에서만 추가된다"(2026-08-12 기록)는 test123에서 재현되지 않았다.
#   홈 최하단까지 스크롤한 uiautomator 덤프 기준 그리드는 위 11종뿐이고 "금융"/"대출" 텍스트가 없다.
#   → 국적만으로 갈리는 게 아니라 다른 계정 속성(어드민 국적 세부값 / 서비스 신청 상태 등)에
#     달린 것으로 보인다. 조건이 확인되면 그 계정으로 재검증할 것.
#   조건부(runFlow when visible)라 노출되지 않는 계정에서는 SKIP되므로 그대로 둔다.
- runFlow:
    when:
      visible:
        text: "${TXT_PERSONAL_FINANCE}"
    commands:
      - assertVisible:
          text: "${TXT_PERSONAL_FINANCE}"

# 최상단 복귀
- scrollUntilVisible:
    element:
      id: "txvWalletNumberTitle"
    direction: UP
    timeout: 10000

# ----------------------------------------------------------------
# [02] [Medium] 잔액 마스킹 토글(눈 아이콘) 동작 확인
# CLICKUP: z8nfn6ma1a
# ----------------------------------------------------------------
# ※ 마스킹 표기는 별표가 아니라 **"XXX"**(ASCII X 3개)다. 2026-08-11 실측:
#   노출 상태 txvBalanceValue="3,099" → 마스킹 상태 txvBalanceValue="XXX".
#   별표 패턴("\*+")을 쓰면 항상 실패한다.
# 초기 상태 정규화: 마스킹 상태면 먼저 해제해 '잔액 노출'로 맞춤
- runFlow:
    when:
      visible:
        id: "txvBalanceValue"
        text: "XXX"
    commands:
      - tapOn:
          id: "imgViewEye"
      - waitForAnimationToEnd

# 노출 → 마스킹 전환 확인
- tapOn:
    id: "imgViewEye"
- waitForAnimationToEnd
- assertVisible:
    id: "txvBalanceValue"
    text: "XXX"

# 마스킹 → 노출 복귀 확인
- tapOn:
    id: "imgViewEye"
- waitForAnimationToEnd
- assertNotVisible:
    id: "txvBalanceValue"
    text: "XXX"

# ----------------------------------------------------------------
# [03] [Medium] 잔액 카드 페이저 스와이프 → 계좌 전환 확인
# ----------------------------------------------------------------
# 잔액 카드는 계좌별 페이지로 구성됨(현 계정 6개). 스와이프 시 GME Wallet 번호/잔액 라벨이
# 계좌에 맞게 바뀌는지 확인. 계좌 구성은 계정마다 달라 값은 검증하지 않고 요소 유지만 확인한다.
- swipe:
    from:
      id: "homeScreenBalancePager"
    direction: LEFT
- waitForAnimationToEnd
- assertVisible:
    id: "txvBalanceValue"
- swipe:
    from:
      id: "homeScreenBalancePager"
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible:
    id: "txvWalletNumberTitle"
- assertVisible:
    id: "txvBalanceValue"

# ----------------------------------------------------------------
# [04] [High] QR 아이콘 탭 → 잔액 카드가 QR 페이지로 전환 확인
# CLICKUP: z8nfn6ma1n
# CLICKUP-PARTIAL: z8nfn6ma1p | "지금 송금하기" 버튼 노출만 확인, 탭 후 바텀시트(Global QR/Local)는 미확인
# CLICKUP-PARTIAL: z8nfn6ma1q | "받기" 버튼 노출만 확인, 탭 후 My QR 화면 이동은 미확인
# ----------------------------------------------------------------
# 화면 이동도, 바텀시트도 아니다. 잔액 카드 상단의 아이콘 3종
# (imgWallteIcon=지갑 / llBankLogo=은행 / qrScan=QR)은 **잔액 카드 페이저의 페이지를 바꾸는**
# 스위처이고, 페이지에 따라 하단 버튼 2개의 라벨이 함께 바뀐다.
#   지갑 페이지 → "송금" / "입금"
#   QR 페이지   → "지금 송금하기" / "받기"
#   은행 페이지 → "송금" / "거래내역 확인"
# ※ 이 상태에서 pressKey back을 하면 시트가 없으므로 back이 액티비티로 전파돼
#   "앱을 종료하시겠습니까?" 다이얼로그가 뜬다. 복귀는 지갑 아이콘 탭으로 한다.
- tapOn:
    id: "qrScan"
- waitForAnimationToEnd
- assertVisible:
    text: "${DOMESTIC_SEND_RECEIVE_QR}"
- assertVisible:
    id: "btnTransfer"
    text: "${RATE_SEND_BTN}"
- assertVisible:
    id: "txvDepositOrViewStatement"
    text: "${RECEIVE}"
# 지갑 아이콘으로 GME Wallet 페이지 복귀
- tapOn:
    id: "imgWallteIcon"
- waitForAnimationToEnd
- assertVisible:
    id: "txvWalletNumberTitle"
- assertVisible:
    id: "btnTransfer"
    text: "${WALLET_TRANSFER_BTN}"

# ----------------------------------------------------------------
# [05] [High] 알림 아이콘 탭 → 공지사항/알림 화면 이동 확인
# CLICKUP-PARTIAL: z8nfn6ma11 | 알림 내역 표시는 확인, 검색창 노출만 보고 실제 검색은 미수행
# CLICKUP-PARTIAL: z8nfn6ma14 | 공지사항 내역 표시는 확인, 검색창 노출만 보고 실제 검색은 미수행
# ----------------------------------------------------------------
# NotificationAndNoticeActivity — 공지사항 / 알림 두 탭 + 검색
- tapOn:
    id: "noticeView"
- extendedWaitUntil:
    visible:
      text: "${SCR_NOTIFICATION}"
    timeout: 15000
- assertVisible:
    text: "${NOTIFICATION_TEXT}"
- assertVisible:
    text: "${NOTICE_SEARCH_HINT}"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "btnTransfer"

# ----------------------------------------------------------------
# [06] [Medium] 리워드 포인트 탭 → 리워드 포인트 내역 화면 이동 확인
# CLICKUP: z8nfn6ma1r
# ----------------------------------------------------------------
# RewardPointHistoryActivity
- tapOn:
    id: "llRewardPoints"
- extendedWaitUntil:
    visible:
      text: "${MY_REWARD_POINTS}"
    timeout: 15000
- assertVisible:
    text: "${DEBUG_MENU_DEEPLINK_REWARD_POINT}"
- assertVisible:
    text: "${GO_TO_GME_SHOP}"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "btnTransfer"

# ----------------------------------------------------------------
# [07] [High] 잔액 영역 탭 → 잔액 상세(총 잔액 분해) 노출 확인
# CLICKUP: z8nfn6ma19
# ----------------------------------------------------------------
# 화면 이동이 아니라 홈 위에 잔액 상세가 펼쳐진다(총 잔액 = GME Wallet + GME Pay).
# ※ 이 동작도 잔액 카드 페이지에 따라 다르다 — **지갑 페이지에서만** 상세가 열리고,
#   은행 페이지에서는 아무 반응이 없다. 그래서 [04]에서 지갑 페이지로 복귀시킨 상태를 전제로 한다.
# 금액은 계정마다 달라 라벨만 검증한다.
- tapOn:
    id: "llBalanceSection"
- waitForAnimationToEnd
- assertVisible:
    text: "${CARD_TOTAL_BALANCE_TEXT}"
- assertVisible:
    text: "GME Wallet"
- assertVisible:
    text: "${GMEPAY_TITLE}"
# 닫기: 바텀시트로 뜨면 시트 밖 탭, 그래도 홈이 아니면 back
- runFlow:
    when:
      visible:
        id: "touch_outside"
    commands:
      - tapOn:
          id: "touch_outside"
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "btnTransfer"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- assertVisible:
    id: "btnTransfer"

# ----------------------------------------------------------------
# [08] [Medium] 은행 아이콘 탭 → 잔액 카드가 연결 은행 계좌로 전환 확인
# CLICKUP-PARTIAL: z8nfn6ma1d | 아이콘 탭 전환은 확인, "Wallet에서 스와이프시 Bank 이동"은 [03]이 은행 페이지 도달을 검증하지 않아 미확인
# ----------------------------------------------------------------
# 화면 이동이 아니라 잔액 카드 페이저가 은행 계좌 페이지로 전환된다.
# 이때 하단 버튼도 "송금 / 거래내역 확인"으로 바뀐다(GME Wallet 카드에서는 "송금 / 입금").
- tapOn:
    id: "llBankLogo"
- waitForAnimationToEnd
- assertVisible:
    text: "${CHECK_STATEMENT_TEXT}"
- assertVisible:
    id: "txvBalanceType"
# 지갑 아이콘으로 GME Wallet 카드 복귀
- tapOn:
    id: "imgWallteIcon"
- waitForAnimationToEnd
- assertVisible:
    id: "txvWalletNumberTitle"
- assertVisible:
    id: "txvDepositOrViewStatement"

# ----------------------------------------------------------------
# [09] [High] 송금 버튼 탭 → 송금 종류 바텀시트 노출 확인
# CLICKUP: z8nfn6ma1b
# ----------------------------------------------------------------
# 이건 진짜 BottomSheetDialog다(dismiss 영역 id=touch_outside).
# 항목: 해외송금(llQrContainer) / 국내 송금(llLocalTransfer)
- tapOn:
    id: "btnTransfer"
- waitForAnimationToEnd
- assertVisible:
    text: "${TXT_OVERSEAS_REMIT}"
- assertVisible:
    text: "${SCR_DOMESTIC_REMIT}"
- assertVisible:
    id: "llLocalTransfer"
# 시트 밖 탭으로 닫기(back보다 안전 — 시트가 back을 소비하지 않는 화면이 섞여 있음)
- tapOn:
    id: "touch_outside"
- waitForAnimationToEnd
- assertVisible:
    id: "btnTransfer"

# ----------------------------------------------------------------
# [10] [High] 입금 버튼 탭 → 입금 서비스 화면 이동 확인
# CLICKUP: z8nfn6ma1c
# ----------------------------------------------------------------
# ActivityDepositMenu — 타이틀 "입금 서비스", 입금 수단 카드 5종
#   GME Wallet 입금 / ATM 입금 / GMEPay\n입금 / 자동이체 입금 / 현장 입금
- tapOn:
    id: "txvDepositOrViewStatement"
- extendedWaitUntil:
    visible:
      text: "${DEPOSIT_SERVICE}"
    timeout: 15000
- assertVisible:
    id: "cardGmeWalletDeposit"
- assertVisible:
    id: "cardAtmDeposit"
- assertVisible:
    id: "cardViewGmePayDeposit"
- assertVisible:
    id: "cardAutoDebitDeposit"
- assertVisible:
    text: "${CONVENIENCE_STORE_TEXT}"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "btnTransfer"

# ----------------------------------------------------------------
# [11] [High] 환율 영역 탭 → 오늘의 환율 화면 이동 확인
# CLICKUP: z8nfn6ma1t
# ----------------------------------------------------------------
# ExchangeRateActivity
- tapOn:
    id: "rlExchangeRateView"
- extendedWaitUntil:
    visible:
      text: "${RATE_SCR_TITLE}"
    timeout: 15000
- assertVisible:
    text: "${RATE_PAYMENT_METHOD}"
- assertVisible:
    text: "${RATE_SEND_AMOUNT}"
- assertVisible:
    text: "${RATE_CURRENT}"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "btnTransfer"

# ----------------------------------------------------------------
# [12] [Medium] 플로팅 고객지원 버튼 탭 → 고객지원 바텀시트 항목 확인
# CLICKUP: z8nfn6ma1u
# CLICKUP-PARTIAL: z8nfn6ma1v | "실시간 채팅" 항목 노출만 확인, 탭 후 챗봇 화면 전환은 미확인
# CLICKUP: z8nfn6ma1z
# ★ 2026-09-16 결정: **텔레그램 케이스를 따로 만들지 않는다.** 카카오 케이스(ma1z)를
#   **"메신저 채널 전환"으로 넓혔다** → env `SCR_KAKAO=Kakao|Telegram` 으로 둘 다 받는다.
# ⚠️ 나머지 채널(ma1w 페이스북 / ma1x 인스타 / ma1y 네이버 / ma20 전화)은 여전히 미커버다.
# ----------------------------------------------------------------
- tapOn:
    id: "llChatCardView"
- waitForAnimationToEnd
- assertVisible:
    text: "${SCR_SUPPORT_Q}"
- assertVisible:
    id: "chatView"
- assertVisible:
    text: "${SCR_LIVE_CHAT}"
# ⚠️ **채널 구성과 대표번호를 문자열로 박지 말 것** — 서버가 바꾼다(2026-09-03 실측).
#   `"Kakao"`로 기다리고 있었으나 실제 목록은 Facebook / Instagram / **Telegram** 이고 Kakao는 없다.
#   대표번호도 1811-2961 → 1811-2904 → **1811-2927** 로 두 번 바뀌었다
#   (`26_Menu_old.yaml [01-1]`이 이미 같은 이유로 id 판정으로 바꿔 뒀다).
#   이 케이스가 보는 건 "고객지원 팝업이 뜨고 채널과 대표번호가 노출되는가"이지
#   특정 채널이 무엇인가가 아니다 → **컨테이너와 항목 id로 판정**한다(2026-09-03 실기기 덤프).
- assertVisible:
    id: "rvMediaView"
- assertVisible:
    id: "media_name"
- assertVisible:
    id: "callTxtView"

# ---- 메신저 채널 전환 확인 (ma1z) ----
# ⚠️ 채널명을 고정하지 말 것 — **서버가 되돌린다.** 실측이 두 번 갈렸다:
#   2026-09-03 = Facebook/Instagram/**Telegram**(Kakao 없음) / 2026-09-16 = 실시간 채팅/**Kakao**.
#   그래서 `SCR_KAKAO=Kakao|Telegram` 으로 둘 다 받는다.
# ⚠️ 전환 성립을 **"Play 스토어가 떴다"로 단언하지 말 것.** 해당 메신저가 설치돼 있으면 그 앱이 뜬다
#   (2026-09-16 실측: 카카오톡 미설치라 Play 스토어 카카오톡 페이지로 갔다).
#   기기 상태에 안 흔들리도록 **"GME 앱을 벗어났는가"** 로 판정한다.
- tapOn:
    id: "media_name"
    text: "${SCR_KAKAO}"
- extendedWaitUntil:
    notVisible:
      id: "rvMediaView"
    timeout: 20000
- assertNotVisible:
    id: "bottom_item_home"
- takeScreenshot: "09_12_messenger_channel"
# 외부 앱에서 복귀. 시트가 남아 있을 수 있어 홈 도달까지 back 을 민다(무한 루프 방지로 상한).
- repeat:
    times: 6
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# 시트가 다시 열려 있으면 닫는다(복귀 경로에 따라 갈린다)
- runFlow:
    when:
      visible:
        id: "btnCancel"
    commands:
      - tapOn:
          id: "btnCancel"
- waitForAnimationToEnd
- assertVisible:
    id: "btnTransfer"

# ----------------------------------------------------------------
# [13] [High] 좌상단 메뉴 탭 → 드로어 열림 및 메뉴 항목 확인
# ----------------------------------------------------------------
# iv_nav는 DrawerLayout(drawer_home)을 여는 햄버거 메뉴다. 액티비티는 그대로이고
# 홈 노드도 계층에 함께 남아 있으므로, 드로어가 열렸는지는 드로어 전용 항목으로 판별해야 한다.
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
# ★ 2026-10-02 보강 — 체크리스트 `MENU > Information` **#104("Full Name, Phone Number, Email
#   정보 표시 확인")가 보는 것이 바로 이 세 줄이다.** 드로어 헤더가 그 화면이다(별도 Information
#   화면은 없다 — 26_Menu_old 의 케이스 목록에도 없다. 2026-10-02 실측 드로어 덤프로 확인:
#   txt_user_name="LEE SEUNGSOO" / txt_contact=숫자 11자리 / txt_user_email=메일 주소).
#   종전엔 **노출만** 봤다. 빈 값이어도 통과할 수 있어 "표시 확인"의 근거로는 약하다
#   → **값의 형식까지** 단언한다(값 자체는 계정마다 다르므로 형식만 본다).
#   ※ 정규식에 백슬래시가 들어가는 두 줄은 **단일인용**이다 — 이중인용이면 2겹으로 써야 한다.
- assertVisible:
    id: "txt_user_name"
    text: ".*[A-Za-z가-힣]+.*"
- assertVisible:
    id: "txt_contact"
    text: '[0-9+\- ]{8,}'
- assertVisible:
    id: "txt_user_email"
    text: '.*@.*\..*'
- assertVisible:
    text: "${AUTO_DEBIT_ACCOUNT_TEXT}"
- assertVisible:
    text: "${COMMON_INBOUND_ACCOUNT_LABEL}"
- assertVisible:
    text: "${INIT_BRANCH_TITLE}"
- assertVisible:
    text: "${ABOUT_GME_TEXT}"
- assertVisible:
    text: "${CH_COMMON_SETTINGS}"
- assertVisible:
    text: "${COMMON_PRIVACY_POLICY_LABEL}"
- assertVisible:
    text: "${REG_TERMS_TITLE}"
- assertVisible:
    text: "${REG_LOGOUT}"
# 드로어 닫기
#   ⚠️ back은 드로어를 닫으면서 액티비티까지 전파돼 "앱을 종료하시겠습니까?"가 뜬다.
#   드로어 위에서 왼쪽 스와이프도 닫히지 않았다(둘 다 2026-08-11 실측).
#   DrawerLayout은 열려 있는 동안 우측 콘텐츠가 스크림으로 덮이므로,
#   화면 우측 끝 요소를 탭하면 스크림에 닿아 드로어가 닫힌다(좌표 없이 id로 지정 가능).
- tapOn:
    id: "bottom_item_profile"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "${HOME_EXIT_CONFIRM}"
    commands:
      - tapOn: "${REG_NO}"
      - waitForAnimationToEnd
- assertNotVisible:
    id: "txt_user_email"
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 10000

# ----------------------------------------------------------------
# [14] [Medium] GME Wallet 번호 복사 → 복사 완료 토스트 확인
# CLICKUP: z8nfn6ma17
# ----------------------------------------------------------------
# ⚠️ 토스트 검증 주의 (2026-08-12 실측):
#   - `uiautomator dump`에는 토스트가 **잡히지 않지만** Maestro의 assertVisible은 **본다**.
#     (화면 텍스트를 uiautomator로 읽어야 정확한 경우가 많은데, 토스트는 정반대다)
#   - 토스트는 약 2초 후 사라지므로 탭과 assert 사이에 대기를 넣으면 안 된다.
#     waitForAnimationToEnd를 끼우면 실패한다.
#   - 클립보드에 실제로 들어간 값 검증은 붙여넣을 입력 필드가 필요해 홈 화면 밖으로 나가야 한다.
#     홈의 책임 범위를 넘으므로 여기서는 복사 동작(토스트)까지만 확인한다.
- tapOn:
    id: "txvCopyToClipBoard"
- assertVisible: "${TOAST_COPIED}"
- waitForAnimationToEnd
- assertVisible:
    id: "txvWalletNumber"

# ----------------------------------------------------------------
# [15] [Medium] 배너 탭 → 화면 이동 후 홈 복귀 확인
# ----------------------------------------------------------------
# ⚠️ 배너 목적지는 **비결정적**이다. 배너 6개가 자동 롤링하고 항목마다 목적지가 다르다
#   (2026-08-12 실측: "EasyGo 카드" 배너 → GMECardOwnerActivity. 그 외 친구 초대·룰렛 이벤트 등 존재).
#   실행 시점에 어느 배너가 떠 있는지 정해지지 않으므로 목적지를 고정 검증할 수 없다.
#   → **판정 기준: 배너를 탭했을 때 에러만 발생하지 않으면 PASS**(사용자 확정, 2026-08-12).
#   "홈을 벗어났는지"조차 검증하지 않는다 — 배너에 따라 이동하지 않는 것도 정상일 수 있고,
#   그걸 실패로 잡으면 배너 구성이 바뀔 때마다 깨지는 불안정한 케이스가 된다.
#   탭 이후에는 어디로 갔든 홈으로 되돌려 다음 케이스에 영향을 주지 않게만 한다.
#   외부 브라우저로 나가는 배너도 있을 수 있어 복귀는 조건부 back 반복으로 처리한다.
- assertVisible:
    id: "txvCountLabel"
- tapOn:
    id: "ll_allView"
- waitForAnimationToEnd
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible:
              id: "scrollViewHomeFragment"
          commands:
            - runFlow:
                when:
                  visible: "${HOME_EXIT_CONFIRM}"
                commands:
                  - tapOn: "${REG_NO}"
                  - waitForAnimationToEnd
            - runFlow:
                when:
                  notVisible:
                    id: "scrollViewHomeFragment"
                commands:
                  - pressKey: back
                  - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "scrollViewHomeFragment"
    timeout: 20000

# ================================================================
# [16]~[20] 2026-10-02 추가 — 체크리스트 미커버분
# ================================================================
# ⚠️ **전부 실기기 미검증이다.** 기기 없이 작성했고, 셀렉터는 **이 파일과 04_Menu_History 가
#   이미 실측해 둔 id 만** 썼다(추측 id 없음). 첫 실행에서 깨지면 셀렉터가 아니라
#   **전제**(아래 각 케이스의 ⚠️)가 틀린 것이니 그쪽부터 본다.
#
# 🚫 **외국인 계정(test123) 실행 대상이 아니다** — [02]~[15]와 같다(2026-08-13 사용자 확정).
#   [16]~[19]는 **은행 계좌가 연결된 계정**을 전제로 한다. 미연결 계정에서는 은행 페이지 자체가
#   없으므로 `llBankLogo` 탭이 다른 화면을 띄운다.
#
# 공통 전제: [15]가 배너를 탭하고 돌아온 직후라 홈이 스크롤돼 있을 수 있다 → 잔액 카드를 먼저 끌어올린다.
- scrollUntilVisible:
    element:
      id: "txvWalletNumberTitle"
    direction: UP
    timeout: 15000
- assertVisible:
    id: "homeScreenBalancePager"

# ----------------------------------------------------------------
# [16] [High] 은행 페이지 - KFTC 계좌번호 노출 + 복사 동작 확인
# CLICKUP: z8nfn6ma1f
# ----------------------------------------------------------------
# 은행 페이지는 **별도 화면이 아니라 잔액 카드 페이저의 한 페이지**다([08] 실측).
#   따라서 번호/복사 요소의 id 는 지갑 페이지와 같은 `txvWalletNumber` / `txvCopyToClipBoard` 다.
#   ⚠️ 이 "같다"는 것만이 미검증 전제다. 다르면 여기서 **즉시 FAIL** 한다(조건부로 감싸지 않았다 —
#     감싸면 번호가 없어도 조용히 통과해 버린다).
# ⚠️ 토스트 검증 규칙은 [14]와 같다: 탭과 assert 사이에 **대기를 넣으면 안 된다**(약 2초 후 사라짐).
- tapOn:
