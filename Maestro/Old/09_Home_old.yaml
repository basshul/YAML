- waitForAnimationToEnd
# 은행 페이지 도달 근거 — 하단 버튼이 "거래내역 확인"으로 바뀐다([08] 실측)
- assertVisible:
    text: "${CHECK_STATEMENT_TEXT}"
- assertVisible:
    id: "txvWalletNumberTitle"
- assertVisible:
    id: "txvWalletNumber"
- assertVisible:
    id: "txvCopyToClipBoard"
- takeScreenshot: "[16]_은행페이지_계좌번호노출"
- tapOn:
    id: "txvCopyToClipBoard"
- assertVisible: "${TOAST_COPIED}"
- waitForAnimationToEnd
# 복사 후에도 은행 페이지에 그대로 있어야 한다(복사가 화면을 바꾸면 안 된다)
- assertVisible:
    text: "${CHECK_STATEMENT_TEXT}"

# ----------------------------------------------------------------
# [17] [Medium] 은행 페이지 - 잔액 숨기기/보이기 동작 확인
# CLICKUP: z8nfn6ma1g
# ----------------------------------------------------------------
# [02]의 지갑 페이지판과 같은 구조다. 마스킹 표기는 별표가 아니라 **"XXX"**([02] 실측).
# 초기 상태 정규화 — 마스킹 상태면 먼저 해제해 '잔액 노출'로 맞춘다.
- runFlow:
    when:
