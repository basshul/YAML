# ----------------------------------------------------------------
# [06] [High] 🚫 BLOCKED — New Number 상품 요금제 정상신청 동작 확인
# ----------------------------------------------------------------
# 사유(2026-09-03 변경): **신청 프로세스 중간에 외부 인증이 있어 자동화로 완료할 수 없다**(사용자 확인).
#   종전 사유 "상품 미등록"은 해소됐으나, 이건 데이터가 아니라 **경로 자체의 제약**이라 풀리지 않는다.
#   ⚠️ 실제 유심 신청이 발생하는 플로우다(현재 신청 이력이 [08]에 "처리중"으로 남아 있다).
#   → 수동 테스트 대상.
#
# ★ 2026-09-29: ClickUp 을 **`canceled`** 로 내렸다(사용자 처리). 사유가 하나 더 얹혔다 —
#   외부 인증 이전에 **진입 경로 자체가 없어졌다**([02]~[05],[08]과 같은 사유).
#
# ⛔ 그래서 아래 **CLICKUP-PARTIAL 마커를 죽였다**(`#x ` 접두사).
#   살려 두면 데일리 리포트가 돌 때마다 이 두 건을 **`partially completed` 로 되밀어 올려**
#   사용자가 손으로 내린 `canceled` 를 덮는다. 마커는 상태를 **밀어 올리는** 장치지
#   현 상태를 적어 두는 메모가 아니다.
