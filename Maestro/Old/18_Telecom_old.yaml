appId: ${APP_ID}
---
# ================================================================
# 시나리오: Telecom (GME 텔레콤 / GME Mobile) — 구 UI
# ================================================================
#  진행: 2026-08-19 구 UI 기준 **전면 재작성**.
#    2026-09-03: **상품 등록으로 [05] 구현 + [03][04] 수정.** 73스텝 -> **82스텝**.
#      검증: 1회차 전 구간 통과 / 2회차 USB 끊김으로 중단(코드 결함 아님) / **3회차 EXIT=0, 99 COMPLETED**.
#      ⚠️ 이 기기는 USB가 자주 끊긴다(이날만 4회 재연결). 중단되면 셀렉터를 의심하기 전에
#        `adb devices`부터 볼 것 - "device not found"면 환경 문제다.
#
# 실행 전 확인 — 이 액티비티가 아니면 이 파일을 돌리지 말 것:
#   adb shell dumpsys window | Select-String mCurrentFocus
#     → ...homeV2.view.HomeActivityV2
#
# ---------------------------------------------------------------
# 개편UI → 구 UI 전환에서 바뀐 것 (2026-08-19 실측)
# ---------------------------------------------------------------
#   진입 그리드 항목  "GME 모바일" → **"통신 서비스"**
#                     (구 UI 홈 서비스 그리드 11종 중 9번째. 스크롤 필요)
#   텔레콤 홈 카드    "GME Mobile" → **"Mobile SIM"**
#                     (`leftlayout`(clickable) + `lefttextview`. 개편UI엔 id가 없어 텍스트로
#                      잡았지만 구 UI는 id가 있으니 **id로 잡는다**)
#   요금제 선택 페이지 screenTitle "GME Mobile" → **"Mobile SIM"**
#   홈 판정          `text: "Home"` → 하단 내비 **id `bottom_item_home`** / 상단 `btnTransfer`
#   홈 복귀          `repeat while notVisible "Home"` 식 back 루프 → **`homebutton` 1탭**
#                     (텔레콤 홈의 상단 좌측 홈 아이콘. 즉시 HomeActivityV2로 간다)
#
# ---------------------------------------------------------------
# 화면 구조 (2026-08-19 실측)
# ---------------------------------------------------------------
#   텔레콤 홈 `telecom.view.ActivityTelecomHome`
#     `homebutton`(상단 좌측 홈) / `titleText`("저렴하고 편리하기까지!") / "GME 텔레콤"
#     `gmeImageSlider`(배너, `title1` "50% Discount", `txvCountLabel` "2/2")
#     `submenu_list_content` > `leftlayout`(clickable) > `lefttextview` = **"Mobile SIM"**
#     `contactus`("고객센터 연결하기")
#   CS 팝업 — "사용 중 궁금한 점이 있으신가요?"(앱 오타 그대로) / `chatView`("실시간 채팅")
#     / `btnCancel`("취소")   ※ 개편UI와 동일
#   요금제 선택 페이지 `telecom.view.GmeTelecomPostPaidActivity`, `screenTitle` "Mobile SIM"
#     `btnBack` / "원하는 요금제를 선택해 주세요."
#     `applylinesimlayout`("Line SIM 요금제") / `applyprepaidsimlayout`("선불 SIM 신청")
#     / `chedkmynumerlayout`("GME Mobile 사용량 확인")
#   요금제 목록 페이지 — 같은 액티비티, `screenTitle` **"LG U+ 패키지"**
#     `list_sub_container` > **`noDataAvailable`("내역 없음")**
#     ※ Line SIM / 선불 SIM **둘 다 같은 목록 페이지**로 가고 **둘 다 비어 있다**
#   사용량 확인 페이지 — 같은 액티비티, `screenTitle` **"사용 가능한 번호"**
#     `listview` > `container` × N > `status_titleTxt`("상태:") / `status_text`("등록 취소"|"처리중")
#     / `startDate`("Applied date :2026-04-22")
#
# ⚠️ **`GmeTelecomPostPaidActivity`는 FLAG_SECURE다 — 스크린샷을 찍으면 안 된다**
#   (2026-08-19 실측). 즉 **요금제 선택 / 요금제 목록 / 사용량 확인 세 화면 모두** 해당한다.
#   `takeScreenshot`이 `INTERNAL: Screenshot returned null`로 죽고 **플로우 전체가 EXIT=1**이 된다
#   (실제로 [03-1]에서 그렇게 실패했다. 어서션은 전부 통과한 상태였다).
#   판정 근거 2중: maestro가 null 반환 + `adb exec-out screencap -p` 결과가 **0바이트**.
#   → 이 세 화면은 **스크린샷 없이 요소 assert만으로** 증적을 남긴다([[feedback_flagsecure_verify]]).
#   ※ 텔레콤 홈(`ActivityTelecomHome`)과 CS 팝업은 secure가 아니라 스크린샷이 정상 동작한다.
#   ※ `uiautomator dump`는 secure 화면에서도 읽히므로 셀렉터 조사는 그대로 할 수 있다.
#
# ⚠️ **1회 관찰: 텔레콤 홈에서 스피너가 1.5분 이상 멈춰 있었다 (2026-08-19)**
#   ※ **원인은 확정되지 않았다.** 그 시점에 세션이 만료 상태였고(잠금화면 다이얼로그로 확인)
#     재로그인 후 같은 화면이 정상 로드된 것까지가 관찰된 사실이다 — **상관관계이지 인과가 아니다.**
#     사이에 앱 force-stop/재실행과 시간 경과가 끼어 있어, 텔레콤 API 일시 지연이 저절로
#     회복된 것으로도 같은 결과가 나온다. 2026-08-20 수동 진입 시에는 재현되지 않았다.
#   → 재발하면 **logcat으로 진입 API 응답을 확인해 확정할 것**
#     (401/토큰 만료면 세션 원인 확정, 타임아웃만 찍히면 서버 지연).
#   발생 위치는 **텔레콤 홈 `ActivityTelecomHome` 진입 직후**다. 스피너 다이얼로그가 최상위
#   윈도우를 잡아 `uiautomator dump`가 **`imageView`(스피너) 하나만** 반환하고
#   `leftlayout`/`contactus`를 하나도 읽을 수 없다.
#   ⚠️ **"상품이 없어서 목록이 비어 있는 것"과 혼동하지 말 것 — 다른 화면이다.**
#     빈 목록은 요금제 목록 페이지의 `noDataAvailable`("내역 없음")로 **정상 렌더링**된다
#     (덤프에 텍스트까지 다 나온다). 그 화면은 `leftlayout` → `applylinesimlayout`을
#     두 번 더 탭해야 나오므로, 스피너가 걸린 상태에서는 **도달조차 못 한다.**
#   네트워크 문제로 오진하기도 쉽다(기기 ping 8.8.8.8/google.com은 정상이었다)
#   → **먼저 세션을 의심할 것.** 잠금화면에 "로그인 세션이 만료되었습니다" 바텀시트가 떠 있었고,
#     `btnOk` → 01_01_Login_Success_old.yaml 재로그인 후 같은 화면이 즉시 정상 로드됐다.
#   ※ 세션 만료 자체는 **하루 단위로 재발**하는 것이 확인됐다(2026-08-19 복구 → 2026-08-20 또 만료).
#     만료 상태에서는 진입 블록의 `btnTransfer` 어서션이 FAILED로 죽는다(이건 재현 확실).
#     상세: [[feedback_session_expiry_recovery]]
#
# ---------------------------------------------------------------
# 🚫 BLOCKED: [06][07] — 신청 완료 단계에 **외부 인증**이 있다 (2026-09-03 사유 변경)
# ---------------------------------------------------------------
#   종전 사유는 **상품 데이터 부재**였다(2026-07-09, 2026-08-19 재확인 — 목록이 `noDataAvailable`).
#   **2026-09-03 상품이 등록되어 그 사유는 해소됐다.**
#   대신 신청 프로세스를 확인해 보니 **중간에 외부 인증이 있어 자동화로 신청을 완료할 수 없다**
#   (사용자 확인). 데이터가 생기면 풀리는 종류가 아니라 **경로 자체의 제약 = 영구적 자동화 불가**다.
#   → [06][07]은 **수동 테스트 대상**으로 남긴다.
#
#   ⚠️ **선불(Pre-paid)도 같은 제약이다** (2026-09-14 추가).
#     현재 선불 목록은 비어 있지만, 상품이 등록돼도 신청은 **같은 외부 인증**에 막혀 완주할 수 없다.
#     즉 데이터가 생겨도 자동화 범위는 **"요금제 목록 페이지 도달"까지**다.
#     → 그래서 [04]의 선불 블록은 빈 목록/상품 목록 **둘 다 통과**하도록 써 뒀다
#       (상품이 등록돼도 파일 수정 없이 그대로 돈다).
#
#   ⚠️ **[05]는 사유가 달랐다** — "선택할 상품이 없다"였고 **상품 등록으로 해소됐다.**
#     신청까지 가지 않고 New/Same Number 페이지 도달만 확인하므로 **자동화 가능하다.**
#     → BLOCKED가 아니라 **재작업 대상**이다(아래 [05] 절의 셀렉터로 구현 + 실기기 검증 필요).
#
# ClickUp 상태: 18 Telecom — [01]~[05],[08] 커버 / [06][07] BLOCKED(외부 인증, 부분완료로 표기)
#   ⚠️ "ClickUp:" 으로 시작하면 리포트 스크립트가 **커버 완료 마커로 오인**한다
#     (`# CLICKUP:` 파서가 대소문자를 가리지 않는다) → 산문 주석은 "ClickUp 상태:" 로 쓴다.
#   ※ 2026-08-19 ClickUp API 레이트 리밋으로 상태 갱신 못 함 → 해제 후 처리.
#
# 케이스:
#   [01] [Low]    GME Mobile - 홈화면 이동 확인
#   [02] [Low]    GME Mobile - CS 팝업 발생 확인 (Contact us)
#   [03] [Medium] GME Mobile - Mobile SIM 선택 시 요금제 선택 페이지 발생 확인
#   [04] [Medium] GME Mobile - Line SIM / 선불 SIM 선택 시 요금제 목록 발생 확인
#   [05] [Medium] ⏸ 재작업 대상 — 임의 요금제 선택 → New/Same Number 페이지 (상품 등록으로 해소)
#   [06] [High]   🚫 BLOCKED — New Number 신청 (외부 인증)
#   [07] [High]   🚫 BLOCKED — Same Number 신청 (외부 인증)
#   [08] [High]   GME Mobile - 사용량 확인 → 신청한 유심 정보 노출
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\18_Telecom_old.yaml"
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 ----------------
- launchApp
- extendedWaitUntil:
    visible:
      text: "Server Override|4자리 숫자를 입력하세요|홈으로"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            text: "4자리 숫자를 입력하세요|홈으로"
          timeout: 60000
# PIN <정상 PIN> — 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수(오입력 누적 = 계정 잠금)
- runFlow:
    when:
      visible:
        text: "4자리 숫자를 입력하세요"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "보이스 피싱 주의"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "나중에 하기"
    commands:
      - tapOn: "나중에 하기"
      - waitForAnimationToEnd
# 인앱 배너 팝업은 id로 정확히 닫는다(범용 "닫기" 문자열 탭은 다른 X를 눌러 사고 이력이 있다)
- runFlow:
    when:
      visible:
        # ⚠️ 인앱 배너 닫기 id는 **빌드마다 다르다**(2026-08-27 실측):
        #   7.19.x = `btnTwo` / **7.20.0 = `btnClose`**(+ `btnDontShowToday` "오늘 하루 보지 않기").
        #   Maestro id는 정규식이라 둘을 함께 받는다. 배너가 홈 요소를 덮어
        #   `btnTransfer` assert가 실패하는 사고가 있었다.
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 30000

# ----------------------------------------------------------------
# [01] [Low] GME Mobile - 홈화면 이동 확인
# ----------------------------------------------------------------
# 홈 서비스 그리드는 비동기 로딩이다 → scrollUntilVisible로 항목이 실제로 그려질 때까지 기다린다.
- scrollUntilVisible:
    element:
      text: "통신 서비스"
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 20
- tapOn: "통신 서비스"
# 세션이 살아 있어야 로드된다(헤더의 무한 로딩 주석 참고). 넉넉히 기다린다.
- extendedWaitUntil:
    visible:
      id: "contactus"
    timeout: 60000
- assertVisible: "GME 텔레콤"
- assertVisible:
    id: "homebutton"
- takeScreenshot: "[01-1]_텔레콤홈_진입"

# 상단 홈 아이콘 → 홈화면 즉시 이동
- tapOn:
    id: "homebutton"
- waitForAnimationToEnd
# 홈 재진입 시 인앱 배너가 다시 뜰 수 있다
- runFlow:
    when:
      visible:
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 30000
- assertVisible:
    id: "bottom_item_home"
- takeScreenshot: "[01-2]_홈복귀_확인"

# ----------------------------------------------------------------
# [02] [Low] GME Mobile - CS 팝업 발생 확인 (Contact us)
# ----------------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "통신 서비스"
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 20
- tapOn: "통신 서비스"
- extendedWaitUntil:
    visible:
      id: "contactus"
    timeout: 60000
- tapOn:
    id: "contactus"
- extendedWaitUntil:
    visible:
      id: "btnCancel"
    timeout: 20000
# 앱 문구의 "궁금한"은 오타지만 실제 텍스트다 — 고쳐 쓰면 매칭이 깨진다.
# 텍스트는 전체매칭이므로 부분 확인엔 .* 를 붙인다([[feedback_maestro_regex_yaml]]).
- assertVisible: ".*궁금한 점이 있으신가요.*"
- assertVisible:
    id: "chatView"
- assertVisible: "실시간 채팅"
- takeScreenshot: "[02-1]_CS팝업_노출"
# 🚫 `chatView`(실시간 채팅)는 누르지 않는다 — 실제 상담 채널이 열린다. 취소로 닫는다.
- tapOn:
    id: "btnCancel"
- extendedWaitUntil:
    visible:
      id: "contactus"
    timeout: 20000
- takeScreenshot: "[02-2]_CS팝업_취소"

# ----------------------------------------------------------------
# [03] [Medium] GME Mobile - Mobile SIM 선택 시 요금제 선택 페이지 발생 확인
# ----------------------------------------------------------------
# 카드는 구 UI에 id가 있다 → 텍스트("Mobile SIM")보다 id로 잡는다.
# ⚠️ "Mobile SIM"은 카드 라벨(`lefttextview`)과 다음 화면 제목(`screenTitle`)에 **둘 다** 있다.
#   텍스트로 잡으면 어느 쪽에 걸렸는지 알 수 없어 도달 판정이 흐려진다.
- tapOn:
    id: "leftlayout"
- extendedWaitUntil:
    visible:
      id: "applylinesimlayout"
    timeout: 30000
- assertVisible: "원하는 요금제를 선택해 주세요."
- assertVisible:
    id: "applyprepaidsimlayout"
- assertVisible:
    id: "chedkmynumerlayout"
# 2026-09-03 라벨 변경: "Line SIM 요금제" -> "후불 SIM 요금제 신청하기"
#   id는 `non_face_to_face_delivery_address_title`인데 **다음 화면에서 "새 번호"로도 쓰이는 id**라
#   단독 판정은 위험하다. 컨테이너 id `applylinesimlayout`는 위에서 이미 단언했다.
- assertVisible: "후불 SIM 요금제 신청하기"
- assertVisible: "선불 SIM 신청"
- assertVisible: "GME Mobile 사용량 확인"
# 🚫 FLAG_SECURE 화면 — takeScreenshot 금지(헤더 주석). 위 어서션이 증적이다.

# ----------------------------------------------------------------
# [04] [Medium] GME Mobile - Line SIM / 선불 SIM 선택 시 요금제 목록 발생 확인
# ----------------------------------------------------------------
# 2026-09-03: **후불(Line SIM)에 상품이 등록됐다** -> 종전 `noDataAvailable`/"내역 없음" 단언은 실패한다.
#   선불(prepaid)은 **여전히 비어 있다**(2026-09-14 기준) -> 아래 둘째 블록에서 다룬다.
#   ⚠️ 선불도 언제든 상품이 등록될 수 있다 -> 둘째 블록은 **빈 목록/상품 목록 둘 다 통과**하게 써 뒀다.
#     (신청 자체는 상품이 생겨도 외부 인증 때문에 자동화 불가 - [06][07]과 같다.)
#   금액·상품명은 상품이 바뀌면 달라지므로 **텍스트로 잡지 않고 id로** 존재만 단언한다.
- tapOn:
    id: "applylinesimlayout"
- extendedWaitUntil:
    visible:
      id: "packagelistRv"
    timeout: 30000
- assertVisible: "LG U\\+ 패키지"
- assertVisible: "원하는 요금제를 선택해 주세요."
# 최소 1개 상품이 있어야 성립한다(빈 목록이면 여기서 실패한다)
- assertVisible:
    id: "item_monthlypayment"
- assertVisible:
    id: "payment_title_textview"
- assertNotVisible:
    id: "noDataAvailable"
# 🚫 FLAG_SECURE 화면 — 스크린샷 대신 어서션으로 남긴다.
- tapOn:
    id: "btnBack"
- extendedWaitUntil:
    visible:
      id: "applyprepaidsimlayout"
    timeout: 20000

# 선불 SIM 신청 -> 같은 "LG U+ 패키지" 목록으로 간다.
#   2026-09-14 기준 **선불은 아직 상품이 없다**(2026-09-03 실측 이후 변동 없음).
#   ⚠️ 그렇다고 "비어 있음"을 하드 단언하면 **상품이 등록되는 순간 이 케이스가 깨진다**
#     - 후불(Line SIM)이 2026-09-03에 실제로 그렇게 깨졌다.
#     → 빈 목록/상품 목록 **둘 다 통과**하도록 둔다. 이 케이스의 성립 조건은
#       "선불도 같은 요금제 목록 페이지로 간다"이지 "목록이 비어 있다"가 아니다.
#   ⛔ 상품이 생겨도 **여기서 더 진행하지 않는다.** 선불 신청도 완료 단계에 외부 인증이 있어
#     자동화로 완주할 수 없다([06][07]과 같은 제약) → 신청 동작은 수동 테스트 대상이다.
- tapOn:
    id: "applyprepaidsimlayout"
# 결과 도달을 먼저 강제한다 - 빈 목록(noDataAvailable)이든 상품 목록(packagelistRv)이든 하나는 뜬다.
#   조건부만 두면 아무것도 안 떠도 통과하므로(거짓 통과) 도달은 조건과 무관하게 강제한다.
- extendedWaitUntil:
    visible:
      id: "noDataAvailable|packagelistRv"
    timeout: 30000
- assertVisible: "LG U\\+ 패키지"
# 갈래 A - 상품 없음(현재 상태): 빈 상태 문구가 정상 렌더링되는지 확인한다.
- runFlow:
    when:
      visible:
        id: "noDataAvailable"
    commands:
      - assertVisible: "내역 없음"
# 갈래 B - 상품이 등록된 뒤: 후불 블록과 같은 형태로 **id로 존재만** 단언한다.
#   금액·상품명은 상품이 바뀌면 달라지므로 텍스트로 잡지 않는다.
- runFlow:
    when:
      notVisible:
        id: "noDataAvailable"
    commands:
      - assertVisible: "원하는 요금제를 선택해 주세요."
      - assertVisible:
          id: "item_monthlypayment"
      - assertVisible:
          id: "payment_title_textview"
# 🚫 FLAG_SECURE 화면 — 스크린샷 대신 어서션으로 남긴다.
- tapOn:
    id: "btnBack"
- extendedWaitUntil:
    visible:
      id: "chedkmynumerlayout"
    timeout: 20000

# ----------------------------------------------------------------
# [05] [Medium] 임의 요금제 선택 -> New Number / Same Number 페이지
# ----------------------------------------------------------------
# 2026-09-03 구현(BLOCKED 해제). 종전 사유 "요금제 목록 비어 있음"이 상품 등록으로 해소됐다.
# 신청까지 가지 않고 **페이지 도달만** 확인하므로 [06][07]의 외부 인증 제약과 무관하다.
#
# 실측 경로: 후불 목록 -> 요금제 탭 -> **GME Telecom 서비스 이용약관 바텀시트** -> 확인 -> 신청 페이지
#   ⚠️ 요금제를 누르면 곧바로 신청 페이지가 아니라 **약관 바텀시트가 먼저** 뜬다.
#     2026-09-03 실측: **동의해도 다음 실행에서 또 뜬다**(1·2회차 모두 노출).
#     "최초 1회만 뜬다"고 적었던 종전 주석은 틀렸다. 그래도 **조건부로** 처리하고
#     결과 도달은 조건과 무관하게 강제한다 - 앱이 언제 건너뛸지 알 수 없고,
#     조건부만 두면 아무것도 안 떠도 통과하기 때문이다.
#   ⚠️ 신청 페이지 라벨은 한글이다 - "New Number"/"Same Number"가 아니라 **"새 번호"/"동일한 번호"**.
#     텍스트는 전체매칭이라 영문으로 잡으면 조용히 SKIP된다 -> **id로 판정한다.**
#   ⛔ 여기서 더 진행하지 않는다. 신청 완료([06][07])는 **중간에 외부 인증**이 있어 자동화 불가다.
- tapOn:
    id: "applylinesimlayout"
- extendedWaitUntil:
    visible:
      id: "item_monthlypayment"
    timeout: 30000
- tapOn:
    id: "item_monthlypayment"
    index: 0
# 약관 동의 바텀시트 - 최초 1회만 뜬다
- runFlow:
    when:
      visible:
        id: "agreeAllContainer"
    commands:
      - assertVisible: "모두 동의합니다"
      - tapOn:
          id: "agreeAllContainer"
      - waitForAnimationToEnd
      - tapOn:
          id: "btnConfirm"
      - waitForAnimationToEnd
# 신청 페이지 도달을 강제한다
- extendedWaitUntil:
    visible:
      id: "new_number_usim_layout"
    timeout: 30000
- assertVisible:
    id: "sameNumberSimLayout"
- assertVisible: "회선 심(sim) 신청하기"
- assertVisible: "새 번호"
- assertVisible: "동일한 번호"
# 🚫 FLAG_SECURE 화면 - takeScreenshot 금지. 위 어서션이 증적이다.
# 복귀: 신청 페이지 -> 요금제 목록 -> 요금제 선택 페이지
- tapOn:
    id: "btnBack"
- extendedWaitUntil:
    visible:
      id: "item_monthlypayment"
    timeout: 20000
- tapOn:
    id: "btnBack"
- extendedWaitUntil:
    visible:
      id: "chedkmynumerlayout"
    timeout: 20000

# ----------------------------------------------------------------
# [06] [High] 🚫 BLOCKED — New Number 상품 요금제 정상신청 동작 확인
# ----------------------------------------------------------------
# 사유(2026-09-03 변경): **신청 프로세스 중간에 외부 인증이 있어 자동화로 완료할 수 없다**(사용자 확인).
#   종전 사유 "상품 미등록"은 해소됐으나, 이건 데이터가 아니라 **경로 자체의 제약**이라 풀리지 않는다.
#   ⚠️ 실제 유심 신청이 발생하는 플로우다(현재 신청 이력이 [08]에 "처리중"으로 남아 있다).
#   → 수동 테스트 대상.
#
# ⚠️ 아래 CLICKUP-PARTIAL 은 **BLOCKED 표기용 대용**이다(2026-09-07).
#   ClickUp 리스트(901818254784)에는 to do / in progress / partially completed / complete 넷뿐이라
#   BLOCKED 를 담을 상태가 없다. to do 로 두면 데일리 리포트에서 **미착수와 구분되지 않아**
#   "아직 안 한 것"으로 읽힌다 → 사유가 함께 실리는 partially completed 로 올린다.
#   ⛔ 사유 문구에서 **미검증**임을 반드시 밝힌다. 안 그러면 과대 보고다.
# CLICKUP-PARTIAL: z8nfn6ma7m | 🚫 자동화 불가(BLOCKED) - 신청 완료 단계의 외부 인증(간편인증)으로 완주 불가. 진입 경로는 [05]에서만 확인했고 신청 동작 자체는 미검증 → 수동 테스트 대상

# ----------------------------------------------------------------
# [07] [High] 🚫 BLOCKED — Same Number 상품 요금제 정상신청 동작 확인
# ----------------------------------------------------------------
# 사유: [06]과 같다(**외부 인증**으로 신청 완료 불가). 기존 번호 입력 단계가 추가된다는 점만 다르다.
#   → 수동 테스트 대상. CLICKUP-PARTIAL 을 쓰는 이유는 [06] 주석 참조.
# CLICKUP-PARTIAL: z8nfn6ma7n | 🚫 자동화 불가(BLOCKED) - 신청 완료 단계의 외부 인증(간편인증)으로 완주 불가. 기존 번호 입력 단계만 [06]과 다르다. 신청 동작 자체는 미검증 → 수동 테스트 대상

# ----------------------------------------------------------------
# [08] [High] GME Mobile - 사용량 확인 → 신청한 유심 정보 노출
# ----------------------------------------------------------------
- tapOn:
    id: "chedkmynumerlayout"
- extendedWaitUntil:
    visible:
      id: "listview"
    timeout: 30000
- assertVisible: "사용 가능한 번호"
# 항목 구성: 상태 + 신청일. 날짜·건수는 계정 이력에 따라 달라지므로 **패턴으로** 본다.
- assertVisible:
    id: "status_titleTxt"
- assertVisible: ".*Applied date.*"
- assertVisible: "등록 취소|처리중"
# 🚫 FLAG_SECURE 화면 — 스크린샷 대신 어서션으로 남긴다.

# ---------------- 홈 복귀 ----------------
# 사용량 확인 → btnBack으로 요금제 선택 페이지 → 다시 btnBack으로 텔레콤 홈 → homebutton으로 홈
- tapOn:
    id: "btnBack"
- extendedWaitUntil:
    visible:
      id: "applylinesimlayout"
    timeout: 20000
- tapOn:
    id: "btnBack"
- extendedWaitUntil:
    visible:
      id: "homebutton"
    timeout: 30000
- tapOn:
    id: "homebutton"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 30000
