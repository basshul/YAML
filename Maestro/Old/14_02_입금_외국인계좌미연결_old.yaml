appId: ${APP_ID}
---

# ================================================================
# 시나리오: Deposit — **계정별 분리본 2/3 (test123 / 외국인·은행계좌 미연결)**
# ================================================================
# 원본 `14_입금_분할전원본_old.yaml`(1845줄)은 3계정을 오가느라 1회 실행이 너무 길어
# 2026-08-26 사용자 지시로 **계정별 3개 파일로 분리**했다. 각 파일은
#   공통 진입(앱 실행 → PIN <정상 PIN> → 홈) + 해당 계정 로그인 + 그 계정 케이스
# 만 담고 있어 독립 실행 가능하다.
#   - 14_01_입금_한국인계좌연결_old.yaml : [01]~[05] [08] [25]~[27]
#   - 14_02_입금_외국인계좌미연결_old.yaml     : [06] [07] [09] [14]~[24] [28]~[35]  ← Store Deposit 전부
#   - 14_03_입금_GMEPay가상계좌_old.yaml  : [10]~[13] + seungsoo818 원복
# ⚠️ 케이스는 **번호순이 아니다**(계정 묶음 순). 원본은 참고용으로 남겨둔다.
# ⚠️ 이 파일은 **test123으로 끝난다**. 다른 플로우는 seungsoo818을 전제하므로,
# 단독 실행 후에는 `14_03`을 이어 돌리거나 `01_01_로그인_정상_old.yaml`로 원복할 것.
# ================================================================
# ================================================================
# 시나리오: Deposit
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 (구 UI 표준 블록) ----------------
# ⚠️ 개편UI판의 `notVisible: text "Home"` 가드는 launchApp 직후 잠깐 보이는 **캐시된 홈**에
#   매칭돼 PIN 입력을 건너뛰고 잠금화면에 갇히는 사고 이력이 있다 → 잠금화면을 명시적으로 대기한다.
- launchApp
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|button1|securityKeyboardEditText"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ LIVETEST 강제 — 판별이 불가능해 항등 시퀀스로 간다. 상세: docs/ENVIRONMENT.md §7.3
      - tapOn:
          text: "${SERVER_PICK}"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            # ⚠️ 대안 목록에 PIN 생성 화면을 **반드시 같이** 넣어야 한다 — 빠뜨리면
            #   대상도 배너도 안 보여 그냥 타임아웃된다(2026-08-25 실제 실패).
            id: "input_dot_1|bottom_item_home|securityKeyboardEditText"
          timeout: 60000
# 자동 로그아웃(세션 10분 만료)으로 재인증 화면에 떨어졌으면 비밀번호로 로그인한다
- runFlow: "_relogin_if_autologout_old.yaml"
# PIN <정상 PIN> — 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수(오입력 누적 = 계정 잠금)
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
# ⚠️ 이전 실행이 `loginpwidhidpass` 경로(= 기존 PIN 해지)로 끝났으면 계정에 PIN이 없어
#   잠금화면 대신 "앱에서 사용할 간편 비밀번호를 생성해 주세요"가 뜬다 → <정상 PIN>로 재등록한다.
#   (2026-08-25: 실제로 이 상태로 남아 다음 실행 진입이 타임아웃으로 죽었다)
- runFlow:
    when:
      visible: "${LOCK_CREATE_PROMPT}"
    commands:
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
      - runFlow:
          when:
            visible:
              id: "btnOk"
          commands:
            - tapOn:
                id: "btnOk"
            - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
# 인앱 배너 팝업은 id로 정확히 닫는다(범용 "닫기" 문자열 탭은 다른 X를 눌러 사고 이력이 있다)
- runFlow:
    when:
      visible:
        # ⚠️ 배너 닫기 id는 빌드마다 다르다 — btnTwo(7.19.x) | btnClose(7.20.0). docs/ENVIRONMENT.md §7.6
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# 구 UI는 로그아웃이 **프로필 탭에 없고 드로어에만** 있다 → `iv_nav`로 드로어를 연다.
#   드로어 항목에는 resource-id가 없어 텍스트로만 탭할 수 있다.
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "${REG_LOGOUT}"
    direction: DOWN
    timeout: 15000
- tapOn: "${REG_LOGOUT}"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_LOGOUT_CONFIRM}"
    commands:
      - tapOn: "${REG_LOGOUT_CONFIRM}"
      - waitForAnimationToEnd
# ⚠️ **구 UI는 로그아웃 후 ID/비밀번호 폼이 아니라 PIN 잠금화면(`ActivityLockScreen`)으로 떨어진다**
#   (2026-08-25 실측. 개편UI판은 곧바로 `usernameId` 폼을 전제해 여기서 FAILED로 죽었다).
#   `loginpwidhidpass`("아이디/비밀번호로 로그인")를 타야 `LoginV2Activity`로 간다.
#   그때 "ID와 비밀번호로 로그인하면 기존 간편 비밀번호는 해지됩니다" 확인 다이얼로그가 뜬다
#   → `btn_diaog_ok`("예"). ⚠️ id에 앱 오타가 있다(`diaog`) — `dialog`가 아니다.
#   ※ 이 경로로 들어가면 **기존 PIN이 해지**되므로 아래 간편비밀번호 재설정 블록이 실제로 동작한다.
- runFlow:
    when:
      visible:
        id: "loginpwidhidpass"
    commands:
      - tapOn:
          id: "loginpwidhidpass"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: "btn_diaog_ok"
          commands:
            - tapOn:
                id: "btn_diaog_ok"
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "usernameId"
    timeout: 30000
- tapOn:
    id: "usernameId"
- eraseText: 50
- inputText: "test123"
- tapOn:
    id: "securityKeyboardEditText"
# ⚠️ **비밀번호가 계정마다 다르다** (2026-09-30 사용자 재확인 — 2026-09-09 기록은 뒤바뀐 값이었다):
#   test123 = <정상 비밀번호> / test251024 = <다른 정상 비밀번호>. 여기는 test123 용 시퀀스다.
#   값은 적지 않는다(정본은 메모리 [[project_01_login]]).
#   로그인 실패는 **5회 제한**이라 잘못된 값으로 돌리면 계정이 잠긴다. 값이 바뀌면 여기부터 고칠 것
#   ([[project_01_login]] 이 정본이다. 저장소 md 에는 값을 적지 않는다).
# ⚠️ 대문자 전환은 **조건부**로 한다 — 이미 대문자 상태에서 누르면 소문자로 바뀌어 오입력이 된다.
- runFlow:
    when:
      notVisible:
        text: "Capital G 히읃"
    commands:
      - tapOn: "대문자 키보드 변경"
      - waitForAnimationToEnd
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "1"
- tapOn: "2"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "${TRANSKEY_INPUT_COMPLETE}"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "${FINGERPRINT_AUTH_PROMPT_TITLE_TEXT}"
    commands:
      - tapOn: "${REG_LATER}"
      - waitForAnimationToEnd
- runFlow:
    when:
      # ⚠️ Maestro 텍스트는 **전체매칭**이라 `"간편비밀번호"`는 실제 문구
      #   "앱에서 사용할 간편 비밀번호를 생성해 주세요"에 **매칭되지 않는다**
      #   → 이 블록이 SKIP되고 PIN 생성 화면에 갇혀 홈 판정이 죽었다(2026-08-25 실제 실패).
      #   부분매칭 정규식으로 바꾼다([[project_01_login]], [[feedback_maestro_regex_yaml]]).
      #   ※ `loginpwidhidpass` 경로로 로그인하면 기존 PIN이 해지되므로 이 화면은 **반드시 뜬다**.
      visible: "${LOCK_CREATE_PROMPT}"
    commands:
      # PIN <정상 PIN>를 두 번(생성 → 확인). 키패드가 탭마다 재배치되므로 탭 사이 정착 대기 필수
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
      - tapOn:
          id: "btnOk"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
# ⚠️ **로그인 직후 팝업은 한 박자 늦게, 그리고 여러 개가 순서대로 뜬다.**
#   2026-09-09 실측(test123 / SM-S911N): "나중에 하기" 조건을 평가한 뒤에야
#   **"증빙 서류 안내"(문서가 만료되었습니다) 바텀시트**가 떠서 홈을 덮었고,
#   `bottom_item_home` 대기가 그대로 실패했다.
#   → 단발 조건이 아니라 **홈이 보일 때까지 반복해서 닫는다.**
#   ⚠️ 인앱 배너는 **id로 정확히** 닫는다. 범용 `"닫기"` 탭은 엉뚱한 X를 눌러
#     **앱이 런처로 빠져나가는** 사고를 낸 적이 있다(2026-08-25).
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible:
              id: "bottom_item_home"
          commands:
            - runFlow:
                when:
                  visible: "${ASK_ME_LATER_TEXT}"
                commands:
                  - tapOn: "${ASK_ME_LATER_TEXT}"
                  - waitForAnimationToEnd
            - runFlow:
                when:
                  visible:
                    id: "remindLaterBtn"
                commands:
                  - tapOn:
                      id: "remindLaterBtn"
                  - waitForAnimationToEnd
            - runFlow:
                when:
                  visible:
                    id: "btnTwo|btnClose"
                commands:
                  - tapOn:
                      id: "btnTwo|btnClose"
                  - waitForAnimationToEnd
            - waitForAnimationToEnd
# ⚠️ **홈 팝업은 큐로, 그리고 뒤늦게 뜬다**(이 파일 [29] 주석에도 같은 현상이 적혀 있다).
#   바로 위 루프는 `waitForAnimationToEnd` 뿐이라 **배너가 뜨기 전에 4회를 다 돌고 끝난다** —
#   2026-10-14 실측: 루프 4회 전부 SKIPPED → 직후 `singleBanner`(`btnClose`)가 홈을 덮어
#   아래 홈 대기가 30초 타임아웃으로 죽었다.
#   → 늦게 뜨는 배너를 **한 번 더** 기다렸다가 정리한다. optional 이라 안 뜨면 무해하다.
- runFlow: "_dismiss_popups_late_stag_old.yaml"
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000
# [06]~[10] 전체 BLOCKED 처리(단순 계정 속성 문제가 아니라 기능 자체 미확인).
#
# 재확인(2026-07-14): [01]에서 "GMEPay 가상 계좌" 배너가 외국인 계정에서만
# 노출된다는 사실이 확인되어, "Easy Wallet" 배너도 동일하게 계정 속성에 따라
# 숨겨져 있을 가능성을 의심하고 Home 화면 전체(최상단~최하단)를 다시 스크롤하며
# 재조사함. 결과: "Easy Wallet"/"이지월렛" 관련 텍스트나 배너는 Home 화면
# 어디에도 존재하지 않음.
#
# 사용자 재구성 지시(2026-07-14): [06]은 "GMEPay 가상 계좌" 배너의 노출
# 유무 확인 케이스, [07]은 배너 선택(탭) 확인 케이스로 정리하기로 함. [06]을
# 제대로 검증하려면 (1)외국인 계정 (2)GMEPay Deposit 미신청 계정, 두 조건이
# 동시에 필요한데 현재 QA 테스트 계정은 이를 만족하지 않아 확인 불가 - 사용자가
# 조건을 만족하는 다른 계정으로 로그인 후 알려주기로 함(작업 보류 중).
# 그 사이 아래에 있던 탭+진입확인 코드(배너 선택 시 "가상 계좌 입금" 타이틀
# 노출 확인)는 실제로는 [08]에 해당한다고 판단되어 [08]로 이동함.

# ----------------------------------------------------------------
# [28] [High] Store Deposit - Request - Deposit 금액 입력 및 Confirm 동작 확인
# CLICKUP: z8nfn6macf
#            - Amount 금액 미입력 시 Confirm 버튼 비활성화 확인
# ----------------------------------------------------------------
# 참고: 실기기 확인 결과 버튼에는 별도 resource-id가 없어(단순 텍스트 "확인")
# 비활성화 상태를 id로 직접 검증할 수 없음 - 대신 금액 미입력 시 노출되는
# 빨간 안내 문구("수취 금액을 입력하세요")의 노출 여부로 검증.
# ⚠️ 홈으로 돌아온 직후엔 **배너가 뒤늦게 떠 홈을 덮는다**(2026-10-14 실측: 여기서 두 번 죽었다).
#   헬퍼는 `repeat while visible` 이라 그 순간 팝업이 없으면 통째로 SKIP 되므로,
#   **먼저 기다렸다가** 부른다. optional 이라 배너가 안 뜨면 무해하다.
- runFlow: "_dismiss_popups_late_stag_old.yaml"
# ⚠️ 홈은 **스크롤 위치를 유지**한다 → 상단 카드의 `txvDepositOrViewStatement`("입금")가
#   화면 밖일 수 있으므로 탭 전에 UP 스크롤로 끌어올린다(2026-08-25 실제 FAILED로 확인).
- scrollUntilVisible:
    element:
      id: "txvDepositOrViewStatement"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- tapOn:
    id: "txvDepositOrViewStatement"
- waitForAnimationToEnd
# 타일 탭 전에 "입금 서비스" 화면 도달을 명시적으로 기다린다(방어적 대기).
#   ※ 2026-08-25에 이 지점이 "Element not found"로 실패한 적이 있는데, 원인은 비동기 로딩이
#     아니라 **실행 중 기기에서 알림 패널을 내려 화면을 덮은 것**이었다(사용자 확인).
#     ⚠️ 이런 사고는 셀렉터 버그처럼 보이므로 오진하기 쉽다 — 실행 중에는 기기를 만지지 말 것.
- extendedWaitUntil:
    visible:
      text: "${DEPOSIT_SERVICE}"
    timeout: 30000
- tapOn: "${CONVENIENCE_STORE_TEXT}"
- waitForAnimationToEnd
- assertVisible: "${POSSIBLE_STORE}"
- tapOn:
    id: "amountFormInputField"
- eraseText: 10
- assertVisible: "${RECEIVING_AMOUNT_ERROR}"
# ⚠️ **숫자 키패드가 금액 퀵칩("10,000 KRW")을 덮는다** — 2026-09-09 SM-S911N(2340px) 실측:
#   칩이 계층에 안 잡혀 `Element not found` 로 죽었다(구 기기에서는 키패드 위로 보였다).
#   → 입력 직후라 키패드가 확실히 올라와 있으므로 여기서 닫는 건 안전하다
#     (`hideKeyboard` 는 키패드가 없을 때 뒤로가기로 동작한다 — 그래서 위치가 중요하다).
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "10,000 KRW"
- assertNotVisible: "${RECEIVING_AMOUNT_ERROR}"
# 정정(2026-07-16): 금액 입력 필드를 탭하면 뜬 숫자 키패드가 [30]의
# how_to_deposit("?" 도움말, 좌하단 [39,1564] 위치) 버튼을 가려 [30]에서
# "Element not found: how_to_deposit" 실패가 발생함(실기기 재현). "10,000
# KRW" 버튼을 눌러도 키패드는 그대로 떠 있으므로 back으로 닫음 - 이 시점엔
# 항상 키패드가 떠있어 back은 화면 네비게이션이 아닌 키패드 닫기로만 동작함.
#   ⚠️ 2026-09-09 보강: 위에서 이미 키패드를 내렸을 수 있다. 키패드가 없을 때 back 을 누르면
#     **화면을 벗어난다** → 도움말 버튼(`how_to_deposit`)이 안 보일 때(=키패드가 덮고 있을 때)만 누른다.
- runFlow:
    when:
      notVisible:
        id: "how_to_deposit"
    commands:
      - pressKey: back
      - waitForAnimationToEnd

# ★ 뒤따르던 [30]~[35] 가 홈으로 돌려놓던 자리다(2026-10-28 제거).
#   [29] 가 홈에서 `txvDepositOrViewStatement` 를 찾아 시작하므로 여기서 되돌린다.
#   관용구는 이 파일의 기존 복귀 블록과 같다.
- repeat:
    times: 4
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_home"

# ================================================================
# ⏸ [06][07][09] · [14]~[24] · [30]~[35] — 2026-10-28 제거 (실행 시간 단축)
# ================================================================
# 시트 기준 High 는 [28](Store Deposit 금액 입력·Confirm)·[29](Request 완료 표시) 둘뿐이다.
# 둘 다 `_dismiss_popups_late_stag` + `scrollUntilVisible: txvDepositOrViewStatement` 로
# **홈에서 자립 시작**해 앞 케이스에 기대지 않는다.
# ⚠️ 단 [28] 은 입금 화면에서 끝난다 — 홈 복귀는 [35] 끝에 있었다.
#   그래서 [28] 뒤에 복귀 블록을 직접 넣었다(04_01 과 같은 함정).
# ⚠️ 되살리기: git show 511c8c1:Maestro/Old/14_02_입금_외국인계좌미연결_old.yaml
# ================================================================

# ----------------------------------------------------------------
# [29] [High] Store Deposit - Request - Request 완료시 Barcode, Number, Deposit Amount, Time Limit이 표시됨
#            (실행 순서상 [Store Deposit] 섹션 맨 마지막에 배치 - 위 [29] 헤더의 실행 순서 참고 내용 확인)
# ----------------------------------------------------------------
# 주의: 실제 편의점 입금 요청이 생성됨(10,000 KRW, 10분 후 자동 만료/취소) -
# 실계좌 자금 이동 없음(섹션 상단 설명 참고). 이 케이스 이후에는 만료 전까지
# "편의점 입금" 재진입 시 신선한 입력 화면이 아닌 이 바코드 화면이 노출되므로,
# 이 파일에서 더 이상 "편의점 입금"에 재진입하는 케이스가 없도록(맨 마지막
# 배치) 주의할 것.
#
# 계정 참고(2026-07-15, 사용자 확인): Store Deposit(편의점 입금)도 ATM
# Deposit과 마찬가지로 외국인 전용 서비스임 - [28]/[30]~[35]는 화면 열람만
# 하는 케이스라 국적 무관하게 통과하지만, [29]는 실제 요청 생성(서버 검증)이라
# 한국인(seungsoo818) 계정으로는 "Currently, service is not available." 오류가
# 뜨는 것이 정상 동작임(버그 아님). 따라서 이 케이스만 test123(외국인)으로
# 전환 후 실행.
#
# 계정 전환: 로그아웃 → test123(외국인) 재로그인

# ⚠️ **홈 팝업은 큐로, 그리고 뒤늦게 뜬다.** 2026-09-09 실측(test123 / SM-S911N):
#   여기까지 250스텝을 진행한 뒤 **EASYCARE 인앱 배너**가 새로 떠서 홈을 덮었고
#   아래 스크롤이 25초 타임아웃으로 죽었다 → 스크롤 전에 팝업 큐를 비운다.
# ⚠️ 헬퍼는 `repeat while visible` 이라 **그 순간 팝업이 없으면 통째로 SKIP** 된다.
#   2026-10-14 실측: 헬퍼가 SKIP 된 직후 `singleBanner`(`btnClose`)가 홈을 덮어
#   아래 스크롤이 25초 타임아웃으로 죽었다 — 진입 블록에서 고친 것과 같은 경합이다.
#   → 늦게 뜨는 배너를 먼저 기다렸다가 헬퍼를 부른다. optional 이라 안 뜨면 무해하다.
- runFlow: "_dismiss_popups_late_stag_old.yaml"
# ⚠️ 홈은 **스크롤 위치를 유지**한다 → 상단 카드의 `txvDepositOrViewStatement`("입금")가
#   화면 밖일 수 있으므로 탭 전에 UP 스크롤로 끌어올린다(2026-08-25 실제 FAILED로 확인).
- scrollUntilVisible:
    element:
      id: "txvDepositOrViewStatement"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- tapOn:
    id: "txvDepositOrViewStatement"
- waitForAnimationToEnd
# 타일 탭 전에 "입금 서비스" 화면 도달을 명시적으로 기다린다(방어적 대기).
#   ※ 2026-08-25에 이 지점이 "Element not found"로 실패한 적이 있는데, 원인은 비동기 로딩이
#     아니라 **실행 중 기기에서 알림 패널을 내려 화면을 덮은 것**이었다(사용자 확인).
#     ⚠️ 이런 사고는 셀렉터 버그처럼 보이므로 오진하기 쉽다 — 실행 중에는 기기를 만지지 말 것.
- extendedWaitUntil:
    visible:
      text: "${DEPOSIT_SERVICE}"
    timeout: 30000
- tapOn: "${CONVENIENCE_STORE_TEXT}"
- waitForAnimationToEnd
- assertVisible: "${POSSIBLE_STORE}"
- tapOn: "${BTN_CONFIRM}"
- waitForAnimationToEnd
- assertVisible: "${APPLY_ATM}"
- tapOn:
    id: "apply_btn"
- waitForAnimationToEnd
- assertVisible: "${ENTER_THE_LOCK}"
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
- waitForAnimationToEnd
- assertVisible: "${PLEASE_MAKE_DEPOSIT}"
- assertVisible: "${APPLY_ATM_DEPOSIT_AMOUNT}"
- assertVisible: "${TIME_LIMIT_TEXT}"

# 홈 복귀
# ⚠️ 개편UI판은 `iv_back` 2탭으로 홈까지 나왔지만 구 UI에서는 실패한다 —
#   현장 입금 하위 화면 중 `iv_back`이 **없는 화면**이 있고(2026-08-25 [34] 이후 실측:
#   "Element not found: iv_back"), 구 UI는 "입금 서비스" 화면을 한 단 더 거치기 때문에
#   나와야 할 횟수도 다르다.
#   → 특정 back id에 의존하지 않고 **기기 back 키를 홈 하단 내비가 보일 때까지 반복**한다.
- repeat:
    times: 6
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

