appId: ${APP_ID}
---
# ================================================================
# 시나리오: MENU - History (거래/이력 내역)
# (04_Menu_remaining.yaml에서 분리, 2026-07-16)
# ================================================================

# 공통 설정 진입 헬퍼:
# launchApp → (앱은 실행 시마다 간편비밀번호 잠금) PIN <정상 PIN> → 팝업 닫기 → 홈 확인
# 주의(2026-07-22): launchApp 직후 캐시된 홈이 잠깐 보였다가 잠금화면이 뜨는 레이스가 있어
#   "홈 notVisible" 가드로는 PIN 입력을 건너뛰어 잠금화면에 갇힘. 잠금화면("4자리 숫자를
#   입력하세요")을 명시적으로 기다렸다가 PIN 입력하도록 변경. PIN 키패드는 매번 랜덤 배치라
#   좌표가 아닌 text("1"/"2")로 탭. PIN <정상 PIN>.

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 → 내역 탭 → 송금 ----------------
# ⚠️ 2026-08-18 구 UI로 교체. 개편UI 기준이던 아래 세 군데가 전부 깨져 있었다:
#   1) 홈 판정 `text: "홈"` → 구 UI 하단 내비 라벨은 **"홈으로"**다. Maestro 텍스트는 전체매칭이라
#      "홈"으로는 안 걸린다 → **id `btnTransfer`**로 판정한다.
#   2) 내역 탭 `text: "내역"` → 구 UI 라벨은 **"거래 내역"(공백 포함)** → **id `bottom_item_history`**.
#   3) 세션만료 처리 `OK → 홈` → 구 UI에서 세션이 만료되면 **초기 화면으로 떨어져 ID/비밀번호
#      재로그인이 필요하다**(PIN으로 복구 안 됨). 다이얼로그만 닫는 건 의미가 없어서,
#      뜨면 그대로 실패하게 두고 `01_01_Login_Success_old.yaml`로 복구한 뒤 재실행한다.
- launchApp
# ⚠️ **`waitForAnimationToEnd`만으로는 부족하다 (2026-08-19 실측)**
#   launchApp 직후엔 아직 스플래시라 아래 조건부 블록이 전부 SKIP되고 홈 판정에서 죽는다
#   (Server Override가 **늦게** 뜬다). 첫 화면이 실제로 그려질 때까지 명시적으로 기다린다.
#   세 갈래 중 하나가 반드시 온다: 서버선택 / 잠금화면 / (세션 살아있으면) 홈.
- extendedWaitUntil:
    visible:
      text: "Server Override|4자리 숫자를 입력하세요|홈으로"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # CONTINUE 후 잠금화면이 뜨는 데도 시간이 걸린다
      - extendedWaitUntil:
          visible:
            text: "4자리 숫자를 입력하세요|홈으로"
          timeout: 60000
# 잠금화면을 명시적으로 대기한 뒤 PIN 입력(캐시된 홈에 먼저 매칭되는 레이스 회피).
# 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수 — 오입력 누적은 계정 잠금이다.
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
# 인앱 배너 팝업은 id로 정확히 닫는다(범용 "닫기" 문자열 탭은 다른 X를 눌러 사고 이력이 있다)
- runFlow:
    when:
      visible:
        # ⚠️ 인앱 배너 닫기 id는 **빌드마다 다르다**(2026-08-27 실측):
        #   7.19.x = `btnTwo` / **7.20.0 = `btnClose`**(+ `btnDontShowToday` "오늘 하루 보지 않기").
        #   Maestro id는 정규식이라 둘을 함께 받는다. 배너가 홈 요소를 덮어
        #   `btnTransfer` assert가 실패하는 사고가 있었다.
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd

# ⚠️ **홈 팝업은 하나가 아니라 큐로 뜬다** — 위 블록들만으로는 부족하다(2026-09-01 실측).
#   "중요 공지사항 / 최신 신분증을 업로드해 주세요" 팝업이 홈을 덮어
#   `btnTransfer` assert가 21스텝에서 실패했다. 이 팝업 버튼은
#   **`btnCancel`("다음에 하기") / `btnOK`("지금 업로드")** 인데,
#   기존 가드는 `"나중에 하기"` **전체매칭**이라 문구가 달라 조용히 SKIP됐다.
#   → 문구로 잡지 말고 **검증된 공용 헬퍼로 큐를 비운다**(즉석 블록을 만들지 말 것).
#     헬퍼는 전부 조건부 optional 탭이라 팝업이 없으면 그냥 통과한다.
- runFlow: "_dismiss_popups_stag_old.yaml"
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 30000

# ================================================================
# [History]
# ================================================================

# ----------------------------------------------------------------
# 하단 "거래 내역" 탭 > 송금 진입 (진입 시 "해외송금" 탭이 기본 선택됨)
# 데이터 현황(2026-07-22, seungsoo818/LEE SEUNGSOO, PIN <정상 PIN>):
#   해외송금/예약송금/국내송금 데이터 O, 송금받기 비어있음.
#   ★ 2026-09-04 변경: **송금받기(인바운드)도 데이터가 생긴다.** `13_ReceiveOverseas_old.yaml`의
#     [12]가 인도네시아 송금인으로 Request를 등록하도록 고쳤고, 스위트가 13 → 04 순서로 돈다.
#     그 결과 [17](인바운드 상세)의 BLOCKED가 풀렸다. [18]은 저장소 권한 앱버그로 BLOCKED 유지.
#   * 재송금(txvResendButton): 테스트 수취인이 비활성 → "수취인 활성화" 확인창(아니요=취소).
#   * KFTC/Wallet 결제수단 구분: History 상세엔 송금방법(Bank Transfer)만 표시되어 구분 불가.
#   * 이력다운로드(fb_printHistory): Android10에서 앱이 미선언 WRITE 권한을 체크하여
#     "저장소 권한 필요" 모달(back으로 안닫힘, 확인=설정 딥링크)이 떠 다운로드 완료 불가 = 앱 버그.
#     → 이력다운로드 케이스([06][14][18]) BLOCKED 처리, ClickUp/메모리에 버그 기록.
# 송금 리스트 공통 element id: imgvSearchIcon(검색), searchEditText, imgvFilter(필터), fb_printHistory.
# ⚠️ **`imgvSearchIcon`은 토글이다 (2026-08-19 실측 FAILED)**
#   각 검색 케이스는 "아이콘 탭 → 입력 → 지우기 → 아이콘 탭(닫기)" 형태인데, 닫기가 안 먹었거나
#   탭 전환으로 검색창 상태가 남아 있으면 **다음 케이스의 여는 탭이 오히려 닫아버려**
#   `searchEditText`를 못 찾고 죽는다(GMEPAY [28]에서 재현).
#   → 아이콘을 누른 뒤 **열리지 않았으면 한 번 더 누르는** 가드를 모든 검색 진입부에 넣었다.
# 해외/국내 행 상세 진입: 각 행 tv_gme_control_no(거래번호) index:0. 예약 행: ll_wholeView index:0.
# 필터 바텀시트("설정"): one_month/three_month(기본)/one_year, date1/date2, search, dialog_close.
# ----------------------------------------------------------------
# 홈 코치마크 balloon("잔액 보기" 등, 별도 팝업 윈도우)이 뜨면 nav가 가려지므로 먼저 닫기
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "balloonClose"
    commands:
      - tapOn:
          id: "balloonClose"
      - waitForAnimationToEnd
- tapOn:
    id: "bottom_item_history"
- waitForAnimationToEnd
- tapOn: "^송금$"
- waitForAnimationToEnd
- assertVisible: "${TXT_OVERSEAS_REMIT}"

# ----------------------------------------------------------------
# [01] [High] History - Remittance - 해외송금 상세페이지 재송금(Send Money) 동작 확인
#   상세 진입 → 재송금 → (테스트 수취인 비활성) "수취인 활성화" 확인창 노출 → 아니요로 취소
# ----------------------------------------------------------------
- tapOn:
    id: "tv_gme_control_no"
    index: 0
- waitForAnimationToEnd
# 상세 진입 시 뜨는 코치마크 balloon 팝업(별도 윈도우: 떠있으면 maestro가 상세 노드를 못읽음) 닫기
- runFlow:
    when:
      visible:
        id: "balloonClose"
    commands:
      - tapOn:
          id: "balloonClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${PAY_MODE_TEXT}"
    timeout: 15000
- tapOn: "${TXT_RESEND}"
# 재송금 뒤 나오는 화면이 **수취인 상태에 따라 갈린다** (2026-09-03 실측으로 확정).
#   ① 수취인이 비활성이면 "수취인 활성화" 확인 다이얼로그(예/아니요)가 뜬다 — 종전 코드가 가정한 경로.
#   ② 수취인이 활성이면 그 단계가 없고 **`출금 계좌를 선택하세요` 바텀시트로 직행**한다.
#   → 종전엔 ①만 30초 기다려 죽었다(그날 첫 행이 오늘 실송금한 스리랑카 건이라 수취인이 활성이었다).
#     이 케이스가 보는 건 "재송금 버튼이 동작하는가"이므로 **둘 중 어느 화면이든 도달로 인정**하고 닫는다.
- extendedWaitUntil:
    visible:
      text: "아니요|출금 계좌를 선택하세요"
    timeout: 30000
- runFlow:
    when:
      visible: "${REG_NO}"
    commands:
      - tapOn: "${REG_NO}"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${SCR_SELECT_WITHDRAW}"
    commands:
      # ⛔ 계좌를 고르면 **실제 재송금 절차로 들어간다** → 무조건 닫기만 한다.
      - pressKey: back
      - waitForAnimationToEnd
# 어느 갈래였든 시트/다이얼로그가 닫혔는지 확인한 뒤 목록으로 나간다
- assertNotVisible: "${SCR_SELECT_WITHDRAW}"
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
- assertVisible: "${TXT_OVERSEAS_REMIT}"

# ----------------------------------------------------------------
# [02] [Medium] History - Remittance - 해외송금 Wallet 송금내역 재송금 - BLOCKED
#   KFTC vs Wallet 결제수단이 History 상세에서 관찰되지 않음(송금방법=Bank Transfer만 표시).
#   [01]과 동일 동작밖에 재현되지 않아 결제수단별 구분 검증 불가 → BLOCKED.
# ----------------------------------------------------------------

# ----------------------------------------------------------------
# [03] [Medium] History - Remittance - 해외송금 검색동작 확인
#   목록 첫 행 수취인명의 앞 3글자로 검색 → 그 이름이 결과에 남는지 확인(대소문자 무시)
# ----------------------------------------------------------------
# ⚠️ 검색 케이스는 **데이터에 의존하지 않게** 짠다: 목록 첫 행의 수취인명을 먼저 확보해
#   그 앞 3글자로 검색하고, 그 이름이 결과에 남아 있는지로 판정한다.
#   이전 버전은 수취인명을 하드코딩했다가 데이터가 바뀌어 깨졌다
#   (2026-08-18 실측: 해외송금 수취인이 "GME TEST" → "TEST GME"로 바뀌어 있었다).
# ⚠️ **ASCII 이름인 행만 고른다**(2026-08-31 stag 실측으로 추가).
#   `inputText`는 **한글을 입력하지 못한다** → 첫 행 이름이 한글이면
#   `Unicode character input is not supported: 이승수` 로 플로우가 죽는다.
#   실제로 국내송금 목록이 [`이승수`(한글), `LEE SEUNGSOO`] 순으로 바뀌어 있었다.
#   index로 우회하면 행이 하나뿐일 때 깨지므로 **셀렉터에 id+text를 함께 줘서**
#   영문 이름 행을 직접 집는다(text는 전체매칭이라 한글 행은 걸리지 않는다).
#   ASCII 이름이 하나도 없으면 여기서 실패한다 — 그때는 Maestro로 검증 불가이므로
#   BLOCKED 판단을 해야 한다(조용히 넘기지 말 것).
- copyTextFrom:
    id: "tv_user_id"
    text: "[A-Za-z]{3}[A-Za-z ]*"
- evalScript: ${output.recipient = maestro.copiedText}
- evalScript: ${output.query = output.recipient.substring(0, 3)}
- tapOn:
    id: "imgvSearchIcon"
- waitForAnimationToEnd
# 검색 아이콘은 토글이다 — 안 열렸으면 한 번 더 누른다(헤더 주석 참고)
- runFlow:
    when:
      notVisible:
        id: "searchEditText"
    commands:
      - tapOn:
          id: "imgvSearchIcon"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "searchEditText"
    timeout: 15000
- tapOn:
    id: "searchEditText"
- inputText: ${output.query}
- waitForAnimationToEnd
- assertVisible: ${output.recipient}
- eraseText: 10
- waitForAnimationToEnd
- tapOn:
    id: "imgvSearchIcon"
- waitForAnimationToEnd

# ----------------------------------------------------------------
# [04] [Low] History - Remittance - 해외송금 필터동작 확인
#   필터 → "설정" 바텀시트 → 1개월(one_month) → 검색(search)
# ----------------------------------------------------------------
- tapOn:
    id: "imgvFilter"
- waitForAnimationToEnd
- assertVisible: "${CH_COMMON_SETTINGS}"
- tapOn:
    id: "one_month"
- tapOn:
    id: "search"
- waitForAnimationToEnd
- assertVisible: "${TXT_OVERSEAS_REMIT}"

# ----------------------------------------------------------------
# [05] [Low] History - Remittance - 해외송금 영수증 다운로드 동작 확인
#   상세 → 영수증 → PDF "연결 프로그램"(안드로이드 앱 선택창) 노출 → back으로 복귀
# ----------------------------------------------------------------
- tapOn:
    id: "tv_gme_control_no"
    index: 0
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "balloonClose"
    commands:
      - tapOn:
          id: "balloonClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${PAY_MODE_TEXT}"
    timeout: 15000
- tapOn: "${RECEIPT_TITLE_TEXT}"
- waitForAnimationToEnd
# ⚠️ **OS/기기에 따라 영수증 탭의 결과 화면이 다르다** (2026-09-09 SM-S911N / Android 16 실측).
#   구 기기: PDF **"연결 프로그램"(앱 선택창)** / 이 기기: **파일 저장 대화상자**(다운로드 폴더 +
#   파일명 `OverseasDetailHistory_...` / `DomesticReceipt_...` + "저장" 버튼)가 바로 뜬다.
#   → 둘 다 받는다. 파일명으로 **영수증 PDF가 실제로 만들어진 것**까지 확인되므로 거짓 통과가 아니다.
#   ※ 저장은 하지 않는다(다음 줄의 back으로 빠져나간다) — 체크리스트상 '다운로드'는 여전히 미검증이다.
