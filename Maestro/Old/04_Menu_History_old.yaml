# ----------------------------------------------------------------
# 2026-09-03 사용자 지시로 **고정 검색어(`PARK`)** 방식으로 바꿨다.
#   종전엔 "목록 첫 행 이름을 `copyTextFrom`으로 읽어 앞 3글자로 검색"했다. 데이터 독립적이라
#   좋아 보였지만 **`inputText`가 한글을 넣지 못한다**는 제약과 맞물려 실패했다:
#   2026-09-03 실측에서 국내송금 목록 수취인이 `이승수`(한글) 뿐이라 ASCII 이름 행을 겨냥한
#   `copyTextFrom`이 `Element not found`로 죽었다 — 케이스가 통째로 검증 불가였다.
#   → 이 화면에서는 검색 대상을 **항상 ASCII인 수취인으로 고정**하는 편이 더 견고하다.
#
# ⚠️ 고정값이니 **전제가 깨졌을 때 그걸로 읽히게** 한다(값이 케이스의 일부인 하드코딩 원칙).
#   `PARK DOYOUNG`은 `03_Domestic_old.yaml`이 송금하는 수취인이라 스위트가 그 항목을 지나면
#   국내송금 내역에 남는다. 그래도 없을 수 있으므로 아래에서 **"검색 결과 없음"을 먼저 판정**해
#   "검색 기능 결함"과 "전제 데이터 없음"을 갈라 놓는다.
- tapOn:
    id: "imgvSearchIcon"
- waitForAnimationToEnd
# 검색 아이콘은 토글이다 — 안 열렸으면 한 번 더 누른다(헤더 주석 참고)
- runFlow:
    when:
      notVisible:
        id: "searchEditText"
    commands:
      - tapOn:
          id: "imgvSearchIcon"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "searchEditText"
    timeout: 15000
- tapOn:
    id: "searchEditText"
- inputText: "PARK"
- waitForAnimationToEnd
# 전제 데이터가 없으면 "검색된 송금이 없습니다"(noDataFoundTextView)가 뜬다 →
#   검색 기능 결함과 구분되게 **먼저** 판정한다.
- assertNotVisible:
    id: "noDataFoundTextView"
# ⚠️ **키보드를 먼저 내린다** — 안 내리면 화면 절반을 덮어 결과 2건만 보이고
#   아래 행을 겨냥한 단언이 "없다"로 죽는다(2026-09-03 실측: TOMAS PARK 2건만 보였다).
