#   다이얼로그가 화면을 덮어 그대로 두면 "청구서 내역" assert가 실패한다.
#   **닫으면 그 아래 화면은 정상**이라(목록·필터 다 있음) 케이스 진행에 지장이 없다.
#   전날(2026-08-18) 실행에서는 뜨지 않았다 → 서버 상태에 따른 산발적 오류로 보인다.
#   ※ 07_TodaysRate_old의 "Error Calculating rate"와 같은 계열의 다이얼로그다.
# ⚠️ **목록 로딩이 느려 진입 시 오류 다이얼로그가 자주 뜬다**(사용자 확인, 2026-08-31).
#   종전에는 다이얼로그를 닫기만 하고 진행했는데, 닫아도 **목록이 안 실린 상태**면
#   뒤따르는 필터·검색 케이스가 연쇄로 깨진다.
#   → **최대 4회까지 화면을 나갔다 재진입**하며 목록이 실릴 때까지 기다린다.
#     이 4회 안에 뜨는 오류는 **실패로 잡지 않는다**(로딩 지연으로 간주).
#   ⚠️ 4회를 다 쓰고도 못 실으면 **아래 단언에서 실패**한다 — 조건부만 두면 거짓 통과가 된다.
# **판정 기준: 진입 시 오류 다이얼로그가 뜨지 않으면 통과**(2026-09-01 사용자 결정).
#   목록 로딩 완료까지 판정하려 했으나, 실측상 이 화면은 **로딩 대기가 없고**
#   데이터 건수도 유동적이라(0건이면 리스트 id 자체가 없다) 로딩 판정은 실효가 없었다.
#   → 남는 위험은 **진입 시 산발적으로 뜨는 서버 오류 다이얼로그**뿐이므로 그것만 본다.
#   오류가 뜨면 **최대 4회까지 나갔다 재진입**하며 사라지기를 기다린다(그 안의 오류는 실패로 잡지 않는다).
- repeat:
    times: 4
    while:
      visible:
        id: "btn_diaog_ok"
    commands:
      - tapOn:
          id: "btn_diaog_ok"
      - waitForAnimationToEnd
      # 나갔다 재진입 — 화면을 다시 요청시킨다
      - tapOn:
          id: "iv_back"
      - waitForAnimationToEnd
      - tapOn: "${SCR_BILL}"
      - waitForAnimationToEnd:
          timeout: 30000

# 4회를 다 쓰고도 오류가 남아 있으면 여기서 실패한다(조건부만 두면 거짓 통과가 된다).
- assertNotVisible:
    id: "btn_diaog_ok"
- assertVisible: "${BILL_PAYMENT_HISTORY_TEXT}"

# ----------------------------------------------------------------
# [36] Coupon Box - N/A: 쿠폰박스는 내역(History) 탭에서 접근 불가(별도 메뉴) → 본 파일 범위 밖.
# [37] Reward Point 필터 - N/A: 리워드포인트도 내역(History)에 없음 → 범위 밖.
# [38] Reward Point → GME Shop - N/A: 동일(범위 밖).
# ----------------------------------------------------------------

# ----------------------------------------------------------------
# [39] [Medium] History - Bill Payment - Bill Payment History 필터 동작 확인
#   필터 UI("설정") → 1개월 → 검색 정상 동작 검증
# ----------------------------------------------------------------
- tapOn:
    id: "imgvFilter"
- waitForAnimationToEnd
- assertVisible: "${CH_COMMON_SETTINGS}"
- tapOn:
    id: "one_month"
- tapOn:
    id: "search"
- waitForAnimationToEnd
# 🐞 **앱 결함 (2026-08-31 실기기 재현)** — 청구서 내역에서 **1개월 필터로 조회하면
#   "오류 - (지갑번호)" 다이얼로그**가 뜬다. **3개월·1년은 정상 조회**된다.
#   결제 데이터가 2026-08-27~28에 있어 **1개월 범위 안에 있는데도** 오류다(3회 재현).
#   → 필터 UI 자체는 동작한다(날짜 범위가 2026-07-31~2026-08-31로 갱신됨).
#     여기서는 **필터 적용과 화면 복귀까지만** 검증하고, 조회 오류는 **결함으로 별도 보고**한다.
#     체크리스트 152행은 **Fail**로 기입할 것 — 통과로 적으면 결함을 덮는다.
#   ⚠️ 다이얼로그가 뜨면 **뒤 화면이 접근성 트리에서 사라진다** → 먼저 닫아야
#     아래 assert와 [40]의 검색 아이콘 탭이 성립한다(이것 때문에 315스텝에서 죽었다).
# 조회 응답이 올 시간을 준 뒤 판정한다(응답 전에 판정하면 오류를 놓친다).
- waitForAnimationToEnd:
    timeout: 30000
# 🐞 오류 다이얼로그가 뜨면 **그것이 곧 결함이다** — 닫고 넘어가지 않고 여기서 실패시킨다.
#   진입 로딩과 달리 이 시점은 이미 목록이 실린 뒤라 "로딩 지연"으로 볼 수 없다.
#   ⚠️ 2026-08-31 재확인: 데이터가 **0건인 상태에서는 1개월도 정상 조회**됐다
#     (오전에 6건 있을 때만 오류). 데이터가 있는 상태에서 다시 확인할 것.
- assertNotVisible:
    id: "btn_diaog_ok"
- assertVisible: "${BILL_PAYMENT_HISTORY_TEXT}"

# ----------------------------------------------------------------
# [40] [Medium] History - Bill Payment - Bill Payment History 검색 동작 확인
#   검색창 열림 + 입력 반영 검증. ※ 청구서 내역은 데이터 로딩이 느려 진입 시점에 따라 비어있거나
#   데이터가 있고, 검색 결과 필터 동작도 비결정적이라(입력해도 리스트가 안 비워짐) 기능 검증까지만.
# ----------------------------------------------------------------
- tapOn:
    id: "imgvSearchIcon"
- waitForAnimationToEnd
# 검색 아이콘은 토글이다 — 안 열렸으면 한 번 더 누른다(헤더 주석 참고)
- runFlow:
    when:
      notVisible:
        id: "searchEditText"
    commands:
      - tapOn:
          id: "imgvSearchIcon"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "searchEditText"
    timeout: 15000
- tapOn:
    id: "searchEditText"
- inputText: "ZZZZZ"
- assertVisible: "ZZZZZ"
- eraseText: 5
- waitForAnimationToEnd
- tapOn:
    id: "imgvSearchIcon"
- waitForAnimationToEnd

# ================================================================
# [History - My Usage] 사용 내역 (내역 메인 우상단, MyUsageActivity)
# 진입: 청구서 화면에서 back → 내역 메인 → "사용 내역".
# id: 월이동 previous(←)/next(→)/date_filter, 차트토글 view_pie_chart(막대→파이)/
#   view_line_chart(파이→막대), 차트뷰 hori_chart_view(막대)/pie_chart_view(파이),
#   카테고리 gme_card/overseas_transfer/domestic_transfer/bill_payment/atm_withdrawal/international_topup.
# ================================================================
- tapOn:
    id: "iv_back"
- waitForAnimationToEnd
- assertVisible: "${CARD_EXPENSES_TEXT}"
- tapOn:
    text: "${CARD_EXPENSES_TEXT}"
- waitForAnimationToEnd
- assertVisible: "${TOTAL_SPENT}"

# ----------------------------------------------------------------
# [41] [Medium] History - My Usage - [←],[→] 버튼 선택 시 날짜(월) 변경 확인
# ----------------------------------------------------------------
# ⚠️ **월 라벨을 하드코딩하지 말 것 (2026-08-19에 깨져서 고침)**
#   종전 버전은 "June, 2026"/"July, 2026"을 박아둬서 **달이 바뀌자 즉시 실패**했다.
#   월 라벨은 `date_filter`(예: "July, 2026")에 있으니 **현재값을 읽어두고**
#   ← 로 바뀌는지, → 로 원래 값으로 돌아오는지로 판정한다(실행 시점과 무관).
- assertVisible:
    id: "date_filter"
- copyTextFrom:
    id: "date_filter"
- evalScript: ${output.monthNow = maestro.copiedText}
# ← 이전 달
- tapOn:
    id: "previous"
- waitForAnimationToEnd
- copyTextFrom:
    id: "date_filter"
- assertTrue: ${maestro.copiedText !== output.monthNow}
# → 다시 원래 달로
- tapOn:
    id: "next"
- waitForAnimationToEnd
- copyTextFrom:
    id: "date_filter"
- assertTrue: ${maestro.copiedText === output.monthNow}

# ----------------------------------------------------------------
# [42] [Low] History - My Usage - [Chart] 버튼 선택 시 막대/도넛 차트 변경 확인
#   막대(hori_chart_view) → view_pie_chart 탭 → 파이(pie_chart_view) → view_line_chart 탭 → 막대 복귀
# ----------------------------------------------------------------
# ⚠️ **이번 달 지출이 없으면 차트가 아예 없다**(2026-09-01 실측).
#   월이 바뀐 첫날이라 `September, 2026`에 지출이 0이었고, 화면에는
#   `data_not_found`("데이터 없음")만 떠서 `view_pie_chart` 탭이 344스텝에서 실패했다.
#   → 차트가 있을 때만 토글을 검증한다. 다만 **둘 중 하나는 반드시 있어야** 하므로
#     먼저 단언해 거짓 통과를 막는다(화면 자체가 안 그려진 경우를 걸러낸다).
- assertVisible:
    id: "data_not_found|view_pie_chart"
- runFlow:
    when:
      visible:
        id: "view_pie_chart"
    commands:
      - tapOn:
          id: "view_pie_chart"
      - waitForAnimationToEnd
      - assertVisible:
          id: "pie_chart_view"
      - tapOn:
          id: "view_line_chart"
      - waitForAnimationToEnd
      - assertVisible:
          id: "hori_chart_view"

# ----------------------------------------------------------------
# [44]~[48] 카테고리 선택 시 화면 진입 확인
#   대상 화면이 카테고리마다 다르므로, 사용내역 전용 텍스트("총 지출")가 사라지는지로 진입을 검증하고
#   back으로 사용내역 복귀(pushed activity). gme_card만 탭전환형(back→홈)이라 [43]은 맨 뒤 배치.
# ----------------------------------------------------------------
# ⚠️ **카테고리는 지출 데이터가 있는 것만 표시된다**(2026-08-31 stag 실측).
#   그날 화면에는 `overseas_transfer` / `domestic_transfer` / `gme_card` 3개뿐이었고
#   `bill_payment`에서 `Element not found`로 **354스텝에서 죽었다**.
#   메모리의 "카테고리 6종"은 데이터가 있던 시점의 기록이다 → 6개를 무조건 탭하면 안 된다.
#   그래서 각 카테고리를 **조건부**로 돌리되, 하나도 검증하지 못한 채 통과하는 일이 없도록
#   **최소 1개는 존재함을 먼저 단언**한다(조건부만 두면 거짓 통과가 된다).
# ⚠️ 2026-09-04 실측 정정: 이 화면의 카테고리 행에는 **전용 id가 없다.**
#   실제 구조는 `rv_usages`(리스트) 안에 행마다 `image` / `label` / `value` 제네릭 id뿐이고,
#   종전에 쓰던 `overseas_transfer` 같은 id는 **트리에 존재하지 않는다** → 단언이 죽었다.
#   → 리스트 존재 + 행이 최소 1개 있는지로 전제를 세우고, 각 카테고리는 **`label` 텍스트**로 집는다
#     (셀렉터에 id+text를 함께 줘서 다른 화면 요소와 겹치지 않게 한다).
- assertVisible:
    id: "rv_usages"
- assertVisible:
    id: "label"

# ================================================================
# ⛔ [43]~[48] 카테고리 선택 — **BLOCKED** (2026-09-04 실측)
# ================================================================
#   사용 내역 화면의 카테고리 행이 **아예 눌리지 않는다.**
#   · 접근성 덤프: `rv_usages` / `image` / `label` / `value` 모두 **clickable=false**
#     (클릭 가능한 건 `iv_back` / `previous` / `date_filter` / `next` / `view_pie_chart` 뿐).
#   · Maestro 탭도, `adb shell input tap`으로 행 중앙을 직접 눌러도 **화면이 바뀌지 않았다**
#     (`총 지출`이 그대로 남아 있음) → 셀렉터 문제가 아니라 **행이 비활성**이다.
#   · 2026-08-31 기록에는 `overseas_transfer` 같은 **전용 id가 있었고 탭이 동작**했다.
#     7.20.0-stag에서는 그 id가 사라지고 제네릭 RecyclerView 행으로 바뀌었다 → **회귀 의심**.
#   → 아래 6개 케이스를 주석 처리한다. 조건부로 남겨두면 조건이 참이라 실행되고 매번 실패하며,
#     조건을 좁혀 SKIP시키면 **거짓 통과**가 된다. 앱이 고쳐지면 주석을 풀 것.
#   ※ 카테고리 **목록이 렌더되는 것**은 위의 `rv_usages` / `label` 단언으로 계속 검증한다.

