# ----------------------------------------------------------------
# [17] [Medium] History - Remittance - 인바운드 상세페이지 확인
#   2026-09-04 BLOCKED 해제 — 13이 데이터를 만들면서 상세 진입이 가능해졌다
# ----------------------------------------------------------------
- tapOn:
    id: "dataContainer"
    index: 0
- waitForAnimationToEnd
# 상세 도달을 id로 판정한다(문구는 언어·라벨 변경에 흔들린다)
- extendedWaitUntil:
    visible:
      id: "txvStatusValue"
    timeout: 30000
# ⚠️ **화면 순서대로 본다** (2026-09-09 SM-S911N/2340px 실측으로 확정).
#   상세 화면은 위에서부터 **거래일자·거래번호(`txvControlNoValue`)·상태(`txvStatusValue`)
#   → 송금 총액(`txvSendAmountValue`)·환율·수수료·수취금액 → "보낸 사람"(`txvSenderNameValue`
#   ·`txvSenderCountryValue`)** 순이다.
#   ⛔ 아래 두 필드는 **화면 밖**이라 스크롤이 필요하고, 반대로 위쪽 두 필드는
#     스크롤한 뒤에는 `direction: DOWN` 으로 다시 찾을 수 없다(2026-09-09에 그렇게 실패했다).
#     → **위쪽 먼저 단언하고, 그다음 아래로 스크롤**한다.
- assertVisible:
    id: "txvControlNoValue"
- assertVisible:
    id: "txvSendAmountValue"
- scrollUntilVisible:
    element:
      id: "txvSenderNameValue"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
- assertVisible:
    id: "txvSenderNameValue"
# 목록 → 상세가 같은 건인지 확인(송금인명은 13이 등록한 인도네시아 송금인이다)
- assertVisible:
    text: "BUDI SANTOSO|Budi Santoso|BUDI INBOUND|Budi Inbound"
- scrollUntilVisible:
    element:
      id: "txvSenderCountryValue"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
- assertVisible:
    id: "txvSenderCountryValue"
- assertVisible:
    text: "Indonesia"
- pressKey: back
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "dataContainer"
    timeout: 30000

# ----------------------------------------------------------------
# [18] [Low] History - Remittance - 인바운드 이력 다운로드 동작 확인 - BLOCKED
#   데이터는 생겼지만 `fb_printHistory` **저장소 권한 앱 버그**가 그대로라 여전히 BLOCKED
#   (Android 10에서 앱이 미선언 WRITE 권한을 체크 → back으로 안 닫히는 모달. 헤더 주석 참고).
#   → 앱 수정 전까지 자동화 불가. 누르면 모달에 갇혀 뒤 케이스가 전부 무너진다.
# ----------------------------------------------------------------

# ----------------------------------------------------------------
# [19] [Medium] History - Remittance - 인바운드 검색 동작 확인
#   **매칭·비매칭을 둘 다** 본다. 종전엔 비매칭("ZZZZZ")만 봐서 데이터가 0건이면 항상 통과했다.
#   실측(2026-09-04): 인바운드 검색은 **송금인명(tv_user_id)으로 매칭된다**.
