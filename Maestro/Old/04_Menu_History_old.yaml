# ================================================================
# 송금 받기(인바운드) 탭 (상단 탭 전환)
# ================================================================
# ★ 2026-09-04 전면 개정 — 종전엔 "데이터 없음"을 전제로 UI만 훑었고, 그게 **거짓 통과**였다.
#   데이터가 0건이면 어떤 검색어를 넣어도 "조회된 거래가 없습니다"가 뜨고 탭 제목 assert 도
#   항상 맞는다 → **검색·필터가 죽어 있어도 EXIT=0**. [17][18]은 아예 코드가 없었다.
#
#   ⚠️ **전제: `13_ReceiveOverseas_old.yaml` 이 먼저 돌아야 한다.**
#      그 파일의 [12]가 인도네시아 송금인(Budi Santoso)으로 인바운드 Request 를 등록하고,
#      그게 이 탭의 유일한 데이터 공급원이다. 스위트는 13 → 04 순서로 고정돼 있다
#      (run_suite.ps1 주석 참고). **04 를 단독 실행하면 이 구간은 전제 미충족으로 실패한다** —
#      그건 코드 결함이 아니라 선행 데이터가 없다는 뜻이다.
#
#   실측(2026-09-04, seungsoo818): 행 = tv_date / tv_gme_control_no / tv_user_id(송금인명) /
#     tv_amount / tv_status("요청 완료"), 컨테이너 `dataContainer`(clickable).
#     상세 = InboundDetailNewHistoryActivity — txvStatusValue / txvSenderNameValue /
#     txvSenderCountryValue / txvSendAmountValue / txvControlNoValue / llReceipt("영수증").
#   ⚠️ 요청은 **72시간 만료**다(실측: 09-04 10:31 등록 → 만료 09-07 10:31). 사흘 넘게 방치한
#      계정으로 04만 다시 돌리면 데이터가 사라져 있다 → 13을 다시 돌려 만든다.
- tapOn:
    text: "${SCR_RECEIVE_REMIT}"
- waitForAnimationToEnd
- assertVisible: "${SCR_RECEIVE_REMIT}"
# 전제 데이터 도달을 먼저 강제한다(서버 조회 응답 대기). 여기서 죽으면 13 선행이 빠진 것이다.
- extendedWaitUntil:
    visible:
      id: "dataContainer"
    timeout: 60000

# ----------------------------------------------------------------
# [16] [Medium] History - Remittance - 인바운드 필터 동작 확인
#   필터 UI("설정" 바텀시트) 동작 + **적용 결과가 목록에 반영되는지**까지 확인
# ----------------------------------------------------------------
- tapOn:
    id: "imgvFilter"
- waitForAnimationToEnd
- assertVisible: "${CH_COMMON_SETTINGS}"
- tapOn:
    id: "one_month"
- tapOn:
    id: "search"
