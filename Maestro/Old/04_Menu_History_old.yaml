- waitForAnimationToEnd
# 두 건을 **둘 다** 확인한다 — 검색어가 이름의 **앞·뒤 어디에 있어도** 걸리는지를 보는 것이다.
#   `TOMAS PARK`(뒤) / `PARK DOYOUNG`(앞). 하나만 보면 접두사 검색만 검증하고 끝난다.
#   목록이 길어 아래쪽은 화면 밖일 수 있으므로 스크롤로 끌어올려 확인한다.
- assertVisible: "TOMAS PARK"
- scrollUntilVisible:
    element:
      text: "PARK DOYOUNG"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 20
- assertVisible: "PARK DOYOUNG"
# 지우기 전에 필드 포커스를 되돌린다(키보드를 내려 포커스가 빠졌을 수 있다)
- tapOn:
    id: "searchEditText"
- eraseText: 10
- waitForAnimationToEnd
- tapOn:
    id: "imgvSearchIcon"
- waitForAnimationToEnd

