# ---- 송금액: **앱이 알려주는 최소 송금액을 읽어 그대로 쓴다** (2026-09-23) ----
# ⛔ 종전에는 `SENDNOW_AMOUNT`(기본 14000)를 고정으로 넣었다. 최소치(그날 12,017)보다 넉넉히 잡은
#   값이라 두 가지로 깨졌다: ① 최소치가 오르면 `limitErrorMsg` 로 죽고 ② 잔액이 빠듯하면
#   **잔액부족 경로로 빠져 송금이 성립하지 않는다**(2026-09-23 실제로 14,000 vs 잔액 13,303 으로 막혔다).
#   최소 송금액은 **환율 연동이라 매일 바뀌므로** 고정값은 근본적으로 낡는다.
# → 일부러 최소치보다 낮은 값을 넣어 `limitErrorMsg` 를 띄우고, 거기 적힌 금액을 그대로 재입력한다.
#   메시지 형식은 양쪽 언어 모두 `<숫자> KRW` 를 포함한다(실측):
#     ko `최소 송금 금액은 12,017 KRW입니다.` / en `Minimum sending limit is 11,923 KRW.`
#   → 숫자만 추려 쓰면 언어와 무관하다. 다른 숫자가 섞이지 않는 문구라 전체 숫자 추출로 충분하다.
# ⚠️ 이 케이스의 검증 목적은 "송금이 성립하는가"이지 금액 자체가 아니다 → 최소치로 보내 비용을 줄인다.
- inputText: "${SENDNOW_PROBE_AMOUNT}"
- hideKeyboard
- tapOn: "${CALCULATE_TEXT}"
- extendedWaitUntil:
    visible:
      id: "limitErrorMsg"
    timeout: 60000
- copyTextFrom:
    id: "limitErrorMsg"
- evalScript: ${output.minAmt = maestro.copiedText.replace(/[^0-9]/g, '')}
# 금액 필드를 비우고 최소치를 다시 넣는다(`sendAmountEdTxt` = "You Send" 입력칸)
- tapOn:
    id: "sendAmountEdTxt"
- eraseText
- inputText: ${output.minAmt}
- hideKeyboard

# 계산하기 (재계산)
- tapOn: "${CALCULATE_TEXT}"

# ---- 1단계: 금액 세부 정보 (2026-08-31 운영 실측) ----
#   성공 시 `transferFeeTxtView`(수수료) + `gmeCouponAppliedAmountValueTxt`(쿠폰 적용가) + `agreeButton`("계속")
#   실패 시 `limitErrorMsg`("최소 송금 금액은 12,017 KRW입니다." / 한도 초과 등)
#   ⚠️ 종전에는 잔액·계속을 **조건부 `runFlow`로만** 두어 아무 일도 안 일어나도 넘어갔다 → 도달을 강제한다.
#   ⚠️ **잔액도 이 단계에서 검증된다**(2026-08-31 운영 실측). 부족하면 계산 결과 대신
#      "거래를 진행하기 위한 잔액이 부족합니다." 바텀시트가 뜬다.
- extendedWaitUntil:
    visible:
      text: "${SEND_CALC_RESULT_ANY}"
    timeout: 60000

# ⛔ 잔액 부족이면 **여기서 실패시킨다.** 도달 조건에 함께 넣어 둔 이유는, 이 판정이 없으면
#   `agreeButton` 대기가 60초 타임아웃 나서 **원인이 로그에서 가려지기** 때문이다
#   (세션 만료 가드를 홈 대기보다 앞에 둔 것과 같은 이유).
# ⚠️⚠️ 이 팝업에는 **`자동이체 계좌 선택` 시트가 함께 뜬다**(계좌 목록 + `btnVerifyBankAccount`="확인").
#   거기서 계좌를 고르고 확인을 누르면 **실계좌에서 자동충전이 발생한다.** 절대 자동으로 누르지 말 것.
- assertNotVisible:
    text: "${SEND_INSUFFICIENT_BALANCE}"
- assertVisible:
    id: "agreeButton"
    text: "${MYQR_CONTINUE}"
# 최소금액/한도 오류가 남아 있으면 실송금이 성립하지 않는다 → 여기서 실패시킨다(닫고 진행하지 말 것)
- assertNotVisible:
    id: "limitErrorMsg"
- assertVisible:
    id: "transferFeeTxtView"
- tapOn:
    id: "agreeButton"

# ---- 2단계: 수취인 정보 / 거래 상세 / 약관 동의 ----
#   ⚠️ 1·2단계는 **같은 액티비티(`SendMoneyV2Activity`)** 라 트리에 1단계 뷰가 남고 버튼 id도 같은
#      `agreeButton`이다 → 2단계 도달 판정은 **2단계에만 있는 `txt_pamount`**(총 지급액)로 한다.
- extendedWaitUntil:
    visible:
      id: "txt_pamount"
    timeout: 30000
- assertVisible:
    id: "txt_bankAcNo"

# ⛔ **스크롤 없이 `agreeButton`을 누르면 안 된다**(2026-08-31 운영 실측).
#   2단계 콘텐츠가 화면보다 길어 "계속" 버튼이 **화면 밖**인데 접근성 트리에는 bounds가
#   `[54,1920][1026,2060]`으로 남아 있다. 그 좌표에 실제로 그려진 것은 **"2. 송금 사기 주의"
#   (`txt_fraud_warning`) 링크**라서, 탭이 **COMPLETED로 찍히고도** 약관 브라우저
#   (`TermsAndConditionV2BrowserActivity`)가 열리고 PIN에 도달하지 못한다.
#   → 높이0 노드 탭 함정과 같은 부류. 먼저 스크롤해 겹침을 해소한다.
- swipe:
    direction: UP
    duration: 1000
- waitForAnimationToEnd
- assertVisible:
    id: "agreeButton"
    text: "${MYQR_CONTINUE}"
- tapOn:
    id: "agreeButton"

# 그래도 약관 브라우저가 열렸으면 되돌아와 재시도한다(자가복구)
- runFlow:
    when:
      visible:
        text: "GME Remittance - Terms"
    commands:
      - tapOn:
          id: "iv_back"
      - waitForAnimationToEnd
      - swipe:
          direction: UP
          duration: 1000
      - waitForAnimationToEnd
      - tapOn:
          id: "agreeButton"

# ⚠️ **PIN 가드가 한 번도 동작하지 않았다**(2026-08-28 확인). 잠금화면 실제 문구는
#   **"간편 비밀번호를 입력하세요"** 인데 가드가 `"간편 비밀번호"` **전체매칭**이라 항상 SKIP됐다.
#   즉 `[02]`는 **PIN을 입력한 적이 없고 실송금도 성립한 적이 없다** — 통과했다면 거짓 통과다.
#   → 구 UI 잠금화면 판정은 **`id: input_dot_1`** 을 쓴다(언어·문구 변경에 영향받지 않는다).
# ⚠️ PIN 키패드는 **탭마다 배치가 재섞인다**. 탭 사이 `waitForAnimationToEnd`가 없으면
#   maestro가 직전 스냅샷의 stale 좌표를 눌러 오입력이 누적된다(= 계정 잠금). 원래 빠져 있었다.

# PIN 1회 오입력 (의도된 실패 경로 검증)
- extendedWaitUntil:
    visible:
      id: "input_dot_1"
    timeout: 30000
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "3"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "3"
- waitForAnimationToEnd
# 오입력 안내 팝업이 뜨면 닫는다
- runFlow:
    when:
      visible:
        id: "btn_diaog_ok|btnOk"
    commands:
      - tapOn:
          id: "btn_diaog_ok|btnOk"
      - waitForAnimationToEnd

# PIN 정상 입력
- extendedWaitUntil:
    visible:
      id: "input_dot_1"
    timeout: 30000
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd

# PIN 이후 결과 대기 — **성공/잔액부족 중 하나는 반드시 떠야 한다.**
# ⚠️ 종전에는 두 갈래가 모두 조건부 `runFlow`뿐이어서, 아무 팝업도 뜨지 않고 송금 화면에
#   멈춰 있어도 **조용히 통과**했다(거짓 통과). 결과 도달을 먼저 강제한다.
- extendedWaitUntil:
    visible:
      text: "${SEND_RESULT_ANY}"
    timeout: 120000
- takeScreenshot: "02_01_02_send_result"

# ⚠️ 잔액 부족으로 빠지면 **송금은 일어나지 않는다.** `[02]`의 검증 목적(실제 송금)이 달성되지
#   않으므로 **팝업을 닫고 진행하지 않고 여기서 실패시킨다.** 스위트는 잔액을 선검사해
#   부족하면 이 파일을 **SKIP**하기로 되어 있다(잔액부족 경로를 Pass로 적지 말 것).
# ⚠️ 팝업 문구는 "잔액이 부족합니다" 형태라 `"잔액"` **전체매칭으로는 안 잡힌다** → `.*잔액.*`.
#   ※ 앱은 **PIN 입력 전까지 잔액을 검증하지 않는다**(실측) → 이 팝업은 PIN 이후에만 뜬다.
- assertNotVisible:
    text: "${SEND_RESULT_INSUFFICIENT}"

# ✅ 실송금 성립 단언 — 2026-08-31 운영 실측 결과 화면은
#    **"성공" / "거래가 정상적으로 완료되었습니다."** + `영수증 보기` / `다시 보내기` 다.
#    조건부 처리만 두면 아무것도 안 떠도 EXIT=0이 된다 → 반드시 단언한다.
- assertVisible:
    text: "${SEND_SUCCESS}"

# ⚠️ 성공 팝업을 **`다시 보내기`로 닫지 않는다** — 그 버튼은 송금 화면으로 되돌아가므로
#   이후 홈 복귀 경로가 길어진다. 아래 back 루프로 빠져나온다.

# 홈 복귀
# ⚠️ 송금 완료 후 스택이 깊다(2026-08-31 실측: 결과 팝업 → `SendMoneyV2TransactionCompleteActivity`
#   → `SchedulePaymentActivity` → 홈). 조건부 back 6회로는 모자랐다 → `repeat`로 홈까지 민다.
- repeat:
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# ================================================================
# [03] 실시간 송금 탭 - 수취인 화면 필터(설정) 동작 확인
# ================================================================
- tapOn: "${TXT_OVERSEAS_REMIT}"
- extendedWaitUntil:
    visible:
      text: "${SCR_SELECT_RECIPIENT}"
    timeout: 30000
- assertVisible:
    text: "${SEND_NOW_TEXT}"
- tapOn:
    id: "imgvFilter"
- assertVisible:
    text: "${CH_COMMON_SETTINGS}"
- assertVisible:
    id: "tv_period"
- assertVisible:
    id: "one_month"
- assertVisible:
    id: "three_month"
- assertVisible:
    id: "one_year"
- assertVisible:
    id: "et_searchText"
- tapOn:
    id: "et_searchText"
- inputText: "TEST"
- hideKeyboard
# 필터 닫기
- pressKey: back

# ================================================================
# [04] 실시간 송금 탭 - 수취인 목록 확인 (Send Now)
# ================================================================
- tapOn: "${TXT_OVERSEAS_REMIT}"
- extendedWaitUntil:
    visible:
      text: "${SCR_SELECT_RECIPIENT}"
    timeout: 10000

# [04] 결과 확인: [02]에서 추가한 GME TEST가 수취인 목록에 있는지 확인
- assertVisible:
    text: "GME TEST"

# ================================================================
# 사후 정리: 테스트에서 생성된 수취인 삭제
# ================================================================

# 홈으로 복귀 (어느 화면에 있든 Home까지)
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back

# ⛔ **사후 정리에서 `GME TEST` 삭제를 제거했다**(2026-08-28).
#   이 수취인은 `02_02`의 `[04][05][시나리오3]`이 **실시간 목록에서 예약 탭으로 복사해 쓰는 대상**이다.
#   여기서 지우면 `02_02`가 "기존 수취인 추가" 시트가 비어 실패한다(실제로 그렇게 깨져 있었다).
#   이 파일의 멱등성은 **사전 정리(GME TEST 6회 / TEST GME 3회 / TESTUPDATE GME 3회)** 가 담당하므로
#   사후에 지우지 않아도 다음 실행에 영향이 없다.
#   ⚠️ 그래서 이 파일은 **`GME TEST`(스리랑카 / COMMERCIAL BANK)를 계정에 남긴 채 끝난다.** 의도된 상태다.

# 홈에서 끝낸다 — 스위트에서 다음 항목이 홈을 전제하므로 화면을 남겨두지 않는다.
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000
