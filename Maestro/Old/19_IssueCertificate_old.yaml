- tapOn: "서울특별시"
- waitForAnimationToEnd
- tapOn:
    id: "dp_address"
- extendedWaitUntil:
    visible:
      id: "item_textview"
    timeout: 20000
- tapOn: "강남구"
- waitForAnimationToEnd
- tapOn:
    id: "btn_next"
- extendedWaitUntil:
    visible:
      text: "${REGISTER_BENEFITS_GET_STARTED_BTN}"
    timeout: 20000
- tapOn: "${REGISTER_BENEFITS_GET_STARTED_BTN}"
- extendedWaitUntil:
    visible:
      text: "인증 수단 선택"
    timeout: 30000
- assertVisible: "인증 수단을 선택해 주세요."
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
# 홈 복귀 판정 — 서비스 목록까지 스크롤한 상태로 돌아오므로 상단 `btnTransfer`는 트리에 없다.
