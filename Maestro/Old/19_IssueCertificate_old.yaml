# 주민등록 증명서 전용: 주소(시/도 + 시군구) 직접 선택 → 계속
- extendedWaitUntil:
    visible:
      text: "${PLEASE_CHECK_THE_RESIDENT_ADDRESS}"
    timeout: 20000
# WARN 2026-09-22: the city/district pickers are bottom sheets. Tapping without waiting
#   killed the run with `Element not found` although the item was rendered on screen.
#   -> force sheet arrival via `id: item_textview` before each tap.
# NOTE city/district names stay Korean even in the English UI (address data, measured)
#   -> not an i18n target. The sheet title does follow the app language
#   (`What is your registered address?`).
- tapOn:
    id: "dp_city"
- extendedWaitUntil:
    visible:
      id: "item_textview"
    timeout: 20000
- tapOn: "서울특별시"
- waitForAnimationToEnd
- tapOn:
    id: "dp_address"
- extendedWaitUntil:
    visible:
      id: "item_textview"
    timeout: 20000
- tapOn: "강남구"
- waitForAnimationToEnd
- tapOn:
    id: "btn_next"
- extendedWaitUntil:
    visible:
      text: "${REGISTER_BENEFITS_GET_STARTED_BTN}"
    timeout: 20000
- tapOn: "${REGISTER_BENEFITS_GET_STARTED_BTN}"
- extendedWaitUntil:
    visible:
      text: "인증 수단 선택"
    timeout: 30000
- assertVisible: "인증 수단을 선택해 주세요."
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
# 홈 복귀 판정 — 서비스 목록까지 스크롤한 상태로 돌아오므로 상단 `btnTransfer`는 트리에 없다.
# 스크롤과 무관한 하단 내비로 보고, 재등장하는 인앱 배너는 먼저 닫는다.
- runFlow:
    when:
      visible:
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 20000

