    element:
      text: "${TXT_CERTIFICATE}"
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 20
    centerElement: true
- tapOn: "${TXT_CERTIFICATE}"
- extendedWaitUntil:
    visible:
      text: "소득금액증명"
    timeout: 20000
- tapOn: "소득금액증명"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "agreeallcheckboxtitle"
    commands:
      - tapOn:
          id: "agreeallcheckboxtitle"
      - tapOn:
          id: "btnConfirm"
      - waitForAnimationToEnd
# 홈택스 소득증명 전용: 조회기간(시작/종료 연도) 선택 → 계속 (기본값 수락)
- extendedWaitUntil:
    visible:
      text: "${CHOOSE_THE_PERIOD_YOU_WANT}"
    timeout: 20000
- tapOn:
    id: "fromyear"
- tapOn:
    id: "confirmBtn"
- tapOn:
    id: "toyear"
- tapOn:
    id: "confirmBtn"
- tapOn:
    id: "btn_next"
- extendedWaitUntil:
    visible:
      text: "${REGISTER_BENEFITS_GET_STARTED_BTN}"
    timeout: 20000
- tapOn: "${REGISTER_BENEFITS_GET_STARTED_BTN}"
- extendedWaitUntil:
    visible:
      text: "인증 수단 선택"
    timeout: 30000
- assertVisible: "인증 수단을 선택해 주세요."
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
# 홈 복귀 판정 — 서비스 목록까지 스크롤한 상태로 돌아오므로 상단 `btnTransfer`는 트리에 없다.
# 스크롤과 무관한 하단 내비로 보고, 재등장하는 인앱 배너는 먼저 닫는다.
- runFlow:
    when:
      visible:
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 20000

