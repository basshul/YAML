appId: ${APP_ID}
---
# ================================================================
# 시나리오: Profile (프로필 탭) — 구 UI
# ================================================================
# **이 파일 작업 종료.** 남은 미커버는 전화번호 변경(OTP)과 신분증·여권의 **카메라 촬영**뿐이고,
#   둘 다 사용자 확정 BLOCKED다 — 더 손댈 것이 없다.
#   ⚠️ [01-7] 한국 신분증 **갤러리 업로드** 분기는 플로우로 아직 못 돌렸다 — 그 업로드 때문에
#     계정이 심사 대기로 잠겨 SKIP된다. 담당자 승인 후 재실행 필요.
# 대상 = HomeActivityV2의 하단 내비 "프로필" 탭.
#
# 실행 전 확인(액티비티) · 공통 진입 블록 규약: docs/ENVIRONMENT.md §7
#
# 구 UI 프로필 탭 구조 (2026-08-12 실측):
#   랜딩(스크롤 최상단): profileText("프로필") + 총 송금액 요약
#                        tv_amount_info_text / tv_total_amount / tv_total_count / tv_gme_wallet
#   ↓ 스크롤하면:        tv_user_name / tv_user_id / tv_phone_number / tv_email
#                        editProfileLayout("정보 수정")
#                        tv_bank_name("잔액") / tvBalanceTextView / tv_wallet_number / tv_wallet_bankname
#                        tv_referral("친구 초대")
#                        tv_yearly_remaining_label("연간 송금 한도") / tv_inbound_yearly_remaining_label("연간 수취 한도")
#                        btn_transaction_history("거래 내역")
#   ※ 진입 대상은 **랜딩에 없고 스크롤해야 나온다** → 케이스마다 scrollUntilVisible 필요.
#   ※ 구 UI 프로필 탭에는 **로그아웃이 없다**(드로어에 있음 → 04_01_메뉴_드로어와설정_old [09]).
#
# 이 파일의 범위 (2026-08-12 중복 정리, 11건 삭제):
#   드로어 항목 8건(은행계좌연결/송금받을계좌/지점/GME소개/개인정보/이용약관/설정/로그아웃) → 04_01_메뉴_드로어와설정_old
#   쿠폰함 → 04_02_메뉴_거래내역  /  GME Wallet 거래내역·리워드 포인트 → 홈에서 확인
#   → 프로필 탭 고유 항목만 남김.
#
# 케이스 목록:
#   전 케이스 2026-08-13 실기기 PASS (EXIT=0).
#   [01]    정보 수정 진입 확인
#   [01-1]  정보 수정 항목 노출 확인
#   [01-2]  직업 변경 → 저장(PIN) → 반영 확인 → 원복   **실제로 값을 바꾸는 유일한 케이스**
#   [01-3]  주소 변경 동작 확인          **직접입력+GPS+저장+원복까지** (2026-08-18)
#   [01-4]  휴대폰 번호 변경 진입          🚫 실제 변경은 **BLOCKED**(OTP 인증 필요, 사용자 확정)
#   [01-5]  이메일 변경 동작 확인        **변경+저장(PIN)+원복까지** (2026-08-18)
#   [01-6]  프로필 사진 변경 동작 확인    **카메라·갤러리 양 경로 + 실제 업로드까지** (2026-08-18)
#   [01-7]  한국 신분증 업로드(갤러리)    카메라 촬영은 BLOCKED. **멱등 아님 — 승인 전엔 업로드 구간 SKIP**
#   [02]    친구 초대: 진입 + Send Link + Share QR  **공유 시트 내용물까지** (2026-08-18)
#   [03]    연간 송금/수취 한도 표시 확인
#   [04]    거래 내역 → [i] "공유된 정보" → 자세히 알아보기 → 제3자 제공 동의서
#
# 계정 국적 — [01-1]이 **양쪽을 조건부로 모두 커버**한다(2026-08-14 test123으로 확인 완료).
#   ✅ 한국인(seungsoo818) : koreanIdLayout 노출 / passportLayout·arcLayout 미노출  (2026-08-13)
#   ✅ 외국인(test123)     : passportLayout("신분증")+arcLayout("외국인 등록증") 노출 /
#                            koreanIdLayout 미노출                                   (2026-08-14, EXIT=0)
#   그 외 행(phone/email/address/occupation/보안 2종)과 `editimage`는 양쪽 동일하다.
#   ※ 2026-08-18 정정: "촬영·업로드는 자동화 불가"는 틀렸다. 촬영 화면 안의 **갤러리 버튼**으로
#     업로드까지 자동화된다. 한국인 = 이 파일 [01-7],
#     **외국인 ARC·여권 = `Old\25_02_프로필_외국인신분증_old.yaml`([F-01]/[F-02])로 분리**했다
#     (test123 프로필 탭에는 `tv_total_amount`가 없어 이 파일의 공통 진입이 통하지 않는다).
#   ※ 프로필 사진 뷰 id만 다르다(한국인 `profileImage` / 외국인 `profileImageDefault`).
#     [01-6]은 `editimage`를 쓰므로 영향 없다.
#
# 나머지 케이스는 한국인 계정(seungsoo818) 기준이다 — 특히 [01-2]의 기준값 "직장인".
#
# ClickUp `[Profile] 시나리오`(z8nfn6m9z8, 11건) 대조
#   ✅ 커버완료 8건 (`# CLICKUP:` 주석 = 리포트가 complete로 올림)
#      z8nfn6ma7v  직업변경 동작 확인            → [01-2] (변경·저장·반영·원복까지 수행)
#      z8nfn6ma7q  프로필 사진 변경(Take/Choose) → [01-6]
#                  (카메라 촬영·갤러리 선택·자르기·실제 업로드까지 전부 수행)
#      z8nfn6ma7u  주소변경(직접입력+GPS)        → [01-3]
#                  (GPS 자동입력 + 직접입력 저장·반영·원복까지 수행)
#      z8nfn6ma7t  이메일 변경                   → [01-5]
#                  (인증 절차가 없어 변경·저장·반영·원복까지 수행. 형식오류 차단도 확인)
#      z8nfn6ma80  연간 잔여 송금 한도 표시      → [03]
#      z8nfn6ma82  [i] '공유된 정보' → Learn more → [04] (제3자 제공 동의서 도달까지)
#      z8nfn6ma7y  Invite Friend 링크(Send Link) → [02]
#      z8nfn6ma7z  Invite Friend QR 공유(Share QR) → [02]
#                  (둘 다 시스템 공유 시트까지 열어 공유 내용물을 확인. 대상은 탭하지 않는다)
#   ◐ 부분커버 3건 (to do 유지 — 각 케이스 위에 사유 주석)
#      z8nfn6ma7r  전화번호 변경                 → [01-4] 진입만.
#                  🚫 **실제 변경은 BLOCKED(OTP 인증 필요) — 2026-08-18 사용자 확정, 추가 작업 없음**
#      z8nfn6ma7w  신분증 촬영·업로드(Korean ID/ARC) → [01-1] 행 노출(양쪽) + [01-7] Korean ID
#                  + **25_02_프로필_외국인신분증_old [F-01] ARC**(2026-08-18). 카메라 촬영은
#                  사용자 지시로 BLOCKED → 그 부분만 미커버
#      z8nfn6ma7x  여권 촬영·업로드 + 한국국적 Passport 미노출 → 미노출은 [01-1]이 확인,
#                  **업로드는 25_02_프로필_외국인신분증_old [F-02]**(2026-08-18). 카메라 촬영은
#                  사용자 지시로 BLOCKED → 그 부분만 미커버
#   ✗ 미커버 0건
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\25_01_프로필_정보수정과공유_old.yaml"
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 → 프로필 탭 ----------------
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ LIVETEST 강제 — 판별이 불가능해 항등 시퀀스로 간다. 상세: docs/ENVIRONMENT.md §7.3
      - tapOn:
          text: "${SERVER_PICK}"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
# 자동 로그아웃(세션 10분 만료)으로 재인증 화면에 떨어졌으면 비밀번호로 로그인한다
- runFlow: "_relogin_if_autologout_old.yaml"
# 잠금화면을 명시적으로 대기한 뒤 PIN 입력(탭 사이 정착 대기 필수 — 키패드가 매 탭 재배치됨)
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${BTN_CLOSE}"
      # ⚠️ 맹목적 팝업 닫기 — 상세 사유는 07_오늘의환율_환율계산_old.yaml 의 같은 블록 주석 참고.
      #   요약: 런처 이탈 사고 이력이 있으나, id로 안 닫히는 팝업이 남아 진입이 막힐 수 있어
      #   지우지 않고 **이미 홈에 도달했으면 누르지 않도록** 가드만 좁혔다.
      notVisible:
        id: "bottom_item_home"
    commands:
      - tapOn: "${BTN_CLOSE}"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# 프로필 탭 진입 — 하단 내비 라벨은 content-desc라 id로 탭한다.
# ※ 탭을 재선택하면 직전에 열었던 서브화면이 백스택에서 복원되는 함정이 있으므로
#   **여기서 1회만 누르고**, 이후 케이스는 back으로 프로필 홈에 복귀한 상태를 이어받는다.
- tapOn:
    id: "bottom_item_profile"
- extendedWaitUntil:
    visible:
      id: "tv_total_amount"
    timeout: 20000

# ----------------------------------------------------------------
# [01-2] [High] 정보 수정 - 직업 변경 → 저장 → 반영 확인 → 원복
# CLICKUP: z8nfn6ma7v
# 이 파일에서 **실제로 값을 바꾸는 유일한 케이스**다(직업은 라디오 선택이라 한글 입력 제약이 없다).
#
# ★ 2026-10-28 재작성 — **기준값 의존을 걷어냈다.**
#   종전엔 "직업이 `직장인` 이어야 한다" 고 단언하고 `사업가` 로 바꿨다가 `직장인` 으로
#   되돌렸다. 계정 값이 바뀌거나 이전 실행이 중간에 끊겨 `사업가` 로 남으면 **첫 줄에서**
#   죽는다 — 2026-10-28 운영 실행이 실제로 그렇게 19스텝에서 멈췄다(당시 값은 `사업가`).
#   [01-3] 주소 케이스를 같은 이유로 10-27 에 고쳤는데, 이쪽이 남아 있었다.
#
#   → 지금 값을 읽어 `output.orig` 에 두고, **반대 값**(`output.target`)으로 바꿨다가
#     `output.orig` 로 되돌린다. 어느 쪽에서 시작하든 성립하고, 중간에 끊겨도
#     다음 실행이 그 자리에서 다시 성립한다.
- scrollUntilVisible:
    element:
      id: "editProfileLayout"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "editProfileLayout"
- extendedWaitUntil:
    visible:
      id: "occupationLayout"
    timeout: 20000
# ★ 기준값을 박지 않는다 — **지금 값을 읽어** 두고 끝에 그 값으로 되돌린다.
#   `occupation` 이 직업 값 노드다(2026-10-28 실측).
- copyTextFrom:
    id: "occupation"
- evalScript: ${output.orig = maestro.copiedText}
# 아는 값인지 확인한다 — 셋째 값이 생기면 조용히 통과하지 않고 여기서 드러난다.
- assertTrue: ${output.orig === SALARIED || output.orig === BUSINESSMAN}
# 반대 값으로 바꿔 본다.
#   ⚠️ 삼항연산자의 `: ` 를 YAML 이 매핑으로 읽는다 → **값 전체를 인용**해야 한다.
- evalScript: '${output.target = (output.orig === SALARIED) ? BUSINESSMAN : SALARIED}'
# --- 직장인 → 사업가 ---
- tapOn:
    id: "occupationLayout"
- extendedWaitUntil:
    visible:
      text: "${CHANGE_YOUR_OCCUPATION}"
    timeout: 20000
- tapOn:
    id: "occupationInput"
- extendedWaitUntil:
    visible:
      id: "rv_radioButtons"
    timeout: 15000
- assertVisible: "${OCCUPATION_SEARCH}"
- takeScreenshot: profile_occupation_sheet
- tapOn: ${output.target}
- waitForAnimationToEnd
- assertVisible: ${output.target}
- tapOn:
    id: "btn_next"
- waitForAnimationToEnd
# ⚠️ **저장하면 간편 비밀번호(PIN) 인증이 뜬다**(2026-08-13 실측). 여기서 back을 누르면
#   변경이 커밋되지 않고 직업 변경 화면으로 되돌아간다(= 취소). 반드시 PIN을 입력해야 반영된다.
#   PIN 키패드는 탭마다 배치가 재섞이므로 탭 사이 정착 대기 필수(오입력 누적 = 계정 잠금).
- extendedWaitUntil:
    visible:
      text: "${ENTER_THE_LOCK}"
    timeout: 20000
- runFlow:
    file: _enter_pin_old.yaml
    env:
      PIN: ${PIN_NORMAL}
- runFlow:
    when:
      visible: "확인|예|OK"
    commands:
      - tapOn: "확인|예|OK"
      - waitForAnimationToEnd
# 복귀 판정은 `occupationLayout`으로 하면 안 된다 — 직업 변경 화면에도 같은 id가 있다.
- extendedWaitUntil:
    visible:
      text: "${EDIT_INFO_TEXT}"
    timeout: 30000
# 변경이 실제로 반영됐는지
#   ⚠️ id + text 동시지정은 이 앱에서 실패하는 함정이 있다([[project_15_loan]]) → 텍스트 단독으로 판정
- assertVisible: ${output.target}
- assertNotVisible: ${output.orig}
- takeScreenshot: profile_occupation_changed
# --- 원복: 사업가 → 직장인 ---
- tapOn:
    id: "occupationLayout"
- extendedWaitUntil:
    visible:
      text: "${CHANGE_YOUR_OCCUPATION}"
    timeout: 20000
- tapOn:
    id: "occupationInput"
- extendedWaitUntil:
    visible:
      id: "rv_radioButtons"
    timeout: 15000
- tapOn: ${output.orig}
- waitForAnimationToEnd
- tapOn:
    id: "btn_next"
- waitForAnimationToEnd
# 원복 저장도 동일하게 PIN 인증을 요구한다
- extendedWaitUntil:
    visible:
      text: "${ENTER_THE_LOCK}"
    timeout: 20000
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "확인|예|OK"
    commands:
      - tapOn: "확인|예|OK"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${EDIT_INFO_TEXT}"
    timeout: 30000
- assertVisible: ${output.orig}
- takeScreenshot: profile_occupation_restored
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_profile"

# ----------------------------------------------------------------
# [01-7] [High] 정보 수정 - 한국 신분증 업로드 동작 확인 (갤러리)
# CLICKUP-PARTIAL: z8nfn6ma7w | Korean ID만 검증. ARC(외국인 신분증)는 외국인 계정(test123)이 필요해 미커버, 카메라 촬영은 BLOCKED
# ----------------------------------------------------------------
# 2026-08-18 신규. 사용자 지시: **카메라 촬영은 BLOCKED로 두고 갤러리 업로드만** 검증한다.
#   (촬영 버튼 `captureBtnImageView`의 노출까지만 확인하고 누르지 않는다)
#
# 경로: koreanIdLayout → "한국 신분증 변경"(toolbar_title) → take_photo("사진 등록")
#   → `ocr.OCRImageCaptureActivity` → **galleryBtnImageView** → Android 사진 선택 도구
#   → `util.NativeCropActivity` → "완료"(${REG_DONE_GALLERY}) → **OCR 결과 화면** → uploadPhoto("업로드")
#   → 접수 완료 화면(btn_okay "확인") → 정보 수정 복귀
#
# 화면별 실측(2026-08-18):
#   신분증 변경   passportTitle("한국인 신분증 사진") / info("주민등록증 또는 운전면허증 사진을 찍어주세요")
#                 / image / take_photo("사진 등록")   ※ **이 화면엔 갤러리 버튼이 없다**
#   OCR 촬영     btnClose / viewFinder / hintText / privacyCautionText
#                 / captureBtnImageView(셔터) / **galleryBtnImageView(갤러리)** ← 여기에 있다
#   OCR 결과     capturedImage / details("스캔한 세부 정보") / idtext+idvalue / nametext+namevalue
#                 / retakePhoto("사진 재등록") / uploadPhoto("업로드")
#   접수 완료    doneLayout / doneImage / completeText("정보")
#                 / "서류가 정상적으로 접수되었습니다. 담당자의 확인 후 승인이 완료됩니다." / btn_okay("확인")
#
#
# ⚠️⚠️ **실행 전 `push_test_images.ps1`을 먼저 돌려야 한다 (2026-08-20 사고로 추가)**
#   이 케이스는 사진 피커에서 **`icon_thumbnail` index**로 이미지를 고르는데, 그 인덱스는
#   "테스트 이미지 4장이 갤러리 최신 4개"라는 전제에 기대고 있다.
#   🚫 **종전 주석의 "run_test.ps1이 매 실행 직전 4장을 push한다"는 사실이 아니었다** —
#     run_test.ps1에는 push 로직이 아예 없다(env 파싱 + maestro 실행뿐).
#     그 사이 08_마이QR_수신과송금이 저장한 `gmeqr (N).jpg`가 26장 쌓여 최신 앞자리를 차지했고,
#     index 1이 ARC가 아니라 **QR 이미지**가 되어 앱이
#     **"OCR이 유효하지 않습니다. 고객센터에 문의해 주세요."**(`txvDialogTitle` "실패 - (…)")로
#     업로드를 거부했다. 즉 인덱스가 밀리면 **앱 오류처럼 보이는 실패**가 난다.
#   → `.\push_test_images.ps1` 이 4장을 다시 push하고 최신순을 고정한다
#     (index 0=Global QR / 1=ARC / 2=ID Card / 3=Passport).
# 갤러리 인덱스: push_test_images.ps1이 4장을 push하고 최신순을 고정한다
#   → 0=Global QR / 1=ARC / **2=ID Card(주민등록증)** / 3=Passport. 그래서 index 2다.
#   ⚠️ [01-6]이 카메라로 찍은 사진이 갤러리에 계속 쌓이지만, push한 4장이 항상 더 최신이라
#     0~3 인덱스는 흔들리지 않는다.
#
# OCR 검증: 업로드 전 화면이 주민등록번호와 이름을 뽑아준다. 테스트 이미지
#   `1. ID Card_Korean.jpg`는 **이 계정 본인의 신분증**이라 값이 등록 정보와 일치한다
#   (`880818-1******` / `이승수`) → 값이 뒤바뀌면 실패하도록 둘 다 assert한다.
#
# ⚠️⚠️ **이 케이스는 멱등하지 않다 — 한 번 업로드하면 담당자 승인 전까지 촬영 경로가 막힌다.**
#   재진입하면 촬영 화면 대신 접수 완료 화면(doneLayout)이 바로 뜬다
#   (passportTitle도 "한국인 신분증 사진" → "신분증 사진"으로 바뀐다).
#   → 그래서 `take_photo` 존재 여부로 분기한다:
#      · 촬영 가능 상태 → 갤러리 업로드 전 구간 수행
#      · 심사 대기 상태 → **업로드 구간을 건너뛰고 접수 상태만 확인**(로그에 SKIPPED로 남는다)
#   ⚠️ 로그에 `Run flow when id: take_photo is visible... SKIPPED`가 보이면 **업로드 경로는
#     이번 실행에서 검증되지 않은 것**이다. 전 구간을 다시 돌리려면 담당자 승인이 필요하다.
#   ⚠️ 승인 후 재실행하면 **매번 새 심사 건이 접수된다** — 담당자에게 부담이 가는 케이스라
#     리그레션에 무심코 반복하지 말 것.
#
# ⚠️ 신분증 화면들은 **FLAG_SECURE**다 — `takeScreenshot`이 실패하고(adb screencap도 0바이트)
#   플로우가 통째로 EXIT=1이 된다. **이 구간에는 스크린샷을 넣지 말 것**([[feedback_flagsecure_verify]]).
- scrollUntilVisible:
    element:
      id: "editProfileLayout"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "editProfileLayout"
- extendedWaitUntil:
    visible:
      id: "koreanIdLayout"
    timeout: 20000
- assertVisible:
    id: "koreanId"
- takeScreenshot: "[01-7-1]_정보수정_한국신분증행"
- tapOn:
    id: "koreanIdLayout"
- extendedWaitUntil:
    visible:
      text: "${CHANGE_KOREAN_ID}"
    timeout: 20000
- assertVisible:
    id: "passportTitle"

# ---- 업로드 경로: 심사 대기 중이 아닐 때만 탈 수 있다 ----
- runFlow:
    when:
      visible:
        id: "take_photo"
    commands:
      - assertVisible:
          id: "info"
      # 촬영 화면 진입 — 셔터는 노출만 확인하고 누르지 않는다(카메라 촬영 = BLOCKED)
      - tapOn:
          id: "take_photo"
      - extendedWaitUntil:
          visible:
            id: "galleryBtnImageView"
          timeout: 20000
      - assertVisible:
          id: "captureBtnImageView"
      - assertVisible:
          id: "hintText"
      - tapOn:
          id: "galleryBtnImageView"
      # ⚠️ 2026-09-14: 여기도 **OS 사진 피커가 갈린다** — 프로필 사진 경로(위)에 2026-09-09 에
      #   넣은 분기가 이 신분증 경로에는 빠져 있었다(그날은 삼성 갤러리로 떠서 드러나지 않았다).
      #   · 삼성 갤러리  → 썸네일 id `icon_thumbnail` + index
      #   · Android 16 시스템 피커 → **id 없음 · 접근성 라벨도 매칭 불가** → 좌표뿐이다
      #     (1080x2340 실측: index 0=16%,48% / 1=50%,48% / **2=83%,48%** / 3=16%,64%)
      #   index 2 = 갤러리 3번째 = ID Card(`push_test_images.ps1` 배치 순서에 의존한다)
      - extendedWaitUntil:
          visible: "사진|Photos|icon_thumbnail"
          timeout: 20000
      - runFlow:
          when:
            visible:
              id: "icon_thumbnail"
          commands:
            - tapOn:
                id: "icon_thumbnail"
                index: 2
      - runFlow:
          when:
            notVisible:
              id: "icon_thumbnail"
          commands:
            - tapOn:
                point: "83%, 48%"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "${REG_DONE_GALLERY}"
          timeout: 20000
      - tapOn: "${REG_DONE_GALLERY}"
      # Android 16 피커 경로에서는 크롭 "완료"가 한 번에 안 먹는 경우가 있다(프로필 사진 쪽과 동일)
      #   → OCR 결과 화면(`uploadPhoto`)에 도달할 때까지 완료를 다시 누른다.
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  notVisible:
                    id: "uploadPhoto"
                commands:
                  - runFlow:
                      when:
                        visible: "${REG_DONE_GALLERY}"
                      commands:
                        - tapOn: "${REG_DONE_GALLERY}"
                        - waitForAnimationToEnd
      # OCR 결과 — 주민등록번호·이름이 등록 정보와 일치하는지
      - extendedWaitUntil:
          visible:
            id: "uploadPhoto"
          timeout: 30000
      - assertVisible:
          id: "capturedImage"
      - assertVisible:
          id: "details"
      - assertVisible:
          id: "idvalue"
      - assertVisible: ".*880818-1.*"
      - assertVisible:
          id: "namevalue"
      - assertVisible: ".*이승수.*"
      - assertVisible:
          id: "retakePhoto"
      - tapOn:
          id: "uploadPhoto"

# ---- 두 경로 합류: 접수 완료 / 심사 대기 화면 ----
- extendedWaitUntil:
    visible:
      id: "btn_okay"
    timeout: 30000
- assertVisible:
    id: "completeText"
- assertVisible: "${DOC_UPLOADED_PENDING}"
- tapOn:
    id: "btn_okay"
- extendedWaitUntil:
    visible:
      text: "${EDIT_INFO_TEXT}"
    timeout: 30000
# 승인 전이라 표시값은 그대로다(업로드한 이미지도 같은 사람의 신분증이라 값이 안 바뀐다)
- assertVisible:
    id: "koreanId"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_profile"


