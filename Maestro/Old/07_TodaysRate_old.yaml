appId: ${APP_ID}
---
# ================================================================
# 시나리오: Today's Rate (오늘의 환율) — 구 UI
# ================================================================
#  진행: 2026-08-18 구 UI 기준 **전면 재작성**. 이전 버전은 개편 UI 기준이라 진입부터 깨졌다.
#
# 실행 전 확인 — 이 액티비티가 아니면 이 파일을 돌리지 말 것:
#   adb shell dumpsys window | Select-String mCurrentFocus
#     → ...homeV2.view.HomeActivityV2
#
# ⚠️ **한국인 계정(seungsoo818) 기준.** 외국인 계정에는 홈에 환율 영역이 없다(09_Home_old 헤더 참고).
#
# 개편UI → 구 UI 전환에서 실제로 바뀐 것 (2026-08-18 실측):
#   홈 진입   홈의 "오늘의 환율"은 **서비스 그리드 항목**이고 그걸 탭하면 ExchangeRateActivity로 간다.
#             ⚠️ **`rlExchangeRateView`는 이 빌드의 홈에 존재하지 않는다**(7.19.1-livetest).
#             09_Home_old [11]이 그 id를 쓰고 있으니 그 케이스도 언젠가 깨질 수 있다 — 확인 필요.
#   홈 판정   `text: "Home"` → **id `btnTransfer`**
#   화면      `exrate.view.ExchangeRateActivity` — 구 UI는 native라 **id가 다 살아 있다**
#             toolbar_title / paymentModeRV + paymentModeTitleTxt / sendAmountEdTxt /
#             ll_transfer_fee_section + transferFeeTxtView / ll_exchange_rate_section +
#             exchangeRateTxtView / receiveAmountEdTxt / countrySelectionSpinner +
#             recepientCurrencyTextView / exRateCalculateButton
#   통화 선택 개편UI는 `tapOn: "USD"` → 구 UI는 **`countrySelectionSpinner`**(id).
#             다이얼로그: dialog_title_txt("통화 선택") / iv_cancel("취소") /
#             **searchEditText**(hint "국가별 검색") / countryListRv + countryName("Bangladesh (BDT)")
#   환율 탭   개편UI는 텍스트만 있었으나 구 UI는 **탭 컨테이너에 id가 있다**:
#             cl_tab1 + title_tab1("최적의 환율") + body2_tab1("15분 ~ 1일")
#             cl_tab2 + title_tab2("특급 환율")   + body2_tab2("5-10분")
#   송금 버튼 `exRateCalculateButton` 하나인데 **라벨이 상태에 따라 바뀐다**:
#             환율 계산 전 "계산하기" → 계산 후 **"지금 송금하기"**(=${RATE_SEND_BTN})
#             → 그래서 버튼은 **id로 탭하고**, 라벨은 assert하지 않는다.
#
# ⚠️ **진입 시 오류 다이얼로그가 뜬다 (2026-08-18 실측, 앱/서버 이슈 의심)**
#   기본 통화가 USD인 상태로 화면이 열리면서 곧바로
#     txt_dialog_title "오류 - (06640154622502)" / txt_dialog_message "Error Calculating rate"
#     / btn_diaog_ok "확인"
#   이 뜨고, transferFeeTxtView·exchangeRateTxtView가 **빈 값**으로 남는다.
#   방글라데시(BDT)를 선택하면 정상 계산되므로 **USD 기본 상태에서만 실패**하는 것으로 보인다.
#   케이스 진행에는 지장이 없어 조건부로 닫고 계속한다(안 뜨면 SKIP된다). 개발팀 확인 필요.
#
# ※ 값(환율·금액)은 실시간으로 바뀌므로 **존재 여부만** 본다. 하드코딩 금지.
#   sendAmountEdTxt는 통화를 바꾸면 재계산돼 값이 달라진다(100,000 → 1,156,029 실측).
#
# ClickUp `[Today's Rate] 시나리오` 대조 — 2026-08-18
#   ✅ 커버완료 1건 (= 이 시나리오의 **유일한** ClickUp 케이스)
#      z8nfn6ma5z  나라별 환율계산 - 방글라데시 선택 시 Best/Express Rate 노출 → [02]
#   ※ [01]/[03]/[04]는 ClickUp에 대응 케이스가 없다(회귀 방지용으로 유지).
#
# 케이스 목록:
#   [01] [High]   오늘의 환율 진입 및 기본 요소 확인
#   [02] [High]   방글라데시(BDT) 선택 → 최적의 환율 / 특급 환율 / bKash 노출 확인
#   [03] [Medium] 특급 환율 탭 선택 → 지급 시간·설명 변경 확인
#   [04] [Medium] 지금 송금하기 → 해외송금 수취인 선택 화면 이동
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\07_TodaysRate_old.yaml"
#   .\run_test.ps1 -lang en -flow "Old\07_TodaysRate_old.yaml"
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 ----------------
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
# 잠금화면을 명시적으로 대기한 뒤 PIN 입력(캐시된 홈에 먼저 매칭되는 레이스 회피).
# 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수 — 오입력 누적은 계정 잠금이다.
- runFlow:
    when:
      visible:
        text: "4자리 숫자를 입력하세요"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "보이스 피싱 주의"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "나중에 하기"
    commands:
      - tapOn: "나중에 하기"
      - waitForAnimationToEnd
# 인앱 배너 팝업은 id로 정확히 닫는다(범용 "닫기" 문자열 탭은 다른 X를 눌러 사고 이력이 있다)
- runFlow:
    when:
      visible:
        # ⚠️ 인앱 배너 닫기 id는 **빌드마다 다르다**(2026-08-27 실측):
        #   7.19.x = `btnTwo` / **7.20.0 = `btnClose`**(+ `btnDontShowToday` "오늘 하루 보지 않기").
        #   Maestro id는 정규식이라 둘을 함께 받는다. 배너가 홈 요소를 덮어
        #   `btnTransfer` assert가 실패하는 사고가 있었다.
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
      # ⚠️ 맹목적 팝업 닫기다 — 무엇이 떠 있는지 모른 채 아무 X나 누른다.
      #   2026-08-25에 엉뚱한 X를 눌러 **앱이 런처로 빠져나간** 사고가 있었다.
      #   지우지 않는 이유: 앞의 id 기반 핸들러(`btnTwo|btnClose` 등)로 닫히지 않는 팝업이
      #   남을 수 있어 진입이 막힌다. 대신 **이미 홈에 도달했으면 누르지 않도록** 가드를 좁혔다.
      #   ⛔ 이 패턴을 새로 만들지 말 것 — 닫아야 할 팝업의 id를 알면 id로 닫는다.
      notVisible:
        id: "btnTransfer"
    commands:
      - tapOn: "닫기"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 30000

# ----------------------------------------------------------------
# [01] [High] 오늘의 환율 진입 및 기본 요소 확인
# ----------------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "${RATE_SCR_TITLE}"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "${RATE_SCR_TITLE}"
# ⚠️ 오류 다이얼로그는 **별도 윈도우로 화면 전체를 덮는다** — 떠 있는 동안 toolbar_title이
#   접근성 트리에서 아예 안 보인다. 그래서 **다이얼로그를 먼저 닫고** 화면 판정을 해야 한다
#   (순서를 바꾸면 `toolbar_title is visible` FAILED로 죽는다 — 2026-08-18 실측).
#   뜨는 타이밍이 일정하지 않아 3회에 걸쳐 확인한다. 안 뜨면 매번 SKIP되므로 무해하다.
- repeat:
    times: 3
    commands:
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: "btn_diaog_ok"
          commands:
            - tapOn:
                id: "btn_diaog_ok"
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "toolbar_title"
    timeout: 20000
- assertVisible: "${RATE_SCR_TITLE}"
- assertVisible: "${RATE_PAYMENT_METHOD}"
- assertVisible:
    id: "paymentModeRV"
- assertVisible: "${INIT_TAB_BANK}"
- assertVisible: "${INIT_TAB_CASH}"
- assertVisible: "${RATE_SEND_AMOUNT}"
- assertVisible:
    id: "sendAmountEdTxt"
- assertVisible: "${RATE_RECEIVE_AMOUNT}"
- assertVisible:
    id: "receiveAmountEdTxt"
- assertVisible:
    id: "countrySelectionSpinner"
- assertVisible:
    id: "exRateCalculateButton"
- takeScreenshot: "[01]_오늘의환율_진입"
- pressKey: back
- waitForAnimationToEnd
# ⚠️ 홈 복귀 판정 두 가지 함정 (둘 다 2026-08-18 실측 FAILED로 확인)
#   1) `btnTransfer`를 쓰면 안 된다 — 그리드까지 스크롤한 상태로 돌아오므로 상단의 송금 버튼이
#      화면 밖이라 접근성 트리에 없다. 스크롤과 무관한 **하단 내비(`bottom_item_home`)**로 판정한다.
#   2) 홈으로 돌아오면 **인앱 배너 팝업이 다시 뜬다**(진입 때 닫아도 재등장한다). 이 팝업이
#      떠 있는 동안은 홈 요소가 하나도 안 보이므로 **먼저 닫아야** 한다.
- runFlow:
    when:
      visible:
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 20000

# ----------------------------------------------------------------
# [02] [High] 방글라데시(BDT) 선택 → 최적의 환율 / 특급 환율 / bKash 노출 확인
# CLICKUP: z8nfn6ma5z
# ----------------------------------------------------------------
# ※ 검색어는 ASCII("bangladesh")여야 한다 — Maestro inputText는 한글을 넣지 못한다.
# ※ BDT를 고르면 송금 방법에 **bKash가 추가**되고 환율 탭 2종이 나타난다(USD에는 둘 다 없다).
- scrollUntilVisible:
    element:
      text: "${RATE_SCR_TITLE}"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "${RATE_SCR_TITLE}"
- repeat:
    times: 3
    commands:
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: "btn_diaog_ok"
          commands:
            - tapOn:
                id: "btn_diaog_ok"
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "toolbar_title"
    timeout: 20000

# 통화 선택 다이얼로그
- tapOn:
    id: "countrySelectionSpinner"
- extendedWaitUntil:
    visible:
      id: "searchEditText"
    timeout: 20000
- assertVisible: "${RATE_CURRENCY_SELECT}"
- assertVisible:
    id: "countryListRv"
- tapOn:
    id: "searchEditText"
- inputText: "bangladesh"
- extendedWaitUntil:
    visible: "Bangladesh \\(BDT\\)"
    timeout: 15000
- tapOn: "Bangladesh \\(BDT\\)"

# 계산 완료 대기 — 환율 탭 영역(llSelectorView)이 나타나면 계산이 끝난 것이다
- extendedWaitUntil:
    visible:
      id: "llSelectorView"
    timeout: 30000
- assertVisible:
    id: "recepientCurrencyTextView"
- assertVisible: "BDT"
# 핵심 검증: 최적의 환율 / 특급 환율 / bKash
- assertVisible:
    id: "title_tab1"
- assertVisible: "${RATE_BEST}"
- assertVisible:
    id: "title_tab2"
- assertVisible: "${RATE_EXPRESS}"
- assertVisible: "bKash"
# 환율이 실제로 계산됐는지(값은 실시간이라 존재만 확인)
- assertVisible:
    id: "exchangeRateTxtView"
- assertVisible: "${RATE_CURRENT}"
- assertVisible:
    id: "gmeExratePC"
- takeScreenshot: "[02]_방글라데시_환율계산"

# ----------------------------------------------------------------
# [03] [Medium] 특급 환율 탭 선택 → 지급 시간·설명 변경 확인
# ----------------------------------------------------------------
# 기본 선택은 최적의 환율(15분 ~ 1일). 특급으로 바꾸면 payout_time과 note가 5-10분으로 바뀐다.
- assertVisible:
    id: "payout_time"
- tapOn:
    id: "cl_tab2"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "${RATE_EXPRESS_DESC}"
    timeout: 20000
- assertVisible:
    id: "note"
- assertVisible: ".*5-10.*"
- takeScreenshot: "[03]_특급환율_지급시간변경"

# ----------------------------------------------------------------
# [04] [Medium] 지금 송금하기 → 해외송금 수취인 선택 화면 이동
# ----------------------------------------------------------------
# ⚠️ 버튼 라벨은 상태에 따라 "계산하기"/"지금 송금하기"로 바뀌므로 **id로 탭한다**.
#   도착지는 `schedule_payment.SchedulePaymentActivity`(toolbar_title "해외송금").
#   수취인을 고르지 않으므로 실제 송금은 발생하지 않는다.
- tapOn:
    id: "exRateCalculateButton"
- extendedWaitUntil:
    visible: "${SCR_SELECT_RECIPIENT}"
    timeout: 30000
- assertVisible:
    id: "recipientListRv"
- takeScreenshot: "[04]_해외송금_수취인선택"
# 오늘의 환율 → 홈 복귀
- pressKey: back
- waitForAnimationToEnd
- assertVisible: "${RATE_SCR_TITLE}"
- pressKey: back
- waitForAnimationToEnd
# 위와 같은 이유로 배너를 닫고 하단 내비로 판정한다
- runFlow:
    when:
      visible:
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 20000
