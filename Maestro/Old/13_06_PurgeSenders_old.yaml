appId: ${APP_ID}
---
# ⚠️ 2026-09-14: 진입 가드를 **id 로 바꿨다.** 종전 한국어 문구 대안 매칭
#   (`"4자리 숫자를 입력하세요|홈으로"`)은 **en 실행에서 진입부터 막았다**(영문 UI 는
#   `Enter the 4-digit number`/`Home`). 이 가드가 26개 파일 55곳에 있었다.
#   id 는 언어에 흔들리지 않는다: 잠금화면·PIN 생성=`input_dot_1` / 홈=`bottom_item_home`
#   / Server Override=`button1`.
# ================================================================
# 13_ReceiveOverseas 분할 6/7 — 등록된 송금인 일괄 삭제
# ================================================================
# 2026-09-07 분할. 원본 `13_ReceiveOverseas_old.yaml`(20케이스 / 통짜 약 42분)은 실행이
# **10분 포그라운드 한도**를 넘어 백그라운드로 전환되고, 그 뒤 외부에서 종료되는 일이
# 반복됐다(9/7 실측: 백그라운드 전환 7건 중 6건 종료 / 10분 미만 실행은 전부 완주).
# → 각 조각이 10분 안에 끝나도록 잘랐다. 합계는 약 48분으로 통짜보다 6분 늘지만
#   (공통 진입이 1회→7회), 끊김이 사라지고 실패해도 손실이 조각 하나로 제한된다.
#
# ⚠️ **순서 의존 — 반드시 13_01 → 13_02 → … → 13_07 순으로 돈다.**
#   데이터 사슬: 01~03이 송금인 3국을 등록 → 04가 **인도네시아**로 송금요청 신청 →
#   05가 **베트남** 송금인 정보 수정 → 06이 등록된 송금인을 **전부 삭제** →
#   07은 04가 만든 **요청**의 상태 화면을 본다(송금인과 무관해 06 뒤라도 성립).
#
# 이 파일: 사양의 마무리 — 목록이 빌 때까지 첫 행을 반복 삭제한다
#   예상 약 9분 30초 / 전제: 13_01~13_05 완료. **반드시 13_05 뒤**여야 한다(먼저 지우면 04/05가 쓸 데이터가 사라진다)
# ================================================================

# ================================================================
# 시나리오: Receive Overseas Funds (Inbound)
# ================================================================
# 2026-07-08 구조 변경: 케이스마다 Home으로 완전히 나갔다가 재진입하던 방식을 없애고,
# 가능한 한 이전 케이스가 끝난 화면에서 바로 다음 케이스를 이어서 진행하도록 수정함.
# 다만 [15]~[20](Inbound Request Status)은 "해외송금 받기"를 Home에서 새로 탭해야만
# "받는 계좌" 카드 목록이 노출되는 구조라, [13]->[15] 전환과 [18]->[19]->[20] 사이는
# 여전히 Home 경유가 필요함(안전을 위해 유지 - [20]은 실제 결제 페이지로 연결되므로
# 내비게이션 스택을 확신할 수 없는 구간은 보수적으로 Home으로 리셋함).

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 ----------------
- launchApp
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|button1"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "input_dot_1|bottom_item_home"
          timeout: 60000
# PIN <정상 PIN> — 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수(오입력 누적 = 계정 잠금)
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
# 인앱 배너 팝업은 id로 정확히 닫는다(범용 "닫기" 문자열 탭은 다른 X를 눌러 사고 이력이 있다)
- runFlow:
    when:
      visible:
        # ⚠️ 인앱 배너 닫기 id는 **빌드마다 다르다**(2026-08-27 실측):
        #   7.19.x = `btnTwo` / **7.20.0 = `btnClose`**(+ `btnDontShowToday` "오늘 하루 보지 않기").
        #   Maestro id는 정규식이라 둘을 함께 받는다. 배너가 홈 요소를 덮어
        #   `btnTransfer` assert가 실패하는 사고가 있었다.
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 30000

# Receive Overseas Funds 진입: Home > 해외송금 받기 (전체 [01]~[14] suite 진입 시 1회만)
# 계정에 완료된 인바운드 Request가 있으면 [01]~[14]가 기대하는 수취인 목록 화면이 아니라
# **요청 쪽 화면이 먼저 뜬다.** 2026-09-04 실측으로 경로가 둘인 것이 확인됐다:
#   ① "받는 계좌" 카드 목록(rvAccountList) — 카드를 탭해야 상세로 들어간다
#   ② 곧바로 **요청 상세**(ReceiveMoneyInboundDetailActivity, `tv_req_complete`) — 요청이
#      1건일 때 카드 목록을 건너뛰고 직행했다. 종전 코드는 ①만 알아서 여기서 조용히 멈췄고,
#      뒤따르는 [10]이 "송금인 등록하기"를 못 찾아 죽었다.
# 두 경로 모두 상세의 **"다른 요청 진행"** 에서 만나므로 순서대로 처리한다.
- runFlow: "_enter_receive_overseas_old.yaml"
- runFlow: "_inbound_goto_sender_list_old.yaml"
# ================================================================
# 사후처리: **등록된 모든 송금인을 삭제한다** (2026-09-07 사용자 지시)
# ================================================================
# "모든 케이스 확인 후 등록된 모든 송금인 삭제."
#   [07]·[07-1]이 등록 직후 지우던 것을 여기로 모았다 — [10]~[12]가 인도네시아를,
#   [14]가 베트남을 써야 하므로 중간에 지우면 안 되기 때문이다.
#
# ★★ 2026-09-08 재설계 — 9/7 판에서 "읽은 행과 지운 행이 달랐던" 원인을 실기기로 규명해 고쳤다.
#
#   ① **`copyTextFrom` 이름 판정을 버렸다.**
#      Maestro 의 `index` 는 "목록의 N번째 행"이 아니라 **그 순간 화면에서 y가 가장 위인 요소**다
#      (Filters.INDEX_COMPARATOR = compareBy(bounds.y, bounds.x)). `copyTextFrom` / `tapOn` 은
#      명령마다 계층을 새로 뜨므로, 그 사이 목록이 갱신·스크롤되면 **읽은 행과 누른 행이 갈린다.**
#
#   ② **`moreIcon` 하나만 믿지 않는다 — 토글이라 위상이 어긋난다.**
#      삭제 후 목록이 갱신되면 남은 행이 **열린(휴지통 노출) 상태로 렌더**되는 경우가 있다(실측).
#      그 상태에서 `moreIcon` 을 누르면 오히려 **닫혀서** 뒤따르는 `delete` 탭이 카드에 먹힌다.
#      반대로 **닫힌 행의 `delete` 를 그냥 누르면 카드가 터치를 가로채 아무 일도 안 일어난다**
#      (2026-09-08 SM-S911N 실측 — 구 기기와 동작이 달랐다).
#      → **`moreIcon` → `delete` 를 다이얼로그가 뜰 때까지 번갈아** 누른다.
#        어느 상태에서 시작하든 다음 회차가 바로잡아 같은 행으로 수렴한다.
#
#   ③ 행 위치는 고정 퍼센트 스와이프 대신 **`scrollUntilVisible` + `centerElement`** 로 잡는다.
#      맨 위로만 올리면 첫 행이 **하단 플로팅 버튼("송금인 등록하기")에 가려** 탭이 버튼에 먹힌다.
#
# ⚠️ **2026-09-08 사용자 지시로 "삭제 후 홈 왕복"을 제거했다.**
#   종전 판은 회차마다 홈으로 나갔다 재진입해 목록을 새로 받아왔다(구 기기에서는 재진입 없이
#   돌리면 `예`까지 눌리고도 안 지워지는 사례가 있었다 — 2026-09-08 실측). 지금은 제자리에서
#   삭제 후 갱신을 기다린다. 갱신이 안 되면 **마지막 판정(`assertNotVisible: id: tv_detail1`)에서
#   FAIL 로 드러난다** — 조용히 통과하지는 않는다.
#
# ⚠️ 회차 수는 **8회**다. 이 파일이 만드는 건 3건이지만, 계정에 예전 송금인이 남아 있거나
#   앞 조각이 중간에 실패해 잔재(예: 13_04의 `Test Sender2`)가 생기면 4회로는 모자란다
#   (2026-09-08 seungsoo818 실측: 5건이 남아 마지막 판정에서 FAIL 했다).
#   목록이 비면 회차 전체가 조건 블록에서 SKIP 되므로 늘려도 비용이 거의 없다.
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible:
              id: "tv_detail1"
          commands:
            # (1) 첫 행을 화면 중앙으로 (상단 클리핑·하단 버튼 가림을 동시에 피한다)
            - scrollUntilVisible:
                element:
                  id: "tv_detail1"
                direction: DOWN
                centerElement: true
                timeout: 20000
            - waitForAnimationToEnd
            # (2) 삭제 다이얼로그가 뜰 때까지 **`moreIcon` → `delete` 를 번갈아** 누른다.
            #   · 행이 닫혀 있으면 `moreIcon` 이 슬라이드를 열고, 이어지는 `delete` 가 다이얼로그를 띄운다.
            #   · 이미 열려 있으면 `moreIcon` 이 닫아버리지만 다음 회차가 다시 열어 바로잡는다.
            #   ⚠️ **닫힌 행의 `delete` 를 그냥 누르면 카드가 터치를 가로채 아무 일도 안 일어난다**
            #     (2026-09-08 SM-S911N 실측) → `moreIcon` 을 빼면 안 된다.
            - repeat:
                times: 3
                commands:
                  - runFlow:
                      when:
                        notVisible: "${DELETE_INBOUND_RECIPIENT}"
                      commands:
                        - tapOn:
                            id: "moreIcon"
                            index: 0
                        - waitForAnimationToEnd
                  - runFlow:
                      when:
                        notVisible: "${DELETE_INBOUND_RECIPIENT}"
                      commands:
                        - tapOn:
                            id: "delete"
                            index: 0
                        - waitForAnimationToEnd
            # 여기서 실패하면 탭이 카드·플로팅 버튼에 먹힌 것이다(조용히 넘어가지 않게 둔다)
            - extendedWaitUntil:
                visible: "${DELETE_INBOUND_RECIPIENT}"
                timeout: 15000
            - tapOn: "예"
            - waitForAnimationToEnd
            # (3) 목록 갱신 대기 — 약 8초(사용자 실측). Maestro 에 sleep 이 없어
            #     화면 좌측 끝에서 **이동 없는 스와이프**(빈 영역 롱프레스)로 대신한다.
            - swipe:
                start: "2%, 50%"
                end: "2%, 50%"
                duration: 9000
            - waitForAnimationToEnd

# ================================================================
# 판정: 목록이 비었는지 확인한다 (제자리 — 홈 왕복 없음)
# ================================================================
- takeScreenshot: "[13_06]_수취인목록_비움확인"
# `tv_detail1` 은 수취인 행의 이름 필드라, 하나라도 남아 있으면 잡힌다.
- assertNotVisible:
    id: "tv_detail1"
# 보조: 이 파일이 만든 세 건을 이름/번호로도 확인한다.
#   ⚠️ 베트남은 [14]가 Full Name 을 **"VN EDIT TEST"로 바꿔 놓는다** → 원래 이름으로 보면
#     항상 없으므로 무의미한 단언이 된다(2026-09-07 정정).
- assertNotVisible:
    text: "081200099001"
- assertNotVisible:
    text: "TESTMN SENDER"
- assertNotVisible:
    text: "VN EDIT TEST"

# 종료: 다음 조각(13_07)이 홈에서 시작하므로 홈까지 복귀해 둔다.
#   (삭제 회차마다 하던 홈 왕복과는 다른, 파일의 마무리 단계다)
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible:
              id: "bottom_item_home"
          commands:
            - pressKey: back
            - waitForAnimationToEnd
