#   폼을 열어 이름을 바꾸고 제출까지 하지만, 그 뒤 `btnContactSupport1`("아니요")을 누르면
#   변경이 되돌아간다고 아래 주석이 적고 있고, 실제로 `TESTUPDATE GME` 은 계정에 존재하지 않는다
#   (`02_02_해외송금_예약송금_old.yaml` 상단 주석의 같은 기록 참조).
#   → 즉 **수정 동작은 수행하지만 성립은 검증하지 않는다 = 커버리지 착시**다.
#   체크리스트 #241(기 등록 수취인 정보 수정)은 그래서 `02_02 [05-1]` 에 **성립 단언까지 있는
#   케이스로 새로 썼다.** 거기서 반영 여부가 가려지면 이 구간도 같이 손볼 것.
# 수취인 수정: First Name TEST → TESTUPDATE 변경 시도
