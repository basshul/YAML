# ★ 삭제가 **성립**했는지 본다 (2026-10-07 추가)
#   종전에는 moreIcon → delete → 확인 까지만 하고 **사라졌는지를 보지 않았다**.
#   바로 아래 수취인 **수정** 구간도 같은 문제였고(수행만 하고 반영 미검증 = 커버리지 착시)
#   2026-10-02 에 성립 단언을 붙여 고쳤다 — 삭제만 예외로 두면 일관성이 깨진다.
#   체크리스트 #224(기 등록된 수취인 삭제 동작 확인)가 이 단언으로 성립한다.
# ⚠️ 이 수취인은 **직전 실행의 `[01]` 이 만든 것**이다(TEST GME → TESTUPDATE 로 개명).
#   그래서 두 번째 실행부터는 위 조건부 블록이 **반드시 한 번 돈다.**
#   계정이 완전히 깨끗한 최초 실행에서는 지울 것이 없어 이 단언만 통과한다.
- assertNotVisible:
    text: ".*TESTUPDATE.*"

# ================================================================
# [01] 수취인 추가 → 수정
# ================================================================

# 수취인 추가하기
- tapOn: "${ADD_RECIPIENT_TEXT}"

# 국가: Sri Lanka
- tapOn:
