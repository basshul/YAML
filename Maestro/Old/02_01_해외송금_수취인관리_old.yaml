#     · 수취 방법   `recieverPaymentMethodSelectionFormInputField` (몽골은 은행 입금/월렛 등 복수)
#     · 키릴 이름·성 `recieverLocalFirstNameFormInputField` / `recieverLocalLastNameFormInputField`
#     · 국적        `recieverNativeCountrySelectionFormInputField`
#   반대로 **구역(`recieverCityFormInputField`)은 몽골 폼에 없다** → 조건부로 감쌌다.
#   ✅ **2026-10-29 실기기 EXIT=0 — 한국어·몽골어 두 언어 모두.** 추가 → 목록 반영 → 삭제까지 완주.
#     이 케이스 본문은 **언어 무관**이다(값·셀렉터가 전부 id 아니면 env 변수다).
#     ⚠️ 그날 기기에는 `stag`·`livetest` 패키지가 깔려 있지 않아 **운영 빌드로 돌렸다.**
#       이 케이스는 송금·결제를 하지 않으므로(추가하고 바로 지운다) 운영에서도 안전하다.
#     ⛔ 몽골어로 돌리려면 `.\run_test.ps1 -lang mn ...` — `env\mn.env` 는 **부분 파일**이고,
#       몽골어 값은 `\uXXXX` 로 적어야 한다(cmd 셰임이 인자를 MS949 로 재인코딩해 `ү`·`ө` 가
#       `?` 로 깨진다). 사유와 규칙은 `env\mn.env` 머리말에 적어 뒀다.
#
# 입력값(스크린샷):
#   국가 MONGOLIA / 수취 방법 은행 입금 / 은행 KHAN BANK / 계좌 5059080618
