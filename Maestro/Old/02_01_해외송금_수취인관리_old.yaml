appId: ${APP_ID}
# 송금액은 박지 않는다 — **앱이 알려주는 최소 송금액을 읽어 그대로 쓴다**(2026-09-23 전환).
#   최소 송금액은 환율 연동이라 매일 바뀐다(스리랑카: 08-31 12,017 / 09-23 11,923).
#   종전엔 그 위 여유값 14,000을 고정으로 넣었는데, 최소치가 오르면 죽고 잔액이 빠듯하면
#   잔액부족으로 빠져 송금이 성립하지 않았다(09-23 실제 발생: 14,000 vs 잔액 13,303).
#   ⚠️ 아래 값은 **최소치를 띄우기 위한 미끼**다 — 실제 송금액이 아니다. 충분히 낮기만 하면 된다.
env:
  SENDNOW_PROBE_AMOUNT: "5000"
---
# ================================================================
# 시나리오: Overseas Transfer - 수취인 추가 / 수정 / 삭제
# [01] [High] 수취인 추가 → 수정 → 삭제
# [02] [High] 수취인 추가 (※ **송금 구간은 주석 처리됨** — 2026-10-07)
#              ⛔ 이 파일은 더 이상 **실송금을 하지 않는다.** Wallet 송금 검증(#226·#227·#228)은
#                 `04_02_메뉴_거래내역_old.yaml [02]`(재송금)로 옮겼다 — 재송금은 수취인 추가·국가/은행/
#                 금액 입력을 건너뛰어 **같은 것을 훨씬 짧은 경로로** 확인하므로 테스트 시간이 줄어든다.
#              ★ 수취인 추가는 **그대로 남는다** — [04]가 여기서 추가한 GME TEST 에 의존한다.
#              ✅ 2026-08-31 운영(Live) 빌드 실송금 완주 이력은 주석 처리된 본문에 그대로 보존돼 있다.
# [03] [Medium] 실시간 송금 탭 - 수취인 화면 필터(설정) 동작 확인
# [04] [High]   실시간 송금 탭 - 수취인 추가 동작 확인 (Send Now)
# [05] [Medium] 수취인 추가 - 몽골 / 계좌 입금 (KHAN BANK) — 나라별 폼 차이 확인. 추가 후 삭제까지 한다
# ================================================================

# 앱 실행 및 홈 화면 진입
# 주의(2026-08-03): 기존 가드 `"Server Override|4자리 숫자를 입력하세요|홈"`은 launchApp 직후
#   잠깐 보이는 **캐시된 홈**에 먼저 매칭돼 PIN 입력 블록을 통째로 건너뛰었음 → 이후 실제
#   잠금화면이 떠서 "해외송금" 탭이 실패. 04_02_메뉴_거래내역.yaml의 검증된 패턴대로 잠금화면을
#   **명시적으로** 기다렸다가 PIN을 넣도록 변경. PIN 키패드는 매번 랜덤 배치라 좌표가 아닌
#   text("1"/"2")로 탭. PIN <정상 PIN>.
- launchApp
# Server Override(livetest 빌드 서버선택 스플래시)가 먼저 뜨면 처리
- runFlow: "_server_override_old.yaml"
# 간편비밀번호 잠금화면을 명시적으로 대기 후 PIN <정상 PIN>
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|securityKeyboardEditText"
    timeout: 60000
# 자동 로그아웃(세션 10분 만료)으로 재인증 화면에 떨어졌으면 비밀번호로 로그인한다
- runFlow: "_relogin_if_autologout_old.yaml"
# PIN <정상 PIN>. 키패드는 숫자를 누를 때마다 배치가 재섞이므로 각 탭 사이에 정착 대기를 넣어야
#   maestro가 직전 스냅샷의 stale 좌표를 눌러 오입력하는 사고를 막을 수 있음
#   (2026-08-04 실제로 "비밀번호가 맞지 않습니다"/"로그인 실패" 2회 발생 → 잠금 위험)
# ⚠️ **조건부로 감쌌다**(2026-08-28) — 세션이 살아 있으면 잠금화면 없이 홈으로 바로 떨어지는데,
#   그때 무조건 "1"을 누르면 홈에서 엉뚱한 요소를 탭한다(02_02와 동일한 수정).
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
- runFlow: "_server_override_old.yaml"
# 세션 만료 판정 — 실제 문구는 "로그인 세션이 만료되었습니다.
#   서비스를 이용하려면 다시 로그인해 주세요." 로 **개행이 섞인 두 문장**이다.
#   Maestro 텍스트는 전체매칭이라 `"로그인 세션이 만료"` 로는 **한 번도 잡히지 않았다**
#   (2026-08-28 확인) → 부분매칭엔 `[\s\S]*`가 필요하다.
#   그리고 구 UI에서 세션이 만료되면 **PIN으로 복구되지 않는다**(ID/비밀번호 재로그인 필요).
#   그래서 다이얼로그를 닫고 진행하는 대신 **여기서 실패시킨다** — 원인이 로그에 남아야
#   `01_01_로그인_정상_old.yaml`로 복구한 뒤 재실행할 수 있다.
#   ⚠️ 홈 대기보다 **앞**에 둔다. 뒤에 두면 홈 대기가 먼저 타임아웃 나서 원인이 가려진다.
- assertNotVisible:
    text: "${SESSION_EXPIRED}"
# 홈 도달 대기
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 20000
# 지문인증/팝업 처리
- runFlow:
    when:
      visible:
        text: "${REG_LATER}"
    commands:
      - tapOn: "${REG_LATER}"
- runFlow:
    when:
      visible:
        text: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
# ⛔ **범용 `tapOn: "닫기"`를 걷어냈다**(2026-08-28). 엉뚱한 X를 눌러 앱이 런처로 빠져나간
#   사고가 있었다(CLAUDE.md 참고). 인앱 배너는 id로 닫는다 — 7.19.x `btnTwo` / 7.20.0 `btnClose`.
- runFlow:
    when:
      visible:
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000
- waitForAnimationToEnd
# 홈 코치마크 balloon 처리
- runFlow:
    when:
      visible:
        id: "balloonClose"
    commands:
      - tapOn:
          id: "balloonClose"
      - waitForAnimationToEnd

# 해외송금 진입 (실시간 송금 탭)
- tapOn: "${TXT_OVERSEAS_REMIT}"
- extendedWaitUntil:
    visible:
      text: "${SCR_SELECT_RECIPIENT}"
    timeout: 10000

