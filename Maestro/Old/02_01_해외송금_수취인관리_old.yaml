#       국가/은행/금액 입력을 건너뛰어 **같은 것을 훨씬 짧은 경로로** 확인한다.
#   옮겨간 체크리스트 항목: #226(PIN 불일치) · #227(PIN 일치) · #228(영수증/다운로드).
#   ★ `[02]` 의 **수취인 추가까지는 그대로 살아 있다** — `[04]`(수취인 목록에 GME TEST 가
#     있는지)가 여기서 추가한 수취인에 의존하기 때문이다.
#   되돌리려면: 아래 `# ` 접두사를 걷어내고, 바로 위 "홈 복귀" 블록을 지우면 된다.
#   ⛔ 단, **되살리기 전에 `[02-1]`(영수증) 구간의 셀렉터를 고쳐야 한다.** 그때는 미검증 추정이었고
#      2026-10-07 실측 결과 **전부 틀렸다**: 성공 시트의 「영수증 보기」는 `btnOk` 가 아니라
#      **`btnVerifyBankAccount`**(= 잔액부족 팝업의 자동충전 「확인」과 **같은 id**), 영수증 화면은
#      `txvStatusValue`/`btn_download` 가 아니라 `SendMoneyV2TransactionCompleteActivity` 의
#      `transfer_label`/**`btn_pdf_down`** 이다. 올바른 판본은 `04_02_메뉴_거래내역_old.yaml [02]` 에 있다.
