#
# ⛔ **키릴 두 칸은 자동화로 채우지 않는다 — 채울 필요도 없다(2026-10-29 실측).**
#   ① maestro 는 비ASCII 입력을 거부한다. 드라이버 apk 안에 `" contains invalid ASCII characters"`
#     문자열이 그대로 있다(2.10.0 확인). `inputText` 는 adb 경로라 **기기에 몽골어 키보드를
#     추가해도 달라지지 않는다.**
#   ② **앱이 선택 항목이라고 명시한다.** 전화번호 바로 위 칸(`recieverLocalLastNameFormInputField`)의
#     라벨은 ko "현지 성 (Native Last Name) **(선택)**" / mn "Крилл овог **(Байгаа бол)**" 이다
