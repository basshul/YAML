    element:
      id: "scrollView"
    duration: 1200
- tapOn:
    id: "btn_submit"

# ★ 2026-10-02 실측 정정 — **종전 주석("아니요를 누르면 이름 변경이 취소된다")은 틀렸다.**
#   저장 성공 시트의 실제 내용은 이렇다:
#     `txvDialogTitle` "저장 성공"
#     `txvDialogDescription` "수취인 정보가 수정되었습니다. (줄바꿈) <바뀐 이름>에게 송금하시겠습니까?"
#     `btnVerifyBankAccount` "예" / `btnContactSupport1` "아니요"
#   즉 "아니요"는 **이어서 송금할지**에 대한 답이지 수정을 되돌리는 게 아니다.
#   **수정은 이미 반영된 상태**다(실기기에서 개명 → 저장 성공 → 목록 반영까지 확인).
#   종전에 `TESTUPDATE GME` 이 계정에 남아 있던 것도 "되돌아가지 않았다"는 증거다.
# ★ 성립 단언 추가 — 체크리스트 #241("기 등록된 수취인 정보 수정 동작 확인")이 보는 것이 이것이다.
#   종전에는 수정을 **수행만 하고 반영을 보지 않아** 커버리지 착시였다.
#   ※ 시트 문구 대신 **바뀐 이름이 시트에 찍히는지**로 판정한다 — 언어에 흔들리지 않는다.
- extendedWaitUntil:
    visible:
      id: "txvDialogDescription"
    timeout: 20000
- assertVisible:
    id: "txvDialogDescription"
    text: ".*TESTUPDATE.*"
- takeScreenshot: "[01]_수취인수정_저장성공"
- tapOn:
    id: "btnContactSupport1"
- waitForAnimationToEnd
# 목록에도 반영됐는가
- extendedWaitUntil:
    visible:
      text: "${SCR_SELECT_RECIPIENT}"
    timeout: 20000
- assertVisible: ".*TESTUPDATE.*"



