appId: ${APP_ID}
---
# ================================================================
# 01_02 간편비밀번호 오류 → 재로그인 테스트
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\01_02_Login_Wrong_SimplePassword_old.yaml"
#   ※ 기기가 1대면 `-device`를 적지 말 것 — 러너가 adb로 자동 감지한다. 시리얼은 교체된다.
#
# 사전 조건:
#   홈 화면 로그인 상태 **+ PIN이 등록돼 있어야 한다** (`01_01_Login_Success` 실행 후가 가장 확실).
#   ⛔ **PIN 미등록 상태에서는 이 파일이 성립하지 않는다** — 잠금화면이 아예 뜨지 않으므로
#     `[02]`의 오입력을 넣을 대상이 없다(2026-09-02 실측).
#     그 상태는 PIN 재등록 구간에서 플로우가 끊길 때 생기고, 액티비티가 `AutoLogoutActivity`로
#     찍혀 **자동 로그아웃으로 오진하기 쉽다**(실제 내용은 앱 내부 화면이었다).
#     → 복구는 `01_01_Login_Success_old.yaml`(clearState + 로그인 + PIN 설정)로만 된다.
#
# ⚠️ **간편비밀번호 5회 오입력의 결과는 "계정 잠금"이 아니라 "로그아웃"이다**(2026-09-02 사용자 확정).
#   → admin 개입 없이 복구된다: 로그아웃 → ID/비밀번호 로그인 → **신규 PIN 재등록**.
#     이 파일의 `[04][05]`가 그 복구를 그대로 수행하므로 **자가복구형**이고,
#     끝나면 로그인 상태로 다음 플로우에 인계된다.
#   ⚠️ 혼동 금지 — **로그인 비밀번호** 5회 오입력은 계정 잠금이고 그건 별개 파일
#     (`01_04_Login_Wrong_LoginPassword_old.yaml`)이 다룬다. 그쪽은 admin 해제가 필요하다.
#
# 처리 항목:
#   [01] 앱 재시작 → 간편비밀번호 화면 진입
#   [02] 간편비밀번호 오류 **5회** 입력 (PIN 1회 = 4탭이므로 20탭)
#   [03] 오류 횟수 초과 다이얼로그 → 확인
#   [04] 보안 키보드 → <정상 비밀번호> 로그인 (**1회만** — 폐기 비밀번호 재시도는 제거했다)
#   [05] 새 간편비밀번호 설정 → <정상 PIN> 입력 후 확인
#   [06] 간편비밀번호 설정 완료
# ================================================================

# ---------------------------------------------------------------
# [00] 상태 정규화 — **홈 로그인 상태에서 시작하도록 보장한다**
# ---------------------------------------------------------------
# ⚠️ 종전 진입은 `- launchApp` 한 줄뿐이라 **앞 상태가 무엇이든 잠금화면이 뜬다고 가정**했다.
#   2026-09-02에 이 때문에 3회 연속 실패했고 원인이 매번 달랐다:
#     ① Server Override 처리 0건 → 스플래시가 덮은 채 `input_dot_1` 대기 실패
#     ② 앱이 로그아웃(`ActivityMain`) 상태 → 잠금화면이 아예 안 뜸
#     ③ `AutoLogoutActivity` — 유휴 자동 로그아웃
#   → 헬퍼가 스플래시·세션만료·자동로그아웃·로그아웃·PIN재등록·홈팝업을 한곳에서 정규화한다.
- runFlow: "_suite_recover_old.yaml"

# [01] 앱 재시작 → 간편비밀번호 화면 진입
#   ⚠️ `clearState` 금지(서버 선택이 초기화된다). 세션이 살아 있으면 잠금화면이 뜬다.
- launchApp
- runFlow: "_server_override_old.yaml"

# [02] 간편비밀번호 오류 **5회** 입력 — PIN 1회 = 4탭이므로 아래 탭은 20개다
#   (탭 수만 보고 "10회"로 오해하기 쉽다. 실제로 그렇게 잘못 센 적이 있다.)
# 잠금화면 도달 확정
- extendedWaitUntil:
    visible:
      id: "input_dot_1"
    timeout: 30000
- runFlow:
    file: _enter_pin_old.yaml
    env:
      PIN: ${PIN_WRONG}
# ★ 1회차 실패 성립 단언 — 체크리스트(V2.2) `LGN-009`(간편비밀번호 틀림 → 로그인 실패)가 본다.
#   종전엔 틀린 PIN 을 5번 넣기만 하고 **매 회 실패 안내를 보지 않았다**(커버리지 착시).
#   2026-10-13 실측: PIN 화면에 `비밀번호가 맞지 않습니다. 4/5` 처럼 **회차 카운터**가 뜬다.
#   ★ `N/5` 는 **언어에 안 흔들린다** → 글자가 아니라 이 꼴로 잡는다(en 라벨이 필요 없다).
#   ⚠️ 회차 숫자를 박지 않는다 — 화면 글자가 직전 값을 보일 때가 있다(실측 스크린샷이 그랬다).
#   ⚠️ Maestro 정규식은 **전체매칭**이라 앞뒤에 [\s\S]* 가 필요하다.
- extendedWaitUntil:
    visible:
      text: '[\s\S]*[1-5]/5[\s\S]*'
    timeout: 15000
- runFlow:
    file: _enter_pin_old.yaml
    env:
      PIN: ${PIN_WRONG}
- runFlow:
    file: _enter_pin_old.yaml
    env:
      PIN: ${PIN_WRONG}
- runFlow:
    file: _enter_pin_old.yaml
    env:
      PIN: ${PIN_WRONG}
- runFlow:
    file: _enter_pin_old.yaml
    env:
      PIN: ${PIN_WRONG}

# [03] 오류 횟수 초과 다이얼로그 확인
# ★ 종전엔 `tapOn: btn_diaog_ok` **한 줄뿐**이었다 — 버튼만 있으면 어떤 다이얼로그든 통과했다.
#   짝인 `01_04 [04]`(복합 비밀번호 5회)는 같은 자리에서 문구까지 본다. 그 파일 주석이
#   이유를 적어 뒤 둔다: "조건부 처리만 두면 아무것도 안 떠도 EXIT=0 이 된다",
#   "다이얼로그를 **닫기 전에** 판정할 것 — 닫고 나서 보면 문구가 이미 사라져 있다".
# ⛔ 그래서 `btn_diaog_ok` 를 누르기 **전에** 판정한다. 순서를 뒤집지 말 것.
# 체크리스트(V2.2) `LGN-010`(간편비밀번호 5회 실패)이 이 구간을 본다.
- extendedWaitUntil:
    visible:
      id: "txt_dialog_message"
    timeout: 30000
- takeScreenshot: "[03]_간편비번_5회실패_초과안내"
# 2026-10-13 실측 문구(ko) — 좁히려면 en 라벨이 필요해 지금은 **존재**만 본다.
#   `txt_dialog_title`   = "중요"
#   `txt_dialog_message` = "간편 비밀번호가 5번 이상 일치하지 않습니다.
#                           아이디와 비밀번호로 로그인해 주세요.
#                           현재 간편 비밀번호는 초기화됩니다."
# ⚠️ 제목 `중요` 는 초기화면 채팅 팝업(`INIT_CHAT_POPUP`)과 **같은 글자**다 → 제목으로 판정하지 말 것.
# ★ 이 다이얼로그는 5회를 채워야 뜨고, 뒤이어 [04] 가 **ID/비밀번호로 재로그인**해야
#   [05] 의 PIN 재설정 화면에 닿는다 → 구간 통과 자체가 '초과 동작' 을 증명한다.
- assertVisible:
    id: "txt_dialog_title"
- assertVisible:
    id: "txt_dialog_message"
- tapOn:
    id: "btn_diaog_ok"

# [04] 보안 키보드 → 로그인 시도
# ⚠️ 2026-09-02: 이 블록이 **로그인 2회 연속 실패**를 냈다("로그인 실패 - 3 회 남았습니다").
#   원인 2개 — 둘 다 비밀번호를 오염시킨다. `01_01_Login_Success_old`의 검증된 시퀀스와 맞췄다.
#   ① `transKeypad_row4` 탭 제거 — 행 컨테이너를 누르면 **엉뚱한 문자가 하나 들어간다.**
#      `01_01`에는 "securityKeyboardEditText 탭 직후 transKeypad_row4를 누르지 말 것(문자 오입력)"
#      이라는 경고가 이미 달려 있었는데 이 파일에만 남아 있었다.
#   ② `대문자 키보드 변경`을 **조건부**로 — 무조건 누르면 이미 대문자일 때 소문자로 바뀐다.
#   ⛔ 로그인은 **5회 제한**이다. 이 블록을 손볼 땐 남은 횟수를 먼저 확인할 것.
# 로그인 시도 1: <정상 비밀번호>
- tapOn:
    id: "securityKeyboardEditText"
# 비밀번호는 사용자 프로파일에서 온다(라벨은 `env\user.<이름>.local.env`).
#   ⚠️ 여기 하드코딩으로 되돌리지 말 것 — 사람마다 비밀번호가 다르다.
- runFlow: "_enter_login_pw_old.yaml"
# ⚠️ **폐기 비밀번호 재시도 블록을 제거했다**(2026-09-02. 구 저장소 사본 67~92행에 해당).
#   셋 다 해로웠다:
#     ① 재시도에 쓰던 값은 **이미 폐기된 비밀번호**라 성공할 수 없다.
#     ② 그런데 **로그인 시도를 1회 더 소모한다.** 로그인은 5회 제한이고, 2026-09-02 실행에서
#        이 블록 때문에 한 번에 2회를 태웠다(팝업: 로그인 실패 - 3 회 남았습니다).
#     ③ 가드로 쓰던 문구(비밀번호 찾기 링크)는 로그인 화면에 **항상 있어**
#        1차 성패와 무관하게 사실상 무조건 실행된다.
#   → 1차가 실패하면 아래 [05]의 PIN 생성 화면 대기가 타임아웃되며 **시끄럽게 실패**한다.
#     조용히 시도를 더 태우는 것보다 낫다 — 실패가 누적되면 계정이 잠긴다.

# [05] 새 간편비밀번호 설정 → <정상 PIN>
# PIN 생성 화면 도달 확정
- extendedWaitUntil:
    visible:
      text: "${LOCK_CREATE_PROMPT}"
    timeout: 20000
- runFlow:
    file: _enter_pin_old.yaml
    env:
      PIN: ${PIN_NORMAL}
# PIN 재입력 화면 도달 확정 — 이전 화면에도 input_dot_1이 있어 id로는 전환을 판정할 수 없다
- extendedWaitUntil:
    visible:
      text: "${LOCK_REENTER_PROMPT}"
    timeout: 20000
- runFlow:
    file: _enter_pin_old.yaml
    env:
      PIN: ${PIN_NORMAL}

# [06] 간편비밀번호 설정 완료
- tapOn:
    id: "btnOk"
- waitForAnimationToEnd
