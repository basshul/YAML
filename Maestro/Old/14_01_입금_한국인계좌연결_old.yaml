# [08] [High] GMEPay Deposit - "GMEPay 가상 계좌 입금" 영역 미노출 확인 (국적: 한국인)
# CLICKUP-PARTIAL: z8nfn6mabj | 자동화는 *입금 영역 미노출*을 단언 — 케이스는 *이용불가 바텀시트 발생*이라 방향이 다르다
# ----------------------------------------------------------------
# 계정 전환: 로그아웃 → seungsoo818(한국인) 재로그인

# Home 화면 계좌 목록에서 "GMEPay 가상 계좌" 배너가 노출되지 않아야 함(한국인 계정 확인).
# ⚠️ 개편UI판은 `assertNotVisible: "GMEPay 가상 계좌"`였으나 구 UI 실제 텍스트는
#   "GME Pay 가상 계좌"(공백)라, 배너가 떠 있어도 텍스트가 안 맞아 **무조건 통과하는
#   거짓 통과**가 된다 → id 기준으로 바꿔 실제 미노출을 검증한다.
# ⚠️ 홈은 **스크롤 위치를 유지**하므로 상단 카드 영역으로 올려야 판정이 유효하다.
#   ⚠️ 단 여기서는 **배너가 없는 것이 정상**이라 배너를 앵커로 스크롤하면 안 된다
#     (없는 요소를 기다려 타임아웃으로 죽는다) → 항상 존재하는 `btnTransfer`를 앵커로 쓴다.
- scrollUntilVisible:
    element:
      id: "btnTransfer"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- assertNotVisible:
    id: "tv_easywallet_account_title"

# ----------------------------------------------------------------
# [25] [High] Auto Debit Deposit - 등록된 KFTC 계좌리스트 노출 확인 및 변경동작 확인
# CLICKUP: z8nfn6maca
# ----------------------------------------------------------------
# ⚠️ 홈은 **스크롤 위치를 유지**한다 → 상단 카드의 `txvDepositOrViewStatement`("입금")가
#   화면 밖일 수 있으므로 탭 전에 UP 스크롤로 끌어올린다(2026-08-25 실제 FAILED로 확인).
- scrollUntilVisible:
    element:
      id: "txvDepositOrViewStatement"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- tapOn:
    id: "txvDepositOrViewStatement"
- waitForAnimationToEnd
# 타일 탭 전에 "입금 서비스" 화면 도달을 명시적으로 기다린다(방어적 대기).
#   ※ 2026-08-25에 이 지점이 "Element not found"로 실패한 적이 있는데, 원인은 비동기 로딩이
#     아니라 **실행 중 기기에서 알림 패널을 내려 화면을 덮은 것**이었다(사용자 확인).
#     ⚠️ 이런 사고는 셀렉터 버그처럼 보이므로 오진하기 쉽다 — 실행 중에는 기기를 만지지 말 것.
- extendedWaitUntil:
    visible:
      text: "${DEPOSIT_SERVICE}"
    timeout: 30000
- tapOn: "${DEPOSIT_TILE_AUTO_DEBIT}"
- waitForAnimationToEnd
- tapOn:
    id: "edtBankAccListView"
- waitForAnimationToEnd
- assertVisible:
    id: "rvKftcList"
# ⚠️ **은행명을 하드코딩하지 않는다**(2026-09-01). 연동 계좌 목록은 계정 상태에 따라 바뀌고,
#   실제로 `케이뱅크`가 목록에서 사라져 `08_마이QR_수신과송금 [02]`가 멈춘 이력이 있다(2026-08-28).
#   이 케이스의 정의는 "목록 노출 + 변경 동작"이라 **어느 은행인지는 본질이 아니다** →
#   목록에서 첫 은행을 골라 그 값으로 검증한다.
#   ※ `.*(은행|뱅크)`가 안전한 이유: Maestro 텍스트는 **전체매칭**이라 은행/뱅크로 **끝나는**
#     문자열만 잡는다 → `GME Wallet`(원복 대상)과 `은행 계좌 선택` 같은 헤더는 매칭되지 않는다.
#   ⛔ 실송금·실결제 케이스에는 이 방식을 쓰지 말 것 — 어느 계좌로 돈이 갔는지가 재현 가능해야 한다.
# ① 선택 가능한 은행이 최소 1개 있는지 먼저 단언한다(빈 목록에서 조용히 통과하는 것을 막는다)
- assertVisible:
    text: "${BANK_NAME_ANY}"
    index: 0
# ② 고른 값을 기억한다
- copyTextFrom:
    text: "${BANK_NAME_ANY}"
    index: 0
- evalScript: ${output.kftcBank = maestro.copiedText}
- tapOn:
    text: "${BANK_NAME_ANY}"
    index: 0
- waitForAnimationToEnd
# ③ 고른 값으로 검증한다. 선택 후 필드는 "<은행명>(계좌번호 마스킹)" 형태라 앞뒤를 감싼다
- assertVisible: ".*${output.kftcBank}.*"

# 홈 복귀
- tapOn:
    id: "btnBackImage"
- waitForAnimationToEnd
# ⚠️ 구 UI는 입금 하위 화면에서 **back 1회로 홈까지 나오지 않는다** — 개편UI엔 없던
#   "입금 서비스"(`ActivityDepositMenu`) 화면을 한 단 더 거치기 때문이다
#   (2026-08-25 실제 실패: WSB 화면에서 back 1회 후 홈 판정이 죽었다).
#   → 홈 하단 내비가 보일 때까지 back을 반복한다. 이미 홈이면 루프가 돌지 않으므로
#     홈에서 back이 눌려 "앱을 종료하시겠습니까?"가 뜨는 일은 없다.
- repeat:
    times: 4
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_home"


