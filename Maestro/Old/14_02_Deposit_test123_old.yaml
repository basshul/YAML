- inputText: "5"
# 참고(사용자 확인): 이 필드는 "만원" 단위 입력 - "1" 입력 시 10,000KRW,
# "10" 입력 시 100,000KRW로 표시됨. "50000"처럼 자릿수를 많이 입력하면
# 거래당 한도(500,000 KRW)에서 잘려 의도와 다른 값이 표시되므로 "5"만
# 입력하여 50,000KRW를 만듦. 화면에는 정확히 "50,000KRW"로 표시되고 완료
# 버튼도 활성화되지만, assertVisible 텍스트 매칭은 실패함(Maestro 접근성
# 트리 감지 함정, [[feedback_maestro_text_vs_id]]와 동일 유형) - id
# 존재 확인으로 대체.
- assertVisible:
    id: "input_amount"
- tapOn:
    id: "submitBtn"
- waitForAnimationToEnd
- assertVisible: "입금을 신청하시겠습니까?"
- tapOn:
    id: "apply_btn"
- waitForAnimationToEnd
- assertVisible: "간편 비밀번호를 입력하세요"
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
- waitForAnimationToEnd
- assertVisible: "ATM 입금 신청이 완료되었습니다."
- tapOn: "완료"
- waitForAnimationToEnd
- assertVisible: "입금 요청"
- tapOn: "취소"
- waitForAnimationToEnd
- tapOn: "예"
- waitForAnimationToEnd
# 취소 확인도 간편 비밀번호 입력을 요구함(신청 때와 동일한 PIN 화면).
- assertVisible: "간편 비밀번호를 입력하세요"
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
- waitForAnimationToEnd
- assertVisible: "이용 가능한 ATM을 선택하세요"

# ----------------------------------------------------------------
# [20] [Medium] ATM Deposit - HYOSUNG - Find nearest ATM 선택 시 근처 HYOSUNG ATM 위치 확인
# ----------------------------------------------------------------
# [18]과 동일 - 외부 브라우저(checkpay.co.kr) 진입만 확인. [19]에서 이미
