appId: ${APP_ID}
---

# ================================================================
# 시나리오: Deposit — **계정별 분리본 2/3 (test123 / 외국인·은행계좌 미연결)**
# ================================================================
# 원본 `14_Deposit_old.yaml`(1845줄)은 3계정을 오가느라 1회 실행이 너무 길어
# 2026-08-26 사용자 지시로 **계정별 3개 파일로 분리**했다. 각 파일은
#   공통 진입(앱 실행 → PIN <정상 PIN> → 홈) + 해당 계정 로그인 + 그 계정 케이스
# 만 담고 있어 독립 실행 가능하다.
#   - 14_01_Deposit_seungsoo818_old.yaml : [01]~[05] [08] [25]~[27]
#   - 14_02_Deposit_test123_old.yaml     : [06] [07] [09] [14]~[24] [28]~[35]  ← Store Deposit 전부
#   - 14_03_Deposit_test251024_old.yaml  : [10]~[13] + seungsoo818 원복
# ⚠️ 케이스는 **번호순이 아니다**(계정 묶음 순). 원본은 참고용으로 남겨둔다.
# ⚠️ 이 파일은 **test123으로 끝난다**. 다른 플로우는 seungsoo818을 전제하므로,
# 단독 실행 후에는 `14_03`을 이어 돌리거나 `01_01_Login_Success_old.yaml`로 원복할 것.
# ================================================================
# ================================================================
# 시나리오: Deposit
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 (구 UI 표준 블록) ----------------
# ⚠️ 개편UI판의 `notVisible: text "Home"` 가드는 launchApp 직후 잠깐 보이는 **캐시된 홈**에
#   매칭돼 PIN 입력을 건너뛰고 잠금화면에 갇히는 사고 이력이 있다 → 잠금화면을 명시적으로 대기한다.
- launchApp
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|button1|securityKeyboardEditText"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ LIVETEST 강제 — 판별이 불가능해 항등 시퀀스로 간다. 상세: docs/ENVIRONMENT.md §7.3
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            # ⚠️ 대안 목록에 PIN 생성 화면을 **반드시 같이** 넣어야 한다 — 빠뜨리면
            #   대상도 배너도 안 보여 그냥 타임아웃된다(2026-08-25 실제 실패).
            id: "input_dot_1|bottom_item_home|securityKeyboardEditText"
          timeout: 60000
# 자동 로그아웃(세션 10분 만료)으로 재인증 화면에 떨어졌으면 비밀번호로 로그인한다
- runFlow: "_relogin_if_autologout_old.yaml"
# PIN <정상 PIN> — 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수(오입력 누적 = 계정 잠금)
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
# ⚠️ 이전 실행이 `loginpwidhidpass` 경로(= 기존 PIN 해지)로 끝났으면 계정에 PIN이 없어
#   잠금화면 대신 "앱에서 사용할 간편 비밀번호를 생성해 주세요"가 뜬다 → <정상 PIN>로 재등록한다.
#   (2026-08-25: 실제로 이 상태로 남아 다음 실행 진입이 타임아웃으로 죽었다)
- runFlow:
    when:
      visible: "${LOCK_CREATE_PROMPT}"
    commands:
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
      - runFlow:
          when:
            visible:
              id: "btnOk"
          commands:
            - tapOn:
                id: "btnOk"
            - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
# 인앱 배너 팝업은 id로 정확히 닫는다(범용 "닫기" 문자열 탭은 다른 X를 눌러 사고 이력이 있다)
- runFlow:
    when:
      visible:
        # ⚠️ 배너 닫기 id는 빌드마다 다르다 — btnTwo(7.19.x) | btnClose(7.20.0). docs/ENVIRONMENT.md §7.6
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# 구 UI는 로그아웃이 **프로필 탭에 없고 드로어에만** 있다 → `iv_nav`로 드로어를 연다.
#   드로어 항목에는 resource-id가 없어 텍스트로만 탭할 수 있다.
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "${REG_LOGOUT}"
    direction: DOWN
    timeout: 15000
- tapOn: "${REG_LOGOUT}"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_LOGOUT_CONFIRM}"
    commands:
      - tapOn: "${REG_LOGOUT_CONFIRM}"
      - waitForAnimationToEnd
# ⚠️ **구 UI는 로그아웃 후 ID/비밀번호 폼이 아니라 PIN 잠금화면(`ActivityLockScreen`)으로 떨어진다**
#   (2026-08-25 실측. 개편UI판은 곧바로 `usernameId` 폼을 전제해 여기서 FAILED로 죽었다).
#   `loginpwidhidpass`("아이디/비밀번호로 로그인")를 타야 `LoginV2Activity`로 간다.
#   그때 "ID와 비밀번호로 로그인하면 기존 간편 비밀번호는 해지됩니다" 확인 다이얼로그가 뜬다
#   → `btn_diaog_ok`("예"). ⚠️ id에 앱 오타가 있다(`diaog`) — `dialog`가 아니다.
#   ※ 이 경로로 들어가면 **기존 PIN이 해지**되므로 아래 간편비밀번호 재설정 블록이 실제로 동작한다.
- runFlow:
    when:
      visible:
        id: "loginpwidhidpass"
    commands:
      - tapOn:
          id: "loginpwidhidpass"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: "btn_diaog_ok"
          commands:
            - tapOn:
                id: "btn_diaog_ok"
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "usernameId"
    timeout: 30000
- tapOn:
    id: "usernameId"
- eraseText: 50
- inputText: "test123"
- tapOn:
    id: "securityKeyboardEditText"
# ⚠️ **비밀번호가 계정마다 다르다** (2026-09-30 사용자 재확인 — 2026-09-09 기록은 뒤바뀐 값이었다):
#   test123 = <정상 비밀번호> / test251024 = <다른 정상 비밀번호>. 여기는 test123 용 시퀀스다.
#   값은 적지 않는다(정본은 메모리 [[project_01_login]]).
#   로그인 실패는 **5회 제한**이라 잘못된 값으로 돌리면 계정이 잠긴다. 값이 바뀌면 여기부터 고칠 것
#   ([[project_01_login]] 이 정본이다. 저장소 md 에는 값을 적지 않는다).
# ⚠️ 대문자 전환은 **조건부**로 한다 — 이미 대문자 상태에서 누르면 소문자로 바뀌어 오입력이 된다.
- runFlow:
    when:
      notVisible:
        text: "Capital G 히읃"
    commands:
      - tapOn: "대문자 키보드 변경"
      - waitForAnimationToEnd
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "1"
- tapOn: "2"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "${TRANSKEY_INPUT_COMPLETE}"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "${FINGERPRINT_AUTH_PROMPT_TITLE_TEXT}"
    commands:
      - tapOn: "${REG_LATER}"
      - waitForAnimationToEnd
- runFlow:
    when:
      # ⚠️ Maestro 텍스트는 **전체매칭**이라 `"간편비밀번호"`는 실제 문구
      #   "앱에서 사용할 간편 비밀번호를 생성해 주세요"에 **매칭되지 않는다**
      #   → 이 블록이 SKIP되고 PIN 생성 화면에 갇혀 홈 판정이 죽었다(2026-08-25 실제 실패).
      #   부분매칭 정규식으로 바꾼다([[project_01_login]], [[feedback_maestro_regex_yaml]]).
      #   ※ `loginpwidhidpass` 경로로 로그인하면 기존 PIN이 해지되므로 이 화면은 **반드시 뜬다**.
      visible: "${LOCK_CREATE_PROMPT}"
    commands:
      # PIN <정상 PIN>를 두 번(생성 → 확인). 키패드가 탭마다 재배치되므로 탭 사이 정착 대기 필수
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
      - tapOn:
          id: "btnOk"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
# ⚠️ **로그인 직후 팝업은 한 박자 늦게, 그리고 여러 개가 순서대로 뜬다.**
#   2026-09-09 실측(test123 / SM-S911N): "나중에 하기" 조건을 평가한 뒤에야
#   **"증빙 서류 안내"(문서가 만료되었습니다) 바텀시트**가 떠서 홈을 덮었고,
#   `bottom_item_home` 대기가 그대로 실패했다.
#   → 단발 조건이 아니라 **홈이 보일 때까지 반복해서 닫는다.**
#   ⚠️ 인앱 배너는 **id로 정확히** 닫는다. 범용 `"닫기"` 탭은 엉뚱한 X를 눌러
#     **앱이 런처로 빠져나가는** 사고를 낸 적이 있다(2026-08-25).
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible:
              id: "bottom_item_home"
          commands:
            - runFlow:
                when:
                  visible: "${ASK_ME_LATER_TEXT}"
                commands:
                  - tapOn: "${ASK_ME_LATER_TEXT}"
                  - waitForAnimationToEnd
            - runFlow:
                when:
                  visible:
                    id: "remindLaterBtn"
                commands:
                  - tapOn:
                      id: "remindLaterBtn"
                  - waitForAnimationToEnd
            - runFlow:
                when:
                  visible:
                    id: "btnTwo|btnClose"
                commands:
                  - tapOn:
                      id: "btnTwo|btnClose"
                  - waitForAnimationToEnd
            - waitForAnimationToEnd
# ⚠️ **홈 팝업은 큐로, 그리고 뒤늦게 뜬다**(이 파일 [29] 주석에도 같은 현상이 적혀 있다).
#   바로 위 루프는 `waitForAnimationToEnd` 뿐이라 **배너가 뜨기 전에 4회를 다 돌고 끝난다** —
#   2026-10-14 실측: 루프 4회 전부 SKIPPED → 직후 `singleBanner`(`btnClose`)가 홈을 덮어
#   아래 홈 대기가 30초 타임아웃으로 죽었다.
#   → 늦게 뜨는 배너를 **한 번 더** 기다렸다가 정리한다. optional 이라 안 뜨면 무해하다.
- runFlow: "_dismiss_popups_late_stag_old.yaml"
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000
# [06]~[10] 전체 BLOCKED 처리(단순 계정 속성 문제가 아니라 기능 자체 미확인).
#
# 재확인(2026-07-14): [01]에서 "GMEPay 가상 계좌" 배너가 외국인 계정에서만
# 노출된다는 사실이 확인되어, "Easy Wallet" 배너도 동일하게 계정 속성에 따라
# 숨겨져 있을 가능성을 의심하고 Home 화면 전체(최상단~최하단)를 다시 스크롤하며
# 재조사함. 결과: "Easy Wallet"/"이지월렛" 관련 텍스트나 배너는 Home 화면
# 어디에도 존재하지 않음.
#
# 사용자 재구성 지시(2026-07-14): [06]은 "GMEPay 가상 계좌" 배너의 노출
# 유무 확인 케이스, [07]은 배너 선택(탭) 확인 케이스로 정리하기로 함. [06]을
# 제대로 검증하려면 (1)외국인 계정 (2)GMEPay Deposit 미신청 계정, 두 조건이
# 동시에 필요한데 현재 QA 테스트 계정은 이를 만족하지 않아 확인 불가 - 사용자가
# 조건을 만족하는 다른 계정으로 로그인 후 알려주기로 함(작업 보류 중).
# 그 사이 아래에 있던 탭+진입확인 코드(배너 선택 시 "가상 계좌 입금" 타이틀
# 노출 확인)는 실제로는 [08]에 해당한다고 판단되어 [08]로 이동함.

# ----------------------------------------------------------------
# [06] [Low] GMEPay Deposit - 홈화면 "GMEPay 가상 계좌" 배너 노출 유무 확인
# CLICKUP-PARTIAL: z8nfn6mabn | 자동화는 *입금 영역 노출*을 단언 — 케이스는 *일일한도 안내 배너 노출*이라 대상이 다르다
# ----------------------------------------------------------------
# 2026-07-14: 외국인 + GMEPay Deposit 미신청 계정(test123)으로 확인 - 이 경우
# ⚠️ **구 UI 배너 문구가 개편UI와 다르다**(2026-08-25 실측).
#   개편UI: "지금 신청하여 다른 사람으로부터 쉽게 돈을 받으세요."
#   구 UI  : **"지금 가상계좌 신청하기"** (`tv_easywallet_account_limit`)
#   같은 필드가 **신청완료 계정에서는 "남은 일일 입금 한도: N KRW"** 로 바뀌므로,
#   이 필드 값이 미신청/신청완료를 가르는 판별자다.
# (신청 완료 계정의 "남은 일일 입금 한도: N KRW" 문구와는 다름).
#
# 계정 전환 추가(2026-07-16): [06]/[07]은 test123 계정이 이미 로그인되어
# 있다는 전제로 작성되어 있었으나, 앱 세션이 초기화되면(재설치/기기 재부팅 등)
# 시작 시점 로그인 계정이 달라질 수 있어 실제로 seungsoo818(한국인) 상태로
# 남아 [06] 실패가 재현됨(2026-07-16 실기기). 실행 시점의 기존 로그인 계정과
# 무관하게 항상 통과하도록 명시적 로그아웃 → test123 재로그인 블록을 추가함.

# ⚠️ 홈은 **스크롤 위치를 유지**한다 → 홈 배너는 상단 카드 영역이라 화면 밖일 수 있다.
#   (2026-08-25 실제 실패: 하단 내비는 보이는데 배너 assert가 죽었다)
- scrollUntilVisible:
    element:
      id: "tv_easywallet_account_title"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- assertVisible:
    id: "tv_easywallet_account_title"
- assertVisible:
    id: "tv_easywallet_account_limit"
    text: "${BANNER_GMEPAYVA_MSG}"

# ----------------------------------------------------------------
# [07] [Low] GMEPay Deposit - "GMEPay 가상 계좌" 배너 선택 확인
# ----------------------------------------------------------------
# 2026-07-14: 미신청 계정에서 배너 선택 시 [09]/[10](신청 완료 계정)과 달리
# "가상 계좌 입금" 화면이 아니라 은행사(KB/JB) 중 선택하는 "은행 선택"(GMEPay
# VA 신규 신청) 화면으로 이동함을 확인. 실제 신청("확인 및 신청" 버튼)은
# 되돌릴 수 없는 실제 서비스 가입이라 여기서는 탭하지 않고 화면 진입만 확인.
# 구 UI 홈 배너 실제 텍스트는 "GME Pay 가상 계좌"(GME와 Pay 사이 공백)다 → id로 고정한다.
# ⚠️ 홈은 **스크롤 위치를 유지**한다 → 홈 배너는 상단 카드 영역이라 화면 밖일 수 있다.
#   (2026-08-25 실제 실패: 하단 내비는 보이는데 배너 assert가 죽었다)
- scrollUntilVisible:
    element:
      id: "tv_easywallet_account_title"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- tapOn:
    id: "tv_easywallet_account_title"
- waitForAnimationToEnd
- assertVisible: "${REG_SELECT_BANK}"
- tapOn:
    id: "btnBackImage"
- waitForAnimationToEnd
# ⚠️ 구 UI는 입금 하위 화면에서 **back 1회로 홈까지 나오지 않는다** — 개편UI엔 없던
#   "입금 서비스"(`ActivityDepositMenu`) 화면을 한 단 더 거치기 때문이다
#   (2026-08-25 실제 실패: WSB 화면에서 back 1회 후 홈 판정이 죽었다).
#   → 홈 하단 내비가 보일 때까지 back을 반복한다. 이미 홈이면 루프가 돌지 않으므로
#     홈에서 back이 눌려 "앱을 종료하시겠습니까?"가 뜨는 일은 없다.
- repeat:
    times: 4
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_home"

# 사용자 재구성 지시(2026-07-14, 2차): [08]~[10]을 "GMEPay 가상 계좌 입금"
# 영역 노출 여부/선택 검증으로 통합 - [08] 한국인(내국인) 계정 기준 미노출
# 확인, [09] 외국인 계정 기준 노출 확인, [10] 선택(탭) 동작 확인.
#
# 계정 자동 전환(2026-07-15 추가): 국적별 필요 계정이 고정됨에 따라, 어드민
# 국적 수동 전환에 의존하지 않고 케이스 진입 직전 로그아웃 → 지정 계정
# 재로그인으로 대체함 - 한국인 케이스는 seungsoo818, 외국인 케이스는
# test123(비밀번호 <구 비밀번호(폐기)>) 계정을 사용. 아래 로그아웃/로그인 블록은
# 01_01_Login_Success.yaml / 06_Registration_All.yaml의 검증된 로그인 시퀀스를
# 그대로 재사용함(보안 키패드 content-desc 기반 tapOn).

# ----------------------------------------------------------------
# [09] [Low] GMEPay Deposit - "GMEPay 가상 계좌 입금" 영역 노출 확인 (외국 국적 user)
# ----------------------------------------------------------------
# 계정 전환: 로그아웃 → test123(외국인) 재로그인

# ⚠️ 홈은 **스크롤 위치를 유지**한다 → 홈 배너는 상단 카드 영역이라 화면 밖일 수 있다.
#   (2026-08-25 실제 실패: 하단 내비는 보이는데 배너 assert가 죽었다)
# 홈 복귀 직후엔 배너가 **뒤늦게** 떠 화면을 덮는다 → 먼저 받아낸다(2026-10-14).
- runFlow: "_dismiss_popups_late_stag_old.yaml"
- scrollUntilVisible:
    element:
      id: "tv_easywallet_account_title"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- assertVisible:
    id: "tv_easywallet_account_title"

# ----------------------------------------------------------------
# [14] [Medium] ATM Deposit - ATM Deposit Without Card / ATM Deposit using Card 탭 확인
# CLICKUP: z8nfn6mabw
# ----------------------------------------------------------------
# ⚠️ **홈 팝업은 큐로, 그리고 뒤늦게 뜬다.** 2026-09-09 실측(test123 / SM-S911N):
#   여기까지 250스텝을 진행한 뒤 **EASYCARE 인앱 배너**가 새로 떠서 홈을 덮었고
#   아래 스크롤이 25초 타임아웃으로 죽었다 → 스크롤 전에 팝업 큐를 비운다.
- runFlow: "_dismiss_popups_stag_old.yaml"
# ⚠️ 홈은 **스크롤 위치를 유지**한다 → 상단 카드의 `txvDepositOrViewStatement`("입금")가
#   화면 밖일 수 있으므로 탭 전에 UP 스크롤로 끌어올린다(2026-08-25 실제 FAILED로 확인).
- scrollUntilVisible:
    element:
      id: "txvDepositOrViewStatement"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- tapOn:
    id: "txvDepositOrViewStatement"
- waitForAnimationToEnd
# 타일 탭 전에 "입금 서비스" 화면 도달을 명시적으로 기다린다(방어적 대기).
#   ※ 2026-08-25에 이 지점이 "Element not found"로 실패한 적이 있는데, 원인은 비동기 로딩이
#     아니라 **실행 중 기기에서 알림 패널을 내려 화면을 덮은 것**이었다(사용자 확인).
#     ⚠️ 이런 사고는 셀렉터 버그처럼 보이므로 오진하기 쉽다 — 실행 중에는 기기를 만지지 말 것.
- extendedWaitUntil:
    visible:
      text: "${DEPOSIT_SERVICE}"
    timeout: 30000
- tapOn: "${ATM_DEPOSIT}"
- waitForAnimationToEnd
- assertVisible: "${CHOOSE_THE_AVAILABLE_ATM}"
- tapOn: "${ATM_DEPOSIT_TAB_USING_CARD}"
- waitForAnimationToEnd
- assertVisible: "${CHOOSE_A_CONVENIENCE_STORE_TEXT}"
- tapOn: "${ATM_DEPOSIT_TAB_WITHOUT_CARD}"
- waitForAnimationToEnd
- assertVisible: "${CHOOSE_THE_AVAILABLE_ATM}"

