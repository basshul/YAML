# ----------------------------------------------------------------
# [23] [High] ATM Deposit - History - History 선택시 ATM Deposit 내역 노출 확인
# ----------------------------------------------------------------
# 정정(2026-07-16, 실기기 재확인): "카드 없이 ATM 입금"/"카드를 사용하여 ATM
# 입금"은 별도 레벨의 화면이 아니라 "ATM 입금" 최상위 화면 안의 탭 전환이며,
# "거래 내역" 버튼도 이 최상위 화면에 탭 상태와 무관하게 공통으로 존재함(기존
# 주석의 "레벨2"/"레벨1" 구분은 실기기 구조와 다름 - pressKey:back 1회로 이
# 최상위 화면을 곧바로 벗어나 Home으로 나가버리는 것을 실기기에서 확인하며
# 발견함). [22]에서 이미 이 최상위 화면(카드 탭, "편의점을 선택하세요")에
# 있으므로 추가 뒤로가기 없이 곧바로 "거래 내역"을 탭함. 또한 거래 내역에서
# 뒤로가기 시 탭 전환 없이 원래 탭("편의점을 선택하세요")으로 복귀함을
# 실기기로 확인함.
- tapOn: "거래 내역"
- waitForAnimationToEnd
- assertVisible:
    id: "iv_calendar"
- pressKey: back
- waitForAnimationToEnd
- assertVisible: "편의점을 선택하세요"

# ----------------------------------------------------------------
# [24] [Medium] ATM Deposit - History - Date Filter 동작 확인 - [x]선택시 필터 해제됨
# ----------------------------------------------------------------
# 참고: [Store Deposit] [35]와 동일하게 "[x] 선택시 필터 해제"가 아니라
# "기간 선택" 다이얼로그(시작/종료 날짜 휠, 취소/검색 버튼)가 노출되는 구조.
# [23]에서 이미 레벨1 목록 화면(카드 탭)에 있으므로 그대로 이어서 검증.
# 정정(2026-07-16): [23]과 동일한 이유로 마지막 뒤로가기 후 복귀 화면은
# "이용 가능한 ATM을 선택하세요"(카드 없이 탭)가 아니라 "편의점을 선택하세요"
# (카드 탭, 탭 상태 유지됨) - 실기기 재확인.
- tapOn: "거래 내역"
- waitForAnimationToEnd
- tapOn:
    id: "iv_calendar"
- waitForAnimationToEnd
- assertVisible: "기간 선택"
- assertVisible: "시작 :"
- assertVisible: "종료 :"
- tapOn: "취소"
- waitForAnimationToEnd
- assertVisible:
    id: "iv_calendar"
- pressKey: back
- waitForAnimationToEnd
- assertVisible: "편의점을 선택하세요"

# 홈 복귀
- pressKey: back
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd

# 계정 전환: [ATM Deposit] 섹션 전체가 test123(은행계좌 미연결) 기준으로
# 작성되었으나, 아래 [Auto Debit Deposit]은 반대로 연결된 은행 계좌(KFTC
# 리스트)가 있어야 검증 가능한 케이스라 seungsoo818로 되돌림.

# ================================================================
# [Auto Debit Deposit]
# ================================================================
# 실기기 확인 결과(2026-07-14), 원래 TODO가 전제한 "Auto Debit 진입" 메뉴는
# 별도 항목이 아니라 [GME Wallet Deposit] 바텀시트의 "즉시 입금"
# 화면(연결된 계좌에서 바로 입금 = 오픈뱅킹/KFTC 연동 CMS 자동이체)이 이에
# 해당함을 확인함 - 화면 내 "출금 계좌" 선택창을 열면 리스트 컨테이너의
# resource-id가 실제로 `rvKftcList`(KFTC 계좌리스트)로 확인되어 원래 TODO
# 설명과 정확히 일치. 케이스 내용을 실제 동작에 맞게 정정하여 작성.
#
# 주의: 이 화면은 (금액 입력 필드가 있는 다른 Deposit 화면들과 마찬가지로)
# pressKey: back이 무반응(포커스만 처리)이므로, 아래 각 케이스의 홈 복귀도
# 반드시 id: btnBackImage로 탭할 것.

# ⚠️ **[29]는 외국인 전용이다** — 한국인 계정으로 PIN까지 넣으면 서버가
#   "Currently, service is not available."로 차단한다(국적 제한 사양, 앱 결함 아님).
#   2026-08-25 계정별 재배치 때 실수로 seungsoo818 묶음에 넣어 실패했다 → **test123 묶음 끝**으로 옮겼다.

# ----------------------------------------------------------------
# [29] [High] Store Deposit - Request - Request 완료시 Barcode, Number, Deposit Amount, Time Limit이 표시됨
#            (실행 순서상 [Store Deposit] 섹션 맨 마지막에 배치 - 위 [29] 헤더의 실행 순서 참고 내용 확인)
# ----------------------------------------------------------------
# 주의: 실제 편의점 입금 요청이 생성됨(10,000 KRW, 10분 후 자동 만료/취소) -
# 실계좌 자금 이동 없음(섹션 상단 설명 참고). 이 케이스 이후에는 만료 전까지
# "편의점 입금" 재진입 시 신선한 입력 화면이 아닌 이 바코드 화면이 노출되므로,
# 이 파일에서 더 이상 "편의점 입금"에 재진입하는 케이스가 없도록(맨 마지막
# 배치) 주의할 것.
#
# 계정 참고(2026-07-15, 사용자 확인): Store Deposit(편의점 입금)도 ATM
# Deposit과 마찬가지로 외국인 전용 서비스임 - [28]/[30]~[35]는 화면 열람만
# 하는 케이스라 국적 무관하게 통과하지만, [29]는 실제 요청 생성(서버 검증)이라
# 한국인(seungsoo818) 계정으로는 "Currently, service is not available." 오류가
# 뜨는 것이 정상 동작임(버그 아님). 따라서 이 케이스만 test123(외국인)으로
# 전환 후 실행.
#
# 계정 전환: 로그아웃 → test123(외국인) 재로그인

# ⚠️ **홈 팝업은 큐로, 그리고 뒤늦게 뜬다.** 2026-09-09 실측(test123 / SM-S911N):
#   여기까지 250스텝을 진행한 뒤 **EASYCARE 인앱 배너**가 새로 떠서 홈을 덮었고
#   아래 스크롤이 25초 타임아웃으로 죽었다 → 스크롤 전에 팝업 큐를 비운다.
- runFlow: "_dismiss_popups_stag_old.yaml"
# ⚠️ 홈은 **스크롤 위치를 유지**한다 → 상단 카드의 `txvDepositOrViewStatement`("입금")가
#   화면 밖일 수 있으므로 탭 전에 UP 스크롤로 끌어올린다(2026-08-25 실제 FAILED로 확인).
- scrollUntilVisible:
    element:
      id: "txvDepositOrViewStatement"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- tapOn:
    id: "txvDepositOrViewStatement"
- waitForAnimationToEnd
# 타일 탭 전에 "입금 서비스" 화면 도달을 명시적으로 기다린다(방어적 대기).
#   ※ 2026-08-25에 이 지점이 "Element not found"로 실패한 적이 있는데, 원인은 비동기 로딩이
#     아니라 **실행 중 기기에서 알림 패널을 내려 화면을 덮은 것**이었다(사용자 확인).
#     ⚠️ 이런 사고는 셀렉터 버그처럼 보이므로 오진하기 쉽다 — 실행 중에는 기기를 만지지 말 것.
- extendedWaitUntil:
    visible:
      text: "입금 서비스"
    timeout: 30000
- tapOn: "현장 입금"
- waitForAnimationToEnd
- assertVisible: "이용 가능 편의점"
- tapOn: "확인"
- waitForAnimationToEnd
- assertVisible: "입금을 신청하시겠습니까?"
- tapOn:
    id: "apply_btn"
- waitForAnimationToEnd
- assertVisible: "간편 비밀번호를 입력하세요"
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
- waitForAnimationToEnd
- assertVisible: "편의점 직원에게 요청하여 입금해 주세요."
- assertVisible: "입금 금액"
- assertVisible: "남은 시간"

# 홈 복귀
# ⚠️ 개편UI판은 `iv_back` 2탭으로 홈까지 나왔지만 구 UI에서는 실패한다 —
#   현장 입금 하위 화면 중 `iv_back`이 **없는 화면**이 있고(2026-08-25 [34] 이후 실측:
#   "Element not found: iv_back"), 구 UI는 "입금 서비스" 화면을 한 단 더 거치기 때문에
#   나와야 할 횟수도 다르다.
#   → 특정 back id에 의존하지 않고 **기기 back 키를 홈 하단 내비가 보일 때까지 반복**한다.
- repeat:
    times: 6
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

