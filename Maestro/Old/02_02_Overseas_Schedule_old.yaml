appId: ${APP_ID}
---
# ================================================================
# 시나리오: Overseas Transfer - 예약 송금 / 필터 / 수취인 추가
# 실행: .\run_test.ps1 -lang ko -flow 02_02_Overseas_Schedule.yaml
#
# [Add Recipient] [01][03][04][05] 수취인 추가 시나리오 (병합)
#   [01] [High]   바텀시트 및 새 수취인 추가 폼 진입 확인
#   [03] [Medium] 기존 수취인 목록 노출 확인
#   [04] [Medium] 기존 수취인 정상 추가 동작 확인
#   [05] [Medium] 이미 예약된 수취인 추가 시 중복 팝업 확인
# [06] [Medium] 예약 탭 - 수취인 화면 필터(설정) 동작 확인
# [02] [High]   Schedule Add Recipient - 새 수취인 추가 (Kazakhstan / MoneyGram 현금 지급)
# [05-1]        Schedule Add Recipient - 기 등록된 수취인 정보 수정 → 🐞BLOCKED(예약 탭 저장 불가). 실커버는 02_01 [01]
# [시나리오 1] [High]   KFTC 예약 - 매달 Step 1~3 확인 후 1회 Step 1~3 확인
#                       (KFTC는 OTP/생체인증 필요로 실제 제출 불가 - Step 3까지만 검증)
# [시나리오 2] [High]   GME Wallet 1회 - 지난 시간 예약 실패 후 날짜 변경 성공
# [시나리오 3] [High]   GME Wallet 매달 - 종료일 이전 날짜 설정 불가 확인 + 예약 성공
# ================================================================

# 앱 실행 및 홈 화면 진입
# 주의(2026-08-03): 기존 `notVisible: "Home"` 가드는 launchApp 직후 잠깐 보이는 **캐시된 홈**에
#   매칭돼 PIN 입력을 건너뛰고 잠금화면에 갇힘. 잠금화면을 명시적으로 대기 후 PIN 입력하도록 변경.
#   PIN 키패드는 매번 랜덤 배치라 좌표가 아닌 text("1"/"2")로 탭.
- launchApp
# ⚠️ **Server Override 스플래시 처리가 없었다**(2026-08-28 stag 전환에서 추가).
#   livetest 빌드에서는 기본값이 LIVETEST라 드러나지 않았지만, stag 빌드는 기본값이 **STAG**이고
#   `clearState`가 선택을 초기화하므로 **서버가 조용히 STAG로 새거나 스플래시에서 멈춘다.**
#   선택을 바꾸면 버튼이 `CONTINUE` → **`APPLY & QUIT`** 로 바뀌며 **앱이 종료**된다(둘 다 id `button1`).
#   Maestro가 `checked:`를 무시해 판별이 불가하므로 **항등 시퀀스**로 처리한다.
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|button1|securityKeyboardEditText"
    timeout: 60000
- runFlow: "_server_override_old.yaml"
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|securityKeyboardEditText"
    timeout: 60000
# 자동 로그아웃(세션 10분 만료)으로 재인증 화면에 떨어졌으면 비밀번호로 로그인한다
- runFlow: "_relogin_if_autologout_old.yaml"
# PIN <정상 PIN>. 키패드는 숫자를 누를 때마다 배치가 재섞이므로 각 탭 사이에 정착 대기를 넣어야
#   maestro가 직전 스냅샷의 stale 좌표를 눌러 오입력하는 사고를 막을 수 있음
#   (2026-08-04 실제로 "비밀번호가 맞지 않습니다"/"로그인 실패" 2회 발생 → 잠금 위험)
# ⚠️ **조건부로 감쌌다**(2026-08-28) — 서버 전환 후 세션이 살아 있으면 잠금화면 없이 홈으로
#   바로 떨어질 수 있는데, 그때 무조건 "1"을 누르면 홈에서 엉뚱한 요소를 탭한다.
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
# 로그인 세션 만료 다이얼로그(토큰 만료 시) 또는 홈 대기
# 세션 만료 판정 — 실제 문구는 "로그인 세션이 만료되었습니다.
#   서비스를 이용하려면 다시 로그인해 주세요." 로 **개행이 섞인 두 문장**이다.
#   Maestro 텍스트는 전체매칭이라 `"로그인 세션이 만료"` 로는 **한 번도 잡히지 않았다**
#   (2026-08-28 확인) → 부분매칭엔 `[\s\S]*`가 필요하다.
#   그리고 구 UI에서 세션이 만료되면 **PIN으로 복구되지 않는다**(ID/비밀번호 재로그인 필요).
#   그래서 다이얼로그를 닫고 진행하는 대신 **여기서 실패시킨다** — 원인이 로그에 남아야
#   `01_01_Login_Success_old.yaml`로 복구한 뒤 재실행할 수 있다.
#   ⚠️ 홈 대기보다 **앞**에 둔다. 뒤에 두면 홈 대기가 먼저 타임아웃 나서 원인이 가려진다.
- assertNotVisible:
    text: "${SESSION_EXPIRED}"
# 홈 도달 대기
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 20000
- runFlow:
    when:
      visible:
        text: "${REG_LATER}"
    commands:
      - tapOn: "${REG_LATER}"
# 홈 코치마크 balloon(별도 PopupWindow, 떠있으면 아래 노드를 못읽음) 닫기
- runFlow:
    when:
      visible:
        id: "balloonClose"
    commands:
      - tapOn:
          id: "balloonClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# ================================================================
# [Add Recipient] [01][03][04][05] 수취인 추가 시나리오
# ================================================================

# 사전 정리 Step 1: 내역 > 예약 송금 내역에서 활성 예약 모두 취소
# ⚠️ 구 UI 하단 내비 라벨은 **"거래 내역"**(공백 포함)이라 `"내역"`으로는 안 걸린다
#   (Maestro 텍스트는 전체매칭) → **id로 판정**. 홈 타일에도 "거래 내역"이 있어 텍스트는 모호하다.
- tapOn:
    id: "bottom_item_history"
- tapOn: "${SCR_HISTORY}"
- tapOn: "${DEBUG_MENU_DEEPLINK_SCHEDULE_HISTORY}"
- runFlow:
    when:
      visible:
        text: "${ACTIVE_TEXT}"
    commands:
      - tapOn: "${ACTIVE_TEXT}"
- runFlow:
    when:
      visible:
        text: "${ACTIVE_TITLE_TEXT}"
    commands:
      - scroll
      - tapOn: "${TXT_CANCEL}"
      - tapOn: "${BTN_YES}"
- runFlow:
    when:
      visible:
        text: "${ACTIVE_TITLE_TEXT}"
    commands:
      - scroll
      - tapOn: "${TXT_CANCEL}"
      - tapOn: "${BTN_YES}"
- runFlow:
    when:
      visible:
        text: "${ACTIVE_TITLE_TEXT}"
    commands:
      - scroll
      - tapOn: "${TXT_CANCEL}"
      - tapOn: "${BTN_YES}"
- runFlow:
    when:
      visible:
        text: "${ACTIVE_TITLE_TEXT}"
    commands:
      - scroll
      - tapOn: "${TXT_CANCEL}"
      - tapOn: "${BTN_YES}"
- runFlow:
    when:
      visible:
        text: "${ACTIVE_TITLE_TEXT}"
    commands:
      - scroll
      - tapOn: "${TXT_CANCEL}"
      - tapOn: "${BTN_YES}"

# 홈 복귀: launchApp으로 확실한 홈 진입 (back 횟수가 예약 상태에 따라 달라짐)
- launchApp
# ⚠️ 재실행이므로 **Server Override 스플래시가 다시 뜬다**(매 콜드 실행 노출).
#   이걸 처리하지 않으면 스플래시 위에서 PIN "1"을 눌러 엉뚱한 항목을 탭한다.
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|button1"
    timeout: 60000
- runFlow: "_server_override_old.yaml"
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home"
    timeout: 60000
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# 사전 정리 Step 2: 이전 실행 잔류분을 예약 탭에서 삭제
# ⚠️ **`TESTUPDATE GME`을 쓰고 있었으나 그 수취인은 존재하지 않는다**(2026-08-28 실기기 확인).
#   `TESTUPDATE GME`은 `02_01`의 **수취인 편집 테스트가 `GME TEST`를 개명해 남긴 잔재**였고
#   (02_01 주석: "이전 실행에서 편집된 TEST GME 정리"), 그게 정리된 뒤로 이 파일은 항상 실패한다.
#   → 계정에 실제로 있는 **실시간 송금 수취인 `GME TEST`(스리랑카 / COMMERCIAL BANK / 계좌 입금)** 를 쓴다.
# ⚠️ 예약 탭에는 **이름이 같은 다른 수취인 `GME TEST`(몽골 / Moru / 모바일 월렛)** 가 이미 있다.
#   이름으로는 구분이 안 되므로 잔류 판정·검증은 **`COMMERCIAL BANK`(유일)** 로 한다.
# ⚠️ 예약 목록은 **최근 추가가 맨 위**라 방금 추가분은 항상 index 0이다(실측). 잔류분도 마찬가지.
- tapOn: "${TXT_OVERSEAS_REMIT}"
- extendedWaitUntil:
    visible:
      text: "${SCR_SELECT_RECIPIENT}"
    timeout: 10000
- tapOn: "${COMMON_BOOKING_LABEL}"
- runFlow:
    when:
      visible:
        text: "COMMERCIAL BANK"
    commands:
      - tapOn:
          id: "moreIcon"
          index: 0
      - tapOn:
          id: "delete"
          index: 0
      - tapOn: "${BTN_YES}"
- runFlow:
    when:
      visible:
        text: "BASSHU TEST GME"
    commands:
      - tapOn:
          id: "moreIcon"
          index: 0
      - tapOn:
          id: "delete"
          index: 0
      - tapOn: "${BTN_YES}"

# [01] 바텀시트 및 새 수취인 추가 폼 진입 확인
- tapOn: "${ADD_RECIPIENT_TEXT}"
- assertVisible:
    id: "tv_addRecipient"
- assertVisible:
    id: "tv_addExistingRecipient"
- tapOn:
    id: "tv_addRecipient"
- assertVisible:
    id: "recieverCountrySelectionFormInputField"
- pressKey: back
- runFlow:
    when:
      notVisible:
        text: "${SCR_SELECT_RECIPIENT}"
    commands:
      - pressKey: back

# [03] 기존 수취인 목록 노출 확인
- tapOn: "${ADD_RECIPIENT_TEXT}"
- tapOn:
    id: "tv_addExistingRecipient"
- assertVisible:
    text: "${ADD_EXISTING_RECIPIENT_TEXT}"
- tapOn:
    id: "tv_close"

# [04] 기존 수취인 정상 추가 동작 확인
#      GME TEST(스리랑카·미예약)를 예약 목록에 추가
# ※ 바텀시트가 열리면 **뒤쪽 예약 목록은 접근성 트리에서 사라지므로**(실측)
#   시트 안의 "GME TEST"는 동명이인과 충돌하지 않는다.
- tapOn: "${ADD_RECIPIENT_TEXT}"
- tapOn:
    id: "tv_addExistingRecipient"
- assertVisible:
    text: "${ADD_EXISTING_RECIPIENT_TEXT}"
- tapOn: "GME TEST"
# 추가 결과는 **동명이인과 구분되는 `COMMERCIAL BANK`로 검증**한다.
#   ("GME TEST"로 assert하면 기존 몽골 수취인 때문에 **추가에 실패해도 통과**한다)
- assertVisible:
    text: "COMMERCIAL BANK"

# [05] 이미 예약된 수취인 추가 시 중복 팝업 확인
#      GME TEST ([04]에서 추가된 상태)
- tapOn: "${ADD_RECIPIENT_TEXT}"
- tapOn:
    id: "tv_addExistingRecipient"
- assertVisible:
    text: "${ADD_EXISTING_RECIPIENT_TEXT}"
- tapOn: "GME TEST"
- assertVisible:
    id: "txt_dialog_message"
- assertVisible:
    text: "${SCHEDULE_030}"
- tapOn:
    id: "btn_diaog_ok"

# ----------------------------------------------------------------
# [05-1] Schedule Add Recipient - 기 등록된 수취인 정보 수정 — 🐞 BLOCKED (앱/서버 결함)
#        (체크리스트 #241 / 2026-10-02 실기기 확인)
# ----------------------------------------------------------------
# 🐞 **예약 탭에서는 기 등록된 수취인을 수정해 저장할 수 없다.** 저장을 누르면 항상 오류가 난다:
#     `txvDialogTitle`       "오류 (06640154622502)"
#     `txvDialogDescription` "The same beneficiary details already exist. Beneficiary Name : "<이름>""
#     `btnOk`                "확인"
#   **어느 필드를 바꾸든 같다** — 도시만 바꿔도, 성(Last Name)을 바꿔도 같은 오류였다(두 번 실측).
#
# ★ 같은 수취인을 **실시간 송금 탭에서 수정하면 정상 저장된다**(같은 날 같은 기기에서 대조 확인):
#     `txvDialogTitle` "저장 성공" / `txvDialogDescription` "수취인 정보가 수정되었습니다. ..."
#   → 즉 수정 기능 자체는 멀쩡하고 **예약 탭 경로에서만 중복 판정에 걸린다.**
#     자기 자신(또는 실시간 목록의 원본)과 중복으로 보는 것으로 추정된다.
#   ⚠️ **ClickUp 미보고** — 보고 시 위 오류 코드와 대조 결과를 함께 적을 것.
#
# 📌 그래서 체크리스트 #241 의 **실제 커버는 `02_01_Overseas_Send now_old.yaml [01]`** 이다.
#   그 파일에 2026-10-02 **성립 단언을 추가**했다(저장 성공 시트에 바뀐 이름이 찍히는지 +
#   목록 반영). 종전에는 수정을 수행만 하고 반영을 보지 않아 커버리지 착시였다.
#
# 🚫 **아래에 검증 코드를 두지 않는다.** 저장이 항상 실패하므로 케이스를 쓰면 스위트가 상시 FAIL 한다.
#   결함이 고쳐지면 이 블록을 케이스로 되살린다 — 그때 쓸 셀렉터는 2026-10-02 실측으로 확보해 뒀다:
#     행      : `tv_detail1`(이름) / `tv_detail2`(지급 방식) / `tv_detail3`(기관) /
#               `tv_detail5`(계좌·번호) / `moreIcon` → 펼치면 `edit` + `delete`
#     수정 폼 : `RecipientAddEditV3Activity` — `toolbar_title`("${RECIPIENT_EDIT_TITLE}") / `iv_back` /
#               `scrollView` / 필드 id 는 추가 폼과 **동일**(`reciever*FormInputField`) / `btn_submit`
#     ⚠️ 추가 폼과 수정 폼은 필드 id 가 같다 → 어느 폼인지는 `toolbar_title` 로만 구분된다.
#     ⚠️ 하단 필드(도시·성 등)는 진입 직후 트리에 없다 → `scrollUntilVisible` 로 끌어와야 한다.
#     ⚠️ 동명이인(몽골 GME TEST)이 있으므로 대상 식별은 **`COMMERCIAL BANK`(유일)** 로 한다.
#
# 사후 정리: [04]에서 추가한 GME TEST(스리랑카)를 예약 목록에서 삭제
# ⚠️ index 0 = **가장 최근에 추가된 행**(실측). 방금 추가분이 맨 위라 이 인덱스가 맞다.
#   순서 가정이 깨지면 **엉뚱한 수취인(GGGG TTTT 등)이 영구 삭제**되므로,
#   삭제 후 `COMMERCIAL BANK`가 사라졌는지 **반드시 사후 검증**한다.
- tapOn:
    id: "moreIcon"
    index: 0
- tapOn:
    id: "delete"
    index: 0
- tapOn: "${BTN_YES}"
- assertNotVisible:
    text: "COMMERCIAL BANK"
- runFlow:
    when:
      notVisible:
        text: "${SCR_SELECT_RECIPIENT}"
    commands:
      - pressKey: back
      
# ================================================================
# [02] Schedule Add Recipient - 새 수취인 추가 (Kazakhstan / MoneyGram 현금 지급)
#      [시나리오 1~3]에서 사용할 수취인 추가 (사후 정리는 [시나리오 3] 이후)
# ================================================================

# 사전 정리: SCHEDULE TRANSFER TEST 수취인이 있으면 삭제 시도
# - 예약 없음: btn_yes(예) → 삭제 완료
# - 예약 있음: btn_diaog_ok(확인) → 삭제 불가 팝업 닫기 → 기존 수취인 유지
- tapOn: "${TXT_OVERSEAS_REMIT}"
- extendedWaitUntil:
    visible:
      text: "${SCR_SELECT_RECIPIENT}"
    timeout: 10000
- tapOn: "${COMMON_BOOKING_LABEL}"
- runFlow:
    when:
      visible:
        text: "SCHEDULE TRANSFER TEST"
    commands:
      - tapOn:
          id: "moreIcon"
          index: 0
      - tapOn:
          id: "delete"
          index: 0
      # 정상 삭제 확인 팝업 (예약 없음)
      - runFlow:
          when:
            visible:
              id: "btn_yes"
          commands:
            - tapOn:
                id: "btn_yes"
      # 예약된 송금으로 삭제 불가 팝업 (예약 있음)
      - runFlow:
          when:
            visible:
              id: "btn_diaog_ok"
          commands:
            - tapOn:
                id: "btn_diaog_ok"

# SCHEDULE TRANSFER TEST가 없는 경우만 새로 추가 (삭제 성공 or 원래 없었던 경우)
- runFlow:
    when:
      notVisible:
        text: "SCHEDULE TRANSFER TEST"
    commands:
      - tapOn: "${ADD_RECIPIENT_TEXT}"
