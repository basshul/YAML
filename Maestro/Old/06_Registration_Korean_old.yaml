# ⚠️ 조건을 `visible: "간편비밀번호"`로 두면 **절대 매칭되지 않는다** — Maestro 텍스트 assert는
#   **전체매칭**이고 실제 문구는 "앱에서 사용할 간편 비밀번호를 생성해 주세요"(공백 포함)다.
#   그러면 이 블록이 조용히 SKIP되고 **PIN 생성 화면에 갇힌 채** 뒤 단계가 전부 실패한다
#   (14_Deposit_old에서 실제 사고로 확인된 패턴).
