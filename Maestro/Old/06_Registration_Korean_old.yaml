appId: ${APP_ID}
---
# ================================================================
# 시나리오: Registration (회원가입)
#
# 실행 방법 (run_test.ps1 사용):
#   한국어: .\run_test.ps1 -lang ko -flow 06_Registration_Korean.yaml
#   영어:   .\run_test.ps1 -lang en -flow 06_Registration_Korean.yaml
#
# 입력값 (시나리오 1 - 한국인): ID: test007 / PW: <정상 비밀번호> / 전화번호: 010-90380909
# 입력값 (시나리오 2 - 외국인): ID: test006 / PW: <정상 비밀번호> / 전화번호: 010-90380808
# NOTE: 실제 가입 완료 단계는 실데이터 생성 위험 → 각 단계별 입력/동작 확인에 집중
# ================================================================

# ================================================================
# 케이스 종속 관계:
#   시나리오 1 (한국인 회원가입):
#     [01]~[05]  이용약관 케이스
#     [06]~[11]  Sign Up 기본 정보 케이스
#     [12]~[13]  ID Information Verification (내국인) 케이스
#     [17]~[22]  개인정보 입력 케이스 (영문 이름 / 주소 / 직업 / 성별)
#     [23]~[24]  개인정보 입력 케이스 (이메일 / 추천인 코드)
#     [25]~[26]  계좌 인증 케이스
#     [27]       간편비밀번호 설정 케이스
#   시나리오 2 (외국인 회원가입):
#     [14]~[16]  ID Information Verification (외국인 / Passport) 케이스
#     [16a]~[16b] ID Information Verification (외국인 / ARC) 케이스
#                 ※ 여권 OCR 확인 후 동일한 플로우로 ARC OCR 진행
#     [S2-19]~[S2-22]  개인정보 입력 케이스 (주소 / 직업 / 성별)
#     [S2-23]~[S2-24]  개인정보 입력 케이스 (이메일 / 추천인 코드)
#     [S2-계좌인증]     계좌 인증 건너뛰기 케이스
#     [S2-27]          간편비밀번호 설정 케이스
# ================================================================

# ================================================================
# 시나리오 1: 한국인 회원가입
# clearState → 신규 회원 → 약관 → Sign Up (내국인) → ID 인증 (내국인)
#           → 개인정보 → 계좌 인증 → 간편비밀번호 설정
# ================================================================

# 앱 최초 실행 (clearState 1회)
- launchApp:
    clearState: true
- waitForAnimationToEnd
- waitForAnimationToEnd
# ⚠️ **Server Override 스플래시 처리가 통째로 빠져 있었다**(2026-08-27 `All`과 대조로 발견).
#   livetest 빌드는 실행마다 이 스플래시가 뜨는데, 처리하지 않으면 화면을 덮은 채로 남아
#   뒤의 `"신규 회원"` 탭이 실패한다 — 즉 이 파일은 **첫 화면에서 죽는 상태**였다.
#   `06_Registration_All_old.yaml`과 동일하게 맞춘다.
- extendedWaitUntil:
    visible:
      text: "Server Override|언어 선택|신규 회원"
    timeout: 20000
- runFlow: "_server_override_old.yaml"
# clearState 후 앱 언어가 한국어인 경우 목표 언어로 전환 (en.env: 신규 회원 감지 → English 전환 / ko.env: 조건 미충족 유지)
- runFlow:
    when:
      visible: "${LANG_SWITCH_TRIGGER}"
    commands:
      - tapOn: "언어 선택"
      - waitForAnimationToEnd
      - tapOn: "${LANG_SWITCH_TARGET}"
      - waitForAnimationToEnd
- tapOn: "${REG_NEW_MEMBER}"
- waitForAnimationToEnd
- assertVisible:
    text: "${REG_TERMS_TITLE}"

# ================================================================
# [이용약관]
# ================================================================

# ----------------------------------------------------------------
# [01] [High] Terms & Conditions - "모두 동의합니다" 체크박스 선택 > "확인" 버튼 활성화 확인
# ----------------------------------------------------------------
- tapOn: "${REG_AGREE_ALL}"
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd
- assertVisible:
    text: "${REG_CONFIRM}"
- takeScreenshot: "[01]_모두동의_확인버튼_활성화"

# ----------------------------------------------------------------
# [02] [High] Terms & Conditions - "서비스 약관 동의(필수)" 체크박스 선택 > "확인" 버튼 비활성화 확인
# ※ 필수 항목 해제 → 확인 탭해도 화면 이동 없음으로 비활성화 검증
# ----------------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "${REG_SERVICE_TERMS}"
    direction: UP
- waitForAnimationToEnd
- tapOn: "${REG_SERVICE_TERMS}"
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd
- tapOn: "${REG_CONFIRM}"
- waitForAnimationToEnd
- assertVisible:
    text: "${REG_TERMS_TITLE}"
- takeScreenshot: "[02]_서비스약관_uncheck_확인버튼_비활성화"

# ----------------------------------------------------------------
# [03] [High] Terms & Conditions - "서비스 약관 동의(필수)" 체크박스 선택 > "확인" 버튼 활성화 확인
# ※ 해제된 필수 항목 재선택 → 확인 버튼 활성화
# ----------------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "${REG_SERVICE_TERMS}"
    direction: UP
- waitForAnimationToEnd
- tapOn: "${REG_SERVICE_TERMS}"
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd
- assertVisible:
    text: "${REG_CONFIRM}"
- takeScreenshot: "[03]_서비스약관_recheck_확인버튼_활성화"

# ----------------------------------------------------------------
# [04] [Low] Terms & Conditions - "프로모션 정보 수신 (선택)" 체크박스 선택 > "확인" 버튼 활성화 확인
# ※ 선택 항목 해제 → 확인 버튼 활성화 유지 (선택은 필수 아님)
# ----------------------------------------------------------------
- tapOn: "${REG_PROMOTION_TERMS}"
- waitForAnimationToEnd
- assertVisible:
    text: "${REG_CONFIRM}"
- takeScreenshot: "[04]_프로모션_uncheck_확인버튼_활성화유지"

# ----------------------------------------------------------------
# [05] [High] Terms & Conditions - "확인" 버튼 선택 > Sign Up 화면 이동 확인
# ----------------------------------------------------------------
- tapOn: "${REG_CONFIRM}"
- waitForAnimationToEnd
- assertVisible:
    text: "${REG_USER_ID}"
- takeScreenshot: "[05]_확인탭_SignUp화면_이동"

# ================================================================
# [Sign Up - 기본 정보 입력 (1/5)]
# ================================================================

# ----------------------------------------------------------------
# [06] [High] Sign Up - 사용자 ID 입력 동작 확인
# ----------------------------------------------------------------
- tapOn: "${REG_USER_ID}"
- waitForAnimationToEnd
- inputText: "test007"
- waitForAnimationToEnd
- assertVisible:
    text: "test007"
- takeScreenshot: "[06]_사용자ID_입력"

# ----------------------------------------------------------------
# [07] [High] Sign Up - 비밀번호 입력 → 비밀번호 설정 규칙 체크 활성화 확인
# ※ 보안 키패드(배치 랜덤) → 접근성 레이블 tapOn으로 "<정상 비밀번호>" 입력
# ※ 규칙 달성 여부는 색상 변화로만 확인 → takeScreenshot으로 시각 검증
# ----------------------------------------------------------------
- tapOn: "${REG_PASSWORD}"
- tapOn: "대문자 키보드 변경"
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "t 시옫"
- tapOn: "e 디귿"
- tapOn: "s 니은"
- tapOn: "t 시옫"
- tapOn: "1"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "입력완료"
- waitForAnimationToEnd
- takeScreenshot: "[07]_비밀번호_규칙_체크"

# ----------------------------------------------------------------
# [08] [High] Sign Up - 비밀번호 확인 입력 → 비밀번호 일치 체크 활성화 확인
# ※ 보안 키패드(배치 랜덤) → 접근성 레이블 tapOn으로 "<정상 비밀번호>" 입력
# ※ 일치 여부는 체크 아이콘 색상 변화로만 확인 → takeScreenshot으로 시각 검증
# ----------------------------------------------------------------
- tapOn: "${REG_PASSWORD_CONFIRM}"
- waitForAnimationToEnd
- tapOn: "대문자 키보드 변경"
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "t 시옫"
- tapOn: "e 디귿"
- tapOn: "s 니은"
- tapOn: "t 시옫"
- tapOn: "1"
- tapOn: "특수문자변경"
- tapOn: "느낌표"
- tapOn: "입력완료"
- waitForAnimationToEnd
- takeScreenshot: "[08]_비밀번호_확인_일치"

# ----------------------------------------------------------------
# [09] [High] Sign Up - 휴대폰 번호 입력 동작 확인 (010 뒤 8자리)
# ----------------------------------------------------------------
- tapOn: "${REG_PHONE}"
- waitForAnimationToEnd
- inputText: "90380909"
- waitForAnimationToEnd
- takeScreenshot: "[09]_휴대폰_번호_입력"

# ----------------------------------------------------------------
# [10] [High] Sign Up - 국적 선택 동작 확인 (내국인)
# ----------------------------------------------------------------
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "${REG_NATIONALITY}"
- waitForAnimationToEnd
- tapOn: "${REG_KOREAN}"
- waitForAnimationToEnd
- assertVisible:
    text: "${REG_KOREAN}"
- takeScreenshot: "[10]_국적_내국인_선택"

# ----------------------------------------------------------------
# [11] [High] Sign Up - 모든 항목 입력 시 다음 버튼 활성화 + 선택 확인
# ----------------------------------------------------------------
- assertVisible:
    text: "${REG_SAVE_AND_NEXT}"
- takeScreenshot: "[11]_다음버튼_활성화"
- tapOn: "${REG_SAVE_AND_NEXT}"
- waitForAnimationToEnd
- takeScreenshot: "[11]_다음_선택_화면이동"

# ================================================================
# [ID Information Verification - 내국인]
# ================================================================

# ----------------------------------------------------------------
# [12] [High] ID Information Verification - ID Card / Driving License 촬영 동작확인 (Korean)
# ----------------------------------------------------------------
- waitForAnimationToEnd
- takeScreenshot: "[12]_start_ID타입선택_화면확인"
- tapOn: "${REG_DRIVING_LICENSE}"
- waitForAnimationToEnd
- takeScreenshot: "[12-1]_운전면허증_선택"
- tapOn: "${REG_NEXT}"
- waitForAnimationToEnd
# ⚠️ `OCRImageCaptureActivity`(카메라 프리뷰)는 **캡처 불가** → takeScreenshot을 쓰면 플로우가 죽는다.
#   ※ 원인을 윈도우 플래그로 단정하지 말 것 — `dumpsys window windows | grep -m1 "fl="`는
#     포커스 윈도우가 아닌 첫 윈도우를 집을 수 있어 오판한다. 판정은
#     `adb exec-out screencap -p`의 **바이트 수**로 한다(이 화면 0B / 런처 3.4MB).
#   → 이미지 증적 대신 카메라 화면 도달을 assert로 확인한다.
- extendedWaitUntil:
    visible:
      id: "captureBtnImageView"
    timeout: 30000
# ⚠️ 셔터는 좌표로 누르면 빗나간다 — `captureBtnImageView` 실측 중심은 y≈**91.6%**(85%가 아니다).
#   `tapOn: point`는 빗나가도 COMPLETED로 기록되므로 한참 뒤에 엉뚱하게 실패한다 → id로 고정한다.
- tapOn:
    id: "captureBtnImageView"
- waitForAnimationToEnd
# ⚠️ `NativeCropActivity`도 **캡처 불가**이고 버튼에 resource-id가 없다("완료" 텍스트 노드만 있다)
#   → 스크린샷 대신 "완료" 노출로 도달을 확인한다.
#   ⚠️ 갤러리/크롭에서 앱으로 돌아오는 건 **비동기**라 `assertVisible`은 너무 빨라 실패한다
#     (2026-08-26 실제 FAILED) → `extendedWaitUntil`로 대기를 겸한다.
- extendedWaitUntil:
    visible: "${REG_DONE}"
    timeout: 20000
- tapOn: "${REG_DONE}"
- waitForAnimationToEnd
- tapOn: "${REG_RETRY}"
- waitForAnimationToEnd
# ⚠️ `OCRImageCaptureActivity`(카메라 프리뷰)는 **캡처 불가** → takeScreenshot을 쓰면 플로우가 죽는다.
#   ※ 원인을 윈도우 플래그로 단정하지 말 것 — `dumpsys window windows | grep -m1 "fl="`는
#     포커스 윈도우가 아닌 첫 윈도우를 집을 수 있어 오판한다. 판정은
#     `adb exec-out screencap -p`의 **바이트 수**로 한다(이 화면 0B / 런처 3.4MB).
#   → 이미지 증적 대신 카메라 화면 도달을 assert로 확인한다.
- extendedWaitUntil:
    visible:
      id: "captureBtnImageView"
    timeout: 30000
- pressKey: back
- waitForAnimationToEnd
- takeScreenshot: "[12-6]_X탭_화면복귀"

# ----------------------------------------------------------------
# [13] [High] ID Information Verification - 촬영한 신분증 정보 입력필드의 자동채움 동작 확인 - 수동입력 동작 확인 (Korean)
# ----------------------------------------------------------------
- tapOn: "${REG_ID_CARD}"
- waitForAnimationToEnd
- takeScreenshot: "[13-1]_주민등록증_선택"
- tapOn: "${REG_NEXT}"
- waitForAnimationToEnd
# ⚠️ `OCRImageCaptureActivity`(카메라 프리뷰)는 **캡처 불가** → takeScreenshot을 쓰면 플로우가 죽는다.
#   ※ 원인을 윈도우 플래그로 단정하지 말 것 — `dumpsys window windows | grep -m1 "fl="`는
#     포커스 윈도우가 아닌 첫 윈도우를 집을 수 있어 오판한다. 판정은
#     `adb exec-out screencap -p`의 **바이트 수**로 한다(이 화면 0B / 런처 3.4MB).
#   → 이미지 증적 대신 카메라 화면 도달을 assert로 확인한다.
- extendedWaitUntil:
    visible:
      id: "captureBtnImageView"
    timeout: 30000
# 갤러리 버튼: 좌표(75%/83% 두 값이 섞여 있었다) → id로 고정
- tapOn:
    id: "galleryBtnImageView"
- waitForAnimationToEnd
# 갤러리 썸네일: `push_test_images.ps1` 기준 index 0=QR / 1=ARC / 2=주민등록증 / 3=여권
- tapOn:
    id: "icon_thumbnail"
    index: 2
- waitForAnimationToEnd
# ⚠️ `NativeCropActivity`도 **캡처 불가**이고 버튼에 resource-id가 없다("완료" 텍스트 노드만 있다)
#   → 스크린샷 대신 "완료" 노출로 도달을 확인한다.
#   ⚠️ 갤러리/크롭에서 앱으로 돌아오는 건 **비동기**라 `assertVisible`은 너무 빨라 실패한다
#     (2026-08-26 실제 FAILED) → `extendedWaitUntil`로 대기를 겸한다.
- extendedWaitUntil:
    visible: "${REG_DONE}"
    timeout: 20000
- tapOn: "${REG_DONE_GALLERY}"
- waitForAnimationToEnd
# ⚠️ **갤러리 경로는 "완료" 탭이 한 번뿐이다** (2026-08-26 실측).
#   갤러리에서 "완료"를 누르면 크롭 단계 없이 곧바로 신분증 정보 화면
#   (`NationalIdVerificationActivity` = "신분증 정보 확인")으로 넘어간다.
#   종전 코드는 카메라 경로(셔터 → 크롭 → 완료)를 그대로 복사해 "완료"를 **두 번** 탭하려 했다.
#   두 번째 화면에 "완료"는 없다 — 있는 것은 `btnRetry`("재시도") / `btnSubmit`("확인")이다.
#   → 두 번째 탭을 제거하고 신분증 정보 화면 도달만 확인한다(이 화면도 캡처 불가).
- extendedWaitUntil:
    visible:
      id: "btnSubmit"
    timeout: 20000
# 주민번호 뒷자리 입력 (보안 키패드) - Confirm 전에 먼저 입력
- tapOn: "********"
- waitForAnimationToEnd
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "1"
- tapOn: "3"
- tapOn: "4"
- tapOn: "5"
- tapOn: "입력완료"
- waitForAnimationToEnd
# 발급 일자 선택 (기본값 그대로 확인)
- tapOn: "${REG_ISSUE_DATE}"
- waitForAnimationToEnd
- tapOn: "${REG_CONFIRM}"
- waitForAnimationToEnd
# 확인 버튼 활성화 → 확인
- tapOn: "${REG_CONFIRM}"
- waitForAnimationToEnd

# ================================================================
# [Personal Information]
# ================================================================

# ----------------------------------------------------------------
# [17] [Medium] Personal Information - Sur Name 입력동작 확인 (English Name)
# ----------------------------------------------------------------
- tapOn: "${REG_SURNAME}"
- waitForAnimationToEnd
- inputText: "LEE"
- waitForAnimationToEnd
- takeScreenshot: "[17]_SurName_입력"

# ----------------------------------------------------------------
# [18] [Medium] Personal Information - Given Name 입력동작 확인 (English Name) → [다음] 활성화 → [다음] 선택
# ----------------------------------------------------------------
- tapOn: "${REG_FIRSTNAME}"
- waitForAnimationToEnd
- inputText: "SEUNGSOO"
- waitForAnimationToEnd
- takeScreenshot: "[18-1]_GivenName_입력"
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: "[18-2]_다음버튼_활성화"
- tapOn: "${REG_NEXT}"
- waitForAnimationToEnd
- takeScreenshot: "[18-3]_다음선택_화면이동"

# ----------------------------------------------------------------
# [19] [Medium] Personal Information - 도시 선택필드 선택 및 검색 동작 확인 (Address)
# ----------------------------------------------------------------
- tapOn: "${REG_ADDRESS_CITY}"
- waitForAnimationToEnd
- tapOn: "${REG_SELECT_CITY}"
- inputText: "SUWON"
- tapOn:
    id: "itemName"

# ----------------------------------------------------------------
# [20] [Medium] Personal Information - 상세주소 GPS 동작 확인 (Address)
# ※ GPS 아이콘 2회 탭으로 주소 자동입력
# ----------------------------------------------------------------
- tapOn:
    id: "prefixImage"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_LOCATION_ALLOW}"
    commands:
      - tapOn: "${REG_LOCATION_ALLOW}"
      - waitForAnimationToEnd
- takeScreenshot: "[20-1]_GPS1차탭_상태확인"
- tapOn:
    id: "prefixImage"
- waitForAnimationToEnd
- takeScreenshot: "[20-2]_GPS2차탭_상태확인"

# ----------------------------------------------------------------
