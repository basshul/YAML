# S1 완료: test007 로그아웃 → seungsoo818 계정 로그인 → 홈 화면 확인
# ================================================================
# ⚠️ **구 UI는 로그아웃이 프로필 탭에 없다** — 드로어 `iv_nav`에만 있다.
#   종전 코드는 개편UI 경로(`${NAV_PROFILE}` → `scrollUntilVisible "로그아웃"`)라 구 UI에서 반드시 실패한다.
#   게다가 구 UI 로그아웃은 ID/비밀번호 폼이 아니라 **PIN 잠금화면**으로 떨어져
#   `loginpwidhidpass` → `btn_diaog_ok`를 거쳐야 폼에 도달하므로, 뒤따르는 `btn_lgn` 전제도 깨진다.
#   이 구간은 번호 붙은 케이스가 아니라 **후처리(계정 원복)**이다 → 세션을 통째로 비우는
#   `clearState`로 대체한다. 초기화면으로 떨어지므로 아래 `btn_lgn`이 그대로 유효하다.
- launchApp:
    clearState: true
- waitForAnimationToEnd
