# ⚠️ 구 UI 홈에는 "안녕하세요 ...님" 인사말이 **없다**(2026-08-25 실측: 홈 텍스트 노드 27개 중 0건).
#   개편UI 기준의 `assertVisible "${TXT_GREETING}"`는 구 UI에서 반드시 실패한다.
#   → 구 UI 홈 판정은 하단 내비 `bottom_item_home` + 상단 카드 `btnTransfer`로 한다.
#   (`btnTransfer`는 홈이 스크롤돼 있으면 화면 밖일 수 있어 UP 스크롤로 끌어올린다)
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "btnTransfer"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- assertVisible:
    id: "btnTransfer"
- takeScreenshot: "[LOGIN-6]_홈화면_확인"
