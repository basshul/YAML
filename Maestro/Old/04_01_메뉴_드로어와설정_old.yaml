appId: ${APP_ID}
---
# ================================================================
# 시나리오: MENU (드로어 메뉴) — 구 UI
# ================================================================
#  ⓘ 케이스 아래의 `# CLICKUP: <케이스ID>` 주석은 데일리 리포트(run_report_old.ps1)가 읽어
#    해당 ClickUp 케이스 태스크를 complete로 갱신하는 근거다.
#    **실기기에서 PASS를 확인한 케이스에만 달 것.** 달아두면 매일 자동으로 상태가 맞춰지고,
#    없는 케이스는 스크립트가 건드리지 않는다.
# 2026-08-12 작성. 대상 화면 = HomeActivityV2의 좌상단 드로어(DrawerLayout `drawer_home`).
#
# 실행 전 확인(액티비티) · 공통 진입 블록 규약: docs/ENVIRONMENT.md §7
#
# 구 UI에서는 지점·GME 소개·개인정보 처리 방침·로그아웃 등이 **프로필 탭이 아니라 드로어**에 있다.
# (개편 UI는 프로필 탭 경로였고, 구 UI 프로필 탭에는 로그아웃이 아예 없다 — 2026-08-11 실측)
# 그래서 이 파일이 드로어 메뉴의 담당 파일이다.
#
# 2026-08-13: `04_Menu_remaining_old`를 폐기하고 **유효 케이스 11건을 이 파일로 흡수**했다.
#   진입([01]~[09]) + 각 화면의 **내부 동작**([NN-n] 하위 케이스)을 한 파일에서 다룬다.
#   흡수 내역 — 은행 계좌 연결 1건([01-1]) / 지점 4건([03-1]~[03-4])
#              / GME 소개 1건([04-1]) / 설정 5건([08-1]~[08-5])
#   버린 6건 — 계좌 연결 penny test·OTP([18][19]) 및 Face ID·셀피([23][24])는 자동화 불가,
#             인바운드 계좌 삭제([20])·KFTC 계좌 삭제([22])는 대상 계좌가 이미 삭제돼 재실행 불가.
#   ※ 거래 내역 하위는 여전히 `04_02_메뉴_거래내역_old`가 담당한다.
#
# 흡수 케이스의 element id는 전부 **구 UI에서 재실측**했다(2026-08-13). 개편 UI 기준으로 적혀 있던
# 좌표 탭 2건은 모두 제거했다 — 설정 진입 기어(92%,6%)는 구 UI에서 드로어 경로라 불필요해졌고,
# 지점 주소 복사(36%,35%)는 `branch_address`가 통짜 clickable TextView라 **id 탭으로 대체**된다.
#
# 드로어 여닫기 규칙 (2026-08-11 실측):
#   - 열기: `iv_nav` 탭
#   - 드로어가 열려도 홈 노드가 계층에 함께 남으므로, 열림 판별은 드로어 전용 요소로 해야 한다
#     (`txt_user_email` 등)
#   - 닫기: back은 액티비티까지 전파돼 "앱을 종료하시겠습니까?"가 뜨고, 좌측 스와이프도 안 먹는다.
#     화면 우측 끝 요소(`bottom_item_profile`)를 탭해 스크림을 건드리면 닫힌다.
#   - 메뉴 항목을 탭하면 드로어는 자동으로 닫히므로, 각 케이스는 드로어를 다시 열고 시작한다.
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\04_01_메뉴_드로어와설정_old.yaml"
#
# 계정 유형(국적) 무관 — 이 파일에는 **외국인 계정으로만 확인 가능한 항목이 없다**(2026-08-12 사용자 확인).
#   드로어 메뉴 9종은 계정 유형에 상관없이 동일하게 노출되므로 한 계정으로 검증하면 충분하다.
#   (09_홈화면_요소와진입경로_old는 국적에 따라 홈 구성이 갈려 외국인 계정 확인이 별도로 필요하다 — 그쪽 헤더 참고)
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 ----------------
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ LIVETEST 강제 — 판별이 불가능해 항등 시퀀스로 간다. 상세: docs/ENVIRONMENT.md §7.3
      - tapOn:
          text: "${SERVER_PICK}"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
# 자동 로그아웃(세션 10분 만료)으로 재인증 화면에 떨어졌으면 비밀번호로 로그인한다
- runFlow: "_relogin_if_autologout_old.yaml"
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${BTN_CLOSE}"
      # ⚠️ 맹목적 팝업 닫기 — 상세 사유는 07_오늘의환율_환율계산_old.yaml 의 같은 블록 주석 참고.
      #   요약: 런처 이탈 사고 이력이 있으나, id로 안 닫히는 팝업이 남아 진입이 막힐 수 있어
      #   지우지 않고 **이미 홈에 도달했으면 누르지 않도록** 가드만 좁혔다.
      #   ※ 이 파일의 PIN 재설정 [X] 탭(756·768행 부근)은 성격이 다르다 — 의도적으로 누르고
      #     바로 결과를 단언하므로 맹목적 닫기가 아니다.
      notVisible:
        id: "bottom_item_home"
    commands:
      - tapOn: "${BTN_CLOSE}"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# ----------------------------------------------------------------
# [01] [Medium] 드로어 → 은행 계좌 연결 → 은행 계좌 연결 관리 화면 이동 확인
# ----------------------------------------------------------------
# AutoDebitAccountScreen — 연결된 KFTC 계좌 목록
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "txt_user_email"
    commands:
      - tapOn:
          id: "iv_nav"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txt_user_email"
    timeout: 15000
- tapOn: "${AUTO_DEBIT_ACCOUNT_TEXT}"
- extendedWaitUntil:
    visible:
      text: "${AUTO_DEBIT_TITLE_TEXT}"
    timeout: 20000
# ⛔ 2026-09-23: 종전 `${MAIN_ACCOUNT_TEXT}`("기본 계좌") 문구 단언은 **en 에서 깨진다** —
#   이 빌드의 기본 계좌 표시는 **텍스트가 아니라 아이콘**이다(`llMainAccountSection` 안의
#   `imgvMainAccount`). 계좌 목록 어디에도 그 문구가 없다(실측).
#   → 언어와 무관한 id 로 단언한다. 목록 자체(`accountListRv`)도 함께 봐서
#     "목록은 떴는데 기본 계좌 표시가 없다"와 "화면이 안 떴다"를 구분한다.
- assertVisible:
    id: "accountListRv"
- assertVisible:
    id: "imgvMainAccount"


# ★ 뒤따르던 저중요도 케이스가 홈으로 돌려놓던 자리다(2026-10-28 제거). 그 복귀가
#   없으면 다음 케이스의 `tapOn: iv_nav`(드로어)가 설 자리를 잃는다 → 여기서 되돌린다.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible:
              id: "bottom_item_home"
          commands:
            - runFlow:
                when:
                  visible: "${HOME_EXIT_CONFIRM}"
                commands:
                  - tapOn: "${REG_NO}"
                  - waitForAnimationToEnd
            - runFlow:
                when:
                  notVisible:
                    id: "bottom_item_home"
                commands:
                  - pressKey: back
                  - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 20000

# ----------------------------------------------------------------
# [02] [High] 드로어 → 거래 내역 → 내역 화면 이동 확인
# ----------------------------------------------------------------
# ⚠️ "거래 내역"은 **화면에 두 개 있다**(2026-08-12 실측).
#   - 하단 내비 라벨: id `navigation_bar_item_small_label_view`, bounds [263,2034][383,2077]
#   - 드로어 항목:   id 없음,                                   bounds [216,815][886,861]
#   드로어가 열려도 홈 노드가 계층에 남기 때문에 `tapOn: "거래 내역"`만 쓰면 하단 내비 라벨이
#   잡힐 수 있고, 그걸 탭하면 스크림에 닿아 **드로어만 닫히고 이동은 안 된다**(실제로 그렇게 실패했음).
#   드로어 항목은 id가 없으므로 "하단 내비보다 위"라는 위치 관계로 한정한다(좌표 없이 id 기준).
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "txt_user_email"
    commands:
      - tapOn:
          id: "iv_nav"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txt_user_email"
    timeout: 15000
- tapOn:
    text: "${COMMON_TRANSACTION_HISTORY_BTN}"
    above:
      id: "bottom_item_home"
- extendedWaitUntil:
    visible:
      id: "rvMainHistory"
    timeout: 20000
- assertVisible:
    text: "${CARD_EXPENSES_TEXT}"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_home"

# ----------------------------------------------------------------
# [07] [High] 드로어 → 송금 받을 계좌 → 송금 받을 계좌 관리 화면 이동 확인
# ----------------------------------------------------------------
# 화면 구성(04_Menu_remaining_old 기록): accountListRv(등록계좌 목록),
#   accAddImageView(+추가). 계좌 추가는 penny test/OTP가 필요해 BLOCKED이고
#   여기서는 진입까지만 확인한다.
# ※ 앞 케이스가 조건부 back 반복으로 복귀한 직후에는 드로어가 첫 탭에 열리지 않는 경우가 있다
#   → 드로어 전용 요소가 보일 때까지 확인하고, 안 열렸으면 한 번 더 연다.
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "txt_user_email"
    commands:
      - tapOn:
          id: "iv_nav"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txt_user_email"
    timeout: 15000
- tapOn:
    text: "${COMMON_INBOUND_ACCOUNT_LABEL}"
    above:
      id: "bottom_item_home"
- extendedWaitUntil:
    visible:
      id: "accountListRv"
    timeout: 20000
# 화면 도달 판정은 **제목 + 목록**으로 한다(이 케이스의 취지가 "화면 이동 확인"이다).
- assertVisible:
    id: "toolbar_title"
# ⚠️ **`accAddImageView`(+추가)는 항상 있는 게 아니다.**
#   2026-09-08 실측(seungsoo818 / SM-S911N): 수취 계좌가 **5건**인 상태에서 이 화면의 계층에
#   `accAddImageView` 가 **아예 없다**(스크롤해도 안 나오고, 목록 끝까지 삭제 아이콘만 있다).
#   등록 상한(5건)에 걸리면 숨는 것으로 보이나 상한값은 미확인이다.
#   → 하드 단언하면 계정 상태에 따라 무조건 FAIL 이므로 **있을 때만 확인**한다.
#     계좌를 하나 지우면 다시 노출되는지 확인할 것(그때 이 주석을 갱신).
- runFlow:
    when:
      visible:
        id: "accAddImageView"
    commands:
      - assertVisible:
          id: "accAddImageView"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "bottom_item_home"

# ----------------------------------------------------------------
# [08] [Medium] 드로어 → 설정 → 설정 화면 이동 확인
# ----------------------------------------------------------------
# ※ "설정"은 드로어 메뉴명과 진입 화면 제목이 **같은 문자열**이라 그것만으로는
#   이동 여부를 구분할 수 없다. 드로어가 닫혔는지(txt_user_email 미노출)를 먼저 확인한 뒤
#   화면 제목을 검증한다.
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "txt_user_email"
    commands:
      - tapOn:
          id: "iv_nav"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txt_user_email"
    timeout: 15000
- tapOn:
    text: "${CH_COMMON_SETTINGS}"
    above:
      id: "bottom_item_home"
- waitForAnimationToEnd
- assertNotVisible:
    id: "txt_user_email"
- extendedWaitUntil:
    visible:
      text: "${CH_COMMON_SETTINGS}"
    timeout: 20000
# 설정 화면 구성(2026-08-13 구 UI 실측 — 개편 UI와 id 체계가 동일하다):
#   view_change_password / view_change_pin_code / view_marketing(Switch) /
#   view_language / view_referral_code / delete_gme_account, 뒤로가기 iv_back
# ※ 이하 하위 케이스에서 설정 화면 복귀 판정은 화면 제목("설정")이 아니라 **id**로 한다.
#   제목 문자열은 드로어 항목명과 겹쳐 오탐 위험이 있다.
- assertVisible:
    id: "view_change_password"
- assertVisible:
    id: "view_language"

# ----------------------------------------------------------------
# [08-1] [High] 설정 → GME 회원 탈퇴 → 동의 체크박스 미선택 시 "계속" 비활성화
# CLICKUP: z8nfn6ma3v
# ----------------------------------------------------------------
# ⚠️ **`delete_gme_account`(GME 회원 탈퇴)는 설정 화면 맨 아래라 기기에 따라 화면 밖이다.**
#   2026-09-08 SM-S911N(1080x2340) 실측: 첫 화면에 "추천인 번호"까지만 보이고 탈퇴 항목이
#   계층에 안 잡혀 `Element not found` 로 죽었다(구 기기 1080x2220 에서는 통과했다).
#   → 스크롤해서 실제 렌더까지 확인한 뒤 누른다.
- scrollUntilVisible:
    element:
      id: "delete_gme_account"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
- tapOn:
    id: "delete_gme_account"
- extendedWaitUntil:
    visible:
      id: "continueBtn"
    timeout: 20000
- assertVisible:
    text: "${DELETE_GME_ACCOUNT}"
- assertVisible:
    id: "continueBtn"
    enabled: false


# ★ 뒤따르던 저중요도 케이스가 홈으로 돌려놓던 자리다(2026-10-28 제거). 그 복귀가
#   없으면 다음 케이스의 `tapOn: iv_nav`(드로어)가 설 자리를 잃는다 → 여기서 되돌린다.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible:
              id: "bottom_item_home"
          commands:
            - runFlow:
                when:
                  visible: "${HOME_EXIT_CONFIRM}"
                commands:
                  - tapOn: "${REG_NO}"
                  - waitForAnimationToEnd
            - runFlow:
                when:
                  notVisible:
                    id: "bottom_item_home"
                commands:
                  - pressKey: back
                  - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 20000

# ----------------------------------------------------------------
# [09] [Medium] 드로어 → 로그아웃 → 잠금화면 이동 후 PIN 재로그인
# CLICKUP: z8nfn6ma3y
# ----------------------------------------------------------------
# ⚠️ 이 케이스는 세션을 실제로 끊는다. 반드시 **맨 마지막**에 두고,
#   뒤에 PIN <정상 PIN> 재로그인 복구 블록을 붙여 다음 실행에 영향이 없게 한다.
# 로그아웃 후 도착지는 로그인 폼이 아니라 **잠금화면(ActivityLockScreen)**이고,
# 거기서 "아이디/비밀번호로 로그인"(loginpwidhidpass)을 누르면
# "기존 간편 비밀번호는 해지됩니다" 경고가 뜬다 → 여기서는 누르지 않는다.
# ※ 앞 케이스에서 조건부 back 반복으로 복귀한 직후에는 드로어가 바로 열리지 않는 경우가 있어
#   (2026-08-12 실측: iv_nav 탭은 COMPLETED인데 "로그아웃"을 못 찾음)
#   드로어 전용 요소가 보일 때까지 대기하고, 안 열렸으면 한 번 더 연다.
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "txt_user_email"
    commands:
      - tapOn:
          id: "iv_nav"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txt_user_email"
    timeout: 15000
- tapOn:
    text: "${REG_LOGOUT}"
    above:
      id: "bottom_item_home"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_LOGOUT_CONFIRM}"
    commands:
      - tapOn: "${REG_LOGOUT_CONFIRM}"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${PIN_ENTER_4DIGIT}"
    timeout: 30000
- assertVisible:
    id: "loginpwidhidpass"

# 복구: PIN <정상 PIN> 재로그인 → 홈
- runFlow:
    file: _enter_pin_old.yaml
    env:
      PIN: ${PIN_NORMAL}
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${BTN_CLOSE}"
      # ⚠️ 맹목적 팝업 닫기 — 상세 사유는 07_오늘의환율_환율계산_old.yaml 의 같은 블록 주석 참고.
      #   요약: 런처 이탈 사고 이력이 있으나, id로 안 닫히는 팝업이 남아 진입이 막힐 수 있어
      #   지우지 않고 **이미 홈에 도달했으면 누르지 않도록** 가드만 좁혔다.
      #   ※ 이 파일의 PIN 재설정 [X] 탭(756·768행 부근)은 성격이 다르다 — 의도적으로 누르고
      #     바로 결과를 단언하므로 맹목적 닫기가 아니다.
      notVisible:
        id: "bottom_item_home"
    commands:
      - tapOn: "${BTN_CLOSE}"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

