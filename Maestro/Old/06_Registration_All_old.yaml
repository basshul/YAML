#   케이스 손실은 없다 — `[LOGIN-1]`~`[LOGIN-6]`은 **가입한 계정이 아니라 seungsoo818로**
#   로그인하므로 검증이 아니라 후처리다(번호 붙은 케이스가 아니다).
#
# ⚠️ 부작용: **단독 실행하면 방금 가입한 `test006`(S2, 외국인)으로 로그인된 채 끝난다.**
#   원복 꼬리를 껐기 때문이다. "로그아웃"이 아니라 **다른 계정 로그인** 상태라는 게 중요하다 —
#   이어서 seungsoo818을 전제하는 플로우를 돌리면 **엉뚱한 계정으로 조용히 검증**하게 된다.
