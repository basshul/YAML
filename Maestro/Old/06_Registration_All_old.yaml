#   ※ 원인을 윈도우 플래그로 단정하지 말 것 — `dumpsys window windows | grep -m1 "fl="`는
#     포커스 윈도우가 아닌 첫 윈도우를 집을 수 있어 오판한다. 판정은
#     `adb exec-out screencap -p`의 **바이트 수**로 한다(이 화면 0B / 런처 3.4MB).
#   → 이미지 증적 대신 카메라 화면 도달을 assert로 확인한다.
- extendedWaitUntil:
    visible:
      id: "captureBtnImageView"
    timeout: 30000
# 갤러리 버튼: 좌표(75%/83% 두 값이 섞여 있었다) → id로 고정
- tapOn:
    id: "galleryBtnImageView"
- waitForAnimationToEnd
# 갤러리 썸네일: 여권 = index 3 (`push_test_images.ps1` 기준)
# ⚠️ **OS 버전에 따라 사진 선택 도구가 다르다** (2026-09-09 SM-S911N / Android 16 실측).
#   구 기기: 삼성 갤러리 — 썸네일 id `icon_thumbnail` + index
#   이 기기: **Android 16 시스템 사진 피커**(`com.google.android.photopicker`, Compose)
#            → resource-id 가 없고, 항목 이름은 접근성 라벨(".. 촬영된 사진")에만 있는데
#              maestro text 셀렉터가 그걸 **매칭하지 못한다**(실측 확인) → **좌표 탭만 가능**.
#   그리드는 3열이라 index 를 좌표로 환산한다(1080x2340 실측 bounds 기준):
#     0=(16%,48%) 1=(50%,48%) 2=(83%,48%) 3=(16%,64%)
#   ⚠️ 해상도가 바뀌면 여기부터 깨진다 [[feedback_coordinate_debug]].
#   ※ 엉뚱한 이미지를 고르면 앱이 "OCR이 유효하지 않습니다"로 거부하므로 거짓 통과는 되지 않는다.
- runFlow:
    when:
      visible:
        id: "icon_thumbnail"
    commands:
      - tapOn:
          id: "icon_thumbnail"
          index: 3
- runFlow:
    when:
      notVisible:
        id: "icon_thumbnail"
    commands:
      - tapOn:
          point: "16%, 64%"
- waitForAnimationToEnd
# ⚠️ `NativeCropActivity`도 **캡처 불가**이고 버튼에 resource-id가 없다("완료" 텍스트 노드만 있다)
#   → 스크린샷 대신 "완료" 노출로 도달을 확인한다.
#   ⚠️ 갤러리/크롭에서 앱으로 돌아오는 건 **비동기**라 `assertVisible`은 너무 빨라 실패한다
#     (2026-08-26 실제 FAILED) → `extendedWaitUntil`로 대기를 겸한다.
- extendedWaitUntil:
    visible: "${REG_DONE}"
    timeout: 20000
- tapOn: "${REG_DONE_GALLERY}"
- waitForAnimationToEnd
# ⚠️ **Android 16 시스템 피커 경로에는 크롭 단계가 하나 더 있다** (2026-09-09 SM-S911N 실측).
#   삼성 갤러리에서는 "완료" 한 번으로 곧바로 신분증 정보 화면으로 넘어갔지만,
#   시스템 피커로 고르면 `NativeCropActivity`(우상단 "완료")를 거치고, 그 "완료"가
#   **한 번에 먹지 않는 경우가 있다** → 크롭 화면에 그대로 남아 `btnSubmit` 대기가 실패했다.
#   → 신분증 정보 화면(`btnSubmit`)에 닿을 때까지 "완료"를 다시 누른다(이미 넘어갔으면 no-op).
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible:
