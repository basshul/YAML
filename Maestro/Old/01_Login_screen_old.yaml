appId: ${APP_ID}
---
# ⚠️ 2026-09-02: 이 파일은 **분리본이 따로 있다.** 원본은 참고용으로 유지한다.
#   · `01_03_Login_screen_safe_old.yaml`     [01]~[05]  ← 회귀 스위트는 이걸 쓴다
#   · `01_05_Login_Password_Reset_old.yaml`  [06][07]   ← 파괴적, admin 대기 시에만
#   여기(19~79행 진입 블록 포함)를 고치면 **분리본 2개도 같이 고칠 것.**
#
# ================================================================
# 01 로그인 화면 테스트
# 실행:
#   한국어: .\run_test.ps1 -lang ko -flow 01_Login_screen.yaml
#   영어:   .\run_test.ps1 -lang en -flow 01_Login_screen.yaml
#
# 테스트 항목:
#   [01] [Low] Chat - 로그인 화면에서 채팅 화면 이동 확인
#   [02] [Low] Register Here - 이용약관 동의 화면 노출 확인
#   [03] [Low] 아이디 찾기 - 아이디 찾기 화면 이동 확인
#   [04] [Low] 비밀번호 찾기 - 비밀번호 찾기 화면 이동 확인
#   [05] [Medium] 아이디 찾기 - 휴대폰 번호 / 생년월일 입력 후 조회
#   [06] [Medium] 비밀번호 찾기 - 사용자 ID 입력 후 초기화 요청          🔴 파괴적
#   [07] [Medium] 이메일 수신 확인 - GME ID / 새 비밀번호 (30초 타임아웃)  🔴 파괴적
#
# 🔴🔴 **`[06]` 은 대상 계정의 비밀번호를 실제로 초기화한다.**
#   앱이 임의값으로 바꿔 메일로 보내고, admin 재설정 전에는 그 계정으로 로그인할 수 없다.
#   ⚠️ 이 경고가 **헤더에 없어서 2026-09-16 에 실제로 밟았다** — "로그인 화면만 본다"는
#     파일 이름과 `[01]~[05]` 만 보고 안전하다고 판단했는데 `[06]` 이 주 계정을 초기화했다.
#   → 대상은 **test007 고정**(사용자 지시, 2026-09-16). 등록 메일 `anfrhrl002@gmail.com`.
#     `[01]~[05]` 만 필요하면 **`01_03_Login_screen_safe_old.yaml`** 을 쓸 것.
# ================================================================

- launchApp:
    clearState: true
- waitForAnimationToEnd
- waitForAnimationToEnd

# Server Override 다이얼로그(livetest 빌드 서버선택 스플래시) 노출 시 CONTINUE
- extendedWaitUntil:
    visible:
      text: "Server Override|언어 선택|신규 회원"
    timeout: 20000
- runFlow: "_server_override_old.yaml"

# 서비스 이용 안내 팝업 (조건부)
- runFlow:
    when:
      visible: "${INIT_SERVICE_GUIDE}"
    commands:
      - tapOn:
          id: "btnConfirm"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "허용"
          commands:
            - tapOn: "허용"
            - waitForAnimationToEnd

# clearState 후 언어 자동 전환 (en 실행 시: "신규 회원" 감지 → English 전환)
- runFlow:
    when:
      visible: "${LANG_SWITCH_TRIGGER}"
    commands:
      - tapOn:
          id: "selectLangBg"
      - waitForAnimationToEnd
      - tapOn: "${LANG_SWITCH_TARGET}"
      - waitForAnimationToEnd
      # ⚠️ 언어를 바꾸면 **앱이 재시작**되고 Server Override 스플래시가 **다시 뜬다**
      #   (2026-09-16 en 실측). ko 는 `LANG_SWITCH_TRIGGER=__NEVER_MATCH__` 라 이 블록이
      #   통째로 SKIP 되어 이 결함이 드러나지 않았다.
      - runFlow: "_server_override_old.yaml"
      - extendedWaitUntil:
          visible:
            id: "btn_lgn"
          timeout: 30000

- tapOn:
    id: "btn_lgn"
- waitForAnimationToEnd
# ⚠️ **`LoginV2Activity`는 FLAG_SECURE라 스크린샷을 찍을 수 없다**(2026-08-26 확정).
#   Maestro는 여기서 `INTERNAL: Screenshot returned null`로 **플로우 전체가 죽는다**
#   (실제로 이 파일이 1분 9초 만에 EXIT=1로 중단됐다).
#   판정 근거: `adb exec-out screencap`이 런처 3.4MB·스플래시 137KB인데 이 화면만 **0바이트**,
#   윈도우 플래그도 `fl=81812100`으로 `0x2000`(FLAG_SECURE) 비트가 켜져 있다.
#   ※ `adb shell screencap -p /sdcard/...`는 Android 10 저장소 정책 때문에 **런처에서도 0바이트**라
#     판정에 쓰면 안 된다 — 반드시 `exec-out`으로 대조군과 함께 볼 것.
#   → 이미지 증적 대신 **화면 구성요소 assert**로 대체한다.
#   ※ 이 화면을 벗어난 [01]~[07]의 스크린샷 16개는 전부 다른 액티비티라 정상 동작한다
#     (LoungeActivity / TermsAndConditionV2Activity / FindIdPasswordActivity / ResetPassV2Activity).
- assertVisible:
    id: "usernameId"
- assertVisible:
    id: "securityKeyboardEditText"
- assertVisible:
    id: "btn_submit"
- assertVisible:
    id: "tv_forgotpass"
- assertVisible:
    id: "tvFindUserId"

# ----------------------------------------------------------------
# [01] [Low] Chat - 로그인 화면에서 채팅 화면 이동 확인
# ----------------------------------------------------------------
- tapOn:
    id: "ivChannelTalk"
- waitForAnimationToEnd
- assertVisible:
    text: "Global Money Express"
- takeScreenshot: "[01]_채팅_화면_이동"
- pressKey: Back
- waitForAnimationToEnd

# ----------------------------------------------------------------
# [02] [Low] Register Here - 이용약관 동의 화면 노출 확인
# ----------------------------------------------------------------
- tapOn:
    id: "register"
- waitForAnimationToEnd
- assertVisible:
    text: "${REG_TERMS_TITLE}"
- takeScreenshot: "[02]_이용약관_화면"
- pressKey: Back
- waitForAnimationToEnd

# ----------------------------------------------------------------
# [03] [Low] 아이디 찾기 - 아이디 찾기 화면 이동 확인
# ----------------------------------------------------------------
- tapOn:
    id: "tvFindUserId"
- waitForAnimationToEnd
- assertVisible:
    text: "${LOGIN_FIND_ID_TITLE}"
- takeScreenshot: "[03]_아이디찾기_화면"
- pressKey: Back
- waitForAnimationToEnd

# ----------------------------------------------------------------
# [04] [Low] 비밀번호 찾기 - 비밀번호 찾기 화면 이동 확인
# ----------------------------------------------------------------
- tapOn:
    id: "tv_forgotpass"
- waitForAnimationToEnd
- assertVisible:
    text: "${LOGIN_FIND_PW_TITLE}"
- takeScreenshot: "[04]_비밀번호찾기_화면"
- pressKey: Back
- waitForAnimationToEnd

# ----------------------------------------------------------------
# [05] [Medium] 아이디 찾기 - 휴대폰 번호 / 생년월일 입력 후 조회
# ----------------------------------------------------------------
- tapOn:
    id: "tvFindUserId"
- waitForAnimationToEnd
- assertVisible:
    text: "${LOGIN_FIND_ID_TITLE}"
- takeScreenshot: "[05-1]_아이디찾기_화면"

# 휴대폰 번호 입력 후 키패드 닫기
- tapOn:
    id: "edtMobileNumber"
- inputText: "01090381905"
- pressKey: Enter
- waitForAnimationToEnd
- takeScreenshot: "[05-2]_휴대폰번호_입력"

# 생년월일 선택 (바텀시트 스크롤 휠: 연도/월/일)
- tapOn:
    id: "edtDob"
- waitForAnimationToEnd
- takeScreenshot: "[05-3]_날짜피커_오픈"

# ⚠️ **날짜 휠은 좌표로 만지면 안 된다** (2026-08-26 실측으로 원인 3중 확정).
#   종전 코드는 `point: "27%,68%"` 식이었고 **한 번도 제대로 동작한 적이 없었다**:
#   ① y=68%(1424)는 휠의 **위쪽 버튼**(bounds 1358~1531)이라 longPress하면 값이 계속 **감소**만 한다
#      (실측: 1996 → 1992). 편집용 `numberpicker_input`은 1531~1657(≈76%)이다.
#      68%에서는 포커스도 안 잡히고 키보드도 안 뜬다(`focused=0` / `mInputShown=false`).
#   ② 포커스가 없으니 뒤이은 `pressKey: Enter`가 **바텀시트로 전달돼 시트를 닫아버린다**
#      → `confirmBtn`이 계층에서 사라지고 `Element not found: confirmBtn`으로 실패한다.
#      **이게 원래 증상이라 "id가 틀렸다"로 오진하기 쉽다 — id는 멀쩡하다.**
#   ③ 포커스가 잡혀 키보드가 열리면 바텀시트가 밀려 **좌표가 또 어긋난다**(일자 휠에서 재현).
#   → 좌표를 전부 버리고 **`numberpicker_input`의 index 0/1/2**로 지정한다(연도/월/일).
#     세 휠이 같은 id를 공유하므로 index가 유일하게 안정적인 선택자다.
#   ⚠️ 각 단계 뒤 `assertVisible: confirmBtn`은 **시트가 닫히는 순간을 즉시 잡기 위한 가드**다.
#     빼지 말 것 — 없으면 값이 안 들어간 채로 뒤에서 엉뚱하게 실패한다.

# 연도
- longPressOn:
    id: "numberpicker_input"
    index: 0
- eraseText: 6
- inputText: "1988"
- pressKey: Enter
- waitForAnimationToEnd
- assertVisible:
    id: "confirmBtn"

# 월
- longPressOn:
    id: "numberpicker_input"
    index: 1
- eraseText: 5
- inputText: "Aug"
- pressKey: Enter
- waitForAnimationToEnd
- assertVisible:
    id: "confirmBtn"

# 일
- longPressOn:
    id: "numberpicker_input"
    index: 2
- eraseText: 4
- inputText: "18"
- pressKey: Enter
- waitForAnimationToEnd
- assertVisible:
    id: "confirmBtn"

- takeScreenshot: "[05-4]_날짜_선택완료"
- tapOn:
    id: "confirmBtn"
- waitForAnimationToEnd
# ⚠️ 날짜가 **틀린 값으로 조용히 들어가는** 사고가 있었다(1973-07-04 / 1988-08-26).
#   조회 성공 여부로만 보면 늦게 드러나므로 여기서 값을 직접 확인한다.
#   텍스트 assert는 전체매칭이라 정확한 표시형식(YYYY-MM-DD)으로 적는다.
- assertVisible: "1988-08-18"
- takeScreenshot: "[05-5]_날짜_확인"

- tapOn:
    id: "btn_submit1"
- waitForAnimationToEnd
- assertVisible:
    text: "${LOGIN_SUCCESS}"
- takeScreenshot: "[05-6]_조회결과"

- tapOn: "${REG_CONFIRM}"
- waitForAnimationToEnd
# ⚠️ 조회결과 팝업에서 확인을 누르면 **로그인 화면으로 돌아간다** → `LoginV2Activity`는
#   FLAG_SECURE라 여기서 `takeScreenshot`을 쓰면 플로우가 통째로 죽는다(2026-08-26 실제 EXIT=1).
#   → 이미지 증적 대신 로그인 화면 복귀를 assert로 확인한다.
- assertVisible:
    id: "usernameId"

# ----------------------------------------------------------------
# [06] [Medium] 비밀번호 찾기 - 사용자 ID 입력 후 초기화 요청
# ----------------------------------------------------------------
# ⚠️ 빌드를 하드코딩하면 `-AppId`로 stag를 지정해도 **이 줄에서 livetest가 실행된다**
#   → 파일 헤더와 다른 빌드로 갈아타 버린다. 반드시 ${APP_ID}를 쓸 것.
- launchApp: ${APP_ID}
- waitForAnimationToEnd
- runFlow: "_server_override_old.yaml"
- extendedWaitUntil:
    visible:
      id: "btn_lgn"
    timeout: 20000
- tapOn:
    id: "btn_lgn"
- waitForAnimationToEnd
- tapOn:
    id: "tv_forgotpass"
- waitForAnimationToEnd
- assertVisible:
    text: "${LOGIN_FIND_PW_TITLE}"
- takeScreenshot: "[06-1]_비밀번호찾기_화면"

- tapOn:
    id: "email_mobile"
- inputText: "test007"
- pressKey: Enter
- waitForAnimationToEnd
- takeScreenshot: "[06-2]_아이디_입력"

- tapOn:
    id: "btn_submit"
- waitForAnimationToEnd
- assertVisible:
    text: "${LOGIN_SUCCESS}"
- takeScreenshot: "[06-3]_초기화_결과"

- tapOn: "${REG_CONFIRM}"
- waitForAnimationToEnd
# ⚠️ [05-7]과 같은 이유로 스크린샷을 쓰지 않는다 — 이 팝업을 닫으면 FLAG_SECURE인
#   로그인 화면으로 돌아갈 수 있다. 다만 복귀 화면이 실측으로 확정되지 않아
#   화면 id 대신 **팝업이 닫혔다는 사실**만 검증한다(어느 화면이든 참이라 플로우가 죽지 않는다).
- assertNotVisible: "${LOGIN_SUCCESS}"

# ----------------------------------------------------------------
# [07] [Medium] 이메일 수신 확인 - GME ID / 새 비밀번호
# ----------------------------------------------------------------
- launchApp: com.google.android.gm
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "New Password"
    timeout: 30000
- assertVisible: "GME UserId"
- assertVisible: "New Password"
- takeScreenshot: "[07]_이메일_수신_확인"
