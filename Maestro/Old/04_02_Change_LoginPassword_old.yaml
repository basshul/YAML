appId: ${APP_ID}
env:
  # 현재 비밀번호 = <비밀번호 앞부분><PW_CUR_LAST> / 변경 대상 = <비밀번호 앞부분><PW_NEW_LAST>
  #   "느낌표" = `!`  /  "골뱅이" = `@`
  # ✅ [13] 원복 케이스가 있어 이 파일은 **멱등**하다 — 끝나면 다시 PW_CUR로 돌아온다.
  #    정상 종료하는 한 이 두 줄을 바꿀 필요가 없다.
  #    (단 [13]이 실패해 PW_NEW 상태로 남았다면 그때만 두 줄을 서로 바꿔서 다음 실행을 맞춘다)
  PW_CUR_LAST: "느낌표"
  PW_NEW_LAST: "골뱅이"
---
# ================================================================
# 시나리오: 설정 → 로그인 비밀번호 변경 — 구 UI
# ================================================================
#  진행: **2026-08-14 구 UI 기준 재작성 + 실기기 실행.** [06]~[12] 전 구간 동작 확인.
#    실제 변경(<구 비밀번호(폐기)> → <정상 비밀번호>)과 새 비밀번호 로그인까지 성공했고,
#    마지막 "간편 비밀번호 재등록" 처리만 조건부 문구가 안 맞아 멈춰서 수동으로 마무리한 뒤 고쳤다.
#    (이전 버전은 개편 UI 기준 — 프로필 기어 좌표 탭 + 입력 필드를 51%,25% 같은 퍼센트 좌표로 눌렀다.
#     구 UI는 필드마다 id가 있어 좌표가 필요 없다)
#
# 실행 전 확인 — 이 액티비티가 아니면 이 파일을 돌리지 말 것:
#   adb shell dumpsys window | Select-String mCurrentFocus
#     → ...homeV2.view.HomeActivityV2
#
# 구 UI 화면 구성 (2026-08-14 실측, `UserPasswordChangeV2Activity` / `rootViewChangePassword`):
#   현재 비밀번호   securityKeyboardCurrentPassword   (에러문구 currentPasswordErrorTxt)
#   새 비밀번호     securityKeyboardNewPassword       (에러문구 newPasswordErrorTxt)
#   비밀번호 확인   securityKeyboardConfirmPassword   (에러문구 confirmPasswordErrorTxt)
#   규칙 체크박스   checkAlphabet(대·소문자 각 1개↑) / checkNumber / checkSpecialChar /
#                  checkMinCharCount("${PW_MIN_CHAR_COUNT}") / checkPassMatch
#   저장 btn_submit / 뒤로 iv_back
#   ※ 세 필드의 자식은 전부 같은 id(`securityKeyboardEditText`)라 **컨테이너 id로 탭**해야 한다.
#
# ================================================================
# 🔑 테스트 계정 비밀번호 정책 (2026-08-14 사용자 확정)
# ================================================================
# 자동화가 쓰는 로그인 비밀번호는 **`<정상 비밀번호>` / `<대체 비밀번호>` 두 가지**로 운용한다.
# (`<구 비밀번호(폐기)>`는 admin에서 임의 발급했던 값이고 표준이 아니다)
#
# 이 파일은 **한 번 실행에 왕복**한다: `<정상 비밀번호>` → `<대체 비밀번호>`([12]) → `<정상 비밀번호>`([13]).
#   끝나면 원래 값으로 돌아오므로 같은 비밀번호를 쓰는 다른 파일
#   (`04_01_Change_SimplePassword_old`의 `PW_CUR_LAST` 등)이 계속 유효하다.
#
#   ▶ 2026-08-14: <구 비밀번호(폐기)>(admin 발급) → **<정상 비밀번호>** 로 전환 완료. 이후 상시 유효값 = `<정상 비밀번호>`
#
# ⚠️ **[12] 중간에 실패하면 현재 비밀번호가 불분명해진다.** 추측 로그인 금지 — 5회 실패면 계정 잠금
#   (실패 팝업이 "남은 시도 횟수: N번"을 알려준다). 로그·스크린샷으로 어디까지 갔는지 먼저 확인할 것.
# ⚠️ [11]은 현재 비밀번호를 **일부러 틀리게 제출**하는 음성 케이스다(실패 카운터 소모 가능).
#
# 보안 키패드 문자 매핑(content-desc): G→"대문자 키보드 변경"+"Capital G 히읃" / m→"m 으" /
#   e→"e 디귿" / t→"t 시옫" / s→"s 니은" / 숫자는 값 그대로 /
#   !→"특수문자변경"+"느낌표" / @→"특수문자변경"+"골뱅이" / 완료→"입력완료"
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\04_02_Change_LoginPassword_old.yaml"
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 → 설정 ----------------
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
# 잠금화면 판정은 문구가 아니라 id로 한다
- runFlow:
    when:
      visible:
        id: "input_dot_1"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
# ⚠️ **홈 팝업은 큐로 뜨고 문구가 가드와 다르다**(2026-09-01, 04_Menu_History에서 실측).
#   "중요 공지사항/최신 신분증을 업로드해 주세요" 팝업의 버튼은 **"다음에 하기"(`btnCancel`)** 라
#   위 `"나중에 하기"` **전체매칭** 가드로는 잡히지 않고 조용히 SKIP된다.
#   그러면 팝업이 홈을 덮어 아래 `iv_nav` 대기가 실패한다.
#   ⛔ 이 파일에서 그 실패가 나면 **[13] 원복이 중단돼 계정이 `<비밀번호 앞부분>${PW_NEW_LAST}` 로 남는다**
#     → 검증된 공용 헬퍼로 큐를 비운다(전부 조건부라 팝업이 없으면 그냥 통과).
- runFlow: "_dismiss_popups_stag_old.yaml"
# ⚠️ **`launchApp` 은 마지막에 보던 화면을 복원한다**(2026-09-15 실측).
#   21_Card 뒤에는 카드 탭, 그 다음엔 **카드 상세**(하단 탭조차 없는 깊은 화면)로 떴다.
#   그 화면에는 홈 요소가 없어 진입이 4스텝째에 죽는다 → 홈까지 **빠져나온다**:
#     하단 탭이 보이면 홈 탭을 누르고, 안 보이면 back 으로 한 겹 올라온다.
#   판정은 `btnTransfer` 가 아니라 **`iv_nav`**(홈 툴바 드로어) 다 — 홈은 스크롤 위치를 유지해
#   상단 카드가 화면 밖일 수 있고, 바로 다음 스텝이 그 `iv_nav` 탭이다.
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            notVisible:
              id: "iv_nav"
          commands:
            - runFlow:
                when:
                  visible:
                    id: "bottom_item_home"
                commands:
                  - tapOn:
                      id: "bottom_item_home"
            - runFlow:
                when:
                  notVisible:
                    id: "bottom_item_home"
                commands:
                  - pressKey: back
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "iv_nav"
    timeout: 60000
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "txt_user_email"
    commands:
      - tapOn:
          id: "iv_nav"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txt_user_email"
    timeout: 15000
- tapOn:
    text: "${CH_COMMON_SETTINGS}"
    above:
      id: "bottom_item_home"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "view_change_password"
    timeout: 20000

