      notVisible:
        text: "Capital G 히읃"
    commands:
      - tapOn: "대문자 키보드 변경"
      - waitForAnimationToEnd
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "t 시옫"
- tapOn: "e 디귿"
- tapOn: "s 니은"
- tapOn: "t 시옫"
- tapOn: "1"
- tapOn: "특수문자변경"
- tapOn: "${PW_NEW_LAST}"
- tapOn: "${TRANSKEY_INPUT_COMPLETE}"
- waitForAnimationToEnd
- assertVisible:
    id: "checkAlphabet"
    checked: true
- assertVisible:
    id: "checkNumber"
    checked: true
- assertVisible:
    id: "checkSpecialChar"
    checked: true
- assertVisible:
    id: "checkMinCharCount"
    checked: true
# 확인 입력(일치) → checkPassMatch + 저장 활성화
- tapOn:
    id: "securityKeyboardConfirmPassword"
- runFlow:
    when:
      notVisible:
        text: "Capital G 히읃"
    commands:
      - tapOn: "대문자 키보드 변경"
      - waitForAnimationToEnd
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "t 시옫"
- tapOn: "e 디귿"
- tapOn: "s 니은"
- tapOn: "t 시옫"
- tapOn: "1"
- tapOn: "특수문자변경"
- tapOn: "${PW_NEW_LAST}"
- tapOn: "${TRANSKEY_INPUT_COMPLETE}"
- waitForAnimationToEnd
- assertVisible:
    id: "checkPassMatch"
    checked: true
- assertVisible:
    id: "btn_submit"
    enabled: true
- takeScreenshot: pw01_rules_ok
# 저장하지 않고 이탈
- tapOn:
    id: "iv_back"
- extendedWaitUntil:
