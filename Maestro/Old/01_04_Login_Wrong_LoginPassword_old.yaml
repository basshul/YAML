appId: ${APP_ID}
env:
  # ⚠️⚠️ **Maestro 는 플로우 헤더의 `env:` 기본값이 `--env` 를 덮어쓴다** (2.5.1 실측, 2026-09-01).
  #   그래서 LOCK_ID / CONFIRM_LOCK 은 **여기에 두지 않는다.** 두면 --env 로 넘긴 값이 무시돼
  #   인터록이 영원히 열리지 않는다(실제로 그렇게 두 번 실패했다).
  #   검증: env 기본값이 있는 프로브는 --env 를 줘도 FAILED, 없는 프로브는 COMPLETED.
  #   → 호출자가 바꿔야 하는 값은 env 블록에 적지 말 것. 아래 PW_LAST 처럼 **고정값만** 둔다.
  #
  # 틀린 비밀번호 = 정상 비밀번호에서 숫자 하나를 덧붙인 값.
  # 보안 키패드 라벨을 새로 찾을 필요가 없고(01_01 과 동일한 키만 사용),
  # **표준 2종(<정상 비밀번호>/<대체 비밀번호>) 어느 쪽과도 겹치지 않는다** — 겹치면 로그인이 성공해 버린다.
  PW_LAST: "느낌표"
---
# ================================================================
# 01_04 로그인 비밀번호 5회 실패 → 계정 잠금 동작 확인 — 구 UI
#
# 체크리스트: Login / Complex Password / "로그인 5회 실패 동작 확인" (2026-09-01 기준 r51)
#   ⚠️ 종전 매핑은 이 행에 `01_02_Login_Wrong_SimplePassword`(간편비밀번호 yaml)를
#      붙여 두었으나 그건 **PIN** 5회이지 **로그인 비밀번호** 5회가 아니다. 이 파일이 그 자리를 채운다.
#
# 케이스:
#   [01] [High] 안전 인터록 확인 (CONFIRM_LOCK 미동의 시 즉시 실패)
#   [02] [High] clearState 후 로그인 화면 진입
#   [03] [High] 틀린 비밀번호 5회 연속 입력 — 매 회 오류 안내 후 로그인 화면 잔류 확인
#   [04] [High] 5회 초과 시 계정 잠금 안내 노출 확인 + 로그인 화면 진입 불가 확인
#
# ⛔⛔ 되돌릴 수 없다 ⛔⛔
#   이 플로우는 **성공하면 계정이 잠긴다.** 해제는 앱에서 자동으로 되지 않는다
#   (비밀번호 찾기 → 문자/이메일 수신, 또는 운영팀 요청). 잠긴 계정은 다른 모든 플로우에서 쓸 수 없다.
#   → **전용 계정에만 쓸 것.** seungsoo818(스위트 전체가 의존) / test123(14_02, 25_Profile_Foreign)
#     / test251024(14_03) 에는 **절대 쓰지 말 것.**
#   → 회귀 스위트에 넣지 말 것. run_suite.ps1 등록 금지.
#
# 실행 (두 값을 모두 넘겨야 동작한다):
#   $PSNativeCommandArgumentPassing = 'Legacy'
#   maestro test --env APP_ID="com.gmeremit.online.gmeremittance_native.livetest" `
#                --env LOCK_ID="<전용계정ID>" --env CONFIRM_LOCK="YES" `
#                "Old\01_04_Login_Wrong_LoginPassword_old.yaml"
#
# 미확정 사항 (실기기 1회 실행 후 확정할 것 — 계정을 소모하므로 아직 돌리지 않았다):
#   (a) 5회째 이후 실제 문구. 아래 [04] 는 "잠금/제한/초과/5회" 를 포괄하는 정규식으로 두었다.
#       실측 문구가 확인되면 그 문구로 좁힐 것 — 지금 상태로는 **다른 오류 문구에도 통과할 수 있다.**
#   (b) 실패 1회마다 비밀번호 입력값이 자동으로 비워지는지. 아래는 비워진다는 가정을 두지 않고
#       매 회 필드를 새로 열어 입력한다.
#   (c) 잠금 도달이 5회째인지 5회 초과(6회째)인지. 앱 문구가 "5회"라 5회로 잡았다.
# ================================================================

# ----------------------------------------------------------------
# [01] [High] 안전 인터록 — 동의 없이는 한 번도 시도하지 않는다
# ----------------------------------------------------------------
# ⚠️ 이 단언이 **모든 입력보다 앞에** 있어야 한다. 뒤에 두면 이미 시도를 소모한 뒤 실패한다.
# typeof 가드가 핵심이다 — --env 를 안 넘기면 변수 자체가 없어서, 가드가 없으면 ReferenceError 가
# 어떻게 처리되는지에 인터록의 안전성이 좌우된다. 가드가 있으면 **미지정 = 실패(닫힘)** 로 확정된다.
- assertTrue: ${typeof CONFIRM_LOCK !== 'undefined' && CONFIRM_LOCK === 'YES'}
- assertTrue: ${typeof LOCK_ID !== 'undefined' && LOCK_ID.length > 0 && LOCK_ID !== 'SET_ME'}

# ----------------------------------------------------------------
# [02] [High] clearState 후 로그인 화면 진입
# ----------------------------------------------------------------
# clearState 는 로그아웃시킨다(= 이 플로우 실행 후 재로그인 필요). 01_01 의 진입 블록과 같은 구조다.
- launchApp:
    clearState: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Server Override|서비스 이용 안내|신규 회원"
    timeout: 30000
# 서버 선택은 clearState 로 빌드 기본값으로 초기화된다 → 헬퍼로 LIVETEST 를 강제한다.
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      - runFlow: "_server_override_old.yaml"
- runFlow:
    when:
      visible: "${INIT_SERVICE_GUIDE}"
    commands:
      - tapOn:
          id: "btnConfirm"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "허용"
          commands:
            - tapOn: "허용"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "허용"
          commands:
            - tapOn: "허용"
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btn_lgn"
    timeout: 30000
- tapOn:
    id: "btn_lgn"
- extendedWaitUntil:
    visible:
      id: "usernameId"
    timeout: 20000

# ----------------------------------------------------------------
# [03] [High] 틀린 비밀번호 5회 연속 입력
# ----------------------------------------------------------------
# 틀린 값 = 정상 비밀번호 키 시퀀스에서 숫자 "1" 을 한 번 더 누른 것.
# ⚠️ securityKeyboardEditText 탭 직후 transKeypad_row4 를 누르지 말 것 — 문자가 하나 더 들어가
#    비밀번호가 깨진다(01_01 주석의 2026-08-14 사고).
# ⚠️ securityKeyboardClearAllImageView 는 **이 화면에 없다**(01_01 주석). 지우기에 기대지 않는다.
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "usernameId"
      - eraseText: 50
      - inputText: "${LOCK_ID}"
      - tapOn:
          id: "securityKeyboardEditText"
      # 대문자 레이어가 아니면 전환 (첫 회차 외에는 이미 전환돼 있을 수 있다)
      - runFlow:
          when:
            notVisible:
              text: "Capital G 히읃"
          commands:
            - tapOn: "대문자 키보드 변경"
            - waitForAnimationToEnd
      - tapOn: "Capital G 히읃"
      - tapOn: "m 으"
      - tapOn: "e 디귿"
      - tapOn: "t 시옫"
      - tapOn: "e 디귿"
      - tapOn: "s 니은"
      - tapOn: "t 시옫"
      - tapOn: "1"
      - tapOn: "1"          # ← 여분의 숫자. 이 한 글자가 "틀린 비밀번호"를 만든다.
      - tapOn: "특수문자변경"
      - tapOn: "${PW_LAST}"
      - tapOn: "입력완료"
      - waitForAnimationToEnd
      # 오류 안내 팝업 처리. 마지막 회차에서는 잠금 안내로 바뀔 수 있으므로 optional 이다.
      - tapOn:
          text: "확인|OK"
          optional: true
      - waitForAnimationToEnd

# ----------------------------------------------------------------
# [04] [High] 계정 잠금 안내 노출 + 로그인 진입 불가 확인
# ----------------------------------------------------------------
# ★ 2026-09-09 실기기 1회 실행으로 **헤더의 미확정 3건이 확정됐다**(test007 소모):
#   (a) 서버 Msg 는 **영문**이다 — 1~5회 `"Login Failed - you have N Attempts Left"`,
#       잠금 시 `"Login Failed - Too many wrong attempts, Please contact GME support!"`.
#       반면 **UI 다이얼로그는 한글**이다:
#         `txt_dialog_title`="실패" / `txt_dialog_message`="로그인 시도 횟수를 초과했습니다.
#         (개행) 고객센터(1811-2961)로 문의해 주세요." / `btn_diaog_ok`="확인"
#   (b) 실패해도 ID 는 유지되고 비밀번호 칸만 비워진다(그래서 매 회차 필드를 새로 연다 — 그대로 둔다).
#   (c) ⚠️ **잠금 안내는 5회째가 아니라 "그 다음 시도"(6회째)에 뜬다.**
#       5회째 응답은 아직 `"0 Attempts Left"` 이고, 화면은 로그인 폼으로 돌아간다.
#       종전 코드는 5회 직후에 잠금 문구를 기다려서 **정상 동작인데도 FAILED** 로 찍혔다.
#   → 5회를 채운 뒤 **한 번 더 시도**해서 잠금 다이얼로그를 확인한다(이미 0회라 추가 소모 없음).
- tapOn:
    id: "securityKeyboardEditText"
- runFlow:
    when:
      notVisible: "Capital G 히읃"
    commands:
      - tapOn: "대문자 키보드 변경"
      - waitForAnimationToEnd
- tapOn: "Capital G 히읃"
- tapOn: "m 으"
- tapOn: "e 디귿"
- tapOn: "t 시옫"
- tapOn: "e 디귿"
- tapOn: "s 니은"
- tapOn: "t 시옫"
- tapOn: "1"
- tapOn: "1"
- tapOn: "특수문자변경"
- tapOn: "${PW_LAST}"
- tapOn: "입력완료"
- waitForAnimationToEnd
# ⚠️ 조건부 처리만 두면 아무것도 안 떠도 EXIT=0 이 된다 → 결과 도달을 먼저 강제한다.
#    문구는 개행이 섞이므로 [\s\S]* 를 쓴다(이중인용의 백슬래시 2겹 문제를 피해 단일인용).
#    ⛔ 다이얼로그를 **닫기 전에** 판정할 것 — 닫고 나서 보면 문구가 이미 사라져 있다
#      (종전 실패의 실제 원인이 이것이었다: 회차 루프가 매번 "확인"을 눌러 5회째 문구까지 지웠다).
- extendedWaitUntil:
    visible:
      id: "txt_dialog_message"
    timeout: 30000
- assertVisible:
    text: '[\s\S]*(초과|잠금|잠겼|제한|Too many wrong attempts)[\s\S]*'
- takeScreenshot: login_pw_5fail_locked
- tapOn:
    text: "확인|OK"
    optional: true
- waitForAnimationToEnd
# 잠긴 뒤에는 정상 비밀번호로도 홈에 도달하지 못해야 한다.
# 여기서는 **홈에 도달하지 않았음**만 확인한다 — 정상 비밀번호를 넣어보면 잠금 상태에 따라
# 시도 횟수를 더 소모할 수 있어, 확인 목적으로 추가 입력을 하지 않는다.
- assertNotVisible:
    id: "bottom_item_home"
- assertVisible:
    id: "usernameId"
