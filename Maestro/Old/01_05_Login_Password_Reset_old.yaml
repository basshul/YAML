appId: ${APP_ID}
---
# ================================================================
# 01_04 비밀번호 찾기 / 초기화 ([06][07]) — 🔴 파괴적
#
# 🔴 **[06]은 seungsoo818의 비밀번호를 실제로 초기화한다.**
#   앱이 임의값으로 바꿔 메일로 보내며, 모든 yaml은 정상 비밀번호를 전제하므로
#   이 파일을 돌린 뒤에는 **admin 재설정 전까지 어떤 플로우도 돌지 않는다.**
#   `04_02_Change_LoginPassword_old`로는 원복 불가 — 그 파일은 정상↔대체 왕복 전용이다.
#   → **admin 콘솔에 즉시 붙을 수 있을 때만** 실행할 것. 회귀 스위트 기본 세트에서 제외한다.
#
# 원본 `01_Login_screen_old.yaml`에서 분리했다(2026-09-02). 원본은 그대로 남아 있다.
#
# 테스트 항목:
#   [06] [Medium] 비밀번호 찾기 - 사용자 ID 입력 후 초기화 요청
#   [07] [Medium] 이메일 수신 확인 - GME ID / 새 비밀번호 (30초 타임아웃)
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\01_05_Login_Password_Reset_old.yaml"
# ================================================================
# ⚠️ 진입 블록(launchApp clearState → Server Override → 언어 전환 → 로그인 화면 assert)은
#   **원본 `01_Login_screen_old.yaml` 19~79행을 그대로 복사한 것**이다.
#   원본을 고치면 여기도 같이 고칠 것 — 분리본이 갈라지면 조용히 깨진다
#   (`_Korean`/`_Foreigner` 분리 때 Server Override 블록이 통째로 빠져 첫 화면에서 죽은 전례).
#   ⛔ `LoginV2Activity`는 FLAG_SECURE라 takeScreenshot을 넣으면 플로우가 통째로 죽는다.

- launchApp:
    clearState: true
- waitForAnimationToEnd
- waitForAnimationToEnd

# Server Override 다이얼로그(livetest 빌드 서버선택 스플래시) 노출 시 CONTINUE
- extendedWaitUntil:
    visible:
      text: "Server Override|언어 선택|신규 회원"
    timeout: 20000
- runFlow: "_server_override_old.yaml"

# 서비스 이용 안내 팝업 (조건부)
- runFlow:
    when:
      visible: "${INIT_SERVICE_GUIDE}"
    commands:
      - tapOn:
          id: "btnConfirm"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "허용"
          commands:
            - tapOn: "허용"
            - waitForAnimationToEnd

# clearState 후 언어 자동 전환 (en 실행 시: "신규 회원" 감지 → English 전환)
- runFlow:
    when:
      visible: "${LANG_SWITCH_TRIGGER}"
    commands:
      - tapOn:
          id: "selectLangBg"
      - waitForAnimationToEnd
      - tapOn: "${LANG_SWITCH_TARGET}"
      - waitForAnimationToEnd

- tapOn:
    id: "btn_lgn"
- waitForAnimationToEnd
# ⚠️ **`LoginV2Activity`는 FLAG_SECURE라 스크린샷을 찍을 수 없다**(2026-08-26 확정).
#   Maestro는 여기서 `INTERNAL: Screenshot returned null`로 **플로우 전체가 죽는다**
#   (실제로 이 파일이 1분 9초 만에 EXIT=1로 중단됐다).
#   판정 근거: `adb exec-out screencap`이 런처 3.4MB·스플래시 137KB인데 이 화면만 **0바이트**,
#   윈도우 플래그도 `fl=81812100`으로 `0x2000`(FLAG_SECURE) 비트가 켜져 있다.
#   ※ `adb shell screencap -p /sdcard/...`는 Android 10 저장소 정책 때문에 **런처에서도 0바이트**라
#     판정에 쓰면 안 된다 — 반드시 `exec-out`으로 대조군과 함께 볼 것.
#   → 이미지 증적 대신 **화면 구성요소 assert**로 대체한다.
#   ※ 이 화면을 벗어난 [01]~[07]의 스크린샷 16개는 전부 다른 액티비티라 정상 동작한다
#     (LoungeActivity / TermsAndConditionV2Activity / FindIdPasswordActivity / ResetPassV2Activity).
- assertVisible:
    id: "usernameId"
- assertVisible:
    id: "securityKeyboardEditText"
- assertVisible:
    id: "btn_submit"
- assertVisible:
    id: "tv_forgotpass"
- assertVisible:
    id: "tvFindUserId"
# [06] [Medium] 비밀번호 찾기 - 사용자 ID 입력 후 초기화 요청
# ----------------------------------------------------------------
# ⚠️ 빌드를 하드코딩하면 `-AppId`로 stag를 지정해도 **이 줄에서 livetest가 실행된다**
#   → 파일 헤더와 다른 빌드로 갈아타 버린다. 반드시 ${APP_ID}를 쓸 것.
- launchApp: ${APP_ID}
- waitForAnimationToEnd
- runFlow: "_server_override_old.yaml"
- extendedWaitUntil:
    visible:
      id: "btn_lgn"
    timeout: 20000
- tapOn:
    id: "btn_lgn"
- waitForAnimationToEnd
- tapOn:
    id: "tv_forgotpass"
- waitForAnimationToEnd
- assertVisible:
    text: "${LOGIN_FIND_PW_TITLE}"
- takeScreenshot: "[06-1]_비밀번호찾기_화면"

- tapOn:
    id: "email_mobile"
- inputText: "seungsoo818"
- pressKey: Enter
- waitForAnimationToEnd
- takeScreenshot: "[06-2]_아이디_입력"

- tapOn:
    id: "btn_submit"
- waitForAnimationToEnd
- assertVisible:
    text: "${LOGIN_SUCCESS}"
- takeScreenshot: "[06-3]_초기화_결과"

- tapOn: "${REG_CONFIRM}"
- waitForAnimationToEnd
# ⚠️ [05-7]과 같은 이유로 스크린샷을 쓰지 않는다 — 이 팝업을 닫으면 FLAG_SECURE인
#   로그인 화면으로 돌아갈 수 있다. 다만 복귀 화면이 실측으로 확정되지 않아
#   화면 id 대신 **팝업이 닫혔다는 사실**만 검증한다(어느 화면이든 참이라 플로우가 죽지 않는다).
- assertNotVisible: "${LOGIN_SUCCESS}"

# ----------------------------------------------------------------
# [07] [Medium] 이메일 수신 확인 - GME ID / 새 비밀번호
# ----------------------------------------------------------------
# ⚠️⚠️ **전제: 메일 앱에 그 계정의 등록 이메일이 로그인돼 있어야 한다.**
#   2026-09-09 실측: `[06]`(초기화)은 성공했는데 여기서 실패했다 — 원인은 메일 지연도,
#   셀렉터도 아니라 **Gmail 앱에 다른 계정이 로그인돼 있어서** 초기화 메일이 안 보인 것이었다
#   (검색해도 없었다). 증상만 보면 "메일이 안 왔다"로 오진하기 쉽다.
#   → 받은편지함이 **기대한 주소**인지 먼저 확인한다. 주소는 코드에 적지 않고 호출자가 넘긴다:
#       run_test.ps1 ... 로는 넘길 수 없으니 이 케이스만 maestro 로 직접 실행한다.
#       maestro test --env APP_ID="..." --env MAIL_ACCOUNT="<등록 이메일>" "Old/_05_...yaml"
#     MAIL_ACCOUNT 를 안 넘기면 계정 확인은 건너뛰고 메일 본문만 본다(종전 동작).
- launchApp: com.google.android.gm
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${typeof MAIL_ACCOUNT !== 'undefined' && MAIL_ACCOUNT.length > 0}
    commands:
      # 받은편지함 상단 계정 표시(접근성 라벨 "<이름> <주소> 계정으로 로그인")로 판정한다.
      - assertVisible: '[\s\S]*${MAIL_ACCOUNT}[\s\S]*'
- extendedWaitUntil:
    visible:
      text: "New Password"
    timeout: 30000
- assertVisible: "GME UserId"
- assertVisible: "New Password"
- takeScreenshot: "[07]_이메일_수신_확인"