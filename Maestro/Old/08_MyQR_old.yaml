# 수취인 세부 정보 확인 바텀시트
- extendedWaitUntil:
    visible:
      id: "btnConfirmFinal"
    timeout: 30000
- assertVisible: "${CONFIRM_RECEIVER_DETAILS_TEXT}"
- assertVisible: ".*KAKAO Bank.*"
- assertVisible: ".*3333276033972.*"
- assertVisible: ".*1 KRW.*"
- takeScreenshot: "[05-2]_수취인세부정보_확인"
- tapOn:
    id: "btnConfirmFinal"
# 간편 비밀번호 <정상 PIN> — 잠금화면 컴포넌트를 재사용한다(`input_dot_1`).
# ⚠️ 이 화면은 보안 키패드라 **스크린샷 금지**(FLAG_SECURE) → assert로만 확인한다.
