# ----------------------------------------------------------------
# [05] [High] Sending - QR 스캔 진입 확인
# ----------------------------------------------------------------
# ⚠️ **실제 송금은 하지 않는다**(헤더 "의도적으로 뺀 것" 참고). 자동입력 확인까지만 본다.
#   경로: (계좌+금액 세팅 → QR 저장) → scanqr → DomesticRemitActivity(출금 계좌 → 계속)
#         → DomesticQrScanView → galleryImagePick → 저장한 QR 선택 → 국내송금 화면 자동입력 확인
#
# ⚠️ **순서가 중요하다** — QR 세팅·저장은 **My QR 화면에서** 해야 한다.
#   `scanqr`를 먼저 누르면 화면이 스캔 쪽으로 넘어가 `accountinfo`가 없어진다
#   (2026-08-19 실제로 이 순서를 잘못 짜서 `Tap on id: accountinfo... FAILED`로 죽었다).
#
# ⚠️ 앞의 [04]가 저장한 QR은 **GME Wallet / 금액 없음** 상태다([02][03]이 원복하기 때문).
#   "금액이 담긴 QR"을 검증하려면 **여기서 계좌+금액을 세팅해 QR을 새로 저장**해야 한다.
- tapOn:
    id: "accountinfo"
- extendedWaitUntil:
    visible:
      id: "rvKftcList"
    timeout: 20000
# ⚠️ 실송금 조합이라 계좌를 **의도적으로 고정**한다 → 동적 선택 금지.
#   대신 전제를 단언한다(연동 계좌 목록은 계정 상태에 따라 바뀐다).
- assertVisible: "${KFTC_BANK}"
- tapOn: "${KFTC_BANK}"
- extendedWaitUntil:
    visible:
      id: "qrimage"
    timeout: 20000
- tapOn:
    id: "enteramount"
- extendedWaitUntil:
    visible:
      id: "amount"
    timeout: 15000
- tapOn:
    id: "amount"
- inputText: "1"
- hideKeyboard
- tapOn:
    point: "50%, 20%"
- extendedWaitUntil:
    visible:
      id: "qrimage"
    timeout: 20000
- assertVisible: ".*1 원.*"
- assertVisible: ".*카카오뱅크.*"
# 이 상태(카카오뱅크 + 1원)로 QR 저장
- tapOn:
    id: "download"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "qrimage"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "qrimage"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "qrimage"
    timeout: 20000

# 스캔 → 갤러리에서 방금 저장한 QR 선택
# ※ 피커(`com.android.documentsui`)는 최근순 정렬이고 파일명이 `gmeqr*.jpg`다.
#   run_test.ps1이 push하는 test_*.jpg가 더 최신이라 앞에 오지만,
#   **`gmeqr` 패턴 중 첫 번째가 방금 저장한 QR**이다(실행마다 (1)(2)(3)… 늘어난다).
- tapOn:
    id: "scanqr"
- extendedWaitUntil:
    visible:
      id: "paymentSourceListRv"
    timeout: 20000
- assertVisible: "${SCR_SELECT_WITHDRAW}"
- assertVisible:
    id: "btn_ok"
- tapOn:
    id: "btn_ok"
- extendedWaitUntil:
    visible:
      id: "galleryImagePick"
    timeout: 20000
- assertVisible: "${GME_SCAN_QR_TEXT}"
- assertVisible:
    id: "scanToPay"
- takeScreenshot: "[05]_QR스캔_화면진입"
- tapOn:
    id: "galleryImagePick"
- extendedWaitUntil:
    visible: "gmeqr.*"
    timeout: 30000
- tapOn:
    text: "gmeqr.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "recipientAccountNoFormInputField"
    timeout: 30000
- assertVisible: "${SCR_DOMESTIC_REMIT}"
# QR에 담긴 값이 그대로 채워졌는지 — 은행 / 금액
- assertVisible: ".*카카오뱅크.*"
- assertVisible:
    id: "amount"
- assertVisible: ".*1 원.*"
- assertVisible:
    id: "btn_ok2"
- takeScreenshot: "[05-1]_QR스캔_금액자동입력"

