    timeout: 20000

# ---- 받는 계좌 = 카카오뱅크 (이미 그 상태면 건너뛴다) ----
- runFlow:
    when:
      notVisible: ".*카카오뱅크.*"
    commands:
      - tapOn:
          id: "accountinfo"
      - extendedWaitUntil:
          visible:
            id: "rvKftcList"
          timeout: 20000
      # ⚠️ 실송금 조합이라 계좌 고정. 동적 선택 금지 — 전제만 단언한다.
      - assertVisible: "${KFTC_BANK}"
      - tapOn: "${KFTC_BANK}"
      - extendedWaitUntil:
          visible:
            id: "qrimage"
          timeout: 20000
- assertVisible: ".*카카오뱅크.*"

# ---- 금액 **미입력** 상태를 보장한다 ----
# `enteramount` 라벨이 "금액 입력"이면 비어 있다는 뜻이고, 값이 있으면 "1 원"처럼 바뀐다.
