appId: ${APP_ID}
---
# ⚠️ 2026-09-14: 진입 가드를 **id 로 바꿨다.** 종전 한국어 문구 대안 매칭
#   (`"4자리 숫자를 입력하세요|홈으로"`)은 **en 실행에서 진입부터 막았다**(영문 UI 는
#   `Enter the 4-digit number`/`Home`). 이 가드가 26개 파일 55곳에 있었다.
#   id 는 언어에 흔들리지 않는다: 잠금화면·PIN 생성=`input_dot_1` / 홈=`bottom_item_home`
#   / Server Override=`button1`.
# ================================================================
# 시나리오: MY QR — 구 UI
# ================================================================
#  진행: 2026-08-19 구 UI 기준 **전면 재작성**. 이전 버전은 개편 UI 기준이라 진입부터 깨졌다.
#
# 실행 전 확인 — 이 액티비티가 아니면 이 파일을 돌리지 말 것:
#   adb shell dumpsys window | Select-String mCurrentFocus
#     → ...homeV2.view.HomeActivityV2
#
# ★ 이 재작성의 핵심: **좌표를 거의 다 버렸다.**
#   종전 파일은 좌표 탭이 11군데였고 "기기 교체 시 재보정 필수"라는 주석까지 달려 있었다
#   (S23 1080x2340 → Note 9 1080x2220으로 바뀌며 6개 중 4개가 어긋난 이력).
#   구 UI는 native라 **필요한 요소에 id가 전부 있다** → 해상도 의존이 사라졌다.
#   (남은 좌표는 [03]의 "바텀시트 바깥 탭" 한 종류뿐이고, 이건 좌표 말고 방법이 없다)
#
# 개편UI → 구 UI 구조 차이 (2026-08-19 실측):
#   진입    개편UI는 홈 우상단 좌표(76%,7%)로 My QR 직행.
#           구 UI는 **홈 잔액 카드의 아이콘 스위처**를 거친다:
#             `qrScan`(카드 상단 QR 아이콘) → 카드가 QR 페이지로 바뀌고 하단 버튼 라벨이
#             `btnTransfer`="지금 송금하기" / `txvDepositOrViewStatement`="받기" 로 바뀐다
#             → **"받기"(`txvDepositOrViewStatement`)** 를 눌러야 My QR로 간다.
#           ⚠️ 잔액 카드는 홈 **최상단**에 있다. 직전 케이스에서 스크롤된 채 돌아오면 카드가
#             접근성 트리에 없으므로 `scrollUntilVisible`(UP)로 먼저 올려야 한다.
#   My QR  `domestic_qr.DomesticQrGenerateView` / title "내 QR"
#           customername / qrcard+qrimage / **enteramount**("금액 입력") / receive_to("받을 계좌:")
#           / **accountinfo**("GME Wallet (…)") / **download**(QR 저장) / **share**(QR 공유하기)
#           / **scanqr**(우상단 스캔) / back
#           ⚠️ 구 UI My QR에는 **"글로벌 QR"·"국내 송금" 버튼이 없다**(개편UI에만 있던 것).
#             종전 [02]는 그 두 버튼을 눌렀는데 구 UI에서는 성립하지 않아 케이스를 재정의했다.
#   계좌변경 `accountinfo` 탭 → 바텀시트 `txvTitle`("받는 계좌") / `close` / `rvKftcList`
#           / 행마다 name(은행명) + balance(계좌번호). **은행명 텍스트로 탭**한다
#           (행 순서는 계정의 연결 계좌에 따라 밀리므로 index·좌표 금지 — 개편UI 시절 실제 사고).
#   금액입력 `enteramount` 탭 → 바텀시트에 `amount` 입력칸 하나뿐(확인 버튼 없음).
#           숫자 입력 후 **시트 바깥을 탭**하면 닫히면서 값이 확정되고, `enteramount` 라벨이
#           "금액 입력" → "1 원"으로 바뀐다(이 변화로 판정한다).
#   QR스캔  `scanqr` → **`domesticremit.send.view.DomesticRemitActivity`**(출금 계좌 선택,
#           행 id `mainlayout`, 하단 `btn_ok`"계속") → **`domestic_qr.DomesticQrScanView`**
#           (title "QR 스캔" / scanToPay / **galleryImagePick**). 개편UI의 `galleryImagePick`은 그대로다.
#
# ✅ **송금 완주까지 커버한다 (2026-08-20 KFTC 복구 후 추가)**
#   2026-08-19에는 `btn_ok2`("계속")를 누르면 **"실패 - (06640154622502) / Failed"** 만 떴다.
#   🚫 원인은 **livetest 환경의 KFTC 서버 연결 불가**였다(환경 이슈 / 앱 결함 아님).
#      금액·은행을 바꿔도 동일했다(카카오뱅크 1원·1,000원 / 케이뱅크 1,000원) → 조합 문제가 아니었다.
#   ✅ **2026-08-20 KFTC 복구 확인** → `btn_ok2` 이후 구간(수취인 세부 정보 확인 → 간편비밀번호
#      1212 → 성공 시트 → 영수증 SUCCESS)을 [05]에 붙였고 **EXIT=0 2회 / 165스텝**으로 검증했다.
#   💰 금액은 **1원으로 유지**한다(2026-08-20 사용자 지시 — 어제 1,000원으로 올렸던 것을 되돌렸다).
#      GME Wallet → 카카오뱅크로 실제 1원이 나가지만 **본인 계좌 간 이동이라 손실이 아니다.**
#   ※ QR 공유(Teams 전송)도 빼지 않았다 — 수신자가 본인이라 안전하다([01] 주석 참고).
#
# 케이스 목록:
#   [01] Receive - QR코드 공유동작 확인            (Teams로 본인에게 전송까지 완주)
#   [02] Receive - 받는 계좌 변경 동작 확인        (기본 GME Wallet → 신한은행 → 원복)
#   [03] Receive - 금액 입력 동작 확인             (1원 입력 → 반영 → 원복)
#   [04] Receive - QR코드 저장 동작 확인
#   [05] Sending - QR 스캔 진입 + **금액 담긴 QR 스캔 시 자동입력 확인** → **송금 완주**
#        (계좌+금액 세팅 → QR 저장 → 스캔 → 은행·금액 자동입력 → 확인 → PIN → 성공 → 영수증)
#   [06] Receive - **Amount 미입력 상태** QR 송금받기 → **송금 완주**
#        (계좌만 세팅한 QR → 스캔 → 금액은 비어 있음 → 직접 입력 → 확인 → PIN → 성공 → 영수증)
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\08_MyQR_old.yaml"
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 ----------------
- launchApp
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|button1"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "input_dot_1|bottom_item_home"
          timeout: 60000
# PIN <정상 PIN> — 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수(오입력 누적 = 계정 잠금)
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        # ⚠️ 인앱 배너 닫기 id는 **빌드마다 다르다**(2026-08-27 실측):
        #   7.19.x = `btnTwo` / **7.20.0 = `btnClose`**(+ `btnDontShowToday` "오늘 하루 보지 않기").
        #   Maestro id는 정규식이라 둘을 함께 받는다. 배너가 홈 요소를 덮어
        #   `btnTransfer` assert가 실패하는 사고가 있었다.
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "balloonClose"
    commands:
      - tapOn:
          id: "balloonClose"
      - waitForAnimationToEnd

# ---------------- My QR 진입 ----------------
# 잔액 카드는 홈 최상단 → 스크롤 위치와 무관하게 올려서 잡는다
- scrollUntilVisible:
    element:
      id: "qrScan"
    direction: UP
    timeout: 20000
    visibilityPercentage: 20
- tapOn:
    id: "qrScan"
- waitForAnimationToEnd
# 카드가 QR 페이지로 바뀌면 하단 버튼 라벨이 "지금 송금하기"/"받기"로 바뀐다
- extendedWaitUntil:
    visible:
      id: "txvDepositOrViewStatement"
    timeout: 15000
- assertVisible: "${RECEIVE}"
- tapOn:
    id: "txvDepositOrViewStatement"
- extendedWaitUntil:
    visible:
      id: "qrimage"
    timeout: 20000
- assertVisible: "${SCR_MY_QR}"
- assertVisible:
    id: "customername"
- assertVisible:
    id: "accountinfo"
- assertVisible:
    id: "enteramount"
- assertVisible:
    id: "download"
- assertVisible:
    id: "share"
- assertVisible:
    id: "scanqr"
- takeScreenshot: "[00]_내QR_진입"

# ----------------------------------------------------------------
# [01] [Low] Receive - QR코드 공유동작 확인
# ----------------------------------------------------------------
# 공유 시트 → Teams → "basshu" 검색 → **본인 채팅으로 전송**까지 완주한다.
#   ※ 수신자 "Basshu(이승수)"는 **이 계정 본인**이다(basshul@gmeremit.com).
#     타인에게 나가는 발송이 아니라 자기 자신에게 보내는 것이라 반복 실행해도 안전하다.
#     (2026-08-19 한 번 '외부 발송'으로 잘못 보고 시트 확인까지만 줄였다가 되돌린 케이스다)
#   ※ Teams는 좌표가 아니라 **앱 이름 텍스트**로 탭한다 — 설치 앱 구성에 따라 아이콘 위치가 바뀐다.
#   ※ Teams 내부 문구는 앱 언어가 아니라 **기기 언어**를 따른다.
#   ※ Teams 콜드스타트가 느려 waitForAnimationToEnd로는 부족 → 로딩을 명시적으로 대기한다.
# ⚠️ **Teams를 먼저 강제 종료해야 수신자를 고를 수 있다 (2026-08-19 실측)**
#   Teams가 살아 있으면 공유 시 **직전 수신자가 이미 선택된 작성 화면**으로 열린다
#   (`share_detail`에 "In App Message" 같은 **그룹**이 박힌 상태, 검색창 없음).
#   그 화면에서는 수신자를 바꿀 수단이 없다 — 수신자명을 탭해도 반응 없고,
#   `navigationBack`은 Teams를 그냥 빠져나온다.
#   → 공유 전에 Teams를 죽이면 항상 **수신자 선택 화면**(검색창 + 목록)으로 열린다.
- stopApp:
    appId: "com.microsoft.teams"
- tapOn:
    id: "share"
- extendedWaitUntil:
    visible:
      id: "sem_resolver_recyclerview"
    timeout: 20000
- takeScreenshot: "[01]_QR공유_시트"
# ⚠️⚠️ **"Teams"라는 이름이 시트에 두 종류로 존재한다 — 잘못 누르면 그룹 채팅으로 보낸다**
#   ① 시트 최상단 **직접공유(바로가기) 아이콘**: 특정 채팅으로 바로 보내는 항목이고
#      각 아이콘에 **content-desc "Teams" 배지**가 붙어 있다(예: "In App Message",
#      "Basshu's question" ← **둘 다 그룹 채팅**이다).
#   ② 그 아래 **전체 앱 목록의 Teams 앱**(text "Teams") ← 이걸 눌러야 수신자 선택 화면이 열린다.
#   `scrollUntilVisible`/`tapOn`의 텍스트 매칭은 content-desc도 잡으므로, 스크롤 없이 그냥
#   `tapOn: "Teams"` 하면 **①의 배지에 먼저 걸려 그룹 채팅 작성 화면으로 들어간다**
#   (2026-08-19 실제로 "In App Message" 그룹이 수신자로 박힌 화면이 떴다).
#   → **시트를 먼저 펼쳐 직접공유 행을 화면 밖으로 밀어낸 뒤** 앱 목록의 Teams를 누른다.
- repeat:
    times: 3
    commands:
      - swipe:
          start: "50%, 88%"
          end: "50%, 38%"
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Teams"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 20
- tapOn: "Teams"
- waitForAnimationToEnd
# Teams 공유 화면 = `ShareToSkypeTeamsActivity`
#   `share_search_bar`+`editTextView`("채팅 및 채널 검색") / `people_picker_list`(최근 채팅 목록)
#   / 우상단 `action_bar_send_share`("메시지 보내기")
#   ⚠️ "메시지 보내기"는 **항상 보인다** — 그것만 기다리면 수신자를 안 고른 채로 눌러버린다.
#     반드시 검색해서 수신자를 먼저 선택해야 한다.
#
# 🎯 **개인(basshu 본인)에게만 보낸다 — 그룹 채팅에 보내지 않는다 (2026-08-19 사용자 지시)**
#   "basshu"로 검색하면 결과에 **개인과 그룹이 섞여 나온다**:
#     · 개인 → id **`userName`**("Basshu(이승수)") + `people_picker_title`("나") + `user_avatar`
#     · 그룹 → id **`team_or_channel_name`** + `chat_detail`("채팅: Santosh, Adhikari" 처럼 참가자 나열)
#            예: "Basshu's question", "이승수(Basshu)" ← 이름만 보면 개인처럼 보이지만 **그룹이다**
#   → **텍스트로 탭하지 말고 `userName` id로 탭한다.** 텍스트 매칭은 그룹 이름과 헷갈릴 수 있다.
- extendedWaitUntil:
    visible:
      id: "editTextView"
    timeout: 40000
- tapOn:
    id: "editTextView"
- inputText: "basshu"
# 개인 항목이 뜰 때까지 대기(검색 결과 로딩이 수 초 걸린다)
- extendedWaitUntil:
    visible:
      id: "userName"
    timeout: 30000
- assertVisible: "Basshu\\(이승수\\)"
- tapOn:
    id: "userName"
- waitForAnimationToEnd
- tapOn:
    id: "action_bar_send_share"
- waitForAnimationToEnd
# 전송 후 앱으로 복귀한다(내 QR 화면)
- extendedWaitUntil:
    visible:
      id: "qrimage"
    timeout: 40000
- assertVisible: "${SCR_MY_QR}"
- takeScreenshot: "[01]_QR공유_전송후_내QR복귀"

# ----------------------------------------------------------------
# [02] [Medium] Receive - 받는 계좌 변경 동작 확인 (Default: GME Wallet)
# ----------------------------------------------------------------
# 기본값은 GME Wallet. 다른 계좌로 바꿨다가 다시 GME Wallet으로 원복한다(멱등 유지).
# ⚠️ **연동 계좌 목록은 계정 상태에 따라 바뀐다.** 종전에 쓰던 **`케이뱅크`가 사라졌고**
#   (2026-08-28 실측: GME Wallet / 신한은행 / 카카오뱅크 3개) 그 탓에 [02]에서 실행이 멈췄다.
#   `카카오뱅크`는 [05][06]의 실송금 조합이라 건드리지 않고 **`신한은행`** 을 쓴다.
#   여기서 다시 깨지면 목록부터 덤프로 확인할 것 — 앱 버그가 아니라 계정 연동 상태 변화다.
- assertVisible: ".*GME Wallet.*"
- tapOn:
    id: "accountinfo"
- extendedWaitUntil:
    visible:
      id: "rvKftcList"
    timeout: 20000
- assertVisible: "${RECEIVING_ACCOUNT}"
# ⚠️ **여기는 일부러 하드코딩을 유지한다.** `카카오뱅크`는 [05][06]의 실송금 조합이라
#   동적 선택으로 집히면 그 분리가 깨진다(`14_01 [25]`와 상황이 다르다).
#   대신 **전제를 명시적으로 단언**한다 — 이 줄이 없으면 목록이 바뀌었을 때
#   아래 tapOn이 `Element not found`로 죽어 셀렉터 버그처럼 오진하게 된다.
- assertVisible: "${BANK_022}"
- tapOn: "${BANK_022}"
- extendedWaitUntil:
