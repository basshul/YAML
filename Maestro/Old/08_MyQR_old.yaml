# ================================================================
# 2026-08-19에는 `btn_ok2`를 누르면 "실패 - (06640154622502) / Failed"만 떴다
# (livetest KFTC 서버 연결 불가 — 환경 이슈였고 앱 결함이 아니었다).
# 복구 후 실측하니 **정상 송금된다** → 완주 구간을 붙였다.
#
# 💰 실제로 1원이 GME Wallet → 카카오뱅크로 나간다. **본인 계좌 간 이동이라 손실이 아니다**
#   (사용자 승인: "1원 송금도 내 계좌안에서 이동을 하는거라 실제로 송금이 되도 상관없어").
#   금액은 **1원으로 유지할 것**(2026-08-20 사용자 지시 — 어제 1,000원으로 올렸던 것을 되돌렸다).
#
# 이 구간이 덮는 ClickUp 케이스 — QR이 **카카오뱅크(=Wallet 아님) + 금액 1원**이므로:
#   `z8nfn6ma5r` Receive - **Amount 입력 상태** QR 송금받기          → complete (2026-08-20)
#   `z8nfn6ma5u` Receive - **받는계좌 변경 후** QR 송금받기 (Wallet → 카카오뱅크) → complete
#   `z8nfn6ma5y` Sending - **Wallet 아닌 다른계좌** QR스캔 후 송금    → complete
#   ※ `z8nfn6ma5t`(Amount **미입력** 상태)는 **[06]이 담당한다**(2026-08-20 추가).
- tapOn:
