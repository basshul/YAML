# ----------------------------------------------------------------
# 저장 후 갤러리가 열리는 기기도 있고 토스트만 뜨는 기기도 있어 복귀를 조건부로 처리한다
# (Note 9는 토스트만 뜬다 — 무조건 back×2를 하면 홈까지 나가버린다).
