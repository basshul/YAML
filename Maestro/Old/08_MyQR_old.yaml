- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
# 결과 바텀시트 — 서버 응답을 기다려야 하므로 넉넉히 잡는다
- extendedWaitUntil:
    visible:
      id: "txvDialogTitle"
    timeout: 60000
- assertVisible: "${LOGIN_SUCCESS}"
- assertVisible: ".*successfully send 1 KRW.*"
- takeScreenshot: "[05-3]_송금성공"
# ⚠️ 이 시트는 **id와 라벨이 어긋난다**(2026-08-20 실측):
#   `contactSupport` = "확인" / **`btnOk` = "영수증 보기"**. 이름만 보고 고르면 반대로 누른다.
