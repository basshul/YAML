      - tapOn:
          point: "50%, 20%"
      - extendedWaitUntil:
          visible:
            id: "qrimage"
          timeout: 20000
- assertVisible: "${MYQR_ENTER_AMOUNT}"
- takeScreenshot: "[06-1]_내QR_금액미입력_카카오뱅크"

