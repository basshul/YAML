# ----------------------------------------------------------------
# [06] [High] Receive - **Amount 미입력 상태** QR 송금받기 동작 확인
# CLICKUP: z8nfn6ma5t
# ----------------------------------------------------------------
# [05]와의 차이는 **금액을 넣지 않은 QR**을 쓴다는 것 하나다.
#   [05] QR에 금액이 담겨 있다 → 국내송금 화면에 금액까지 자동 채워진다
#   [06] QR에 금액이 없다     → **계좌·은행만 채워지고 금액은 비어 있다** → 송금자가 직접 넣는다
# 받는 계좌는 [05]와 같이 카카오뱅크로 둔다(송금이 실제로 성공하는 조합).
#
# 2026-08-20 실측 — 금액 미입력 QR을 스캔한 국내송금 화면:
#   `recipientAccountNoFormInputField` > "3333276033972"  ← 자동입력
#   `recipientBankSelectionFormInputField` > "카카오뱅크"   ← 자동입력
#   `amount` 텍스트 = **"금액"**(플레이스홀더 = 비어 있다는 뜻)
#   ⚠️ **`btn_ok2`("계속")는 금액이 비어 있어도 트리에 존재한다.**
#     `uiautomator dump`에는 안 잡혀서 "없다"고 판단했다가 `assertNotVisible`이 실패했다
#     (2026-08-20) — 덤프는 **화면에 보이는 범위**만 담고 maestro는 **계층 전체**를 보기 때문이다.
#     → "금액이 비어 있음"은 `amount`의 플레이스홀더("금액")로만 판정한다.
#       [[feedback_maestro_text_vs_id]]와 같은 부류의 함정이다.
#
# 💰 [05]와 마찬가지로 실제 1원이 나간다(본인 계좌 간 이동).

# ---- 홈으로 정규화한 뒤 My QR 재진입 ----
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible:
              id: "bottom_item_home"
          commands:
            - pressKey: back
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
# 잔액 카드는 홈 최상단이다 → 올려서 잡는다
- scrollUntilVisible:
    element:
      id: "qrScan"
    direction: UP
    timeout: 20000
    visibilityPercentage: 20
- tapOn:
    id: "qrScan"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txvDepositOrViewStatement"
    timeout: 15000
- assertVisible: "${RECEIVE}"
- tapOn:
    id: "txvDepositOrViewStatement"
- extendedWaitUntil:
    visible:
