
appId: ${APP_ID}
---
# ⚠️ 2026-09-14: 진입 가드를 **id 로 바꿨다.** 종전 한국어 문구 대안 매칭
#   (`"4자리 숫자를 입력하세요|홈으로"`)은 **en 실행에서 진입부터 막았다**(영문 UI 는
#   `Enter the 4-digit number`/`Home`). 이 가드가 26개 파일 55곳에 있었다.
#   id 는 언어에 흔들리지 않는다: 잠금화면·PIN 생성=`input_dot_1` / 홈=`bottom_item_home`
#   / Server Override=`button1`.
# ================================================================
# 03 국내 송금 테스트
# 실행:
#   .\run_test.ps1 -lang ko -flow 03_Domestic.yaml
#
# 사전 조건:
#   간편비밀번호 설정 상태 (PIN: <정상 PIN>)
#
# 처리 항목:
#   [Wallet]
#   [01] Wallet → KFTC 은행계좌 송금
#          ├ 계좌번호 입력 시 은행 리스트 노출 확인
#          └ 간편비밀번호 오류/정상 + similar 에러 시 금액 변경 재시도
#   [02] Wallet → 다른 월렛 송금
#          ├ 동일 월렛 계좌 송금 불가 확인
#          ├ 계속 버튼 활성/비활성 확인
#          └ 간편비밀번호 일치 시 송금 성공 + 영수증 다운로드 확인
#   [03] Wallet → 타인 은행계좌 송금
#          ├ 계좌번호 입력 시 은행 리스트 노출 확인
#          └ 수수료 부과 확인
#   [04] Wallet → 내 은행계좌 송금 (TODO)
#   [KFTC]
#   [05] KFTC → 타인 Wallet 송금 불가 동작 확인
#   [06] KFTC → My Wallet OTP 불일치 시 송금불가 확인
# ================================================================

# 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 (구 UI 표준 블록)
# ⚠️ 종전 블록은 개편UI 기준이라 **구 UI에서 첫 스텝부터 죽었다**(2026-08-27 실측):
#   ① `Server Override` 스플래시 처리가 없어 launchApp 직후 그 화면에 멈춘다.
#   ② 가드가 `notVisible: text "Home"`인데 구 UI 홈엔 "Home" 텍스트가 **없다** →
#      항상 참이 되어 PIN 블록에 진입하고, 스플래시엔 키패드가 없어 `tapOn "1"`이 실패했다.
#   ③ 범용 `tapOn: "닫기"`는 엉뚱한 X를 눌러 앱을 런처로 내보낸 사고 이력이 있다 → 제거.
#   → 잠금화면(`input_dot_1`)을 **명시적으로 기다린 뒤** PIN을 넣고, 홈 판정은 `bottom_item_home`으로 한다.
- launchApp
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|button1"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "input_dot_1|bottom_item_home"
          timeout: 60000
# PIN <정상 PIN> — 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수(오입력 누적 = 계정 잠금)
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
# 인앱 배너는 범용 "닫기"가 아니라 id로만 닫는다
- runFlow:
    when:
      visible:
        # ⚠️ 인앱 배너 닫기 id는 **빌드마다 다르다**(2026-08-27 실측):
        #   7.19.x = `btnTwo` / **7.20.0 = `btnClose`**(+ `btnDontShowToday` "오늘 하루 보지 않기").
        #   Maestro id는 정규식이라 둘을 함께 받는다. 배너가 홈 요소를 덮어
        #   `btnTransfer` assert가 실패하는 사고가 있었다.
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
# ⚠️ 세션 만료를 **홈 대기보다 먼저** 판정한다.
#   2026-09-01 실제 사례: 세션이 만료됐는데 이 가드가 없어서 아래 홈 대기가 30초 타임아웃으로
#   죽었고, 원인을 알려면 디버그 스크린샷을 열어야 했다("bottom_item_home is visible" 실패로만 보인다).
#   PIN은 정상 입력됐는데도(dot 4개 채워짐) 서버가 거부한 것이라 **PIN 문제로 오진하기 쉽다.**
#   ⛔ 이 팝업을 닫고 진행하지 말 것 — 구 UI는 PIN으로 복구되지 않는다.
#      `01_01_Login_Success_old.yaml`로 재로그인해야 한다.
- assertNotVisible: '로그인 세션이 만료[\s\S]*'
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# ----------------------------------------------------------------
# [01] Wallet → KFTC 은행계좌 송금
# ----------------------------------------------------------------
# ⚠️ 구 UI 홈 그리드 라벨은 **"국내 송금"(공백 있음)** 이다(2026-08-27 홈 덤프 실측).
#   Maestro 텍스트는 전체매칭이라 "국내송금"으로는 잡히지 않는다
#   (14_Deposit의 "GMEPay 가상 계좌" vs "GME Pay 가상 계좌"와 같은 유형).
- tapOn: "${SCR_DOMESTIC_REMIT}"
- tapOn: "${MYQR_CONTINUE}"
# 계좌번호 입력 → 은행 리스트 노출 확인
- tapOn: "${REG_ACCOUNT_NUMBER}"
- inputText: "3333276033972"
- hideKeyboard
- assertVisible:
    text: "${KFTC_BANK_CHIP}"
# 카카오뱅크 선택
- tapOn: "${KFTC_BANK_CHIP}"
# 금액 1 입력
- tapOn: "${AMOUNT}"
- inputText: "2"
- hideKeyboard
- tapOn: "${MYQR_CONTINUE}"
- tapOn: "${BTN_CONFIRM}"
# 간편비밀번호 오류 → 정상 입력
# PIN 화면 도달을 먼저 확정한다 — 안 기다리면 같은 글자를 가진 다른 요소를 집는다
- extendedWaitUntil:
    visible:
      id: "input_dot_1"
    timeout: 20000
- tapOn: "2"
- tapOn: "3"
- tapOn: "2"
- tapOn: "3"
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
# similar 에러 발생 시 금액 2원으로 변경 후 재시도
- runFlow:
    when:
      visible: "Similar transaction found. Please perform the transaction after 1 minutes."
    commands:
      - tapOn: "${BTN_CONFIRM}"
      - tapOn: "${AMOUNT}"
      - eraseText: 20
      - inputText: "2"
      - hideKeyboard
      - tapOn: "${MYQR_CONTINUE}"
      - tapOn: "${BTN_CONFIRM}"
      # PIN 화면 도달을 먼저 확정한다 — 안 기다리면 같은 글자를 가진 다른 요소를 집는다
      - extendedWaitUntil:
          visible:
            id: "input_dot_1"
          timeout: 20000
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
- extendedWaitUntil:
    visible:
      text: "${MYQR_VIEW_RECEIPT}"
    timeout: 15000
- tapOn: "${MYQR_VIEW_RECEIPT}"
- pressKey: "back"
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 10000

# ----------------------------------------------------------------
# [02] Wallet → 다른 월렛 송금
# ----------------------------------------------------------------
# ⚠️ 구 UI 홈 그리드 라벨은 **"국내 송금"(공백 있음)** 이다(2026-08-27 홈 덤프 실측).
#   Maestro 텍스트는 전체매칭이라 "국내송금"으로는 잡히지 않는다
#   (14_Deposit의 "GMEPay 가상 계좌" vs "GME Pay 가상 계좌"와 같은 유형).
- tapOn: "${SCR_DOMESTIC_REMIT}"
- tapOn: "${MYQR_CONTINUE}"
# LEE SEUNGSOO 선택 → 동일 계좌 에러 확인
- tapOn: "LEE SEUNGSOO"
- assertVisible:
    text: "${ACCOUNT_NUMBER_SAME_ERROR}"
# PARK DOYOUNG 선택
- tapOn: "PARK DOYOUNG"
# 금액 입력 전 계속 버튼 비활성화 확인
# 2026-08-10 실기기 확인: "계속" 버튼 id = btn_ok2, 금액 미입력 시 enabled=false.
# text 셀렉터는 활성/비활성 구분을 못 하므로 id + enabled 로 검증할 것.
- assertVisible:
    id: "btn_ok2"
    enabled: false
# 금액 1 입력 → 계속 버튼 활성화 확인
- tapOn: "${AMOUNT}"
- inputText: "2"
- hideKeyboard
- assertVisible:
    id: "btn_ok2"
    enabled: true
- tapOn: "${MYQR_CONTINUE}"
- tapOn: "${BTN_CONFIRM}"
# 간편비밀번호 입력 → 송금 성공
# PIN 화면 도달을 먼저 확정한다 — 안 기다리면 같은 글자를 가진 다른 요소를 집는다
- extendedWaitUntil:
    visible:
      id: "input_dot_1"
    timeout: 20000
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
# similar 에러 발생 시 금액 2원으로 변경 후 재시도
- runFlow:
    when:
      visible: "Similar transaction found. Please perform the transaction after 1 minutes."
    commands:
      - tapOn: "${BTN_CONFIRM}"
      - tapOn: "${AMOUNT}"
      - eraseText: 20
      - inputText: "1"
      - hideKeyboard
      - tapOn: "${MYQR_CONTINUE}"
      - tapOn: "${BTN_CONFIRM}"
      # PIN 화면 도달을 먼저 확정한다 — 안 기다리면 같은 글자를 가진 다른 요소를 집는다
      - extendedWaitUntil:
          visible:
            id: "input_dot_1"
          timeout: 20000
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "1"
      - tapOn: "2"
- extendedWaitUntil:
    visible:
      text: "${MYQR_VIEW_RECEIPT}"
    timeout: 15000
- tapOn: "${MYQR_VIEW_RECEIPT}"
- waitForAnimationToEnd
# 영수증 다운로드 버튼 탭 → PDF 생성 후 "연결 프로그램" 앱 선택 다이얼로그 노출 확인
- tapOn:
    id: "btn_download"
- waitForAnimationToEnd
- assertVisible:
    text: "연결 프로그램"
- pressKey: back
- pressKey: back
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back

# ----------------------------------------------------------------
# [03] Wallet → 타인 은행계좌 송금
# ----------------------------------------------------------------
# ⚠️ 구 UI 홈 그리드 라벨은 **"국내 송금"(공백 있음)** 이다(2026-08-27 홈 덤프 실측).
#   Maestro 텍스트는 전체매칭이라 "국내송금"으로는 잡히지 않는다
#   (14_Deposit의 "GMEPay 가상 계좌" vs "GME Pay 가상 계좌"와 같은 유형).
- tapOn: "${SCR_DOMESTIC_REMIT}"
- tapOn: "${MYQR_CONTINUE}"
# 계좌번호 입력 → 은행 리스트 노출 확인
- tapOn: "${REG_ACCOUNT_NUMBER}"
- inputText: "64700065401013"
- hideKeyboard
- assertVisible:
    text: "${BANK_002_SHORTNAME}"
# 신한은행 선택
- tapOn: "${BANK_002_SHORTNAME}"
# 금액 1 입력
- tapOn: "${AMOUNT}"
- inputText: "3"
- hideKeyboard
- tapOn: "${MYQR_CONTINUE}"
# 수취인 세부 정보 확인 바텀시트에서 수수료 노출 확인
# 2026-08-10 실기기 확인(실측값: 금액 3 KRW / 송금 수수료 1,000 KRW / 총액 1,003 KRW):
#   - 라벨 실제 텍스트는 "송금 수수료:"(콜론 포함). Maestro text 셀렉터는 전체매칭이라
#     기존 "송금 수수료"로는 실패했음 → 라벨은 id transfer_fee_txt 로 검증.
#   - "총액"은 콜론이 없어 text 그대로 매칭됨.
#   - 수수료가 실제로 부과되는지(0원이 아닌지)는 id+text 동시지정으로 금액 형식 검증.
#     이 시트에서는 id+text 동시지정이 정상 동작함(실측).
- assertVisible:
    id: "transfer_fee_txt"
- assertVisible:
    id: "transferfee"
    text: "[1-9][0-9,]* KRW"
- assertVisible:
    text: "${TOTAL_AMOUNT}"
- assertVisible:
    id: "totalamount"
    text: "[1-9][0-9,]* KRW"
- tapOn: "${BTN_CONFIRM}"
# 간편비밀번호 입력 → 송금 성공
# PIN 화면 도달을 먼저 확정한다 — 안 기다리면 같은 글자를 가진 다른 요소를 집는다
- extendedWaitUntil:
    visible:
      id: "input_dot_1"
    timeout: 20000
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
- extendedWaitUntil:
    visible:
      text: "${MYQR_VIEW_RECEIPT}"
    timeout: 15000
- tapOn: "${BTN_CONFIRM}"
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back

# ----------------------------------------------------------------
# [04] Wallet → 내 은행계좌 송금
# ----------------------------------------------------------------
# ⚠️ 구 UI 홈 그리드 라벨은 **"국내 송금"(공백 있음)** 이다(2026-08-27 홈 덤프 실측).
#   Maestro 텍스트는 전체매칭이라 "국내송금"으로는 잡히지 않는다
#   (14_Deposit의 "GMEPay 가상 계좌" vs "GME Pay 가상 계좌"와 같은 유형).
- tapOn: "${SCR_DOMESTIC_REMIT}"
- tapOn: "${MYQR_CONTINUE}"
- tapOn:
    id: "iv_hideShowMyAccounts"
# 카카오뱅크 선택
- tapOn: "${KFTC_BANK}"
# 금액 1 입력
- tapOn: "${AMOUNT}"
- inputText: "2"
- hideKeyboard
- tapOn: "${MYQR_CONTINUE}"
- tapOn: "${BTN_CONFIRM}"
# 간편 비밀번호 입력
# PIN 화면 도달을 먼저 확정한다 — 안 기다리면 같은 글자를 가진 다른 요소를 집는다
- extendedWaitUntil:
    visible:
      id: "input_dot_1"
    timeout: 20000
- tapOn: "1"
- tapOn: "2"
- tapOn: "1"
- tapOn: "2"
- extendedWaitUntil:
    visible:
      text: "${MYQR_VIEW_RECEIPT}"
    timeout: 15000
- tapOn: "${BTN_CONFIRM}"
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back

# ----------------------------------------------------------------
# [05] KFTC → 타인 Wallet 송금 불가 동작 확인
# ----------------------------------------------------------------
# ⚠️ 구 UI 홈 그리드 라벨은 **"국내 송금"(공백 있음)** 이다(2026-08-27 홈 덤프 실측).
#   Maestro 텍스트는 전체매칭이라 "국내송금"으로는 잡히지 않는다
#   (14_Deposit의 "GMEPay 가상 계좌" vs "GME Pay 가상 계좌"와 같은 유형).
- tapOn: "${SCR_DOMESTIC_REMIT}"
- extendedWaitUntil:
    visible:
      text: "${SCR_SELECT_WITHDRAW}"
    timeout: 10000
- tapOn: ".*${KFTC_BANK}.*"
- tapOn: "${MYQR_CONTINUE}"
# PARK DOYOUNG 선택 및 금액 입력
- tapOn: "PARK DOYOUNG"
- tapOn: "${AMOUNT}"
- inputText: "1"
- hideKeyboard
- tapOn: "${MYQR_CONTINUE}"
# 계속 탭 직후 실패 팝업 바로 노출 (확인 화면 없음)
- extendedWaitUntil:
    visible:
      text: "You cannot transfer to GME wallet."
    timeout: 10000
- assertVisible:
    text: "You cannot transfer to GME wallet."
- tapOn: "${BTN_CONFIRM}"
- pressKey: back
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back

# ----------------------------------------------------------------
# [06] KFTC → My Wallet OTP 불일치 시 송금불가 확인
# ----------------------------------------------------------------
# ⚠️ 구 UI 홈 그리드 라벨은 **"국내 송금"(공백 있음)** 이다(2026-08-27 홈 덤프 실측).
#   Maestro 텍스트는 전체매칭이라 "국내송금"으로는 잡히지 않는다
#   (14_Deposit의 "GMEPay 가상 계좌" vs "GME Pay 가상 계좌"와 같은 유형).
- tapOn: "${SCR_DOMESTIC_REMIT}"
- extendedWaitUntil:
    visible:
      text: "${SCR_SELECT_WITHDRAW}"
    timeout: 10000
- tapOn: ".*${KFTC_BANK}.*"
- tapOn: "${MYQR_CONTINUE}"
# LEE SEUNGSOO 선택 및 금액 입력
- tapOn: "LEE SEUNGSOO"
- tapOn: "${AMOUNT}"
- inputText: "1"
- hideKeyboard
- tapOn: "${MYQR_CONTINUE}"
# 수취인 세부 정보 확인 바텀시트
- tapOn: "${BTN_CONFIRM}"
# OTP 전송 안내 팝업 닫기
- tapOn: "OK"
# "1"을 4번 탭 — retryTapIfNoChange:false 로 각 탭 후 settle 대기 제거
- tapOn:
    text: "1"
    retryTapIfNoChange: false
- tapOn:
    text: "1"
    retryTapIfNoChange: false
- tapOn:
    text: "1"
    retryTapIfNoChange: false
- tapOn:
    text: "1"
    retryTapIfNoChange: false
- tapOn: "${TRANSKEY_INPUT_COMPLETE}"
# OTP 불일치 → 에러 팝업 "실패 - 비밀번호 확인 중 오류가 발생했습니다." 확인
- extendedWaitUntil:
    visible:
      text: "${CONTACT_SUPPORT_TEXT}"
    timeout: 10000
- takeScreenshot: otp_fail_confirmed
- tapOn: "OK"
- runFlow:
    when:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - pressKey: back
