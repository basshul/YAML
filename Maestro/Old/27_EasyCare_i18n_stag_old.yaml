appId: com.gmeremit.online.gmeremittance_native.stag
---
# ================================================================
# 시나리오: EasyCare "Check my coverage" 바텀시트 — 24개 언어 UI 깨짐 검증 (구 UI / stag)
# ================================================================
#  목적: **번역 정확성이 아니라 레이아웃 깨짐 검증.**
#    언어에 따라 Activation date / Monthly fee payment 버튼 라벨이 길어지면서
#    잘림(ellipsis) · 줄넘침 · 버튼 밖 오버플로우가 생기는지 본다.
#    → 판정은 언어별 스크린샷 육안 비교로 한다(Maestro가 레이아웃 깨짐을 assert할 수는 없다).
#
#  경로: 홈 → Card → EasyCare Apply → EasyCare Benefits [See more]
#        → [Check coverage start date] → "Check my coverage" 바텀시트 → Activation date 버튼
#
#  산출물: shots_easycare_i18n/NN_<언어>.png  (24장)
#
# ⚠️ **stag 전용.** EasyCare는 stag 7.20.0에만 있다.
#   livetest 7.19.1 APK에는 easycare_* 리소스가 0건이다(2026-08-20 aapt2 확인).
#
# ⚠️ **화면 문구가 APK에 없다.** "Check my coverage" 등은 Lokalise OTA로 런타임에 내려온다.
#   그래서 기대 문자열을 APK에서 뽑아 assert하는 기존 방식은 이 화면에 쓸 수 없다.
#   판정 근거는 스크린샷이며, id 기반 셀렉터로 "도달했다"는 것만 assert한다.
#
# ⚠️ **언어를 바꾸면 앱이 통째로 재시작된다**(SplashScreen + Server Override).
#   그래서 헬퍼 두 개가 각각 맨 앞에 재시작 복구 블록을 갖는다.
#
# ⚠️ **중단되면 앱이 외국어 상태로 남는다.** 다른 yaml은 한국어 문자열을 쓰므로 곧바로 깨진다.
#   이 파일은 마지막에 한국어로 복귀한다. 중간 실패 시 수동으로 설정 → 언어 → 한국어로 되돌릴 것.
#
# ⚠️ 실행 시간이 길다(언어당 재시작 + 5단계 내비게이션 × 24회).
#
# 실행 (기기 2대 연결 시 -device 필수):
#   .\run_test.ps1 -lang ko -flow "Old\27_EasyCare_i18n_stag_old.yaml"
  # ※ 시리얼을 적지 말 것 — 기기는 교체된다. 1대면 생략(자동 감지), 2대 이상이면 adb devices 로 확인해 넘긴다
# ================================================================

- launchApp
- waitForAnimationToEnd

