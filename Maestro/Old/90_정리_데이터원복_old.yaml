appId: ${APP_ID}
---
# ================================================================
# 시나리오: 정리 — 테스트가 남긴 데이터 원복
# ================================================================
# ⛔ **이 파일은 테스트가 아니다.** 아무것도 검증하지 않고, 앞선 플로우가 남긴
#   데이터를 지운다. 스위트의 **맨 마지막**에 돈다.
#
# ★ 왜 따로 뺐나 (2026-10-28)
#   원복이 케이스 한가운데 붙어 있으면 **판정이 끝난 뒤에도 결과가 안 나온다.**
#   `20_예약 [02]` 는 결제 완료 시점에 이미 합격/불합격이 갈리는데, 그 뒤 주문 취소에
#   7.8분을 더 썼다. 전체 실행 시간은 그대로지만 **결과는 그만큼 빨리 나온다.**
#
# ★ 설계 원칙 — **전부 조건부**
#   원복할 것이 없어도(앞 플로우가 실패해서 못 만들었거나, 이미 정리됐거나)
#   **통과해야 한다.** 그래서 탐색은 `optional: true`, 실행은 `runFlow: when:` 으로만 한다.
#   ⚠️ 단 **시도한 원복이 성립했는지는 반드시 단언한다** — 안 그러면 취소가 실패해도
#     초록불이 뜨고 결제된 주문이 그대로 남는다.
#
# ⛔ 여기로 옮기면 **안 되는** 원복이 있다 — 자격정보다.
#   `04_03` 간편 PIN · `04_04` 로그인 비밀번호 · `21_카드 [12]` 카드 PIN 은
#   바뀐 채로 두면 **뒤따르는 플로우가 전부 로그인에 실패하고, 5회 제한에 걸려 계정이 잠긴다.**
#   그 셋은 지금처럼 자기 파일 안에서 즉시 되돌린다.
#
# ⚠️ 스위트가 중간에 끊기면(USB 분리 등) 이 파일이 안 돌아 **결제된 KTX 표가 남는다.**
#   그때는 단독으로 돌릴 것:
#   .\run_test.ps1 -lang ko -flow "Old\90_정리_데이터원복_old.yaml"

# 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 (구 UI 표준 블록 — docs/ENVIRONMENT.md §7)

- launchApp
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|button1|securityKeyboardEditText"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ LIVETEST 강제 — 판별이 불가능해 항등 시퀀스로 간다. 상세: docs/ENVIRONMENT.md §7.3
      - tapOn:
          text: "${SERVER_PICK}"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행. ⚠️ clearState 금지(선택이 또 초기화된다).
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "input_dot_1|bottom_item_home|securityKeyboardEditText"
          timeout: 60000
# 자동 로그아웃(세션 10분 만료)으로 재인증 화면에 떨어졌으면 비밀번호로 로그인한다
- runFlow: "_relogin_if_autologout_old.yaml"
# PIN <정상 PIN> — 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수(오입력 누적 = 계정 잠금)
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
- runFlow:
    when:
      visible:
        text: "${ASK_ME_LATER_TEXT}"
    commands:
      - tapOn: "${ASK_ME_LATER_TEXT}"
      - waitForAnimationToEnd
# 홈 팝업은 **큐**다(배너·증빙서류 안내 등) → 헬퍼 한 곳에서 처리한다.
- runFlow:
    file: _dismiss_popups_stag_old.yaml
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# ================================================================
# [원복 1] KTX 주문 취소  (출처: 20_예약_기차표결제와이력 [02])
# ================================================================
# 예매일로부터 충분히 먼 날짜로 예약하므로 취소 수수료는 0원이다.
# ⚠️ **목록 맨 위 = 최신 주문 하나만** 본다. 앞서 끊긴 실행이 주문을 여러 건 남겼다면
#   이 파일을 그 수만큼 반복해서 돌려야 한다(한 번에 다 지우지 않는다).

- scrollUntilVisible:
    element:
      text: "${TXT_RESERVATION}"
    direction: DOWN
    speed: 40
    visibilityPercentage: 100
    timeout: 15000
- tapOn: "${TXT_RESERVATION}"
- waitForAnimationToEnd
- assertVisible: "${SCR_TRAIN_TICKET}"
- tapOn: "${VIEW_BOOKING_HISTORY}"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "${KTX_ORDER_LIST}"
    timeout: 15000

# 목록 맨 위(= 최신 주문) 상세로 진입. 좌표 탭이라 **목록이 비어 있어도 실패하지 않는다**
#   → 상세로 갔는지 여부는 아래 탐색 결과로 판정한다.
# ⚠️ 린터 W11(좌표 탭인데 단언이 없다)은 여기서 **일부러** 남겨 둔다 — 단언하면
#   "취소할 주문이 없다"는 정상 상황에서 이 파일이 실패한다. 대신 **넘어간 이유를
#   스크린샷으로 남긴다.** 해상도가 바뀌어 좌표가 빗나가도 화면 모습은 똑같아서,
#   증적이 없으면 결제된 표가 조용히 남는다.
- tapOn:
    point: "89%,29%"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        text: "${KTX_ORDER_DETAIL}"
    commands:
      - takeScreenshot: "[원복1]_주문상세_진입못함"

# 취소할 수 있는 주문인가? `주문 취소하기` 를 찾아본다.
#   못 찾으면 — 주문이 없거나, 이미 취소됐거나, 상세로 들어가지 못한 것이다 → 건너뛴다.
#   `optional: true` 라 못 찾아도 플로우가 죽지 않는다(이 파일의 설계 원칙).
- scrollUntilVisible:
    element:
      text: "${KTX_CANCEL_SECTION}"
    direction: DOWN
    speed: 40
    visibilityPercentage: 100
    timeout: 15000
    optional: true
# 건너뛸 때는 **건너뛴 이유를 단언한다.** 안 그러면 스크롤이 실패했을 때도 조용히 통과해
#   결제된 표가 남는다(이 파일이 전부 조건부인 탓에 생기는 유일한 구멍이다).
# ⚠️ 상세 화면에 **있을 때만** 따진다 — 주문이 하나도 없는 계정이면 상세로 못 가고, 그건 정상이다.
# ⚠️ 스크린샷은 증적이 못 된다 — 이 WebView 는 **새까맣게 찍힌다**(2026-10-28 실측).
#   그래서 판정을 단언으로 세우고, 스크린샷은 참고로만 남긴다.
- runFlow:
    when:
      visible:
        text: "${KTX_ORDER_DETAIL}"
      notVisible:
        text: "${KTX_CANCEL_SECTION}"
    commands:
      - takeScreenshot: "[원복1]_취소할주문없음"
      - assertVisible: "${KTX_ORDER_STATUS_CANCELLED}"
- runFlow:
    when:
      visible:
        text: "${KTX_CANCEL_SECTION}"
    commands:

      - tapOn: "${KTX_CANCEL_SECTION}"
      # 취소 수수료 계산은 파트너사 API 호출 후 노출되며, 이 WebView 콘텐츠는
      # Maestro의 접근성 트리 기반 assertVisible/extendedWaitUntil로는 안정적으로
      # 감지되지 않아(실제로는 렌더링되어 있어도 계속 not visible로 판정됨),
      # 픽셀 비교 기반의 waitForAnimationToEnd로 대체 (충분히 긴 timeout 부여)
      - waitForAnimationToEnd:
          timeout: 30000
      # ★ 2026-09-22 원인 규명: 종전 주석의 "제출 버튼 bounds 가 항상 height=0 이라 텍스트로 못 누른다"는
      #   **좌표 탭이 스스로 만든 결과**였다. `swipe` 뒤 `point: 540,1652` 가 누른 건 제출 버튼이 아니라
      #   바로 위의 **`Train cancellation rules` 아코디언**이고, 그게 펼쳐지면서 약관 수십 줄이 끼어들어
      #   제출 버튼이 렌더 영역 밖(`[147,2196][933,2196]`)으로 밀린 것이다. 그 상태를 보고 "height=0" 이라
      #   적었고, 그래서 계속 좌표로 우회하는 악순환이었다.
      #   → 좌표를 버린다. 아코디언을 펼친 직후 제출 버튼은 `[147,1778][933,1898]` 로 **화면 안에 있다.**
      # ko 는 헤더와 제출 문구가 같아(둘 다 `주문 취소하기`) index 로 특정해야 한다. en 도 헤더/제출을
      #   둘 다 받는 값(`Cancel Order|CANCEL ORDER`)으로 둬서 **양쪽 다 index 1 = 제출**이 되게 맞췄다.
      # ⚠️ 2026-09-22 실측: **취소가 1회차에 실패하는 경우가 있다.** 브라우저 alert 로
      #   `주문 취소가 실패했습니다`(★en UI 에서도 한국어 그대로 — 파트너사 i18n 결함)가 뜨고,
      #   닫고 같은 자리를 다시 누르니 2회차에 성공했다. 같은 날 다른 시도는 1회차에 성공했으니
      #   **재현이 일정하지 않다**(서버 쪽으로 보인다). 실패한 채 두면 **결제된 주문이 그대로 남으므로**
      #   `16_ATM출금_신청` 의 취소와 같이 최대 3회 반복한다.
      - repeat:
          times: 3
          while:
            notVisible:
              text: "${KTX_CANCEL_DONE}"
          commands:
            # 앞 회차 실패 alert 이 떠 있으면 먼저 닫는다
            - runFlow:
                when:
                  visible:
                    text: "${KTX_CANCEL_FAIL}"
                commands:
                  - tapOn: "${BTN_CONFIRM}"
                  - waitForAnimationToEnd
            # ⚠️ 아코디언을 펼쳐도 제출 버튼은 **화면 아래에 남아 있다.** 그때 bounds 가
            #   `[147,2196][933,2196]` (= 화면 하단으로 clamp 된 height 0)로 잡히고,
            #   탭은 `COMPLETED` 인데 **아무 일도 일어나지 않는다**(높이 0 노드 탭 함정).
            #   → 반드시 먼저 스크롤해 실제로 보이게 만든다.
            #   index 는 "그 순간 화면 맨 위의 매칭 요소"라 스크롤 위치에 흔들린다 → `centerElement` 로
            #   위치를 고정한다. 여기 index 가 가리키는 건 행 목록이 아니라 **한 페이지에 둘뿐인
            #   헤더/제출 버튼**이라 회차가 바뀌어도 대상이 흔들리지 않는다.
            - scrollUntilVisible:
                centerElement: true
                direction: DOWN
                speed: 40
                visibilityPercentage: 100
                timeout: 20000
                element:
                  text: "${KTX_CANCEL_SUBMIT}"
                  index: 1
            - tapOn:
                text: "${KTX_CANCEL_SUBMIT}"
                index: 1
            - waitForAnimationToEnd:
                timeout: 20000
            # ⛔ 루프 안에서 `extendedWaitUntil`/`assertVisible` 을 쓰면 **실패한 순간 플로우가 죽어**
            #   재시도가 무산된다(2026-09-22 실제로 이 구조로 1회차에서 멈췄다) → 조건부로만 처리하고,
            #   성립 여부는 루프를 빠져나온 뒤 한 번 단언한다.
            - runFlow:
                when:
                  visible:
                    text: "${KTX_CANCEL_CONFIRM_MSG}"
                commands:
                  - tapOn: "${BTN_CONFIRM}"
                  - waitForAnimationToEnd:
                      timeout: 30000
      # 루프를 빠져나온 이유가 **성공**인지 단언한다 — 3회 소진으로 빠져나와도 통과하면 거짓 통과다
      - assertVisible: "${KTX_CANCEL_DONE}"
      - tapOn: "${BTN_CONFIRM}"

# 홈 복귀 (WebView 자체 종료 후 앱 재시작으로 확실하게 복귀)
# ⚠️ **재시작하면 Server Override 스플래시가 다시 뜬다** — 이걸 처리하지 않고 바로 PIN을
#   누르려다 `Element not found: 1`로 실패했다(2026-08-28, 예약·취소는 이미 성공한 뒤였다).
#   진입부와 **같은 구조**로 맞춘다: 스플래시 → LIVETEST 강제 → PIN → 팝업 큐 → 홈.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "input_dot_1|bottom_item_home|button1|securityKeyboardEditText"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      - tapOn:
          text: "${SERVER_PICK}"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "input_dot_1|bottom_item_home|securityKeyboardEditText"
          timeout: 60000
# 자동 로그아웃(세션 10분 만료)으로 재인증 화면에 떨어졌으면 비밀번호로 로그인한다
- runFlow: "_relogin_if_autologout_old.yaml"
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - runFlow:
          file: _enter_pin_old.yaml
          env:
            PIN: ${PIN_NORMAL}
- runFlow:
    file: _dismiss_popups_stag_old.yaml
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000
