      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
      # ⚠️ 맹목적 팝업 닫기 — 상세 사유는 07_TodaysRate_old.yaml 의 같은 블록 주석 참고.
      #   요약: 런처 이탈 사고 이력이 있으나, id로 안 닫히는 팝업이 남아 진입이 막힐 수 있어
      #   지우지 않고 **이미 홈에 도달했으면 누르지 않도록** 가드만 좁혔다.
      #   ※ 이 파일의 PIN 재설정 [X] 탭(756·768행 부근)은 성격이 다르다 — 의도적으로 누르고
      #     바로 결과를 단언하므로 맹목적 닫기가 아니다.
      notVisible:
        id: "btnTransfer"
    commands:
      - tapOn: "닫기"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 30000

