# ----------------------------------------------------------------
# ⚠️ 이 케이스는 세션을 실제로 끊는다. 반드시 **맨 마지막**에 두고,
#   뒤에 PIN <정상 PIN> 재로그인 복구 블록을 붙여 다음 실행에 영향이 없게 한다.
# 로그아웃 후 도착지는 로그인 폼이 아니라 **잠금화면(ActivityLockScreen)**이고,
# 거기서 "아이디/비밀번호로 로그인"(loginpwidhidpass)을 누르면
# "기존 간편 비밀번호는 해지됩니다" 경고가 뜬다 → 여기서는 누르지 않는다.
# ※ 앞 케이스에서 조건부 back 반복으로 복귀한 직후에는 드로어가 바로 열리지 않는 경우가 있어
#   (2026-08-12 실측: iv_nav 탭은 COMPLETED인데 "로그아웃"을 못 찾음)
#   드로어 전용 요소가 보일 때까지 대기하고, 안 열렸으면 한 번 더 연다.
