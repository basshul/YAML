      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "4자리 숫자를 입력하세요"
    timeout: 30000
- assertVisible:
    id: "loginpwidhidpass"

# 복구: PIN <정상 PIN> 재로그인 → 홈
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "보이스 피싱 주의"
