# ----------------------------------------------------------------
# ⓘ ClickUp 케이스명은 "Settings - Terms - 이용약관 정상 노출 확인"이지만,
#   구 UI에서 이용약관은 **설정이 아니라 드로어**에 있어 이 케이스가 담당한다(2026-08-20 대조).
# ※ "이용약관" 단독은 드로어 메뉴명과 부분매칭되므로 목록 항목
#   "전자금융거래 이용약관"으로 식별한다.
