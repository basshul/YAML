- tapOn:
    id: "view_marketing"
- extendedWaitUntil:
    visible:
      id: "btn_diaog_ok"
    timeout: 20000
- assertVisible: "'마케팅 푸시 알림 수신 동의'가 활성화되었습니다."
- tapOn:
    id: "btn_diaog_ok"
- waitForAnimationToEnd
- assertVisible:
    id: "view_marketing"
