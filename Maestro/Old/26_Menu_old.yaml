appId: ${APP_ID}
---
# ================================================================
# 시나리오: MENU (드로어 메뉴) — 구 UI
# ================================================================
#  진행: EXIT=0, 198스텝, 20케이스(진입 9 + 내부 동작 11). 2026-08-13 기준 전 케이스 PASS.
#
#  ⓘ 케이스 아래의 `# CLICKUP: <케이스ID>` 주석은 데일리 리포트(run_report_old.ps1)가 읽어
#    해당 ClickUp 케이스 태스크를 complete로 갱신하는 근거다.
#    **실기기에서 PASS를 확인한 케이스에만 달 것.** 달아두면 매일 자동으로 상태가 맞춰지고,
#    없는 케이스는 스크립트가 건드리지 않는다.
# 2026-08-12 작성. 대상 화면 = HomeActivityV2의 좌상단 드로어(DrawerLayout `drawer_home`).
#
# 실행 전 확인 — 이 액티비티가 아니면 이 파일을 돌리지 말 것:
#   adb shell dumpsys window | Select-String mCurrentFocus
#     → ...homeV2.view.HomeActivityV2
#
# 구 UI에서는 지점·GME 소개·개인정보 처리 방침·로그아웃 등이 **프로필 탭이 아니라 드로어**에 있다.
# (개편 UI는 프로필 탭 경로였고, 구 UI 프로필 탭에는 로그아웃이 아예 없다 — 2026-08-11 실측)
# 그래서 이 파일이 드로어 메뉴의 담당 파일이다.
#
# 2026-08-13: `04_Menu_remaining_old`를 폐기하고 **유효 케이스 11건을 이 파일로 흡수**했다.
#   진입([01]~[09]) + 각 화면의 **내부 동작**([NN-n] 하위 케이스)을 한 파일에서 다룬다.
#   흡수 내역 — 은행 계좌 연결 1건([01-1]) / 지점 4건([03-1]~[03-4])
#              / GME 소개 1건([04-1]) / 설정 5건([08-1]~[08-5])
#   버린 6건 — 계좌 연결 penny test·OTP([18][19]) 및 Face ID·셀피([23][24])는 자동화 불가,
#             인바운드 계좌 삭제([20])·KFTC 계좌 삭제([22])는 대상 계좌가 이미 삭제돼 재실행 불가.
#   ※ 거래 내역 하위는 여전히 `04_Menu_History_old`가 담당한다.
#
# 흡수 케이스의 element id는 전부 **구 UI에서 재실측**했다(2026-08-13). 개편 UI 기준으로 적혀 있던
# 좌표 탭 2건은 모두 제거했다 — 설정 진입 기어(92%,6%)는 구 UI에서 드로어 경로라 불필요해졌고,
# 지점 주소 복사(36%,35%)는 `branch_address`가 통짜 clickable TextView라 **id 탭으로 대체**된다.
#
# 드로어 여닫기 규칙 (2026-08-11 실측):
#   - 열기: `iv_nav` 탭
#   - 드로어가 열려도 홈 노드가 계층에 함께 남으므로, 열림 판별은 드로어 전용 요소로 해야 한다
#     (`txt_user_email` 등)
#   - 닫기: back은 액티비티까지 전파돼 "앱을 종료하시겠습니까?"가 뜨고, 좌측 스와이프도 안 먹는다.
#     화면 우측 끝 요소(`bottom_item_profile`)를 탭해 스크림을 건드리면 닫힌다.
#   - 메뉴 항목을 탭하면 드로어는 자동으로 닫히므로, 각 케이스는 드로어를 다시 열고 시작한다.
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\26_Menu_old.yaml"
#
# 계정 유형(국적) 무관 — 이 파일에는 **외국인 계정으로만 확인 가능한 항목이 없다**(2026-08-12 사용자 확인).
#   드로어 메뉴 9종은 계정 유형에 상관없이 동일하게 노출되므로 한 계정으로 검증하면 충분하다.
#   (09_Home_old는 국적에 따라 홈 구성이 갈려 외국인 계정 확인이 별도로 필요하다 — 그쪽 헤더 참고)
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 ----------------
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "4자리 숫자를 입력하세요"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "보이스 피싱 주의"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "나중에 하기"
    commands:
      - tapOn: "나중에 하기"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "닫기"
      # ⚠️ 맹목적 팝업 닫기 — 상세 사유는 07_TodaysRate_old.yaml 의 같은 블록 주석 참고.
      #   요약: 런처 이탈 사고 이력이 있으나, id로 안 닫히는 팝업이 남아 진입이 막힐 수 있어
      #   지우지 않고 **이미 홈에 도달했으면 누르지 않도록** 가드만 좁혔다.
      #   ※ 이 파일의 PIN 재설정 [X] 탭(756·768행 부근)은 성격이 다르다 — 의도적으로 누르고
      #     바로 결과를 단언하므로 맹목적 닫기가 아니다.
      notVisible:
        id: "btnTransfer"
    commands:
      - tapOn: "닫기"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 30000

# ----------------------------------------------------------------
# [01] [High] 드로어 → 은행 계좌 연결 → 은행 계좌 연결 관리 화면 이동 확인
# ----------------------------------------------------------------
# AutoDebitAccountScreen — 연결된 KFTC 계좌 목록
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "txt_user_email"
    commands:
      - tapOn:
          id: "iv_nav"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txt_user_email"
    timeout: 15000
- tapOn: "은행 계좌 연결"
- extendedWaitUntil:
    visible:
      text: "은행 계좌 연결 관리"
    timeout: 20000
- assertVisible:
    text: "기본 계좌"

# ----------------------------------------------------------------
# [01-1] [Low] 은행 계좌 연결 → [?](csButton) → 고객센터 팝업 발생 확인
# CLICKUP: z8nfn6ma2h
# ----------------------------------------------------------------
# 팝업 구성(2026-08-13 구 UI 실측): chatView("실시간 채팅" + 운영 상태),
#   SNS 3종(Facebook/WhatsApp/Instagram), callTxtView(대표번호), btnCancel("취소")
# ※ 대표번호가 1811-2961 → **1811-2904로 변경**됐다. 번호 문자열을 하드코딩하지 않고
#   id(callTxtView) 노출만 검증한다.
- tapOn:
    id: "csButton"
- extendedWaitUntil:
    visible:
      id: "chatView"
    timeout: 15000
- assertVisible: "실시간 채팅"
- assertVisible:
    id: "callTxtView"
- tapOn:
    id: "btnCancel"
- extendedWaitUntil:
    visible:
      id: "csButton"
    timeout: 15000
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "btnTransfer"

# ----------------------------------------------------------------
# [02] [High] 드로어 → 거래 내역 → 내역 화면 이동 확인
# ----------------------------------------------------------------
# ⚠️ "거래 내역"은 **화면에 두 개 있다**(2026-08-12 실측).
#   - 하단 내비 라벨: id `navigation_bar_item_small_label_view`, bounds [263,2034][383,2077]
#   - 드로어 항목:   id 없음,                                   bounds [216,815][886,861]
#   드로어가 열려도 홈 노드가 계층에 남기 때문에 `tapOn: "거래 내역"`만 쓰면 하단 내비 라벨이
#   잡힐 수 있고, 그걸 탭하면 스크림에 닿아 **드로어만 닫히고 이동은 안 된다**(실제로 그렇게 실패했음).
#   드로어 항목은 id가 없으므로 "하단 내비보다 위"라는 위치 관계로 한정한다(좌표 없이 id 기준).
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "txt_user_email"
    commands:
      - tapOn:
          id: "iv_nav"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txt_user_email"
    timeout: 15000
- tapOn:
    text: "거래 내역"
    above:
      id: "bottom_item_home"
- extendedWaitUntil:
    visible:
      id: "rvMainHistory"
    timeout: 20000
- assertVisible:
    text: "사용 내역"
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "btnTransfer"

# ----------------------------------------------------------------
# [03] [Low] 드로어 → 지점 → 지점 목록 화면 이동 확인
# ----------------------------------------------------------------
# ※ 목적지 식별에 "지점"을 쓰면 드로어 메뉴명과 부분매칭되므로,
#   지점 카드 안의 주소 언어변환 버튼 "한국어 주소"로 식별한다.
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "txt_user_email"
    commands:
      - tapOn:
          id: "iv_nav"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "txt_user_email"
    timeout: 15000
- tapOn: "지점"
- extendedWaitUntil:
    visible:
      text: "한국어 주소"
    timeout: 20000
- assertVisible:
    id: "agentListRv"

# ----------------------------------------------------------------
# [03-1] [Low] 지점 → 주소 복사 → "복사 완료" 토스트
# CLICKUP: z8nfn6ma2q
# ----------------------------------------------------------------
# 지점 카드는 목록(agentListRv)이라 같은 id가 여러 개다 → **index: 0**(첫 지점=안산)으로 한정한다.
# ※ 개편 UI에서는 "복사"가 주소 TextView 안의 span이라 좌표(36%,35%)를 썼지만,
#   구 UI는 `branch_address` 뷰 자체가 clickable이라 **id 탭으로 복사가 동작한다**(2026-08-13 실측).
# ※ 토스트는 uiautomator 덤프에는 안 잡히지만 Maestro는 본다. ~2초면 사라지므로
#   탭과 assert 사이에 **대기를 넣지 말 것**.
- tapOn:
    id: "branch_address"
    index: 0
- assertVisible: ".*복사.*완료.*"

# ----------------------------------------------------------------
# [03-2] [Low] 지점 → 주소 한/영 변환 (한국어 주소 ↔ English Address)
# CLICKUP: z8nfn6ma2r
# ----------------------------------------------------------------
- tapOn:
    id: "language_select"
    index: 0
- extendedWaitUntil:
    visible:
      text: "English Address"
    timeout: 10000
- tapOn:
    id: "language_select"
    index: 0
- extendedWaitUntil:
    visible:
      text: "한국어 주소"
    timeout: 10000

# ----------------------------------------------------------------
# [03-3] [Low] 지점 → 영업시간 펼침/접기
# CLICKUP: z8nfn6ma2t
# ----------------------------------------------------------------
# ⚠️ `tv_time`은 **요약 줄과 펼쳐진 요일별 줄이 같은 id를 공유**한다(2026-08-13 실측).
#   펼친 뒤에는 tv_time이 8개가 되므로 반드시 index: 0(요약 줄)을 탭해야 접힌다.
- tapOn:
    id: "tv_time"
    index: 0
- extendedWaitUntil:
    visible:
      text: "10:00 ~ 19:00"
    timeout: 10000
- tapOn:
    id: "tv_time"
    index: 0
- waitForAnimationToEnd
- assertNotVisible:
    text: "10:00 ~ 19:00"

# ----------------------------------------------------------------
# [03-4] [Low] 지점 → 지도 선택 → 외부 지도 앱 진입
# CLICKUP: z8nfn6ma2u
# ----------------------------------------------------------------
# 지도 앱은 별도 태스크로 뜨고 back은 GME가 아니라 런처로 간다
# → 복귀는 launchApp + PIN 재진입으로 처리한다(원본 04_Menu_remaining_old와 동일한 방식).
# 외부 앱 화면은 appId 스코프 밖이라 내용을 읽을 수 없으므로 **지점 목록 이탈**로 판정한다.
- tapOn:
    id: "google_map_link"
    index: 0
- extendedWaitUntil:
    notVisible:
      id: "agentListRv"
    timeout: 20000

# --- 지도 앱 → GME 복귀(재실행 + PIN) ---
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "4자리 숫자를 입력하세요"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "보이스 피싱 주의"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "나중에 하기"
    commands:
      - tapOn: "나중에 하기"
      - waitForAnimationToEnd
# 재실행 시 지점 화면이 복원될 수 있으므로 홈까지 back으로 정리한다.
# ⚠️ "앱을 종료하시겠습니까?" 처리는 반드시 `btnTransfer 미노출` 가드 **바깥**에 둘 것.
#   안쪽에 두면 홈에서 back → 다이얼로그 → back → 다이얼로그가 무한 반복된다(2026-08-12 사고).
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            notVisible:
              id: "btnTransfer"
          commands:
            - runFlow:
                when:
                  visible: "앱을 종료하시겠습니까?"
                commands:
                  - tapOn: "아니요"
                  - waitForAnimationToEnd
            - runFlow:
                when:
                  notVisible:
                    id: "btnTransfer"
                commands:
                  - pressKey: back
                  - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "btnTransfer"
    timeout: 30000

# ----------------------------------------------------------------
# [04] [Low] 드로어 → GME 소개 → 앱 버전/업데이트 확인 노출
# CLICKUP: z8nfn6ma2v
# ----------------------------------------------------------------
- tapOn:
    id: "iv_nav"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
