- assertVisible: "'마케팅 푸시 알림 수신 동의'가 비활성화되었습니다."
- tapOn:
    id: "btn_diaog_ok"
- waitForAnimationToEnd
- assertVisible:
    id: "view_marketing"
    checked: false
