#   등록 상한(5건)에 걸리면 숨는 것으로 보이나 상한값은 미확인이다.
#   → 하드 단언하면 계정 상태에 따라 무조건 FAIL 이므로 **있을 때만 확인**한다.
#     계좌를 하나 지우면 다시 노출되는지 확인할 것(그때 이 주석을 갱신).
