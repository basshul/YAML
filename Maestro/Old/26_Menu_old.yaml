#   (2026-08-13 실측: view_marketing이 y=1234에서 잘리고 view_language·view_referral_code·
#    delete_gme_account는 아예 안 나옴 → 복귀 판정이 실패한다).
#   화면은 SettingsView가 맞으므로 **키보드를 먼저 닫고** 판정할 것.
#   ⛔ 다만 `hideKeyboard` 를 **무조건 부르면 안 된다** — 키보드가 없을 때는 **뒤로가기로 동작**해
#     설정 화면을 빠져나간다(2026-09-08 SM-S911N 실측: 홈까지 밀려나 복귀 판정이 실패했다).
