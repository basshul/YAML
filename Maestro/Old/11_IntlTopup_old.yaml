appId: ${APP_ID}
---
# ================================================================
# 시나리오: International Topup (국제 선불폰 충전) — 구 UI
# ================================================================
#  진행: 2026-08-25 구 UI 기준 재작성. (원본 개편UI판 백업: `.bak_20260825`)
#
# 실행 전 확인 — 이 액티비티가 아니면 이 파일을 돌리지 말 것:
#   adb shell dumpsys window | Select-String mCurrentFocus
#     → ...homeV2.view.HomeActivityV2
#
# 실행:
#   .\run_test.ps1 -lang ko -flow "Old\11_IntlTopup_old.yaml"
#
# 결제정보(지정): Sri Lanka / +94 0776348242 / Dialog / 50 LKR (≈ 761 KRW)
#
# ★ 제약(사용자 지정):
#   - 실제 결제 발생 기능 → [09]는 **"간편 비밀번호 입력 화면"까지만**(PIN 미입력).
#   - KFTC 결제(은행계좌: 카카오/신한/케이뱅크) + 생체인증 경로는 BLOCKED.
#     → 본 파일은 GME Wallet(간편비밀번호) 경로만 다룸.
#   ⏸ 실제 결제 완주 자동화는 **나중에 별도 작업**(사용자 지시 2026-08-25).
#
# ---------------------------------------------------------------
# 개편UI → 구 UI 전환에서 바뀐 것 (2026-08-25 실측)
# ---------------------------------------------------------------
#   진입 그리드 항목  "모바일 충전" → **"모바일 충전 및 청구서 결제"**
#                     구 UI는 충전과 청구서 결제가 **한 항목으로 합쳐져 있다**.
#                     라벨이 2줄로 소프트랩되므로 `.*모바일 충전.*` 정규식으로 탭한다.
#   2단              **경로 구조는 개편UI와 같다.** 개편UI도 "모바일 충전" → "해외 충전 서비스"
#                     2단이었고 그 2단이 허브 `MobileTopUpAndBillPaymentActivity`다.
#                     달라진 건 1단 라벨과, 허브에 청구서 결제까지 들어왔다는 것뿐이다.
#                     "해외 충전 서비스"는 텍스트 대신 id **`international_topUp`** 으로 탭한다.
#                     ⚠️ 10·11·12 세 파일이 모두 이 허브를 통과한다([[project_10_domestictopup]]).
#   홈 판정          `text: "홈"` → id **`bottom_item_home`**
#                     (`btnTransfer`는 홈이 스크롤 위치를 유지해 화면 밖일 수 있다)
#   충전 화면 자체    바뀐 것이 없다. `select_county_btn` / `phone_number_input_field` /
#                     `searchEditText` / `select_carrier_btn` / `select_product_btn` /
#                     `input_dot_1` 전부 개편UI와 동일 → [01]~[09] 본문은 그대로 둔다.
#   이탈             없음 → **`bottom_item_home`이 보일 때까지 back 반복** + 거래 취소 확인
#                     다이얼로그(`btn_yes` "예") 처리. back 1탭으로 나간다고 가정하지 않는다.
#
# 화면/id:
#   진입화면: `select_county_btn`(국가) / `phone_number_input_field`(번호) /
#            `account_root`·"GME Wallet"(출금계좌, **잔액 비동기 로딩**) / `btn_next` "계속"
#   국가리스트: `searchEditText`(검색) → "Sri Lanka"
#   page_two: `select_carrier_btn`(통신사) / `select_product_btn`(상품) / "총 지급액"(원화)
#   결제확인 바텀시트("충전 결제"): `continueBtn` "GME Wallet로 결제"
#   간편비번: `ActivityLockScreen` (`input_dot_1`~`input_dot_4`)
#   거래 취소 확인 다이얼로그: `textView10`("Are you sure want to cancel your transaction?")
#     / `btn_no`("아니요") / `btn_yes`("예")
# ★ 잔액 로딩 전엔 "계속" 비활성 → `extendedWaitUntil enabled:true` 로 대기.
#
# ⚠️ **잔액 부족 시 이 플로우는 [05]/[09]에서 막힌다** (2026-08-25 확인 필요 사항).
#   2026-08-25 기준 GME Wallet 잔액이 **230원**으로 상품가(≈761원)에 못 미친다.
#   "계속"이 활성화되지 않으면 `extendedWaitUntil enabled:true`가 타임아웃으로 죽는다.
#   → 회귀 실행 전에 잔액을 확인할 것([[project_10_domestictopup]]의 잔액 주의 참고).
# ================================================================

# ---------------- 공통 진입: 앱 실행 → PIN <정상 PIN> → 홈 ----------------
- launchApp
- extendedWaitUntil:
    visible:
      text: "Server Override|4자리 숫자를 입력하세요|홈으로"
    timeout: 60000
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **서버는 LIVETEST를 코드로 강제한다** (2026-08-27 사고 후 확정).
      #   ① 선택값은 **앱 데이터에 저장**되고 `clearState`가 이를 **빌드 기본값으로 초기화**한다
      #      (stag 빌드 기본값 = STAG). 그래서 수동으로 골라둬도 유지되지 않는다.
      #   ② 실제 사고: 스위트가 gmeuat(STAG)로 돌았다 — logcat 1,113건 / livetest 0건.
      #   ③ 항목을 탭해 **선택이 바뀌면** 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고
      #      **앱이 종료된다**. 두 버튼 모두 resource-id는 `button1`이다.
      #   ④ Maestro는 `checked:` 셀렉터를 **무시한다**(실측) → "이미 LIVETEST인지" 판별이 불가능하다.
      #      그래서 판별하지 않고 **항등 시퀀스**로 간다: 탭 → button1 → 재실행 → button1.
      #      이미 LIVETEST였다면 첫 button1이 CONTINUE라 그냥 닫히고, 재실행 후 한 번 더 닫는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행한다.
      # ⚠️ 여기서 clearState를 쓰면 방금 저장한 선택이 **또 초기화**된다 → 절대 쓰지 말 것.
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            text: "4자리 숫자를 입력하세요|홈으로"
          timeout: 60000
# PIN <정상 PIN> — 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수(오입력 누적 = 계정 잠금)
- runFlow:
    when:
      visible:
        text: "${PIN_ENTER_4DIGIT}"
    commands:
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
      - tapOn: "1"
      - waitForAnimationToEnd
      - tapOn: "2"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "${REG_VOICE_PHISHING}"
    commands:
      - tapOn:
          id: "check_customer"
      - waitForAnimationToEnd
      - tapOn: "확인|OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "나중에 하기"
    commands:
      - tapOn: "나중에 하기"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "balloonClose"
    commands:
      - tapOn:
          id: "balloonClose"
      - waitForAnimationToEnd
# 인앱 배너 팝업은 id로 정확히 닫는다(범용 "닫기" 문자열 탭은 다른 X를 눌러 사고 이력이 있다)
- runFlow:
    when:
      visible:
        # ⚠️ 인앱 배너 닫기 id는 **빌드마다 다르다**(2026-08-27 실측):
        #   7.19.x = `btnTwo` / **7.20.0 = `btnClose`**(+ `btnDontShowToday` "오늘 하루 보지 않기").
        #   Maestro id는 정규식이라 둘을 함께 받는다. 배너가 홈 요소를 덮어
        #   `btnTransfer` assert가 실패하는 사고가 있었다.
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000

# ---------------- 진입: 홈 그리드 → 허브 → 해외 충전 서비스 ----------------
# 홈 서비스 그리드는 비동기 로딩이다 → scrollUntilVisible로 항목이 실제로 그려질 때까지 기다린다.
- scrollUntilVisible:
    element:
      text: ".*모바일 충전.*"
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 20
- tapOn:
    text: ".*모바일 충전.*"
- extendedWaitUntil:
    visible:
      id: "international_topUp"
    timeout: 30000
- tapOn:
    id: "international_topUp"
- extendedWaitUntil:
    visible:
      id: "select_county_btn"
    timeout: 30000
- takeScreenshot: "shots_11_intltopup_old/00_진입"

# ----------------------------------------------------------------
# [01] Select Country - 나라 리스트 노출 및 선택 (Sri Lanka)
#   * 검색어와 목록항목이 같으면 검색창이 탭되는 함정 → 부분검색("Sri")으로 회피
# ----------------------------------------------------------------
- tapOn:
    id: "select_county_btn"
- extendedWaitUntil:
    visible:
      id: "searchEditText"
    timeout: 15000
- takeScreenshot: "shots_11_intltopup_old/01_국가리스트"
- tapOn:
    id: "searchEditText"
- inputText: "Sri"
- extendedWaitUntil:
    visible:
      text: "Sri Lanka"
    timeout: 10000
- tapOn: "Sri Lanka"
- extendedWaitUntil:
    visible:
      text: "SRI LANKA"
    timeout: 15000

# ----------------------------------------------------------------
# [04] 잘못된 번호 입력 → 인라인 에러 + 계속 비활성
#      ("000" → "6자 이상으로 입력해 주세요", btn_next disabled)
# [02] 올바른 번호 입력 동작 확인 (0776348242 반영)
# ----------------------------------------------------------------
- tapOn:
    id: "phone_number_input_field"
- inputText: "000"
- hideKeyboard
- assertVisible:
    text: "6자 이상으로 입력해 주세요"
- assertVisible:
    text: "${MYQR_CONTINUE}"
    enabled: false
- takeScreenshot: "shots_11_intltopup_old/02_번호오류"
- tapOn:
    id: "phone_number_input_field"
- eraseText
- inputText: "0776348242"
- hideKeyboard
- assertVisible:
    text: "0776348242"

# ----------------------------------------------------------------
# [03] Charging Account - 출금계좌 선택 (GME Wallet = 간편비밀번호 경로)
#   * 카카오/신한/케이뱅크 = KFTC 결제(생체인증) → BLOCKED, 선택하지 않음
# ----------------------------------------------------------------
- tapOn: "GME Wallet"

# ----------------------------------------------------------------
# [05] 올바른 번호 + [Continue] → 상품 선택 페이지 노출
#   (잔액 비동기 로딩 완료 후 "계속" 활성화)
# ----------------------------------------------------------------
- extendedWaitUntil:
    visible:
      text: "${MYQR_CONTINUE}"
      enabled: true
    timeout: 90000
- tapOn:
    text: "${MYQR_CONTINUE}"
    enabled: true
- extendedWaitUntil:
    visible:
      id: "select_carrier_btn"
    timeout: 20000

# ----------------------------------------------------------------
# [06] Carrier - 통신사 리스트 노출 및 선택 (Dialog Sri Lanka)
# ----------------------------------------------------------------
- tapOn:
    id: "select_carrier_btn"
- extendedWaitUntil:
    visible:
      text: "Dialog Sri Lanka"
    timeout: 15000
- takeScreenshot: "shots_11_intltopup_old/03_통신사"
- tapOn: "Dialog Sri Lanka"

# ----------------------------------------------------------------
# [07] Product - 상품 요금제 리스트 노출 및 선택 (50 LKR)
#   * 상품 목록은 클리핑되므로 scrollUntilVisible로 끌어올린다
# ----------------------------------------------------------------
- tapOn:
    id: "select_product_btn"
- extendedWaitUntil:
    visible:
      text: "상품 선택"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "50 LKR"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 40
- takeScreenshot: "shots_11_intltopup_old/04_상품목록"
- tapOn: "50 LKR"

# ----------------------------------------------------------------
# [08] Amount - 상품 금액에 따라 원화(총 지급액) 자동 계산 노출
#   * 원화 총액은 환율따라 변동(761~762 등) → 콤마 없는 정수+KRW로 매칭.
#   ⚠️ 원래는 "잔액은 콤마가 있어(16,500 KRW) 제외된다"는 전제였다. 잔액이 1,000원
#     미만이면(2026-08-25 현재 230원) **잔액도 "230 KRW"로 이 정규식에 걸린다** →
#     그러면 총 지급액이 안 떠도 assert가 통과해 검증이 헐거워진다.
#     그래서 "총 지급액" 라벨 자체를 함께 확인해 최소한 화면 도달은 확정한다.
# ----------------------------------------------------------------
- extendedWaitUntil:
    visible:
      text: "총 지급액"
    timeout: 15000
- assertVisible:
    text: "[0-9]+ KRW"
- takeScreenshot: "shots_11_intltopup_old/05_총지급액"

# ----------------------------------------------------------------
# [09] Wallet Charging - 결제확인 → 간편비밀번호 → **실제 충전 완주** (2026-08-28 확장)
#   ⚠️ **실제 결제가 발생한다** — 스리랑카 Dialog 50 LKR.
#     `20_Booking`과 달리 **취소 절차가 없어** 반복 실행할 때마다 금액이 누적된다.
#     회귀 스위트에 상시 포함할지는 별도 판단할 것.
#   ⚠️ 앱은 **PIN 입력 전까지 잔액을 검증하지 않는다** → 부족하면 PIN까지 진행한 뒤 서버가 거부한다.
#     실행 전 GME Wallet 잔액을 확인할 것(2026-08-28 실행 시점 12,331원).
# ----------------------------------------------------------------
- extendedWaitUntil:
    visible:
      text: "${MYQR_CONTINUE}"
      enabled: true
    timeout: 90000
- tapOn:
    text: "${MYQR_CONTINUE}"
    enabled: true
# 결제확인 바텀시트 → GME Wallet로 결제
- extendedWaitUntil:
    visible:
      text: "GME Wallet로 결제"
    timeout: 20000
- takeScreenshot: "shots_11_intltopup_old/06_결제확인"
- tapOn: "GME Wallet로 결제"
# 간편비밀번호 화면 도달 확인 — **여기서 정지. PIN 입력 안 함.**
- extendedWaitUntil:
    visible:
      id: "input_dot_1"
    timeout: 20000
- takeScreenshot: "shots_11_intltopup_old/07_간편비번화면"

# PIN <정상 PIN> — 키패드는 탭마다 재배치되므로 탭 사이 정착 대기 필수(오입력 누적 = 계정 잠금)
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd
- tapOn: "1"
- waitForAnimationToEnd
- tapOn: "2"
- waitForAnimationToEnd

# 충전 결과 확인 — 성공/실패 어느 쪽이든 응답 화면을 먼저 기다린다.
#   ⚠️ 앱은 PIN 입력 전까지 잔액을 검증하지 않으므로, 잔액이 부족하면 여기서 서버가 거부한다.
- extendedWaitUntil:
    visible:
      text: "충전이 완료|완료되었습니다|성공|오류|실패|Insufficient|insufficient"
    timeout: 120000
- takeScreenshot: "shots_11_intltopup_old/08_충전결과"
# 성공 판정 — 실패 응답이면 여기서 FAIL로 드러난다(조용히 통과하지 않게 한다).
- assertVisible:
    text: ".*(충전이 완료|완료되었습니다|성공).*"

# ================================================================
# 홈 복귀
# ================================================================
# ⚠️ 충전 성공 시 **"성공" 화면이 먼저 뜬다.** 닫지 않으면 아래 back 반복이 막혀 홈까지 못 나온다
#   (2026-08-28 실제 FAILED: 충전은 성공했는데 `bottom_item_home` assert에서 죽었다).
#   ⚠️ **11과 12의 성공 UI 구조가 다르다**:
#     · 여기(11) = 다이얼로그, 확인 버튼 **`btn_diaog_ok`** (앱 오타 `diaog` — `dialog` 아님)
#     · 12       = **바텀시트**, 확인 버튼 **`btnOk`**
#   빌드/화면에 따라 갈릴 수 있으므로 두 id를 함께 받는다.
- runFlow:
    when:
      visible:
        id: "btn_diaog_ok|btnOk"
    commands:
      - tapOn:
          id: "btn_diaog_ok|btnOk"
      - waitForAnimationToEnd
# ⚠️ back 1탭으로 홈까지 나간다고 가정하지 않는다. 또 중간에 거래 취소 확인
#   다이얼로그("Are you sure want to cancel your transaction?")가 뜰 수 있으므로
#   매 회차마다 `btn_yes`("예")를 처리한다.
- repeat:
    times: 6
    while:
      notVisible:
        id: "bottom_item_home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              id: "btn_yes"
          commands:
            - tapOn:
                id: "btn_yes"
            - waitForAnimationToEnd
# 홈 재진입 시 인앱 배너가 다시 뜰 수 있다
- runFlow:
    when:
      visible:
        id: "btnTwo|btnClose"
    commands:
      - tapOn:
          id: "btnTwo|btnClose"
      - waitForAnimationToEnd
# ⚠️ 복귀한 홈은 스크롤 위치를 유지한다 → 홈 도달은 `bottom_item_home`으로 판정하고
#   `btnTransfer`는 UP 스크롤로 끌어올려 확인한다([[project_old_ui_migration]]).
- extendedWaitUntil:
    visible:
      id: "bottom_item_home"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "btnTransfer"
    direction: UP
    timeout: 25000
    visibilityPercentage: 20
- assertVisible:
    id: "btnTransfer"
