appId: ${APP_ID}
---
# 공통 헬퍼: livetest 빌드가 (재)실행 시 띄우는 "Server Override" 서버선택 스플래시 처리.
# 앱이 콜드 재실행되는 모든 지점(launchApp, 언어변경 재시작 등)에서 호출:
#   - runFlow: "_server_override_old.yaml"
# 다이얼로그가 뜨면 CONTINUE(LIVETEST 유지), 안 뜨면 즉시 통과.
# ⚠️ **서버를 명시적으로 고른다.** 종전엔 CONTINUE만 눌러 "기본값 유지"에 기대고 있었는데,
#   기본값은 **빌드와 직전 선택에 따라 달라진다**(2026-08-27 실측):
#   stag 빌드의 다이얼로그에는 STAG / LIVETEST / LIVE 3개가 있고 그날 선택이 저장돼 있었다.
#   저장된 상태에 의존하면 **엉뚱한 서버로 전체 스위트가 돌아갈 수 있다** → 매번 LIVETEST를 찍는다.
#   목록 텍스트는 "LIVETEST    https://livetest.gmeremit.com:8012/api/" 처럼 공백이 여러 개라
#   전체매칭으로는 안 잡힌다 → 정규식 `.*LIVETEST.*`.
- runFlow:
    when:
      visible:
        text: "Server Override"
    commands:
      # ⚠️ **항등 시퀀스**로 처리한다 — 인라인 31곳과 동일 로직.
      #   ① 선택값은 앱 데이터에 저장되고 `clearState`가 **빌드 기본값(stag=STAG)** 으로 초기화한다.
      #   ② 선택을 바꾸면 버튼이 `CONTINUE` → **`APPLY & QUIT`** 으로 바뀌고 **앱이 종료된다**.
      #      두 버튼 모두 id는 `button1`이다. 그래서 `visible: "CONTINUE"` 조건을 걸면
      #      **선택을 바꾼 경우에 아무 버튼도 누르지 못해 다이얼로그가 남는다**(2026-08-27 실제 사고).
      #   ③ Maestro가 `checked:`를 무시해 "이미 LIVETEST인지" 판별이 불가 → 판별하지 않는다.
      - tapOn:
          text: ".*LIVETEST.*"
      - waitForAnimationToEnd
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
      # APPLY & QUIT로 앱이 죽었을 수 있으므로 재실행. ⚠️ clearState 금지(선택이 또 초기화된다).
      - launchApp
      - extendedWaitUntil:
          visible:
            text: "Server Override"
          timeout: 60000
      - tapOn:
          id: "button1"
      - waitForAnimationToEnd
